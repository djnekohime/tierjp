# シリーズ（特集ページ）。Tier表を「テーマごとの連載」としてまとめる。
# 追加手順：下に1件足す → python build.py → /series/<slug>/ ができ、トップと各Tier表からリンクされる
# groups の tiers は content/tiers/ の slug（ファイル名から .yaml を除いたもの）。順番どおりに並ぶ
series:
  - slug: pet-bousai
    name: ペットの防災シリーズ
    emoji: 🎒
    lead: 地震や台風などの災害に備えて、ペットと一緒に避難するために知っておきたいことを、AIが本気でS〜Dに決めたシリーズ。避難グッズ、避難先の選択肢、ふだんから慣らしておきたいこと、家の地震対策、犬猫以外のペットの備えまで。避難所のルールは自治体ごとに違うので、お住まいの地域の情報もあわせて確認してね。環境省の「同行避難」の考え方を前提にしています。
    groups:
      - name: 避難の備え
        emoji: 🧳
        tiers: [pet-bousai-goods, pet-bousai-hinan, pet-bousai-shitsuke, pet-taifu]
      - name: 家の対策
        emoji: 🏠
        tiers: [pet-bousai-sumai]
      - name: 犬猫以外のペット
        emoji: 🐰
        tiers: [pet-bousai-shoudoubutsu]

  - slug: pet-kisetsu
    name: ペットの暑さ・寒さ対策シリーズ
    emoji: 🌡️
    lead: 犬・猫・小動物・鳥・メダカ・金魚の、冬の寒さ対策と夏の暑さ対策をまとめたシリーズ。グッズ選びから、やりがちな失敗、熱中症や低温やけどの危険、留守番の温度管理まで、AIが本気でS〜Dに決めました。危険にかかわるランクは獣医さんの助言ではなく、あくまで目安です。冬が近づく今のうちに、チェックしておいてね。
    groups:
      - name: 冬の寒さ対策（犬猫）
        emoji: ❄️
        tiers: [pet-fuyu-goods, pet-fuyu-kiken, inu-fuyu-sanpo, pet-fuyu-junbi, pet-fuyu-futori, pet-kanso-taisaku]
      - name: 夏の暑さ対策（犬猫）
        emoji: ☀️
        tiers: [pet-natsu-goods, pet-natsu-kiken, pet-natsu-junbi, pet-hanabi-kaminari, inu-umi-kawa]
      - name: 留守番の温度管理
        emoji: 🏠
        tiers: [pet-rusuban-ondo]
      - name: 小動物・鳥
        emoji: 🐰
        tiers: [shoudoubutsu-tori-ondo]
      - name: メダカ・金魚
        emoji: 🐟
        tiers: [medaka-kingyo-essetsu, medaka-kingyo-kosetsu]
      - name: 行事・季節イベント
        emoji: 🎃
        tiers: [pet-halloween-kiken, pet-xmas-kiken, pet-osouji-kiken, pet-nenmatsu-azukeru, pet-oshogatsu-kiken, pet-valentine-kiken, pet-hahanohi-hana, pet-ryokou-yado, pet-aigo-shukan]
      - name: 食欲の秋・肥満対策
        emoji: 🍂
        tiers: [pet-aki-futori]
      - name: 梅雨・夏のごはん
        emoji: ☔
        tiers: [pet-tsuyu-taisaku, pet-shokuchudoku]
      - name: 春の換毛・花粉・新生活
        emoji: 🌸
        tiers: [pet-kemoshi-taisaku, pet-kafun, pet-shinseikatsu, pet-nomidani-taisaku, pet-ohanami, neko-kemoshi]

