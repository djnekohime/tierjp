# 食べ物カテゴリー 完全版ロードマップ（2026-09-30 作成）
# ここに無いものは作らない・ここに有るものは作る前に python scripts/backlog.py で重複チェック。
# 公開済みは content/tiers/ にファイルがあれば自動で「済」になる（ここを手で消さなくてよい）。
#
# kind（Tierの3種類）
#   dish  … 料理・種類そのもの（商品名や商標は避けて「種類」で書く）
#   chain … チェーン店（実在企業。ランク帯は全部ほめ言葉にして、公開情報で調べる）
#   shop  … 地域×実店舗（ラーメン店と同じ作り方。AIは食べていない旨を明記）
# step（作る順番。ChatGPT案の STEP1〜5 に対応）
#   1 = 全国共通の料理Tier／2 = チェーン店Tier／3 = 都道府県・地域の店／4 = 市区町村の店（厚木で実験）

