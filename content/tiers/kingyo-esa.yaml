title: 金魚のえさの種類 Tier表
description: 人工飼料、冷凍赤虫、ゆでたエンドウ豆、水草…金魚のえさを「食いつき・消化のよさ・水の汚れにくさ・あげやすさ」でS〜Dにランク付け。
category: animals
tags: [金魚, 動物, 初心者]
published: 2026-10-03
labels:
  S: 毎日の主食
  A: 安心して使える
  B: ごほうび向き
  C: 少量・要注意
  D: 与えない
criteria: |
  ① 金魚の食いつきと成長への役立ち
  ② 消化のよさ（転覆や消化不良になりにくいか）
  ③ 水の汚れにくさ
  ④ あげやすさ・保存のしやすさ
  ※ 特定の商品ではなく「種類」のランキングです。金魚は、欲しがるだけ食べてしまう魚です。あげすぎは、水の汚れや病気の原因になります
rank_notes:
  S: 毎日の食事の中心
  D: 金魚の体にはおすすめしない
tiers:
  S:
    - name: 金魚用の人工飼料（沈下性）
      short: 沈下性飼料
      emoji: "⬇️"
      reason: 水に沈むタイプは、水面で空気を一緒に飲みこみにくく、消化不良や転覆が起こりにくいと言われる。丸みのある体型の金魚に向く。
    - name: 金魚用の人工飼料（浮上性）
      short: 浮上性飼料
      emoji: "⬆️"
      reason: 食べ残しが見えて、あげすぎを防ぎやすい。水を含ませてからあげると、空気を飲みこみにくくなる。体型や泳ぎのよい金魚に向く。
  A:
    - name: ゆでて皮をむいたエンドウ豆
      short: ゆでエンドウ豆
      emoji: "🫛"
      reason: 消化のよい食べ物として、ときどき金魚に与えられる。皮をむいて、やわらかくゆで、細かくしてあげる。お通じをよくしたいときの、補助にもなる。
    - name: 冷凍赤虫・乾燥赤虫
      short: 赤虫
      emoji: "🪱"
      reason: 食いつきがよく、金魚が大喜びする。栄養を補えるが、あげすぎると水が汚れるので、ごほうび程度にする。
    - name: 水草・コケ
      emoji: "🌿"
      reason: 水槽に生えた水草やコケも、金魚は食べる。自然のえさの補助になるが、水草は食べ尽くされることもある。
  B:
    - name: 小松菜などの葉物野菜
      short: 葉物野菜
      emoji: "🥬"
      reason: ビタミンを補える。やわらかくゆでて、小さくちぎって与える。食べ残しは、すぐに取りのぞく。
    - name: ミジンコ・ブラインシュリンプ
      short: 生き餌
      emoji: "🦐"
      reason: 栄養と、食いつきがよい。稚魚や、体力をつけたいときに役立つ。培養と管理に、手間がかかる。
    - name: 乾燥の動物性たんぱく（エビ・イトメなど）
      short: 乾燥たんぱく
      emoji: "🦐"
      reason: 栄養が高く、食いつきがよい。与えすぎると、水が汚れ、消化にも負担がかかる。
    - name: 金魚用の栄養強化飼料（色揚げ・成長用）
      short: 強化飼料
      emoji: "🌈"
      reason: 色を鮮やかにしたいときや、成長を助けたいときの補助。毎日の主食は、通常の人工飼料で足りる。
    - name: 麩（ふ）
      emoji: "🍘"
      reason: 昔から、金魚に与えられてきたえさ。水に浮くので、食べ残しが見える。栄養は偏るので、主食にはしない。
  C:
    - name: 熱帯魚用・メダカ用のえさ
      short: 他の魚のえさ
      emoji: "🐠"
      reason: 食べるが、金魚の体に合っているとは限らない。金魚用のほうが、栄養や粒の大きさが合っていて安心。
    - name: 冷凍の動物性たんぱくの与えすぎ
      short: たんぱくの与えすぎ
      emoji: "🧊"
      reason: おいしいので、つい多めにあげがち。たんぱく質が多すぎると、消化不良や水の汚れにつながる。
    - name: 人工飼料を空気ごと飲みこませる与え方
      short: 浮上性のあげ方
      emoji: "💨"
      reason: 浮上性のえさを乾いたままあげると、空気を一緒に飲みこむことがある。水を含ませてから、与えるとよい。
  D:
    - name: パン・ごはん・人間のお菓子
      short: 人間の食べもの
      emoji: "🍞"
      reason: 水が一気に汚れて、金魚の消化にも負担になる。かわいくても、人間の食べものはあげない。
    - name: 食べ残しが出るほどのえさやり
      short: あげすぎ
      emoji: "⚠️"
      reason: えさの種類ではなく、量の問題。食べ残しは水を汚し、金魚を弱らせる。数分で食べきれる量を、目安にする。
summary: |
  毎日の主食は、金魚用の人工飼料。沈下性と浮上性のどちらか、あるいは両方を、金魚の体型に合わせて使い分けるのが基本。
  金魚は、欲しがるだけ食べてしまう魚。「少なめに、食べきれる分だけ」が鉄則で、ゆでたエンドウ豆などの消化のよい食べ物を、ときどき取り入れるとよい。
related: [kingyo-shurui, kingyo-shippai, medaka-esa]
