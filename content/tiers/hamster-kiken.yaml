title: ハムスターに危険な食べもの・もの Tier表
description: チョコ、ネギ類、じゃがいもの芽、針葉樹の床材…ハムスターにとって危険になりうる食べもの・ものを危険度でS〜Dにランク付け。
category: animals
tags:
- ハムスター
- 小動物
- 動物
- 初心者
published: '2026-10-06'
labels:
  S: 絶対NG
  A: 要注意
  B: あげないほうがいい
  C: 与え方しだい
  D: おおむね問題なし
criteria: '① 中毒や体調不良につながる危険度

  ② 家庭で口に入る機会の多さ

  ③ 体の小ささによる影響の大きさ

  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。動物の種類・年齢・体質・量で影響は変わります。心配なときは、様子を見すぎず、動物病院に相談してください。ハムスターは体がとても小さいので、少量でも影響が出ることがあります'
rank_notes:
  S: 少量でも命にかかわる可能性
  D: 量や与え方を守ればおおむね問題なし
tiers:
  S:
  - name: チョコレート・ココア
    emoji: 🍫
    reason: 含まれる成分が中毒を起こすことがある。ほんの少しでも危険なので、手からも、おやつにも、与えない。
  - name: 玉ねぎ・ネギ類
    short: ネギ類
    emoji: 🧅
    reason: 赤血球をこわして、貧血などを起こすことがある。加熱した料理のかけらでも危険は消えない。
  - name: アルコール
    emoji: 🍺
    reason: 体が小さいので、ほんの少しでも命にかかわる。お酒を飲む場所に、ケージを置かない。
  - name: コーヒー・紅茶などカフェインを含むもの
    short: カフェイン
    emoji: ☕
    reason: 興奮や、心拍数の増加などを起こすことがある。飲みかけのカップにも注意。
  A:
  - name: じゃがいもの芽・緑色の皮
    short: じゃがいもの芽
    emoji: 🥔
    reason: 芽や緑色の部分には、体によくない成分が多い。皮をむいても、芽の部分は与えない。
  - name: アボカド
    emoji: 🥑
    reason: 小動物では、中毒が心配されている食べ物。安全のため、あげない。
  - name: 生の豆類（インゲン豆など）
    short: 生の豆
    emoji: 🫘
    reason: 生のままだと、体によくない成分を含む豆がある。与えるなら、しっかり加熱してから、ごく少量。
  - name: りんご・桃・さくらんぼなどの種
    short: 果物の種
    emoji: 🍎
    reason: 種には、体によくない成分が含まれる。果物を与えるときは、種と芯を必ず取りのぞく。
  B:
  - name: 人間のお菓子・パン・スナック菓子
    short: 人間のお菓子
    emoji: 🍪
    reason: 砂糖・塩・油が多く、体の小さなハムスターには負担が大きい。糖尿病になりやすい種類もいる。
  - name: 塩分の多い加工食品
    short: 塩分の多い食品
    emoji: 🍜
    reason: ハム、ソーセージ、インスタント食品などは、塩分が多すぎる。分けてあげない。
  - name: 糖分の多い果物・ドライフルーツ
    short: 糖分の多い果物
    emoji: 🍇
    reason: ジャンガリアンなど、糖尿病になりやすい種類は特に注意。あげるなら、ごく少量を、たまに。
  - name: 綿・ふわふわの巣材
    short: 綿の巣材
    emoji: ☁️
    reason: 細い繊維が、手足や頬袋にからまって、ケガや事故につながることがある。紙のチップなど、安全な巣材を選ぶ。
  - name: 針葉樹（杉・松）の床材
    short: 針葉樹の床材
    emoji: 🌲
    reason: 香りの成分が、呼吸器や体に負担になる心配があると言われている。紙製や広葉樹の床材のほうが無難。
  C:
  - name: ひまわりの種などの種子類
    short: ひまわりの種
    emoji: 🌻
    reason: 好物でも、脂肪が多く、太りやすい。ごほうびとして、数粒だけにする。
  - name: 生野菜・果物のあげすぎ
    short: 生野菜・果物
    emoji: 🥬
    reason: 水分が多いものを食べすぎると、下痢をしやすい。少量から様子を見て、食べ残しは早く片づける。
  D:
  - name: ハムスター用のペレット・フード
    short: ハムスター用フード
    emoji: 🥣
    reason: ハムスターの体を考えて作られているので、主食にしやすい。量を守って、毎日新しいものに。
  - name: ゆでたブロッコリー・小松菜などの少量
    short: 少量のゆで野菜
    emoji: 🥦
    reason: やわらかく加熱して、冷まして、ごく少量なら、おやつになる。食べ残しは、早めに取りのぞく。
summary: 'ハムスターは、体がとても小さいので、人にとって少量でも、大きな影響が出ることがある。Sに入れたのは、人間の食卓にふつうにある「チョコ・ネギ類・アルコール・カフェイン」。

  ごはんは、ハムスター用のフードを主食にして、野菜や果物は「ごくごく少量のおやつ」にとどめるのが安全。食べてはいけないものを、頬袋にためこんで、巣に隠してしまうこともあるので、ケージの中はときどき確認して。'
related:
