title: 猫の愛情表現サイン Tier表
description: スローブリンク、頭突き、ふみふみ、お腹を見せる…猫が「好き」を伝えるサインを、愛情の深さと分かりやすさでS〜Dにランク付け。
category: animals
tags: [猫, 動物, あるある]
published: 2026-10-03
labels:
  S: 最大の信頼
  A: かなり好き
  B: 好き
  C: ふつうの愛情
  D: 勘違いしやすい
criteria: |
  ① 信頼や愛情の深さ
  ② サインの分かりやすさ
  ③ 飼い主が気づけるか
  ※ 猫の気持ちは個体差が大きく、ここに書いたのは「よく言われる意味」です。ほかの行動と合わせて見てください
rank_notes:
  S: 「あなたを信頼してる」
  D: 愛情表現のようで、そうでないことも
tiers:
  S:
    - name: ゆっくりまばたき（スローブリンク）
      short: スローブリンク
      emoji: "😌"
      reason: ゆっくり目を閉じて開ける動きは、「敵意はないよ」「安心してる」という合図と言われる。飼い主も同じようにゆっくりまばたきを返すと、気持ちが伝わりやすい。
    - name: 飼い主の近くでぐっすり寝る
      short: 近くで寝る
      emoji: "💤"
      reason: 猫は眠っている間が無防備なので、そばで安心して眠るのは最高の信頼の証。寝ている姿を見られるだけで幸せ。
    - name: お腹を見せる
      emoji: "🐾"
      reason: 急所のお腹を見せるのは、信頼しているサイン。ただし「触って」とは限らず、触ると怒る猫も多い。そっと見るだけにしておくのが安全。
  A:
    - name: しっぽをピンと立てて近づく
      short: しっぽピン
      emoji: "📏"
      reason: しっぽをまっすぐ立てて近づくのは、うれしい気持ちや親愛のサインと言われる。あいさつのように、小走りで来ることもある。
    - name: 頭突き・おでこをこすりつける
      short: 頭突き
      emoji: "💘"
      reason: 自分のにおいをつけて「仲間だよ」と伝えている行動と言われる。ゴツンと来る愛情表現は、たまらなくかわいい。
    - name: ふみふみ
      emoji: "🐱"
      reason: 子猫のころの授乳を思い出す行動で、安心しきっているサイン。飼い主の膝や布団の上でされたら、最高に信頼されている証拠。
    - name: 体をすり寄せる
      short: すりすり
      emoji: "🧶"
      reason: 足元や体にすり寄るのは、においをつけて安心したい気持ちの表れ。立ち止まった飼い主の足にまとわりつくのもよくある。
  B:
    - name: 毛づくろいしてくれる
      short: なめてくれる
      emoji: "👅"
      reason: 親しい相手にだけする、仲間へのグルーミング。ざらざらの舌でなめられるのは、猫からの特別扱い。
    - name: あとをついてくる
      emoji: "🐾"
      reason: 家の中でも、飼い主の姿を追って歩く猫は多い。安心できる存在だと思っているサイン。
    - name: 名前を呼ぶと返事をする
      short: 返事をする
      emoji: "🎤"
      reason: 呼ぶとしっぽを振ったり、短く鳴いたりして答えてくれる。飼い主の声を聞き分けているしるし。
    - name: お尻を向けてくる
      emoji: "🍑"
      reason: 背中を向けるのは、無防備な姿をさらしても大丈夫という信頼のサインと言われる。お尻をぐいっと押しつけてくる猫もいる。
    - name: 獲物（おもちゃ）をプレゼントしてくる
      short: プレゼント
      emoji: "🎁"
      reason: 狩りの成果を飼い主に見せたり、くわえて持ってきたりする。家族の一員として、分け合おうとしている行動と言われる。
  C:
    - name: トイレやお風呂までついてくる
      short: トイレまで来る
      emoji: "🚽"
      reason: 愛情というより、「何をしているか気になる」好奇心の面も大きい。ただ、ついてくる＝安心できる相手と思っている、とも言える。
    - name: ごはん前にすり寄ってくる
      short: ごはん前のすりすり
      emoji: "🍽️"
      reason: 愛情表現とごはんの催促が混ざっている行動。かわいいが、どちらの気持ちなのか、見極めるのが楽しい。
    - name: ひざの上に乗る
      emoji: "🪑"
      reason: 暖かさと安心感を求めている。ひざの上で寝てしまったら、信頼されている証拠。
  D:
    - name: 手をはむはむとかむ
      short: はむはむ
      emoji: "🦷"
      reason: 甘がみは愛情の一種のことも、遊びのつもりのことも、「やめて」のサインのこともある。強くなりそうなら、遊びをやめて距離をおく。
    - name: ゴロゴロ（のどを鳴らす）
      short: ゴロゴロ
      emoji: "🎶"
      reason: リラックスや甘えのサインだが、不安や痛みのときにも鳴らすことがある。ゴロゴロ＝いつも大丈夫、とは限らないので、ほかの様子も見ておく。
summary: |
  猫の愛情表現でいちばん深いのは、「ゆっくりまばたき」と「無防備にそばで眠る」こと。どちらも、猫が敵意なく安心している状態。
  猫は犬のように分かりやすく喜ばない分、小さなサインが宝物。気づけたらこちらもゆっくりまばたきを返して、猫の「好き」に応えてあげたい。
related: [neko-nakigoe, neko-aruaru-kodo, neko-nigate]
