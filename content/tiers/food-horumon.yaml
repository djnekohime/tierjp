title: ホルモンの種類 Tier表
description: シマチョウ、ミノ、ハツ、レバー、コリコリ、テッチャン、ハチノス、ギアラ、マルチョウ、ホルモンミックス…焼肉のホルモンの種類を、AIが「食感×うまみ×ビールとの相性」でランク付け。
category: food
genre: 肉料理
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 食感のおもしろさ

  ② うまみ・香ばしさ

  ③ お酒やご飯との相性

  ※ ホルモンは、中までしっかり火を通して食べるのが基本です

  '
rank_notes:
  S: ホルモンの三大スター
  D: 通好み
tiers:
  S:
  - name: シマチョウ
    emoji: 🥓
    reason: 牛の大腸。脂がのってぷりぷり、噛むほどに甘い。ホルモンの王様。
  - name: マルチョウ
    emoji: ⭕
    reason: 小腸のまるい形。とろっとした脂がたまらない。
  - name: ハツ
    emoji: ❤️
    reason: 心臓。脂が少なくて、コリコリした歯ごたえ。食べやすいホルモン。
  A:
  - name: レバー
    emoji: 🟤
    reason: ごま油と塩で。新鮮なものは、とろっとして甘い。
  - name: ミノ
    emoji: 🧽
    reason: 胃の部分。コリコリ、サクサクの歯ごたえが楽しい。
  - name: テッチャン
    emoji: 🔔
    reason: 大腸の別の名前。コクとうまみが強い。
  - name: ハラミ
    emoji: 🍖
    reason: 横隔膜。ホルモンとしても人気で、やわらかくてジューシー。
  B:
  - name: ギアラ
    emoji: 🥩
    reason: 4番目の胃。脂がのって、ほどよくやわらかい。
  - name: コリコリ
    emoji: 🦴
    reason: 大動脈の部分。名前のとおり、コリコリの食感。
  - name: ハチノス
    emoji: 🐝
    reason: 蜂の巣のような形の胃。煮込みで人気。
  - name: ホルモンミックス
    emoji: 🍽️
    reason: いろんなホルモンが少しずつ。初めてなら、これで試すのがおすすめ。
  C:
  - name: センマイ
    emoji: 📚
    reason: ひだひだの胃。さっぱりした食感で、ポン酢で食べる。
  - name: テール
    emoji: 🐂
    reason: 牛の尻尾。煮込むととろとろ。
  D:
  - name: ガツ（豚の胃）
    short: ガツ
    emoji: 🐷
    reason: コリコリとした歯ごたえで、塩やごま油で食べる通好み。
  - name: 子宮（コブクロ）
    emoji: 🟣
    reason: 珍しい食感で、通のお店にあるメニュー。
summary: 'ホルモンは、シマチョウ・マルチョウ・ハツがS。脂がおいしいのはシマチョウとマルチョウ、あっさり食べたいならハツ。

  ホルモンは、中までしっかり焼くのが基本。ビールやハイボールと一緒に楽しもう。

  '
related:
- food-yakiniku-bui
- food-yakiniku-tare
- food-yakiniku-side
