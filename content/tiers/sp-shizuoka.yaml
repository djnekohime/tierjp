tiers:
  S:
  - name: マックスバリュ東海
    emoji: 🌳
    reason: 浜松市に本社を置き、東海4県と神奈川などでイオングループのスーパーを展開する。
  - name: 遠鉄ストア
    emoji: 🚌
    reason: 浜松市に本社を置く遠鉄グループ。静岡県西部地域を中心に、東は菊川市から西は愛知県まで展開する。
  A:
  - name: 静鉄ストア
    emoji: 🚃
    reason: 静岡鉄道グループのスーパー。静岡市を中心に展開する。
  - name: タカラ・エムシー
    emoji: 🍊
    reason: 静岡市に本社を置く、タカラ・エムシーグループの中核企業。「フードマーケットマム」「リベロ」を展開する。
  - name: マキヤ
    emoji: 🗻
    reason: 富士市に本社を置き、ディスカウントストア「エスポット」や食品スーパー「POTATO」「Mammy」などを運営する。
  B:
  - name: 田子重
    emoji: 🍙
    reason: 静岡県で展開するスーパー。明治時代から続く材木商の流れをくむ老舗。オール日本スーパーマーケット協会に加盟。
  - name: スーパーラック
    emoji: 🍵
    reason: 牧之原市に本社を置き、静岡中部地区に食品スーパーを出店する。CGCグループ加盟。
  - name: ビッグ富士（エブリィビッグデー）
    emoji: 🛒
    reason: 浜松市に本社を置き、静岡県内で「エブリィビッグデー」を運営する。
