  D: []
summary: '静岡は、東西に長く、浜松・静岡・富士など、街ごとにスーパーの顔が違う県。浜松の遠鉄ストアやマックスバリュ東海、静岡のタカラ・エムシー、富士のマキヤなど、県内発のチェーンが多い。

  県内には、電鉄系の遠鉄ストア、静鉄ストアもあり、沿線の暮らしを支えている。'
