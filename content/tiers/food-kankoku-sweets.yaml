tiers:
  S:
  - name: ホットク
    emoji: 🥞
    reason: 黒糖とナッツが入った、もちもちの揚げ焼きパン。冬の屋台の味。
  - name: ピンス（かき氷）
    emoji: 🍧
    reason: ふわふわの雪のような氷に、フルーツやあんこ。見た目も豪華。
  - name: トゥンカロン
    emoji: 🍬
    reason: ぷっくり分厚いマカロン。かわいくて、インスタ映えする。
  A:
  - name: クロッフル
    emoji: 🧇
    reason: クロワッサン生地で作った、ワッフル。カリッとサクサク。
  - name: ミルクティーのかき氷
    emoji: 🧋
    reason: 紅茶の香りとミルクの甘さ。
  - name: ハニーバターのお菓子
    emoji: 🍯
    reason: バターとはちみつの甘じょっぱい味。
  - name: ブルーベリークリームチーズのパン
    emoji: 🫐
    reason: 甘酸っぱいジャムと、まろやかなチーズ。
  - name: ソルトパン
    emoji: 🧂
    reason: バターの香りと、ほんのり塩気。
  B:
  - name: タルゴナキャンディ
    emoji: 🟤
    reason: ドラマで話題になった、カリッと割る昔ながらの砂糖菓子。
  - name: ヤクガシ
    emoji: 🟫
    reason: はちみつとごま油で作る、伝統のお菓子。
  - name: ケランパン
    emoji: 🥚
    reason: 卵入りの、屋台のミニケーキ。
  - name: ブンオパン（たい焼き）
    emoji: 🐟
    reason: 韓国のたい焼き。あんこやシュークリームも。
  C:
  - name: ココナッツジュース
    emoji: 🥥
    reason: 屋台でよく見かける。好みが分かれる。
  - name: ミルクセーキ
    emoji: 🥛
    reason: 韓国風の、あまいミルク飲料。
  D:
  - name: パッビンス（あずきかき氷）
    emoji: 🫘
    reason: 昔ながらの、あずきがたっぷりのかき氷。通好み。
  - name: シッケ
    emoji: 🍚
    reason: 米を発酵させた、甘い伝統飲料。
summary: '韓国スイーツは、ホットク・ピンス・トゥンカロンがS。韓国ドラマで見て、食べたくなるスイーツがたくさん。

  タルゴナキャンディのように、ドラマで話題になって、世界中で人気になったお菓子もある。

  '
