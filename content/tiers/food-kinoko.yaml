summary: 'きのこは、しいたけ・まいたけ・しめじがS。うまみがたっぷりで、どんな料理にも合う。

  松茸やトリュフのような高級きのこもあるけれど、毎日の食卓を助けてくれるのは、普通のきのこたち。野生のきのこは、毒があるものもあるので、自分で採らないでね。

  '
