title: 九州・沖縄の百貨店 Tier表
description: 岩田屋本店、福岡三越、博多大丸、博多阪急、井筒屋、鶴屋、トキハ、山形屋、デパートリウボウ…九州・沖縄の百貨店を、AIが「街での存在感×立地×個性」でS〜Dにランク付け。
category: depart
tags:
- 旅行
- あるある
published: '2026-10-09'
labels:
  S: 街の顔
  A: 地域の主役
  B: ほどよく便利
  C: こぢんまり個性派
  D: 変化の途中
criteria: '① 街での存在感（その地域で「あの百貨店」と言われるか）

  ② 立地の便利さ（駅直結・中心街など）

  ③ その店ならではの個性

  ※ AIは全店を回ったわけではありません。日本百貨店協会の店舗一覧と、各社・百貨店の公開情報、AIの印象で並べています。ランクは売上順や店の良し悪しではなく、「街での存在感・立地・個性」の目立ち方です。百貨店は閉店・改装・運営会社の変更が多いので、お出かけ前に公式サイトで最新の営業状況を確認してください（2026年10月時点）'
rank_notes:
  S: ここに行けば、その街とわかる
  D: 縮小・閉店予定など、変化の途中
tiers:
  S:
  - name: 岩田屋本店（福岡）
    emoji: 🌟
    reason: 福岡・天神の本店。店舗別売上高で九州最大と紹介される。
  - name: 博多阪急
    emoji: 💗
    reason: 博多駅の駅ビル「JR博多シティ」にある阪急の百貨店。
  - name: 鶴屋百貨店（熊本）
    emoji: 🕊️
    reason: 熊本市中心街。売場面積は日本最大級と紹介される、熊本の郷土のデパート。
  A:
  - name: 福岡三越店
    emoji: 🦁
    reason: 西鉄福岡駅の駅ビル「ソラリアターミナルビル」の核テナント。1997年開業。
  - name: 博多大丸福岡天神店
    emoji: 🛍️
    reason: 福岡・天神の大丸。単独で日本百貨店協会に加盟している。
  - name: 山形屋（鹿児島）
    emoji: 🌋
    reason: 鹿児島の老舗地場百貨店。鹿児島と宮崎で4店舗を展開。
  - name: トキハ本店（大分）
    emoji: 🌲
    reason: 大分の地場百貨店の本店。
  - name: デパートリウボウ（那覇）
    emoji: 🌺
    reason: 那覇・久茂地の百貨店。リウボウグループの一社が運営する、沖縄の百貨店。
  B:
  - name: 井筒屋小倉本店
    emoji: 🚃
    reason: 北九州・小倉の百貨店。北九州市で、百貨店事業を展開する唯一の事業者。
  - name: 浜屋百貨店（長崎）
    emoji: ⛪
    reason: 長崎・浜町の地場百貨店。三越伊勢丹の持分法適用会社。
  - name: 宮崎山形屋
    emoji: 🌴
    reason: 宮崎・橘通。山形屋ホールディングスの完全子会社が運営。
  - name: 佐賀玉屋
    emoji: 🦆
    reason: 佐賀市にある、佐賀県内唯一の百貨店。
  C:
  - name: 岩田屋久留米店
    emoji: 🏘️
    reason: 久留米にある岩田屋の店舗。
  - name: 佐世保玉屋
    emoji: ⚓
    reason: 佐世保にある百貨店。九州における髙島屋ハイランドグループの重要拠点。
  - name: トキハわさだ店
    emoji: 🛍️
    reason: 大分・わさだタウンにあるトキハの店舗。
  - name: トキハ別府店
    emoji: ♨️
    reason: 別府の温泉の街にあるトキハ。
  - name: 川内山形屋
    emoji: 🌾
    reason: 薩摩川内にある山形屋の店舗。
  - name: きりしま国分山形屋
    emoji: ⛰️
    reason: 霧島市にある山形屋の店舗。
  D: []
summary: '九州は、福岡・天神と博多駅に百貨店が集まる一方、熊本・鹿児島・大分・長崎・沖縄は、地場百貨店がそれぞれの街の顔。

  岩田屋本店は、店舗別売上で九州最大と紹介される。博多阪急は、2011年にJR博多シティの核店舗としてオープン。'
