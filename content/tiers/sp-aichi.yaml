summary: '愛知は、アピタ・ピアゴのユニー、名古屋のヤマナカ、岡崎のドミー、豊橋のシバタ・サンヨネ・ニューライフフジ、刈谷のスーパーヤオスズなど、地域ごとに根づいたチェーンがとても多い県。

  三河と尾張で、地元のスーパーの顔が変わるのも、愛知の面白いところ。'
