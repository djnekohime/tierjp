title: メダカの水草 Tier表
description: ホテイアオイ、アナカリス、マツモ、ウィローモス…メダカ飼育に使う水草を「育てやすさ・水質への役立ち・産卵のしやすさ」でS〜Dにランク付け。野外に捨てない注意も。
category: animals
tags: [メダカ, 動物, 初心者]
published: 2026-10-03
criteria: |
  ① 育てやすさ（丈夫さ・手入れの少なさ）
  ② 水質の安定や、日よけ、隠れ家としての役立ち
  ③ 産卵場所・稚魚の隠れ家としての使いやすさ
  ※ 水草は、種類や環境によって育ちが変わります。また、一部の水草は野外に出すと、生態系に影響を与えるおそれがあります。使い終わったときは、川や池に捨てず、乾燥させて、ごみとして処分してください
rank_notes:
  S: 初心者でも育てやすい定番
  D: 難しいか、メダカ向きではない
tiers:
  S:
    - name: ホテイアオイ（ホテイソウ）
      short: ホテイアオイ
      emoji: "🪷"
      reason: 水面に浮かぶ丸い葉と、ふさふさした根が特徴。根に産卵しやすく、日よけにもなり、メダカ飼育の定番。日光が強いほど育つが、冬は枯れやすいので、室内で守る。
    - name: アナカリス
      emoji: "🌿"
      reason: とても丈夫で、水中で育ちやすい代表的な水草。水質を整える手助けもして、初心者に向く。増えすぎたら、間引く。
  A:
    - name: マツモ
      emoji: "🎋"
      reason: 根を張らず、水中に浮かせておけばよい。やわらかい葉が稚魚の隠れ家になり、産卵場所としても人気。
    - name: カボンバ
      emoji: "🍃"
      reason: 細かく広がる葉が美しく、メダカがかくれたり、産卵したりしやすい。光が少ないと、育ちが弱くなる。
    - name: ウィローモス
      emoji: "🌱"
      reason: コケの仲間で、石や流木に活着する。稚魚の隠れ家やえさ場にもなり、見た目もやさしい。
    - name: アマゾンフロッグピット
      short: フロッグピット
      emoji: "🍀"
      reason: 水面に広がる浮き草。日よけになり、メダカが隠れやすい。繁殖力が強いので、増えすぎたら間引く。
    - name: ウォーターレタス
      emoji: "🥬"
      reason: 水面に浮かぶ、大きな葉の浮き草。日よけと、根が産卵場所になる。冬は枯れやすく、温度管理が大切。
  B:
    - name: サルビニア・ククラータ
      short: サルビニア
      emoji: "🍃"
      reason: 小さな葉を水面に広げる、かわいい浮き草。日よけになるが、強い日差しには弱い面もある。
    - name: ミクロソリウム
      emoji: "🌴"
      reason: 石や流木に活着する、丈夫な水草。ゆっくり育つので、手入れがあまり要らない。
    - name: アヌビアス・ナナ
      short: アヌビアス
      emoji: "🪴"
      reason: 日陰でも育つ、丈夫な水草。ゆっくり成長して、石や流木に結びつけて使う。
    - name: ウォーターウィステリア
      short: ウィステリア
      emoji: "🌿"
      reason: 切れ込みのある葉が美しい。育てやすいが、強い光や水質の管理が必要なこともある。
    - name: 産卵床（シュロ・毛糸・人工）
      short: 産卵床
      emoji: "🧶"
      reason: 水草の代わりに使える、繁殖用のアイテム。卵を取りやすく、ほかの容器に移して、孵化させやすい。
  C:
    - name: スイレン・ハスなどの大型の植物
      short: スイレン・ハス
      emoji: "🪷"
      reason: 大きな容器で、日よけと景色の演出になる。ただし根が張る場所と手入れが必要で、小さな容器では難しい。
    - name: ミズカンナなどの水辺の植物
      short: 水辺の植物
      emoji: "🌾"
      reason: ビオトープの景観づくりに役立つ。成長が早く、場所を取ることがあるので、適度に切る。
    - name: 水草のセット商品
      emoji: "📦"
      reason: 手軽に始められるが、中身の水草が自分の環境に合うとは限らない。混ざった種類の育ち方に注意する。
  D:
    - name: 肥料や強い光が必要な難しい水草
      short: 上級者向け
      emoji: "💡"
      reason: 美しいが、二酸化炭素や肥料、強い照明が必要な水草も多く、メダカの屋外飼育には向かないことがある。
    - name: 外来種として問題になりやすい水草を野外に放すこと
      short: 野外への放流
      emoji: "🚫"
      reason: ホテイアオイなどは、野外の水辺で増えすぎて、生態系に影響を与えることがある。使い終わりは、決して川や池に捨てない。
summary: |
  初心者は、まず「ホテイアオイ」か「アナカリス」から。丈夫で、水質も整えやすく、メダカの産卵や隠れ家にもなる。
  水草は、使い終わったら必ずごみとして処分する。メダカや水草を、川や池へ放すと、生態系を壊すおそれがある。飼い始めたら、最後まで責任を持つのが大前提。
related: [medaka-goods, medaka-yoki, medaka-shippai]
