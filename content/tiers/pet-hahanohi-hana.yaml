title: ペットがいる家に危ない花・安全な花 Tier表
description: ユリ、チューリップ、スイセン、アジサイ、カーネーション、バラ、ガーベラ、ひまわり…母の日や、お祝いでもらう花の中で、ペットがいる家に危ない花・比較的安全な花を「危険度」でS〜Dにランク付け。
category: animals
tags: [ペット, 犬, 猫]
published: 2026-10-05
labels:
  S: 命に関わる
  A: 要注意
  B: 気をつけたい
  C: 比較的安全
  D: 安全寄り
criteria: |
  ① 犬猫への、毒性の強さ
  ② 家庭で、手に入りやすいか
  ③ 花・葉・花粉・水など、どこで危険があるか
  ※ 一般的な注意点の整理です。ASPCA（米国動物虐待防止協会）などの、公開されている情報を参考にしていますが、種類・量・ペットの体質で、影響は変わります。「比較的安全」でも、食べすぎれば、体調をくずします。獣医さんの助言ではなく目安なので、口にしたときは、花の名前を伝えて、すぐに動物病院に相談してください
rank_notes:
  S: 猫のいる家には、置かない
  D: 比較的安心。ただし、食べさせない
tiers:
  S:
    - name: ユリ（テッポウユリ・カサブランカ・スカシユリなど）
      short: ユリ
      emoji: "💮"
      reason: 猫は、花粉を舐めたり、花瓶の水を飲んだりするだけでも、腎不全の危険がある。猫のいる家には、置かない。
    - name: ヘメロカリス（ユリに似た花）
      short: ヘメロカリス
      emoji: "🌼"
      reason: 猫に、ユリと同じような、腎臓の障害の危険がある。見た目が似ているので、注意する。
    - name: スズラン
      short: スズラン
      emoji: "🔔"
      reason: 心臓に影響する成分が含まれる。花瓶の水にも、成分が溶け出すことがある。
  A:
    - name: スイセン・ヒヤシンス・チューリップ（特に球根）
      short: 球根の花
      emoji: "🌷"
      reason: 球根に、特に、毒性の成分が多い。掘り返して、食べないよう、植えている場所も注意する。
    - name: キク（菊）
      short: キク
      emoji: "🌼"
      reason: 犬猫が食べると、吐き気や、皮膚の炎症などが、出ることがある。仏花にも、使われる。
    - name: ツツジ・シャクナゲ
      short: ツツジ
      emoji: "🌺"
      reason: 少量でも、中毒の危険がある。庭木や、鉢植えで、身近にあるので、注意する。
    - name: アジサイ
      short: アジサイ
      emoji: "💠"
      reason: 食べると、体調をくずす成分が含まれる。母の日の鉢植えで、多い。
    - name: シクラメン
      short: シクラメン
      emoji: "🪻"
      reason: 特に、根（球根）に、毒性の成分が多い。鉢植えは、届かない所へ。
  B:
    - name: カーネーション（母の日の定番）
      short: カーネーション
      emoji: "💐"
      reason: 食べると、軽い胃腸の症状や、皮膚の炎症が出ることがある。母の日の花束なので、特に注意する。
    - name: ポインセチア・アイビー・ポトス（観葉植物）
      short: 観葉植物
      emoji: "🪴"
      reason: かじると、口の周りの炎症や、吐き気の原因になることがある。置き場所を、考える。
    - name: カスミソウ
      short: カスミソウ
      emoji: "🤍"
      reason: 花束に、よく使われる。食べると、軽い胃腸の症状が出ることがある。
    - name: 花束のリボン・ワイヤー・吸水スポンジ
      short: ラッピング・スポンジ
      emoji: "🎀"
      reason: 花そのものでなく、飾りを、誤飲することもある。花を活けたら、すぐに片づける。
  C:
    - name: バラ（とげに注意）
      short: バラ
      emoji: "🌹"
      reason: 毒性は、低いとされるが、とげで、ケガをすることがある。肥料や、農薬にも、注意する。
    - name: ガーベラ
      short: ガーベラ
      emoji: "🌸"
      reason: 比較的、安全とされる花。食べすぎは、体調をくずすので、かじらせない。
    - name: ひまわり
      short: ひまわり
      emoji: "🌻"
      reason: 比較的、安全とされる花。種を、大量に食べると、のどに、詰まることがある。
  D:
    - name: ラン（ファレノプシス＝コチョウランなど）
      short: コチョウラン
      emoji: "🪷"
      reason: 比較的、安全とされる。鉢の土や、肥料を、舐めさせない。
    - name: スナップドラゴン（キンギョソウ）
      short: キンギョソウ
      emoji: "🌾"
      reason: 比較的、安全とされる。それでも、食べさせないのが、基本。
summary: |
  Sは、「ユリ」「ヘメロカリス」「スズラン」。特に、猫は、ユリの花粉を舐めただけでも危険なので、猫のいる家には、置かない。花瓶の水にも、成分が溶け出す。
  母の日の花束は、ペットが届かない所へ。比較的安全とされる花でも、かじらせないで、花の名前を、メモしておこう。
related: [pet-valentine-kiken, pet-xmas-kiken, neko-no-hi]
