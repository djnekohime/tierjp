title: 夜食に買うもの Tier表
description: カップ麺、おにぎり、アイス、からあげ、プリン、パン、ポテトチップス、スープ、焼きそば…コンビニで夜食に買いたいものを、AIが「深夜の幸せ度×罪悪感とのバランス」でランク付け。
category: food
genre: コンビニ・スーパー
tags: [グルメ, あるある]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 深夜に食べたときの幸せ度
  ② 手軽さ（すぐ食べられるか）
  ③ 罪悪感とのバランス
  ※ 夜遅くの食べすぎは体にご注意を
rank_notes:
  S: 深夜の三大ごほうび
  D: ヘルシー派の夜食
tiers:
  S:
    - name: カップ麺
      emoji: "🍜"
      reason: 深夜にお湯を注ぐ3分間のワクワク。夜食の王様。
    - name: アイス
      emoji: "🍨"
      reason: お風呂上がりや寝る前の、ちょっとしたごほうび。
    - name: おにぎり
      emoji: "🍙"
      reason: 小腹を満たすのにちょうどいい量。罪悪感もほどほど。
  A:
    - name: からあげ
      emoji: "🍗"
      reason: レジ横のからあげは、深夜に食べると特別においしい。
    - name: プリン・スイーツ
      short: プリン
      emoji: "🍮"
      reason: 甘いものが欲しくなる夜に。コンビニスイーツは種類も豊富。
    - name: ポテトチップス
      emoji: "🥔"
      reason: 映画や動画を見ながらの夜食に。一袋あっという間。
    - name: カップ焼きそば
      emoji: "🍝"
      reason: 濃いソースの味が、夜に食べたくなる。
    - name: 肉まん
      emoji: "🥟"
      reason: 寒い夜のあたたかい一品。
  B:
    - name: パン
      emoji: "🥐"
      reason: 手軽につまめる。翌朝の朝ごはんにもなる。
    - name: スープ（カップスープ）
      short: スープ
      emoji: "🥣"
      reason: 体が温まって、罪悪感も少ない。
    - name: チョコレート
      emoji: "🍫"
      reason: 少しずつ食べられる、頑張った自分へのごほうび。
    - name: おでん
      emoji: "🍢"
      reason: 冬のコンビニの夜食。大根と卵で心も温まる。
    - name: チーズ・おつまみ
      short: おつまみ
      emoji: "🧀"
      reason: 晩酌のお供に。
  C:
    - name: 弁当
      emoji: "🍱"
      reason: しっかり食べたい夜に。夜食というより遅い晩ごはん。
    - name: ヨーグルト
      emoji: "🥛"
      reason: ヘルシーだけど、夜食としては物足りない。
  D:
    - name: サラダチキン
      emoji: "🐔"
      reason: 高たんぱくで罪悪感ゼロ。頑張っている人のストイックな夜食。
    - name: 春雨スープ
      emoji: "🫧"
      reason: カロリー控えめで、お腹を温めてくれる。ダイエット中の夜の味方。
summary: |
  夜食に買うものは、カップ麺・アイス・おにぎりがS。深夜のコンビニで何を買うか迷う時間も、夜食の楽しみの一つ。
  罪悪感が気になる日は、スープや春雨スープ、サラダチキンで。でもたまには、カップ麺とアイスで自分にごほうびを。
related: [food-cupmen, food-hot-snack, food-instant-soup]
