title: 小動物・鳥・魚・爬虫類の災害対策 Tier表
description: ウサギ、ハムスター、インコ、メダカ・金魚、熱帯魚、爬虫類…犬猫以外のペットの災害時の備えを、必要度と実行しやすさでS〜Dにランク付け。停電・保温・避難のポイント。
category: animals
tags: [小動物, 鳥, 防災, 動物]
published: 2026-10-03
criteria: |
  ① 命や健康を守るために、どれだけ必要か
  ② 停電・水槽破損・避難に、どれだけ役立つか
  ③ 日ごろから準備しやすいか
  ※ 動物の種類によって、必要な備えは大きく違います。ここでは、小動物・鳥・魚・爬虫類に共通する、考え方と備えを整理しています。避難所は、犬猫以外のペットの受け入れが難しいこともあるので、地域の情報も確認してください
rank_notes:
  S: 必ず備えたい
  D: 優先度は低い
tiers:
  S:
    - name: 避難用のケース（キャリー・飼育ケース）
      short: 避難用ケース
      emoji: "🧳"
      reason: 小動物も鳥も爬虫類も、安全に運べる専用ケースが必須。ふだんのケージごと移動するのは難しいので、すぐ移せる小さなケースを用意しておく。
    - name: 水・フード・牧草など、数日分の備蓄
      short: フードの備蓄
      emoji: "🥫"
      reason: 支援物資には、犬猫以外のペットのフードが届きにくい。食べ慣れたものを、数日分、備えておく。
    - name: 保温・保冷グッズ（カイロ・保冷剤・断熱材）
      short: 保温・保冷
      emoji: "🌡️"
      reason: 小さな動物は、温度変化に弱い。停電時の温度管理が、命を左右する。使い方を、前もって確認しておく。
  A:
    - name: 水槽用の電池式エアーポンプ（魚）
      short: 電池式エアポンプ
      emoji: "🫧"
      reason: 停電すると、水中に酸素が行き渡らなくなる。電池式のポンプがあれば、数日間の酸素の確保に役立つ。
    - name: 水槽・ケージの転倒防止と固定
      short: 転倒防止
      emoji: "🔩"
      reason: 揺れで、水槽やケージが落ちたり倒れたりすると、命にかかわる。耐震マットや固定具で、対策を。
    - name: 予備のヒーター・予備の電球（爬虫類・鳥・熱帯魚）
      short: 予備の保温器具
      emoji: "🔥"
      reason: 保温が命綱の動物は、器具の故障や停電への備えが必要。電池式や、カイロを使った、簡易の保温方法も調べておく。
    - name: 日ごろからケースに慣らしておく
      short: ケースに慣らす
      emoji: "📦"
      reason: 慣れていないケースに入れられると、強いストレスになる。短時間から、少しずつ慣らす。
    - name: 動物の健康情報・飼い主の連絡先のメモ
      short: 健康情報メモ
      emoji: "📝"
      reason: 避難先や、動物病院で、動物の種類や特徴、持病、えさの内容を伝えるのに役立つ。
  B:
    - name: ペットの写真（迷子の備え）
      short: ペットの写真
      emoji: "📸"
      reason: 逃げてしまったときの、手がかりになる。種類が似ている動物が多いので、特徴の分かる写真を。
    - name: 床材・巣材・隠れ家
      short: 床材・隠れ家
      emoji: "🪵"
      reason: 避難先でも、落ち着ける環境があると、動物の負担が減る。においのついたものを少しもっていく。
    - name: 動物を診てもらえる病院の連絡先リスト
      short: 病院の連絡先
      emoji: "🏥"
      reason: 犬猫以外を診られる病院は限られる。遠方の病院も含めて、リストにしておく。
    - name: 水槽の水・フィルターのろ材の一部を、持ち出し用に確保する
      short: 水槽の水を確保
      emoji: "🪣"
      reason: 魚を別の容器に移すとき、水槽の水を使えると、水質の急変を防げる。使い慣れた水が、魚の負担を減らす。
    - name: 保冷バッグ・保温バッグ
      short: 保冷・保温バッグ
      emoji: "🧊"
      reason: 避難時に、温度を保つ補助になる。ケースを入れて使うことができる。
  C:
    - name: おもちゃ・遊び道具
      emoji: "🧸"
      reason: 避難時の優先度は低い。最低限、安心できるものがあれば足りる。
    - name: 大型のケージごと避難しようとする
      short: 大型ケージごと避難
      emoji: "📦"
      reason: 持ち運びが難しく、避難の妨げになる。避難用のケースに、必要な動物だけ入れる。
    - name: 避難先の受け入れを確認せずに向かう
      short: 受け入れ確認なし
      emoji: "❓"
      reason: 犬猫以外は、受け入れが難しいこともある。避難前に、情報を調べておく。
  D:
    - name: 動物を野外に放す
      short: 野外に放す
      emoji: "🚫"
      reason: 飼っている動物は、野外では生きられないことが多い。外来種が野外に出ることは、生態系にも影響を与える。絶対にしない。
    - name: 避難時に動物を家に置いていく
      short: 家に置いていく
      emoji: "⚠️"
      reason: 水や食料がなく、温度管理もできない家に残された動物は、命の危険が高まる。できる限り、連れていく方法を考える。
summary: |
  小動物・鳥・魚・爬虫類の災害対策のSは、「避難用ケース」「数日分のフード」「保温・保冷グッズ」。停電で温度管理や酸素が止まる、というのが最大の危険。
  動物によって必要な備えは違うので、「停電したらどうなるか」を想像して、動物ごとの備えを考えたい。日ごろの準備が、命をつなぐ。
related: [pet-bousai-goods, shoudoubutsu-tori-ondo, medaka-kingyo-essetsu]
