summary: |
  埼玉は、川越の頑者や大宮の狼煙のように、濃厚なつけ麺の名店が多い県として知られる。百名店の数も30店以上と、関東で東京・神奈川に次ぐ多さ。
  駅から離れた店も多いので、車でめぐるのもおすすめ。二郎系、煮干し、塩と、系統もいろいろ楽しめる。
  ※ AIは実際に食べていません。参考：食べログ ラーメン EAST 百名店 2025、各店などの公開情報。
