title: 勉強の復習のタイミング Tier表
description: 翌日、3日後、1週間後、寝る前…せっかく勉強したことを忘れにくくする復習のタイミングを、ゾーマが「効果の出やすさ×続けやすさ×時間のかからなさ」でS〜Dにランク付け。
category: manabi
tags:
- 初心者
- 勉強法
published: '2026-11-13'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 効果の出やすさ（忘れにくくなるか）

  ② 続けやすさ

  ③ 時間のかからなさ

  ※ 覚え方には個人差があります。体調や睡眠を大切にしながら、自分に合うやり方を探してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: その日の寝る前に、5分だけ見返す
    emoji: 🌙
    reason: 覚えたてをすぐ確認すると、忘れる速度がゆるやかになる。
  - name: 翌日にもう一度、思い出す
    emoji: 📆
    reason: 忘れかけたころの復習は、効果が高い。
  - name: 1週間後に、もう一度確認する
    emoji: 🗓️
    reason: 3回目で、記憶がぐっと定着しやすい。
  A:
  - name: 何も見ずに、まず思い出してみる
    emoji: 🧠
    reason: 眺めるより、思い出す作業のほうが記憶に残る。
  - name: 思い出せなかった部分に、印をつける
    emoji: 🔖
    reason: 次の復習で、そこだけ集中できる。
  - name: カレンダーに、復習の予定を入れておく
    emoji: 📲
    reason: 「あとでやろう」を、確実に実行に変える。
  - name: 習慣とセットにする（朝のコーヒーのあと、など）
    emoji: ☕
    reason: 決まった時間にやれば、続けやすい。
  - name: 間違えた問題だけ、集めて繰り返す
    emoji: 📝
    reason: できるものに時間を使わず、効率がよい。
  B:
  - name: 声に出して、説明してみる
    emoji: 🗣️
    reason: 人に教えるつもりで話すと、あいまいな部分が見える。
  - name: 1か月後にも、軽く確認する
    emoji: 📚
    reason: 長期の記憶に変わる。短く済ませてOK。
  - name: フラッシュカードやアプリで、短く復習する
    emoji: 📱
    reason: すき間時間に、少しずつ進められる。
  - name: 友だちと、問題を出し合う
    emoji: 🤝
    reason: 楽しみながら復習でき、続けやすい。
  - name: 通学・通勤中に、頭の中でおさらいする
    emoji: 🚃
    reason: 道具が要らず、すき間時間を活かせる。
  C:
  - name: 1日の最後に、まとめて復習する
    emoji: 🕐
    reason: 短時間なら効果的。長すぎると、疲れて頭に入らない。
  - name: 1か月以上あけて、一気に見直す
    emoji: ⏳
    reason: ほとんど忘れていることも。早めに少しずつがおすすめ。
  - name: ノートをきれいに書き直すことに、時間をかける
    emoji: 🖊️
    reason: 見た目は整うが、覚えているかは別。
  D:
  - name: 試験の前日に、まとめて一夜漬けをする
    emoji: 🔥
    reason: 短期間では覚えられても、数日で忘れやすい。睡眠も削れてしまう。
  - name: 復習をせず、新しい内容ばかり進める
    emoji: 🏃
    reason: 穴だらけになり、あとで困る。
  - name: 睡眠を削って、復習の時間を作る
    emoji: 😵
    reason: 睡眠は記憶の定着に大切。かえって逆効果。
summary: '勉強したのに、すぐ忘れてしまう。それは記憶力が悪いのではなく、「復習のタイミング」が合っていないだけのことが多い。人は、覚えたことを時間とともに忘れていくので、忘れかけたころに、もう一度思い出すのが、効率のいい復習だ。

  S級は、「その日の寝る前に5分」「翌日にもう一度」「1週間後にもう一度」。この3回を意識するだけで、覚え方がぐっと変わる。長い時間は要らない。短くても、自分で思い出そうとする時間が、いちばん効く。

  ポイントは、教科書やノートを「眺める」のではなく、「何も見ずに思い出してみる」こと。思い出せなかったところだけ、確認する。これだけで、記憶の残り方が違ってくる。

  復習の予定は、手帳やスマホのカレンダーに、あらかじめ入れておくといい。「やろう」と思うだけでは、つい忘れてしまう。「毎朝のコーヒーのあとに前日分を見返す」のように、習慣と結びつけると続きやすい。

  反対に、D級の「試験の前日にまとめて一夜漬け」は、そのときは覚えても、数日で抜けやすい。睡眠を削ってまで詰め込むのも、おすすめしない。睡眠は、記憶を定着させるためにも、大切な時間だ。

  完璧を目指さなくていい。忘れたら、もう一度やればいいだけ。何度も思い出すうちに、少しずつ、自分のものになっていく。

  復習は、「頑張る時間」ではなく、「確認する時間」と考えると気が楽になる。5分でいい、1ページでいい、1問でいい。続けられる量に絞るのが、結局いちばんの近道だ。忘れてしまった自分を責める必要はない。思い出そうとした努力そのものが、記憶の土台をつくっている。今日の勉強の終わりに、明日の自分へ「ここだけ見返してね」とメモを残すところから、始めてみよう。'
