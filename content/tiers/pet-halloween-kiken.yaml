title: ハロウィンでペットが危ないもの Tier表
description: チョコレート、キャンディ、仮装、ドアの開け閉め、ろうそく、光る小物…ハロウィンの時期に犬猫がうっかり事故にあいやすいものを「危険度」でS〜Dにランク付け。
category: animals
tags: [犬, 猫, 動物]
published: 2026-10-03
labels:
  S: 命にかかわる
  A: 要注意
  B: 気をつけたい
  C: 対策しだい
  D: 知っておけば大丈夫
criteria: |
  ① 命や健康への危険度
  ② ハロウィンの家庭で起こりやすいか
  ③ 事前の対策のしやすさ
  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。ペットが口にした、様子がおかしいときは、様子見せず、すぐ動物病院に連絡してください
rank_notes:
  S: 少しの油断が命にかかわる
  D: 知っておけば防げる
tiers:
  S:
    - name: チョコレート入りのお菓子
      short: チョコレート
      emoji: "🍫"
      reason: ハロウィンのお菓子の定番だが、犬や猫には中毒の危険がある。ボウルに入れたお菓子を、ペットの届く場所に置かない。
    - name: キシリトール入りのガム・キャンディ
      short: キシリトール
      emoji: "🍬"
      reason: 犬が食べると、急な低血糖や肝臓の障害を起こすことがある。人間用のガムやキャンディに入っていることがあるので、成分表示を確認する。
    - name: 玄関のドアの開け閉めによる脱走
      short: 玄関からの脱走
      emoji: "🚪"
      reason: トリック・オア・トリートの来客で、ドアを何度も開けるため、ペットが飛び出す危険がある。インターホンが鳴る時間は、ペットを別の部屋に入れる。
  A:
    - name: ぶどう・レーズン入りのお菓子
      short: レーズン
      emoji: "🍇"
      reason: 犬が食べると、腎臓に重い影響を与えることがある。レーズン入りのクッキーなどにも注意。
    - name: キャンディの包み紙・袋・プラスチック
      short: 包み紙・袋
      emoji: "🛍️"
      reason: 飲みこむと、のどや腸に詰まる危険がある。お菓子を食べたあとのごみは、すぐ片づける。
    - name: ジャック・オー・ランタンのろうそく・火
      short: ろうそく・火
      emoji: "🕯️"
      reason: ペットが倒したり、近づいてやけどをしたりする危険がある。火事の原因にもなるので、LEDライトを使うほうが安心。
    - name: 飾りのコード・電飾（イルミネーション）
      short: コード・電飾
      emoji: "🔌"
      reason: かじって感電したり、飲みこんだりする危険がある。ペットの手が届かない高さにする。
    - name: 小さな飾り・ビーズ・ビー玉・造花
      short: 小さな飾り
      emoji: "🕸️"
      reason: 誤飲の危険がある。細かいパーツのある飾りは、ペットの届く場所に置かない。
  B:
    - name: 仮装・コスチューム
      short: 仮装
      emoji: "🎃"
      reason: 嫌がるペットも多く、動きにくくなったり、ストレスを感じたりする。着せるなら、短時間にして、様子を見ながら。ひもやボタンが体に絡まないよう注意する。
    - name: 来客や、大きな音で、ペットがびっくりする
      short: 来客・大きな音
      emoji: "🔔"
      reason: 仮装した知らない人や、にぎやかな声は、ペットには怖いことが多い。落ち着ける隠れ場所を作る。
    - name: 光る棒（ケミカルライト）をかじる
      short: 光る棒
      emoji: "💡"
      reason: 中の液体が、口に入ると、体調不良を起こすことがある。ペットの首輪につける用でも、かみ割らないよう、気をつける。
    - name: かぼちゃのくり抜いた中身・飾りのかぼちゃ
      short: かぼちゃの飾り
      emoji: "🎃"
      reason: 生のかぼちゃは、少量なら問題が少ないとされるが、腐ったものや飾りにしたものは、お腹をこわすことがある。食べさせない。
    - name: 夜の散歩での、仮装した人や、花火
      short: 夜の散歩
      emoji: "🌙"
      reason: 暗い道や、驚く出来事に、犬が驚くことがある。リードを短めに持ち、反射材や、ライトをつける。
  C:
    - name: 食べ残しのパーティー料理（ネギ類・揚げ物・味つけ肉）
      short: パーティー料理
      emoji: "🍗"
      reason: 人間用の料理には、ペットに危険な食材が多い。ペットの届かない場所に置いて、ごみもしっかり処理する。
    - name: お酒・ジュース
      short: お酒・ジュース
      emoji: "🥂"
      reason: アルコールは、少量でも、ペットには危険。飲みかけのグラスにも、近づけない。
    - name: 仮装グッズの染料・化粧品・ヘアカラースプレー
      short: 仮装グッズの化粧品
      emoji: "💄"
      reason: ペットが、なめたり、かじったりすると、体に悪い。使ったあとは、ペットの届かない場所に片づける。
  D:
    - name: 手作りの犬猫用お菓子（食材に気をつけて）
      short: ペット用お菓子
      emoji: "🍪"
      reason: ペット用のおやつなら、安全に、季節の気分が楽しめる。材料は、ペットが食べても安全なものを選び、量はほんの少しに。
    - name: ハロウィンの写真撮影（短時間）
      short: 写真撮影
      emoji: "📸"
      reason: ペットが嫌がらない範囲で、短時間なら、楽しい思い出になる。無理強いせず、早めに終える。
summary: |
  ハロウィンのSは、「チョコレート」「キシリトール」「玄関からの脱走」。お菓子と来客の多い日は、ペットにとって、いつもと違う危険がいっぱい。
  パーティーのときは、ペットを落ち着ける部屋に入れて、お菓子や飾りの置き場所を決める。みんなが楽しい日に、ペットも安全に過ごせるよう、準備しておきたい。
related: [inu-kiken, pet-fuyu-kiken, neko-oyatsu]
