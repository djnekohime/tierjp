title: 読書を続ける方法 Tier表
description: 図書館、電子書籍、オーディオブック、短い本から、寝る前の10分、読書記録、積読の対処、読書会…本を読む習慣を続けるコツを「効果・続けやすさ・費用」でS〜Dにランク付け。
category: shumi
tags: [初心者]
published: 2026-10-05
labels:
  S: 続けやすい王道
  A: おすすめ
  B: 余裕があれば
  C: 人を選ぶ
  D: やめたほうがいい
criteria: |
  ① 読書を続けやすいか
  ② 費用の手頃さ
  ③ 無理なく、楽しめるか
  ※ 一般的な目安です。読書の目的（楽しみ・勉強・仕事）や、目の状態、生活リズムで、合う方法は変わります。目が疲れたときは、休憩をはさんでください
rank_notes:
  S: まずこれ
  D: 読書が、つらくなる原因に
tiers:
  S:
    - name: 好きなジャンル・好きな著者から、読む
      short: 好きなものから
      emoji: "💗"
      reason: 興味があると、続けやすい。名作や、話題の本に、こだわらなくていい。
    - name: 図書館を使う（無料で借りる）
      short: 図書館
      emoji: "🏛️"
      reason: 費用を気にせず、たくさん試せる。合わない本を、途中でやめても、気軽。
    - name: 1日5〜10分だけ、読む時間をつくる（寝る前・朝・通勤）
      short: 短い時間を決める
      emoji: "⏰"
      reason: 習慣になりやすい。時間を決めると、続けやすい。
  A:
    - name: 電子書籍・スマホで読む
      short: 電子書籍
      emoji: "📱"
      reason: 持ち歩きやすく、文字の大きさも、変えられる。寝る前は、画面の明るさに、注意する。
    - name: オーディオブック（耳で聴く）
      short: オーディオブック
      emoji: "🎧"
      reason: 家事や、移動中でも、楽しめる。目が疲れているときにも、向いている。
    - name: 短編集・エッセイ・薄い本から、始める
      short: 薄い本から
      emoji: "📕"
      reason: 読み終えられる、達成感がある。長編の前の、準備運動にもなる。
    - name: 合わない本は、途中でやめてもいいと決める
      short: やめてもOK
      emoji: "🚪"
      reason: 「読まなきゃ」が、減る。読書が、義務から、楽しみに変わる。
    - name: 読んだ本を、メモ・記録する（読書ノート・アプリ）
      short: 読書記録
      emoji: "📝"
      reason: 読んだ量が、見えると、続ける励みになる。一言の感想だけで、十分。
  B:
    - name: 本屋さんに、定期的に行く
      short: 本屋さん
      emoji: "📚"
      reason: 偶然の、出会いがある。気になる本を、見つけやすい。
    - name: 読書会・SNSで、感想を共有する
      short: 読書会・SNS
      emoji: "👥"
      reason: 感想を話すと、楽しみが増える。無理に参加しなくても、大丈夫。
    - name: カフェ・公園など、お気に入りの読書スポットを、見つける
      short: 読書スポット
      emoji: "☕"
      reason: 気分転換になり、習慣にもなる。安全で、周りに、迷惑のかからない場所を選ぶ。
    - name: 本を、同時に何冊か、並行して読む
      short: 並行読み
      emoji: "📖"
      reason: 気分で、選べて、飽きにくい。混ざりやすいので、ジャンルを変える。
  C:
    - name: 「1年で、100冊」など、大きな目標を立てる
      short: 大きな目標
      emoji: "🎯"
      reason: やる気が出る人もいるが、冊数が、目的になりやすい。無理のない数にする。
    - name: 速読・要約サービスで、効率よく読む
      short: 速読・要約
      emoji: "⚡"
      reason: 情報収集には、便利。じっくり、味わう読書とは、別の楽しみ。
  D:
    - name: 積読が増えたことを、責める
      short: 積読を責める
      emoji: "😞"
      reason: 気持ちが、重くなる。本は、読みたくなったときに、読めばいい。
    - name: 話題の本・難しい本を、無理に読もうとする
      short: 無理して読む
      emoji: "💦"
      reason: 読書が、苦痛になる。興味が出るまで、置いておいてもいい。
    - name: 夜遅くまで、読んで、睡眠不足になる
      short: 夜更かし読書
      emoji: "🌙"
      reason: 翌日の、体調に影響する。区切りのよいところで、休む。
summary: |
  Sは、「好きなものから」「図書館」「1日5〜10分の習慣」。無理せず、楽しく続けるのが、読書習慣のいちばんのコツ。
  合わない本は、途中でやめてOK。積読も、責めなくていい。自分のペースで、本との時間を楽しもう。
related: [shumi-hajimeyasui, shumi-shitsunai, benkyo-tsuzukekata]
