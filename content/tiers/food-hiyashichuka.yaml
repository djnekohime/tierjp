title: 冷やし中華の具 Tier表
description: 錦糸卵、きゅうり、ハム、トマト、チャーシュー、かにかま、くらげ、紅しょうが、もやし、蒸し鶏…冷やし中華の具を、AIが「入っているとうれしい度×夏らしさ×彩り」でランク付け。
category: food
genre: 麺・粉もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 入っていると「うれしい」と思える人気
  ② 冷たい麺と甘酢・ごまだれとの相性
  ③ 彩りの華やかさ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 冷やし中華の三大具
tiers:
  S:
    - name: 錦糸卵
      emoji: "🟨"
      reason: 細く切った薄焼き卵は、冷やし中華の黄色担当。見た目の華やかさはこれで決まる。
    - name: きゅうり
      emoji: "🥒"
      reason: シャキシャキの食感とさわやかさ。夏の麺に欠かせない緑色。
    - name: ハム
      emoji: "🟥"
      reason: ピンク色の彩りと、ほどよい塩気。冷やし中華の定番中の定番。
  A:
    - name: トマト
      emoji: "🍅"
      reason: 赤い色とみずみずしい酸味で、夏らしさがアップ。
    - name: チャーシュー
      emoji: "🥩"
      reason: ハムの代わりにチャーシューがのっていると、ごちそう感が増す。
    - name: 蒸し鶏
      emoji: "🐔"
      reason: さっぱりした蒸し鶏は、ごまだれとの相性が抜群。
    - name: かにかま
      emoji: "🦀"
      reason: 赤と白の彩りが華やか。手軽に使える。
    - name: 紅しょうが
      emoji: "🔴"
      reason: 少しのせるだけで、味と色のアクセントに。
  B:
    - name: くらげ
      emoji: "🌀"
      reason: コリコリした食感が楽しい、中華料理店の冷やし中華の具。
    - name: もやし
      emoji: "🌱"
      reason: シャキシャキ食感でボリュームアップ。
    - name: わかめ
      emoji: "🌊"
      reason: 海藻の食感でさっぱり。
    - name: コーン
      emoji: "🌽"
      reason: 甘みと彩り。子供に人気。
    - name: からし
      emoji: "🟡"
      reason: 具ではないが、器のふちにそえるからしは冷やし中華の名脇役。
  C:
    - name: 海老
      emoji: "🦐"
      reason: 豪華な冷やし中華にのっている具。家ではなかなか入らない。
    - name: 大葉
      emoji: "🌿"
      reason: さわやかな香り。和風の冷やし中華に。
  D:
    - name: マヨネーズ
      emoji: "🥚"
      reason: 冷やし中華にマヨネーズをかけるのは、東海地方などで知られる食べ方。知らない人は驚くが、ハマる人も多い。
    - name: ごまだれ（たれの種類）
      short: ごまだれ
      emoji: "⚪"
      reason: 甘酢しょうゆではなく、ごまだれで食べる冷やし中華。具ではなく「たれ派閥」の違い。
summary: |
  冷やし中華の具は、錦糸卵・きゅうり・ハムがS。黄色・緑・ピンクの色がそろうと、一気に夏らしい一皿になる。
  東海地方で知られるマヨネーズがけや、甘酢とごまだれのたれ論争など、冷やし中華は地域や家庭で意外と個性が出る料理。
related: [food-udon, food-pasta-aji, food-soba]
