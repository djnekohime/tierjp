title: 冬の青菜（ほうれん草・小松菜など）の食べ方 Tier表
description: おひたし、味噌汁、炒めもの、ごま和え、鍋…冬に甘みが増す青菜の食べ方を、ゾーマが「おいしさ×手軽さ×使い回しやすさ」でS〜Dにランク付け。
category: food
genre: 鍋・季節の食べ物
tags:
- グルメ
- 冬
published: '2026-11-24'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 青菜のおいしさが引き立つか

  ② 手軽さ（下ごしらえ・調理の時間）

  ③ 使い回しやすさ（ほかの料理にも展開できるか）

  ※ ほうれん草は、えぐみのもとになるシュウ酸が気になる場合、ゆでて水にとると和らぎます。ランクは目安で、体質や持病のある方は医師・栄養士の案内に従ってください'
rank_notes:
  S: 迷ったらこれ
  D: 好みが分かれる・工夫が要る
tiers:
  S:
  - name: おひたし
    emoji: 🥗
    reason: ゆでて、だしじょうゆで和えるだけ。青菜の甘みがいちばん分かる、いちばん簡単な定番。
  - name: 味噌汁の具
    emoji: 🍲
    reason: 火を通しすぎず、最後に入れるだけ。冬のあったか汁物に、緑の彩りが加わる。
  - name: ごま和え
    emoji: 🌰
    reason: ごまの香りとコクで、青菜がごちそうに。お弁当の副菜にもなる。
  A:
  - name: ベーコン・豚肉との炒めもの
    emoji: 🥓
    reason: 肉の旨みを青菜が吸って、ご飯がすすむ。強火でさっと炒めるのがコツ。
  - name: 卵とじ・卵炒め
    emoji: 🍳
    reason: ふんわり卵と青菜の相性は抜群。忙しい日の、あと一品に。
  - name: 油揚げと煮びたし
    emoji: 🟫
    reason: だしを含んで、しみじみおいしい。作り置きにもなる。
  - name: 鍋の具
    emoji: 🍲
    reason: 最後にさっとくぐらせると、シャキッとして甘い。
  - name: バターじょうゆ炒め
    emoji: 🧈
    reason: 洋風で、お肉にも魚にも合う。ご飯にも、パンにも合う。
  B:
  - name: 白和え
    emoji: ⬜
    reason: 豆腐のまろやかさが、青菜の甘みを引き立てる。少し手間はかかる。
  - name: キッシュ・グラタンの具
    emoji: 🥧
    reason: 洋風にもなじむ。下ゆでしておけば扱いやすい。
  - name: スープ・ポタージュ
    emoji: 🥣
    reason: ミキサーでなめらかにすれば、緑の栄養たっぷりスープに。
  - name: パスタの具（和風・クリーム）
    emoji: 🍝
    reason: あと一品が欲しいときに、手軽に彩りが足せる。
  - name: 餃子・春巻きの具
    emoji: 🥟
    reason: ひき肉と合わせるとやさしい味。刻んでしっかり水気を切る。
  - name: カレーに加える
    emoji: 🍛
    reason: 最後に加えると、野菜不足が補える。色が変わりやすい点は割り切る。
  C:
  - name: サラダ（生食）
    emoji: 🥬
    reason: 小松菜は生でも使えるが、ほうれん草は、サラダ用の品種を選びたい。
  - name: ジュース・スムージー
    emoji: 🥤
    reason: 飲みやすいが、青臭さが残る。果物と合わせて調整を。
  - name: 漬物・浅漬け
    emoji: 🥒
    reason: シャキシャキ食感を楽しめる。塩分は控えめにしたい。
  D:
  - name: 長時間、ぐつぐつ煮込みすぎる
    emoji: ⏳
    reason: 色が悪くなり、食感もくたくたに。短時間で仕上げたい。
  - name: ゆでたあと、水気を絞らず使う
    emoji: 💧
    reason: 味がぼやけ、水っぽくなる。ここだけは丁寧に。
  - name: 味付けを濃くしすぎる
    emoji: 🧂
    reason: せっかくの甘みと香りが、隠れてしまう。
summary: '冬の青菜は、寒さにあたって甘みが増す。ほうれん草も小松菜も、この時期がいちばんおいしい。S級は「おひたし」「味噌汁」「ごま和え」。どれも短時間で作れて、毎日の食卓に出しやすい。

  青菜料理のコツは、とにかく火を通しすぎないこと。ゆですぎると色も食感も悪くなり、栄養も逃げやすい。ゆでたらすぐ冷水にとって、水気をぎゅっと絞る。この2つだけで、おいしさが一段変わる。

  まとめてゆでて小分けにして冷凍しておけば、味噌汁にも炒めものにも、ぽいっと入れて使えるので、平日の夜がぐっと楽になる。小松菜はあくが少なく、ゆでずに炒めてもいい。ほうれん草は、ゆでてあくを抜くと食べやすい。

  ランクは「いちばん多くの人が喜びそうな順」で決めた。バターやベーコンで洋風にする、白だしでさっと煮るなど、好みで自由にアレンジしてほしい。ただし、味付けを濃くしすぎると、せっかくの甘みが隠れてしまうので、最初は控えめに。

  あなたの家の定番は、どの食べ方だった？ ぜひ並べ替えて、自分のTier表を作ってみてほしい。最後に、保存のコツをひとつ。買ってきたら、濡らしたキッチンペーパーで包んで、立てて冷蔵庫へ。横にするより長持ちする。

  【ひとこと】冬の青菜は、安くて、早くて、体にもうれしい味方。迷ったら、まず「おひたし」と「味噌汁」から。慣れてきたら、バターや卵と合わせて、洋風にも広げてみてほしい。あなたの青菜のS級は、どの食べ方だった？ ぜひ並べ替えて、自分のTier表を作ってみよう。'
