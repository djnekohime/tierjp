title: ウサギのしぐさの意味 Tier表
description: ビンキー、足ダン、鼻ひくひく、あごこすり、ゴロン…ウサギのしぐさに込められた気持ちを、「うれしい度・分かりやすさ」でS〜Dにランク付け。
category: animals
tags: [ウサギ, 小動物, 動物, あるある]
published: 2026-10-03
labels:
  S: 大喜び
  A: 安心している
  B: ふつう
  C: ちょっと不満
  D: 要注意
criteria: |
  ① 飼い主が見てうれしいか（かわいい・安心できる）
  ② 気持ちの分かりやすさ
  ③ 体調や警戒のサインとして注意が必要か
  ※ ウサギの気持ちは個体差が大きいので、「よくある意味」として読んでください。調子が悪そうなときは、ウサギを診られる動物病院へ
rank_notes:
  S: ウサギが幸せいっぱいの合図
  D: 体調や強い不安のサイン
tiers:
  S:
    - name: ビンキー（ジャンプしてひねる）
      short: ビンキー
      emoji: "🌟"
      reason: 空中でピョンと飛び上がって、体や足をひねる動き。うれしさや楽しさがあふれたときの、ウサギならではの表現と言われる。見られたらラッキー。
    - name: 横にゴロンと寝転ぶ
      short: ゴロン
      emoji: "😴"
      reason: 安心している証拠。体を投げ出して寝ているのは、その場所が安全だと思っているサイン。
  A:
    - name: 体を伸ばしてリラックスする
      short: のび〜っと伸びる
      emoji: "🛋️"
      reason: 後ろ足を伸ばして、ぺたんと伏せているのは、とてもくつろいでいる状態。しばらく見守りたくなる姿。
    - name: 毛づくろいをする
      short: 毛づくろい
      emoji: "🪮"
      reason: 前足で顔を洗う動きや、体をなめる動きは、落ち着いているときの習慣。リラックスできているサイン。
    - name: 鼻をひくひくさせる
      short: 鼻ひくひく
      emoji: "👃"
      reason: 普段のにおいを確かめる動きで、落ち着いているときはゆっくり、興奮や緊張しているときは速くなる。
    - name: 飼い主の体や手をなめる
      short: なめてくれる
      emoji: "👅"
      reason: 親しい相手にする、愛情のサインと言われる。毛づくろいのつもりでなめてくれることもある。
    - name: あごを物や人にこすりつける
      short: あごこすり
      emoji: "📍"
      reason: あごの下の腺から出るにおいで、「ここは自分の場所」と印をつける行動。飼い主にこすりつけたら、仲間として認められている。
  B:
    - name: 前足で床や物をほる
      short: 穴ほり
      emoji: "⛏️"
      reason: 巣を作る本能の行動。ケージのトレーをほったり、カーペットを引っかいたりするので、ほれる場所や専用のおもちゃを用意すると満足する。
    - name: 丸まって座る（香箱座り）
      short: 丸まる
      emoji: "🍞"
      reason: 体を丸めて落ち着いているポーズ。ほどよくリラックスしている。
    - name: 耳を立てて周りをうかがう
      short: 耳を立てる
      emoji: "👂"
      reason: 周囲の音に注意を向けているサイン。耳をいろいろな向きにして、気になる音を聞き分けている。
    - name: 夕方や明け方に活発に動く
      short: 活動時間
      emoji: "🌅"
      reason: ウサギは、夕方や明け方に活発になる性質があり、昼間はよく寝ている。この時間を意識して遊ぶとよい。
    - name: 盲腸便（栄養のうんち）を食べる
      short: 盲腸便を食べる
      emoji: "🌰"
      reason: 栄養を取りこむために、ウサギが自分の盲腸便を食べるのは、正常な行動。見かけても、止めずに見守る。
  C:
    - name: 足をダン！と鳴らす（スタンピング）
      short: 足ダン
      emoji: "🦵"
      reason: 警戒や不満、驚いたときのサイン。大きな音や知らないものに反応していることが多い。原因を取りのぞいてあげる。
    - name: 鼻で人をつつく
      short: 鼻でつつく
      emoji: "👉"
      reason: 「どいて」「構って」「撫でて」など、気持ちを伝える動き。何を伝えたいのか、読み取る楽しみがある。
    - name: 飼い主に背を向けてそっぽを向く
      short: そっぽを向く
      emoji: "🙄"
      reason: 気分がのらないときや、いじけているときのしぐさ。しばらくそっとしておくとよい。
  D:
    - name: 歯をギリギリと強く鳴らす
      short: 強い歯ぎしり
      emoji: "🦷"
      reason: 強い歯ぎしりは、痛みや強い不快のサイン。体調が悪そうなときは、すぐ動物病院へ。小さくコリコリ鳴らすのは、リラックスしているときのこともある。
    - name: ブーブーと鳴く・うなる
      short: うなり声
      emoji: "⚡"
      reason: 怒りや警戒のサイン。そっと離れて、落ち着くまで待つ。無理に触らない。
    - name: 動かず体を丸めて、食欲がない
      short: 動かず食欲なし
      emoji: "🚨"
      reason: ウサギは体調不良を隠すので、動かない、食べない、うんちが出ないのは、緊急のサインのことがある。すぐ動物病院へ。
summary: |
  ウサギの喜びのサインはビンキー、安心のサインはゴロンと横に寝ること。小さな動きにも、気持ちがあらわれている。
  一方で、食欲がない、うんちが出ない、強い歯ぎしりは、命にかかわることもある。いつもと違うと感じたら、様子見せず、ウサギを診られる動物病院へ。
related: [usagi-gohan, shoudoubutsu-shurui, shoudoubutsu-shippai]
