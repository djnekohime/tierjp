title: クリスマスにペットが危ないもの Tier表
description: チョコ、ケーキ、チキンの骨、ネギ類、飾りつけ（イルミネーション・モール・オーナメント）、ポインセチア、お酒、ラッピング…クリスマスにペットが危ないものを「危険度・起こりやすさ」でS〜Dにランク付け。年末は休診の病院も多いので、事前の備えに。
category: animals
tags: [ペット, 犬, 猫, 年末年始]
published: 2026-10-05
labels:
  S: 命に関わる
  A: 要注意
  B: 気をつけたい
  C: 心がけたい
  D: 小さな落とし穴
criteria: |
  ① 命や健康への危険度
  ② 起こりやすさ（クリスマスならではか）
  ③ 飼い主が防ぎやすいか
  ※ 一般的な注意点の整理です。ペットの種類・体重・体調で、影響は変わります。獣医さんの助言ではなく目安なので、心配なときは、すぐに動物病院に相談してください。年末は、休診の病院が多いので、夜間・救急対応の病院を、事前に調べておくと安心です
rank_notes:
  S: ペットの手の届かない所へ
  D: 気をつけたい小さなこと
tiers:
  S:
    - name: チョコレート（ケーキ・お菓子・プレゼント）
      short: チョコレート
      emoji: "🍫"
      reason: 犬や猫には、中毒を起こす成分が入っている。少量でも、体の小さい子は危ない。包み紙ごと食べてしまうこともある。
    - name: ネギ類（グラタン・シチュー・チキンの付け合わせ）
      short: ネギ類
      emoji: "🧅"
      reason: 玉ねぎ・長ねぎ・にんにくは、犬や猫に中毒の危険がある。加熱しても、危険は残る。ごちそうの取り分けに、注意する。
    - name: 鳥の骨（チキン・ローストの骨）
      short: チキンの骨
      emoji: "🍗"
      reason: 加熱した鳥の骨は、鋭く割れて、のどや腸を傷つけることがある。ごみ箱にも、ふたをして、手の届かない所へ。
    - name: お酒・アルコール入りのお菓子
      short: お酒・アルコール
      emoji: "🍷"
      reason: 少量でも、危険になることがある。グラスや、ケーキの洋酒にも、注意する。
  A:
    - name: ぶどう・レーズン（ケーキ・パン・サラダ）
      short: ぶどう・レーズン
      emoji: "🍇"
      reason: 犬で、腎臓の障害の報告がある。原因ははっきりしないので、少量でも与えない。パンやケーキに入っていることがある。
    - name: キシリトール入りのお菓子・ガム
      short: キシリトール
      emoji: "🍬"
      reason: 犬に、低血糖や肝臓の障害を起こすことがある。バッグや、プレゼントの中身にも、気をつける。
    - name: 生クリーム・脂っこいごちそう
      short: 脂の多いごちそう
      emoji: "🎂"
      reason: 脂肪が多すぎると、膵炎や下痢の原因になることがある。人間用のケーキは、あげない。
    - name: モール・リボン・ひも・ラッピング材
      short: モール・リボン
      emoji: "🎀"
      reason: 特に猫が、じゃれて飲み込むと、腸に詰まる危険がある。ひも状のものは、片づけを徹底する。
  B:
    - name: イルミネーション・電気コード
      short: イルミネーション
      emoji: "💡"
      reason: かじると、感電ややけどの危険がある。コードは、カバーで保護するか、届かない所へ。
    - name: ツリー・オーナメント（ガラス・小さな飾り）
      short: ツリー・オーナメント
      emoji: "🎄"
      reason: 倒れたり、割れたり、飲み込んだりする。ツリーは、固定して、飾りは、高い所につける。
    - name: ポインセチア・ヒイラギなどの植物
      short: ポインセチアなど
      emoji: "🌿"
      reason: かじると、口の周りの炎症や、吐き気の原因になることがある。ペットの届かない場所に置く。
    - name: ろうそく・キャンドル・暖房器具
      short: ろうそく・暖房
      emoji: "🕯️"
      reason: 倒して、やけどや、火事の原因になる。火を使うときは、目を離さない。
  C:
    - name: 来客・パーティーの人の出入り
      short: 来客・パーティー
      emoji: "👥"
      reason: ドアが開いて、脱走したり、音や人の多さで、ストレスを受けたりする。落ち着ける部屋を、用意する。
    - name: 仮装・サンタ帽などのかぶりもの
      short: 仮装・かぶりもの
      emoji: "🎅"
      reason: 嫌がる子には、ストレスになる。短時間で、様子を見ながら。写真のあとは、すぐ外す。
  D:
    - name: クラッカー・パーティーグッズの音
      short: クラッカーの音
      emoji: "🎉"
      reason: 大きな音に驚いて、逃げたり、体調をくずしたりする子もいる。ペットのそばでは、使わない。
    - name: プレゼントの箱・梱包材
      short: 箱・梱包材
      emoji: "📦"
      reason: 中身の小物や、緩衝材を飲み込むことがある。開けたあとは、すぐに片づける。
summary: |
  Sは、「チョコ」「ネギ類」「鳥の骨」「お酒」。ごちそうを囲む場面で、つい取り分けたくなるものほど、危険。
  人間用のごちそうは、あげず、ペット用のケーキやおやつで、一緒にお祝いしよう。年末は休診が増えるので、夜間・救急の病院も、先に調べておくと安心。
related: [food-christmas, pet-oshogatsu-kiken, pet-halloween-kiken]
