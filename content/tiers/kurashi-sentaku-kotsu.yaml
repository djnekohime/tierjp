title: 洗濯のコツ Tier表
description: 洗剤の量、洗濯ネット、乾かし方、部屋干し、柔軟剤…洗濯のコツを、AIが「失敗しにくさ×効果×手軽さ」でS〜Dにランク付け。
category: kurashi
tags:
- 一人暮らし
published: '2026-10-07'
labels:
  S: ぜひ守りたい
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 失敗（縮み・色移り・におい）を防ぐ効果

  ② 衣類を長持ちさせる効果

  ③ 手軽さ

  ※ 衣類の洗濯表示（洗濯マーク）と、洗剤・洗濯機の説明書に従ってください'
rank_notes:
  S: ぜひ守りたい
  D: 失敗しやすい
tiers:
  S:
  - name: 洗濯表示（洗濯マーク）を確認する
    emoji: 🏷️
    reason: 縮みや色落ちの失敗を防げる。水洗いできない服もある。
  - name: 洗濯機に詰め込みすぎない
    emoji: 🧺
    reason: 汚れが落ちにくく、においの原因にも。7〜8割が目安。
  - name: 洗剤は、規定の量を守る
    emoji: 🧴
    reason: 多すぎるとすすぎ残しで、肌荒れやにおいの原因に。
  A:
  - name: 色物と白物を分ける
    emoji: 🎨
    reason: 色移りを防ぐ。新しい色物は、初回は単独で。
  - name: 洗濯ネットを使う（下着・おしゃれ着）
    emoji: 🕸️
    reason: 型崩れや、生地の傷みを防ぐ。
  - name: ポケットの中身を確認
    emoji: 👖
    reason: ティッシュやペンの汚れを防ぐ。
  - name: 洗濯後、すぐ干す
    emoji: ⏱️
    reason: 放置すると、においと雑菌の原因に。
  B:
  - name: 部屋干しは、間隔をあけて風を当てる
    emoji: 🌬️
    reason: 早く乾き、においを防ぐ。扇風機やサーキュレーターが便利。
  - name: 洗濯槽のクリーニングを定期的に
    emoji: 🧼
    reason: カビやにおいを防ぐ。月1回が目安と言われる。
  - name: ぬるま湯で皮脂汚れを落とす
    emoji: 🌡️
    reason: 汗や皮脂が落ちやすい。表示の温度を守る。
  C:
  - name: 柔軟剤を使う
    emoji: 🌸
    reason: 香りと肌ざわりがよくなる。タオルは吸水性が落ちることも。
  - name: 漂白剤を使う
    emoji: ⚪
    reason: 白物の黄ばみに。色柄物には使えないものがある。
  - name: 乾燥機を使う
    emoji: ♨️
    reason: 早く乾くが、縮み・傷みやすい衣類もある。
  D:
  - name: 洗濯物をためて、まとめて洗う
    emoji: 📦
    reason: 詰め込みすぎとにおいの原因に。
  - name: 濡れたまま放置
    emoji: 🚫
    reason: 雑菌が増え、においが取れなくなる。
summary: '洗濯の失敗の多くは、「洗濯表示を見ない」「詰め込みすぎ」「洗剤を入れすぎる」の3つ。S級は、洗濯表示の確認と、洗濯物を入れすぎないこと。

  部屋干しのにおいは、洗濯物の間隔をあけて、風を当てて早く乾かすと防ぎやすい。'
related:
- kurashi-kitchen-dougu
- kurashi-osouji-basho
- kurashi-kaden-kaikae
