title: 猫が活躍する名作キャラクター Tier表
description: ジジ、ドラえもん、ニャンコ先生、チェシャ猫、ネコバス…アニメ・漫画・童話に登場する有名な猫キャラクターを、知名度と愛され度でS〜Dにランク付け。
category: animals
tags: [猫, 動物, 名作]
published: 2026-10-03
labels:
  S: 国民的スター
  A: 大人気
  B: 愛される名脇役
  C: 渋い名キャラ
  D: 知る人ぞ知る
criteria: |
  ① 知名度（世代を超えて知られているか）
  ② 愛され度（グッズやファンの多さ）
  ③ 作品の中での存在感
  ※ 好みで順位は変わります。これはAIが基準を決めて並べた、ひとつの見方です
rank_notes:
  S: 誰もが知っている猫たち
  D: 知っていたらかなりの通
tiers:
  S:
    - name: ドラえもん
      emoji: "🔔"
      reason: 猫型ロボットとして、日本中で知られているキャラクター。世代を超えて愛され、国内外で長く親しまれている。
    - name: ジジ（『魔女の宅急便』）
      short: ジジ
      emoji: "🧹"
      reason: 魔女見習いのキキの相棒の、黒猫。おしゃべり好きで、皮肉まじりの会話がかわいい。黒猫のイメージを代表する存在。
    - name: ネコバス（『となりのトトロ』）
      short: ネコバス
      emoji: "🚌"
      reason: 猫の姿をしたバスという、大胆な発想のキャラクター。登場シーンは短いのに、強いインパクトを残している。
  A:
    - name: ニャンコ先生（『夏目友人帳』）
      short: ニャンコ先生
      emoji: "🍶"
      reason: 招き猫のような姿をした、強い妖怪。丸い体とお酒好きな性格のギャップで人気がある。
    - name: バロン（『猫の恩返し』）
      short: バロン
      emoji: "🎩"
      reason: 紳士的な猫の男爵。気品あるたたずまいと、頼れるやさしさが魅力。物語の鍵を握る存在。
    - name: タマ（『サザエさん』）
      short: タマ
      emoji: "🏠"
      reason: 磯野家の飼い猫。家族の一員として、長く親しまれてきた。家庭のぬくもりを感じさせる存在。
    - name: ニャース（『ポケットモンスター』）
      short: ニャース
      emoji: "💰"
      reason: 人間の言葉を話す猫のポケモン。ロケット団の一員でありながら、憎めない愛嬌で人気者。
    - name: ジバニャン（『妖怪ウォッチ』）
      short: ジバニャン
      emoji: "👻"
      reason: 赤い猫の妖怪で、主人公の友達。ゆるい雰囲気と愛らしい見た目で、子どもたちに大人気になった。
  B:
    - name: ルナ（『美少女戦士セーラームーン』）
      short: ルナ
      emoji: "🌙"
      reason: 月野うさぎをサポートする黒猫。額の三日月が特徴で、作品を支える名脇役。
    - name: トム（『トムとジェリー』）
      short: トム
      emoji: "🐭"
      reason: ネズミのジェリーとの追いかけっこで知られる猫。世界中で長く愛されている、元祖ドタバタ猫。
    - name: ガーフィールド
      emoji: "🍝"
      reason: ラザニア好きで、月曜日が嫌いな、ぐうたら猫。皮肉の効いた性格が、大人にも人気。
    - name: 吾輩（『吾輩は猫である』）
      short: 吾輩
      emoji: "📖"
      reason: 夏目漱石の小説に出てくる、名前のない猫。人間をひややかに観察する視点が、日本文学の名作として知られる。
    - name: ルドルフ（『ルドルフとイッパイアッテナ』）
      short: ルドルフ
      emoji: "🐾"
      reason: 迷子になった飼い猫が、野良猫と出会って成長する物語の主人公。読み継がれている名作児童文学。
  C:
    - name: チェシャ猫（『不思議の国のアリス』）
      short: チェシャ猫
      emoji: "😸"
      reason: ニヤニヤ笑いだけを残して姿を消す、不思議な猫。神秘的で、物語の不思議さを象徴する存在。
    - name: 長靴をはいた猫
      emoji: "👢"
      reason: ペロー童話の猫で、知恵とかけひきで主人を成功に導く。昔話の中でも、頭の良い猫の代表的な存在。
    - name: ダヤン
      emoji: "🌍"
      reason: 作家・池田あきこさんのキャラクターで、別世界を旅する猫。幻想的な世界観にファンが多い。
  D:
    - name: 童話や昔話の化け猫たち
      short: 化け猫
      emoji: "🦊"
      reason: 日本の昔話や怪談には、猫又や化け猫の話がたくさん出てくる。かわいい猫とは違う、猫の神秘的な一面を伝えてきた存在。
summary: |
  猫キャラクターの頂点は、国民的な知名度のドラえもんと、猫文化を象徴するジジ。アニメやゲーム、童話や文学まで、猫は昔からたくさんの物語に登場してきた。
  ジャンルがばらばらでも、猫には「気まぐれ」「ふしぎ」「頼れる相棒」のイメージがつきまとう。あなたの推し猫キャラは何ランク？ ぜひ一言コメントで教えてね。
related: [neko-keiro, neko-omocha, neko-aijo]
