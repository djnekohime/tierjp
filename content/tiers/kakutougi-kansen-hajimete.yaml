summary: '格闘技観戦は、「ルールをざっくり知る」だけで、ぐっと面白くなる。S級は、観たい競技のルールを軽く確認することと、気になる選手を1人決めること。

  応援したい選手がいると、試合の一瞬一瞬が自分ごとになる。'
