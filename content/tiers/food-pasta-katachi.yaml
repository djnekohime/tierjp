title: パスタの形 Tier表
description: スパゲッティ、ペンネ、フェットチーネ、リングイネ、ファルファッレ、フジッリ、ラザニア、ニョッキ…パスタの形を、AIが「使いやすさ×食感の楽しさ×ソースとの相性」でランク付け。
category: food
genre: 麺・粉もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 家でも使いやすいか（手に入りやすさ・ゆでやすさ）
  ② 食感の楽しさ
  ③ いろいろなソースとの相性
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: どんなソースにも合う万能選手
  D: 知ると料理が楽しくなる個性派
tiers:
  S:
    - name: スパゲッティ
      emoji: "🍝"
      reason: 日本で一番なじみのある細長いパスタ。ミートソースからたらこまで、どんなソースにも合う万能選手。
    - name: ペンネ
      emoji: "🖊️"
      reason: 斜めに切ったペン先の形の短いパスタ。筒の中にソースが入り、アラビアータやグラタンにぴったり。
    - name: フェットチーネ
      emoji: "🎀"
      reason: 平たく幅広いパスタ。クリームソースがよくからみ、もちもちの食感。
  A:
    - name: リングイネ
      emoji: "🌊"
      reason: 断面が楕円形のパスタ。ジェノベーゼや魚介のソースと相性がいい。
    - name: ファルファッレ
      emoji: "🦋"
      reason: 蝶の形のかわいいパスタ。サラダやスープに入れると見た目が楽しい。
    - name: フジッリ
      emoji: "🌀"
      reason: らせん状のパスタ。溝にソースがよくからみ、パスタサラダにも使いやすい。
    - name: マカロニ
      emoji: "🥫"
      reason: グラタンやマカロニサラダでおなじみの短い筒状のパスタ。日本の家庭料理にすっかり定着している。
    - name: ラザニア
      emoji: "🧱"
      reason: 板状のパスタとミートソース、ホワイトソースを重ねて焼く。ごちそう感たっぷりの料理になる。
  B:
    - name: カッペリーニ
      emoji: "🪡"
      reason: 極細のパスタ。冷製パスタにすると、そうめんのようにさっぱり食べられる。
    - name: ニョッキ
      emoji: "🥔"
      reason: じゃがいもと小麦粉で作る、もちもちの団子のようなパスタ。
    - name: タリアテッレ
      emoji: "🟨"
      reason: 卵を使った平打ちパスタ。ボロネーゼとの組み合わせが本場の定番。
    - name: リガトーニ
      emoji: "🟫"
      reason: 太い筒状で表面に筋があるパスタ。濃厚なソースをしっかり受け止める。
    - name: コンキリエ
      emoji: "🐚"
      reason: 貝殻の形のパスタ。くぼみにソースがたまって、一口ごとに味がする。
  C:
    - name: ブカティーニ
      emoji: "🕳️"
      reason: 真ん中に穴の開いた太いスパゲッティ。アマトリチャーナの定番だが、日本ではあまり見かけない。
    - name: オレキエッテ
      emoji: "👂"
      reason: 「小さな耳」という意味の、くぼみのある形のパスタ。南イタリアの郷土の味。
  D:
    - name: トルテッリーニ
      emoji: "💍"
      reason: 具を包んで指輪のような形にしたパスタ。スープに入れて食べる、イタリア・ボローニャの伝統の味。
    - name: パッケリ
      emoji: "🔵"
      reason: 大きな筒状のパスタ。食べごたえがあり、魚介のトマトソースでよく使われる、通好みの形。
summary: |
  パスタの形は、スパゲッティ・ペンネ・フェットチーネがS。形によって、からむソースの量や食感がまったく変わる。
  イタリアには数百種類ものパスタの形があるといわれる。ソースに合わせて形を選べるようになると、家のパスタが一気に本格的になる。
related: [food-pasta-aji, food-udon]
