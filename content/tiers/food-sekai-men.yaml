title: 世界の麺料理 Tier表
description: パッタイ、フォー、ラグマン、ボロネーゼ、ジャージャー麺、冷麺、ラクサ、ビーフン、トムヤムヌードル、ビリヤニ風焼きそば、ナシゴレン風ミーゴレン…世界の麺料理を、AIが「おいしさ×食べやすさ×また食べたい度」でランク付け。
