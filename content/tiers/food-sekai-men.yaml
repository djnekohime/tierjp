rank_notes:
  S: 世界の麺の三大スター
  D: 通好み
tiers:
  S:
  - name: パッタイ
    emoji: 🍜
    reason: タイの甘酸っぱい焼きそば。ピーナッツとライムが、クセになる。
  - name: フォー
    emoji: 🥣
    reason: ベトナムの米粉麺。やさしいスープで、ハーブと一緒に。
  - name: ボロネーゼ
    emoji: 🍝
    reason: イタリアの肉ソースパスタ。世界中で愛される味。
  A:
  - name: 冷麺
    emoji: 🧊
    reason: 韓国の、コシの強い冷たい麺。夏に食べたくなる。
  - name: ジャージャー麺
    emoji: 🥢
    reason: 肉味噌をのせて、混ぜて食べる。中国の味。
  - name: ラクサ
    emoji: 🥥
    reason: シンガポールやマレーシアの、ココナッツミルクのカレー麺。
  - name: ビーフン
    emoji: 🍚
    reason: 米粉でできた細い麺。炒めても、スープでも。
  - name: トムヤムヌードル
    emoji: 🌶️
    reason: 酸っぱくて辛い、タイのスープ麺。
  B:
  - name: ミーゴレン
    emoji: 🍳
    reason: インドネシアの焼きそば。甘辛い味つけ。
  - name: ラグマン
    emoji: 🍖
    reason: 中央アジアの、羊肉と野菜の手延べ麺。
  - name: 担々麺
    emoji: 🥜
    reason: 四川の、ごまとラー油のスープ麺。
  - name: カオソーイ
    emoji: 🍛
    reason: タイ北部の、カレー風味の麺。
  C:
  - name: ヤムウンセン
    emoji: 🥗
    reason: タイの春雨サラダ。麺料理というより、前菜。
  - name: ビビン麺
    emoji: 🌶️
    reason: コチュジャンの甘辛さで和える、韓国の麺。
  D:
  - name: ブン・チャー
    emoji: 🥬
    reason: ベトナムの、焼き肉と一緒に食べるつけ麺。通好み。
  - name: モヒンガー
    emoji: 🐟
    reason: ミャンマーの、魚のスープの麺。
summary: '世界の麺料理は、パッタイ・フォー・ボロネーゼがS。タイ、ベトナム、イタリア。日本でも食べやすくて、人気の3つ。

  同じ麺でも、国によって味つけも食べ方もまったく違う。旅するように食べ比べてみてほしい。

  '
