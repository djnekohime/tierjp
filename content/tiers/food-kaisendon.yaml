title: 丼にしたい海鮮 Tier表
description: まぐろ、サーモン、いくら、うに、ねぎとろ、ほたて、甘えび、しらす…海鮮丼にのせたいネタを、AIが「丼にしたときのおいしさ×ご飯との相性×豪華さ」でランク付け。
category: food
genre: 寿司・海鮮
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 海鮮丼にのっていたらうれしい度
  ② 温かいご飯・酢飯との相性
  ③ 丼の見た目の豪華さ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 海鮮丼の三大スター
  D: 港町で出会いたい一品
tiers:
  S:
    - name: いくら
      emoji: "🔴"
      reason: ご飯の上にこぼれるほどのせた「いくら丼」は、海鮮丼の王様。北海道の朝市の名物としても知られる。
    - name: まぐろ
      emoji: "🐟"
      reason: 赤身・中トロ・大トロと部位で楽しめる。まぐろだけの「鉄火丼」も定番。
    - name: うに
      emoji: "🟡"
      reason: ご飯の上一面にうにを敷きつめた「うに丼」は一生に一度は食べたいごちそう。
  A:
    - name: サーモン
      emoji: "🍣"
      reason: とろける脂でご飯がすすむ。いくらと合わせた「親子丼」は、見た目も華やか。
    - name: ねぎとろ
      emoji: "🟣"
      reason: やわらかいまぐろのたたきとねぎ。手ごろな値段でたっぷり食べられる。
    - name: ほたて
      emoji: "🐚"
      reason: 甘くてやわらかい身。北海道や青森など、ほたての産地の丼は格別。
    - name: 甘えび
      emoji: "🦐"
      reason: ねっとりした甘さ。丼の色どりを華やかにしてくれる。
    - name: かに
      emoji: "🦀"
      reason: ほぐしたかにの身をたっぷりのせた「かに丼」は、冬のごちそう。
  B:
    - name: しらす
      emoji: "✨"
      reason: 生しらすや釜揚げしらすを山盛りにした「しらす丼」は、湘南などの港町の名物。
    - name: ぶり・はまち
      short: ぶり
      emoji: "🐠"
      reason: 脂ののったぶりを漬けにした「漬け丼」は、ご飯との相性が抜群。
    - name: いか
      emoji: "🦑"
      reason: 細切りのいかそうめんは、しょうがじょうゆでさっぱりと。函館などで人気。
    - name: たい
      emoji: "🎏"
      reason: 上品な白身を、ごまだれに漬けた「鯛茶漬け」風にするとおいしい。
    - name: あじ
      emoji: "🌊"
      reason: たたきにしてねぎやしょうがと合わせた「あじ丼」は、さっぱりしてさわやか。
  C:
    - name: 数の子
      emoji: "🟨"
      reason: コリコリした食感がアクセントになるが、主役にはなりにくい。
    - name: 穴子
      emoji: "🐍"
      reason: 甘いたれの煮穴子は、刺身の海鮮丼とは別の「穴子丼」として楽しみたい。
  D:
    - name: とびこ・とびっこ
      short: とびこ
      emoji: "🟠"
      reason: プチプチ食感で色どりを添える名脇役。単独で丼にするより、ちらすと映える。
    - name: 白魚（しらうお）
      short: 白魚
      emoji: "⚪"
      reason: 春の短い時期だけ出会える、透き通った小魚。港町の季節限定の丼は、旅のいい思い出になる。
summary: |
  海鮮丼にのせたいネタは、いくら・まぐろ・うにがS。どれか一つをたっぷりのせた単品丼も、いろいろ盛った海鮮丼も、どちらもごちそう。
  湘南のしらす丼、函館のいかそうめん丼、北海道のいくら丼のように、港町ごとの名物丼を食べ歩くのは旅の大きな楽しみ。
related: [food-don, food-sushi-neta, food-gunkan]
