title: ドーナツの種類 Tier表
description: オールドファッション、ポン・デ・リング型のもちもちドーナツ、チョコドーナツ、フレンチクルーラー、ハニーディップ、ボストンクリーム…ドーナツの種類を、AIが「食べたい度×食感の楽しさ」でランク付け。
category: food
genre: スイーツ
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① ドーナツ屋さんで「まずこれ」と思える人気
  ② 食感の楽しさ
  ③ コーヒーや紅茶との相性
  ※ 特定の商品ではなく「ドーナツの種類」のランキングです
rank_notes:
  S: ドーナツの三大定番
tiers:
  S:
    - name: もちもち食感のリングドーナツ
      short: もちもちリング
      emoji: "⭕"
      reason: 小さな玉がつながった輪っかの形の、もちもち食感のドーナツ。ちぎって食べる楽しさもあり、日本で大人気になった。
    - name: オールドファッション
      emoji: "🍩"
      reason: 表面のひび割れがサクッとした、しっかりした生地のケーキドーナツ。コーヒーとの相性は抜群。
    - name: チョコがけドーナツ
      short: チョコドーナツ
      emoji: "🍫"
      reason: チョコレートをたっぷりコーティングした定番。カラフルなスプレーがかかっていると気分が上がる。
  A:
    - name: フレンチクルーラー
      emoji: "🌀"
      reason: ふわっと軽く、口の中でしゅわっと溶ける食感。何個でも食べられそう。
    - name: ハニーディップ（グレーズド）
      short: ハニーディップ
      emoji: "🍯"
      reason: 甘いシロップをまとったふわふわのイーストドーナツ。シンプルだからこそ飽きない。
    - name: ボストンクリーム（カスタード入り）
      short: カスタード入り
      emoji: "🟡"
      reason: 中にカスタードがたっぷり、上にチョコ。ボリュームのあるごほうびドーナツ。
    - name: エンゼルクリーム
      emoji: "☁️"
      reason: ふわふわの生地にホイップクリームを詰めた、軽くて甘いドーナツ。
    - name: いちごチョコドーナツ
      short: いちごチョコ
      emoji: "🍓"
      reason: ピンクのいちごチョコでコーティング。見た目のかわいさで子供に大人気。
  B:
    - name: きなこドーナツ
      emoji: "🟤"
      reason: きなこをたっぷりまぶした和風ドーナツ。懐かしいやさしい味。
    - name: シュガードーナツ
      emoji: "🤍"
      reason: 砂糖をまぶしただけのシンプルなドーナツ。家で作るドーナツの定番。
    - name: あんドーナツ
      emoji: "🫘"
      reason: 揚げたパン生地にあんこ。パン屋さんでもおなじみ。
    - name: 抹茶ドーナツ
      emoji: "🍵"
      reason: ほろ苦い抹茶の味。和スイーツ好きに人気。
    - name: ベーグル型のドーナツ（クリームチーズ）
      short: クリームチーズ系
      emoji: "🧀"
      reason: クリームチーズを使った、甘さ控えめの大人のドーナツ。
  C:
    - name: おからドーナツ
      emoji: "🌱"
      reason: おからを使ったヘルシーなドーナツ。やさしい味だが、華やかさは控えめ。
    - name: 焼きドーナツ
      emoji: "🟫"
      reason: 揚げずにオーブンで焼いたドーナツ。軽くて食べやすいが、揚げドーナツ派からは物足りない声も。
  D:
    - name: クロナッツ（クロワッサンドーナツ）
      short: クロナッツ
      emoji: "🥐"
      reason: クロワッサン生地を揚げた、ニューヨーク発のドーナツ。サクサクの層が重なる贅沢な食感。
    - name: ベニエ
      emoji: "⚜️"
      reason: アメリカ・ニューオーリンズ名物の、粉砂糖をたっぷりかけた四角い揚げ菓子。
summary: |
  ドーナツは、もちもちリング・オールドファッション・チョコドーナツがS。サクッ、ふわっ、もちっと、生地によって食感がまったく違うのがドーナツの楽しさ。
  きなこや抹茶の和風ドーナツ、ニューヨークのクロナッツのように、世界中でいろいろなドーナツが生まれている。
related: [food-kashipan, food-cake]
