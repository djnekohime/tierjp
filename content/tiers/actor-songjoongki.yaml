title: ソン・ジュンギ出演作 Tier表
description: ヴィンチェンツォ、太陽の末裔、財閥家の末息子…ソン・ジュンギの出演ドラマ・映画を、AIが「作品の面白さ×ソン・ジュンギの魅力」でランク付け。
category: kanryu
tags: [韓国ドラマ, 俳優, ソン・ジュンギ]
published: 2026-09-29
criteria: |
  ① 作品そのものの面白さ
  ② ソン・ジュンギの魅力が最大限に出ているか
  ③ ファンでない人にもすすめられるか
  ※ ドラマと映画の両方を対象、バラエティも含む
rank_notes:
  S: ソン・ジュンギにしかできない役
tiers:
  S:
    - name: ヴィンチェンツォ（2021）
      emoji: "🍷"
      reason: イタリアマフィアの顧問弁護士役。スーツ姿のかっこよさ、冷酷さ、コミカルさを自在に行き来する演技は、ソン・ジュンギの集大成。
  A:
    - name: 太陽の末裔 Love Under The Sun（2016）
      short: 太陽の末裔
      emoji: "🪖"
      reason: ソン・ヘギョと共演。特殊部隊の大尉役で、韓国で社会現象になるほどの大ヒット。名セリフの数々で「国民的彼氏」に。
    - name: 財閥家の末息子（2022）
      emoji: "💼"
      reason: 財閥の末息子に生まれ変わった男の復讐劇。展開の速さと、ソン・ジュンギの静かな迫力で一気見必至。結末は好みが分かれる。
    - name: 優しい男（2012）
      emoji: "🖤"
      reason: ムン・チェウォン、パク・シヨンと共演。愛のために人生を捨てた男の復讐メロドラマ。それまでの爽やかなイメージを覆した転機の作品。
    - name: '私のオオカミ少年（2012）'
      emoji: "🐺"
      reason: 'パク・ボヨンと共演した映画。言葉を話せない不思議な少年役で、セリフほぼなしで観客を泣かせた。ソン・ジュンギの演技力を知らしめた作品。'
  B:
    - name: 成均館スキャンダル（2010）
      emoji: "📜"
      reason: パク・ミニョン、ユチョン、ユ・アインと共演。遊び人のク・ヨンハ役で人気を集めた。主演ではないが、ブレイクのきっかけとなった作品。
    - name: '根の深い木（2011）'
      emoji: "🌳"
      reason: 'ハン・ソッキュ主演の時代劇ドラマで、若き日の世宗（セジョン）を演じた。短い出演ながら強い印象を残した。'
    - name: '軍艦島（2017）'
      emoji: "⛴️"
      reason: 'ファン・ジョンミンらと共演した映画。独立軍の工作員役で、カリスマ性のある演技を見せた。'
    - name: 'スペース・スウィーパーズ（2021）'
      emoji: "🛸"
      reason: 'キム・テリと共演した韓国初の本格宇宙SF映画。宇宙のゴミを回収する船のパイロット役。映像のスケールが見どころ。'
    - name: 'このろくでもない世界で（2023）'
      emoji: "🌆"
      reason: '裏社会で生きる男チゴンを演じた映画。これまでの華やかなイメージを捨てた、重く静かな演技が評価された。'
    - name: 'マイ・ユース（2025）'
      emoji: "🌱"
      reason: 'チョン・ウヒと共演したドラマ。子役出身で、借金を返すために20代を費やした男性が、初恋の人と再会する大人のロマンス。'
  C:
    - name: アスダル年代記（2019）
      emoji: "🗿"
      reason: チャン・ドンゴン、キム・ジウォンと共演。古代の架空の大陸を舞台にした壮大なファンタジー。スケールは大きいが、世界観が複雑で入り込むまでに時間がかかる。
    - name: 'ボゴタ（2024）'
      emoji: "🌎"
      reason: '南米コロンビアのボゴタで成功を目指す韓国人移民の青年を演じた犯罪ドラマ映画。異国の地での生き残りを描く。'
    - name: 'トリプル（2009）'
      emoji: "⛸️"
      reason: 'フィギュアスケートを題材にしたドラマ。デビュー初期の作品で、今の姿と比べると新鮮。'
    - name: 'ランニングマン（2010）'
      emoji: "🏃"
      reason: '人気バラエティ番組の初期メンバーとして出演。ドラマとは違う、素の明るさや負けず嫌いな一面が見られる。'
summary: |
  ソン・ジュンギは、優しい笑顔と冷たい眼差しを一瞬で切り替えられる俳優。その両方を味わえるヴィンチェンツォが文句なしのS。
  爽やかな彼が見たいなら太陽の末裔、影のある彼が見たいなら優しい男。同じ俳優とは思えない振り幅を楽しんで。
related: [kandrama-suspense, kandrama-2020s]
