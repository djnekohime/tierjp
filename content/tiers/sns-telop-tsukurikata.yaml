title: ショート動画の字幕（テロップ）の付け方 Tier表
description: 文字サイズ、色の選び方、表示時間、改行、位置…ショート動画で見やすい字幕（テロップ）の付け方を、ゾーマが「読みやすさ×伝わりやすさ×作りやすさ」でS〜Dにランク付け。
category: sns
tags:
- SNS
- 動画
- 初心者
published: '2026-11-02'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 読みやすさ

  ② 伝わりやすさ

  ③ 作りやすさ

  ※ 表示される画面サイズやUIは、アプリや端末ごとに違います。実際にスマホで確認してください。素材の権利には注意してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: スマホで読める大きさにする
    emoji: 📱
    reason: 小さな画面でも読めることが最優先。見えなければ意味がない。
  - name: 背景と文字の色をはっきり分ける
    emoji: 🎨
    reason: 読みやすさの基本。縁取りや影を付けると、背景が明るくても読める。
  - name: 画面の上下の端を避けて、中央寄りに置く
    emoji: 📐
    reason: アプリのボタンや説明文に隠れにくい。
  A:
  - name: 1行12〜15文字、2行までにまとめる
    emoji: ✂️
    reason: 一目で読み切れる量。長いと次の場面へ進んでしまう。
  - name: 音声に合わせて表示するタイミングを調整する
    emoji: ⏱️
    reason: 話と文字がずれないと、理解しやすい。
  - name: 強調したい言葉だけ色や大きさを変える
    emoji: ✨
    reason: 大事なポイントが目に入り、伝わりやすい。
  - name: はっきりした読みやすいフォントを選ぶ
    emoji: 🔤
    reason: 飾りの強いフォントは、小さい画面で読みにくい。
  B:
  - name: 文字は固定で、同じ位置に表示する
    emoji: 📍
    reason: 視線が動かず、安定して読める。
  - name: 言葉の区切りで改行する
    emoji: ↩️
    reason: 意味が自然に伝わり、読み間違いが減る。
  - name: テンプレートを作って使い回す
    emoji: 📋
    reason: 作業が速くなり、チャンネルの統一感も出る。
  - name: 効果音と合わせて文字を出す
    emoji: 🔊
    reason: リズムが出て、見ていて楽しい。
  - name: 最初の3秒で、いちばん伝えたい文字を出す
    emoji: 🎯
    reason: 見続けるか判断される時間。内容が伝わると離脱を防げる。
  C:
  - name: 文字を動かす演出を多用する
    emoji: 🎞️
    reason: 目を引くが、読みにくくなることも。ここぞの場面だけで。
  - name: 色を3色以上使う
    emoji: 🌈
    reason: にぎやかだが、統一感が出にくく、読みづらい。
  - name: 長文を一度に表示する
    emoji: 📄
    reason: 情報量は多いが、読み切れず離脱しやすい。
  D:
  - name: 小さな文字で、画面の端に置く
    emoji: 🔎
    reason: 読めない・隠れる。字幕の意味がなくなる。
  - name: 背景と似た色の文字を使う
    emoji: 🌫️
    reason: 見えにくく、読んでもらえない。
  - name: 文字を出す時間が短すぎる
    emoji: 💨
    reason: 読み切る前に消えてしまう。ストレスになる。
  - name: 他人の動画や素材を無断で使う
    emoji: 🚫
    reason: 権利の問題になる。自分で作った素材か、利用許可のあるものを使う。
summary: 'ショート動画は、音を出さずに見る人が多い。だから、字幕は内容を伝える大事な要素。S級は、読みやすい大きさ、背景とはっきり分かれる色、画面の安全な位置。この3つが基本。

  一度に表示する文字数は少なめに。長い文章を一気に出すと、読み切れずに次の場面へ進んでしまう。1行12〜15文字くらい、2行までを目安にすると読みやすい。

  アプリの上下には、ボタンや投稿者名、説明文などが重なる。大事な字幕は、上下の端を避けて、画面の中央寄りに置くと隠れにくい。

  強調したい言葉だけ色を変えたり、少し大きくするのも効果的。ただし、色を使いすぎると、かえって読みにくくなる。

  作った字幕は、実際にスマホで再生して確認すること。パソコンで見ると読みやすくても、小さな画面では読めないことがある。テンプレートを決めておくと、毎回の作業が速くなり、チャンネルの個性にもなる。

  投稿後は、再生維持率（どこで離れたか）を見て、字幕の量や出すタイミングを微調整しよう。1本ごとに少しずつ改善していくと、数本後には自分の「勝ちパターン」が見えてくる。

  字幕は、動画の内容を伝える最後の仕上げ。大きく、はっきり、短く、の3つを意識するだけで、見てもらえる確率が上がる。まずは次の1本で、「画面の中央寄りに、12〜15文字」を試してみてほしい。

  字幕を付けると、音を出せない電車や職場でも内容が伝わる。見る人の状況を想像しながら作るのが、いちばんの上達法。'
