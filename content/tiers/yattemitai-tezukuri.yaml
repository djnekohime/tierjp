title: 手作り体験・ものづくり Tier表
description: 陶芸、革細工、刺繍、編み物、キャンドル、レジン、ガラス細工、金継ぎ、藍染、手作り石けん…やってみたい手作り体験を「始めやすさ・完成の満足感」でS〜Dにランク付け。
category: yattemitai
tags: [挑戦, 初心者]
published: 2026-10-05
labels:
  S: 気軽に始められる
  A: 満足感が高い
  B: 道具や場所が必要
  C: 本格的
  D: 上級者向け
criteria: |
  ① 始めやすさ（費用・道具・準備）
  ② 短時間で形になるか（初心者でも完成させやすいか）
  ③ 完成したものへの満足感
  ※ 体験教室や、材料キットで、気軽に試すのがおすすめです。火や刃物、薬品を使うものは、安全のルールを、守ってください。内容や費用は、教室や地域で違います
rank_notes:
  S: 材料キットや体験で、すぐ始められる
  D: 習得に時間と道具が必要
tiers:
  S:
    - name: 刺繍（ししゅう）
      emoji: "🧵"
      reason: 針と糸、布があれば始められる。小さなワンポイントから、ブローチやポーチまで、完成させやすい。
    - name: キャンドル作り
      emoji: "🕯️"
      reason: 体験教室や、材料キットが手に入りやすい。香りや色を選ぶ楽しさがある。火や、熱いろうの扱いに、注意する。
    - name: 紙もの・カード・スタンプ作り
      short: 紙もの・スタンプ
      emoji: "💌"
      reason: 道具も安価で、すぐ始められる。贈り物にも使いやすい。
  A:
    - name: 編み物（かぎ針・棒針）
      short: 編み物
      emoji: "🧶"
      reason: 道具が少なく、続けやすい。編みながら、時間が過ぎていく楽しさがある。完成までは、少し時間がかかる。
    - name: 陶芸（手びねり・ろくろ体験）
      short: 陶芸
      emoji: "🏺"
      reason: 体験教室で、気軽に試せる。自分の器で、ごはんを食べる楽しみは、格別。焼き上がりまでに、時間がかかる。
    - name: 革細工（レザークラフト）
      short: 革細工
      emoji: "👜"
      reason: 小物なら、キットで初心者でも作りやすい。使うほどに、味が出る。
    - name: 手作り石けん
      short: 手作り石けん
      emoji: "🧼"
      reason: 材料の準備が、比較的簡単。肌につけるものなので、材料と、作り方を、よく確認する。
    - name: ガラス細工（ビーズ・とんぼ玉など）
      short: ガラス細工
      emoji: "🔮"
      reason: きらきらした作品が、できあがる。体験教室で、火や道具を安全に使える。
  B:
    - name: レジン・UVレジンのアクセサリー作り
      short: レジン
      emoji: "💎"
      reason: 短時間で、かわいいアクセサリーが作れる。換気と、手袋など、安全のための準備が必要。
    - name: 藍染・草木染め
      short: 藍染・草木染め
      emoji: "🔵"
      reason: 日本の伝統的な染め物。体験で、ハンカチなどを染められる。道具と場所が必要。
    - name: 木工・DIY
      short: 木工・DIY
      emoji: "🪵"
      reason: 家具や小物を作る楽しさがある。道具と、作業する場所が必要で、安全にも気をつける。
    - name: 織物（ミニ織り機・さをり織り）
      short: 織物
      emoji: "🧣"
      reason: 手織りの温もりがある。道具が、少し必要。
    - name: 金継ぎ
      emoji: "🏵️"
      reason: 割れた器を、金などで修復する伝統技法。道具と材料が、少し特殊で、体験教室で学ぶのが近道。
  C:
    - name: 吹きガラス
      emoji: "🫧"
      reason: 熱い炉を使うので、教室や工房で体験するもの。完成した作品は、特別な思い出になる。
    - name: 染めと織りの本格的な工芸
      short: 本格的な工芸
      emoji: "🏯"
      reason: 習得に、時間がかかる。職人さんの教室で、基本から学ぶ。
    - name: 漆（うるし）の工芸
      short: 漆の工芸
      emoji: "🖌️"
      reason: 肌がかぶれることがあり、扱いに専門知識が必要。体験教室で、まず試してみる。
  D:
    - name: 金属の鋳造・鍛冶
      short: 鋳造・鍛冶
      emoji: "⚒️"
      reason: 高温の炉や、重い道具を使うので、専門的な安全管理が必要。体験できる工房で、指導を受けるのが前提。
    - name: 本格的な製陶（自前の窯を持つ）
      short: 自前の窯
      emoji: "🔥"
      reason: 設備と、技術、安全のための設置条件が必要。まずは、陶芸体験や教室で、楽しむのがおすすめ。
summary: |
  手作りのはじめのSは、「刺繍」「キャンドル作り」「紙もの・スタンプ」。道具が少なく、短時間で形になるので、はじめの一歩に向いている。
  気になるものがあれば、まず体験教室や、材料キットで、気軽に試してみよう。作ったものを、使ったり、贈ったりすると、ものづくりの楽しさが、もっと広がる。
related: [yattemitai-hitori, yattemitai-shumatsu, yattemitai-life]
