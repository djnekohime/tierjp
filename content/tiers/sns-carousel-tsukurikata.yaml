title: カルーセル（複数枚）投稿の作り方 Tier表
description: 1枚目で引きつける、1枚1メッセージ、最後に保存を促す、文字だらけ、写真を詰め込むだけ…Instagramなどのカルーセル投稿の作り方を、ゾーマが「見られやすさ×保存されやすさ×作りやすさ」でS〜Dにランク付け。
category: sns
tags:
- SNS
- 初心者
published: '2026-11-26'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 見られやすさ（最後までスワイプされるか）

  ② 保存・シェアされやすさ

  ③ 作りやすさ（続けられる手間か）

  ※ Instagramのカルーセルは、現在は1投稿に写真・動画を最大20枚まで入れられます（2024年に10枚から拡大）。仕様は変わることがあるので最新の案内を確認してください。ランクは一般的な目安です'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 1枚目で、何が分かる投稿かを一言で伝える
    emoji: 🎯
    reason: 表紙で「自分に関係ある」と思ってもらえれば、スワイプされる。
  - name: 1枚に1つのメッセージにする
    emoji: ☝️
    reason: 短い言葉と大きな文字は、スマホで読みやすい。
  - name: 最後の1枚で、保存・フォローをやさしく促す
    emoji: 🔖
    reason: 「あとで見返すなら保存してね」の一言で行動につながる。
  A:
  - name: デザインのテンプレートを決めて統一する
    emoji: 🎨
    reason: 作業が速くなり、アカウントの雰囲気もそろう。
  - name: 2枚目に「続きを見たくなる」内容を置く
    emoji: 👉
    reason: 1枚目の次で離脱されないための工夫。
  - name: 枚数は、内容に合わせて絞る
    emoji: ✂️
    reason: 最大20枚でも、伝わるなら5枚で十分。
  - name: 手順・比較・まとめなど、見返したくなる内容にする
    emoji: 📋
    reason: 保存されやすい内容は、カルーセルと相性がいい。
  - name: 文字は大きく、1枚の文字数を少なく
    emoji: 🔠
    reason: 小さな画面でも、ひと目で読める。
  B:
  - name: 写真と文字の画像を組み合わせる
    emoji: 🖼️
    reason: 雰囲気と情報の両方が伝わる。
  - name: キャプションで補足する
    emoji: ✍️
    reason: 画像に入りきらない説明を、文章で足せる。
  - name: 画像の比率をそろえる
    emoji: 📐
    reason: サイズがばらばらだと、見た目が崩れやすい。
  - name: シリーズ化して、毎回同じ型で作る
    emoji: 🔁
    reason: 作るのが楽になり、続けて見てくれる人も増える。
  C:
  - name: 1枚に、びっしり文字を書く
    emoji: 📜
    reason: スマホでは読みにくく、途中で離脱されやすい。
  - name: 写真をただ詰め込むだけ
    emoji: 🗂️
    reason: 日常の記録にはいいが、多くの人に届けるには流れが弱い。
  - name: 毎回デザインを一から考える
    emoji: ⏰
    reason: 時間がかかりすぎて、投稿が続かなくなる。
  D:
  - name: 他人の画像や文章を、無断で使う
    emoji: 🚫
    reason: 著作権の問題になり、信頼も失う。
  - name: 1枚目と中身が違う、大げさな表紙にする
    emoji: 🎭
    reason: がっかりされ、フォローを外される原因に。
  - name: 個人情報が写り込んだ画像をそのまま使う
    emoji: 🔓
    reason: 住所・顔・車のナンバーなど、投稿前に確認を。
summary: 'カルーセル投稿は、1つの投稿に複数の写真や画像を入れて、横にスワイプして見てもらう形式。Instagramでは、1投稿に最大20枚まで入れられるようになった（2024年に10枚から拡大）。ショート動画が人気の今でも、カルーセルは「保存」されやすい形式として強い。まとめ情報、手順、比較、ランキングなど、あとで見返したくなる内容と相性がいいからだ。

  S級は「1枚目で、何が分かる投稿かを一言で伝える」「1枚に1つのメッセージにする」「最後の1枚で、保存やフォローをやさしく促す」。1枚目は、雑誌の表紙のようなもの。ここで「自分に関係ある」と思ってもらえないと、スワイプしてもらえない。2枚目以降は、1枚に言いたいことを1つだけ。文字を詰め込むより、短い言葉と大きな文字のほうが、スマホでは読みやすい。

  A級は、デザインのテンプレートを決めて統一する、2枚目に「続きを見たくなる」内容を置く、枚数を内容に合わせて絞る、など。テンプレートがあれば、色やフォントを毎回考えなくてよく、作業時間がぐっと短くなる。アカウントの雰囲気もそろって、見た人に覚えてもらいやすい。枚数は、多ければいいわけではない。20枚入れられても、伝えたいことが5枚で伝わるなら5枚でいい。

  B級は、写真と文字の画像を組み合わせる、キャプションで補足する、など。C級は、1枚にびっしり文字を書くこと、写真をただ詰め込むだけの投稿。日常の「写真の詰め合わせ」もSNSの楽しみ方の一つだが、たくさんの人に見てもらいたいなら、順番と流れを考えたい。D級は「他人の画像や文章を無断で使う」「1枚目と中身が違う、大げさな表紙」。信頼を失うと、フォロワーは戻ってこない。

  作り方のおすすめの流れは、①伝えたいことを箇条書きにする ②1枚目の一言を決める ③1枚1項目で並べる ④最後にまとめと一言。これを型にしておけば、毎回同じ手順で作れて、シリーズ化もしやすい。たとえば「Tier表をカルーセルで1ランクずつ見せる」のも、相性のいい使い方だ。あなたのS級のコツは、どれ？'
