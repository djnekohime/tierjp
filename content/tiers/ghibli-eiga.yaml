title: スタジオジブリの長編映画 Tier表
description: となりのトトロ、千と千尋の神隠し、もののけ姫、魔女の宅急便、耳をすませば…スタジオジブリの長編映画を、「何度も見たい度・知名度・世代を超えた愛され度」でS〜Dにランク付け。
category: entame
tags: [名作, 映画, ジブリ]
published: 2026-10-05
labels:
  S: 殿堂入り
  A: 大人気
  B: 名作
  C: 渋い名作
  D: 通好み
criteria: |
  ① 何度も見たくなる度
  ② 知名度・世代を超えた愛され度
  ③ 作品の印象の強さ（映像・音楽・物語）
  ※ 好みで順位は大きく変わります。ストーリーの結末などは書いていません。これは、AIが基準を決めて並べた、ひとつの見方です。どの作品にも、それぞれの良さがあります
rank_notes:
  S: 何度見ても好き
  D: 好きな人は、とことん好き
tiers:
  S:
    - name: となりのトトロ
      emoji: "🌳"
      reason: 子どもから大人まで、世代を超えて愛される作品。田舎の暮らしと、不思議な生き物との出会いを描いた、やさしい世界観が魅力。
    - name: 千と千尋の神隠し
      short: 千と千尋
      emoji: "🏮"
      reason: 不思議な世界に迷い込んだ少女の物語。海外でも高く評価され、アカデミー賞の長編アニメーション賞を受賞した作品として知られる。
    - name: もののけ姫
      emoji: "🐺"
      reason: 人と自然の関わりを、重厚に描いたスケールの大きな作品。映像と音楽の迫力が、強く印象に残る。
  A:
    - name: 天空の城ラピュタ
      short: ラピュタ
      emoji: "🏰"
      reason: 空に浮かぶ島をめぐる冒険活劇。わくわくする展開と、久石譲の音楽が、今も愛される理由。
    - name: 魔女の宅急便
      short: 魔女の宅急便
      emoji: "🧹"
      reason: 13歳の魔女の、旅立ちと自立を描いた物語。黒猫ジジとの掛け合いも人気。
    - name: 風の谷のナウシカ
      short: ナウシカ
      emoji: "🪁"
      reason: 宮崎駿の漫画を原作にした、壮大な物語。環境と生き物への向き合い方を描いた、スタジオジブリ設立前の代表作。
    - name: ハウルの動く城
      short: ハウル
      emoji: "🚶"
      reason: 魔法の世界を舞台にした、少女と魔法使いの物語。動く城の不思議なデザインが印象的。
    - name: 耳をすませば
      emoji: "🎻"
      reason: 本が好きな中学生の、等身大の恋と夢を描いた作品。主題歌のカントリー・ロードとともに、今も愛される。
    - name: 紅の豚
      emoji: "🐷"
      reason: 大人向けの、渋い空の冒険。豚の姿をした飛行機乗りという設定が、強烈な個性を放つ。
  B:
    - name: 崖の上のポニョ
      short: ポニョ
      emoji: "🐟"
      reason: 海辺の町を舞台にした、子ども向けのおとぎ話。手描きの海の表現が、見どころ。
    - name: 猫の恩返し
      emoji: "🐈"
      reason: 猫の王国に迷い込んだ少女の物語。気軽に楽しめる、ほっこりした作品。
    - name: 借りぐらしのアリエッティ
      short: アリエッティ
      emoji: "🪡"
      reason: 小さな人たちの暮らしを、繊細に描いた作品。身近な物が、大冒険の舞台になる。
    - name: 風立ちぬ
      emoji: "✈️"
      reason: 飛行機の設計者を主人公にした、大人向けの物語。夢と現実を、静かに描いている。
    - name: 君たちはどう生きるか
      emoji: "🕊️"
      reason: 宮崎駿が、長い休止期間を経て手がけた長編。海外でも高く評価され、アカデミー賞の長編アニメーション賞を受賞した。
    - name: 火垂るの墓
      emoji: "🔥"
      reason: 戦時中の兄と妹の姿を描いた、強い印象を残す作品。見るのに覚悟がいる、と語られることが多い。
  C:
    - name: おもひでぽろぽろ
      emoji: "🌻"
      reason: 小学生時代を思い出す大人の女性を主人公にした、現実的な雰囲気の作品。大人になってから、しみじみ味わう人が多い。
    - name: 平成狸合戦ぽんぽこ
      short: ぽんぽこ
      emoji: "🦝"
      reason: 開発で居場所を失うたぬきたちを描いた、ユーモアと社会性がまじる作品。
    - name: コクリコ坂から
      emoji: "⚓"
      reason: 昭和の港町を舞台にした、学園の青春物語。レトロな雰囲気が好きな人に。
    - name: 思い出のマーニー
      emoji: "🏖️"
      reason: 北海道の海辺を舞台にした、少女の友情と心の成長の物語。静かで、繊細な雰囲気。
  D:
    - name: かぐや姫の物語
      emoji: "🌕"
      reason: 日本の古典『竹取物語』を、水彩画のような独特のタッチで映像化した作品。芸術性の高さが評価される。
    - name: ホーホケキョ となりの山田くん
      short: 山田くん
      emoji: "🏠"
      reason: 家族の日常を、4コマ漫画のように描いた、柔らかな絵柄の作品。ほかのジブリ作品とは、雰囲気が違う。
    - name: ゲド戦記
      emoji: "🐉"
      reason: ファンタジー小説を原作にした作品。宮崎吾朗の初監督作として知られる。好みが分かれやすい。
summary: |
  ジブリ作品のSは、世代を超えて愛される「となりのトトロ」「千と千尋の神隠し」「もののけ姫」。映像、音楽、世界観が揃った、日本のアニメを代表する3作。
  どの作品も、好きな人にとっては特別な1本。あなたのいちばん好きなジブリは、何ランク？ ぜひ一言コメントで教えてね。
related: [pixar-eiga, showa-anime, kankoku-eiga]
