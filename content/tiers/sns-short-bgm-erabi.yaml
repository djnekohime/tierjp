title: ショート動画のBGM・音の選び方 Tier表
description: アプリ内の音源、自作曲、フリーBGM、効果音…ショート動画に使う音の選び方を、ゾーマが「安心して使えるか×動画との相性×手軽さ」でS〜Dにランク付け。
category: sns
tags:
- 初心者
- ショート動画
published: '2026-11-13'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 安心して使えるか（著作権・利用規約）

  ② 動画との相性

  ③ 手軽さ

  ※ 音源の使い方やルールは、アプリやサービスごとに違い、変わることもあります。必ず最新の利用規約・ガイドラインを確認してください。法律の専門的な判断ではありません'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: アプリ内の音源を、規約の範囲で使う
    emoji: 📱
    reason: ルールが明確で、安心して使える。使える範囲は、投稿前に確認を。
  - name: 自分で作った曲や、録った音を使う
    emoji: 🎹
    reason: 権利の心配がなく、オリジナルの個性も出せる。
  - name: 利用条件がはっきりしたフリー素材を、ルール通りに使う
    emoji: 📜
    reason: クレジット表記・商用利用などを、確認すれば安心。
  A:
  - name: 動画の雰囲気を、一言にして音を選ぶ
    emoji: 💭
    reason: 「ほっこり」「元気」など、イメージで探すと迷いにくい。
  - name: 声が主役のときは、BGMを小さめにする
    emoji: 🔉
    reason: 話が聞き取りやすく、離脱されにくい。
  - name: スマホとイヤホンの両方で、聞こえ方を確認する
    emoji: 🎧
    reason: 端末によって、音の聞こえ方は違う。
  - name: 利用条件のページを、保存・メモしておく
    emoji: 📸
    reason: 後から確認でき、トラブル対応にも役立つ。
  - name: 冒頭の数秒で、動画の雰囲気が伝わる音を選ぶ
    emoji: ⏱️
    reason: 最初の印象が、見続けてもらえるかを決める。
  B:
  - name: 効果音を、少し足してメリハリをつける
    emoji: 🔔
    reason: 画面の動きと合わせると、楽しい動画になる。
  - name: 無音にして、字幕だけで見せる
    emoji: 🔇
    reason: 電車や職場でも見てもらいやすい。雰囲気が伝わりにくいことも。
  - name: 自然の音（波・雨・鳥など）を、BGMにする
    emoji: 🌊
    reason: 落ち着く雰囲気になり、癒し系の動画に合う。
  - name: 同じ曲を、シリーズ動画で使い続ける
    emoji: 🎞️
    reason: ブランドの印象がつき、覚えてもらいやすい。
  - name: 曲の盛り上がりに、動画の山場を合わせる
    emoji: 📈
    reason: 編集の工夫で、見ごたえが出る。
  C:
  - name: 他の人の動画の音を、そのまま使う
    emoji: 🔁
    reason: アプリの機能として使えても、元の投稿者の意向や権利に注意。
  - name: 曲を、つなぎ合わせて自分でアレンジする
    emoji: 🎛️
    reason: オリジナル性は出るが、元の曲の権利が絡むことがある。
  - name: 有名曲の一部を、短く使う
    emoji: ⚠️
    reason: 短いからといって、無条件で使えるとは限らない。
  D:
  - name: 好きな曲を、許可なく丸ごと使う
    emoji: 🚫
    reason: 著作権侵害になる恐れがあり、動画の削除や、アカウントへの影響も。
  - name: 利用規約を読まず、「みんな使ってるから大丈夫」と判断する
    emoji: 🙈
    reason: 他の人が大丈夫でも、自分の動画が大丈夫とは限らない。
  - name: BGMを大音量にして、声や字幕を聞こえなくする
    emoji: 📢
    reason: 内容が伝わらず、すぐ離脱されやすい。
summary: 'ショート動画のBGMは、動画の印象を大きく左右する、大事な要素。でも、好きな曲を、むやみに使うと、著作権の問題で、動画が消されたり、収益化できなくなったりすることがある。だから、「安心して使える音」を選ぶことが、いちばんの出発点だ。

  S級は、「アプリ内で提供されている音源を、規約の範囲で使う」「自分で作った曲や、録った音を使う」「利用条件がはっきりしたフリー素材を、ルール通りに使う」の3つ。どれも、ルールが明確で、安心して使える。

  ただし、アプリ内の音源も、アカウントの種類（個人・ビジネス）や、投稿の内容によって、使えないことがある。「使えるはず」と思い込まず、投稿前に、画面の表示や、最新のルールを確認しておこう。

  フリーBGMを使うときは、「クレジット表記が必要か」「商用利用はOKか」「動画の収益化は可能か」を、必ずチェックする。利用条件は、サイトごとに違う。読んだ条件は、メモやスクリーンショットで、残しておくと安心だ。

  音の選び方にもコツがある。話す声が主役の動画では、BGMは控えめに。映像が主役の動画では、リズムのはっきりした曲が合う。迷ったら、動画の雰囲気を一言で言葉にして（「ほっこり」「元気」「切ない」など）、そのイメージに合う曲を探してみよう。

  音量バランスも大切。BGMが大きすぎて、声や字幕が聞こえない動画は、すぐに離脱されやすい。最終チェックでは、スマホのスピーカーとイヤホンの両方で、聞こえ方を確認してほしい。'
related:
