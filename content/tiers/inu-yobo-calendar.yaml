title: 犬の予防（狂犬病・混合ワクチン・フィラリア・ノミダニ）のやること Tier表
description: 狂犬病予防注射、混合ワクチン、フィラリア予防、ノミ・ダニ予防、健康診断、犬の登録、マイクロチップ…春に確認したい犬の予防とお手続きを「大事さ・期限の近さ」でS〜Dにランク付け。
category: animals
tags: [犬, ペット, 初心者]
published: 2026-10-05
labels:
  S: 必ずやる
  A: 早めにやる
  B: できれば
  C: 犬による
  D: 後回しでもいい
criteria: |
  ① 犬と人の健康を守る大きさ
  ② 法律や、時期の決まり
  ③ 忘れたときの困りやすさ
  ※ 一般的な注意点の整理です。必要な予防は、犬の年齢・体調・住んでいる地域・生活のしかたで変わります。狂犬病予防注射は、法律で年1回が決められています（時期や方法は、自治体の案内で確認）。それ以外は、獣医さんの助言ではなく目安なので、かかりつけの動物病院に相談してください
rank_notes:
  S: 今年の分、済んでいるか確認
  D: 余裕があるときに
tiers:
  S:
    - name: 狂犬病予防注射（年1回・法律で決まっている）
      short: 狂犬病予防注射
      emoji: "💉"
      reason: 飼い主の義務。毎年4〜6月に受けるのが基本（自治体の案内を確認）。体調が悪いときは、獣医さんに相談して、時期を調整する。
    - name: 犬の登録（生涯に1回）と、鑑札・注射済票の装着
      short: 犬の登録・鑑札
      emoji: "🏷️"
      reason: 飼い始めてから30日以内に、市区町村で登録する。引っ越したら、住所変更の届出も必要。
    - name: フィラリア予防（蚊の季節の前から終わりまで）
      short: フィラリア予防
      emoji: "🦟"
      reason: 蚊が媒介して、心臓や血管に、虫が寄生する。薬をのむ時期や、検査の有無は、獣医さんの指示に従う。
  A:
    - name: 混合ワクチン（年1回・子犬は回数が多い）
      short: 混合ワクチン
      emoji: "🩹"
      reason: 感染症を予防できる。種類や頻度は、犬の年齢・生活環境で変わるので、獣医さんと相談して決める。
    - name: ノミ・ダニの予防薬（月1回ほか）
      short: ノミ・ダニ予防
      emoji: "🪲"
      reason: 暖かくなると活発になる。皮膚炎や、感染症の原因になる。予防薬の種類は、獣医さんに相談する。
    - name: 年1回以上の健康診断（血液検査・尿・便など）
      short: 健康診断
      emoji: "🩺"
      reason: 病気の早期発見につながる。シニアになったら、頻度を増やすことも、相談する。
    - name: マイクロチップの装着・登録情報の確認
      short: マイクロチップ
      emoji: "📟"
      reason: 迷子や、災害のときに、飼い主に連絡できる。住所や、電話番号を変えたら、情報の更新を忘れない。
  B:
    - name: 歯のケア・歯石チェック
      short: 歯のケア
      emoji: "🦷"
      reason: 歯周病が、全身の健康にも影響する。歯みがきの習慣づけを、少しずつ。
    - name: 体重・体型の確認（肥満や、やせのチェック）
      short: 体重チェック
      emoji: "⚖️"
      reason: 健康の基本。急な変化は、病気のサインのこともある。
    - name: 避妊・去勢手術についての相談
      short: 避妊・去勢の相談
      emoji: "🏥"
      reason: メリットと、リスクの両方がある。年齢や、犬種、健康状態で、獣医さんと相談する。
    - name: ペット保険・医療費の見直し
      short: ペット保険の見直し
      emoji: "🛡️"
      reason: 年齢が上がると、加入できなくなることがある。補償内容と、掛け金を、比べて決める。
  C:
    - name: レプトスピラ症などの、地域や生活に応じたワクチン・予防
      short: 地域の予防
      emoji: "🌊"
      reason: 川遊びや、キャンプなど、生活のしかたで、必要性が変わる。獣医さんに、相談して決める。
    - name: ペットホテル・ドッグランの利用前の、証明書の準備
      short: ワクチン証明書
      emoji: "📄"
      reason: 施設によって、ワクチンの接種証明が、必要になる。早めに取得して、更新時期も、確認する。
  D:
    - name: 「家にいるから大丈夫」と、予防をやめる
      short: 予防をやめる
      emoji: "🏠"
      reason: 蚊は、室内にも入るし、ノミ・ダニも、飼い主が持ち込むことがある。やめる前に、獣医さんに、相談を。
    - name: 予防の時期や、薬の種類を、自己判断で変える
      short: 自己判断の変更
      emoji: "⚠️"
      reason: 効果がなくなったり、体に合わなかったりすることがある。必ず、獣医さんの指示に従う。
summary: |
  Sは、「狂犬病予防注射」「犬の登録・鑑札」「フィラリア予防」。法律で決まっているものと、命に関わるものは、後回しにしない。
  混合ワクチンやノミ・ダニ予防は、犬の生活によって、必要なものが変わる。まずは、かかりつけの動物病院で、今年の予定をまとめて、相談しよう。
related: [pet-nomidani-taisaku, pet-shinseikatsu, inu-byouin-sign]
