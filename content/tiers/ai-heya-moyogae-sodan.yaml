title: AIに部屋の模様替え・配置を相談するときのコツ Tier表
description: 部屋の広さを伝える、写真は個人情報に注意、予算を決める、案を3つ出してもらう…AIに模様替えを相談するときのコツを、ゾーマが「役立ち度×安全性×使いやすさ」でS〜Dにランク付け。
