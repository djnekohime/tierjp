tiers:
  S:
  - name: 部屋の広さと家具のサイズを、数字で伝える
    emoji: 📏
    reason: 具体的なほど、実用的な提案になる。
  - name: 予算と目的（くつろぐ・作業するなど）を、先に伝える
    emoji: 🎯
    reason: 方向性が決まり、提案がぶれにくい。
  - name: 写真に、表札・郵便物・住所が分かるものが写っていないか確認する
    emoji: 🔒
    reason: 個人情報の流出を防ぐ、いちばん大事な習慣。
  A:
  - name: 案を、3つ出してもらって比べる
    emoji: 📋
    reason: 選べると、納得して決められる。
  - name: 動線（歩く道）も一緒に考えてもらう
    emoji: 🚶
    reason: 見た目だけでなく、暮らしやすさも考えられる。
  - name: コンセントや窓の位置も、伝える
    emoji: 🔌
    reason: 配置の実現可能性が上がる。
  - name: 大きな家具の移動は、2人以上で行う
    emoji: 🤝
    reason: 腰を痛めたり、転倒したりする事故を防ぐ。
  B:
  - name: 好みの雰囲気（北欧・和モダンなど）を伝える
    emoji: 🎨
    reason: イメージに合った提案が出やすい。
  - name: 買い足すものを、優先順位つきで出してもらう
    emoji: 🛒
    reason: 無駄な買い物を減らせる。
  - name: 模様替えの手順を、ステップで出してもらう
    emoji: 🪜
    reason: 作業の見通しが立ち、疲れにくい。
  - name: 紙に間取りを描いて、実際に当てはめてみる
    emoji: 📐
    reason: AIの案を、現実で確かめられる。
  - name: ペットや子どもがいる前提を、伝える
    emoji: 🐾
    reason: 安全面を考えた提案になる。
  C:
  - name: AIの提案を、全部そのまま採用する
    emoji: 🤖
    reason: 実際の部屋では合わないことも。取捨選択を。
  - name: 写真の画像だけで、サイズを判断してもらう
    emoji: 📸
    reason: 正確さが足りない。寸法を伝える。
  - name: 1回で、完璧な答えを求める
    emoji: 🎲
    reason: やりとりを重ねたほうが、よい案になる。
  D:
  - name: 自宅の住所や間取りの詳細を、そのまま入力する
    emoji: 🚫
    reason: 個人情報になる。必要な範囲にとどめる。
  - name: 背の高い家具を、固定せずに配置する
    emoji: ⚠️
    reason: 地震のときに倒れて、ケガの原因になる。
  - name: 耐荷重や電気容量の確認なしで、AIの案を実行する
    emoji: 🔥
    reason: 棚の落下やタコ足配線による事故の恐れがある。
summary: '模様替えは、「何から始めればいいか分からない」ところが最大の壁。ここでAIが力を発揮する。広さ、家具の大きさ、使い方を伝えると、レイアウトの案を、いくつも出してくれる。

  S級は、部屋の広さや家具のサイズを数字で伝えること、予算と目的を先に決めること、案を3つ出してもらって比べること。情報が具体的なほど、提案が実用的になる。

  写真を見せて相談するときは、注意が必要。表札、郵便物、窓から見える景色など、住所や個人が特定できるものが写り込んでいないか、必ず確認しよう。AIサービスによっては、入力した内容が学習などに使われることもあるので、設定や規約も確認を。

  AIの案は、実際に置いてみると、動線が悪かったり、コンセントの位置が合わなかったりすることもある。最後は、自分の目で確かめて決める。

  大きな家具を動かすときは、無理をせず、2人以上で。背の高い家具は、地震のときの転倒対策も忘れずに。

  まずは、「動かして戻せる範囲」の小さな模様替えから試すと、失敗しても安心。暮らしやすい部屋は、少しずつ作っていけばいい。

  相談のコツは、「いきなり正解を求めない」こと。まずは、「こんな部屋にしたい」という気持ちを伝えて、案を出してもらい、そこから「ここはこうしたい」と、やりとりを重ねていく。

  AIは、気づいていなかった配置の可能性を教えてくれる、頼れる相談役。最後は、実際に自分の目と体で確かめながら、あなたにとって居心地のいい部屋に近づけていこう。'
