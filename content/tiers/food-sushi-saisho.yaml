title: 最初に食べる寿司ネタ Tier表
description: 白身、マグロ赤身、玉子、サーモン、イカ、中トロ、ウニ、かっぱ巻き…お寿司屋さんで「最初の1貫」にするならどれ？AIが「最初の1貫としての良さ」でランク付け。
category: food
genre: 寿司・海鮮
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 最初の1貫としての良さ（あっさり→こってりの順番に合うか）

  ② その店の実力がわかるか

  ③ 次のネタがおいしくなるか

  ※ 回転寿司でも回らないお寿司屋さんでも使える、目安のランキングです

  '
rank_notes:
  S: 最初の1貫の定番
  D: 通の始め方
tiers:
  S:
  - name: 白身（タイ・ヒラメ）
    short: 白身
    emoji: 🐟
    reason: あっさりした白身から始めて、だんだん味の濃いネタへ。お寿司の食べ方の基本と言われる順番。
  - name: マグロ赤身
    emoji: 🔴
    reason: お寿司の代表選手。赤身がおいしい店は、どのネタもおいしいことが多い。
  - name: 玉子
    emoji: 🍳
    reason: 「最初に玉子を食べると、その店の腕がわかる」という話は有名。甘さや焼き方に店の個性が出る。
  A:
  - name: サーモン
    emoji: 🍣
    reason: 回転寿司で一番人気とも言われるネタ。最初から好きなものを食べたい派にはこれ。
  - name: イカ
    emoji: 🦑
    reason: あっさりして、ねっとり甘い。白身と同じく、最初の1貫に向いている。
  - name: ホタテ
    emoji: 🐚
    reason: やさしい甘さで、口の中がふわっと幸せになる。
  - name: アジ
    emoji: ✨
    reason: 旬の時期は特においしい光り物。生姜とネギの薬味で、さっぱり始められる。
  B:
  - name: エビ
    emoji: 🦐
    reason: 子供から大人まで人気。茹でエビでも甘エビでも。
  - name: コハダ
    emoji: 🌊
    reason: 酢でしめた光り物。江戸前寿司を代表するネタで、その店の仕事ぶりが出る。
  - name: 中トロ
    emoji: 🩷
    reason: いきなり中トロも、最初に一番好きなものを食べる派なら正解。
  - name: ハマチ・ブリ
    short: ハマチ
    emoji: 🐠
    reason: 脂がのった魚。冬のブリは特に人気。
  C:
  - name: 大トロ
    emoji: 💗
    reason: 脂がたっぷりで、そのあとの白身の味がわかりにくくなる。最初より、後半のお楽しみに。
  - name: ウニ
    emoji: 🟠
    reason: 濃厚な味。ここから始めると、あとのネタが少し物足りなくなるかも。
  - name: イクラ
    emoji: 🔶
    reason: プチプチの食感が楽しい軍艦。味が濃いので、中盤以降がおすすめ。
  D:
  - name: かっぱ巻き
    emoji: 🥒
    reason: 普通は締めに食べるけれど、最初に食べて口をさっぱりさせる人もいる。通の始め方。
  - name: 穴子
    emoji: 🍢
    reason: 甘いタレのかかった穴子は、締めの定番。あえて最初にいく人は、かなりの穴子好き。
summary: 'お寿司は、白身などあっさりしたネタから始めて、トロやウニなど濃いネタへ進むのが基本の順番。最初に玉子を食べて、その店の腕を見るという楽しみ方もある。

  とはいえ、決まりではない。一番好きなネタから食べるのも、立派な食べ方。

  '
related:
- food-sushi-neta
- food-gunkan
- food-makimono
