title: ストーブ・ファンヒーターを安全に使うコツ Tier表
description: 換気する、燃えやすいものを近づけない、給油はエンジンを止めて、就寝前に消す…ストーブとファンヒーターの安全な使い方を、ゾーマが「安全性×あたたかさ×手軽さ」でS〜Dにランク付け。
category: kurashi
tags:
- 初心者
- 安全性
- 家電
published: '2026-11-17'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 安全性（一酸化炭素中毒・火災・やけどの防止）

  ② あたたかさ

  ③ 手軽さ

  ※ 専門家の助言ではなく、暮らしの目安です。製品ごとの取扱説明書・注意表示を最優先にしてください。体調に異変を感じたら、すぐに使用をやめて換気し、必要に応じて医療機関へ。小さなお子さん・高齢の方・ペットがいる家庭は、特に注意してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 燃料式は、定期的に換気する
    emoji: 🪟
    reason: 一酸化炭素中毒を防ぐ基本。においや色がないので、気づきにくい。
  - name: 取扱説明書を読み、使用場所・使い方を守る
    emoji: 📖
    reason: 製品ごとに、守るべきルールがある。
  - name: 燃えやすいものを近づけない
    emoji: 🧯
    reason: カーテン・衣類・紙・スプレー缶は、火災の原因になる。
  A:
  - name: 給油は、火を消して、本体が冷めてから
    emoji: ⛽
    reason: 引火の危険を避けられる。こぼしたら、必ずふき取る。
  - name: 灯油は、専用の容器で、ガソリンと間違えない
    emoji: 🏷️
    reason: 入れ間違いは、重大な事故につながる。保管場所にも気をつける。
  - name: 就寝前・外出前には、必ず消す
    emoji: 🌙
    reason: 消し忘れの事故を防ぐ基本。タイマーも活用。
  - name: 転倒時の自動消火機能がある製品を選ぶ
    emoji: 🛡️
    reason: 地震や、ペット・子どもがぶつかったときの備えになる。
  - name: 安全ガード（柵）をつける
    emoji: 🚧
    reason: 子ども・ペットのやけどを防げる。ガードがない製品は、置き場所を工夫。
  - name: 住宅用火災警報器・一酸化炭素警報器を設置
    emoji: 🔔
    reason: 万が一のとき、いち早く気づける備えになる。
  B:
  - name: ストーブの上で、やかんでお湯を沸かす（製品が対応している場合）
    emoji: 🫖
    reason: 加湿にもなる。ただし、やけど・転倒に注意。製品の説明に従う。
  - name: 使う前に、フィルターや吹き出し口のほこりを掃除する
    emoji: 🧹
    reason: 効きがよくなり、においや発火のリスクも減る。
  - name: 電気ストーブは、延長コードやタコ足配線を避ける
    emoji: 🔌
    reason: 電力を多く使うので、コンセントに直接つなぐのが基本。
  - name: ファンヒーターの前に、ものを置かない
    emoji: 📦
    reason: 空気の吸い込み・吹き出しをさえぎると、故障や発熱につながる。
  - name: シーズン前に、試運転して不具合を確認する
    emoji: ✅
    reason: においや異音、故障を、寒くなる前に気づける。
  - name: 使わない期間は、燃料を抜いてしまう
    emoji: 📦
    reason: 古い灯油は、劣化して、故障や不完全燃焼の原因になる。
  C:
  - name: 赤ちゃんや小さな子どもがいる部屋では、ストーブをつけっぱなしにする
    emoji: 👶
    reason: やけどや転倒のリスクがある。目を離さず、安全ガードなどを併用。
  - name: ストーブのそばで長時間、同じ姿勢で過ごす
    emoji: 🪑
    reason: 低温やけどや、肌の乾燥につながる。ときどき離れて休む。
  D:
  - name: ストーブの近くで洗濯物を干す
    emoji: 🧺
    reason: 落下して接触すると、火災になる。ストーブの上は特に危険。
  - name: 換気をしないで、一晩中つけておく
    emoji: 🚨
    reason: 一酸化炭素中毒の危険がある。就寝中は消す。
  - name: ガソリンや、指定外の燃料を入れる
    emoji: ⚠️
    reason: 重大な事故につながる。必ず指定燃料を使う。
  - name: 体調が悪い・頭痛・めまいがするのに、使い続ける
    emoji: 🚑
    reason: 一酸化炭素中毒の可能性。すぐに換気して、使用をやめる。
summary: 'ストーブやファンヒーターは、部屋をすばやくあたためてくれる、冬の頼れる存在。ただ、使い方を間違えると、火災や、一酸化炭素中毒（においも色もないガスで、気づかないうちに体調が悪くなること）につながることがある。

  S級は、燃料を使うタイプ（灯油・ガスなど）では、こまめに換気すること。取扱説明書を読み、使用場所・使い方を守ること。そして、燃えやすいものを近づけないこと。この3つは、ぜひ習慣にしたい。

  給油は、必ず火を消して、本体が冷めてから行うのが基本。灯油は、指定された専用の容器に入れて保管し、ガソリンと間違えないよう、十分に気をつけてほしい。

  ストーブの上や近くに洗濯物を干したり、カーテンや布団、スプレー缶、紙類を置いたりするのは危険。地震や、ペットのいたずら、子どもの接触で倒れるリスクもあるので、置く場所も大切だ。

  就寝するとき、外出するときは、必ず消すのが原則。電気ストーブも、タイマーや転倒時の自動停止機能のある製品なら、より安心だ。

  使わない期間は、燃料を抜いて、ほこりをよく取ってから、しまっておこう。製品ごとの注意は、必ず取扱説明書で確認してほしい。

  また、ストーブは、暖かさを感じやすいぶん、「ずっとつけておきたい」と思いがちだが、定期的に、短時間でも空気を入れ替えるのが、安全の基本。つけたまま眠ってしまうことのないよう、タイマーや、消し忘れ防止の機能も、うまく活用してほしい。家族みんなで、使い方のルールを共有しておくと、より安心だ。'
