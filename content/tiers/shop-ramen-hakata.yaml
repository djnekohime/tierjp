criteria: |
  ① 福岡市内のラーメン店であること
  ② 食べログのラーメン評価（2026年9月30日時点の点数）。百名店2025に選ばれた店を上位に
  ③ 博多・長浜ラーメンの歴史での役割
  ※ AIは実際に食べることはできません。ランクは公開されている点数・実績・評判にもとづく判断です
