title: サンドイッチの具 Tier表
description: たまご、ハムチーズ、ツナ、カツ、BLT、フルーツサンド、照り焼きチキン…サンドイッチの具を、AIが「食べたい度×食べやすさ×満足感」でランク付け。
category: food
genre: パン・朝食
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「まずこれを選ぶ」と思える人気
  ② 手に持って食べやすいか
  ③ 一つ食べたときの満足感
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: サンドイッチの三大定番
tiers:
  S:
    - name: たまご
      emoji: "🥚"
      reason: まろやかな卵サラダのサンドイッチ。日本のコンビニのたまごサンドは、海外からの旅行者にも大人気。
    - name: ハムチーズ
      emoji: "🧀"
      reason: ハムとチーズのシンプルな組み合わせ。朝ごはんにもお昼にもぴったりの定番。
    - name: カツサンド
      emoji: "🐖"
      reason: ソースのしみたとんかつをはさんだ、ボリューム満点のサンドイッチ。冷めてもおいしいので、手みやげにも人気。
  A:
    - name: ツナ
      emoji: "🥫"
      reason: ツナとマヨネーズのやさしい味。きゅうりや玉ねぎを加えると食感も楽しい。
    - name: BLT
      emoji: "🥓"
      reason: ベーコン・レタス・トマトの組み合わせ。カリッと焼いたベーコンの香ばしさが主役。
    - name: フルーツサンド
      emoji: "🍓"
      reason: 生クリームといちごやキウイなどのフルーツ。断面の美しさでSNSでも人気が広がった。
    - name: 照り焼きチキン
      emoji: "🐔"
      reason: 甘辛いチキンとマヨネーズで食べごたえ十分。
    - name: 厚焼き玉子サンド
      emoji: "🟨"
      reason: 分厚いだし巻き卵をはさんだ、喫茶店や関西でおなじみのサンドイッチ。
  B:
    - name: ポテトサラダ
      emoji: "🥔"
      reason: ほくほくのポテサラをはさんだ、やさしい味。
    - name: 野菜（ミックスサンド）
      short: ミックスサンド
      emoji: "🥬"
      reason: レタスやトマト、きゅうりのさっぱりしたサンドイッチ。
    - name: エビカツ
      emoji: "🦐"
      reason: プリプリのえびのカツ。タルタルソースとの相性が抜群。
    - name: ローストビーフ
      emoji: "🥩"
      reason: ちょっと贅沢なサンドイッチ。わさびやグレイビーソースと合わせて。
    - name: ハンバーグ
      emoji: "🍖"
      reason: ハンバーグとソース、チーズで、お腹いっぱいになるサンドイッチ。
  C:
    - name: コロッケ
      emoji: "🟤"
      reason: パンにコロッケをはさんだ、ボリュームのある一品。サンドイッチというより惣菜パン寄り。
    - name: きゅうり
      emoji: "🥒"
      reason: イギリスのアフタヌーンティーの定番。シンプルで上品だが、日本では少し地味な存在。
  D:
    - name: あんバター
      emoji: "🫘"
      reason: あんことバターをはさんだ甘いサンドイッチ。甘じょっぱさにハマる人が多い。
    - name: ナポリタンサンド
      emoji: "🍅"
      reason: ナポリタンをパンにはさんだ、炭水化物×炭水化物の喫茶店メニュー。見つけたら試したい一品。
summary: |
  サンドイッチの具は、たまご・ハムチーズ・カツサンドがS。日本のコンビニのたまごサンドは、世界の旅行者がわざわざ食べに来るほどの人気。
  フルーツサンドや厚焼き玉子サンドのように、日本の喫茶店やフルーツ店が生んだサンドイッチも多い。
related: [food-sozai-pan, food-shokupan-nuru]
