title: 1000円以内でやってみたいこと Tier表
description: 100円ショップでDIY、図書館めぐり、ご当地パン巡り…1000円以内でできる「やってみたい」を、AIが「ワクワク度×手軽さ×続けやすさ」でS〜Dにランク付け。
category: yattemitai
tags:
- 挑戦
- 節約
- 初心者
published: '2026-10-09'
labels:
  S: 今すぐ
  A: 週末に
  B: 気分が向いたら
  C: 少し準備して
  D: 思ったより…
criteria: '① ワクワク度

  ② 1000円以内でできる手軽さ

  ③ 続けやすさ・また試したくなるか

  ※ 交通費や、時期による費用の違いで、金額は変わります'
rank_notes:
  S: 今すぐ
  D: 思ったより…
tiers:
  S:
  - name: 図書館で、いつもと違う棚の本を3冊借りる
    emoji: 📚
    reason: 無料で、知らない世界が広がる。
  - name: 近所を、いつもと違う道で散歩する
    emoji: 🚶
    reason: 歩いて新しい発見がある。写真を撮りながらだと、さらに楽しい。
  A:
  - name: 100円ショップの材料で、小物をDIY
    emoji: 🔨
    reason: 作る時間そのものが楽しい。完成すると、愛着がわく。
  - name: ご当地パン・お菓子を食べ比べる
    emoji: 🥐
    reason: 少額で、小さな旅気分。
  - name: 朝焼けや夕焼けを、決まった場所で見る
    emoji: 🌅
    reason: お金はかからず、気持ちが整う。
  - name: 家にある材料で、新しいレシピに挑戦
    emoji: 🍳
    reason: 冷蔵庫の中身で、意外な発見がある。
  B:
  - name: ミニ植物を育ててみる
    emoji: 🌱
    reason: 100円台から始められる。成長が楽しみになる。
  - name: フリマアプリで、不用品を売ってみる
    emoji: 📦
    reason: 片づけにもなり、お小遣いにもなる。
  - name: おうちでシール・マスキングテープ手帳
    emoji: 📔
    reason: 少額で、毎日の記録が楽しくなる。
  - name: 公園でピクニック（お茶とおにぎり）
    emoji: 🍙
    reason: お金をかけずに、気分転換。
  C:
  - name: スタンプラリーに参加
    emoji: 🔖
    reason: 無料のものもある。移動費に注意。
  - name: 近所の無料イベントに行ってみる
    emoji: 🎪
    reason: 思わぬ出会いも。情報を探す手間はある。
  - name: 無料の体験会に参加
    emoji: 🎨
    reason: 1回で、続けるか判断できる。
  D:
  - name: 「安いから」とつい買い込む
    emoji: 🛒
    reason: 使わなければ、無駄に。やりたいことを先に決める。
summary: 'お金をかけなくても、気分が上がることはたくさんある。S級は、準備いらずで今日から始められること。

  大切なのは、「お金をかけない」ことより「小さくても新しいことをやってみる」感覚。1000円以内なら、失敗しても笑って次に進める。'
related:
- yattemitai-shumatsu
- yattemitai-hitori
