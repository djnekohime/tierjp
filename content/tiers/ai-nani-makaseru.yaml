title: AIに任せていいこと・任せてはいけないこと Tier表
description: アイデア出し、文章の下書き、要約、翻訳、調べもの、画像のラフ、医療や法律の判断、個人情報の入力…AIに任せていい作業と、任せてはいけない作業を「安心して任せられる度」でS〜Dにランク付け。
category: ai
tags: [AI, 初心者]
published: 2026-10-05
labels:
  S: 安心して任せられる
  A: 確認すれば任せられる
  B: 下書きまで
  C: 慎重に
  D: 任せてはいけない
criteria: |
  ① 間違えたときの影響の小ささ（やり直しやすいか）
  ② 人の目で確認しやすいか
  ③ AIの得意な作業か（整理・言い換え・アイデア出し）
  ※ AIは、もっともらしい間違いを答えることがあります。ここでは「最終的に人が確認する」前提で、任せ方の目安を整理しています。使うサービスの利用規約や、職場のルールも確認してください
rank_notes:
  S: どんどん任せていい
  D: 人が責任を持つ、またはAIに入力しない
tiers:
  S:
    - name: アイデア出し・ネーミング・企画の案出し
      short: アイデア出し
      emoji: "💡"
      reason: 正解がなく、たくさん案が出るほど役に立つ作業。使えない案があっても、困らない。壁打ち相手として、いちばん安心して使える。
    - name: 文章の言い換え・やわらかい表現・誤字のチェック
      short: 言い換え・校正
      emoji: "✍️"
      reason: 元の文章が自分のものなので、内容のずれを確認しやすい。ていねいに、カジュアルにと、トーンの調整にも向く。
  A:
    - name: 長い文章や資料の要約
      short: 要約
      emoji: "📄"
      reason: 全体の流れをつかむのに便利。大事な数字や固有名詞は、元の資料で、確認する。
    - name: メールや文書の下書き
      short: 文書の下書き
      emoji: "📧"
      reason: 白紙から書くより、ずっと楽。宛名・日付・金額・約束事は、必ず自分で確認してから送る。
    - name: 表・リスト・議事録の整理
      short: 整理・まとめ
      emoji: "🗂️"
      reason: ばらばらのメモを、読みやすく整えるのが得意。元のメモと見比べて、抜けがないか確認する。
    - name: 翻訳のたたき台
      short: 翻訳
      emoji: "🌐"
      reason: 意味をつかむには、十分役に立つ。契約書や公式な文書は、専門家の確認が必要。
    - name: 勉強の「分かりやすい説明」・例え話づくり
      short: 勉強の説明役
      emoji: "📚"
      reason: 分からない点を、何度でも聞ける。ただし、答えが正しいかは、教科書や公式な資料でも確認する。
  B:
    - name: 調べもののきっかけ・キーワード探し
      short: 調べもののきっかけ
      emoji: "🔍"
      reason: どう調べたらいいか分からないときの、入り口に。AIの答えをそのまま信じず、出典を確認する。
    - name: プログラムやExcelの数式のたたき台
      short: 数式・プログラム
      emoji: "🧮"
      reason: 手早く形になる。そのまま動かす前に、テストして、仕組みを理解する。
    - name: 画像・イラストのラフや、アイデア出し
      short: 画像のラフ
      emoji: "🎨"
      reason: 方向性を決めるのに便利。使うサービスの規約や、他人の作品に似ていないかの確認が必要。
    - name: SNSの投稿文・タイトル案
      short: 投稿文の案
      emoji: "📱"
      reason: 案を出してもらうのは便利。そのまま出さず、自分の言葉に直すと、伝わりやすい。
    - name: 旅行や食事の計画のたたき台
      short: 計画のたたき台
      emoji: "🗺️"
      reason: 候補を出してもらうのに向く。営業時間や、料金、予約の条件は、公式で確認する。
  C:
    - name: 数字や統計、ニュースの最新情報
      short: 数字・最新情報
      emoji: "📊"
      reason: 古い情報や、間違った数字を、自信ありげに答えることがある。必ず出典を確認する。
    - name: お金・投資・税金の判断の参考
      short: お金・税金の相談
      emoji: "💰"
      reason: 一般的な説明の参考にはなるが、個人の状況に合った判断は、できない。制度は変わるので、公式な情報や専門家に確認する。
    - name: 他人を評価する文章（レビュー・紹介・評判）
      short: 他人を評価する文章
      emoji: "⚖️"
      reason: 事実でないことを書いてしまうと、トラブルになる。事実の確認が、欠かせない。
  D:
    - name: 病気の診断・薬の飲み方・医療の最終判断
      short: 医療の判断
      emoji: "🏥"
      reason: 命に関わるので、医師や薬剤師に確認する。AIの答えは、参考どまりにする。
    - name: 法律・契約の最終判断
      short: 法律・契約の判断
      emoji: "📜"
      reason: 状況によって、答えが大きく変わる。重要なことは、弁護士など専門家に相談する。
    - name: パスワード・マイナンバー・他人の個人情報の入力
      short: 個人情報の入力
      emoji: "🔑"
      reason: 入力した内容が、どう扱われるかは、サービスによって違う。個人情報や、秘密の情報は入れない。
    - name: 確認せずに、そのまま公開・提出する
      short: 確認せず公開
      emoji: "🚫"
      reason: AIの文章や画像を、チェックなしで出すのは、いちばん危ない。最後は、必ず、人が責任を持って確認する。
summary: |
  AIに安心して任せられるのは、「アイデア出し」「言い換え・校正」のように、間違っても困らず、確認しやすい作業。
  逆に、医療・法律・個人情報のように、間違いや漏れが大きな影響を与える領域は、人が責任を持つ。AIは、「優秀だけど、たまに自信満々に間違える助手」と考えて、最後の確認は、自分でするのが、いちばん安全で、上手な使い方。
related: [ai-shitsumon-kotsu, ai-fact-check, ai-gazou-chui]
