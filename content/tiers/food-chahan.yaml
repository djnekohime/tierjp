title: チャーハンの具 Tier表
description: 卵、ねぎ、チャーシュー、えび、かに、レタス、高菜、キムチ、ベーコン…チャーハンの具を、AIが「入っていてうれしい度×パラパラ感との相性」でランク付け。
category: food
genre: ご飯もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 入っていると「うれしい！」と思える人気
  ② パラパラのご飯との相性
  ③ 家で手軽に作れるか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: これがないとチャーハンじゃない
tiers:
  S:
    - name: 卵
      emoji: "🥚"
      reason: チャーハンの主役。ご飯一粒一粒を卵がコーティングして、パラパラの仕上がりになる。
    - name: ねぎ
      emoji: "🧅"
      reason: 香ばしい香りと食感。卵とねぎだけのシンプルなチャーハンが一番、という人も多い。
    - name: チャーシュー
      emoji: "🥩"
      reason: 角切りのチャーシューのうまみで、町中華の本格的な味に。
  A:
    - name: えび
      emoji: "🦐"
      reason: プリプリの食感で、えびチャーハンはごちそう感たっぷり。
    - name: かに（かにかま）
      short: かに
      emoji: "🦀"
      reason: かにの身やかにかまで、上品なうまみと彩りを。あんかけにしても合う。
    - name: 高菜
      emoji: "🥬"
      reason: 九州でおなじみの高菜チャーハン。ピリ辛の漬物の味がご飯にしみる。
    - name: キムチ
      emoji: "🌶️"
      reason: 辛さと酸味で、キムチチャーハンはやみつきに。目玉焼きをのせるのが定番。
    - name: ベーコン
      emoji: "🥓"
      reason: 家庭のチャーハンでおなじみ。脂のうまみと燻製の香り。
  B:
    - name: レタス
      emoji: "🥬"
      reason: 最後に加えて、シャキシャキ感を残すのがポイント。さっぱりしたチャーハンに。
    - name: ハム
      emoji: "🟥"
      reason: 家にあるもので作るチャーハンの定番。彩りもよくなる。
    - name: 鮭
      emoji: "🐟"
      reason: ほぐした鮭の塩気で、和風のチャーハンに。
    - name: ひき肉
      emoji: "🍖"
      reason: うまみたっぷりで、子供にも人気。
    - name: にんにく
      emoji: "🧄"
      reason: ガーリックライス風に。香りで食欲がわく。
  C:
    - name: グリーンピース
      emoji: "🟢"
      reason: 昔ながらのチャーハンの彩り。子供のころは避けていた、という人も多い。
    - name: なると
      emoji: "🍥"
      reason: 町中華のチャーハンでたまに見かける、懐かしい具。
  D:
    - name: 納豆
      emoji: "🫘"
      reason: 炒めると粘りがおさまり、香ばしさが出る。意外なおいしさの通好みチャーハン。
    - name: 梅干し・しそ
      short: 梅しそ
      emoji: "🌿"
      reason: さっぱりした和風チャーハン。夏の食欲がない日にもおいしい。
summary: |
  チャーハンの具は、卵・ねぎ・チャーシューがS。シンプルな具ほど、火加減と手際の良さでおいしさが決まる。
  高菜やキムチのように、漬物を入れると一気に味が決まるのもチャーハンのいいところ。冷蔵庫の残り物で作れる、家庭の味方。
related: [food-don, food-gohan-otomo]
