title: 2020年代の韓国ドラマ Tier表
description: 梨泰院クラス、イカゲーム、ザ・グローリー、涙の女王、おつかれさま…配信時代の2020年代韓国ドラマをAIがランク付け。
category: kanryu
tags: [韓国ドラマ, 2020年代, Netflix]
published: 2026-09-29
criteria: |
  ① 物語の面白さと完成度
  ② 世界的な話題性・影響力
  ③ これから見る人へのおすすめ度
  ※ 年は配信・放送開始年。2025年までの作品が対象
rank_notes:
  S: 配信時代の韓ドラを代表する作品
tiers:
  S:
    - name: ザ・グローリー〜輝かしき復讐〜（2022）
      emoji: "♟️"
      reason: ソン・ヘギョ主演。学生時代のいじめ加害者たちに、人生をかけて復讐する物語。静かで冷たい復讐劇の緊張感が最後まで続き、世界中で大ヒットした。
    - name: イカゲーム（2021）
      emoji: "🦑"
      reason: イ・ジョンジェ主演。借金を抱えた人たちが命がけのゲームに挑むサバイバル。韓国ドラマを世界の主役に押し上げた、歴史的な作品。
    - name: おつかれさま（2025）
      emoji: "🍊"
      reason: IUとパク・ボゴム主演。済州島で生まれた女性の一生を、家族の時間とともに描く。誰にでもある人生の喜びと痛みが丁寧で、年代を問わず泣ける。
  A:
    - name: ウ・ヨンウ弁護士は天才肌（2022）
      emoji: "🐋"
      reason: パク・ウンビン主演。自閉スペクトラム症の新人弁護士が、事件を通じて成長していく。1話ごとに見やすく、温かさと面白さを両立した。
    - name: 二十五、二十一（2022）
      emoji: "🤺"
      reason: キム・テリとナム・ジュヒョク主演。1998年、フェンシング選手を夢見る少女の青春。まぶしくて切ない、青春ドラマの名作。
    - name: 涙の女王（2024）
      emoji: "👑"
      reason: キム・スヒョンとキム・ジウォン主演。財閥の娘と夫の、離婚寸前からの愛の物語。笑いと涙のバランスが良く、王道ラブストーリーとして満足度が高い。
    - name: ソンジェ背負って走れ（2024）
      emoji: "⏰"
      reason: ビョン・ウソクとキム・ヘユン主演。推しのスターを救うため過去へタイムスリップするファン目線のラブストーリー。「推し活」をする人ほど刺さる。
    - name: 'ヴィンチェンツォ（2021）'
      emoji: "🍷"
      reason: 'ソン・ジュンギ主演。イタリアマフィアの弁護士が悪徳企業に立ち向かう。痛快さとコメディのバランスが見事。'
    - name: 'ムービング（2023）'
      emoji: "🦸"
      reason: 'リュ・スンリョン、ハン・ヒョジュ出演。超能力を持つ親子たちを描く、韓国発の本格ヒーロードラマ。家族の愛に泣ける。'
  B:
    - name: 梨泰院クラス（2020）
      emoji: "🍻"
      reason: パク・ソジュン主演。飲食店を開いて巨大企業に挑む青年の復讐と成功の物語。日本でも大ブームになったが、終盤の恋愛展開は好みが分かれる。
    - name: 賢い医師生活（2020）
      emoji: "🩺"
      reason: 大学時代からの5人の医師の友情と日常を描く。バンド演奏のシーンが名物。大事件は少ないが、ずっと見ていたくなる心地よさがある。
    - name: 財閥家の末息子（2022）
      emoji: "💼"
      reason: ソン・ジュンギ主演。財閥に捨てられた社員が、財閥の末息子に生まれ変わって復讐する。展開が速く一気見向きだが、結末の評価は割れた。
    - name: '私の解放日誌（2022）'
      emoji: "🌾"
      reason: 'キム・ジウォンとソン・ソック主演。息苦しい日常からの「解放」を描く静かな名作。刺さる人には深く刺さる。'
    - name: '社内お見合い（2022）'
      emoji: "💼"
      reason: 'アン・ヒョソプとキム・セジョン主演。王道の設定をテンポよく描いた、2020年代のラブコメ代表作。'
  C:
    - name: 海街チャチャチャ（2021）
      emoji: "🏖️"
      reason: シン・ミナとキム・ソンホ主演。海辺の町の歯科医と「何でも屋」の恋。癒やし系の良作だが、話題の大作がそろう2020年代ではCに。
summary: |
  2020年代は配信サービスの時代。復讐劇（ザ・グローリー）、サバイバル（イカゲーム）、人生ドラマ（おつかれさま）と、Sのジャンルがまったく違うのが特徴。
  「恋愛もの」だけでなく、どんなジャンルでも世界一流になったのがこの時代の韓ドラ。今から見るならSの3本から。
related: [kandrama-2010s, kandrama-suspense, kandrama-human]
