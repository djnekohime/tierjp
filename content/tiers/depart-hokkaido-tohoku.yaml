title: 北海道・東北の百貨店 Tier表
description: 札幌丸井三越、大丸札幌、東急さっぽろ、仙台三越、藤崎、川徳、さくら野、うすい百貨店…北海道・東北の百貨店を、AIが「街での存在感×立地×個性」でS〜Dにランク付け。
category: depart
tags:
- 旅行
- あるある
published: '2026-10-09'
labels:
  S: 街の顔
  A: 地域の主役
  B: ほどよく便利
  C: こぢんまり個性派
  D: 変化の途中
criteria: '① 街での存在感（その地域で「あの百貨店」と言われるか）

  ② 立地の便利さ（駅直結・中心街など）

  ③ その店ならではの個性

  ※ AIは全店を回ったわけではありません。日本百貨店協会の店舗一覧と、各社・百貨店の公開情報、AIの印象で並べています。ランクは売上順や店の良し悪しではなく、「街での存在感・立地・個性」の目立ち方です。百貨店は閉店・改装・運営会社の変更が多いので、お出かけ前に公式サイトで最新の営業状況を確認してください（2026年10月時点）'
rank_notes:
  S: ここに行けば、その街とわかる
  D: 縮小・閉店予定など、変化の途中
tiers:
  S:
  - name: 大丸札幌店
    emoji: 🚄
    reason: 札幌駅直結のJRタワー内。2010年以降は売上高で、大通地区の丸井今井札幌本店を抑えて、地域一番店と紹介される。
  - name: 仙台三越
    emoji: 🎋
    reason: 仙台・一番町の三越。東北最大級の売場面積を持つ。
  - name: 藤崎（仙台）
    emoji: 🌸
    reason: 仙台・一番町の地場百貨店。2007年の売上高は東北の百貨店でトップと紹介される。
  A:
  - name: 丸井今井札幌本店
    emoji: 🏢
    reason: 北海道の老舗。明治期に呉服店として始まり、現在は三越伊勢丹グループの札幌丸井三越が運営。
  - name: 札幌三越
    emoji: 🦁
    reason: 札幌・大通の三越。丸井今井札幌本店と同じ会社が運営する。
  - name: 東急百貨店さっぽろ店
    emoji: 🌆
    reason: 札幌駅北側の東急百貨店。1973年開店。
  B:
  - name: 函館丸井今井
    emoji: 🦑
    reason: 函館の老舗百貨店。丸井今井として北海道に残る店舗のひとつ。
  - name: パルクアベニューカワトク（盛岡）
    emoji: 🏔️
    reason: 1866年創業の川徳の本店。盛岡市街地唯一の日本百貨店協会加盟店で、岩手県内唯一の加盟店。
  - name: うすい百貨店（郡山）
    emoji: 🍑
    reason: 郡山の百貨店。福島市の中合の閉店後は、福島県内唯一の百貨店。三越伊勢丹の関連会社。
  C:
  - name: さくら野百貨店青森店
    emoji: 🍎
    reason: 青森駅前の地場百貨店。
  - name: さくら野百貨店弘前店
    emoji: 🏯
    reason: 弘前の百貨店。
  - name: さくら野百貨店八戸店
    emoji: 🐟
    reason: 八戸の百貨店。
  - name: 西武秋田店
    emoji: 🎋
    reason: 秋田駅前の西武。そごう・西武が運営する、秋田県内の百貨店。
  D: []
summary: '北海道・東北は、札幌と仙台に大型店が集まる一方、県によっては、百貨店が1店だけの県も多い。

  福島県は、2020年に福島市の中合が閉店してから、県内唯一の百貨店が郡山のうすい百貨店。その土地に残る百貨店は、それだけで大切な存在。'
