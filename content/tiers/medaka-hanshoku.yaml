title: メダカの繁殖で大切なこと Tier表
description: 水温、日照時間、産卵床、卵の隔離、針子のエサ…メダカをふやすときに大切なことを、大切さでS〜Dにランク付け。
category: animals
tags:
- メダカ
- 動物
- 初心者
published: '2026-10-06'
criteria: '① 繁殖の成功に影響する大きさ

  ② 初心者がつまずきやすいか

  ③ 続けやすさ

  ※ 地域や飼い方で、適した方法は変わります。あくまで一般的な目安です'
rank_notes:
  S: まず押さえたい
  D: 失敗しやすい・避けたいこと
tiers:
  S:
  - name: 水温を20℃以上で安定させる
    short: 水温
    emoji: 🌡️
    reason: 一般に、水温が20℃以上になると、産卵しやすくなる。ただし、急な変化は体調をくずす原因。夏の高温にも注意。
  - name: 1日13時間くらい、明るい時間をつくる
    short: 日照時間
    emoji: ☀️
    reason: メダカは、日が長くなる季節に、産卵が活発になる。屋外なら春〜秋、室内ならライトを使って、日長を調整する方法もある。
  - name: オスとメスを一緒に飼う（メスが少し多めに）
    short: オスとメス
    emoji: 👫
    reason: ペアで飼うのが基本。オス1に対して、メス2〜3くらいにすると、メスの負担が減りやすい。
  A:
  - name: 産卵床を入れる（水草・産卵用ネットなど）
    short: 産卵床
    emoji: 🌿
    reason: メスがおなかにつけた卵を、水草などにつけてくれる。ホテイアオイや、毛糸の産卵床も、よく使われる。
  - name: 卵を別容器に移す
    short: 卵の隔離
    emoji: 🥚
    reason: 親が、自分の卵を食べてしまうことがある。卵だけを、別の容器に移して、守ると、生まれる数がふえる。
  - name: 針子用の細かいエサ（粉末・稚魚用）
    short: 針子のエサ
    emoji: 🥣
    reason: 生まれたばかりの針子は、口がとても小さい。粉末状の、稚魚用のエサを、少量ずつ。
  - name: 針子の入れ物は、水量が多めで、水質を保つ
    short: 稚魚の容器
    emoji: 🫙
    reason: 小さな容器は、水質が悪くなりやすい。水量があるほど、安定しやすい。
  B:
  - name: グリーンウォーター（青水）を使う
    short: グリーンウォーター
    emoji: 💚
    reason: 植物プランクトンの多い水は、針子のエサになるとも言われる。屋外で作りやすく、人気の方法。
  - name: 針子をサイズごとに分ける（選別）
    short: サイズ分け
    emoji: 📏
    reason: 大きさに差が出ると、小さい子が食べられたり、成長が遅れたりする。ときどき分けると安心。
  - name: カルキ抜きをした水を使う
    short: カルキ抜き
    emoji: 💧
    reason: 水道水の塩素は、卵や針子に有害。水換えや、水を足すときは、カルキ抜きを。
  - name: 少しずつ行う水換え
    short: 少量の水換え
    emoji: 🪣
    reason: 卵や針子のいる容器の水換えは、水流が強すぎると、こわれやすい。そっと、少しずつ。
  C:
  - name: 冬の室内加温での無理な繁殖
    short: 冬の無理な繁殖
    emoji: 🔥
    reason: ヒーターとライトで、冬に産卵させる方法もあるが、メダカの体力を、使いすぎてしまう。親の体調を見ながら。
  - name: ミナミヌマエビとの同居
    short: エビとの同居
    emoji: 🦐
    reason: 水槽のお掃除役としては人気。ただし、エビが、針子や卵を食べてしまうことがある。
  D:
  - name: 過密飼育（ふえすぎたのに、そのまま）
    short: 過密飼育
    emoji: 🐟
    reason: 数がふえると、酸素不足や水質の悪化を起こす。ふえすぎたら、分ける・譲るなど、計画的に。
  - name: 水流が強すぎる環境
    short: 水流が強い
    emoji: 🌊
    reason: メダカは、強い水流が苦手。卵や針子は、特に流されやすい。フィルターの出口を、弱める工夫を。
  - name: エサのあげすぎ
    short: エサのあげすぎ
    emoji: 🍽️
    reason: 食べ残しが、水を汚す原因になる。数分で食べきれる量が目安。
summary: 'メダカの繁殖は、「水温」「光」「卵を守る」の3つが基本。春から秋の、水温が20℃以上の時期に、1日13時間くらい明るい環境があると、産卵しやすいと言われている。

  卵は、親に食べられてしまうことがあるので、別の容器に移すのがコツ。生まれた針子（稚魚）は、とても小さいので、粉末の細かいエサを、少しずつ。一度にふえすぎると、水質が悪化するので、飼える数を考えて、計画的に。'
related:
- medaka-suisou
- medaka-esa
- medaka-yoki
