title: 初めてでも飼いやすい熱帯魚 Tier表
description: ネオンテトラ、グッピー、ベタ、コリドラス、エビ…初めて熱帯魚を飼う人向けに、丈夫さ・性格・大きさ・混泳のしやすさから飼いやすさをS〜Dにランク付け。
category: animals
tags: [熱帯魚, 動物, 初心者]
published: 2026-10-03
criteria: |
  ① 丈夫さ・水質や水温への強さ
  ② 性格（ほかの魚との相性・混泳のしやすさ）
  ③ 大きさ・水槽の大きさに合うか
  ④ 手に入りやすさ・値段
  ※ 熱帯魚は、水槽の「水づくり」ができてから迎えるのが基本です。種類ごとに必要な水質や水温が違うので、迎える前にしっかり調べてください
rank_notes:
  S: 初めてでも始めやすい傾向
  D: 経験者向き、または大きくなりすぎる
tiers:
  S:
    - name: ネオンテトラ
      emoji: "🔵"
      reason: 青く光る体と、群れで泳ぐ姿が美しい定番。丈夫で、値段も手頃。水槽が落ち着いてから、数匹まとめて迎えるのがおすすめ。
    - name: グッピー
      emoji: "🌈"
      reason: カラフルで丈夫、繁殖もしやすい入門魚。卵ではなく稚魚を産むので、増える楽しみも。増えすぎに備えて、飼える数を考えておく。
  A:
    - name: ベタ
      emoji: "🔴"
      reason: ひれが美しく、小さな容器でも飼いやすい人気魚。オスどうしは激しくけんかをするので、1つの水槽には1匹だけ。
    - name: プラティ
      emoji: "🟠"
      reason: 色や模様が豊富で、おだやかな性格。丈夫で、混泳もしやすい。グッピーと同じく、繁殖しやすい。
    - name: ゼブラダニオ
      emoji: "🦓"
      reason: 縞模様で、活発に泳ぎまわる丈夫な魚。群れで飼うと見ごたえがある。水槽から飛び出すこともあるので、ふたが必要。
    - name: コリドラス
      emoji: "🐟"
      reason: 水槽の底で、ちょこちょこ動くかわいい魚。おだやかで、混泳向き。底砂は、ヒゲを傷めない、細かいものを。
    - name: ミナミヌマエビ
      emoji: "🦐"
      reason: 小さくて丈夫なエビで、コケを食べてくれる。水槽の掃除の助けになるが、小さな魚に食べられないよう、混泳には注意。
  B:
    - name: ヤマトヌマエビ
      emoji: "🦐"
      reason: コケ取りが得意なエビ。ミナミヌマエビより大きく、水槽の掃除に役立つ。
    - name: オトシンクルス
      emoji: "🧹"
      reason: コケを食べる小型のナマズの仲間。水槽にコケがないと、えさ不足になることもあるので、えさの確認が必要。
    - name: エンゼルフィッシュ
      emoji: "👼"
      reason: 優雅な姿が人気。大きくなるので、水槽の大きさが必要。小さな魚を食べてしまうこともある。
    - name: ブラックモーリー
      emoji: "⚫"
      reason: 丈夫で、コケ取りの手伝いもしてくれる。繁殖しやすく、水質への気配りが必要。
    - name: ドワーフグラミー
      emoji: "🧡"
      reason: 小さな体に、鮮やかな色が美しい。おとなしいが、同じ種類のオスどうしは争うことがある。
  C:
    - name: アベニーパファー
      emoji: "🐡"
      reason: 世界最小クラスのフグ。かわいいが、生きたえさが必要で、ほかの魚のひれをかじることもあるので、単独飼育が基本。
    - name: シクリッドの仲間
      emoji: "🐠"
      reason: 種類によって、気が荒く、縄張り意識が強い。きれいな種類も多いが、混泳には知識が必要。
    - name: エビ・カニ類（種類を問わず）
      short: エビ・カニ
      emoji: "🦀"
      reason: 脱皮や、水質への敏感さなど、独特の管理が必要。魚とは、違うお世話の知識が要る。
  D:
    - name: ディスカス
      emoji: "💿"
      reason: 「熱帯魚の王様」と呼ばれる美しい魚。水温や水質、えさの管理が繊細で、経験者向き。
    - name: プレコ（大きくなる種類）
      emoji: "🪨"
      reason: コケ取りのつもりで迎えたら、大きく成長して、水槽に収まらなくなることがある。迎える前に、成長後の大きさを必ず調べる。
    - name: アロワナなど大型の魚
      short: アロワナなど大型魚
      emoji: "🐉"
      reason: 大型で寿命も長く、大きな水槽と設備が必要。一般的な家庭で気軽に飼うのは難しい。
summary: |
  初めてなら、丈夫で、おだやかな「ネオンテトラ」や「グッピー」から。エビは、水槽の掃除の助けにもなる。
  熱帯魚は、水槽に「水づくり」ができてから迎えるのが基本。かわいさだけで選ばず、成長後の大きさと、ほかの魚との相性を考えて選びたい。飼えなくなった魚は、野外に放さず、最後まで責任を持つこと。
related: [nettai-shippai, aquarium-goods, medaka-shurui]
