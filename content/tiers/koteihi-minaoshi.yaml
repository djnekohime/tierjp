title: 固定費の見直し 効果の大きさ Tier表
description: スマホ、サブスク、保険、電気…毎月の固定費を「見直した時の効果×手軽さ」でランク付け。節約はまずここから。
category: money
tags: [節約, 固定費]
published: 2026-09-28
criteria: |
  ① 1回見直すと、毎月いくら変わる可能性があるか
  ② 手続きの手軽さ
  ③ 生活の満足度を下げずにできるか
  ※ 金額の効果は家庭によって違います。契約変更は内容をよく確認してから
rank_notes:
  S: 一度の手続きで、毎月ずっと効く
tiers:
  S:
    - name: スマホ料金（格安プランへ）
      emoji: "📱"
      reason: 大手の通常プランから格安プランに変えるだけで、毎月数千円下がる人も多い。手続きもネットで完結しやすく、効果と手軽さのバランスが最強。
    - name: 使っていないサブスクの解約
      emoji: "✂️"
      reason: 動画・音楽・アプリの「なんとなく継続」は意外と積み重なる。一覧にして使っていないものを止めるだけ。今日すぐできる。
  A:
    - name: 保険の見直し
      emoji: "🛡️"
      reason: 家計への効果は大きいことがあるが、必要な保障まで削らないよう内容の確認が必要。手軽さでAにした。
    - name: 電気・ガスの契約プラン
      emoji: "⚡"
      reason: 使い方に合ったプランに変えると下がることがある。比較サイトで確認できるが、効果は家庭によって差が大きい。
    - name: '行っていないジムの会費'
      emoji: "🏋️"
      reason: '「いつか行く」で払い続けているジム代は、見直し効果が大きい。解約するか、行く日を決めるかのどちらか。'
    - name: 'クレジットカードの年会費'
      emoji: "💳"
      reason: '使っていないカードの年会費は、解約するだけで毎年の出費がなくなる。特典を使っているかで判断。'
  B:
    - name: ネット回線
      emoji: "🌐"
      reason: 乗り換えで安くなることもあるが、工事や解約金が発生する場合も。契約更新のタイミングで見直すのがおすすめ。
    - name: '車を手放してカーシェアへ'
      emoji: "🚗"
      reason: '駐車場代・保険・税金・車検がなくなり、効果はとても大きい。ただ生活スタイルによっては不便になるのでB。'
    - name: '家賃（引っ越し）'
      emoji: "🏠"
      reason: '固定費で一番大きいのは家賃。効果は最大級だが、引っ越しの手間と費用がかかるので慎重に。'
    - name: '新聞・雑誌の定期購読'
      emoji: "📰"
      reason: '読んでいない定期購読は見直しポイント。電子版に切り替えるだけで安くなる場合もある。'
    - name: 'ATM・振込手数料'
      emoji: "🏧"
      reason: '1回は小さくても、積み重なると意外な金額に。手数料のかからない時間帯や銀行を選ぶだけで減らせる。'
  C:
    - name: 毎日の小さな節約（電気をこまめに消すなど）
      emoji: "💡"
      reason: 大事だが、1回あたりの効果は小さく、我慢も必要。固定費を先に見直した方が効率が良い。
    - name: '節水シャワーヘッド'
      emoji: "🚿"
      reason: '水道代とガス代を少し下げられる。取り替えは簡単だが、効果は家庭の使い方次第。'
    - name: 'スマホの有料アプリ・クラウド容量'
      short: 'アプリ・クラウド課金'
      emoji: "☁️"
      reason: '月数百円でも、いくつも契約していると積み重なる。一度一覧にして、本当に必要か確認したい。'
  D:
    - name: 食費を極端に削る
      emoji: "🍙"
      reason: 我慢が続かず反動が来やすく、健康にも影響する。節約の最初の一歩としてはおすすめしない。
summary: |
  節約は「我慢」より「仕組み」。スマホとサブスクのような、一度変えれば毎月ずっと効く固定費から手をつけるのが一番ラク。
  見直しは年に1回、同じ時期にまとめてやると忘れにくい。浮いたお金の使い道まで決めておくと、節約が楽しくなる。
related: []
