title: AI作品を公開する前のチェック Tier表
description: 著作権、AI利用の表記、似すぎていないか、規約の確認…AIで作った画像・動画・音楽を公開する前のチェックを、AIが「大切さの順」でS〜Dにランク付け。
category: ai
tags:
- AI
- 安全性
- 画像生成
- 動画
published: '2026-10-09'
labels:
  S: 必ず確認
  A: 確認したい
  B: できれば
  C: 余裕があれば
  D: 気にしすぎなくていい
criteria: '① 公開してトラブルになる可能性

  ② 自分や他人への影響の大きさ

  ③ 確認の手軽さ

  ※ AIの機能や規約は変わります。使う前に、各サービスの最新の案内を確認してください

  ※ 法律や規約の判断が必要なときは、専門家にご相談ください'
rank_notes:
  S: 必ず確認
  D: 気にしすぎなくていい
tiers:
  S:
  - name: 使ったAIサービスの商用利用・公開の規約を確認
    emoji: 📜
    reason: ルールはサービスごと・プランごとに違う。守らないと削除されることも。
  - name: 実在の人物・有名キャラクターに似すぎていないか
    emoji: 👤
    reason: 肖像権・著作権の問題になりうる。迷ったら公開しない。
  - name: 他人の作品を、そのまま入力して作っていないか
    emoji: ⚠️
    reason: 著作権の問題。自分の素材か、許可のある素材を使う。
  A:
  - name: 音楽・BGMに、他人の曲が混ざっていないか
    emoji: 🎵
    reason: 似すぎていないかを確認。動画サイトの判定にも注意。
  - name: プラットフォームのAI利用の表記ルール
    emoji: 🏷️
    reason: サービスによって、表示が求められることがある。
  - name: 個人情報・位置情報が映り込んでいないか
    emoji: 🔒
    reason: 背景の看板や、書類にも注意。
  B:
  - name: 事実と異なる内容が混ざっていないか
    emoji: 🧐
    reason: AIの生成には、間違いがある。特に説明の文章。
  - name: 誤解を招く表現・加工になっていないか
    emoji: 🎭
    reason: 本物と思われると困る場合は、AI作品と分かるように。
  - name: 生成した素材と、使った設定を記録しておく
    emoji: 📝
    reason: あとで確認できる。トラブル時にも役立つ。
  C:
  - name: 画質・音質のチェック
    emoji: 🔍
    reason: 見た目や聞こえ方の確認。作品の質を上げる。
  - name: 不自然な部分（手・文字など）の修正
    emoji: ✋
    reason: AI画像にありがちな崩れ。修正で、印象がよくなる。
  D:
  - name: 「AIで作った」と書くのをためらう
    emoji: 💭
    reason: 隠す必要はない。表記ルールに合わせて、自然に書けばよい。
summary: 'AIで作った作品は、サービスごとに、商用利用や公開のルールが違う。公開前に「使ったサービスの規約」を確認するのが一番大切。

  実在の人物や、有名なキャラクターに似すぎていないかも要注意。迷ったら公開を控える、という判断も大切。'
related:
- ai-gazou-chui
- ai-tools-creator
- ai-fact-check
