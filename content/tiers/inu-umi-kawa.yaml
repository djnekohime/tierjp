title: 犬と海・川遊びの注意 Tier表
description: ライフジャケット、水の深さ・流れ、飲み水の用意、暑さ・砂の熱、塩分・水の飲みすぎ、ダニ・ノミ、遊泳禁止の確認、帰宅後のケア…犬と海・川遊びで気をつけることを「危険度・守りたい度」でS〜Dにランク付け。
category: animals
tags: [犬, ペット]
published: 2026-10-05
labels:
  S: 必ず守る
  A: 要注意
  B: 気をつけたい
  C: 心がけたい
  D: 小さな落とし穴
criteria: |
  ① 犬の安全・健康への危険度
  ② 起こりやすさ（海・川ならではか）
  ③ 飼い主が防ぎやすいか
  ※ 一般的な注意点の整理です。犬の年齢・犬種・体力・泳ぎの得意不得意で、必要な対策は変わります。獣医さんの助言ではなく目安です。犬の同伴や、遊泳のルールは、場所ごとに違うので、事前に確認してください
rank_notes:
  S: 出かける前に、必ず確認
  D: 気をつけたい小さなこと
tiers:
  S:
    - name: 犬が入ってよい場所か、ルールを確認する（遊泳・同伴のルール）
      short: ルールの確認
      emoji: "📑"
      reason: 同伴や、遊泳が、禁止の場所もある。管理者の案内や、看板に従う。
    - name: 犬から、目を離さない（水の事故を防ぐ）
      short: 目を離さない
      emoji: "👀"
      reason: 水の事故は、一瞬で起こる。リードや、ロングリードで、つないで、そばにいる。
    - name: ライフジャケットを着せる（泳げても着る）
      short: ライフジャケット
      emoji: "🦺"
      reason: 泳げる犬でも、疲れたり、流されたりすることがある。体に合うサイズを、選ぶ。
  A:
    - name: 水の深さ・流れの速さ・天気を確認する
      short: 水の深さ・流れ
      emoji: "🌊"
      reason: 急に、深くなったり、流れが速くなったりする。雨のあとや、上流の天気にも、注意する。
    - name: 熱中症・暑さ対策（日陰・水・休憩）
      short: 暑さ対策
      emoji: "☀️"
      reason: 砂浜や、岩場は、熱くなる。日陰を作り、水分を、こまめにとらせる。
    - name: 飲み水を、持参する（海水・川の水を、飲ませない）
      short: 飲み水の持参
      emoji: "🚰"
      reason: 海水を、飲みすぎると、体調をくずす。川の水には、雑菌や、寄生虫がいることがある。
    - name: 砂浜・岩場の、熱さ・ケガ（足の裏）
      short: 足の裏のケガ
      emoji: "🐾"
      reason: 熱い砂や、貝がら、ガラス片で、足の裏を傷める。手の甲で、地面の熱さを、確認する。
    - name: クラゲ・毒のある生き物・藻・青潮の危険
      short: 危険な生き物
      emoji: "🪼"
      reason: かまれたり、刺されたりすることがある。濁った水や、藻が多い水は、避ける。
  B:
    - name: 遊んだあとに、真水で洗い流して、よく乾かす
      short: 帰宅後のケア
      emoji: "🚿"
      reason: 塩分や、汚れが、皮膚に残ると、皮膚炎の原因になる。耳の中も、しっかり乾かす。
    - name: ダニ・ノミ・蚊の対策（川辺・草むら）
      short: ダニ・ノミ・蚊
      emoji: "🦟"
      reason: 川辺や、草むらは、虫が多い。予防薬と、帰宅後のチェックを、組み合わせる。
    - name: 水を飲みすぎる・遊びすぎて疲れすぎる
      short: 飲みすぎ・疲れすぎ
      emoji: "😮‍💨"
      reason: 水の飲みすぎで、体調をくずすことがある。休憩を、こまめにとる。
    - name: 帰りの車内の温度・濡れた体の冷え
      short: 帰りの車内
      emoji: "🚗"
      reason: 濡れた体で、冷房が当たると、体が冷える。タオルを、用意して、車内の温度を、調整する。
  C:
    - name: 他の人・犬への配慮（ほえる・水しぶき・ふん）
      short: 周りへの配慮
      emoji: "🙇"
      reason: 周りの人が、不快に思うことがある。ふんの処理や、リードの長さに、気をつける。
    - name: 日焼け・紫外線（毛の薄い犬・白い犬）
      short: 日焼け
      emoji: "🧴"
      reason: 皮膚が、赤くなることがある。長時間の日向は、避ける。
  D:
    - name: 犬を、無理に水に入れる・泳がせる
      short: 無理に泳がせる
      emoji: "⚠️"
      reason: 水が、苦手な犬もいる。無理にさせると、恐怖心や、事故の原因になる。
    - name: 泳げない犬種・体型の犬を、深いところへ行かせる
      short: 泳げない犬種
      emoji: "🐶"
      reason: 短足や、鼻の短い犬などは、泳ぎが苦手なことがある。浅い場所で、そばについて、様子を見る。
summary: |
  Sは、「ルールの確認」「目を離さない」「ライフジャケット」。水の事故は、一瞬で起こるので、泳げる犬でも、ライフジャケットと、リードで、守ろう。
  海水や、川の水は、飲ませない。遊んだあとは、真水で洗って乾かし、ダニ・ノミのチェックも、忘れずに。
related: [pet-natsu-kiken, pet-natsu-junbi, pet-nomidani-taisaku]
