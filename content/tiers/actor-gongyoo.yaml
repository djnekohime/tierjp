title: コン・ユ出演作 Tier表
description: トッケビ、コーヒープリンス1号店、新感染…コン・ユの出演ドラマ・映画を、AIが「作品の面白さ×コン・ユの魅力」でランク付け。
category: kanryu
tags: [韓国ドラマ, 俳優, コン・ユ]
published: 2026-09-29
criteria: |
  ① 作品そのものの面白さ
  ② コン・ユの魅力が最大限に出ているか
  ③ ファンでない人にもすすめられるか
  ※ ドラマと映画の両方を対象
rank_notes:
  S: コン・ユの代表作
tiers:
  S:
    - name: トッケビ〜君がくれた愛しい日々〜（2016）
      emoji: "🕯️"
      reason: キム・ゴウンと共演したドラマ。900年以上生きるトッケビ役で、切なさと可笑しさを見事に両立した。コン・ユの代名詞といえばこれ。
    - name: 新感染 ファイナル・エクスプレス（2016）
      short: 新感染
      emoji: "🚆"
      reason: ソウル発釜山行きの高速鉄道でゾンビが広がるパニック映画。娘を守ろうとする父親役で、世界中で高く評価された。
  A:
    - name: コーヒープリンス1号店（2007）
      emoji: "☕"
      reason: ユン・ウネと共演したドラマ。カフェの若き社長役で大ブレイク。今見てもみずみずしい青春ラブコメ。
    - name: トガニ 幼き瞳の告発（2011）
      short: トガニ
      emoji: "⚖️"
      reason: 聴覚障害者の学校で起きた実際の事件をもとにした映画。社会を動かしたほどの作品で、コン・ユの俳優としての本気が伝わる。見るのに覚悟がいる重さ。
    - name: 'イカゲーム（2021）'
      emoji: "🃏"
      reason: '地下鉄でめんこ遊びを持ちかける謎の勧誘員役。出番は短いのに強烈な印象を残し、世界中で話題になった。'
    - name: '密偵（2016）'
      emoji: "🕵️"
      reason: 'ソン・ガンホと共演した映画。日本統治時代の独立運動団のリーダー役。緊張感あふれるスパイ映画。'
  B:
    - name: 82年生まれ、キム・ジヨン（2019）
      short: キム・ジヨン
      emoji: "📖"
      reason: チョン・ユミと共演した映画。ベストセラー小説の映画化で、妻を支える夫を自然に演じた。静かだが考えさせられる作品。
    - name: サイレント・シー（2021）
      emoji: "🌕"
      reason: ペ・ドゥナと共演したNetflixシリーズ。月面の研究基地を舞台にしたSFミステリー。雰囲気は抜群だが、展開がゆっくりで好みが分かれる。
    - name: '容疑者（2013）'
      emoji: "🏃"
      reason: 'チョ・ソンハ主演のアクション映画に出演。命がけのカーチェイスなど、体を張ったアクションが見どころ。'
    - name: 'SEOBOK／ソボク（2021）'
      short: 'SEOBOK'
      emoji: "🧬"
      reason: 'パク・ボゴムと共演した映画。不老不死の鍵を握るクローンと、彼を守る元情報局員の物語。'
  C:
    - name: 乱暴＜ワイルド＞なロマンス（2012）
      short: 乱暴なロマンス
      emoji: "⚾"
      reason: イ・シヨンと共演したドラマ。プロ野球選手とボディーガードのラブコメ。気軽に楽しめるが、代表作と比べると印象は薄め。
    - name: 'BIG〜愛は奇跡〈ミラクル〉〜（2012）'
      short: 'BIG'
      emoji: "🎈"
      reason: 'スジと共演したドラマ。大人の体に高校生の魂が入ってしまうファンタジーラブコメ。設定は楽しいが、評価は控えめ。'
    - name: 'あなたの初恋探します（2010）'
      emoji: "💘"
      reason: 'イム・スジョンと共演した映画。初恋の人探しを手伝う男女のラブコメ。軽く楽しめる。'
    - name: 'ワンダーランド（2024）'
      emoji: "📱"
      reason: '亡くなった人をAIで再現して話せるサービスを描く映画。タン・ウェイ、スジ、パク・ボゴムらと共演。テーマは興味深いが静かな作品。'
    - name: 'トランク（2024）'
      emoji: "🧳"
      reason: 'ソ・ヒョンジンと共演したシリーズ。期間限定で結婚する「契約結婚サービス」をめぐる大人のミステリアスなラブストーリー。'
summary: |
  コン・ユは「ロマンス」も「重い社会派」もこなす振り幅の広い俳優。ときめきたいならトッケビ、ハラハラしたいなら新感染。
  トガニのような社会派映画にも出演し続けていることが、コン・ユが信頼される理由のひとつ。
related: [kandrama-fantasy, kandrama-2010s]
