title: 焼きそばの具 Tier表
description: 豚肉、キャベツ、もやし、紅しょうが、青のり、目玉焼き、イカ、天かす、ちくわ…ソース焼きそばの具を、AIが「入っているとうれしい度×ソースとの相性」でランク付け。
category: food
genre: 麺・粉もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 入っていると「うれしい」と思える人気
  ② ソースとの相性
  ③ 家で手軽に作れるか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 焼きそばの三大具
  D: ご当地焼きそばならではの具
tiers:
  S:
    - name: 豚肉
      emoji: "🐖"
      reason: 豚バラ肉のうまみと脂が、ソースと麺に絡む。焼きそばの主役。
    - name: キャベツ
      emoji: "🥬"
      reason: シャキシャキ食感と甘み。キャベツたっぷりの焼きそばは、屋台の定番。
    - name: 紅しょうが
      emoji: "🔴"
      reason: 甘辛いソースの味を引き締める名脇役。これがないと焼きそばの見た目が寂しくなる。
  A:
    - name: 青のり
      emoji: "🌿"
      reason: 仕上げにかけると、香りがふわっと広がる。
    - name: 目玉焼き
      emoji: "🍳"
      reason: 半熟の目玉焼きをのせて、黄身をからめながら食べる。ごちそう焼きそばに。
    - name: もやし
      emoji: "🌱"
      reason: シャキシャキ食感でボリュームアップ。
    - name: 天かす
      emoji: "🟡"
      reason: 仕上げにのせると、サクサク食感とコクが加わる。
    - name: 玉ねぎ
      emoji: "🧅"
      reason: 炒めると甘くなり、ソースとの相性がいい。
  B:
    - name: イカ
      emoji: "🦑"
      reason: 海鮮焼きそばに。噛むほどにうまみが出る。
    - name: にんじん
      emoji: "🥕"
      reason: 彩りと甘み。
    - name: ピーマン
      emoji: "🫑"
      reason: ほろ苦さがアクセントに。
    - name: ウインナー
      emoji: "🌭"
      reason: 子供向けの焼きそばの定番。
    - name: かつお節
      emoji: "🪵"
      reason: 仕上げにのせると、うまみと香りがプラスされる。
  C:
    - name: えび
      emoji: "🦐"
      reason: 海鮮焼きそばの具。ソースより塩焼きそば向き。
    - name: マヨネーズ
      emoji: "🥚"
      reason: 仕上げにかけるとまろやかに。好みは分かれる。
  D:
    - name: 肉かす
      emoji: "🟤"
      reason: 豚の背脂をしぼった後の「肉かす」を使う、静岡県富士宮市の富士宮やきそばの特徴的な具。
    - name: ちくわ
      emoji: "🍥"
      reason: 地域によっては定番の具。ご当地焼きそばならではの味わい。
summary: |
  焼きそばの具は、豚肉・キャベツ・紅しょうががS。屋台の鉄板でジュージュー焼かれる焼きそばは、お祭りの思い出の味。
  静岡の富士宮やきそばの肉かすのように、ご当地焼きそばには独特の具もある。家で作るなら、目玉焼きをのせるだけでごちそうになる。
related: [food-okonomiyaki, food-yatai, food-udon]
