title: 停電・断水への備え Tier表
description: 懐中電灯、モバイルバッテリー、携帯トイレ、水の汲み置き、カセットコンロ、ポータブル電源、ろうそく…停電や断水への備えと、やってはいけないことを「役立つ度・安全性」でS〜Dにランク付け。
category: kurashi
tags: [防災, 初心者]
published: 2026-10-05
labels:
  S: まず備える
  A: かなり役立つ
  B: あると助かる
  C: 使い方に注意
  D: やってはいけない
criteria: |
  ① 停電・断水中の困りごとを、どれだけ減らせるか
  ② 安全性（火災・中毒・ケガのリスク）
  ③ 備えやすさ・使いやすさ
  ※ 地域や住まいで、状況は異なります。屋内で火や発電機を使うときは、換気と火災に、特に注意してください。お住まいの自治体の防災情報も、あわせて確認してください
rank_notes:
  S: 最優先で備える
  D: 危険なので避ける
tiers:
  S:
    - name: 懐中電灯・ヘッドライト・LEDランタン
      short: 懐中電灯・ランタン
      emoji: "🔦"
      reason: 夜の停電で、最初に必要になる。ヘッドライトなら、両手があく。家の、すぐ手に取れる場所に、置いておく。
    - name: モバイルバッテリー（ふだんから充電しておく）
      short: モバイルバッテリー
      emoji: "🔋"
      reason: スマホは、連絡・情報・ライトに使える。使ったら、すぐ充電しなおす習慣を。
    - name: 携帯トイレ・簡易トイレ
      short: 携帯トイレ
      emoji: "🚽"
      reason: 断水で、トイレが流せなくなることがある。人数×日数分を備える。
  A:
    - name: 飲料水と、生活用の水の確保
      short: 水の確保
      emoji: "💧"
      reason: 断水に備えて、飲み水を備蓄する。お風呂の水を、ためておくと、トイレなどの生活用水に使える。
    - name: 電池式・手回し式のラジオ
      short: ラジオ
      emoji: "📻"
      reason: 通信が使えなくても、情報が得られる。災害情報や、給水の案内が、わかる。
    - name: 乾電池（種類を、そろえて予備も）
      short: 乾電池
      emoji: "🔋"
      reason: ライトやラジオに、必要。使う機器の種類に合わせて、そろえる。
    - name: 冷蔵庫の扉を、なるべく開けない
      short: 冷蔵庫を開けない
      emoji: "🧊"
      reason: 冷気を逃がさないほうが、食品が傷みにくい。傷みやすいものから食べる。
    - name: 常備薬・持病の薬の予備
      short: 常備薬
      emoji: "💊"
      reason: 停電中も、薬は必要。冷蔵が必要な薬がある場合は、保冷の方法を、医師に確認しておく。
  B:
    - name: ポータブル電源・大容量バッテリー
      short: ポータブル電源
      emoji: "⚡"
      reason: 電気を、長く使える。医療機器を使っている人にも、心強い。価格は高め。
    - name: カセットコンロ（換気しながら使う）
      short: カセットコンロ
      emoji: "🍲"
      reason: 温かい食事が、とれる。必ず換気をして、火の取り扱いに、十分に気をつける。
    - name: 保冷剤・保冷バッグ
      short: 保冷剤・保冷バッグ
      emoji: "🧊"
      reason: 薬や食品を、一時的に冷やせる。ふだんから冷凍庫に、保冷剤を入れておくと、役立つ。
    - name: 毛布・カイロ・防寒着
      short: 毛布・防寒着
      emoji: "🧣"
      reason: 冬の停電では、暖房が使えず、体が冷える。重ね着で、体温を保つ。
    - name: 非常用の食料（そのまま食べられるもの）
      short: 非常食
      emoji: "🥫"
      reason: 調理ができなくても、食べられるものを、そろえておく。
  C:
    - name: 車のバッテリーで、スマホを充電する
      short: 車で充電
      emoji: "🚗"
      reason: 役立つが、車庫など、換気の悪い場所でエンジンをかけないこと。排気ガスによる中毒に、注意する。
    - name: 懐中電灯の代わりに、スマホのライトを使い続ける
      short: スマホのライト
      emoji: "📱"
      reason: とっさの代わりにはなるが、電池をすぐ消耗してしまう。専用のライトを、別に用意する。
    - name: 水の、ペットボトル保存（置き場所・期限）
      short: ペットボトルの保存
      emoji: "🍼"
      reason: 直射日光を避け、期限を確認して、入れ替える。
  D:
    - name: ろうそくを、明かりに使う
      short: ろうそく
      emoji: "🕯️"
      reason: 倒れて、火事になるおそれがある。余震の中では、特に危険。LEDのライトを使う。
    - name: 屋内や、換気の悪い場所で発電機・炭火を使う
      short: 屋内で発電機・炭火
      emoji: "☠️"
      reason: 一酸化炭素中毒で、命を落とす危険がある。屋内では、絶対に使わない。
    - name: 停電中に、ガスコンロや暖房器具を、つけっぱなしで寝る
      short: つけっぱなしで寝る
      emoji: "🔥"
      reason: 火災や、一酸化炭素中毒の危険。就寝前に、必ず消す。
summary: |
  Sは、「懐中電灯・ライト」「モバイルバッテリー」「携帯トイレ」。この3つがあるだけで、停電・断水の不安は、ぐっと減る。
  ろうそくや、屋内での発電機・炭火は、火災や中毒の危険があるので、使わない。ふだんから使うものを、少し多めに備える「ローリングストック」と合わせて、無理のない備えを続けよう。
related: [bousai-bichiku, pet-bousai-goods, pet-bousai-sumai]
