summary: |
  フェザー級は、無敗の王者シェイドゥラエフが圧倒的な強さで君臨している。朝倉未来、久保優太、AJ・マッキーと、2025年末から次々と挑戦者を退けた。
  次の挑戦者は、クレベルを破った秋元強真。RIZINで最も層が厚く、スター選手もそろう看板階級。
  ※ 選手の状況（引退・階級変更・移籍など）は変わることがあります。最新情報はRIZIN公式サイトで確認してください。
