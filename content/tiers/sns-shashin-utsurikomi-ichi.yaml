title: SNSに写真を載せるときの写り込み・位置情報対策 Tier表
description: 位置情報を切る、窓や反射を確認する、他人の顔や家族を守る、制服や宛名に注意…SNSの写真投稿の安全対策を、ゾーマが「危険を防げる度×手軽さ」でS〜Dにランク付け。
category: sns
tags:
- SNS
- 安全性
- 初心者
published: '2026-11-17'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 危険を防げる度（住所や個人情報の特定など）

  ② 手軽さ

  ③ 続けやすさ

  ※ 専門家の助言ではなく、安全のための一般的な目安です。スマホやアプリの設定の名前は、機種・バージョンで違います。お使いの機器の説明書や、各サービスの公式ヘルプも確認してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 投稿前に、背景・写り込みをすべて確認する
    emoji: 🔍
    reason: 窓の外・電柱・表札・荷物の宛名など、場所が特定される手がかりが写ることがある。
  - name: スマホカメラの位置情報の記録を切っておく
    emoji: 📍
    reason: 写真に撮影場所が記録されるのを、もとから防げる。
  - name: 他人の顔・子どもの顔は、了承を得るか、写らないようにする
    emoji: 👤
    reason: プライバシーと、トラブル防止のため。
  A:
  - name: 旅行や外出の写真は、帰宅してから投稿する
    emoji: 🏠
    reason: 「今、家にいない」ことがわからないようにできる。
  - name: 窓や鏡・サングラスへの反射を確認する
    emoji: 🪞
    reason: 背景の景色や、撮影者の姿、周囲の情報が写っていることがある。
  - name: 制服・名札・学校名・社員証の写り込みを避ける
    emoji: 🎓
    reason: 所属先が特定されやすい。
  - name: 荷物・郵便物・宅配便の伝票は、写らないように片づける
    emoji: 📦
    reason: 住所・氏名が読み取れることがある。
  - name: 車のナンバー・マンションの外観が写っていないか確認する
    emoji: 🚗
    reason: 場所や、生活圏の特定につながる。
  - name: アップした写真を、あとで拡大して確認する
    emoji: 🔎
    reason: 小さな写り込みも、拡大すると見えることがある。
  B:
  - name: 公開範囲を、フォロワー限定にする
    emoji: 🔐
    reason: 不特定多数に見られることを減らせる。ただし、拡散には注意。
  - name: 子どもの写真は、顔が写らない角度・後ろ姿を選ぶ
    emoji: 🧒
    reason: 成長を記録しながら、安全にも配慮できる。
  - name: 自宅やお気に入りの店の場所は、あえてぼかす
    emoji: 🗺️
    reason: 行動パターンが読み取られにくくなる。
  - name: 写真の位置情報を、投稿時に削除する機能を使う
    emoji: 🛠️
    reason: サービスにより異なる。公式ヘルプで確認。
  - name: 友だちと撮った写真は、投稿前に一声かける
    emoji: 🤝
    reason: 相手が載せてほしくない場合もある。
  - name: ペットの写真でも、自宅の様子が写らないか確認する
    emoji: 🐈
    reason: 背景から、住んでいる場所が推測されることがある。
  C:
  - name: ストーリーズなど、短期間で消える投稿は、確認しなくていいと思う
    emoji: ⏳
    reason: 消える前に、見られたり、保存されたりすることがある。
  - name: ぼかし・モザイク加工だけで、安心してしまう
    emoji: 🌫️
    reason: 加工が不十分だと、読み取られることがある。
  D:
  - name: 自宅の玄関・ベランダ・窓の外を、そのまま映す
    emoji: 🚨
    reason: 住所の特定につながる、危険の大きい写り込み。
  - name: リアルタイムで、外出先・旅行先の場所を投稿し続ける
    emoji: ⚠️
    reason: 留守や、行動パターンが知られてしまう。
  - name: 他人の顔が写った写真を、断りなく投稿する
    emoji: 🚫
    reason: トラブルや、肖像権の問題になることがある。
summary: 'SNSに載せた写真は、自分では気づかない情報まで、たくさん写り込んでいることがある。住んでいる場所、行動パターン、家族の顔。ほんの少しのヒントが重なって、個人が特定されてしまうこともある。

  S級は、「投稿前に、背景や写り込みを必ず確認する習慣」だ。窓の外の景色、電柱の住所表示、玄関まわり、荷物の宛名、制服や名札、車のナンバー、友だちや他人の顔。ひとつずつ見直すだけで、リスクはぐっと減る。

  次に大切なのは、位置情報の設定。スマホで撮った写真には、撮影した場所の情報（位置情報）が、データとして記録されていることがある。SNSによっては、投稿時に自動で削除されるが、サービスやバージョンによって扱いは違うため、カメラの設定で位置情報の記録を切っておくと安心だ。

  さらに、リアルタイムでの投稿は、「今、自宅にいない」ことが伝わってしまう。旅行や外出の写真は、帰宅後に載せると安全だ。

  他人や子どもの顔が写っている場合は、本人や保護者の了承を得るか、写らない角度で撮る、スタンプや加工で隠すなどの配慮を。

  SNSは、楽しいコミュニケーションの場。ちょっとした注意で、安心して楽しめる。

  「自分は有名人じゃないから大丈夫」と思いがちだが、特定は、普通の人にも起こりうる。一度、ネットに載せた写真は、削除しても、保存・転載されることがある。投稿ボタンを押す前に、ほんの10秒、写真をじっくり見返す習慣を、ぜひ身につけてほしい。それが、いちばん簡単で、確かな安全対策だ。'
