title: 東京の百貨店（都心）Tier表
description: 伊勢丹新宿本店、三越日本橋本店、銀座三越、髙島屋、松屋銀座、西武池袋、東武池袋…東京都心の百貨店を、AIが「街での存在感×立地×個性」でS〜Dにランク付け。
category: depart
tags:
- 旅行
- あるある
published: '2026-10-09'
labels:
  S: 街の顔
  A: 地域の主役
  B: ほどよく便利
  C: こぢんまり個性派
  D: 変化の途中
criteria: '① 街での存在感（その地域で「あの百貨店」と言われるか）

  ② 立地の便利さ（駅直結・中心街など）

  ③ その店ならではの個性

  ※ AIは全店を回ったわけではありません。日本百貨店協会の店舗一覧と、各社・百貨店の公開情報、AIの印象で並べています。ランクは売上順や店の良し悪しではなく、「街での存在感・立地・個性」の目立ち方です。百貨店は閉店・改装・運営会社の変更が多いので、お出かけ前に公式サイトで最新の営業状況を確認してください（2026年10月時点）'
rank_notes:
  S: ここに行けば、その街とわかる
  D: 縮小・閉店予定など、変化の途中
tiers:
  S:
  - name: 伊勢丹新宿本店
    emoji: 🏙️
    reason: 新宿三丁目に構える、三越伊勢丹の旗艦店。ファッションの発信地として知られ、国内トップクラスの売上と言われる。
  - name: 三越日本橋本店
    emoji: 🦁
    reason: 三越ブランドの本店。越後屋から続く1673年創業の歴史と、ライオン像で知られる。
  - name: 髙島屋日本橋店
    emoji: 🏛️
    reason: 日本橋の老舗。建物は歴史的建造物としても知られ、買い物と建築見学の両方が楽しめる。
  A:
  - name: 三越銀座店
    emoji: 💎
    reason: 銀座の中心、銀座4丁目にある三越。銀座の百貨店の代表格のひとつ。
  - name: 松屋銀座
    emoji: 🌟
    reason: 銀座3丁目の老舗。銀座三越と人気・売上を争う間柄と言われる。
  - name: タカシマヤ タイムズスクエア（新宿）
    emoji: 🎄
    reason: 新宿駅南口側の髙島屋。渋谷区にあるが新宿エリアで、西武渋谷店の閉店後は渋谷区内唯一の百貨店。
  - name: 西武池袋本店
    emoji: 🛒
    reason: 池袋駅東口の大型百貨店。売場の再編が続いており、最新の営業状況は公式で確認を。
  - name: 東武百貨店池袋店
    emoji: 🌉
    reason: 池袋駅西口に直結する、東武グループの本店。「親切一番店」が企業理念。
  B:
  - name: 京王百貨店新宿店
    emoji: 🍱
    reason: 新宿駅西口。毎年1月の駅弁大会が名物。
  - name: 大丸東京店
    emoji: 🚄
    reason: 東京駅八重洲口の駅ビル内。出張や旅行のついでに寄りやすい。
  - name: 松坂屋上野店
    emoji: 🐼
    reason: 上野にある松坂屋。関東にある唯一の松坂屋の店舗とされる。
  - name: 阪急メンズ東京
    emoji: 👔
    reason: 有楽町にある、男性向けの阪急の店。
  C:
  - name: 松屋浅草
    emoji: 🏮
    reason: 1931年に東武浅草駅の駅ビルとして開業。関東初の駅直結の百貨店。
  - name: 小田急百貨店新宿店
    emoji: 🌆
    reason: 新宿駅西口の小田急グループの百貨店。再開発で店の形が変わっている最中なので、営業状況は公式で確認を。
  D: []
summary: '東京は、日本橋・銀座・新宿・池袋・上野と、街ごとに百貨店の色が違う。S級は、その街の格や買い物の目的になる旗艦店。

  新宿と池袋は、駅の再開発で店の形が変わっている最中。お出かけ前に最新情報を確認したい。'
