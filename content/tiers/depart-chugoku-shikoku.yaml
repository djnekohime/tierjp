title: 中国・四国の百貨店 Tier表
description: 天満屋、福屋、そごう広島、広島三越、岡山髙島屋、伊予鉄髙島屋、高松三越、高知大丸…中国・四国の百貨店を、AIが「街での存在感×立地×個性」でS〜Dにランク付け。
category: depart
tags:
- 旅行
- あるある
published: '2026-10-09'
labels:
  S: 街の顔
  A: 地域の主役
  B: ほどよく便利
  C: こぢんまり個性派
  D: 変化の途中
criteria: '① 街での存在感（その地域で「あの百貨店」と言われるか）

  ② 立地の便利さ（駅直結・中心街など）

  ③ その店ならではの個性

  ※ AIは全店を回ったわけではありません。日本百貨店協会の店舗一覧と、各社・百貨店の公開情報、AIの印象で並べています。ランクは売上順や店の良し悪しではなく、「街での存在感・立地・個性」の目立ち方です。百貨店は閉店・改装・運営会社の変更が多いので、お出かけ前に公式サイトで最新の営業状況を確認してください（2026年10月時点）'
rank_notes:
  S: ここに行けば、その街とわかる
  D: 閉店予定など、変化の途中
tiers:
  S:
  - name: 天満屋岡山本店
    emoji: 🍑
    reason: 岡山の地場百貨店の本店。地場百貨店として日本一の売上と紹介される。
  - name: 福屋八丁堀本店（広島）
    emoji: 🍁
    reason: 広島市の地域一番店と紹介される、地場百貨店の本店。
  - name: そごう広島店
    emoji: 🐟
    reason: 広島・紙屋町地区にあるそごうの基幹店のひとつ。通称は「広島そごう」。
  A:
  - name: 広島三越
    emoji: 🦁
    reason: 広島の三越。三越伊勢丹グループの子会社が運営。
  - name: 岡山髙島屋
    emoji: 🏯
    reason: 岡山駅前の髙島屋。
  - name: 伊予鉄髙島屋（松山）
    emoji: 🍊
    reason: 松山市駅前。伊予鉄グループの主要子会社で、髙島屋の系列。
  - name: 松山三越
    emoji: 🏯
    reason: 大街道商店街付近の三越。2021年に全館リニューアルオープン。
  B:
  - name: 高松三越
    emoji: 🌿
    reason: 香川県唯一の日本百貨店協会加盟店。三越伊勢丹の完全子会社が運営。
  - name: 高知大丸
    emoji: 🦖
    reason: 高知県唯一の百貨店。2002年の高知西武閉店後は、県内唯一。
  - name: 丸由百貨店（鳥取）
    emoji: 🦀
    reason: 鳥取市の百貨店。
  - name: 山口井筒屋
    emoji: 🍶
    reason: 山口市の百貨店。福岡の井筒屋の子会社。
  - name: 福屋広島駅前店
    emoji: 🚉
    reason: 広島駅前の福屋の店舗。
  C:
  - name: 天満屋福山店
    emoji: 🌹
    reason: 福山駅前の天満屋。
  - name: 天満屋倉敷店
    emoji: 🏘️
    reason: 倉敷の天満屋。
  - name: 米子しんまち天満屋
    emoji: 🍑
    reason: 米子にある天満屋の系列店。
  - name: 米子髙島屋
    emoji: 🏯
    reason: 米子にある髙島屋の系列店。
  - name: 福屋五日市店
    emoji: 🌳
    reason: 広島市佐伯区の五日市駅前にある福屋の店舗。
  - name: 天満屋津山店
    emoji: 🏔️
    reason: 津山の天満屋。
  D:
  - name: 大丸下関店
    emoji: ⚓
    reason: 下関の大丸。2027年8月末に閉店する予定が公表されている。
summary: '広島と岡山は、地場と大手が並び立つ、百貨店の元気な街。広島は、福屋・そごう・三越。岡山は、天満屋と髙島屋。

  四国は、各県に百貨店が1〜2店ずつ。高知は、高知大丸が県内唯一の百貨店。徳島県は、2024年にそごう徳島店の閉店で、百貨店のない県になった。'
