title: ペットとお花見で気をつけること Tier表
description: 桜の下の食べ物、人混み、リード、日なたの暑さ、ごみ、他の人への配慮、拾い食い、花粉…ペットとお花見に行くときに気をつけることを「危険度・守りたい度」でS〜Dにランク付け。
category: animals
tags: [ペット, 犬, 猫]
published: 2026-10-05
labels:
  S: 必ず守る
  A: 要注意
  B: 気をつけたい
  C: 心がけたい
  D: 小さな落とし穴
criteria: |
  ① ペットの安全・健康への危険度
  ② 起こりやすさ（お花見ならではか）
  ③ 周りの人への迷惑・マナー
  ※ 一般的な注意点の整理です。公園や会場によって、ペット同伴のルールが違うので、事前に確認してください。獣医さんの助言ではなく目安なので、心配なときは、動物病院に相談してください
rank_notes:
  S: 出かける前に、必ず確認
  D: 気をつけたい小さなこと
tiers:
  S:
    - name: 公園・会場のペット同伴ルールを確認する
      short: 同伴ルールの確認
      emoji: "📑"
      reason: 同伴不可の場所もある。リードや、マナーの決まりも、確認しておく。
    - name: リードを短く持ち、離さない（脱走・事故の防止）
      short: リードを離さない
      emoji: "🦮"
      reason: 人混みや、大きな音で、驚いて走り出す危険がある。猫は、外へ出さないのが、基本。
    - name: 人間の食べ物・飲み物を、ペットに与えない（特にネギ類・チョコ・アルコール）
      short: 人間の食べ物
      emoji: "🍢"
      reason: お弁当には、ペットに危険なものが多い。置きっぱなしにも、注意する。
  A:
    - name: 地面の落ちている物の、拾い食い（串・骨・お酒の缶）
      short: 拾い食い
      emoji: "🗑️"
      reason: 串や、骨で、口や、腸を傷つけることがある。お酒の缶に残った、お酒を、舐めることも。
    - name: 暑さ・日なたでの、熱中症
      short: 暑さ・日なた
      emoji: "☀️"
      reason: 春でも、日なたは、暑くなる。日陰と、水を用意して、短い時間で切り上げる。
    - name: 人混み・大音量・花火の音のストレス
      short: 人混み・音
      emoji: "🔊"
      reason: 苦手な子には、大きな負担になる。様子を見て、早めに帰る。
    - name: 他の犬や、人との、トラブル（かみつき・吠え）
      short: 他の犬・人との接触
      emoji: "🐕"
      reason: 近づく前に、飼い主に、確認する。苦手な子は、距離を取る。
  B:
    - name: 桜の花びら・枝・落ち葉の誤飲
      short: 花びら・枝の誤飲
      emoji: "🌸"
      reason: 桜の葉や、種などは、犬猫には、危険なことがある。口に入れさせない。
    - name: 地面の冷え・濡れ・虫・ダニ（草むら）
      short: 地面・虫
      emoji: "🌿"
      reason: ダニに、かまれることがある。レジャーシートを、使って、帰ったら、体をチェックする。
    - name: 水・おやつ・トイレ用品の持ち物の準備
      short: 持ち物の準備
      emoji: "🎒"
      reason: 水は、必ず持っていく。うんちの処理袋や、おしっこ用の、水・シートも、必須。
    - name: 花粉（人もペットも）
      short: 花粉
      emoji: "🤧"
      reason: 帰宅後に、体を拭くと、家に持ち込みにくい。かゆみが続くなら、病院へ。
  C:
    - name: シートに、ペットを自由にさせすぎる（周りの人の迷惑）
      short: 自由にさせすぎ
      emoji: "🧺"
      reason: 周りの人に、迷惑がかかることがある。ペットの居場所を、決めておく。
    - name: 夜桜・夜の暗い道での散歩
      short: 夜桜の散歩
      emoji: "🌙"
      reason: 暗くて、足元が見えにくい。反射材や、ライトを、つける。
  D:
    - name: 長時間、同じ場所にいる（疲れ・ストレス）
      short: 長居
      emoji: "⏳"
      reason: ペットも疲れる。短めに切り上げて、帰ってから、ゆっくり休ませる。
    - name: 写真を撮ることに夢中になって、ペットから目を離す
      short: 目を離す
      emoji: "📸"
      reason: 脱走や、拾い食いを、見逃す。撮影のときも、リードは離さない。
summary: |
  Sは、「同伴ルールの確認」「リードを離さない」「人間の食べ物を与えない」。お花見は、ペットにとっては、刺激が多い場所なので、短めに楽しもう。
  お弁当や、お酒には、ペットに危ないものが多いので、置きっぱなしにしない。帰ったら、体を拭いて、ダニ・花粉をチェックしよう。
related: [pet-kafun, inu-sanpo, pet-nomidani-taisaku]
