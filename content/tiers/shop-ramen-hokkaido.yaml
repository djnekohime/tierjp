    - name: 味の三平（札幌）
      short: 味の三平
      emoji: "🟤"
      reason: 札幌味噌ラーメンの発祥の店として知られる。今では北海道を代表する味噌ラーメンの原点がここにある。
    - name: すみれ 中の島本店（札幌）
      short: すみれ
      emoji: "🌸"
      reason: 濃厚な味噌スープとラードの層で、熱々のまま最後まで楽しめる札幌味噌ラーメンの代表格。全国にファンを持つ。
    - name: さっぽろ純連（札幌）
      short: 純連
      emoji: "🔥"
      reason: すみれと並んで、濃厚な札幌味噌ラーメンの流れを作った名店。「純すみ系」と呼ばれる系統の源流として知られる。
    - name: 蜂屋 五条創業店（旭川）
      short: 蜂屋
      emoji: "🐝"
      reason: 旭川ラーメンの老舗。焦がしたラードの香ばしい香りが特徴で、旭川の醤油ラーメンを語るうえで欠かせない一軒。
  A:
    - name: 旭川らぅめん青葉 本店（旭川）
      short: 青葉
      emoji: "🍃"
      reason: 旭川ラーメンを代表する老舗の一つ。魚介と動物系を合わせたスープの、旭川醤油ラーメンの王道。
    - name: らーめんや天金 四条店（旭川）
      short: 天金
      emoji: "✨"
      reason: 長い歴史を持つ旭川の人気店。地元の人に長く通われてきた旭川ラーメンの定番。
