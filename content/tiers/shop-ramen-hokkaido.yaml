    - name: えびそば一幻 総本店（札幌）
      short: 一幻
      emoji: "🦐"
      reason: えびの香りを前面に出した「えびそば」で人気に。新千歳空港にも店があり、北海道みやげとしても知られる。
    - name: あじさい 本店（函館）
      short: あじさい
      emoji: "💠"
      reason: 函館の塩ラーメンを代表する老舗。透き通ったやさしいスープの函館塩ラーメンの定番として知られる。
    - name: けやき すすきの本店（札幌）
      short: けやき
      emoji: "🌳"
      reason: すすきのにある札幌味噌ラーメンの人気店。観光客にも地元の人にも愛される。
