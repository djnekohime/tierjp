criteria: '① 2026年の東京大学合格者数（人数の多さ）

  ② 公立（都道府県・市立）の高校だけを対象

  ※ 2026年3月時点の速報値（大学通信・サンデー毎日・AERAの3社共同調査などの公表値）です。集計元や時点で1〜2人の差が出ます。合格者数は学年の人数にも左右され、学校の良し悪しや、入学後の伸びを表すものではありません'
