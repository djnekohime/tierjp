title: おでんの具 Tier表
description: 大根、卵、牛すじ、ちくわぶ、はんぺん、もち巾着…おでんの具を、AIが「食べたい度×だしのしみ具合×満足感」でランク付け。関東と関西で意見が割れる具も。
category: food
genre: 鍋・季節の食べ物
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「まずこれを取る」と思える人気
  ② だしがしみたときのおいしさ
  ③ お腹が満たされる満足感
  ※ 地域によって定番の具が違います。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 鍋にこれがないとおでんじゃない
  D: 地域限定・変わり種
tiers:
  S:
    - name: 大根
      emoji: "⚪"
      reason: おでんの主役。だしをたっぷり吸った大根は、箸で切れるやわらかさ。一番に取る人も、最後まで取っておく人もいる不動の王様。
    - name: 卵
      emoji: "🥚"
      reason: 茶色くしみたゆで卵は、黄身をだしに溶かしながら食べるのも楽しい。子供から大人までみんな好き。
    - name: 牛すじ
      emoji: "🐂"
      reason: 関西では定番の具。とろとろに煮込まれたすじ肉は、だしにうまみも加えてくれる。
  A:
    - name: もち巾着
      emoji: "👛"
      reason: 油揚げの中にお餅が入った、宝物のような具。とろけたお餅とだしのしみた油揚げで満足感が大きい。
    - name: はんぺん
      emoji: "☁️"
      reason: ふわふわの食感で、だしをすぐに吸う。関東のおでんでおなじみの具。
    - name: 厚揚げ
      emoji: "🟫"
      reason: 外は香ばしく中はやわらか。だしがしみると、ジューシーな一品に。
    - name: こんにゃく
      emoji: "🔺"
      reason: ぷるぷるの食感と、しみた味。ヘルシーで、いくつ食べても罪悪感が少ない。
    - name: ちくわぶ
      emoji: "🌀"
      reason: 小麦粉で作る、関東ならではの具。もちもちの食感で、関東の人には欠かせないが、他の地域では「何これ？」と言われることも。
  B:
    - name: ちくわ
      emoji: "🍥"
      reason: 穴にだしがたまって、噛むとじゅわっと出てくる。定番の練り物。
    - name: さつま揚げ
      emoji: "🟠"
      reason: 魚のすり身を揚げた練り物。だしにうまみを出してくれる縁の下の力持ち。
    - name: ごぼう巻き
      emoji: "🌿"
      reason: 練り物の中にごぼうが入っていて、香りと歯ごたえが楽しい。
    - name: じゃがいも
      emoji: "🥔"
      reason: ほくほくでお腹いっぱいに。煮込みすぎると崩れるのが悩み。
    - name: 昆布
      emoji: "🎀"
      reason: 結び昆布はだしの素でもあり、具でもある。やわらかく煮えた昆布はしみじみおいしい。
    - name: つみれ
      emoji: "🐟"
      reason: 魚のすり身の団子。ふんわりした食感と魚のうまみで、だしとの相性がいい。
  C:
    - name: ロールキャベツ
      emoji: "🥬"
      reason: コンビニおでんで人気になった具。洋風だが、だしで煮込むと意外なほどなじむ。
    - name: ウインナー
      emoji: "🌭"
      reason: 子供に人気の具。プリッとした食感で、だしに少し洋風のうまみが加わる。
    - name: がんもどき
      emoji: "🟤"
      reason: 豆腐に野菜を混ぜて揚げた具。だしをたっぷり吸って、噛むとじゅわっとあふれる。
  D:
    - name: 黒はんぺん
      emoji: "⚫"
      reason: 静岡おでんの名物。青魚から作る灰色のはんぺんで、だし粉をかけて食べる。静岡の人にとってはS級の具。
    - name: トマト
      emoji: "🍅"
      reason: 最近見かけるようになった変わり種。だしで温めたトマトは、甘みが増して意外な発見がある。
summary: |
  おでんの具は、大根・卵・牛すじがS。どれも「だしがしみるほどおいしくなる」具で、おでんの鍋の主役。
  ちくわぶは関東、牛すじは関西、黒はんぺんは静岡と、地域によって「当たり前の具」が違うのがおでんの面白さ。あなたの地元の定番は何位？
related: [food-onigiri, food-ramen-aji]
