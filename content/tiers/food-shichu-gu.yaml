summary: 'シチューは、具がそれぞれの甘みと旨みをとかし込んで、ひと皿の味になる料理。S級のじゃがいも・にんじん・玉ねぎ・鶏肉は、どれも火が通ると甘くなり、ミルクのまろやかさと自然に溶け合う。

  コツは、火の通りにくいものから順に入れること。にんじん・じゃがいもを先に煮て、きのこやブロッコリーは後半に入れると、食感と色がきれいに残る。ブロッコリーは別にゆでて最後に添えれば、煮崩れも防げる。

  おいしく仕上げる小さなコツをもうひとつ。具を入れる前に、玉ねぎと肉を軽く炒めて旨みを引き出しておくと、ルーを溶かしたときの深みが違ってくる。余ったシチューは、グラタンやドリア、パンにのせて焼くアレンジも楽しめる。

  具を入れすぎて水っぽくならないよう、野菜の水分も見込んで、水の量は少し控えめにするのがおすすめ。野菜がたくさん食べられるので、寒い日の晩ごはんにぴったりの一皿になる。

  買い物のコツは、じゃがいもは芽や緑色の部分がないものを選ぶこと。調理のときは、芽や緑の部分は厚めに取り除いてから使おう。ルーは、メーカーの表示どおりの水の量で作るのが失敗しにくい。市販のルーに、自分好みのスパイスや粉チーズをひとふりするだけで、ぐっと本格的な味わいになる。具だくさんにして、食パンを添えれば、洗い物の少ない寒い日のごちそうになる。最後にひとつ。作った翌日は味がなじんでさらにおいしくなるので、多めに作って2日楽しむのもおすすめ。温め直すときは焦げ付きやすいので、弱火で混ぜながらゆっくりと。'
