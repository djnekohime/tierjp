title: 惣菜パン Tier表
description: カレーパン、焼きそばパン、コロッケパン、ソーセージパン、ピザパン…パン屋さんやコンビニの惣菜パンを、AIが「食べたい度×満足感×パン屋さんらしさ」でランク付け。
category: food
genre: パン・朝食
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① パン屋さんで「まずこれを取る」人気
  ② お腹が満たされる満足感
  ③ 惣菜パンならではの楽しさ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: トレーに必ずのせる三大惣菜パン
tiers:
  S:
    - name: カレーパン
      emoji: "🍛"
      reason: 揚げたてのサクサク生地と中のカレー。惣菜パンの人気ランキングで常にトップクラスの王様。パン屋ごとの味の違いを食べ比べるのも楽しい。
    - name: 焼きそばパン
      emoji: "🍝"
      reason: 炭水化物に炭水化物を合わせた最強の組み合わせ。紅しょうがが添えてあるとうれしい、昔ながらの人気者。
    - name: ソーセージパン
      emoji: "🌭"
      reason: パリッとしたソーセージをパンで巻いたシンプルな一品。ケチャップやマスタードで、子供から大人まで好き。
  A:
    - name: コロッケパン
      emoji: "🥔"
      reason: ソースのしみたコロッケをはさんだ、ボリューム満点の一品。昔からの学生の味方。
    - name: ピザパン
      emoji: "🍕"
      reason: トマトソースとチーズ、ピーマンやサラミをのせた、焼きたての香りがたまらないパン。
    - name: ツナマヨパン
      emoji: "🥫"
      reason: ツナとマヨネーズのまろやかな組み合わせ。コーンや玉ねぎが入っていると、さらにうれしい。
    - name: 照り焼きチキンサンド
      short: 照り焼きチキン
      emoji: "🐔"
      reason: 甘辛い照り焼きチキンとマヨネーズ。食べごたえがあって、お昼ごはんにぴったり。
    - name: カツサンド
      emoji: "🐖"
      reason: ソースのしみたとんかつをはさんだ、ごちそう惣菜パン。冷めてもおいしいのが強み。
  B:
    - name: ハムチーズパン
      emoji: "🧀"
      reason: ハムとチーズの鉄板コンビ。朝ごはんにちょうどいい軽さ。
    - name: たまごサンド
      emoji: "🥚"
      reason: まろやかな卵サラダをはさんだ定番。コンビニのたまごサンドは海外の旅行者にも人気。
    - name: ベーコンエピ
      emoji: "🌾"
      reason: 麦の穂の形をしたフランスパンにベーコンを巻いた、パン屋さんらしい一品。ちぎって食べるのが楽しい。
    - name: ちくわパン
      emoji: "🍥"
      reason: ちくわの穴にツナサラダを詰めた北海道の名物パン。見た目のインパクトとおいしさで全国に広がった。
    - name: きんぴらパン
      emoji: "🥕"
      reason: 甘辛いきんぴらごぼうをはさんだ和風パン。意外な組み合わせだが、ご飯のおかずのように食べられる。
  C:
    - name: ナポリタンパン
      emoji: "🍅"
      reason: 焼きそばパンのナポリタン版。懐かしい味で、見かけるとつい手に取りたくなる。
    - name: 明太フランス
      emoji: "🌶️"
      reason: 明太子とバターをぬって焼いたフランスパン。香ばしくて、お酒のおつまみにもなる。
  D:
    - name: おにぎりパン（ご飯入りパン）
      short: ご飯入りパン
      emoji: "🍙"
      reason: パンの中にご飯や和風の具が入った変わり種。「パンなのかご飯なのか」という驚きが楽しい、見つけたら挑戦したい一品。
summary: |
  惣菜パンはカレーパン・焼きそばパン・ソーセージパンがS。どれも「おかず」と「パン」を一度に食べられる、日本のパン屋さんならではの発明。
  ちくわパンやきんぴらパンのような和風の惣菜パンは、日本のパン文化の自由さの象徴。近所のパン屋さんで、まだ食べたことのない一品を探してみて。
related: [food-onigiri, food-curry-gu]
