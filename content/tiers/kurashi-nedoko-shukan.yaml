title: 寝る前の習慣 Tier表
description: スマホを置く、入浴、ストレッチ、読書、部屋を暗くする…寝る前の習慣を、AIが「続けやすさ×気持ちの落ち着き×手軽さ」でS〜Dにランク付け。
category: kurashi
tags:
- 初心者
published: '2026-10-07'
labels:
  S: まずこれ
  A: 続けやすい
  B: 慣れたら
  C: 人による
  D: 避けたい
criteria: '① 続けやすさ

  ② 気持ちが落ち着く度

  ③ 手軽さ

  ※ 睡眠の悩みが続くときは、無理せず医師に相談してください。ここでは一般的に言われている習慣を整理しています'
rank_notes:
  S: いちばん続けやすい
  D: 眠りを妨げやすい
tiers:
  S:
  - name: 部屋の明かりを少し落とす
    emoji: 💡
    reason: 暗めの光が、眠りの合図になる。照明を暖色にするのもよい。
  - name: 寝る少し前に、スマホを置く
    emoji: 📵
    reason: 画面の光や情報で、目が冴えやすい。枕元ではなく、離れた場所に。
  A:
  - name: ぬるめのお風呂（寝る1時間か2時間前）
    emoji: 🛁
    reason: 体が温まったあと、体温が下がるときに眠くなりやすい。
  - name: 軽いストレッチ
    emoji: 🧘
    reason: 体がほぐれて、リラックスしやすい。激しい運動は避ける。
  - name: 紙の本を少し読む
    emoji: 📖
    reason: 静かな時間に。長編より、短いエッセイなどが向く。
  - name: 寝室を涼しく、静かに
    emoji: 🌙
    reason: 快適な温度と静けさは、眠りの質につながる。
  B:
  - name: 明日の準備をしておく
    emoji: 🎒
    reason: 朝の不安が減って、安心して眠れる。
  - name: 日記・今日の3つのよかったこと
    emoji: 📓
    reason: 気持ちが整理され、落ち着いて眠れる。
  - name: ゆったりした音楽・環境音
    emoji: 🎵
    reason: 音量を小さめに、タイマーで消す。
  - name: ホットミルク・白湯（少量）
    emoji: 🥛
    reason: 体が温まり、ほっとする。飲み過ぎるとトイレに起きる。
  C:
  - name: アロマ（ラベンダーなど）
    emoji: 🌿
    reason: 香りでリラックスできる人も。ペットがいる家では、安全性に注意。
  - name: 寝る前の軽い食事（消化のよいもの）
    emoji: 🍞
    reason: 空腹で眠れないときは、少量なら。食べ過ぎは眠りを浅くする。
  D:
  - name: 寝る直前のカフェイン（コーヒー・紅茶・エナジードリンク）
    emoji: ☕
    reason: 眠りを妨げやすい。夕方以降は控えめに。
  - name: ベッドで、ずっとスマホを見る
    emoji: 📱
    reason: 眠りにつきにくく、睡眠時間も削られやすい。
  - name: 寝る直前の、激しい運動・熱いお風呂
    emoji: 🔥
    reason: 体が興奮して、眠りにくい。
summary: '寝る前は、「刺激を減らして、体と心を落ち着かせる」のが基本。S級は、お金も手間もかからない、部屋を暗めにする、スマホを遠ざけるといった習慣。

  眠れないときに、ベッドの上でスマホを見続けるのは、かえって目が冴えやすい。'
related:
- kurashi-asa-routine
- pet-rusuban-ondo
- food-furoagari
