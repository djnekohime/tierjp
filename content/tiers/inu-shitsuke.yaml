title: 犬の基本のしつけ Tier表
description: トイレ、おすわり、待て、呼び戻し、リードで歩く、噛みつき対策、お留守番…犬の基本のしつけを「優先度・生活への影響」でS〜Dにランク付け。初めて犬を迎える人に。
category: animals
tags: [犬, ペット, 初心者]
published: 2026-10-05
labels:
  S: 最初に教える
  A: 早めに身につけたい
  B: あると楽
  C: 慣れてから
  D: 無理に教えなくていい
criteria: |
  ① 犬と飼い主の安全に関わるか
  ② 毎日の生活で、どれだけ役立つか
  ③ 教えやすさ・早めに始める価値
  ※ しつけは、叱るより、できたときにほめる方法が、一般的に勧められています。犬種・年齢・性格で、進み方はさまざまです。困ったときは、獣医師やトレーナーに相談してください
rank_notes:
  S: 安全と暮らしの土台
  D: 必須ではない
tiers:
  S:
    - name: トイレの場所を覚える
      short: トイレ
      emoji: "🚽"
      reason: 毎日の暮らしの土台。成功したらほめる。失敗しても、叱らず、静かに片づける。
    - name: 名前を呼ぶと、こちらを見る（アイコンタクト）
      short: 名前を呼ぶと見る
      emoji: "👀"
      reason: すべてのしつけの入り口。名前を呼んで、見たらほめる。
    - name: 呼んだら来る（呼び戻し）
      short: 呼び戻し
      emoji: "📣"
      reason: 脱走や事故のときに、命を守ることもある。来たら必ず、いいことがあるようにする。
  A:
    - name: おすわり
      emoji: "🐕"
      reason: ほかの指示の基本。興奮した犬を、落ち着かせるのにも役立つ。
    - name: 待て（マテ）
      short: 待て
      emoji: "✋"
      reason: 道路に飛び出すのを防ぐ。短い時間から、少しずつのばす。
    - name: リードで歩く（引っ張らない）
      short: リードで歩く
      emoji: "🦮"
      reason: 散歩を安全で、楽しいものにする。引っ張ったら止まる、など、一貫した対応が大切。
    - name: 体を触られるのに慣れる（足・耳・口）
      short: 体を触られる慣れ
      emoji: "🤲"
      reason: お手入れや、病院での診察が、楽になる。子犬のうちから、少しずつ慣らす。
    - name: ケージやクレートで落ち着く
      short: クレートに慣れる
      emoji: "🏠"
      reason: 災害時や、移動のときに、役立つ。安心できる場所として、教える。
  B:
    - name: お留守番ができる
      short: お留守番
      emoji: "🕰️"
      reason: 飼い主が出かけるときに、落ち着いて待てる。短い時間から、少しずつ慣らす。
    - name: 伏せ（フセ）
      short: 伏せ
      emoji: "🛏️"
      reason: 落ち着かせたいときに、便利。
    - name: ごはんの前に待てる
      short: ごはんの待て
      emoji: "🍽️"
      reason: 落ち着いて食べる習慣づくりに、役立つ。
    - name: 噛みつき・甘噛みをやめる
      short: 甘噛み対策
      emoji: "🦷"
      reason: 子犬のうちから、噛んでいいものを教える。人の手を噛んだら、遊びを中断する。
    - name: 無駄吠えを減らす
      short: 無駄吠え対策
      emoji: "📢"
      reason: 近所への気づかいにもなる。吠える理由（要求・警戒・不安）を探って、対応を変える。
  C:
    - name: ハウス（自分のベッドに行く）
      short: ハウス
      emoji: "🛋️"
      reason: 来客時など、落ち着かせたいときに、便利。
    - name: 他の犬や人に慣れる（社会化）
      short: 社会化
      emoji: "🐾"
      reason: とても大切だが、無理は禁物。犬の様子を見て、少しずつ。
    - name: 車・電車での移動に慣れる
      short: 移動に慣れる
      emoji: "🚗"
      reason: 通院や、避難のときに、役立つ。短い時間から、ならす。
  D:
    - name: おまわり・バンザイなどの芸
      short: 芸
      emoji: "🎪"
      reason: 楽しい遊びだが、必須ではない。犬が楽しめる範囲で。
    - name: 叱って、恐怖で言うことを聞かせる
      short: 叱って恐怖で従わせる
      emoji: "🚫"
      reason: 犬が、人を怖がるようになり、かえって問題行動が増えることがある。できたときに、ほめる方法を基本にする。
summary: |
  最初に教えたいのは、「トイレ」「名前を呼ぶと見る」「呼んだら来る」。毎日の暮らしと、犬の安全の土台になる。
  叱るより、できたときにほめるほうが、犬も飼い主も、楽しく続けられる。うまくいかないときは、ひとりで悩まず、獣医師やトレーナーに相談しよう。
related: [inu-shurui, inu-aruaru, inu-nigate]
