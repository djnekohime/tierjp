title: 甲信越・東海・北陸の百貨店 Tier表
description: ジェイアール名古屋タカシマヤ、松坂屋名古屋、新潟伊勢丹、静岡伊勢丹、遠鉄、金沢エムザ、大和…甲信越・東海・北陸の百貨店を、AIが「街での存在感×立地×個性」でS〜Dにランク付け。
category: depart
tags:
- 旅行
- あるある
published: '2026-10-09'
labels:
  S: 街の顔
  A: 地域の主役
  B: ほどよく便利
  C: こぢんまり個性派
  D: 変化の途中
criteria: '① 街での存在感（その地域で「あの百貨店」と言われるか）

  ② 立地の便利さ（駅直結・中心街など）

  ③ その店ならではの個性

  ※ AIは全店を回ったわけではありません。日本百貨店協会の店舗一覧と、各社・百貨店の公開情報、AIの印象で並べています。ランクは売上順や店の良し悪しではなく、「街での存在感・立地・個性」の目立ち方です。百貨店は閉店・改装・運営会社の変更が多いので、お出かけ前に公式サイトで最新の営業状況を確認してください（2026年10月時点）'
rank_notes:
  S: ここに行けば、その街とわかる
  D: 縮小・閉店予定など、変化の途中
tiers:
  S:
  - name: ジェイアール名古屋タカシマヤ
    emoji: 🚅
    reason: 名古屋駅直結のJRセントラルタワーズ内。2000年開店で、2014年度以降は名古屋の地域一番店と紹介される。
  - name: 松坂屋名古屋店
    emoji: 🐯
    reason: 名古屋発祥の松坂屋の本店格。大丸松坂屋百貨店全店でも最大の売上高を誇る旗艦店。
  A:
  - name: 新潟伊勢丹
    emoji: ❄️
    reason: 新潟駅前、新潟市中心部の三越伊勢丹グループの百貨店。
  - name: 静岡伊勢丹
    emoji: 🍵
    reason: 静岡・呉服町の伊勢丹。
  - name: 松坂屋静岡店
    emoji: 🗻
    reason: 静岡駅北口の松坂屋。
  - name: 遠鉄百貨店（浜松）
    emoji: 🚌
    reason: 浜松駅前、遠州鉄道グループの百貨店。
  - name: 名古屋三越栄店
    emoji: 🦁
    reason: 名古屋・栄の三越。ラシックと一体で運営。
  - name: ながの東急百貨店
    emoji: 🌲
    reason: 長野駅前の百貨店。長野県で最大の百貨店。
  B:
  - name: 金沢エムザ
    emoji: 🏮
    reason: 近江町市場に近い、金沢の百貨店。2021年に名鉄グループを離れ、店名は「金沢エムザ」に改名。
  - name: 大和香林坊店（金沢）
    emoji: 🎎
    reason: 金沢・香林坊の大和。北陸の地場百貨店。
  - name: 大和富山店
    emoji: 🌷
    reason: 富山市の総曲輪にある大和の店舗。
  - name: 近鉄百貨店四日市店
    emoji: 🚆
    reason: 三重県内最大の百貨店。近鉄四日市駅の駅ビル内。
  - name: 岡島（甲府）
    emoji: 🍇
    reason: 山梨県内唯一の日本百貨店協会加盟の百貨店。2023年に建物を移転して、規模を縮小した。
  C:
  - name: 名古屋三越星ヶ丘店
    emoji: ⭐
    reason: 名古屋・星ヶ丘の三越。住宅街の暮らしに寄り添う店。
  - name: 津松菱
    emoji: 🍵
    reason: 津市にある百貨店で、津市内唯一の百貨店。津市など三重県中部が商圏。
  - name: 井上（松本）
    emoji: ⛰️
    reason: 松本・山形村のアイシティ21を中心に営業する、長野の地場百貨店。
  - name: 西武福井店
    emoji: 🦀
    reason: 福井駅前。そごう・西武が運営する、福井県の百貨店。
  D: []
summary: '名古屋は、名駅と栄で百貨店の勢力図が動いた街。2014年度以降は、名駅のJR名古屋タカシマヤが地域一番店と紹介される。

  名古屋市を除く東海3県の百貨店は、今は津松菱と近鉄四日市店など、ごくわずか。名鉄百貨店本店は、2026年2月に閉業した。'
