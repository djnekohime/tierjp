summary: '旅行先で必ず食べるものは、海鮮丼・ご当地ラーメン・ソフトクリームがS。旅先でしか食べられない味は、一番の思い出になる。

  市場の食べ歩きや、駅弁のように、移動も含めて楽しめる食べ物も、旅の魅力。

