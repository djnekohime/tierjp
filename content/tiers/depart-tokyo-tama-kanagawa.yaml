title: 東京多摩・神奈川の百貨店 Tier表
description: 横浜そごう、横浜髙島屋、吉祥寺東急、立川伊勢丹、町田小田急、さいか屋…東京多摩・神奈川の百貨店を、AIが「街での存在感×立地×個性」でS〜Dにランク付け。
category: depart
tags:
- 旅行
- あるある
published: '2026-10-09'
labels:
  S: 街の顔
  A: 地域の主役
  B: ほどよく便利
  C: こぢんまり個性派
  D: 変化の途中
criteria: '① 街での存在感（その地域で「あの百貨店」と言われるか）

  ② 立地の便利さ（駅直結・中心街など）

  ③ その店ならではの個性

  ※ AIは全店を回ったわけではありません。日本百貨店協会の店舗一覧と、各社・百貨店の公開情報、AIの印象で並べています。ランクは売上順や店の良し悪しではなく、「街での存在感・立地・個性」の目立ち方です。百貨店は閉店・改装・運営会社の変更が多いので、お出かけ前に公式サイトで最新の営業状況を確認してください（2026年10月時点）'
rank_notes:
  S: ここに行けば、その街とわかる
  D: 縮小・閉店予定など、変化の途中
tiers:
  S:
  - name: そごう横浜店
    emoji: ⚓
    reason: 横浜駅東口の大型百貨店。そごう・西武の基幹店で、通称は「横浜そごう」。
  - name: 横浜髙島屋
    emoji: 🌊
    reason: 横浜駅西口、相鉄の駅ビル「ジョイナス」の核店舗。
  A:
  - name: 伊勢丹立川店
    emoji: 🌸
    reason: 立川駅前にある三越伊勢丹の店舗。多摩地区の買い物の中心のひとつ。
  - name: 東急百貨店吉祥寺店
    emoji: 🌳
    reason: 吉祥寺駅前。東急グループの店で、街の雰囲気に合う品ぞろえ。
  - name: 小田急百貨店町田店
    emoji: 🚃
    reason: 町田駅前の小田急の店。町田の駅前の暮らしを支える。
  - name: 京急百貨店（上大岡）
    emoji: 🚌
    reason: 京急の上大岡駅ビルにある京急グループの百貨店。大手私鉄では珍しく、都心の巨大ターミナルではなく郊外駅に大型店を持つ。
  B:
  - name: 東急百貨店たまプラーザ店
    emoji: 🏡
    reason: 田園都市線たまプラーザ駅前。住宅街の暮らしに寄り添う店。
  - name: 京王百貨店聖蹟桜ヶ丘店
    emoji: 🌼
    reason: 聖蹟桜ヶ丘駅前。京王沿線の暮らしを支える郊外店。
  - name: 髙島屋玉川店
    emoji: 🏞️
    reason: 二子玉川に近い玉川高島屋ショッピングセンターの核店舗。
  - name: 小田急百貨店藤沢店
    emoji: 🌴
    reason: 藤沢駅前。湘南エリアの買い物の拠点。
  - name: さいか屋藤沢店
    emoji: 🎈
    reason: 藤沢にあるさいか屋の店舗。
  C:
  - name: 東急百貨店日吉店
    emoji: 🎓
    reason: 日吉駅の真上にある東急の専門店ビル型の店舗。
  - name: さいか屋横須賀店
    emoji: ⚓
    reason: 横須賀の老舗地場百貨店。神奈川の地場百貨店として知られる。
  - name: 東戸塚西武（そごう・西武）
    emoji: 🏘️
    reason: 東戸塚駅前のショッピングセンター型の店舗。
  - name: 都筑阪急
    emoji: 🛍️
    reason: 横浜・港北ニュータウンのモザイクモール港北内にある阪急。
  D: []
summary: '横浜は、そごうと髙島屋の2強の街。多摩・神奈川の郊外は、電鉄系が駅前に根づいている。

  東急・小田急・京王など私鉄の百貨店は、通勤・通学の駅に併設されているので、日常の買い物に頼れる存在。'
