summary: |
  ヘビー級はRIZINに長く王者がいなかった階級。2026年、日本ヘビー級グランプリで勝ち上がったスダリオ剛とエドポロキングが大晦日の決勝で戦い、その勝者がソルダトキンと初代王座を争う。
  元力士、空手家、海外の巨漢たちがぶつかる、一撃で全てが決まる階級。大晦日に初代王者が決まる瞬間は見逃せない。
