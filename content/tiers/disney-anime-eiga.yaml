summary: 'ディズニーのアニメ映画は、物語だけでなく、歌が印象に残るのが魅力。S級は、世代を問わず愛され、歌とシーンが思い浮かぶ作品。

  D級は「つまらない」という意味ではなく、評価が分かれたり、通の人が愛したりする作品。実際の好みは人それぞれ。'
