title: AIで動画を作る前の準備 Tier表
description: 企画メモ、素材の確認、著作権チェック、保存先…AIで動画を作る前に済ませておきたい準備を、ゾーマが「失敗しにくさ×時短×安心感」でS〜Dにランク付け。
category: ai
tags:
- AI
- 動画
- 初心者
published: '2026-11-02'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 失敗しにくさ

  ② 時短になるか

  ③ 安心感（著作権・規約・保存）

  ※ 利用するAIサービスの規約や料金、使える機能は変わります。必ず最新の公式の案内を確認してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 作りたい動画を、1行で書き出す
    emoji: 📝
    reason: ゴールが決まると、指示がぶれず作り直しが減る。
  - name: 使うサービスの規約・商用利用の可否を確認する
    emoji: 📜
    reason: 公開後のトラブルを避けられる。最初に5分見るだけで安心。
  - name: 保存先とファイル名のルールを先に決める
    emoji: 🗂️
    reason: あとで探す手間がなくなり、整理の自動化もしやすい。
  A:
  - name: 短い動画（5〜10秒）で試作する
    emoji: ⏱️
    reason: 失敗してもダメージが小さく、傾向がつかみやすい。
  - name: うまくいった指示文（プロンプト）を記録する
    emoji: 📒
    reason: 次回以降の時短に直結。テンプレ化すれば量産しやすい。
  - name: 使う素材（画像・音楽）の権利を確認する
    emoji: 🔍
    reason: 著作権や商用利用の問題を避けられる。
  - name: 気に入った出力はその場で保存する
    emoji: 💾
    reason: AIの結果は毎回変わる。あとで同じものを作るのは難しい。
  B:
  - name: 絵コンテや簡単な構成メモをつくる
    emoji: 🖼️
    reason: 場面のつながりが見えて、全体のバランスが整う。
  - name: 無料枠・料金の上限をあらかじめ確認する
    emoji: 💰
    reason: 使いすぎ防止になる。月の予算を決めておくと安心。
  - name: 縦型・横型など、公開先の比率を先に決める
    emoji: 📐
    reason: あとからの切り直しが減る。
  - name: BGMの長さと動画の長さをそろえておく
    emoji: 🎵
    reason: 編集の手間が減り、仕上がりもきれい。
  - name: 公開前のチェックリストをつくる
    emoji: ✅
    reason: 誤字・音量・権利の見落としを防げる。
  C:
  - name: 最初から長尺（数分以上）の動画に挑戦する
    emoji: 🎞️
    reason: 時間もコストもかかり、途中で挫折しやすい。
  - name: ほかのAIの出力を、そのまま素材として組み合わせる
    emoji: 🧩
    reason: 利用規約の確認が必要になる。
  - name: 有料プランに最初から入る
    emoji: 💳
    reason: 合うか分からないうちは、無料で試す方が安心。
  D:
  - name: 既存のキャラクターや有名人に似せて作る
    emoji: 🚫
    reason: 権利や肖像権の問題になる恐れがある。
  - name: 規約を読まずに商用利用する
    emoji: ⚠️
    reason: 収益化後に問題になることがある。
  - name: 保存せず、その場で閉じてしまう
    emoji: 🗑️
    reason: 二度と同じものが出ない。もったいない失敗の代表。
summary: 'AIで動画を作るのは、思いつきで始めても形になるのが魅力。ただし、準備なしで始めると「何度も作り直し」「規約違反に気づかない」「どこに保存したか分からない」といった失敗が起きやすい。

  S級は、作りたい動画を1行で書くこと、使うサービスの規約を確認すること、保存先とファイル名の決まりを先に決めておくこと。この3つで失敗が大きく減る。

  素材（画像・音楽・フォント）は、商用利用や公開が許されているかを確認してから使う。有名人や既存キャラクターに似せる作り方も避けたい。

  また、AIの出力は毎回少しずつ違うので、気に入ったものは必ず保存しておく。プロンプト（指示文）も、うまくいったものは記録しておくと次回が速い。

  1本目は、短い動画（5〜10秒）で試すのがおすすめ。成功パターンをテンプレにすれば、2本目以降は一気に楽になる。公開前には、最終チェックリストで文字の誤り・音量・権利関係を見直そう。

  最初の1本を作り終えたら、かかった時間・使った料金・うまくいった点を簡単にメモしておこう。次の企画で「どこを省略できるか」が見え、制作スピードが上がる。シリーズ化を狙うなら、構成・文字の位置・長さを固定したテンプレートを持つのが近道。

  AI動画は、準備の差がそのまま完成度と継続のしやすさに表れる。難しいことは何もなく、「1行の企画」「規約の確認」「保存ルール」の3点を押さえるだけでいい。まずは短い1本で試して、自分の型をつくっていこう。'
