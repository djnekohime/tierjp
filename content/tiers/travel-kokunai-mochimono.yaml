title: 国内旅行の持ち物の優先度 Tier表
description: スマホ充電器、現金、常備薬、羽織もの、折りたたみ傘…国内旅行の持ち物を、AIが「必須度×あると助かる度」でS〜Dにランク付け。
category: travel
tags:
- 旅行
- 初心者
published: '2026-10-07'
labels:
  S: 必須
  A: あると安心
  B: あると便利
  C: 好みで
  D: なくても大丈夫
criteria: '① 忘れたときの困り度

  ② 現地で買いにくいか

  ③ かさばらないか

  ※ 国内旅行は、現地で買えるものが多いので、最小限でOK。持病の薬など、代わりがきかないものは必ず持っていく'
rank_notes:
  S: 忘れたら困る
  D: なくても大丈夫
tiers:
  S:
  - name: 財布（現金・クレジットカード・交通系IC）
    emoji: 👛
    reason: 旅の基本。小銭と、キャッシュレスの両方を。
  - name: スマホと充電器・モバイルバッテリー
    emoji: 🔋
    reason: 地図・予約・連絡に必須。充電切れが、いちばんの困りごと。
  - name: 常備薬・持病の薬
    emoji: 💊
    reason: 現地で買えない・代わりがきかない。お薬手帳も。
  - name: 本人確認ができるもの（運転免許証など）
    emoji: 🪪
    reason: 宿泊や、乗り物の手続きで必要なことがある。
  A:
  - name: 着替え・下着（日数分）
    emoji: 👕
    reason: 洗濯の予定があれば、減らせる。
  - name: 折りたたみ傘・雨具
    emoji: ☂️
    reason: 天気が変わりやすい。小さいものを。
  - name: 羽織れる上着
    emoji: 🧥
    reason: 朝晩の冷えや、冷房対策に。
  - name: 歩きやすい靴
    emoji: 👟
    reason: 観光は、思った以上に歩く。慣れた靴で。
  - name: 予約の確認画面（スクリーンショット）
    emoji: 📱
    reason: 電波が悪くても確認できる。
  B:
  - name: エコバッグ
    emoji: 🛍️
    reason: お土産が増えたときに便利。
  - name: ハンカチ・ティッシュ・ウェットティッシュ
    emoji: 🧻
    reason: いつもの持ち物。旅先でも活躍。
  - name: ネックピロー・アイマスク
    emoji: 😴
    reason: 長距離移動に便利。
  - name: カメラ
    emoji: 📷
    reason: スマホで十分なら、なしでもOK。
  C:
  - name: ドライヤー・スキンケアセット
    emoji: 🧴
    reason: 宿の備品を確認してから。
  D:
  - name: 大きなガイドブック（全ページ）
    emoji: 📚
    reason: 重くてかさばる。必要なページだけ、写真で撮る。
summary: '国内旅行の持ち物は、「忘れたら困るもの」と「現地で買えるもの」に分けると、荷物が軽くなる。S級は、財布・スマホ・充電器・本人確認ができるもの・常備薬。

  宿の備品（歯ブラシ・タオル・ドライヤー）は、事前に確認すると、持ち物をさらに減らせる。'
related:
- travel-kaigai-mochimono
- travel-hikoki-seat
- travel-onsen-hairikata
