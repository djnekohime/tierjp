title: 鳥に危険な食べもの・家の中のもの Tier表
description: アボカド、チョコレート、テフロン加工のフライパン、芳香剤、タバコの煙…インコなど鳥にとって危険な食べものと家の中のものを、危険度でS〜Dにランク付け。
category: animals
tags: [鳥, 動物, 初心者]
published: 2026-10-03
labels:
  S: 絶対NG
  A: 要注意
  B: 気をつけたい
  C: 与え方・使い方しだい
  D: 少量なら問題が少ない
criteria: |
  ① 中毒や体調不良につながる危険度
  ② 家庭で鳥の近くに存在しやすいか
  ③ 少量でも起こりうるか
  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。鳥は体が小さく、空気の影響も受けやすい動物です。食べてしまった、吸いこんだかもしれないときは、様子見せず、鳥を診られる動物病院へ連絡してください
rank_notes:
  S: 少量でも命にかかわる可能性
  D: 量や使い方を守ればおおむね問題なし
tiers:
  S:
    - name: テフロン加工の調理器具の空焼きや過熱
      short: テフロン加工の過熱
      emoji: "🍳"
      reason: フッ素樹脂加工のフライパンやホットプレートを高温にすると、出るガスが鳥に致命的になることがある。鳥の部屋と台所を離し、使用時は換気をする。
    - name: アボカド
      emoji: "🥑"
      reason: 鳥には有害になる成分が含まれると言われ、少量でも危険とされている。サラダやディップなどにも入っているので、人の食事を分けない。
    - name: チョコレート・ココア
      short: チョコレート
      emoji: "🍫"
      reason: 鳥には中毒を起こす成分が含まれる。少量でも危険なので、お菓子を放置しない。
    - name: アルコール
      emoji: "🍺"
      reason: 鳥には非常に危険。少量でも影響が大きく、命に関わることもある。お酒のにおいにも注意。
    - name: タバコの煙・ニコチン
      short: タバコ
      emoji: "🚬"
      reason: 煙の成分は鳥の呼吸器に大きな負担をかける。鳥のいる部屋では、吸わない。タバコそのものを食べるのも危険。
  A:
    - name: 芳香剤・アロマ・香水・殺虫スプレー
      short: スプレー・香り
      emoji: "🧴"
      reason: 鳥は呼吸器がとても敏感で、強いにおいやスプレーで体調をくずすことがある。鳥の近くでは使わず、使うなら、別の部屋で。
    - name: カフェイン（コーヒー・紅茶・エナジードリンク）
      short: カフェイン
      emoji: "☕"
      reason: 鳥には負担になる成分。飲みかけのカップに近づけないようにする。
    - name: 玉ねぎ・ネギ類
      short: ネギ類
      emoji: "🧅"
      reason: 鳥の赤血球に影響することがあると言われる。料理の残りも含めて、与えない。
    - name: りんごなどの果物の種
      short: 果物の種
      emoji: "🍎"
      reason: 種には、体に合わない成分が含まれることがある。果物をあげるときは、種や芯を取りのぞく。
    - name: 鉛・亜鉛を含む金属のおもちゃ・飾り
      short: 金属の小物
      emoji: "🪙"
      reason: かじって飲みこむと、重金属中毒を起こすことがある。鳥に与えるおもちゃは、鳥用の安全なものを選ぶ。
  B:
    - name: 塩分の多い人間の食べもの
      short: 塩分の多い食品
      emoji: "🍜"
      reason: 体の小さな鳥には、塩分が多すぎて負担になる。人間用の味つけされた食べものは、分けない。
    - name: 有毒な観葉植物
      short: 観葉植物
      emoji: "🪴"
      reason: かじると、中毒を起こす植物がある。放鳥するときは、近くに置かない。
    - name: 窓ガラス・鏡への衝突
      short: 窓ガラス
      emoji: "🪟"
      reason: ガラスに気づかず、ぶつかる事故が起きやすい。カーテンを閉めたり、シールを貼ったりして、飛ぶ前に工夫する。
    - name: 電気コードをかじる
      short: 電気コード
      emoji: "🔌"
      reason: 感電や、コードの破片を飲みこむ危険がある。放鳥中は、コードを覆うか、鳥の近くには置かない。
    - name: 開いた窓・ドアからの脱走
      short: 脱走
      emoji: "🚪"
      reason: 放鳥中の窓やドアの開けっぱなしは、迷子や事故につながる。放鳥前に、すべての出入り口を閉める。
  C:
    - name: 犬や猫との同居
      short: 犬猫との同居
      emoji: "🐈"
      reason: 犬や猫がいる家では、鳥が襲われる事故のリスクがある。放鳥のときは、犬や猫を別の部屋に入れる。
    - name: 古くなった種子・傷んだ野菜
      short: 傷んだえさ
      emoji: "🥬"
      reason: カビや腐敗で、体調不良の原因になる。毎日のえさの交換と、保存方法を守る。
    - name: 台所やコンロの近くでの放鳥
      short: 台所での放鳥
      emoji: "🔥"
      reason: やけどや、調理中の煙・火の危険がある。放鳥するときは、台所から離れた部屋で。
  D:
    - name: 小松菜・青菜などの野菜（洗ったもの）
      short: 青菜
      emoji: "🥬"
      reason: ビタミンなどが補え、鳥の食事に取りいれやすい。よく洗って、水気を切り、新鮮なものを少量あげる。
    - name: 鳥用の総合栄養食（ペレット）・シード
      short: 鳥用フード
      emoji: "🌾"
      reason: 鳥のために作られたえさなら、栄養バランスが整えやすい。種類ごとに適した量を守る。
summary: |
  Sに入れたのは、少量でも危険になりうる「テフロン加工の過熱」「アボカド」「チョコレート」「アルコール」「タバコ」。どれも人間の家庭にふつうにあるものばかりで、うっかり事故が起こりやすい。
  鳥は、空気の影響も受けやすい動物。鳥が体調をくずしたときは、様子を見ず、食べたものや使ったものを伝えて、すぐ鳥を診られる動物病院に連絡すること。
related: [tori-shurui, tori-shigusa, inu-kiken]
