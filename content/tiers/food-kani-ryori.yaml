    emoji: 🥢
    reason: 身を取るのに時間がかかり、無言になりがち。道具があると楽。
  - name: カニの内子・外子（好みが分かれる部位）
    emoji: 🥚
    reason: 珍味。味わい深いが、好き嫌いがはっきり分かれる。
  - name: 味付けが濃いカニ料理（マヨ系など）
    emoji: 🧂
    reason: カニの甘みが隠れてしまうことも。素材の味を大切にしたい。
summary: 'カニは、冬の味覚の代表。食べ方によって、甘み・香り・食感が大きく変わるのも魅力だ。S級は、シンプルな「茹でがに」「焼きがに」「カニ鍋」。素材の甘みをそのまま味わえて、特別な日にぴったり。

  カニ味噌や甲羅焼きは、好みが分かれるが、ハマる人は多い。カニクリームコロッケやかに玉のように、家庭で楽しめる料理も人気。

  カニ缶・カニカマは、手軽に使えて、普段の料理を格上げしてくれる。

  食べるときは、殻に手を取られて無口になりがちなので、あらかじめ食べやすく切り込みを入れておくのがコツ。家族や友だちと分け合うと、ごちそう感がぐっと増す。

  カニは種類によっても味が違う。ズワイガニ、毛ガニ、タラバガニなど、それぞれの個性を楽しんで。保存や解凍は、購入先の案内に従うこと。甲殻類のアレルギーがある人は食べないように注意。年末のごちそうや、お祝いの席にも向いている食材。

  家で楽しむなら、まず鍋が失敗しにくい。カニの旨みが溶けただしで、野菜・豆腐・締めの雑炊まで一気に味わえる。贅沢に感じる日は、ほかの料理を控えめにして、カニを主役にすると満足感が高まる。

  贅沢なカニは、年に数回の楽しみとして、じっくり味わうのがおすすめ。茹でがに・焼きがに・鍋の3本柱を押さえておけば、どんな席でも外さない。缶詰やかまぼこは、日常のちょっとした贅沢として上手に使い分けよう。

  買うときは、殻つきか、むき身か、生か冷凍かを確認しよう。お店の人に食べる人数を伝えると、適した量を教えてもらえる。'
