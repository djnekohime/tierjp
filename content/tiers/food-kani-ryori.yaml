  - name: 焼きがに
    emoji: 🔥
    reason: 香ばしさが加わり、身がぎゅっと締まる。香りも楽しめるごちそう。
  - name: カニ鍋（かにすき）
    emoji: 🍲
    reason: だしにカニの旨みが溶け出し、締めの雑炊まで格別。
  A:
  - name: カニ味噌（甲羅焼き）
    emoji: 🥘
    reason: 濃厚な旨みで、お酒好きにも人気。好みは分かれるが、ハマると抜けられない。
  - name: カニの刺身
    emoji: 🍣
    reason: 透明感のある甘みが特別。鮮度のよいものを選びたい。
  - name: カニクリームコロッケ
    emoji: 🍤
    reason: とろっとクリーミーで、家庭でも人気の洋風ごちそう。
  - name: かに玉
    emoji: 🍳
    reason: ふわふわの卵とカニの甘み。ごはんにもよく合う。
  - name: カニ雑炊
    emoji: 🍚
    reason: 鍋の締めとして、最後まで旨みを逃さず味わえる。
  B:
  - name: カニ飯（かにめし）
    emoji: 🍙
    reason: カニの旨みがごはんにしみる。駅弁の定番でもある。
  - name: カニチャーハン
    emoji: 🍳
    reason: 手軽に作れて、香りと旨みが楽しめる。
  - name: カニグラタン
    emoji: 🧀
    reason: カニの甘みとチーズのコクが好相性。冬の洋食の定番。
  - name: カニの天ぷら
    emoji: 🍤
    reason: 衣のサクサクと、ほんのり甘い身の組み合わせ。
  - name: カニパスタ
    emoji: 🍝
    reason: 旨みがソースに溶けて、レストランのような味に。
  - name: カニ缶の和え物
    emoji: 🥫
    reason: 缶詰なら年中使えて、サラダやマヨ和えに手軽。
  C:
  - name: カニカマ（かまぼこ）
    emoji: 🍥
    reason: 手軽で価格も控えめ。カニそのものとは別の食べ物として楽しみたい。
  - name: カニ風味のスナック
    emoji: 🍘
    reason: ほんのりカニの風味。おやつやおつまみに。
  - name: カニ寿司（軍艦・握り）
    emoji: 🍣
    reason: ネタとして華やか。回転寿司では出番が少ないことも。
  D:
