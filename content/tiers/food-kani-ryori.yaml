title: カニの食べ方・料理 Tier表
description: 焼きがに、茹でがに、カニ鍋、カニ味噌、カニクリームコロッケ、かに玉…冬の味覚・カニの食べ方と料理を、ゾーマが「おいしさ×特別感×食べやすさ」でS〜Dにランク付け。
category: food
genre: 鍋・季節の食べ物
tags:
- グルメ
published: '2026-11-02'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① おいしさ

  ② 特別感（ごちそう度）

  ③ 食べやすさ・手軽さ

  ※ 甲殻類のアレルギーがある方は、食べないでください。地域や家庭で定番は違います。ランクは「一番多くの人が喜びそうな順」です'
rank_notes:
  S: 冬のごちそう
  D: 通好み・好みが分かれる
