title: 昭和の名作ドラマ Tier表
description: おしん、北の国から、3年B組金八先生、太陽にほえろ！、水戸黄門、ふぞろいの林檎たち…昭和を彩ったテレビドラマを、知名度と語り継がれ度でS〜Dにランク付け。
category: entame
tags: [昭和, レトロ, 名作]
published: 2026-10-05
labels:
  S: 国民的ドラマ
  A: 誰もが知っている
  B: 世代の思い出
  C: 渋い名作
  D: 通好み
criteria: |
  ① 世代を超えた知名度（今も語られるか）
  ② 愛され度・語り継がれ度
  ③ その後のテレビドラマへの影響
  ※ 放送時期や好みで順位は変わります。出演者名や結末などは、あまり書いていません。これは、AIが基準を決めて並べた、ひとつの見方です
rank_notes:
  S: 昭和の顔
  D: 知っていたらかなりの通
tiers:
  S:
    - name: おしん
      emoji: "🌾"
      reason: 明治から昭和を生きた女性の、一生を描いたNHKの連続テレビ小説。国民的な大ブームになり、海外でも放送された作品として知られる。
    - name: 北の国から
      emoji: "❄️"
      reason: 北海道の富良野を舞台に、ある家族の長い年月を描いた作品。倉本聰の脚本で、シリーズとして長く愛された。
    - name: 3年B組金八先生
      short: 金八先生
      emoji: "🏫"
      reason: 中学校を舞台に、生徒と先生の姿を描いた、学園ドラマの金字塔。シリーズが続き、さまざまな社会問題も扱った。
  A:
    - name: 水戸黄門
      emoji: "🏮"
      reason: 「この紋所が目に入らぬか」で知られる、時代劇の定番。長く放送され、お約束の展開を楽しむ番組として愛された。
    - name: 太陽にほえろ！
      emoji: "🌅"
      reason: 刑事たちの活躍を描いた、刑事ドラマの代表作。個性的なあだ名の刑事たちが、人気になった。
    - name: 寺内貫太郎一家
      emoji: "🪨"
      reason: 頑固おやじと家族の、にぎやかな日常を描いたホームドラマ。向田邦子の脚本としても知られる。
    - name: 時間ですよ
      emoji: "🛁"
      reason: 銭湯を舞台にした、笑いと人情のドラマ。昭和の家庭の空気を、よく伝える。
    - name: 熱中時代
      emoji: "📚"
      reason: 熱血の新米教師を描いた、学園ドラマ。主人公の人柄が、多くの視聴者に親しまれた。
  B:
    - name: ふぞろいの林檎たち
      short: ふぞろいの林檎
      emoji: "🍎"
      reason: 若者たちの、恋と悩みを描いた青春群像劇。山田太一の脚本として語り継がれる。
    - name: 傷だらけの天使
      emoji: "😼"
      reason: 探偵事務所の若者たちを描いた、スタイリッシュな作品。独特の雰囲気で、根強いファンがいる。
    - name: 池中玄太80キロ
      emoji: "👶"
      reason: カメラマンの男性と、子どもたちとの暮らしを描いた、ホームドラマの人気作。
    - name: スチュワーデス物語
      emoji: "✈️"
      reason: 客室乗務員を目指す女性を描いた、青春ドラマ。主人公の「ドジでのろまなカメ」の台詞が、流行語になった。
    - name: 西部警察
      emoji: "🚓"
      reason: 派手なアクションと、迫力のある爆破シーンで話題になった、刑事ドラマ。
    - name: 家政婦は見た！
      emoji: "👀"
      reason: 家政婦の目線で、さまざまな家庭の秘密を描いたシリーズ。
  C:
    - name: 大岡越前
      emoji: "⚖️"
      reason: 江戸の名奉行を描いた時代劇。長く放送された、人気シリーズ。
    - name: 毎度おさわがせします
      emoji: "🏘️"
      reason: 思春期の若者たちの悩みを、コミカルに描いた学園・家族ドラマ。
    - name: 積木くずし
      emoji: "🧱"
      reason: 家庭の問題を扱った、実話をもとにしたドラマとして話題になった。
  D:
    - name: 昭和の再放送で出会う、地方局の名作ドラマ
      short: 地方局の再放送ドラマ
      emoji: "📺"
      reason: 全国的な知名度は高くなくても、地域で愛されてきた作品もたくさんある。再放送で出会うのも、昭和ドラマの楽しみ。
summary: |
  昭和ドラマのSは、「おしん」「北の国から」「3年B組金八先生」。社会現象になり、今も語られる、国民的な作品。
  同じドラマでも、いつ・誰と見たかで、思い出は違う。あなたの一番の昭和ドラマは、何ランク？ ぜひ一言コメントで教えてね。
related: [music-showa-kayo, showa-anime, showa-retro-items]
