title: お茶漬けの具 Tier表
description: 鮭、梅、のり、明太子、わさび、たらこ、鯛、しらす、高菜、漬物…お茶漬けの具を、AIが「さらさら食べたい度×ほっとする度」でランク付け。
category: food
genre: ご飯もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「今日はこれでお茶漬けにしたい」と思える人気
  ② お茶やだしとの相性
  ③ 食べたあとの「ほっとする」度
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: お茶漬けの三大定番
  D: 料亭気分の贅沢なお茶漬け
tiers:
  S:
    - name: 鮭
      emoji: "🐟"
      reason: ほぐした鮭の塩気がお茶に溶けて、ご飯と一緒にさらさら。お茶漬けの王様。
    - name: 梅
      emoji: "🟣"
      reason: すっぱさでさっぱり。食欲がない日や、飲んだ後の締めにぴったり。
    - name: のり
      emoji: "⬛"
      reason: 磯の香りが広がる、一番シンプルなお茶漬け。
  A:
    - name: 明太子・たらこ
      short: 明太子
      emoji: "🌶️"
      reason: 粒々が熱いお茶で少し白くなって、うまみがご飯に広がる。
    - name: 鯛
      emoji: "🎏"
      reason: ごまだれに漬けた鯛をのせて、熱いだしをかける。料亭のような上品な一杯。
    - name: わさび
      emoji: "🟢"
      reason: ツンとくる辛さでさっぱり。のりやあられと合わせて。
    - name: 高菜
      emoji: "🥬"
      reason: ピリ辛の高菜漬けで、九州風のお茶漬けに。
    - name: しらす
      emoji: "✨"
      reason: やさしい塩気で、あっさりしたお茶漬けに。
  B:
    - name: 塩昆布
      emoji: "🌿"
      reason: 塩気とうまみがだしになって、あっという間においしいお茶漬けに。
    - name: 漬物（たくあん・しば漬け）
      short: 漬物
      emoji: "🟨"
      reason: ポリポリ食感が楽しい。京都のお茶漬けといえば漬物。
    - name: ほぐしたうなぎ
      short: うなぎ
      emoji: "🐍"
      reason: 名古屋のひつまぶしのように、うなぎにだしをかけるのは最高の食べ方。
    - name: いくら
      emoji: "🔴"
      reason: 熱いお茶で少し白くなるいくらも、また違ったおいしさ。
    - name: ねぎ
      emoji: "🧅"
      reason: 香りのアクセントとして、どんなお茶漬けにも合う。
  C:
    - name: 焼きおにぎり
      emoji: "🍙"
      reason: 焼きおにぎりにだしをかけると、香ばしいお茶漬けに。ひと手間かかる。
    - name: 天ぷら（天茶）
      short: 天茶
      emoji: "🍤"
      reason: 天ぷらにだしをかける「天茶」は、名古屋などで知られる食べ方。衣がだしを吸っておいしい。
  D:
    - name: 漬け魚（ぶり・まぐろ）
      short: 漬け魚
      emoji: "🐠"
      reason: しょうゆだれに漬けた刺身に、熱いだしをかけて半生で食べる。港町の漁師めしのような贅沢なお茶漬け。
    - name: 本格お茶漬け（煎茶・ほうじ茶）
      short: 本格お茶漬け
      emoji: "🍵"
      reason: お湯ではなく、いれたての煎茶やほうじ茶をかけるお茶漬け。お茶の香りを楽しむ通の食べ方。
summary: |
  お茶漬けは、鮭・梅・のりがS。さらさらとかきこめて、食欲のない日も、飲んだ後の締めにも、ほっとさせてくれる一杯。
  鯛茶漬け、ひつまぶし、天茶のように、ごちそうをお茶漬けにする食べ方も日本各地にある。
related: [food-gohan-otomo, food-onigiri, food-betsubara]
