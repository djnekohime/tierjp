title: 鶏肉料理 Tier表
description: 唐揚げ、焼き鳥、親子丼、チキン南蛮、照り焼き、水炊き、タンドリーチキン、鶏のさっぱり煮、手羽先、チキンカレー、棒棒鶏…鶏肉を使った料理を、AIが「ご飯が進む度×飽きない度」でランク付け。
category: food
genre: 肉料理
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① ご飯が進む度

  ② 毎日でも飽きないか

  ③ 鶏肉のおいしさが引き立つか

  ※ 鶏肉は、中までしっかり火を通して食べるのが基本です

  '
rank_notes:
  S: 鶏肉料理の三大スター
  D: 通好み
tiers:
  S:
  - name: 唐揚げ
    emoji: 🍗
    reason: ジューシーな鶏肉と、サクサクの衣。みんな大好き。
  - name: 親子丼
    emoji: 🥚
    reason: ふわとろの卵と鶏肉を、ご飯にのせて。ほっとする味。
  - name: 照り焼きチキン
    emoji: 🍖
    reason: 甘辛いタレで、ご飯が止まらない。
  A:
  - name: 焼き鳥
    emoji: 🍢
    reason: 塩でもタレでも。お酒のお供にも、ご飯のおかずにも。
  - name: チキン南蛮
    emoji: 🥚
    reason: 甘酢とタルタルソースの組み合わせ。宮崎の名物。
  - name: 水炊き
    emoji: 🍲
    reason: 鶏のうまみが出たスープ。体があたたまる。
  - name: 手羽先
    emoji: ✋
    reason: 甘辛い手羽先は、お酒に合う。名古屋名物としても有名。
  - name: チキンカレー
    emoji: 🍛
    reason: ほろっとやわらかい鶏肉が、スパイスとよく合う。
  B:
  - name: タンドリーチキン
    emoji: 🌶️
    reason: スパイスとヨーグルトに漬けて焼く、インドの料理。
  - name: 鶏の竜田揚げ
    emoji: 🍤
    reason: 醤油味がしみた、唐揚げより上品な味。
  - name: 棒棒鶏
    emoji: 🥒
    reason: ごまだれで食べる、さっぱりした中華の冷菜。
  - name: 鶏のトマト煮
    emoji: 🍅
    reason: 洋風の煮込み。パンとも、ご飯とも合う。
  C:
  - name: 鶏むね肉のサラダチキン
    emoji: 🥗
    reason: ヘルシーだけど、毎日だと飽きる。
  - name: チキンソテー
    emoji: 🍳
    reason: 皮をパリッと焼いた、洋風のシンプルな一皿。
  D:
  - name: 鶏のたたき
    emoji: 🔥
    reason: 表面だけ炙った、新鮮な鶏肉。信頼できるお店でだけ。
  - name: 鶏皮ポン酢
    emoji: 🟫
    reason: 鶏皮をパリッと焼いて、ポン酢で。お酒のおつまみ。
summary: '鶏肉料理は、唐揚げ・親子丼・照り焼きチキンがS。安くて、おいしくて、アレンジも自由な、家庭の味方。

  鶏肉は、中までしっかり火を通すのが基本。おいしく安全に食べよう。

  '
related:
- food-karaage
- food-yakitori
- food-chicken-bui
