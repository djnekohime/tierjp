title: ペットの避難グッズ Tier表
description: キャリー、フードと水、迷子札、常備薬、トイレ用品…犬猫など災害時にペットと避難するために備えたい避難グッズを、必要度でS〜Dにランク付け。
category: animals
tags: [犬, 猫, 防災, 動物]
published: 2026-10-03
criteria: |
  ① 命や健康を守るために、どれだけ必要か
  ② 避難先で困らないか（トイレ・食事・脱走防止・迷子対策）
  ③ 持ち出しやすさ・日ごろの用意のしやすさ
  ※ 環境省の「人とペットの災害対策ガイドライン」などでも、ペットの避難用品の備えが勧められています。特定の商品ではなく「種類」のランキングです。避難所のルールは自治体や施設ごとに違うので、お住まいの地域の情報も確認してください
rank_notes:
  S: 必ずそろえたい
  D: 無理に持ち出さなくていい
tiers:
  S:
    - name: キャリーバッグ・クレート・ケージ
      short: キャリー・ケージ
      emoji: "🧳"
      reason: 避難所や車で、ペットを安全に守る家。脱走を防ぐためにも必須。日ごろから部屋に置いて、中で落ち着けるよう慣らしておく。
    - name: ペットフード・水（5日分以上、できれば7日分以上）
      short: フードと水
      emoji: "🥫"
      reason: 支援物資に、ペット用のフードが届くとは限らない。食べ慣れたフードを、5日分以上備えておく。水も、ペット用に確保する。期限が切れないよう、定期的に入れ替える。
    - name: 迷子札・首輪・ハーネス・リード
      short: 迷子札・リード
      emoji: "🏷️"
      reason: 災害時は、パニックで脱走しやすい。迷子札に連絡先を書いて、外れにくい首輪やハーネスをつけておく。マイクロチップの登録も、あわせて確認する。
    - name: 常備薬と、健康情報のメモ
      short: 常備薬・健康メモ
      emoji: "💊"
      reason: 持病がある子は、薬が切れると命にかかわる。ワクチン接種の記録、かかりつけの動物病院の連絡先、持病やアレルギーの情報も、まとめておく。
    - name: トイレ用品（ペットシーツ・猫砂・排泄物袋）
      short: トイレ用品
      emoji: "🚽"
      reason: 避難先で、トイレの始末は必須。マナーを守ることが、避難所で、ペットと一緒に過ごすための大切な条件になる。
  A:
    - name: ペットの写真（飼い主と一緒のもの）
      short: ペットの写真
      emoji: "📸"
      reason: 迷子になったとき、探したり、飼い主だと証明したりするのに役立つ。スマホだけでなく、プリントしたものも用意すると安心。
    - name: 食器・給水ボウル
      short: 食器
      emoji: "🥣"
      reason: 折りたたみ式など、軽くて持ち運びやすいものが便利。使い慣れたものがあれば、食事もとりやすい。
    - name: 毛布・タオル
      short: 毛布・タオル
      emoji: "🧣"
      reason: においがついたものは、ペットが落ち着く助けになる。防寒にも、ケージを覆って目隠しにも使える。
    - name: 洗濯ネット（猫など）
      short: 洗濯ネット
      emoji: "🕸️"
      reason: 猫を、動物病院や避難先でおさえるときに便利。キャリーに入れるのが難しいときの、補助にもなる。
    - name: ごみ袋・ビニール袋
      short: ごみ袋
      emoji: "🛍️"
      reason: 排泄物や、使ったシーツの処理に必要。においが漏れにくい袋があると、避難先でも周りに配慮しやすい。
    - name: 暑さ・寒さ対策グッズ（保冷剤・カイロなど）
      short: 暑さ寒さ対策
      emoji: "🌡️"
      reason: 避難先は、空調が整っていないことも多い。季節に合わせて、保温や保冷の用意を。
  B:
    - name: 療法食・特別なごはん（持病のある子）
      short: 療法食
      emoji: "🍽️"
      reason: 持病があるペットは、食事が変わると、体調をくずしやすい。かかりつけの獣医さんに相談して、備蓄を考える。
    - name: おもちゃ・おやつ
      short: おもちゃ・おやつ
      emoji: "🧸"
      reason: 慣れないところで不安なペットの、気分転換になる。においのついた、使い慣れたものを。
    - name: 消臭スプレー・ウェットティッシュ
      short: 消臭・清潔グッズ
      emoji: "🧴"
      reason: 避難先で、清潔に過ごす助けになる。周囲への配慮にも役立つ。
    - name: ブラシ・爪切りなどのお手入れ用品
      short: お手入れ用品
      emoji: "🪮"
      reason: 避難が長引くときに、体を清潔に保つのに役立つ。
    - name: 予備のリード・首輪
      short: 予備のリード
      emoji: "🦮"
      reason: 切れたり、なくしたりしたときの予備。ひとつ余分にあると、安心できる。
    - name: 折りたたみケージ・サークル
      short: 折りたたみケージ
      emoji: "🏠"
      reason: 避難所で、ペットのスペースを確保するのに役立つ。大きさと、持ち運びやすさを考える。
  C:
    - name: ペット用の服
      emoji: "👕"
      reason: 防寒には役立つが、嫌がるペットも多い。必須ではない。
    - name: たくさんのおもちゃ
      short: おもちゃの大量持ち出し
      emoji: "🎾"
      reason: 荷物がかさばる。お気に入りのおもちゃを、ひとつか2つで十分。
    - name: 高価なペット用品
      short: 高価な用品
      emoji: "💎"
      reason: 避難時に、必要なのは機能と安全。値段より、使いやすさと実用性が大切。
  D:
    - name: 使い慣れていない新品を、避難当日に初めて使う
      short: 初めて使う新品
      emoji: "⚠️"
      reason: 慣れていないキャリーやグッズは、ペットが怖がることがある。日ごろから、少しずつ慣らしておく。
    - name: ペットを置いて、荷物だけ持って避難する
      short: ペットを置いて避難
      emoji: "🚫"
      reason: ペットは家族の一員。環境省は、ペットと一緒に避難する「同行避難」を基本としている。置き去りにされたペットは、命の危険にさらされる。
summary: |
  Sに入れたのは、「キャリー・ケージ」「フードと水」「迷子札」「常備薬と健康情報」「トイレ用品」の5つ。これだけは、日ごろから用意して、すぐ持ち出せる場所に置いておきたい。
  避難用品は、備えたら終わりではなく、ペットを慣らし、期限を確認し、定期的に見直すのが大事。避難所のルールは地域で違うので、事前に自治体の情報も確認しておこう。
related: [pet-bousai-shitsuke, pet-bousai-hinan, pet-bousai-sumai]
