title: 串カツの具 Tier表
description: 牛、豚、うずら卵、れんこん、玉ねぎ、えび、アスパラ、もち、紅しょうが、チーズ…大阪名物の串カツの具を、AIが「頼みたい度×衣とソースとの相性」でランク付け。ソースの二度づけは禁止！
category: food
genre: 肉料理
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 串カツ屋さんで「まず頼む」人気
  ② サクサクの衣とソースとの相性
  ③ 串カツならではの楽しさ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 串カツ屋の三大定番
  D: 大阪で出会う個性派
tiers:
  S:
    - name: 牛（串カツ）
      short: 牛
      emoji: "🐂"
      reason: 大阪で「串カツ」といえばまず牛。サクサクの衣とソースの組み合わせは、新世界の味そのもの。
    - name: うずら卵
      emoji: "🥚"
      reason: 小さな卵を揚げた一本は、子供にも大人にも大人気。
    - name: れんこん
      emoji: "⚪"
      reason: シャキシャキの食感と衣の相性が抜群。野菜の串カツの代表。
  A:
    - name: 豚
      emoji: "🐖"
      reason: ジューシーな豚肉の串カツ。東日本では「串カツといえば豚」という人も多い。
    - name: 玉ねぎ
      emoji: "🧅"
      reason: 揚げると甘くなる玉ねぎは、ソースとの相性がいい。
    - name: えび
      emoji: "🦐"
      reason: プリプリのえびの串カツは、ちょっと贅沢な一本。
    - name: アスパラ
      emoji: "🌿"
      reason: シャキッとした食感と甘み。
    - name: もち
      emoji: "⬜"
      reason: とろっと伸びるもちは、串カツ屋さんの人気メニュー。
  B:
    - name: チーズ
      emoji: "🧀"
      reason: とろけるチーズが出てくる一本。熱いので注意。
    - name: しいたけ
      emoji: "🍄"
      reason: うまみたっぷりのきのこの串カツ。
    - name: ささみ（しそ巻き）
      short: ささみ
      emoji: "🐔"
      reason: しそで巻いたささみは、さっぱりと食べられる。
    - name: ウインナー
      emoji: "🌭"
      reason: 子供に人気の定番。
    - name: なす
      emoji: "🍆"
      reason: 揚げると油を吸ってとろとろに。
  C:
    - name: キャベツ（お通し）
      short: キャベツ
      emoji: "🥬"
      reason: 串カツ屋さんの無料のキャベツは、口直しに欠かせない名脇役。具ではないが、ないと寂しい。
    - name: 紅しょうが
      emoji: "🔴"
      reason: 紅しょうがを揚げた、大阪ならではの串カツ。好みは分かれる。
  D:
    - name: 牛すじ・どて焼き
      short: どて焼き
      emoji: "🟤"
      reason: 串カツ屋さんでよく出る、牛すじを白味噌で煮込んだ料理。串カツと一緒に頼むのが大阪流。
    - name: バナナ・デザート串
      short: デザート串
      emoji: "🍌"
      reason: バナナやアイスを揚げた、締めのデザート串カツ。意外な組み合わせを楽しむ通のメニュー。
summary: |
  串カツの具は、牛・うずら卵・れんこんがS。大阪の新世界で知られる串カツは、共同のソース入れに「二度づけ禁止」というルールも名物。
  キャベツを口直しにしながら、肉・野菜・デザートまで、いろいろな串を少しずつ楽しめるのが串カツの魅力。
related: [food-yakitori, food-karaage, food-okonomiyaki]
