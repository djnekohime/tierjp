title: スマホで英語に触れる習慣 Tier表
description: アプリ、動画、英語の設定、ニュース…スマホで英語に触れる習慣を、AIが「続けやすさ×効果×楽しさ」でS〜Dにランク付け。
category: manabi
tags:
- 英語
- 勉強法
- 初心者
published: '2026-10-09'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 続けやすさ

  ② 英語力への効果

  ③ 楽しさ'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 好きな動画・音楽を、英語（字幕）で見る・聴く
    emoji: 🎧
    reason: 楽しいから続く。耳が慣れる。
  - name: 1日5〜10分を、毎日続ける
    emoji: ⏱️
    reason: 長時間より、毎日のほうが定着する。
  A:
  - name: 英語学習アプリを1つに絞って続ける
    emoji: 📱
    reason: いくつも入れると続かない。
  - name: スマホの言語設定を英語にしてみる
    emoji: 🌐
    reason: 日常で英語が目に入る。慣れたら元に戻してもいい。
  - name: 知らない単語を、スマホのメモに貯める
    emoji: 📝
    reason: 復習しやすい。
  - name: 英語の短い動画（ショート）を見る
    emoji: 🎬
    reason: すきま時間に。聞き取りの練習に。
  B:
  - name: 英語のニュース・やさしい記事を読む
    emoji: 📰
    reason: レベルに合ったものを。
  - name: 英語日記を、スマホに書いてみる
    emoji: ✍️
    reason: アウトプットになる。AIに添削してもらうのも手。
  - name: オンライン英会話を、短時間試してみる
    emoji: 💬
    reason: 話す練習になる。続けるには、予約が大切。
  C:
  - name: AIに英会話の相手になってもらう
    emoji: 🤖
    reason: 気軽に練習できる。間違いは確認を。
  - name: 単語アプリだけで、学ぼうとする
    emoji: 🔤
    reason: 単語は増えるが、使う練習も必要。
  D:
  - name: アプリを何個もダウンロードして、満足する
    emoji: 📦
    reason: 入れただけで終わりがち。
  - name: SNSを見ながら「英語に触れている」と思い込む
    emoji: 🙈
    reason: 聞き流しでは、定着しにくい。
summary: '英語は、毎日少しでも触れることが大事。スマホは、いつでも持っているから、すきま時間の勉強に最適。S級は、「勉強」じゃなく、「好きなことを英語で見る・聞く」習慣にすること。

  続けるコツは、1日5〜10分から。アプリを増やしすぎず、1〜2個に絞る。'
related:
- eigo-gakushu-hoho
- manabi-eigo-listening
- eiken3-benkyou
