title: 収入が入った日にやることの優先度 Tier表
description: 貯蓄の先取り、固定費の確認、引き落とし残高、ごほうび…給料日（年金などの収入日も含めて）にやっておきたいことを、AIが「お金の安心×効果×手軽さ」でS〜Dにランク付け。
category: money
tags:
- お金
- 初心者
published: '2026-10-07'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① お金の安心への効果

  ② 手軽さ

  ③ 続けやすさ

  ※ 収入の形（給料・不定期の収入など）で、やり方は変わります。投資の判断は、ご自身で、必要に応じて専門家にご相談ください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 引き落とし口座の残高を確認する
    emoji: 🏦
    reason: 残高不足は、手数料や信用の問題になることも。
  - name: 貯金・積立を、先に取り分ける
    emoji: 💰
    reason: 残ったら貯める、より貯まりやすい。
  A:
  - name: 今月の固定費・支払い予定を、書き出す
    emoji: 📋
    reason: 何にいくら出るか、見える化。
  - name: カード・分割払いの残高を確認
    emoji: 💳
    reason: 使いすぎを防ぐ。
  - name: 生活費を、決めた額だけ、別に分ける
    emoji: 👛
    reason: 使える額が決まると、安心して使える。
  B:
  - name: 前月の支出を、ざっくり振り返る
    emoji: 🔍
    reason: 先月より増えた項目に気づける。
  - name: ごほうびを、先に予算に入れる
    emoji: 🎁
    reason: 我慢しすぎると、反動が来る。
  - name: サブスクの見直し
    emoji: 📺
    reason: 使っていないものがないか。
  C:
  - name: 投資・運用の積立額を確認する
    emoji: 📈
    reason: 無理のない範囲で。判断は自己責任。
  D:
  - name: 収入が入ったら、まず使ってしまう
    emoji: ⚠️
    reason: 月の後半で苦しくなりやすい。
  - name: 残高を確認せずに、引き落としを待つ
    emoji: 🚫
    reason: 残高不足になるリスク。
summary: '収入が入った日にやることは、「先に守る」「見える化」「ごほうび」の3つ。S級は、先に貯蓄と、引き落としの準備をすること。

  収入の日にまとめてやると、月の途中で迷わなくなる。'
related:
- money-kakeibo-tsuzuke
- kurashi-nenmatsu-yaru
