title: 鍋に入れる野菜 Tier表
description: 白菜、長ねぎ、春菊、えのき、しいたけ、大根、にんじん、水菜、キャベツ、もやし、ごぼう…鍋に入れる野菜を、AIが「鍋に入っていてうれしい度×だしを吸ったおいしさ」でランク付け。
category: food
genre: 野菜・果物
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 鍋に入っていてうれしい人気
  ② だしやスープを吸ったときのおいしさ
  ③ いろいろな鍋に合うか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 鍋の三大野菜
  D: 好きな人にはたまらない個性派
tiers:
  S:
    - name: 白菜
      emoji: "🥬"
      reason: 鍋の主役の野菜。煮込むほどに甘くなり、スープをたっぷり吸ってとろとろに。
    - name: 長ねぎ
      emoji: "🧅"
      reason: 煮るととろっと甘くなる。すき焼きや鴨鍋には欠かせない。
    - name: えのき
      emoji: "🍄"
      reason: つるっとした食感と、だしに出るうまみ。どんな鍋にも合う万能選手。
  A:
    - name: しいたけ
      emoji: "🍄"
      reason: 飾り切りした十字の模様が鍋を華やかにする。うまみたっぷり。
    - name: 春菊
      emoji: "🌿"
      reason: 独特の香りがすき焼きや寄せ鍋のアクセントに。大人になって好きになる人も多い。
    - name: 水菜
      emoji: "🌱"
      reason: シャキシャキ食感で、はりはり鍋やしゃぶしゃぶに。
    - name: 大根
      emoji: "⚪"
      reason: だしを吸った大根はおでんと同じくらいおいしい。
    - name: にんじん
      emoji: "🥕"
      reason: 彩りと甘み。花の形に型抜きすると鍋が華やかに。
  B:
    - name: キャベツ
      emoji: "🥬"
      reason: もつ鍋には欠かせない。甘みが出てスープがおいしくなる。
    - name: もやし
      emoji: "🌱"
      reason: シャキシャキでボリュームアップ。安くて家計の味方。
    - name: ごぼう
      emoji: "🥢"
      reason: 香りと歯ごたえ。鶏の水炊きやきりたんぽ鍋に。
    - name: しめじ・まいたけ
      short: しめじ
      emoji: "🍄"
      reason: きのこを何種類も入れると、スープのうまみが深くなる。
    - name: ニラ
      emoji: "🌿"
      reason: もつ鍋やキムチ鍋に欠かせない、パンチのある香り。
  C:
    - name: じゃがいも
      emoji: "🥔"
      reason: 石狩鍋などで使われる。煮崩れしやすいので、入れるタイミングが大事。
    - name: かぼちゃ
      emoji: "🎃"
      reason: 甘みがスープに溶けて、ほうとう風に。好みは分かれる。
  D:
    - name: せり
      emoji: "🌾"
      reason: 根っこまで食べる宮城の「せり鍋」が有名。シャキシャキした食感と香りは、冬の通好みの味。
    - name: トマト
      emoji: "🍅"
      reason: トマト鍋の主役。和風の鍋に入れるのは少し冒険だが、うまみが強くなる。
summary: |
  鍋に入れる野菜は、白菜・長ねぎ・えのきがS。煮込むほどに甘みやうまみが出て、スープまでおいしくしてくれる。
  宮城のせり鍋のように、野菜が主役になるご当地の鍋もある。鍋の野菜は、冬においしくなる旬のものを選ぶのが一番。
related: [food-nabe-aji, food-nabe-shime, food-shabu-gu]
