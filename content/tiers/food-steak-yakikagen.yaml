title: ステーキの焼き加減 Tier表
description: レア、ミディアムレア、ミディアム、ウェルダン、ブルー、炭火焼き、低温調理、鉄板で自分で仕上げる…ステーキの焼き加減を、AIが「肉のおいしさ×食べやすさ」でランク付け。
category: food
genre: 肉料理
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① お肉のおいしさが引き立つか

  ② やわらかさ・食べやすさ

  ③ いろんな部位に合うか

  ※ ひき肉を固めた肉や、成形した肉は、中までしっかり焼くのが基本です

  '
rank_notes:
  S: ステーキの王道
  D: かなり上級者向け
tiers:
  S:
  - name: ミディアムレア
    emoji: 🥩
    reason: 中がほんのりピンク色。肉汁とやわらかさのバランスが一番いいと言われる焼き加減。
  - name: ミディアム
    emoji: 🟫
    reason: 中心にだけ少しピンクが残る。レアが苦手な人にもおすすめ。
  - name: レア
    emoji: 🔴
    reason: 表面だけ焼いて、中は赤いまま。いい赤身のお肉ほど、レアがおいしい。
  A:
  - name: 鉄板で自分好みに仕上げる
    short: 鉄板で仕上げ
    emoji: 🍳
    reason: 熱い鉄板で出てきて、自分で好きな焼き加減に。最後までアツアツ。
  - name: 炭火焼き
    emoji: 🔥
    reason: 炭の香ばしい香りがつく。外はカリッと、中はジューシー。
  - name: 低温調理
    emoji: 🌡️
    reason: 低い温度でじっくり火を通す。中までしっとりやわらかい。
  - name: ミディアムウェル
    emoji: 🟤
    reason: ほとんど火が通って、ほんの少しだけピンク。しっかり派の入口。
  B:
  - name: ウェルダン
    emoji: 🍖
    reason: 中までしっかり焼く。脂の多い部位は、ウェルダンでもおいしい。
  - name: お店のおすすめ（部位でおまかせ）
    short: おまかせ
    emoji: ⭐
    reason: 赤身はレア寄り、脂の多い部位はしっかりめなど、お肉に合わせて焼いてもらう。
  - name: 表面に強い焼き目
    short: 強めの焼き目
    emoji: 💥
    reason: 表面をカリッと香ばしく焼きつける。焼き目のおいしさを楽しむ。
  - name: 溶岩プレート
    emoji: 🌋
    reason: 熱い石のプレートで、自分で少しずつ焼いて食べる。
  C:
  - name: ブルー
    emoji: 🔵
    reason: 表面をさっと焼くだけで、中はほぼ生。好きな人はいるけど、かなり好みが分かれる。
  - name: ベリーウェルダン
    emoji: ⚫
    reason: 完全に火が通った、かためのステーキ。ソースをたっぷりかけたい。
  D:
  - name: ベリーレア
    emoji: 🩸
    reason: レアよりさらに生に近い。いいお肉で、信頼できるお店でだけ。
  - name: タタキ風（表面だけ焼く）
    short: タタキ風
    emoji: 🔪
    reason: 表面だけ焼いて薄く切る、和風の食べ方。ポン酢やわさび醤油で。
summary: 'ステーキの焼き加減は、ミディアムレア・ミディアム・レアがS。いい赤身ほどレア寄り、脂の多い部位はしっかりめがおいしい。

  ただし、ひき肉を固めたお肉や、成形したお肉は、中までしっかり焼くのが基本。

  '
