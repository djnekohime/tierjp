title: AIに文章を書いてもらうときのコツ Tier表
description: 目的を伝える、材料を渡す、文字数を指定する、自分の言葉に直す…AIに文章を書いてもらうコツを、AIが「質の上がり方×安全性×手軽さ」でS〜Dにランク付け。
category: ai
tags:
- AI
- 初心者
- 安全性
published: '2026-10-09'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 文章の質が上がるか

  ② 間違いや情報漏えいを防げるか

  ③ 手軽さ

  ※ AIの機能や規約は変わります。使う前に、各サービスの最新の案内を確認してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 何のための、誰に向けた文章かを伝える
    emoji: 🎯
    reason: 目的と読み手が分かると、文章の質が大きく変わる。
  - name: 材料（事実・体験・メモ）を渡す
    emoji: 📝
    reason: 自分の体験が入ると、その人らしい文章になる。
  - name: 最後に自分で読み直し、事実を確認
    emoji: 🔍
    reason: 数字・固有名詞・日付の誤りは、AIでも起こる。
  A:
  - name: 文字数・文体・トーンを指定する
    emoji: 📏
    reason: 「やさしい口調で300字」など、具体的に。
  - name: 最初は短い下書きを作らせ、そこから直していく
    emoji: 🧱
    reason: 少しずつ直すほうが、思い通りになる。
  - name: 自分の文章を見せて、文体をまねてもらう
    emoji: ✍️
    reason: 自分らしさを残せる。著作権のある他人の文章は使わない。
  B:
  - name: 複数案を出してもらい、いいとこ取りする
    emoji: 🎨
    reason: ヒントが増える。
  - name: AIに、読みにくいところを指摘してもらう
    emoji: 👓
    reason: 書き終えた文章の推敲に向く。
  - name: 箇条書きから文章に広げてもらう
    emoji: 📋
    reason: 下書きが早い。つなぎの表現に注意。
  C:
  - name: タイトル案・キャッチコピーを出してもらう
    emoji: 🏷️
    reason: 発想の助けになる。似た表現になりやすい。
  - name: 長い文章をまとめて作らせる
    emoji: 📄
    reason: 量は書けるが、内容が薄くなりやすい。
  D:
  - name: 出てきた文章をそのまま公開
    emoji: 🚫
    reason: 間違い・不自然さが混ざることがある。必ず自分で確認。
  - name: 個人情報や、公開前の情報を入れる
    emoji: 🔒
    reason: 情報漏えいのリスク。入力してよい範囲を確認する。
  - name: 他人の文章を、言い換えただけで公開する
    emoji: ⚠️
    reason: 著作権・盗用の問題になりうる。
summary: 'AIに文章を書いてもらうときは、「何のための、誰に向けた文章か」を最初に伝えるのが一番効く。S級は、目的・読む人・材料の3点セット。

  AIの書いた文章は、間違いや、他の人と似た表現が混ざることもある。最後に、自分の言葉と目で確かめて仕上げる。'
related:
- ai-fact-check
- ai-nani-makaseru
- ai-shitsumon-kotsu
