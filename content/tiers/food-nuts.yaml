  - name: ミックスナッツ
    emoji: 🥜
    reason: いろんな種類を、少しずつ食べたいときに。
  C:
  - name: 塩味つきのナッツ
    emoji: 🧂
    reason: お酒のおつまみ向き。塩分に注意。
  - name: チョコがけナッツ
    emoji: 🍫
