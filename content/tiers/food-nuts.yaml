title: ナッツの種類 Tier表
description: アーモンド、カシューナッツ、くるみ、ピスタチオ、マカダミア、ピーナッツ、ヘーゼルナッツ、ペカン、ブラジルナッツ、松の実…ナッツの種類を、AIが「おいしさ×手が止まらない度×ヘルシー度」でランク付け。
