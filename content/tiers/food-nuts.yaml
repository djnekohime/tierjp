  - name: くるみ
    emoji: 🧠
    reason: 香りとコクがある。パンにも、お菓子にも。
  - name: ピーナッツ
    emoji: 🥜
    reason: 安くて、おいしい。おつまみの定番。
  - name: ヘーゼルナッツ
    emoji: 🍫
