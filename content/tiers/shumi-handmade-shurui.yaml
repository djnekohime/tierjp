title: ハンドメイドの種類・始めやすさ Tier表
description: 刺しゅう、編み物、ビーズ、レジンアクセ、ミシン、消しゴムはんこ、粘土、キャンドル、革細工、陶芸…ハンドメイドの種類を「道具の少なさ・失敗しにくさ・続けやすさ」の始めやすさでS〜Dにランク付け。
category: shumi
tags: [初心者]
published: 2026-10-05
labels:
  S: 始めやすい
  A: おすすめ
  B: 道具をそろえれば
  C: 準備が大変
  D: 慎重に
criteria: |
  ① 道具・材料の費用の少なさ
  ② 失敗しにくさ・作りやすさ
  ③ 続けやすさ（場所・時間・安全面）
  ※ 一般的な目安です。レジンや、キャンドル、革細工、陶芸などは、薬品・火・刃物・熱を使うので、使い方の説明をよく読み、換気や安全対策をしてください。ペットや、小さな子供がいる家は、材料や、小さな部品の、誤飲にも注意してください
rank_notes:
  S: 最初の1つめに
  D: 道具・安全面の準備を、しっかり
tiers:
  S:
    - name: 刺しゅう（ワンポイント・フレンチノット）
      short: 刺しゅう
      emoji: "🪡"
      reason: 針と糸と布で、始められる。小さな作品から、気軽に作れる。
    - name: 消しゴムはんこ・スタンプ
      short: 消しゴムはんこ
      emoji: "🖋️"
      reason: 材料が安く、失敗しても、やり直しやすい。カッターの扱いには、注意する。
    - name: 紙もの（マスキングテープ・シール・コラージュ）
      short: 紙もの・コラージュ
      emoji: "📎"
      reason: 道具が少なく、すぐ楽しめる。手帳や、カードに、すぐ使える。
  A:
    - name: 編み物（かぎ針・棒針）
      short: 編み物
      emoji: "🧶"
      reason: 道具が少なく、動画で、学びやすい。マフラーや、小物から、始められる。
    - name: ビーズアクセサリー
      short: ビーズ
      emoji: "📿"
      reason: 作品が、すぐ形になる。小さな部品は、ペットや、子供の誤飲に、注意する。
    - name: 粘土（軽量粘土・樹脂粘土）
      short: 粘土
      emoji: "🧸"
      reason: 手で、形作れて、自由度が高い。乾燥時間が、必要。
    - name: 布小物（手縫い・フェルト）
      short: 布小物・フェルト
      emoji: "🧵"
      reason: ミシンがなくても、作れる。ポーチや、ブローチなど、使えるものが、作れる。
    - name: マクラメ・ミサンガ・ひも結び
      short: マクラメ・ミサンガ
      emoji: "🪢"
      reason: ひもだけで、作れる。パターンを、覚えると、広げやすい。
  B:
    - name: ミシン縫い（バッグ・服）
      short: ミシン
      emoji: "🧵"
      reason: ミシン本体の、費用が必要。慣れると、作れるものが、一気に広がる。
    - name: レジンアクセサリー
      short: レジン
      emoji: "💎"
      reason: 薬品を使うので、換気と手袋が、必要。硬化ライトや、型も、必要。
    - name: ガラスや、ステンドグラス風の、工作
      short: ステンドグラス風
      emoji: "🪟"
      reason: キットなら、始めやすい。ガラスの破片や、はんだごての扱いには、注意する。
    - name: ハーバリウム・アロマ・石けん作り
      short: ハーバリウム・石けん
      emoji: "🧼"
      reason: 香りや、見た目が楽しい。材料や、オイルの扱いは、ペットや、子供の安全を考える。
  C:
    - name: キャンドル作り
      short: キャンドル
      emoji: "🕯️"
      reason: ろうを、溶かすので、やけどの注意が必要。火災にも、気をつける。
    - name: 革細工（レザークラフト）
      short: 革細工
      emoji: "👜"
      reason: 道具が多く、刃物も使う。作品の質が、高く、長く使える。
  D:
    - name: 陶芸・金工などの、窯や設備が必要なもの
      short: 陶芸・金工
      emoji: "🏺"
      reason: 窯や、工房が、必要。体験教室から、始めるのがおすすめ。
    - name: 道具を一気に買い揃える（使い切れない）
      short: 道具の買いすぎ
      emoji: "🛍️"
      reason: 続かなかったときに、無駄になる。まず、キットや、最小限から、試す。
    - name: 説明書や、安全注意を、読まずに作る
      short: 説明を読まない
      emoji: "⚠️"
      reason: ケガや、事故の原因になる。特に、薬品・熱・刃物は、説明を、よく読む。
summary: |
  Sは、「刺しゅう」「消しゴムはんこ」「紙もの」。道具が少なく、失敗しにくいので、最初の1つめに向いている。
  レジン・キャンドル・革細工などは、薬品・火・刃物を使う。安全のために、説明をよく読み、ペットや、小さな子供のいる家は、材料の置き場所にも気をつけよう。
related: [shumi-hajimeyasui, shumi-shitsunai, shumi-diy-dogu]
