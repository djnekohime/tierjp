summary: '国公立大学は、旧帝国大学（北海道・東北・東京・名古屋・京都・大阪・九州）を中心に、東京科学大学（旧・東京工業大学）、一橋大学、神戸大学などが、難関として知られる。

  地方の国立大学は、地元の医療・教育・産業を支える、大切な存在。ここでは、入試の難しさの目安で並べている。'
