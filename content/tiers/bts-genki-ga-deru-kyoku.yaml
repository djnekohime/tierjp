summary: '朝や、気合を入れたいとき、疲れたときに聴きたい、BTSの元気ソング。S級は、イントロから気分が上がり、体が自然に動き出す曲。

  じんわり元気になる曲も、気持ちに寄り添ってくれる大切な存在。気分に合わせて選ぶのがおすすめ。'
