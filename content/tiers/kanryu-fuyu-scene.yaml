title: 韓国ドラマの冬あるあるシーン Tier表
description: 雪の中の再会、マフラーを巻いてあげる、コートのポケットで手をつなぐ、白い息、焼き芋…韓国ドラマに出てくる冬の定番シーンを、ゾーマが「キュンとする度×あるある度×また見たい度」でS〜Dにランク付け。
