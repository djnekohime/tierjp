tiers:
  S:
  - name: 雪の中での再会
    emoji: ❄️
    reason: 降る雪がふたりの距離を縮める。冬ドラマ最強の定番シーン。
  - name: コートのポケットの中で手をつなぐ
    emoji: 🧥
    reason: 言葉がなくても気持ちが伝わる。何度見てもキュンとする。
  - name: 白い息を見ながら、静かに話す夜
    emoji: 🌬️
    reason: 寒さが切なさを引き立てる。会話の間が胸に残る。
  A:
  - name: マフラーを巻いてあげる
    emoji: 🧣
    reason: 何気ない仕草に、気持ちがこもる。巻き方まで気になってしまう。
  - name: 温かい缶コーヒーを渡す
    emoji: 🥫
    reason: 冷えた手に伝わる温かさ。さりげない優しさの象徴。
  - name: 雪の日に傘をさしかける
    emoji: ☂️
    reason: 距離が近づく定番。肩が濡れているのに気づく展開もお約束。
  - name: 屋台で、湯気の立つ食べ物を分け合う
    emoji: 🍢
    reason: ほっとする場面。寒い日の屋台は、ドラマの名脇役。
  - name: 転ばないように、手を取ってくれる
    emoji: 🛷
    reason: 凍った道で助けられるのは、ときめきのチャンス。
  - name: ホームや停留所で、白い息で待つシーン
    emoji: 🚏
    reason: 待つ時間そのものが、物語になる。
  B:
  - name: 焼き芋を、はふはふ食べる
    emoji: 🍠
    reason: 冬のおやつの定番。素朴な幸せが伝わる。
  - name: 鍋を囲んで、わいわいにぎやかに食べる
    emoji: 🍲
    reason: 家族や友だちの空気が出る。温かい場面。
  - name: イルミネーションの下で、夜に話す
    emoji: ✨
    reason: きれいで、恋が動き出しそうな雰囲気に。
  - name: 凍った湖や川のそばを、並んで歩く
    emoji: 🏞️
    reason: 景色が美しく、静かな会話が似合う。
  - name: 雪だるまや、雪合戦ではしゃぐ
    emoji: ⛄
    reason: ふだんクールな人が子どもみたいになるのが微笑ましい。
  - name: ひとつのブランケットを、ふたりで使う
    emoji: 🛋️
    reason: 距離が近づくシーン。家の中の冬の定番。
  C:
  - name: 雪の中を、なぜか全力で走る
    emoji: 🏃
    reason: もはや恒例。転ぶ、追いかける、のセットも多い。
  - name: 重要な告白の日に限って、大雪になる
    emoji: 🌨️
    reason: 運命的だけど、あまりにタイミングがよすぎる。
  - name: 別れの場面で、傘もささずに雨か雪に濡れる
    emoji: 🥶
    reason: ドラマチックだが、見ていて心配になる。
  D:
  - name: 寒い夜に、なぜか薄着で外に出る
    emoji: 🧊
    reason: 「風邪ひくよ！」と、つい言いたくなる。
  - name: 凍える手で、スマホをずっと長電話する
    emoji: 📱
    reason: 手が冷たくなりそうで、見ていて寒い。
  - name: 寒空の下、ずっと同じ場所で待ち続ける
    emoji: ⏳
    reason: 健気すぎて心配になる。ついツッコミたくなるお約束。
summary: '韓国ドラマの冬は、雪と白い息だけで、ぐっと切なくなる季節。S級の「雪の中の再会」「コートのポケットで手をつなぐ」は、セリフがなくても気持ちが伝わる、冬ドラマの王道だ。

  寒さの描写が、そのまま心の距離の描写になっているのも魅力。マフラーを巻いてあげる、手袋を片方ずつ貸す、湯気の立つ飲み物を渡す。ささやかな仕草なのに、胸にくる。

  反対にD級の「なぜか薄着で外に出る」は、見ていて思わず「風邪ひくよ！」とツッコミたくなる、愛すべきお約束。

  冬の韓国ドラマを見るときは、あったかい飲み物とブランケットを用意して、のんびり泣いたり笑ったりするのがおすすめ。観終わったあとに、体も心もほっと温まる。あなたの「これぞ冬の韓ドラ」は、どのシーン？ 自分の好みでTier表を作って、友だちと見比べてみても楽しい。

  韓国の冬は寒さが厳しいぶん、ドラマでは温かい食べ物や、人のぬくもりが印象的に描かれることが多い。ロケ地として人気の雪景色や、イルミネーションに注目して見るのも楽しい。冬ドラマを見ながら、ココアやあったかいお茶を用意して、おうちシアターにするのもおすすめ。気に入ったシーンは、メモしておくと次に見るドラマ選びの参考にもなる。あなたのお気に入りの冬シーンを、ぜひ教えてね。もし気になったシーンがあれば、友だちと「あのシーンが好き」と語り合うのも冬の楽しみ方。同じ場面でも、人によってキュンとするポイントが違うのが面白い。'
