title: うさぎに危険な食べもの・もの Tier表
description: ネギ類、チョコ、じゃがいもの芽、パンやご飯…うさぎにとって危険になりうる食べもの・ものを危険度でS〜Dにランク付け。
category: animals
tags:
- ウサギ
- 小動物
- 動物
- 初心者
published: '2026-10-06'
labels:
  S: 絶対NG
  A: 要注意
  B: あげないほうがいい
  C: 与え方しだい
  D: おおむね問題なし
criteria: '① 中毒や体調不良につながる危険度

  ② 家庭で口に入る機会の多さ

  ③ うさぎの消化の弱さによる影響の大きさ

  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。動物の種類・年齢・体質・量で影響は変わります。心配なときは、様子を見すぎず、動物病院に相談してください。うさぎは、おなかの調子をくずすと、急に悪くなることがあります'
rank_notes:
  S: 少量でも命にかかわる可能性
  D: 量や与え方を守ればおおむね問題なし
tiers:
  S:
  - name: 玉ねぎ・ネギ類
    short: ネギ類
    emoji: 🧅
    reason: 赤血球をこわして、貧血などを起こすことがある。加熱しても危険は消えない。
  - name: チョコレート・ココア
    emoji: 🍫
    reason: 含まれる成分が中毒を起こすことがある。部屋んぽ中に、うっかり届く場所に置かない。
  - name: アボカド
    emoji: 🥑
    reason: 小動物にとって、体によくない成分が含まれると言われている。安全のため、あげない。
  - name: じゃがいもの芽・緑色の皮
    short: じゃがいもの芽
    emoji: 🥔
    reason: 芽や緑色の部分には、体によくない成分が多い。うさぎには与えない。
  A:
  - name: 人間のパン・ご飯・お菓子
    short: パン・ご飯・お菓子
    emoji: 🍞
    reason: でんぷん・砂糖が多く、うさぎのおなかの中のバランスをくずしやすい。ねだられても与えない。
  - name: ルバーブ
    emoji: 🥬
    reason: シュウ酸を多く含み、うさぎには向かない。野菜を与えるときは、葉物の種類をよく確認する。
  - name: 生の豆類（インゲン豆など）
    short: 生の豆
    emoji: 🫘
    reason: 生のままだと、体によくない成分を含むものがある。与えない。
  - name: 観葉植物・庭の草（種類によっては有毒）
    short: 有毒な植物
    emoji: 🪴
    reason: かじると、中毒を起こす植物がある。うさぎは何でもかじるので、部屋んぽ前に、届くところを片づける。
  - name: 電気コード・家具のかじり
    short: 電気コード
    emoji: 🔌
    reason: かじって、感電や、誤飲による腸のつまりにつながる。コードカバーをつけ、かじってよいおもちゃも用意する。
  B:
  - name: ナッツ・種子類
    short: ナッツ
    emoji: 🥜
    reason: 脂肪が多く、おなかの調子や肥満につながる。ごはんの代わりに与えない。
  - name: 穀物たっぷりのおやつ
    short: 穀物のおやつ
    emoji: 🍘
    reason: 炭水化物が多く、おなかの調子をくずしやすい。おやつは、少量にとどめる。
  - name: 牛乳・乳製品
    short: 乳製品
    emoji: 🥛
    reason: 草食のうさぎは、乳糖を分解するのが苦手。おなかをこわしやすい。
  - name: 塩分の多い加工食品
    short: 塩分の多い食品
    emoji: 🍜
    reason: 人間用の食べ物は、塩分も脂肪も多すぎる。分けてあげない。
  C:
  - name: 果物・にんじん（糖分の多いもの）
    short: 果物・にんじん
    emoji: 🥕
    reason: おいしくて大好きな子が多いが、糖分が多い。おやつとして、ほんの少しだけ。
  - name: キャベツ・ブロッコリー（あげすぎ）
    short: キャベツなど
    emoji: 🥦
    reason: 食べすぎると、おなかにガスがたまりやすい。少量から様子を見て、種類を変えて与える。
  D:
  - name: チモシーなどの牧草
    short: 牧草
    emoji: 🌾
    reason: うさぎの主食。繊維質で、歯をすり減らし、消化にも大切。いつでも、たっぷり食べられるようにしておく。
  - name: 小松菜・チンゲン菜などの葉物野菜（適量）
    short: 葉物野菜
    emoji: 🥬
    reason: 水分とビタミンがとれる。新鮮なものを洗って、少しずつ。食べ残しは早めに片づける。
  - name: うさぎ用ペレット（適量）
    short: うさぎ用ペレット
    emoji: 🥣
    reason: 栄養を補いやすい。ただし、あげすぎると牧草を食べなくなるので、量を守る。
summary: 'うさぎは、草食で、おなかのしくみがとてもデリケート。人間の食べ物は、基本的に与えないのが安心。主食は牧草（チモシーなど）で、ペレットと野菜を少し足すのが基本のスタイル。

  Sは、少量でも危険になりうる「ネギ類・チョコ・アボカド・じゃがいもの芽」。うさぎは、物をかじるのが大好きなので、部屋んぽのときは、電気コードや、有毒な観葉植物も、届かないところへ。食欲がない、うんちが小さくなった・出ないときは、うさぎは急変しやすいので、すぐ動物病院に連絡を。'
related:
