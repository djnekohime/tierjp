title: ペットの防災備蓄 Tier表
description: フード、水、薬、トイレ用品、キャリー、迷子札…ペットの防災で備えておきたいものを、AIが「命と健康への影響×代わりのききにくさ×用意しやすさ」でS〜Dにランク付け。
category: animals
tags:
- 動物
- 防災
- 初心者
published: '2026-10-07'
labels:
  S: 必須
  A: あると安心
  B: あると便利
  C: 好みで
  D: なくても大丈夫（注意）
criteria: '① なくて困る度（命・健康への影響）

  ② 避難先で手に入りにくいか

  ③ 用意しやすさ

  ※ 動物の種類・年齢・体質で必要なものは変わります。持病や薬のことは、かかりつけの動物病院に相談してください。環境省も、フードと水は5日分以上の備えを案内しています'
rank_notes:
  S: 必須
  D: なくても大丈夫（注意）
tiers:
  S:
  - name: いつものフード（5日分以上）
    emoji: 🍚
    reason: 環境が変わるとごはんを食べなくなる子も。普段食べているものを多めに。
  - name: 飲み水（ペット用も含めて）
    emoji: 💧
    reason: 人間用とは別に、ペットの分も。最低でも5日分を目安に。
  - name: 常備薬・持病の薬・処方メモ
    emoji: 💊
    reason: 代わりがきかない。薬の名前と量をメモして、袋に入れておく。
  - name: トイレ用品（シーツ・砂・排泄物の袋）
    emoji: 🚽
    reason: 避難先では手に入りにくい。ふだん使っているものを。
  - name: 迷子札・首輪・ハーネス
    emoji: 🏷️
    reason: はぐれたときの命綱。連絡先が読めるかも、ときどき確認。
  A:
  - name: キャリー・ケージ（慣らしておく）
    emoji: 🧳
    reason: 避難所でも安全に過ごせる。ふだんから慣れていないと入ってくれない。
  - name: ペットの写真（正面・全身）と特徴メモ
    emoji: 📷
    reason: はぐれたときの捜索に使える。体重や特徴も書いておく。
  - name: ワクチン証明・健康記録のコピー
    emoji: 📄
    reason: 預け先や避難所で求められることがある。防水の袋に。
  - name: リード・予備の首輪
    emoji: 🦮
    reason: 脱走防止に。予備もあると安心。
  - name: 食器（折りたたみ式）
    emoji: 🥣
    reason: 軽くて、かさばらない。
  B:
  - name: ペットシーツ・ブランケット・タオル
    emoji: 🧣
    reason: 寝床や汚れ対策に。においのついたものは安心につながる。
  - name: おやつ・いつものおもちゃ
    emoji: 🧸
    reason: ストレスをやわらげる。
  - name: ウェットティッシュ・消臭袋
    emoji: 🧻
    reason: 衛生管理に。
  - name: ゲージ用の目隠し布
    emoji: 🧶
    reason: 暗くすると落ち着く子もいる。
  C:
  - name: ペット用の防寒・冷却グッズ
    emoji: 🧊
    reason: 季節に合わせて。夏冬で入れ替えを。
  D:
  - name: 「うちの子は大丈夫」と備蓄をしない
    emoji: 🚫
    reason: いざというとき、いちばん困る。最低限の3日分から始めたい。
summary: '災害のとき、ペットのものは人間用の支援物資に入らないことが多い。S級は、手に入らないと困るフード・水・薬・トイレ用品。

  備蓄は「いつものもの」を多めに買っておき、古いものから使う「ローリングストック」が続けやすい。多頭飼いなら、1匹ずつ分けて袋に入れておくと、持ち出しが早い。'
related:
- neko-goods
- inu-goods
- neko-kiken
