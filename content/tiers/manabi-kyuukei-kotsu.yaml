title: 勉強の合間の休憩のとり方 Tier表
description: 水分補給、軽いストレッチ、目を休める、スマホを見ない…勉強の合間の休憩のとり方を、AIが「疲れが取れるか×集中が戻るか×続けやすさ」でS〜Dにランク付け。
category: manabi
tags:
- 勉強法
- 初心者
published: '2026-10-09'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 疲れが取れるか

  ② 集中が戻るか

  ③ 続けやすさ'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 席を立って、軽くストレッチ・歩く
    emoji: 🚶
    reason: 血行がよくなり、集中が戻る。
  - name: 水分をとる
    emoji: 💧
    reason: 脳にも体にも大切。
  A:
  - name: 窓の外を見る・遠くを見て目を休める
    emoji: 👀
    reason: 目の疲れがやわらぐ。
  - name: 深呼吸をする
    emoji: 🫁
    reason: 気持ちが落ち着く。
  - name: タイマーで、休憩の時間を決める
    emoji: ⏱️
    reason: だらだら休憩を防げる。
  - name: 軽くつまめるもの（ナッツ・フルーツなど）
    emoji: 🍎
    reason: エネルギー補給に。食べ過ぎには注意。
  B:
  - name: 好きな音楽を1曲聴く
    emoji: 🎵
    reason: 気分転換になる。長くなりすぎないように。
  - name: 短い仮眠（10分から20分）
    emoji: 😴
    reason: 疲れが取れる。長すぎると、逆に眠くなる。
  - name: 窓を開けて、空気を入れ替える
    emoji: 🪟
    reason: 頭がすっきりする。
  C:
  - name: 軽い家事（洗い物・洗濯物）
    emoji: 🧺
    reason: 体を動かせる。やりすぎると本末転倒。
  - name: 短い動画を見る
    emoji: 📺
    reason: 長くなりがち。時間を決める。
  D:
  - name: 休憩中に、スマホでSNSを見続ける
    emoji: 📱
    reason: 気づけば長時間。
  - name: 休憩なしで、何時間も続ける
    emoji: ⏳
    reason: 集中力が落ちる。
  - name: 寝る時間を削って勉強
    emoji: 🌙
    reason: 記憶の定着にも、よくない。
summary: '勉強は、休憩の質で効率が変わる。S級は、短い時間でも「体を動かす」「目を休める」「水分をとる」こと。

  休憩のつもりでスマホを見始めると、気づけば長時間になりがち。時間を決めて、休憩したら戻ってくる流れを作るのがコツ。'
related:
- benkyo-tsuzukekata
- anki-hoho
