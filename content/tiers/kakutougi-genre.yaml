title: 格闘技ジャンル Tier表
description: MMA、ボクシング、キックボクシング、ムエタイ、柔術、相撲、プロレス…格闘技のジャンルを、AIが「見て楽しい度×分かりやすさ×日本での人気」でランク付け。
category: kakutougi
tags: [格闘技]
published: 2026-09-29
labels:
  S: 見るなら最強
  A: 熱い
  B: 通が楽しむ
  C: 奥が深い
  D: マニアック
criteria: |
  ① 初めて見ても楽しめるか（ルールの分かりやすさ）
  ② 試合の迫力・決着の分かりやすさ
  ③ 日本での人気・見られる機会の多さ
  ※ 競技としての優劣ではなく、「観戦の入口としてのおすすめ度」です
rank_notes:
  S: 格闘技を初めて見る人にまずおすすめ
  C: ルールを知るほど面白くなる
tiers:
  S:
    - name: MMA（総合格闘技）
      short: MMA
      emoji: "⚔️"
      reason: 殴る・蹴る・投げる・寝技と、何でもありの総合格闘技。立ち技から寝技まで展開が読めず、一瞬で決着がつくこともある。RIZINやUFCで日本でも大人気。
    - name: ボクシング
      emoji: "🥊"
      reason: パンチだけで戦う、ルールが一番分かりやすい格闘技。日本からは世界王者が何人も生まれていて、世界タイトルマッチは大きな話題になる。
    - name: キックボクシング
      emoji: "🦵"
      reason: パンチとキックで戦う立ち技の格闘技。スピード感のある打ち合いで、K-1やRISEなど日本の団体の人気も高い。
  A:
    - name: 相撲
      emoji: "🙇"
      reason: 日本の国技。一瞬で勝負が決まる分かりやすさと、場所ごとの優勝争いのドラマが魅力。テレビ中継で毎日見られるのも強み。
    - name: プロレス
      emoji: "🤼"
      reason: 技の美しさとキャラクター、ストーリーを楽しむスポーツエンターテインメント。勝ち負けだけでない、会場全体の盛り上がりは格闘技の中でも特別。
    - name: ムエタイ
      emoji: "🐘"
      reason: タイの国技で、ヒジ打ちやヒザ蹴り、首相撲が特徴。独特の音楽とリズムの中で行われる、伝統と迫力が同居する立ち技。
    - name: 空手
      emoji: "🥋"
      reason: 日本発祥で世界中に愛好者がいる武道。流派によってルールが違い、フルコンタクト空手の打ち合いは迫力満点。多くの格闘家のルーツでもある。
  B:
    - name: 柔道
      emoji: "🥋"
      reason: 日本発祥のオリンピック競技。一本で決まる投げ技の美しさは格別。オリンピックや世界選手権では日本中が注目する。
    - name: レスリング
      emoji: "🤸"
      reason: タックルや投げで相手を制する、格闘技の基本となる競技。オリンピックで日本の金メダルが多い。MMAでも強さの土台になっている。
    - name: ブラジリアン柔術
      short: 柔術
      emoji: "🔗"
      reason: 寝技で関節技や絞め技を狙う格闘技。初めて見ると地味に見えるが、技の攻防を知ると一気に面白くなる。MMAで勝つための必須科目。
    - name: グラップリング（ADCCなど）
      short: グラップリング
      emoji: "🧩"
      reason: 打撃なしで、組み技と寝技だけで戦う。ADCCなどの世界大会は、寝技好きにとっての最高峰。
  C:
    - name: テコンドー
      emoji: "🦶"
      reason: 韓国発祥の、華麗な蹴り技が特徴のオリンピック競技。電子防具による判定など、ルールを知らないと少し分かりにくい。
    - name: サンボ
      emoji: "🐻"
      reason: ロシア発祥の格闘技で、投げ技と関節技が中心。MMAの強豪選手のルーツになっていることが多い。
    - name: ラウェイ
      emoji: "✊"
      reason: ミャンマーの伝統格闘技で、グローブをつけず素手にバンテージで戦う。「世界一過激な格闘技」とも呼ばれる。
  D:
    - name: カポエイラ
      emoji: "🎶"
      reason: ブラジル発祥の、音楽とダンスのような動きが一体になった格闘技。試合として見るより、パフォーマンスとして楽しむ要素が強い。
summary: |
  格闘技を見始めるなら、MMA・ボクシング・キックボクシングの3つが入口。ルールが分かりやすく、日本でも大きな大会が多い。
  柔術やレスリングは、MMAを見ているうちに「あの寝技すごい」と気になってくるジャンル。ひとつ好きになると、別のジャンルの見え方も変わる。
related: [kakutougi-dantai-1ji, kakutougi-dantai-2ji, kakutougi-betsuwaku]
