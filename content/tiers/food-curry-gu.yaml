title: 家カレーの具 Tier表
description: じゃがいも、にんじん、玉ねぎ、豚肉、牛肉、ゆで卵、ちくわ…家で作るカレーの具を、AIが「入っていてうれしい度×カレーとの相性」でランク付け。家庭の数だけ正解がある。
category: food
genre: カレー
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 入っていると「うれしい！」と思える人気
  ② カレーのルーとの相性
  ③ 家庭で手軽に入れられるか
  ※ 家庭ごとに具は違います。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: これがないと家カレーじゃない
  D: 家庭の個性が出る変わり種
tiers:
  S:
    - name: じゃがいも
      emoji: "🥔"
      reason: 家カレーの主役。ほくほくのまま食べるか、溶けてとろみになるか、家ごとの好みが出る。
    - name: 玉ねぎ
      emoji: "🧅"
      reason: 目立たないが、甘みとコクの土台になる一番大事な具。じっくり炒めるほど味が深くなる。
    - name: にんじん
      emoji: "🥕"
      reason: 彩りと甘みを足してくれる定番。これがないと、見た目が一気にさびしくなる。
  A:
    - name: 豚肉
      emoji: "🐖"
      reason: 東日本の家カレーの定番の肉。手ごろな値段で、脂のうまみがルーによく合う。
    - name: 牛肉
      emoji: "🐂"
      reason: 西日本では「カレーの肉といえば牛」という家庭が多い。煮込むとコクが出て、ごちそう感がある。
    - name: 鶏肉
      emoji: "🐔"
      reason: やわらかく、さっぱりした味わい。チキンカレーは子供にも大人にも人気。
    - name: ゆで卵
      emoji: "🥚"
      reason: 後からのせても、一緒に煮込んでもいい。黄身がルーに溶けてまろやかになる。
    - name: ひき肉
      emoji: "🍖"
      reason: キーマカレーの主役。煮込み時間が短くても、しっかりうまみが出る。
  B:
    - name: なす
      emoji: "🍆"
      reason: 油を吸ってとろとろになり、夏野菜カレーの定番。
    - name: かぼちゃ
      emoji: "🎃"
      reason: 甘みがルーに溶けて、まろやかなカレーになる。子供が喜ぶ具。
    - name: きのこ
      emoji: "🍄"
      reason: しめじやまいたけのうまみがルーに移って、味に深みが出る。
    - name: ほうれん草
      emoji: "🥬"
      reason: 最後に加えると彩りがよく、栄養も足せる。インドカレーのサグのような味わいにも。
    - name: コーン
      emoji: "🌽"
      reason: プチプチ食感と甘み。子供向けのカレーの人気者。
  C:
    - name: シーフード（えび・いか）
      short: シーフード
      emoji: "🦐"
      reason: 海の幸のうまみがルーに広がる。ごちそうカレーだが、家では毎回とはいかない。
    - name: ブロッコリー
      emoji: "🥦"
      reason: 彩りと食感を足してくれる。後からのせるか、煮込むかで家庭の好みが分かれる。
  D:
    - name: ちくわ
      emoji: "🍥"
      reason: 地域や家庭によっては定番の、隠れた人気の具。カレーを吸ったちくわは意外なおいしさ。
    - name: りんご（すりおろし）
      short: りんご
      emoji: "🍎"
      reason: 具というより隠し味。すりおろして入れると甘みとコクが増す、昔からの工夫。
summary: |
  家カレーの具は、じゃがいも・玉ねぎ・にんじんの三兄弟がS。肉は東日本は豚、西日本は牛が多いといわれ、地域で「当たり前」が違う。
  ちくわやりんごのような「うちだけの具」が一番の話のタネ。あなたの家のカレーには、何が入っている？
related: [food-yakiniku-bui, food-onigiri]
