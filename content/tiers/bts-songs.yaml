title: BTSの曲 Tier表
description: Dynamite、Spring Day（봄날）、IDOL、Butter…BTS（防弾少年団）の名曲を、AIが「名曲度×BTSの歴史での重要度×初めての人へのおすすめ度」でランク付け。
category: bts
tags: [BTS, K-POP]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 名曲
  B: 大好き
  C: 沼の入口
criteria: |
  ① 曲そのものの完成度（何度聴いても色あせないか）
  ② BTSの歴史の中での重要度（転機になった曲か）
  ③ BTSを知らない人にすすめたときに伝わるか
  ※ 2025年までに発表された曲が対象。年は発表年
  ※ どの曲も名曲。ランクは「最初の1曲に選ぶなら」の順番です
rank_notes:
  S: BTSを語るならまずこの3曲
  A: 聴けば聴くほど好きになる
  B: ARMYなら絶対に外せない
  C: ここを好きになったら、もう沼の中
tiers:
  S:
    - name: Spring Day（봄날）（2017）
      short: Spring Day
      emoji: "🌸"
      reason: アルバム『YOU NEVER WALK ALONE』のタイトル曲。会いたい人への思いを冬から春への季節に重ねた曲で、韓国の音楽チャートに何年もランクインし続けた。派手さではなく、時間がたつほど価値が増していく、BTSの名曲の頂点。
    - name: Dynamite（2020）
      emoji: "🧨"
      reason: BTS初の全編英語の曲。アメリカのBillboard Hot 100で1位を獲得し、韓国のアーティストとして初の快挙になった。明るいディスコサウンドで、BTSを知らない人の「最初の1曲」に最適。
    - name: IDOL（2018）
      emoji: "🥁"
      reason: 『LOVE YOURSELF 結 'Answer'』のタイトル曲。韓国の伝統音楽のリズムや掛け声を取り入れ、MVでは韓服も登場する。「自分は自分」と言い切るメッセージとお祭りのような熱量が、BTSらしさの結晶。
  A:
    - name: DNA（2017）
      emoji: "🧬"
      reason: 『LOVE YOURSELF 承 'Her'』のタイトル曲。運命の愛を「DNA」にたとえた爽やかな曲で、BTSとして初めてBillboard Hot 100にランクインした。世界進出の入口になった一曲。
    - name: FAKE LOVE（2018）
      emoji: "🎭"
      reason: 『LOVE YOURSELF 轉 'Tear'』のタイトル曲。偽りの自分を演じる苦しさを歌うダークな曲。このアルバムでBillboard 200（アルバムチャート）の1位を獲得した。
    - name: Boy With Luv（2019）
      emoji: "💌"
      reason: 'Halseyが参加した『MAP OF THE SOUL : PERSONA』のタイトル曲。原題は「小さなものたちのための詩」。ファンへの愛情があふれるポップで、MVのパステルカラーも可愛い。'
    - name: Butter（2021）
      emoji: "🧈"
      reason: 英語のサマーソング。Billboard Hot 100で10週にわたって1位を獲得した。なめらかで軽快、何度聴いても気分が上がる。
    - name: Blood Sweat & Tears（피 땀 눈물）（2016）
      short: 血、汗、涙
      emoji: "🥀"
      reason: アルバム『WINGS』のタイトル曲。誘惑をテーマにした美しくも危うい世界観で、美術館のようなMVが話題に。それまでの力強いイメージから、芸術性の高いBTSへと変わった転機の曲。
    - name: Yet To Come（2022）
      emoji: "🌅"
      reason: デビューからの歩みをまとめたアルバム『Proof』のタイトル曲。「最高の瞬間はまだこれから」というメッセージは、長く応援してきたファンほど胸に響く。
  B:
    - name: Life Goes On（2020）
      emoji: "🌱"
      reason: アルバム『BE』のタイトル曲。コロナ禍で止まった日常の中、「それでも人生は続く」と静かに寄り添う。韓国語の曲として初めてBillboard Hot 100に1位で初登場した。
    - name: ON（2020）
      emoji: "🎺"
      reason: '『MAP OF THE SOUL : 7』のタイトル曲。マーチングバンドのような壮大なサウンドと、大人数のダンサーとのパフォーマンスは圧巻。ライブで真価を発揮する曲。'
    - name: Black Swan（2020）
      emoji: "🦢"
      reason: 音楽への情熱を失うことへの恐れを歌った曲。コンテンポラリーダンスを取り入れた表現が美しく、アーティストとしてのBTSの深さを感じられる。
    - name: I NEED U（2015）
      emoji: "🌧️"
      reason: 『花様年華 pt.1』のタイトル曲。BTSが初めて音楽番組で1位を獲得した曲。切なく疾走感のあるメロディーと、青春の痛みを描いた世界観の始まり。
    - name: FIRE（불타오르네）（2016）
      short: FIRE
      emoji: "🔥"
      reason: 『花様年華 Young Forever』のタイトル曲。激しいダンスと「燃え上がれ」という勢いで、ライブで一番盛り上がる曲のひとつ。
    - name: Magic Shop（2018）
      emoji: "🪄"
      reason: 『LOVE YOURSELF 轉 'Tear'』の収録曲で、JUNG KOOKが制作に参加。ファンのための曲として愛され、コンサートでも特別な曲になっている。
    - name: Permission to Dance（2021）
      emoji: "🕺"
      reason: エド・シーランが制作に参加した英語曲。国際手話を取り入れた振り付けで、「踊るのに許可はいらない」という誰でも楽しめるメッセージ。
  C:
    - name: MIC Drop（2017）
      emoji: "🎤"
      reason: 『LOVE YOURSELF 承 'Her'』の収録曲。自信たっぷりのヒップホップで、スティーヴ・アオキのリミックスがアメリカでもヒットした。かっこいいBTSが好きなら刺さる。
    - name: No More Dream（2013）
      emoji: "💭"
      reason: デビュー曲。「お前の夢は何だ」と問いかける、10代のヒップホップグループだった頃のBTS。今の姿と比べると、ここまでの道のりに胸が熱くなる。
    - name: Mikrokosmos（2019）
      emoji: "🌌"
      reason: '『MAP OF THE SOUL : PERSONA』の収録曲。一人ひとりが星のように光っているという、きらめくような曲。コンサートで会場が光に包まれる場面が有名。'
    - name: Save ME（2016）
      emoji: "🆘"
      reason: 『花様年華 Young Forever』の収録曲。広い草原で踊るMVのダンスが見どころ。「僕を救って」という切実な叫びが、花様年華シリーズの痛みと重なる。
    - name: RUN（2015）
      emoji: "🏃"
      reason: 『花様年華 pt.2』のタイトル曲。走り続ける青春の痛みを描いた、花様年華シリーズの世界観の核になる曲。物語を知るほど好きになる。
summary: |
  BTSの名曲を選ぶのは、正直どれを外しても誰かに怒られる難題。今回は「BTSを知らない人に最初に渡すなら」という視点で並べた。
  S〜Aは世界を変えた曲、Bはライブやファンとの絆で輝く曲、Cは知れば知るほどハマる「沼の入口」。Cから好きになった人は、もう立派なARMYです。
  日本語オリジナル曲（Lights、Stay Gold、Film outなど）は、別のTier表で改めてランク付けする予定。
related: [actor-iu]
