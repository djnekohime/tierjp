title: 旅行・帰省に出かける前の、家のチェック Tier表
description: 火の元、戸締まり、ゴミ、冷蔵庫、水まわり、ペットの世話…旅行や帰省で家を空ける前にしておきたいチェックを、ゾーマが「安心感×防げる失敗×手間」でS〜Dにランク付け。
category: travel
tags:
- 初心者
- 安全性
published: '2026-11-18'
labels:
  S: 外しにくい
  A: 満足度が高い
  B: 目的しだい
  C: 慣れてから
  D: おすすめしにくい
criteria: '① 安心感（出先で心配にならないか）

  ② 防げるトラブルの大きさ

  ③ 手間の少なさ

  ※ 専門家の助言ではなく、暮らしの目安です。ペットや植物、お住まいの環境によって必要な準備は変わります'
rank_notes:
  S: 必ずやりたい
  D: やめておきたい
tiers:
  S:
  - name: ガス・コンロ・ストーブなど、火の元を確認する
    emoji: 🔥
    reason: 火災を防ぐ、いちばん大切なチェック。消した、と声に出して確認すると忘れにくい。
  - name: 玄関・窓の鍵を、すべて確認する
    emoji: 🔐
    reason: 防犯の基本。窓は、2階や小さな窓も忘れずに。
  - name: 生ゴミを出して、ゴミ箱を空にする
    emoji: 🗑
    reason: 長く空けると、においや虫の原因になる。ゴミ出し日に合わせて予定を立てたい。
  A:
  - name: 冷蔵庫の傷みやすいものを、食べ切るか冷凍する
    emoji: 🧊
    reason: 帰宅してから、悪くなった食材に気づくのは悲しい。出発前に整理したい。
  - name: 水道の蛇口・洗濯機の水栓が閉まっているか確認する
    emoji: 🚰
    reason: 水漏れ事故を防ぐ。長く空けるときは、特に大切。
  - name: 使わない家電のコンセントを抜く
    emoji: 🔌
    reason: 待機電力の節約になり、雷などの異常にも備えられる。冷蔵庫は、抜かない。
  - name: ペットの世話や預け先を、早めに決める
    emoji: 🐾
    reason: 預け先が決まっていれば、出先でも安心できる。留守番は、期間を考えて。
  - name: 貴重品・薬・スマホの充電器の入ったバッグを確認する
    emoji: 🎒
    reason: 出先で困りにくい。家を出る前に、最終確認したい。
  B:
  - name: 植物の水やりを、出発前に済ませる
    emoji: 🪴
    reason: 数日なら、たっぷりの水やりで足りる場合も。長期は、頼める人を探したい。
  - name: 郵便や宅配の受け取りを、調整する
    emoji: 📮
    reason: 不在が続くと、ポストがあふれて留守が分かりやすい。
  - name: ブレーカーを落とす・落とさないを、あらかじめ決めておく
    emoji: ⚡
    reason: 冷蔵庫など使うものがあるなら、落とさない。決めておくと迷わない。
  - name: 出発前に、家の中の写真を撮っておく
    emoji: 📸
    reason: 出先で「閉めたっけ」と思ったとき、見返して安心できる。
  - name: エアコン・暖房を、切って出る
    emoji: 🌡
    reason: つけっぱなしは危険。ペットがいる場合は、温度管理の方法を確認する。
  - name: カーテンの開け閉めを、いつも通りにしておく
    emoji: 🪟
    reason: 不在が分かりにくい。ずっと閉めっぱなしは避ける。
  C:
  - name: 家じゅうを、完璧に掃除してから出る
    emoji: 🧼
    reason: 帰宅時は気持ちいい。ただし、疲れて出発が遅れることも。
  - name: SNSに、出発の様子をリアルタイムで投稿する
    emoji: 📱
    reason: 楽しいが、不在が分かる。帰ってから投稿する方が安心。
  - name: 防犯グッズを新しく買い足す
    emoji: 🛒
    reason: 不安なら有効だが、基本のチェックが先。必要性を考えて選びたい。
  D:
  - name: チェックをせず、勢いで出発する
    emoji: 💨
    reason: 出先で心配になり、旅が台無しになることも。
  - name: 玄関前に、不在が分かる貼り紙や荷物を放置する
    emoji: ⚠️
    reason: 防犯面で不安。宅配の置き場所なども、見直したい。
  - name: 冷蔵庫の中身を、そのままにして長期間空ける
    emoji: 🥶
    reason: 帰宅して、においや食中毒のもとに気づくことになる。
  - name: ガスの元栓を気にせず、出かけてしまう
    emoji: 💥
    reason: 万一の事故のもと。出る前に、必ず確認したい。
summary: '年末年始や連休は、旅行や帰省で家を空ける機会が増える。出発直前はバタバタして、「ガスの元栓、閉めたっけ？」と、移動中に心配になった経験がある人も多いはず。

  そこで役に立つのが、出発前のチェック。S級に置いたのは、火の元（ガス・コンロ・ストーブなど）と、戸締まり、ゴミの処理。この3つは、安全面と衛生面で、とくに大切だ。

  A級には、冷蔵庫の中身の整理、水まわり（蛇口・洗濯機）、家電のコンセント、ペットの世話などが入る。長く家を空けるときは、傷みやすい食べ物を食べ切るか冷凍するのがおすすめ。

  一方、D級の「確認せずに出発する」「玄関に不在が分かる目印をつける」は避けたい。郵便物がたまっているなど、留守が分かる状態は、防犯の面でも不安がある。

  効率よく進めるコツは、チェックリストを作ること。紙でもスマホのメモでもいい。出発前日に「家の中を回る順番」を決めておくと、抜けがなくなる。出発直前には、玄関で最後の確認として、玄関の鍵、ガス、電気のブレーカー、窓の鍵を見直そう。

  不安が残るときは、出発前に家の中を写真に撮っておくと、出先で「閉めたっけ」と思ったときに見返せて安心。家族と一緒に出かけるなら、役割を分担して、複数の目で確認するのもよい。

  チェックリストの項目は、自分の家に合わせて足していこう。例えば、ベランダの洗濯物を取り込む、宅配便の再配達を止める、ペットの水と食事の量を確認する、など。一度作ったリストは保存しておけば、次の旅行からは見直すだけで済む。「1回作れば、毎回使える」のが、いちばんの時短になる。'
