criteria: '① 看板の個性（餃子や中華の持ち味があるか）

  ② 気軽さ（ひとりでも入りやすいか）

  ③ また行きたくなる度

  ※AIは全店で食べたわけではありません。公開情報（創業・特徴・店舗数）と、AIの好みで並べています。ランクはお店の良し悪しではなく「特徴の目立ち方」です。

  店舗数は各社の2026年の公開データによる目安で、載せていないお店は確認できなかったものです。

  '
rank_notes:
