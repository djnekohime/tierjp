    emoji: 🔥
    reason: 328店（2026年2月末）。羽根つき餃子と、冷凍餃子も人気。
  - name: ぎょうざの満洲
    emoji: 🥬
    reason: 直営104店（2026年4月）。埼玉発で、生餃子の持ち帰りに強い。
  - name: ホワイト餃子
    emoji: ⚪
    reason: 千葉発。昔ながらの餃子を、持ち帰りで楽しめる。
  - name: 宇都宮みんみん
    emoji: 🏯
