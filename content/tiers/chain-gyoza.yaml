    reason: 728店（2026年3月末、FC含む）。京都発で、焼き餃子が看板。定食から一品料理まで、中華をなんでも楽しめる。
  - name: 日高屋
    emoji: 🍜
    reason: 関東中心に446店。ワンコイン前後で食べられる、ひとり飲みにも使える中華食堂。
  - name: バーミヤン
    emoji: 🥢
    reason: 370店（2026年7月時点）。すかいらーくグループで、家族で行ける中華レストラン。
