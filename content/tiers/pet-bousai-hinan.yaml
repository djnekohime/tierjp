title: 災害時のペットの避難先の選択肢 Tier表
description: 自宅避難、親戚・友人宅、避難所での同行避難、車中泊、ペットホテル…災害時にペットと過ごす避難先を「ペットの安全・負担・現実的に選びやすいか」でS〜Dにランク付け。
category: animals
tags: [犬, 猫, 防災, 動物]
published: 2026-10-03
labels:
  S: まず検討したい
  A: 有力な選択肢
  B: 条件しだい
  C: 注意が必要
  D: おすすめしない
criteria: |
  ① ペットの安全と、心身の負担の少なさ
  ② 飼い主やほかの人にとっての現実的な選びやすさ
  ③ 準備や事前確認のしやすさ
  ※ 災害の種類（地震・水害・火災・台風）や、お住まいの地域によって、適した避難先は変わります。避難所のルールは、自治体や施設ごとに違います。事前に、自治体のハザードマップや、ペットの避難についての情報を確認してください
rank_notes:
  S: 自宅が安全なら、まず第一の選択肢
  D: 事前の準備がなければ、避けたい
tiers:
  S:
    - name: 自宅が安全なら、自宅で過ごす（在宅避難）
      short: 在宅避難
      emoji: "🏠"
      reason: ペットにとって、慣れた環境がいちばん安心。自宅が安全で、避難の指示がなければ、まず選びたい。水・食料・トイレの備蓄が前提。
    - name: 安全な地域にある、親戚・友人の家（ペットと一緒）
      short: 親戚・友人宅
      emoji: "🤝"
      reason: 人にも、ペットにも、落ち着ける環境。事前にお願いしておけば、いざというときに頼りになる。ペットの受け入れが可能か、あらかじめ確認しておく。
  A:
    - name: ペット同伴ができる避難所（同行避難）
      short: 同行避難
      emoji: "🏫"
      reason: ペットと一緒に避難所まで避難する「同行避難」が基本とされている。ただし、人と同じ部屋で過ごせるとは限らず、屋外や別室でケージ飼いになることが多い。事前に、自治体のルールを確認する。
    - name: ペット可の宿泊施設・ペットホテル
      short: ペット可のホテル
      emoji: "🏨"
      reason: 避難所より、ペットも飼い主も落ち着いて過ごせることがある。ただし、災害時は、予約が取りにくい。日ごろから、候補を探しておく。
    - name: ペット預かりのサービスや、動物病院・知人への一時預かり
      short: 一時預かり
      emoji: "🏥"
      reason: 飼い主が避難先で、ペットを連れられない場合の選択肢。災害時は、受け入れの余裕がなくなることも。早めに、依頼先を決めておく。
  B:
    - name: 自家用車での避難（車中泊）
      short: 車中泊
      emoji: "🚗"
      reason: ペットと一緒に過ごせる、柔軟な選択。ただし、夏や冬の車内は、温度の管理が難しく、熱中症や低体温症の危険がある。エコノミークラス症候群にも注意が必要。
    - name: テントでの避難
      short: テント避難
      emoji: "⛺"
      reason: 避難所の敷地内などでテントを張って、ペットと過ごす方法。温度や天候に左右されやすい。道具と場所の確保が必要。
    - name: ペット用の避難スペースが別にある避難所
      short: ペット専用スペース
      emoji: "🐾"
      reason: 飼い主の目が届かない場所に、ペットが預けられることもある。夜間の世話や、不安への対応も確認しておく。
    - name: 遠方の家族の家へ、ペットと一緒に移動する
      short: 遠方の家族宅
      emoji: "🚆"
      reason: 被害が大きい地域から離れて、落ち着いた環境で過ごせる。ただし、移動手段（車・電車）とキャリー、ペットの受け入れを、事前に確認しておく。
    - name: ほかの飼い主と協力して、世話をわけあう
      short: 飼い主どうしの協力
      emoji: "👥"
      reason: ペットが多い避難所では、飼い主どうしで、見回りや清掃を協力することが大切。助け合いが、全員のペットの安全につながる。
  C:
    - name: 屋外のつなぎ飼い・庭に放置
      short: 屋外のつなぎ飼い
      emoji: "⛓️"
      reason: 雨・風・暑さ・寒さ、余震による恐怖で、ペットの負担が大きい。やむをえない場合も、安全な環境を確保する。
    - name: 動物病院やトリミングサロンへの、急な預けこみ
      short: 急な預けこみ
      emoji: "📞"
      reason: 災害時は、病院も被災していたり、受け入れが難しかったりする。預け先は、前もって相談しておく。
    - name: 避難所の隅で、ケージに入れっぱなし
      short: ケージに入れっぱなし
      emoji: "📦"
      reason: 長時間ケージにいると、ストレスで体調をくずす。可能な範囲で、休憩や運動の時間を作る。
  D:
    - name: ペットを自宅に置いて、飼い主だけ避難する
      short: ペットを置いて避難
      emoji: "🚫"
      reason: ペットは、家で生き延びられない可能性が高い。環境省も、同行避難を基本としている。飼い主の責任として、一緒に避難する準備をしておく。
    - name: 避難先を決めずに、いきなり避難所に行く
      short: 事前確認なし
      emoji: "⚠️"
      reason: ペットの受け入れ状況は、避難所ごとに違う。事前に、自治体や避難所に確認しておくと、当日に慌てずに済む。
summary: |
  避難先のSは、「自宅が安全なら在宅避難」と「親戚・友人宅」。慣れた環境が、ペットにはいちばん落ち着く。
  避難所では、ペットと一緒の「同行避難」が基本だが、同じ部屋で過ごせるとは限らない。ペット同伴の避難先を、ふだんから複数考えておいて、自治体のルールも確認しておくのが、後悔しない備え。
related: [pet-bousai-goods, pet-bousai-shitsuke, pet-bousai-sumai]
