title: 巻物（寿司） Tier表
description: 鉄火巻き、かっぱ巻き、ねぎとろ巻き、かんぴょう巻き、納豆巻き、太巻き、サラダ巻き、カリフォルニアロール…寿司の巻物を、AIが「食べたい度×手軽さ×巻物らしさ」でランク付け。
category: food
genre: 寿司・海鮮
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「巻物ならこれ」と思える人気
  ② のり・酢飯・具のバランス
  ③ 手軽に食べられるか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 巻物の三大定番
  D: 寿司通が締めに頼む一本
tiers:
  S:
    - name: ねぎとろ巻き
      emoji: "🟣"
      reason: とろけるまぐろのたたきとねぎ。回転寿司でも人気の、巻物のスター。
    - name: 鉄火巻き
      emoji: "🔴"
      reason: まぐろの赤身を巻いたシンプルな細巻き。賭場で手軽に食べられたことが名前の由来ともいわれる。
    - name: 太巻き
      emoji: "🌈"
      reason: 卵焼き、かんぴょう、きゅうり、でんぶなど具だくさんの巻き寿司。断面の色どりが美しく、お祝いの席の定番。
  A:
    - name: サーモン巻き・サラダ巻き
      short: サラダ巻き
      emoji: "🥗"
      reason: かにかまやレタス、マヨネーズを巻いた現代の定番。子供にも人気。
    - name: かっぱ巻き
      emoji: "🥒"
      reason: きゅうりだけのさっぱりした細巻き。脂っこいネタの合間の口直しに最高。
    - name: 納豆巻き
      emoji: "🫘"
      reason: 納豆とのりの相性は抜群。好きな人にはたまらない、ねばねばの一本。
    - name: カリフォルニアロール
      emoji: "🥑"
      reason: アボカドとかにかまを巻き、酢飯を外側にした裏巻き。アメリカで生まれ、世界に寿司を広めた立役者。
    - name: 恵方巻き
      emoji: "👹"
      reason: 節分にその年の恵方を向いて、黙って丸かじりする太巻き。季節の行事として全国に広まった。
  B:
    - name: かんぴょう巻き
      emoji: "🟤"
      reason: 甘辛く煮たかんぴょうの細巻き。江戸前寿司の伝統の巻物で、寿司屋の締めの定番。
    - name: いなり寿司
      emoji: "🦊"
      reason: 巻物ではないが、巻物と並ぶ寿司の軽食の定番。甘い油揚げと酢飯でほっとする味。
    - name: 梅しそ巻き
      emoji: "🌿"
      reason: 梅干しとしその葉を巻いた、さっぱりした一本。食事の最後の口直しに。
    - name: たくあん巻き（おしんこ巻き）
      short: おしんこ巻き
      emoji: "🟨"
      reason: ポリポリ食感のたくあんを巻いた細巻き。シンプルだが、やみつきになる。
    - name: 玉子巻き
      emoji: "🥚"
      reason: 甘い玉子焼きを巻いた、子供にも人気の巻物。
  C:
    - name: 手巻き寿司
      emoji: "🌯"
      reason: 自分で好きな具を巻く、家族のパーティーの定番。巻物というより「楽しい食べ方」。
    - name: 海鮮太巻き
      emoji: "🐟"
      reason: まぐろ、いくら、えびなど海鮮をぎっしり巻いた豪華版。値段は高め。
  D:
    - name: 穴きゅう巻き
      emoji: "🐍"
      reason: 煮穴子ときゅうりを巻いた、穴子の甘いたれときゅうりの食感が合う通好みの一本。
    - name: しそ巻き（しそ・ごま）
      short: しそ巻き
      emoji: "🌱"
      reason: しそとごまだけのシンプルな細巻き。寿司通が最後に頼む、さっぱりした締めの一本。
summary: |
  巻物は、ねぎとろ巻き・鉄火巻き・太巻きがS。細巻きの手軽さも、太巻きの華やかさも、どちらも巻物の魅力。
  アメリカ生まれのカリフォルニアロールは、のりを内側に巻く工夫で、世界中に寿司を広めた。節分の恵方巻きのように、行事と結びついた巻物もある。
related: [food-sushi-neta, food-gunkan, food-kaisendon]
