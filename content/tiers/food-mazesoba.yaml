rank_notes:
  S: まぜそばの三大スター
  D: 通のカスタム
tiers:
  S:
  - name: 卵黄
    emoji: 🥚
    reason: とろっと混ぜると、まろやかさとコクが一気に加わる。まぜそばの主役。
  - name: ニンニク
    emoji: 🧄
    reason: パンチと香りで、食欲が止まらない。ただし、あとの予定には注意。
  - name: 追い飯
    emoji: 🍚
    reason: 最後に残ったタレにご飯を入れて、ひと混ぜ。至福の締め。
  A:
  - name: 魚粉
    emoji: 🐟
    reason: 魚介の香りとうまみがプラス。かけるだけで、味に深みが出る。
  - name: ラー油
    emoji: 🌶️
    reason: ピリ辛にして、味を引き締める。
  - name: 刻みネギ
    emoji: 🌱
    reason: 香りと食感のアクセント。たっぷりのせたい。
  - name: チャーシュー
    emoji: 🍥
    reason: ごろっとしたお肉が入ると、満足感が段違い。
  - name: 海苔
    emoji: 🟩
    reason: 磯の香りで、タレのうまみを引き立てる。
  B:
  - name: ニラ
    emoji: 🌿
    reason: スタミナ系の味に。ニンニクと一緒に。
  - name: チーズ
    emoji: 🧀
    reason: とろーり溶けて、こってり。まぜそばとの相性がいい。
  - name: 酢
    emoji: 🍶
    reason: 途中でたらすと、さっぱり味変。油っこさをやわらげる。
  - name: 大根おろし
    emoji: ⚪
    reason: さっぱりして、後半でも食べやすい。
  C:
  - name: マヨネーズ
    emoji: 🥄
    reason: まろやかになるけど、好みが分かれる。
  - name: ごま
    emoji: ⚪
    reason: 香ばしさが増す。少しだけで十分。
  D:
  - name: 山椒
    emoji: 🌿
    reason: しびれる香りで、大人の味に。
  - name: ブラックペッパー
    emoji: ⚫
    reason: ガツンとスパイシー。通のカスタム。
summary: 'まぜそばのトッピングは、卵黄・ニンニク・追い飯がS。タレとよく混ぜて、麺にからませるのが基本。

  最後に残ったタレに追い飯を入れて締めるのが、最高の食べ方。ニンニクは、食べたあとの予定に注意。

  '
