title: 英語リスニングの勉強法 Tier表
description: シャドーイング、ディクテーション、英語ニュース、洋画、リスニング問題集…英語リスニングの勉強法を、AIが「伸びやすさ×続けやすさ×手軽さ」でS〜Dにランク付け。
category: manabi
tags:
- 英語
- 勉強法
published: '2026-10-07'
labels:
  S: まず試したい
  A: 続けやすい
  B: 目的しだい
  C: 慣れてから
  D: おすすめしにくい
criteria: '① 聞き取り力の伸びやすさ

  ② 続けやすさ

  ③ 手軽さ（お金・準備）

  ※ 英検などの試験対策か、日常会話かで、向く方法は変わります。効果の出方には個人差があります'
rank_notes:
  S: 迷ったらこれ
  D: 続けにくい・効果が出にくい
tiers:
  S:
  - name: スクリプトを見ながら、繰り返し聞く
    emoji: 📖
    reason: 聞き取れなかった所が、何かを確認できる。いちばん確実な基本。
  - name: シャドーイング（聞こえた音をすぐ真似て言う）
    emoji: 🗣️
    reason: 発音とリスニングを同時に鍛えられる。短い音声から。
  A:
  - name: ディクテーション（聞いた英語を書き取る）
    emoji: ✍️
    reason: 聞き取れていない所が、はっきり分かる。時間がかかるので、短い文で。
  - name: 英検などの、リスニング問題集
    emoji: 📚
    reason: 試験の形式に慣れる。音声つきの教材を繰り返し。
  - name: 毎日10分、英語の音声を聞く
    emoji: ⏱️
    reason: 短くても、毎日続けるのが力になる。
  - name: 好きな動画・ドラマ（英語字幕）
    emoji: 🎬
    reason: 楽しく続けられる。字幕を使って、理解しながら。
  B:
  - name: 英語のポッドキャスト・ニュース（ゆっくり）
    emoji: 🎧
    reason: 通勤や家事の時間に。ゆっくり話す番組から。
  - name: 英語の歌を、歌詞を見ながら聞く
    emoji: 🎵
    reason: 楽しく、リズムも身につく。歌詞を確認して、意味も。
  - name: オンライン英会話
    emoji: 💻
    reason: 話す・聞くを同時に練習できる。続けるには、予約の習慣が必要。
  - name: スマホのリスニングアプリ
    emoji: 📱
    reason: すきま時間に使える。種類が多いので、続けられるものを。
  C:
  - name: 洋画（字幕なし）
    emoji: 🎞️
    reason: 慣れてきたら。最初は難しく、挫折しやすい。
  - name: ニュース（ネイティブ速度）
    emoji: 📺
    reason: 上級者向け。速くて、専門用語も多い。
  D:
  - name: 聞き流すだけ（BGMのように）
    emoji: 🚫
    reason: 理解しながら聞かないと、力がつきにくい。
  - name: 分からない所を、そのままにする
    emoji: ⚠️
    reason: 聞き取れない原因が分からず、伸びない。
  - name: 最初から、難しすぎる教材
    emoji: 🧗
    reason: 分からないことが多すぎて、続かない。
summary: 'リスニングは、「音を聞く」と「意味を理解する」の両方が必要。S級は、聞き取れない箇所を、スクリプトで確認しながら繰り返す、シャドーイングとディクテーション。

  毎日少しでも、英語の音に触れる時間を作ると、耳が慣れてくる。'
related:
- eigo-gakushu-hoho
- eiken3-benkyou
- eigo-ryoko-phrase
