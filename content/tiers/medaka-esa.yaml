title: メダカのえさの種類 Tier表
description: 人工飼料、稚魚用の粉、ミジンコ、青水、冷凍赤虫…メダカのえさを「食いつき・育ち・あげやすさ・水の汚れにくさ」でS〜Dにランク付け。
category: animals
tags: [メダカ, 動物, 初心者]
published: 2026-10-03
criteria: |
  ① メダカの食いつきと成長への役立ち
  ② あげやすさ・保存のしやすさ
  ③ 水が汚れにくいか（食べ残しの少なさ）
  ※ 特定の商品ではなく「種類」のランキングです。メダカは丈夫ですが、あげすぎは水の汚れや病気の原因になります
rank_notes:
  S: まずはこれを用意
  D: メダカにはおすすめしにくい
tiers:
  S:
    - name: メダカ用の人工飼料（粒タイプ）
      short: 人工飼料（粒）
      emoji: "🟤"
      reason: 栄養バランスが考えられていて、あげやすく、保存もしやすい。成魚のメインのえさとして定番。浮くタイプは食べ残しが見えて、あげすぎを防ぎやすい。
    - name: 稚魚用の粉末飼料
      short: 稚魚用の粉
      emoji: "🌫️"
      reason: 口の小さい稚魚でも食べられる、細かい粉状のえさ。稚魚の成長を支える大切な存在。食べ残しが出やすいので、少量ずつ。
  A:
    - name: 青水（植物プランクトン）
      emoji: "🟢"
      reason: 緑色に見える水の中のプランクトンは、稚魚の天然のえさになる。屋外の容器で日光が当たると自然にできる。水質が安定しやすい利点もある。
    - name: ミジンコ（生き餌）
      emoji: "🦐"
      reason: 動くものに反応するメダカにとって、ごちそう。稚魚や産卵前の親魚のコンディションを上げたいときに役立つ。培養には手間がかかる。
    - name: 繁殖・色揚げ用の栄養強化飼料
      short: 色揚げ飼料
      emoji: "🌈"
      reason: 色を濃く出したいときや、繁殖期のコンディション作りに使う。ふだんは普通の人工飼料で足り、特別な日用に取りいれるイメージ。
    - name: ゾウリムシ（稚魚の最初の餌）
      short: ゾウリムシ
      emoji: "🔬"
      reason: 生まれたての稚魚が食べやすい、小さな生き物。培養に手間はかかるが、稚魚を多く育てたい人にはありがたい。
  B:
    - name: 冷凍赤虫・乾燥赤虫
      short: 赤虫
      emoji: "🪱"
      reason: 食いつきがよく、メダカが喜ぶ。ただし、あげすぎると水が汚れやすく、栄養が偏る。ときどきのごちそうにする。
    - name: ブラインシュリンプ（孵化させて与える）
      short: ブライン
      emoji: "🦐"
      reason: 稚魚の成長に役立つ生き餌。孵化させる手間はかかるが、育ちがよくなる。
    - name: 水草やコケにつくバクテリア・微生物
      short: 水草の微生物
      emoji: "🌿"
      reason: メダカは水草や石の表面の微生物もついばむ。自然のえさとして、補助になる。
    - name: 自動給餌器でのえさやり
      short: 自動給餌器
      emoji: "⚙️"
      reason: 旅行や留守のときに便利。ただし、えさの量の調整を間違えると、水が汚れる。長期の留守は、慣らしてから使う。
    - name: 冷凍のミジンコ・ワムシ
      short: 冷凍ミジンコ
      emoji: "🧊"
      reason: 生き餌の手間なしで、食いつきのよいごちそうを用意できる。冷凍保存でき、少しずつ使える。
  C:
    - name: ゆで卵の黄身（稚魚用）
      short: ゆで卵の黄身
      emoji: "🥚"
      reason: 緊急時の稚魚のえさとして使われることがある。ただし、水が汚れやすいので、ごく少量にして、すぐに食べきれる分だけ。
    - name: 熱帯魚用・金魚用のえさ
      short: 他の魚のえさ
      emoji: "🐠"
      reason: 口に合えば食べるが、粒が大きすぎたり、栄養が違ったりする。砕いて、あげられないこともないが、メダカ用のほうが安心。
    - name: パンくずやごはん粒
      short: パン・ごはん
      emoji: "🍞"
      reason: 食べるが、水が一気に汚れて、水質が悪化する。食べ残しは、病気の原因にもなる。
  D:
    - name: 人間の食べもの（お菓子・肉・味つけ食品）
      short: 人間の食べもの
      emoji: "🍪"
      reason: 塩分や油分、添加物が水を汚し、メダカの体にも悪影響。かわいくても、あげないこと。
    - name: 食べ残しが出るほどのえさやり
      short: あげすぎ
      emoji: "⚠️"
      reason: えさの種類ではなく、量の問題。食べ残しは水を汚し、メダカを弱らせる。数分で食べきれる量を目安にする。
summary: |
  成魚はメダカ用の人工飼料、稚魚は粉末飼料。この2つで、基本のえさやりはほぼ足りる。
  メダカは水が汚れると弱りやすいので、「少なめに、食べきれる分だけ」が鉄則。生き餌や色揚げ飼料は、特別なごちそうとして、様子を見ながら使うのがおすすめ。
related: [medaka-goods, medaka-shippai, medaka-shurui]
