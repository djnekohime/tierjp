title: ゆずの使い方・おいしい食べ方 Tier表
description: ゆず湯、ゆず茶、ぽん酢、ゆず胡椒、皮を薬味に…香りが立つ冬のゆずの使い方を、ゾーマが「香りの活き方×手軽さ×使い回しやすさ」でS〜Dにランク付け。
category: food
genre: 野菜・果物
tags:
- グルメ
published: '2026-11-08'
labels:
  S: 迷ったらこれ
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 香りが活きるか

  ② 手軽さ

  ③ 使い回しやすさ（余らせにくいか）

  ※ ゆずは皮に香りが集まります。皮を使うときは、よく洗い、気になる人は無農薬や国産のものを選んでください。薬を飲んでいる人は、柑橘の食べ合わせを確認しましょう'
rank_notes:
  S: 迷ったらここから
  D: 避けたい
tiers:
  S:
  - name: 鍋のぽん酢
    emoji: 🍲
    reason: ゆずの酸味と香りが、鍋の具をさっぱり引き立てる。冬のゆずの代表的な使い方。
  - name: 薬味の皮（そば・うどん・お吸い物）
    emoji: 🍜
    reason: 少し浮かべるだけで、香りが立って料理が上品に。使う量が少ないので、余らせにくい。
  - name: ゆず湯
    emoji: 🛁
    reason: 丸ごと浮かべるだけで、香りがふわっと広がる。冬至に楽しむ人が多く、体も気持ちもほぐれる。
  A:
  - name: ゆず茶・はちみつ漬け
    emoji: 🍯
    reason: お湯で割るだけの手軽さ。作り置きできて、寒い日の1杯にぴったり。
  - name: ゆず胡椒
    emoji: 🌶
    reason: 少量で料理が引き締まる。鍋・刺身・焼き鳥・うどんなど、使える場面が広い。
  - name: 柚子味噌（ふろふき大根など）
    emoji: 🥣
    reason: 味噌と合わせると、冬の定番の味に。ふろふき大根にのせると絶品。
  - name: ゆずの酢の物・なます
    emoji: 🥕
    reason: 大根やにんじんのなますに足すと、一気に華やかになる。おせちの準備にも便利。
  - name: ドレッシング（ゆず＋オイル＋塩）
    emoji: 🥗
    reason: サラダや刺身のカルパッチョにも使える。分量は適当でも失敗しにくい。
  B:
  - name: ゆずジャム・マーマレード
    emoji: 🍞
    reason: パンやヨーグルトに。作るときは時間がかかるが、保存がきく。
  - name: ゆずの砂糖漬け（皮）
    emoji: 🍬
    reason: お茶うけや、お菓子の材料にもなる。手間はかかるが、できあがりは宝石のよう。
  - name: 焼き魚に果汁をしぼる
    emoji: 🐟
    reason: レモンの代わりに。香りがよく、サンマやぶりと相性がよい。
  - name: ゆず入りの炊き込みご飯・混ぜご飯
    emoji: 🍚
    reason: 皮をのせると香りが立つ。炊く前に入れると、香りが飛びやすい。
  - name: ゆずのシャーベット・ゼリー
    emoji: 🍧
    reason: さっぱりした冬のデザート。作り方は簡単だが、冷やす時間が必要。
  C:
  - name: ゆずのお酒（ゆず酒・サワー）
    emoji: 🍶
    reason: 香りが楽しめるが、お酒は飲める人向け。飲みすぎには注意。
  - name: 丸ごとのゆずを、そのまま生で食べる
    emoji: 😖
    reason: 酸味が強く、種も多い。おいしいと感じる人は少ない。
  - name: ゆず皮を乾燥させて、自家製の粉にする
    emoji: 🌿
    reason: 保存がきくが、手間と時間がかかる。香りは新鮮なものより弱い。
  D:
  - name: 皮のワタ（白い部分）ごと使う
    emoji: 🙅
    reason: 苦みが強く出てしまい、料理が台無しになりやすい。
  - name: 大量に買って、使い切れず傷ませる
    emoji: 📉
    reason: 1個ずつでも使い道は多いが、保存しないと傷みやすい。冷凍を活用する。
summary: 'ゆずは、秋の終わりから冬にかけて出回る、香りの主役。果汁はすっぱく、そのまま食べるより、香りと酸味を「ひとさじ足す」使い方が合っている。S級は、鍋のぽん酢、薬味の皮、ゆず湯。どれも少しで気分もお料理もきりっと締まり、冬の楽しみが一段増える。

  A級は、ゆず茶やはちみつ漬け、ゆず胡椒など。作り置きしておくと、寒い日にお湯で割るだけで体が温まる。ゆず湯は食べ物ではないけれど、冬至の習慣として親しまれ、香りでほっとする。

  コツは4つ。①皮は白いワタの部分が苦いので、黄色いところだけ薄くむく。②果汁は小分けで冷凍すると、1個を使い切りやすい。③皮も冷凍できるので、細く切って保存袋へ。④ゆず胡椒や柚子味噌は、冷蔵庫で長持ちする。

  ゆずは1個でもたくさんの使い道がある。今夜の鍋に、皮をひとかけら浮かべるところから始めてみてね。最初は難しく考えず、「香りを足す」だけで十分。

  皮の黄色い部分を、細く切って乾燥させれば、冬じゅう使える自家製の薬味になる。種を使った手作りの化粧水などは、肌が弱い人は避けたほうが安心。体質は人それぞれなので、気になる症状が出たら使うのをやめて、必要なら専門家に相談してね。

  ゆずは、気温が下がるほど香りが濃くなると言われる。スーパーで買うときは、皮にハリがあって、手に持ったときに重みのあるものを選ぶと、果汁も香りもたっぷり。冷凍するときは、皮と果汁を分けて、使う分ずつ小分けにしておくと、あとがとても楽。

  年末にかけては、お雑煮やなます、鍋と、ゆずの出番が増える季節。1個を、1か月かけて少しずつ使い切るつもりで、のんびり付き合うのが、いちばんおいしく味わえるコツ。'
