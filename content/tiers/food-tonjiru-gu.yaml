title: 豚汁の具 Tier表
description: 豚肉、大根、ごぼう、里芋、にんじん、こんにゃく…体が温まる豚汁の具を、ゾーマが「おいしさ×ほっこり度×作りやすさ」でS〜Dにランク付け。
category: food
genre: 鍋・季節の食べ物
tags:
- グルメ
- 冬
published: '2026-11-11'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 豚汁に入れたときのおいしさ

  ② ほっこり度（体が温まる・満足感）

  ③ 作りやすさ（切る手間・手に入りやすさ）

  ※ 地域や家庭で定番は違います。味噌の種類や、ごま油で炒めるかどうかでも味は変わります'
rank_notes:
  S: 迷ったらこれ
  D: 好みが分かれる・変わり種
tiers:
  S:
  - name: 豚肉（バラ・こま切れ）
    emoji: 🥩
    reason: 旨みと脂が味噌に溶け出し、豚汁の主役になる。入れると一気にコクが出る。
  - name: 大根
    emoji: ⚪
    reason: やわらかく煮えて、だしを吸う。甘みも出て、冬の定番中の定番。
  - name: にんじん
    emoji: 🥕
    reason: 彩りがよく、ほのかな甘みが加わる。具だくさんの豚汁の基本。
  - name: ごぼう
    emoji: 🌿
    reason: 香りと歯ごたえが、豚汁らしさを作る。ささがきにすると、火が通りやすい。
  A:
  - name: 里芋
    emoji: 🟤
    reason: ねっとりした食感で、とろみもつく。入れるとほくほくのごちそうに。
  - name: こんにゃく
    emoji: ⬜
    reason: 歯ごたえのアクセント。ヘルシーで、手でちぎると味がしみやすい。
  - name: ねぎ
    emoji: 🌱
    reason: 仕上げの香りと彩りに。少量でも、全体が引き締まる。
  - name: 油揚げ
    emoji: 🟫
    reason: コクが出て、だしを含んでじゅわっとする。
  - name: 豆腐
    emoji: ⬜
    reason: やさしい口当たりで、全体をまとめる。
  B:
  - name: じゃがいも
    emoji: 🥔
    reason: ほくほくで、お腹にたまる。煮崩れしやすいので、大きめに切る。
  - name: さつまいも
    emoji: 🍠
    reason: 甘みが加わり、味噌との相性が意外によい。好みは分かれる。
  - name: しいたけ・きのこ類
    emoji: 🍄
    reason: 旨みが加わり、香りも立つ。数種類入れるとさらによい。
  - name: 白菜
    emoji: 🥬
    reason: やわらかく煮えて、甘みが出る。水分が多いので、味噌は多めに。
  - name: 長ねぎ（太め）
    emoji: 🧅
    reason: 火を通すと、とろっと甘くなる。
  C:
  - name: かぼちゃ
    emoji: 🎃
    reason: 甘みが強く、好みが分かれる。ほくほくが好きな人向け。
  - name: もやし
    emoji: 🥬
    reason: シャキシャキ食感を残したい人向け。煮すぎ注意。
  - name: ほうれん草・小松菜
    emoji: 🥬
