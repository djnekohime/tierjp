    emoji: 🍅
    reason: 洋風になり、意外に合うが、豚汁らしさからは離れる。
  - name: チーズ
    emoji: 🧀
    reason: アレンジ系。コクが出るが、好き嫌いがはっきり分かれる。
  - name: ごま油を入れすぎる
    emoji: 🫗
    reason: 少しなら香りがよいが、多いと油っぽくなり、味噌の風味を覆ってしまう。
summary: '豚汁は、具だくさんにできるのが最大の魅力。肉と野菜をたっぷり入れれば、これ1杯でおかずになる。寒い日の夕食や、忙しい日の味方でもある。


  S級は、豚肉・大根・にんじん・ごぼうの4つ。豚肉の旨みと脂が味噌に溶け、根菜の甘みが加わって、深い味わいになる。ごぼうは香りが強く、入れるだけで「ほっとする豚汁らしさ」が出る。里芋やこんにゃくは、食感のアクセントとして、あると嬉しい名脇役だ。


  作るときのコツは、最初に豚肉と根菜を、ごま油で軽く炒めること。香りとコクが加わり、味がぐっと深くなる。そのあとにだしを加えて煮込み、野菜がやわらかくなったら、火を弱めて味噌を溶く。味噌を入れたあとは、ぐらぐら煮立てないほうが、香りが飛びにくい。


  余った豚汁は、翌日の方が味がしみておいしいこともある。ただし、温め直しは、しっかり火を通して、冷蔵庫で保存したものは早めに食べきろう。冬の定番として、自分なりの「黄金の組み合わせ」を探してみるのも楽しい。

  味噌は、1種類だけでなく、合わせ味噌にすると、風味が複雑になっておいしい。甘めの白味噌と、コクのある赤味噌をブレンドする人も多い。仕上げに、七味や柚子の皮、すりおろしたしょうがを少し加えると、香りがよくなり、体もぽかぽかする。残った豚汁は、うどんやご飯に合わせても、立派な一食になる。寒い日の夕食に、ぜひ。作りおきするときは、粗熱をとってから冷蔵庫に入れて、2〜3日以内に食べきるのが目安。'
