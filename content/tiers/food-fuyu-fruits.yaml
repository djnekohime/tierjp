    reason: こたつとみかん。皮をむく幸せ。冬の定番。
  - name: いちご
    emoji: 🍓
    reason: 冬から春の、甘酸っぱい味。
  - name: りんご
    emoji: 🍎
    reason: シャキッとして、甘い。皮をむかずに、丸かじりも。
  A:
  - name: 柿
    emoji: 🟠
    reason: 秋から冬の味。とろっと甘い。
  - name: デコポン
    emoji: 🍊
    reason: みかんより大きくて、甘い。
  - name: ぽんかん
    emoji: 🟠
    reason: 香りがよくて、さっぱり甘い。
  - name: 洋梨
    emoji: 🍐
    reason: とろっとやわらかい、上品な甘さ。
  - name: キウイ
    emoji: 🥝
    reason: ビタミンたっぷり。さっぱり酸っぱい。
  B:
  - name: ゆず
    emoji: 🟡
    reason: 果肉というより、香りを楽しむ。お風呂にも。
  - name: 金柑
    emoji: 🟧
    reason: 皮ごと食べられる、小さな果物。
  - name: レモン
    emoji: 🍋
    reason: お料理やお茶に。ビタミンC。
  - name: グレープフルーツ
    emoji: 🍊
    reason: ほろ苦くて、さっぱり。
  C:
  - name: ネーブルオレンジ
    emoji: 🍊
    reason: 甘くてジューシー。ビタミンもたっぷり。
  - name: バナナ
    emoji: 🍌
    reason: 一年中あるけど、冬は特に朝ごはんに。
  D:
  - name: いよかん
    emoji: 🟠
    reason: 愛媛の名産。上品な甘み。
  - name: はっさく
    emoji: 🍊
    reason: ほろ苦くて、シャキシャキの食感。通好み。
summary: '冬の果物は、みかん・いちご・りんごがS。こたつでみかんを食べるのは、冬の幸せの代表。

  デコポンやぽんかんのような、あまくて香りのよい柑橘も、冬の楽しみ。

  '
