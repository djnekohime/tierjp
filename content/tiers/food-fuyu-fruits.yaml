title: 冬の果物 Tier表
description: みかん、いちご、りんご、柿、洋梨、キウイ、ぽんかん、デコポン、ゆず、金柑、レモン…冬の果物を、AIが「甘さ×こたつで食べたい度」でランク付け。
category: food
genre: 野菜・果物
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 甘さ・おいしさ

  ② こたつで食べたくなるか

  ③ 冬らしさ

  ※ 品種や産地によって、味はちがいます

  '
rank_notes:
  S: 冬の果物の三大スター
  D: 通好み
tiers:
