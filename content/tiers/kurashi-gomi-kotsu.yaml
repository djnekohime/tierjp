  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① ラクさ

  ② 清潔さ

  ③ 続けやすさ

  ※ ゴミの分別ルールや収集日は、自治体によって異なります。必ずお住まいの自治体の案内に従ってください'
rank_notes:
  S: ぜひ実践
