summary: 'ゴミ出しは、毎日の小さなストレス。分別が面倒、収集日を忘れる、臭いが気になる、と悩みが多い。

  S級は、分別用の置き場所を最初から決めておくこと。ゴミ箱の置き場所と種類が決まっていれば、迷う時間が減る。

  水分をしっかり切ることは、臭いとかさを減らす基本。生ごみは、水を切ってから捨てるだけで、夏でもにおいが大幅に減る。

  収集日を、カレンダーやスマホのリマインダーに登録しておくと、うっかり忘れを防げる。家族で共有するのもおすすめ。

  分別ルールは、自治体ごとに違うので、迷ったら自治体のホームページや分別アプリで確認しよう。誤った出し方をすると、回収してもらえないこともある。

  危険なもの（スプレー缶、電池、刃物、ライターなど）は、自治体の指示に従って出すこと。ふくらんだ充電池や電池などは、火災の原因になることがあるので、特に注意。

  ゴミ出しは、完璧を目指さず「迷わない仕組み」をつくるのがコツ。仕組みができれば、毎日ラクになる。

  引っ越しや模様替えのタイミングで、ゴミ箱の位置を見直すのもおすすめ。動線に合わせて置くだけで、ゴミ出しがぐっとラクになる。収集日の前日に、家じゅうのゴミ箱をまとめて見回る習慣をつけると、出し忘れも減る。

  ランクはあくまで目安。自分や家族の暮らしに合わせて、ぴったりの組み合わせを見つけてほしい。みんなのTier表と並べて、違いを楽しむのもおすすめ。やってみて合わなければ、気軽に変えていけばOK。'
