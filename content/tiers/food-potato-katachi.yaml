title: フライドポテトの形 Tier表
description: 細切り、皮付きくし切り、ギザギザ、太切り、格子型、ハッシュポテト、渦巻き、極細…フライドポテトの形を、AIが「食感×塩・ソースとの相性×手が止まらない度」でランク付け。
category: food
genre: ファストフード・外食
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 食感（カリッと・ホクッと）

  ② 塩やケチャップとの相性

  ③ 手が止まらない度

  ※ 特定の商品ではなく「形の種類」のランキングです

  '
rank_notes:
  S: ポテトの三大定番
  D: わかる人にはわかる
tiers:
  S:
  - name: 細切りストレート
    short: 細切り
    emoji: 🍟
    reason: ファストフード店の定番。外はカリッと、中はホクッと。揚げたては無敵。
  - name: 皮付きくし切り
    short: くし切り
    emoji: 🥔
    reason: じゃがいもらしさが一番わかる形。ホクホク感がたまらない。
  - name: ギザギザ
    emoji: 〰️
    reason: 波打った形で、カリカリした面が多い。ケチャップもよくからむ。
  A:
  - name: 太切り（ステーキフライ）
    short: 太切り
    emoji: 🟨
    reason: 分厚くて、中のホクホク感が主役。食べごたえあり。
  - name: 格子型（ワッフル）
    short: 格子型
    emoji: '#️⃣'
    reason: 網目の形で、カリカリとホクホクのいいとこどり。
  - name: ハッシュポテト
    emoji: 🟫
    reason: 細かく刻んで固めて揚げたもの。朝ごはんのお供。
  - name: 渦巻き（カーリー）
    short: 渦巻き
    emoji: 🌀
    reason: くるくるの形が楽しい。スパイシーな味つけが多い。
  B:
  - name: 極細（シューストリング）
    short: 極細
    emoji: 🧵
    reason: とても細くて、全部カリカリ。スナック感覚で食べられる。
  - name: 皮付き細切り
    emoji: 🍂
    reason: 皮の香ばしさがアクセント。
  - name: 角切り（コロコロ）
    emoji: 🎲
    reason: ひと口サイズで食べやすい。
  - name: 顔の形のポテト
    short: 顔型
    emoji: 😊
    reason: 子供が喜ぶ、にっこり顔のポテト。冷凍食品の人気者。
  C:
  - name: トルネードポテト
    emoji: 🌪️
    reason: 1個のじゃがいもを、らせん状に切って串に刺したもの。お祭りや屋台で。
  - name: 星型・ハート型
    short: 星型
    emoji: ⭐
    reason: 見た目はかわいい。味はふつう。
  D:
  - name: 底に残ったカリカリの切れ端
    short: カリカリ切れ端
    emoji: ✨
    reason: 袋の底に残る、短くてカリカリの切れ端。これが一番好きという人は多い。
  - name: ロングポテト
    emoji: 📏
    reason: 30cmくらいある、とても長いポテト。屋台やイベントで人気。
summary: 'フライドポテトは、細切り・皮付きくし切り・ギザギザがS。細いほどカリカリ、太いほどホクホク。

  袋の底に残る短いカリカリの切れ端を、最後のお楽しみにしている人も多い。

  '
related:
- food-potato-sauce
- food-burger
- food-hot-snack
