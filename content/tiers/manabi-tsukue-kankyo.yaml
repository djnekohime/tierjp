title: 勉強・作業がはかどる机まわりの整え方 Tier表
description: スマホは別の場所、机の上は今やるものだけ、照明、タイマー…勉強や作業がはかどる机まわりの整え方を、ゾーマが「集中しやすさ×手軽さ×続けやすさ」でS〜Dにランク付け。
category: manabi
tags:
- 初心者
- あるある
published: '2026-11-12'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 集中しやすさ

  ② 手軽さ

  ③ 続けやすさ

  ※ 目や肩・腰に痛みが続くときは、無理せず、医療機関に相談してください。専門家の助言ではなく目安です'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: スマホを、手の届かない場所に置く
    emoji: 📵
    reason: 通知や誘惑が見えなくなり、集中が途切れにくい。
  - name: 机の上を、今やるものだけにする
    emoji: 🧹
    reason: 視界がすっきりして、頭も整理される。
  - name: 始める前に、今日やることを1行で書く
    emoji: 📝
    reason: 何をやるかが明確になり、迷う時間が減る。
  A:
  - name: 手元を、明るくする
    emoji: 💡
    reason: 暗いと目が疲れて、集中が続かない。
  - name: 足の裏が床につく高さで座る
    emoji: 🪑
    reason: 姿勢が安定して、肩こりや腰の疲れが減る。
  - name: タイマーで、25分やって5分休む
    emoji: ⏲️
    reason: 区切りがあると、始めやすく、続けやすい。
  - name: 水やお茶を、手の届く所に置く
    emoji: 🍵
    reason: 立ち上がる回数が減り、集中が途切れにくい。
  - name: 終わったら、机の上を元に戻す
    emoji: 🔄
    reason: 次に始めるときの、ハードルが下がる。
  B:
  - name: BGMは、歌詞のないものを選ぶ
    emoji: 🎧
    reason: 歌詞があると、頭がそちらに引っ張られやすい。
  - name: ノートパソコンを、目線の高さに近づける
    emoji: 💻
    reason: 首や肩への負担が減る。スタンドや本で代用できる。
  - name: 文房具は、ペン立て1つにまとめる
    emoji: ✏️
    reason: 探し物の時間がなくなる。
  - name: ひざ掛けや、足元のあったかグッズを使う
    emoji: 🧦
    reason: 冬は、寒さが、集中を妨げる原因に。
  - name: 時計を、見える場所に置く
    emoji: 🕐
    reason: 時間感覚がつかみやすい。
  C:
  - name: 勉強用の、専用スペースを作る
    emoji: 🪟
    reason: 効果はあるが、場所が限られる家では難しい。
  - name: 机や椅子を、新しく買い換える
    emoji: 🛒
    reason: 快適になるが、費用がかかる。まずは今の環境の見直しから。
  - name: ごほうびを、先に用意しておく
    emoji: 🍫
    reason: やる気は出るが、食べすぎには注意。
  - name: 図書館やカフェに、場所を変える
    emoji: ☕
    reason: 気分は変わるが、移動の手間と費用がかかる。
  D:
  - name: ベッドやソファで、寝転んでやる
    emoji: 🛋️
    reason: 姿勢が崩れて、眠くなりやすい。
  - name: スマホを、机の上に置いたままにする
    emoji: 📱
    reason: 通知が気になって、集中が何度も途切れる。
  - name: 机の上に、物が山積みの状態で始める
    emoji: 🗑️
    reason: 探し物から始まって、やる気が削られる。
  - name: 完璧な環境が整うまで、始めない
    emoji: 🎯
    reason: 整えるだけで疲れて、肝心の勉強が進まない。
summary: '勉強や作業が進まない原因は、意志の弱さよりも、「机のまわりの環境」にあることが多い。だから、環境を少し整えるだけで、がんばらなくても進みやすくなる。

  S級は、スマホを別の場所に置くこと、机の上を「今やるものだけ」にすること。目の前に誘惑や、他の用事が見えなければ、頭は、目の前の1つに集中しやすい。

  次に大事なのは、照明と姿勢。暗い部屋で、うつむいたまま長時間やると、目も肩もすぐに疲れてしまう。手元を明るくして、足の裏が床につく高さで座る。それだけで、疲れ方がずいぶん変わる。

  タイマーを使って、25分やって5分休むような区切りも、続けやすい方法のひとつ。完璧な机を作ろうとして、グッズを買い込むのは、かえって逆効果。

  まずは今日、机の上にあるものを、いったん全部どかして、今から使うものだけを置き直してみて。10分もかからないし、ここから始めれば、勉強も作業も、はじめの一歩が軽くなる。環境は、1回で完璧にしなくていい。気づいたときに、少しずつ整えていこう。

  机まわりを整えるとき、よくある失敗は「理想の書斎」を目指しすぎること。おしゃれな文房具や、大きな机をそろえても、使いこなせなければ意味がない。まずは、今ある机と道具で、できる工夫から。スマホを別の部屋に置く、机の上を片づける、タイマーをかける。この3つだけでも、はっきり違いが出る。家族と同じ部屋で勉強する人は、イヤホンやパーテーションで、自分の「ひとりの空間」を作るのも、ひとつの手だ。続けるうちに、自分に合った環境が、少しずつ見つかっていく。'
