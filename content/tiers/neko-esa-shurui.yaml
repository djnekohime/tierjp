title: 猫のごはんの種類 Tier表
description: ドライ、ウェット、総合栄養食、療法食、手作りごはん…猫のごはんを、栄養・続けやすさ・安全性でS〜Dにランク付け。
category: animals
tags:
- 猫
- 動物
- 初心者
published: '2026-10-06'
criteria: '① 毎日それだけで必要な栄養をとれるか

  ② 続けやすさ（手間・入手のしやすさ）

  ③ 安全性

  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。動物の種類・年齢・体質・量で影響は変わります。心配なときは、様子を見すぎず、動物病院に相談してください。持病や体質にあわせたごはんは、必ず獣医さんと相談して決めてください'
rank_notes:
  S: 迷ったらまずここ
  D: ふだんの主食にはおすすめしにくい
tiers:
  S:
  - name: 総合栄養食のドライフード
    short: ドライフード
    emoji: 🥣
    reason: 水とそのフードだけで、必要な栄養がとれるように作られている。保存しやすく、置いておいても傷みにくい。かたさや粒の大きさも選べる。
  - name: 総合栄養食のウェットフード（パウチ・缶）
    short: ウェットフード
    emoji: 🥫
    reason: 水分をとりやすく、においや味に好き嫌いがある猫でも食べやすい。開けたあとは傷みやすいので、食べ残しは早めに片づける。
  A:
  - name: ドライとウェットの併用
    short: 併用
    emoji: 🍽️
    reason: ドライの手軽さと、ウェットの水分を両方とれる。1日の量を決めて、あげすぎないことが大切。
  - name: 子猫用（キトン）フード
    short: 子猫用
    emoji: 🍼
    reason: 成長に必要なエネルギーや栄養が多く入っている。子猫の時期は、成猫用ではなく、子猫用を。
  - name: シニア猫用フード
    short: シニア用
    emoji: 👵
    reason: 年齢にあわせて、消化しやすさやエネルギー量が考えられている。7歳ごろから、切りかえを考える目安になる。
  - name: 獣医師が指示する療法食
    short: 療法食
    emoji: 🩺
    reason: 腎臓や尿路、アレルギーなど、病気や体質にあわせて作られたフード。自己判断で与えず、獣医さんの指示で。
  B:
  - name: 一般食・副食（おかず缶）
    short: おかず缶
    emoji: 🐟
    reason: おいしくて食欲が出やすいが、栄養が足りないものが多い。主食ではなく、トッピングやごほうびとして使う。
  - name: グレインフリー（穀物不使用）フード
    short: グレインフリー
    emoji: 🌾
    reason: 「穀物が入っていないから良い」とは限らない。猫の体に必要な栄養がとれるかを、表示で確認してから選ぶ。
  - name: 毛玉ケア・室内猫用のフード
    short: 毛玉ケア用
    emoji: 🧶
    reason: 毛づくろいで毛を飲みこみやすい猫に向けた設計のもの。総合栄養食であれば、選択肢のひとつになる。
  - name: ペースト状のおやつ（ちゅ〜るなど）
    short: ペーストおやつ
    emoji: 🍥
    reason: 食いつきがよく、薬を飲ませるときにも便利。ただし、おやつなので、あげすぎると主食を食べなくなる。1日の量を決めて。
  C:
  - name: 手作りごはん
    short: 手作りごはん
    emoji: 🍳
    reason: 猫に必要な栄養を、毎日そろえるのがとても難しい。始めるなら、獣医さんなどに、レシピを相談しながらが安心。
  - name: 生肉・生食（BARFなど）
    short: 生食
    emoji: 🥩
    reason: 食中毒や、栄養の偏りの心配がある。人にも菌がうつるおそれがあるので、衛生管理がとても大切。
  - name: 人間用のツナ缶
    short: ツナ缶
    emoji: 🥫
    reason: 塩分や油分、栄養の偏りが心配。主食にはせず、ごく少量のごほうびまで。
  D:
  - name: 犬用フード
    short: 犬用フード
    emoji: 🐕
    reason: 犬と猫では必要な栄養が違い、犬用だけを食べ続けると、栄養が足りなくなる。
  - name: 人間の食事の残り
    short: 人間の食事
    emoji: 🍚
    reason: 塩分・油分が多く、ネギ類など、猫に危険なものが含まれていることも。ねだられても、分けないのが安全。
  - name: 牛乳（人間用）
    short: 牛乳
    emoji: 🥛
    reason: 乳糖を分解しにくく、お腹をこわす猫が多い。ミルクをあげるなら猫用を。
summary: '迷ったら、まずパッケージに「総合栄養食」と書かれたフードが基本。ドライは手軽で保存しやすく、ウェットは水分をとりやすい。猫の年齢や体質で、必要なものは変わる。

  手作りや生食は、栄養のバランスをとるのがとても難しく、事故のもとにもなりやすい。始めるなら、獣医さんに相談しながらが安全。ごはんを変えるときは、1〜2週間かけて少しずつ切りかえると、お腹の負担が少ない。'
related:
