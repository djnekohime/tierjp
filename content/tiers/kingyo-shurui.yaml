title: 金魚の品種 Tier表
description: 和金、琉金、出目金、オランダ獅子頭、ランチュウ、ピンポンパール…人気の金魚の品種を「飼いやすさ・見た目の個性・手に入れやすさ」でS〜Dにランク付け。
category: animals
tags: [金魚, 動物, 初心者]
published: 2026-10-03
labels:
  S: 迷ったらこれ
  A: 人気で飼いやすい
  B: 見た目で選ぶ
  C: ちょっと上級
  D: 通好みのこだわり
criteria: |
  ① 飼いやすさ（丈夫さ・水質や水温への強さ）
  ② 見た目の華やかさ・個性
  ③ 手に入れやすさ・値段
  ※ 金魚は品種によって体の形が大きく違い、泳ぎや丈夫さも変わります。金魚は大きく育つので、成長後の大きさも考えて選んでください
rank_notes:
  S: 初めての金魚におすすめ
  D: 好きな人がとことん楽しむ領域
tiers:
  S:
    - name: 和金
      emoji: "🟠"
      reason: フナに近い体型で、とても丈夫な定番の金魚。金魚すくいでもおなじみで、体も大きく育つ。泳ぎが速いので、広い水槽が向く。
    - name: 琉金
      emoji: "🔴"
      reason: 丸い体と、ひらひらしたしっぽが優雅で人気。丈夫で、飼いやすい品種のひとつ。水温の変化には、気をつけたい。
    - name: 出目金
      emoji: "👀"
      reason: 左右に飛び出した目が特徴で、愛嬌のある人気者。丈夫だが、目を傷つけやすいので、とがった物は水槽に入れない。
  A:
    - name: コメット
      emoji: "☄️"
      reason: 長くてなびく尾びれが特徴の、スマートな金魚。丈夫で、泳ぎも活発。大きくなるので、広い水槽か、池での飼育が向く。
    - name: 朱文金
      emoji: "🎨"
      reason: 赤・白・黒などが混ざった、華やかな柄の金魚。丈夫で、泳ぎも速い。広い水槽や、池が向く。
    - name: オランダ獅子頭
      short: オランダ獅子頭
      emoji: "🦁"
      reason: 頭にこぶ状の盛り上がりが育つ、迫力のある金魚。丸い体がかわいらしい。泳ぎがゆっくりなので、ほかの金魚との混泳には気をつける。
    - name: ピンポンパール
      emoji: "🏓"
      reason: ピンポン玉のように丸い体が愛らしい、人気の金魚。泳ぎはゆっくりで、おだやか。水質の変化に敏感なので、きれいな水を保つ。
    - name: 東錦
      emoji: "🌸"
      reason: 赤・白・黒の「三色」が混ざった、錦鯉のような色合いが人気。体がしっかりしていて、飼いやすい。
  B:
    - name: 黒出目金
      emoji: "⚫"
      reason: 黒い体がつやつやと美しい出目金。ほかの色の金魚と並べると、よく映える。
    - name: 更紗琉金
      emoji: "🎀"
      reason: 赤と白のまだら模様が華やかな琉金。柄の出かたが1匹ずつ違い、お気に入りを探す楽しみがある。
    - name: 丹頂
      emoji: "🔴"
      reason: 頭だけが赤く、体が白いのが特徴。上品で、愛される品種。体型は種類によって違う。
    - name: 茶金
      emoji: "🟤"
      reason: 渋い茶色の体が、味わい深い金魚。派手さはないが、落ち着きがあり、観賞して楽しめる。
    - name: キャリコ（三色）
      emoji: "🎨"
      reason: 赤・白・黒の三色が混ざる模様が華やか。模様が1匹ずつ違い、愛着がわく。
  C:
    - name: ランチュウ
      emoji: "👑"
      reason: 背びれがなく、頭のこぶ状の盛り上がりが特徴で、「金魚の王様」と呼ばれることも。観賞価値が高いが、水質管理や越冬に気を使い、経験者向き。
    - name: 水泡眼
      emoji: "🫧"
      reason: 目の下に、大きな水の袋のような突起がある、個性的な金魚。突起が傷つきやすいので、取り扱いに注意が必要。
    - name: 蝶尾
      emoji: "🦋"
      reason: 蝶のように広がる尾びれが特徴。優雅で美しいが、繊細な面がある。
  D:
    - name: 土佐金
      emoji: "🏯"
      reason: 高知県で守られてきた、尾びれが独特の形をした金魚。飼育も、観賞のしかたも、独特の世界。通好みの品種。
    - name: 品評会向けの高級金魚
      short: 高級金魚
      emoji: "🏆"
      reason: 体型や色の完成度を、追求した高級個体は、高い値段がつくこともある。選別と管理にこだわる、通好みの世界。
summary: |
  迷ったら、丈夫で飼いやすい「和金」「琉金」「出目金」から。金魚は意外と大きく育つので、成長後のサイズと、水槽の広さも考えて選びたい。
  頭のこぶが育つランチュウや、泳ぎがゆっくりな品種は、水質管理に気を配りたい。ほかの金魚と混泳させるときは、泳ぎの速さが近いもの同士にするのが安心。
related: [kingyo-shippai, kingyo-esa, aquarium-goods]
