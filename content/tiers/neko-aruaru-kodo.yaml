title: 猫あるある行動 Tier表
description: 夜中の運動会、箱に入る、パソコンに乗る…猫飼いなら「わかる！」の猫あるある行動を、共感度でS〜Dにランク付け。
category: animals
tags: [猫, 動物, あるある]
published: 2026-10-03
labels:
  S: 全員わかる
  A: ほぼ毎日
  B: たまにある
  C: うちの子だけ？
  D: 通好み
criteria: |
  ① 猫飼いの共感度（「うちもそう！」となる率）
  ② 毎日見られる頻度
  ③ かわいさと困り度
  ※ 猫には個体差があります。あるあるは「ありがちな行動」の話です
rank_notes:
  S: 猫と暮らす人の共通言語
  D: ニッチだけど、ある人には刺さる
tiers:
  S:
    - name: 箱があると入る
      emoji: "📦"
      reason: 大きさが合っていなくても、とりあえず入ろうとする。体にぴったりの狭い空間が安心できるからと言われ、猫飼いなら全員が見たことのある光景。
    - name: ごはんの音だけは必ず聞こえる
      short: ごはんの音
      emoji: "🥫"
      reason: 呼んでも来ないのに、缶を開ける音や袋の音には、どこからともなく走ってくる。聞こえていないふりをしているのが、あるある中のあるある。
    - name: 夜中に突然の全力疾走
      short: 夜の運動会
      emoji: "🌙"
      reason: 猫は明け方や夕方に活発になる傾向があり、家の中で運動会が始まる。飼い主の睡眠をけずる、愛すべき困りごと。
  A:
    - name: 飼い主のパソコンに乗る
      emoji: "💻"
      reason: 作業を始めると、きっちり画面の前に座りに来る。飼い主の注意が向いている場所に、あえて入りたいのかもしれない。
    - name: 机の上のものを落とす
      emoji: "🥤"
      reason: コップやペンを前足でちょん、と押して落とす。落ちた音や飼い主の反応を見て、確かめているようにも見える。
    - name: ふみふみ
      emoji: "🐾"
      reason: 前足で布団や飼い主の体を交互に押す、子猫のころの授乳の名残と言われる行動。安心している証拠として、飼い主が一番うれしいあるある。
    - name: 飼い主のトイレやお風呂までついてくる
      short: トイレまでついてくる
      emoji: "🚪"
      reason: 閉めたドアの向こうが気になるのか、かりかりと開けようとする。ひとりの時間はほぼ存在しない。
    - name: 忙しいときほど甘えてくる
      short: 忙しい時に甘える
      emoji: "💗"
      reason: 急いでいるとき、PCに向かうとき、手が離せないときほど、膝に乗ってくる。猫は人の変化に敏感なのかもしれない。
  B:
    - name: 水を飲むとき前足でちょんちょんする
      short: 水をちょんちょん
      emoji: "💧"
      reason: 水面を触ってから飲む猫は多い。動きを確かめているとも、器のふちにひげが当たるのが嫌とも言われる。
    - name: 爪とぎ以外で爪をとぐ
      short: ソファで爪とぎ
      emoji: "🛋️"
      reason: 用意した爪とぎには見向きもせず、ソファや柱でガリガリ。素材や角度が気に入らないのかも。爪とぎの置き場所を変えると効果が出ることがある。
    - name: 空中をじっと見つめる
      emoji: "👀"
      reason: 何もないところを見つめて固まっていることがある。小さな虫や光、人間には聞こえない音を見ているのかもしれない。
    - name: トイレのあとに走る
      short: トイレ後ダッシュ
      emoji: "💨"
      reason: すっきりしたあと、なぜか急にダッシュする。理由は諸説あるが、猫自身も気分がいいのかもしれない。
    - name: ビニール袋をかじる・なめる
      short: ビニール袋
      emoji: "🛍️"
      reason: カサカサ音と感触が好きな猫は多い。飲みこむと危険なので、見つけたら片づけて。
  C:
    - name: 毛づくろいの途中で急に止まる
      short: 毛づくろい停止
      emoji: "🛁"
      reason: 舌を出したまま固まったり、考えごとをしているような顔になったりする。何を考えているのか、飼い主は知りたい。
    - name: 食事のあとに必ず顔を洗う
      short: 食後の顔洗い
      emoji: "😺"
      reason: 食べたあとは、前足をなめて顔をていねいに洗う。身だしなみを整えるのが習慣になっている。
    - name: 閉めたドアを開けてほしくて鳴く
      short: ドアの前で鳴く
      emoji: "🔔"
      reason: 開けると入ってこない、閉めると出たがる。ドアの向こうの世界にいつも興味がある。
  D:
    - name: 飼い主の髪の毛や服をはむはむする
      short: はむはむ
      emoji: "👄"
      reason: 毛づくろいのつもりなのか、愛情表現なのか、髪や服をはむはむとかじる猫がいる。かまれすぎには注意。
summary: |
  猫あるあるのSは、「箱に入る」「ごはんの音だけ聞こえる」「夜の運動会」の3つ。どの家でも見られる、ほぼ猫の公式行動と言っていい。
  あるあるは個体差の話なので、「うちの子はこうだった」というのが一番楽しい。あなたの家だけの猫あるあるは、ぜひ一言コメントで教えてね。
related: [neko-nerubasho, neko-omocha, neko-aijo]
