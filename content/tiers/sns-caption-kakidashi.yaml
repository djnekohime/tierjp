title: SNSキャプションの書き出し Tier表
description: 質問、数字、悩みの共感、結論先出し…SNS投稿の最初の一文（書き出し）のパターンを、ゾーマが「読まれやすさ×誠実さ×続けやすさ」でS〜Dにランク付け。
category: sns
tags:
- 初心者
- 投稿
published: '2026-11-03'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 続きを読みたくなるか

  ② 誠実さ（誇張やだましがないか）

  ③ 続けやすさ（毎回使えるか）

  ※ サービスの仕組みや表示の仕方は変わります。ここで挙げるのは、一般的な傾向の目安です'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 結論を先に書く
    emoji: 📌
    reason: 忙しい人でも内容がすぐ分かる。誠実で、読み手に優しい。
  - name: 読み手への質問から始める
    emoji: ❓
    reason: コメントが集まりやすく、会話のきっかけになる。
  - name: 投稿の中身と合った、具体的な一文
    emoji: 🎯
    reason: 期待とのズレがなく、読後の満足度が高い。
  A:
  - name: 数字を入れる（3つのコツ、5分でできる、など）
    emoji: 🔢
    reason: 読む負担が見えて、安心感が出る。
  - name: 悩みへの共感から入る
    emoji: 🤝
    reason: 「分かる」と思ってもらえると、最後まで読まれやすい。
  - name: ビフォーアフターを先に書く
    emoji: 🔄
    reason: 変化が一目で分かり、続きが気になる。
  - name: 短い一文で、リズムよく始める
    emoji: 🥁
    reason: スマホでも読みやすい。ダラダラ長いと離脱されやすい。
  B:
  - name: ちょっとした失敗談から入る
    emoji: 😅
    reason: 親近感がわく。ただし、話が長くなりすぎないように。
  - name: 季節や時事のあいさつから入る
    emoji: 🍂
    reason: 身近な話題で入りやすい。書き出しとしては定番。
  - name: 感情をそのまま書く（うれしい、困った）
    emoji: 💬
    reason: 素直さが伝わる。続きとのつながりも必要。
  - name: 自分の体験を一言で書く
    emoji: 🗒️
    reason: 信頼感が出る。「やってみた」系と相性がよい。
  - name: 絵文字を先頭に置く
    emoji: ✨
    reason: 目に留まりやすい。多すぎると読みにくい。
  C:
  - name: 「実は…」と引っ張る
    emoji: 🤫
    reason: 気になるが、多用すると飽きられる。中身が伴っていれば有効。
  - name: 大きな主張から入る
    emoji: 📣
    reason: 目立つが、反発を招くこともある。根拠を添えたい。
  - name: 有名人や流行語を借りる
    emoji: 🔥
    reason: 話題性はあるが、投稿の中身と合わないと逆効果。
  D:
  - name: 内容と関係のない煽り文句
    emoji: 🎣
    reason: 読んだ人が裏切られた気持ちになり、信頼を失う。
  - name: 「絶対」「必ず」と言い切る
    emoji: ⚠️
    reason: 根拠がないと、誇張や誤解を生みやすい。
  - name: 最初の一文が極端に長い
    emoji: 📏
    reason: スマホでは途中で切れて、続きを読んでもらいにくい。
summary: 'SNSのキャプションは、書き出しの一文で「続きを読むか」が決まりやすい。でも、目を引くことばかり考えて、内容とズレた書き出しにすると、読んだ人にがっかりされてしまう。だからS級は、投稿の中身とちゃんとつながっている書き出し。

  結論を先に書くパターンは、忙しい人にも優しい。「今日は〇〇を試してみた」と先に言ってしまえば、読み手は迷わない。質問から始めるのも、コメントが集まりやすく、会話が生まれやすい。

  数字を入れる書き出しも効果的。「3つのコツ」「5分でできる」のように、読む負担が見えると安心感が出る。

  反対に、D級の「釣りタイトル」や、内容と関係のない煽り文句は、一時的に目を引いても、信頼を失う。長く続けるなら、誠実さが一番の武器。

  おすすめは、①テンプレートを3つ作る ②週ごとに使い分ける ③反応のよかったものを記録する、の3ステップ。毎回ゼロから考えなくて済むので、続けやすくなる。ハッシュタグや絵文字は、書き出しのあとに添えるくらいがちょうどいい。

  書き出しの型を作っておくと、動画や画像の投稿でも迷わない。たとえば、「〇〇してみた結果」「〇〇で悩んでいる人へ」「今日の1枚」など、3パターンほどを用意しておけばよい。反応が良かった投稿は、書き出しの型と一緒にメモしておくと、あとで強力な資料になる。数字や反応に一喜一憂しすぎず、見てくれる人の顔を想像して書くのが、結局いちばん強い。'
