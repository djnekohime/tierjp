title: 雨の日にやってみたいこと Tier表
description: 映画を一気見、料理に挑戦、押し入れの整理、手紙を書く…雨の日におうちでやってみたいことを、AIが「ワクワク度×手軽さ×満足感」でS〜Dにランク付け。
category: yattemitai
tags:
- 挑戦
- 初心者
published: '2026-10-09'
labels:
  S: 今すぐ
  A: 週末に
  B: 気分が向いたら
  C: 少し準備して
  D: 思ったより…
criteria: '① ワクワク度

  ② おうちで手軽にできるか

  ③ 終わったあとの満足感'
rank_notes:
  S: 今すぐ
  D: 思ったより…
tiers:
  S:
  - name: 気になっていた映画・ドラマを一気見
    emoji: 🎬
    reason: 雨音を聞きながら、最高の贅沢。
  - name: あたたかい飲み物をいれて、読書
    emoji: ☕
    reason: 雨の日の読書は、特別に落ち着く。
  A:
  - name: 手の込んだ料理・お菓子作り
    emoji: 🍪
    reason: 時間がある日にこそ。家じゅういい香りに。
  - name: 押し入れ・引き出しの整理
    emoji: 🧹
    reason: 終わると気持ちがすっきり。やる気が出る日に。
  - name: 古いアルバム・写真を見返す
    emoji: 📷
    reason: 懐かしくて、あたたかい気持ちに。デジタル化もできる。
  - name: 手紙・はがきを書く
    emoji: ✉️
    reason: 落ち着いた気持ちで、大切な人へ。
  B:
  - name: 音楽を作る・楽器を練習する
    emoji: 🎹
    reason: 雨の音は、集中できる。
  - name: ゆっくりお風呂（入浴剤・アロマ）
    emoji: 🛁
    reason: 体も気持ちもほぐれる。
  - name: 日記・ノートを書く
    emoji: 📓
    reason: 1日をふりかえるのに向く。
  - name: ペットとのんびり過ごす
    emoji: 🐈
    reason: ぬくもりを感じる時間。
  C:
  - name: 新しい趣味の準備（道具選び・調べもの）
    emoji: 🛍️
    reason: ワクワクするが、調べすぎて疲れることも。
  - name: ゲームを一気にプレイ
    emoji: 🎮
    reason: 楽しいが、気づくと夜に。時間は決めよう。
  D:
  - name: ずっとスマホを眺める
    emoji: 📱
    reason: 気づけば夜。「やりたいこと」を先に決めておく。
summary: '雨の日は、外に出られない代わりに「ずっとやりたかったこと」をする絶好の日。S級は、思い立ったらすぐできて、終わったあと気分がよくなること。

  やりたいことをリストにしておけば、「雨でがっかり」が「待ってました」に変わる。'
related:
- yattemitai-shumatsu
- yattemitai-tezukuri
