    emoji: 🚕
    reason: 一晩で予算オーバー。年明けの明細で青ざめる。
  - name: 立て替えたお金を、回収しないまま年を越す
    emoji: 💸
    reason: 言い出しにくくなり、関係もこじれやすい。
  - name: お酒を飲んだのに、車を運転して帰る
    emoji: 🚫
    reason: 絶対にいけない。飲むなら車で行かない。
summary: '12月と1月は、忘年会・新年会・同窓会・友だちとの集まりが重なって、気がつくと外食と交際費だけで大きな金額になっていることがある。1回あたりは数千円でも、二次会、タクシー代、手土産、着ていく服…と積み重なると、年末の家計にずしりとくる。でも、大切な人と会う機会を全部断るのはさびしい。だから大事なのは、「お金を使う会と、使わない会を自分で選ぶ」ことだ。

  S級は「年末年始の交際費の予算を、先に決めておく」「本当に行きたい会を選んで参加する」「二次会以降は、その日の気分と予算で決める」。予算を決めておけば、「あと何回行けるか」が分かり、誘われたときに迷いにくい。行きたい会に絞ると、ひとつひとつを心から楽しめて、出したお金への満足度も高くなる。

  A級は、会費制の会を選ぶ、家飲みや持ち寄りにする、昼の集まりやランチ会にする、など。昼の会は、お酒の量も会費も少なめになりやすく、終電やタクシー代の心配もない。断るときは、「その日は予定があって」と短く、感謝を添えて伝えるだけで十分。理由を長々と説明しなくても大丈夫だ。

  C級は、付き合いだけで全部の会に出ること、高いお店の幹事を引き受けること。D級は、「お酒の勢いで、二次会・三次会と流れて、終電を逃してタクシー」「立て替えたお金を回収しないまま年を越す」。どちらも、年明けにカードの明細を見て青ざめるパターンだ。

  幹事をするなら、集金はキャッシュレスの送金アプリや、事前の会費制にすると、立て替えが減ってトラブルも少ない。参加する側も、その場で払うか、すぐに送金するのがマナー。

  楽しい集まりは、1年の締めくくりや始まりに元気をくれる。お金との上手なつきあい方を決めておけば、罪悪感なく思い切り楽しめる。お酒は無理に飲まず、飲んだら車は運転しないこと。あなたのS級の過ごし方は、どれ？ ぜひ自分のTier表を作ってみてほしい。'
