  - name: 付き合いだけで、全部の会に出る
    emoji: 😓
    reason: お金も体力も消耗し、楽しさも減りがち。
  - name: 高いお店の幹事を、なんとなく引き受ける
    emoji: 🍷
    reason: 参加者の負担が増え、自分の手間も大きい。
  - name: 集まりのたびに、新しい服を買う
    emoji: 👗
    reason: 一度きりの服は、出費が大きくなりやすい。
  D:
