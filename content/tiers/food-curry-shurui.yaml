title: カレーの種類 Tier表
description: 家のカレー、カツカレー、キーマ、バターチキン、スープカレー、グリーンカレー、欧風カレー…カレーの種類を、AIが「食べたい度×満足感×奥の深さ」でランク付け。
category: food
genre: カレー
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「今日はこれが食べたい」と思える人気
  ② 一皿食べたときの満足感
  ③ お店ごとの個性・食べ歩きの楽しさ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 日本のカレーの三本柱
  D: ハマると抜け出せない本格派
tiers:
  S:
    - name: 家のカレー（ルーのカレー）
      short: 家のカレー
      emoji: "🍛"
      reason: 市販のルーで作る、とろみのある日本のカレー。家ごとの具や隠し味に個性が出る、みんなの原点の味。
    - name: カツカレー
      emoji: "🐖"
      reason: カレーにとんかつをのせた、日本が生んだ最強の組み合わせ。サクサクの衣とルーのコラボで、満足感は最大級。
    - name: バターチキンカレー
      emoji: "🧈"
      reason: トマトとバター、生クリームのまろやかなインドカレー。辛さが控えめで、ナンとの相性も抜群。
  A:
    - name: キーマカレー
      emoji: "🟤"
      reason: ひき肉を使ったカレー。短時間で作れて、スパイスの香りも楽しめる。
    - name: スープカレー
      emoji: "🥣"
      reason: 札幌で生まれた、さらっとしたスープ状のカレー。ごろっとした大きな野菜とチキンが主役。
    - name: 欧風カレー
      emoji: "🍷"
      reason: 小麦粉とバター、長時間煮込んだソースの濃厚なカレー。老舗の洋食屋さんの味。
    - name: グリーンカレー
      emoji: "🟢"
      reason: ココナッツミルクと青唐辛子のタイカレー。甘さのあとに辛さがくる、クセになる味。
    - name: スパイスカレー
      emoji: "🌿"
      reason: 大阪で広まった、ルーを使わずスパイスを重ねて作るカレー。何種類かを盛り合わせる「あいがけ」も人気。
  B:
    - name: シーフードカレー
      emoji: "🦐"
      reason: えびやいかのうまみがたっぷり。海の家や港町で食べたくなる。
    - name: チキンカレー
      emoji: "🐔"
      reason: やわらかい鶏肉のカレー。スパイス系から家庭の味まで幅広い。
    - name: ドライカレー
      emoji: "🍚"
      reason: 汁気の少ないカレー味の炒めご飯、またはひき肉のカレー。お弁当にも入れやすい。
    - name: 焼きカレー
      emoji: "🔥"
      reason: カレーとご飯にチーズや卵をのせてオーブンで焼いた、福岡・門司港の名物。
    - name: カレーうどん
      emoji: "🍜"
      reason: だしのきいたカレーのつゆにうどん。服にはねるのが唯一の弱点。
  C:
    - name: ビリヤニ
      emoji: "🍲"
      reason: スパイスで炊き込んだインドの炊き込みご飯。カレーとは少し違うが、カレー好きの間で大ブームになった。
    - name: 薬膳カレー
      emoji: "🌱"
      reason: 体にいいスパイスや食材を使ったカレー。やさしい味だが、好みは分かれる。
  D:
    - name: スリランカカレー
      emoji: "🌴"
      reason: 何種類ものカレーやおかずをワンプレートに盛り、混ぜながら食べる。味が混ざるたびに変わる奥深さで、カレー好きをとりこにする。
    - name: 黒カレー
      emoji: "⚫"
      reason: 焦がした玉ねぎやイカスミで黒く仕上げたカレー。苦みとコクのある大人の味。
summary: |
  カレーは、家のカレー・カツカレー・バターチキンがS。日本のカレーは、ルーのカレーを軸に、インド・タイ・スリランカの本格派まで何でも受け入れて進化してきた。
  スープカレーは札幌、スパイスカレーは大阪、焼きカレーは門司港と、ご当地カレーの食べ歩きも楽しい。
related: [food-curry-gu, food-ramen-aji]
