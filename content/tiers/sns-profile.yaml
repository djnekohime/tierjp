title: SNSのプロフィールの作り方 Tier表
description: アイコン、名前、自己紹介文、固定投稿、リンク、ハイライト…SNSのプロフィールの項目を「フォローされやすさへの効果・手軽さ」でS〜Dにランク付け。はじめたてのアカウントに。
category: sns
tags: [SNS, 初心者]
published: 2026-10-05
labels:
  S: まず整える
  A: 効果が大きい
  B: あると良い
  C: 余裕があれば
  D: 逆効果になりやすい
criteria: |
  ① フォローや、興味を持ってもらう効果の大きさ
  ② 手軽さ（すぐ直せるか）
  ③ 信頼感・分かりやすさ
  ※ SNSの種類や、アカウントの目的で、効果的な形は変わります。一般的な考え方の整理です。個人情報は、載せすぎないようにしてください
rank_notes:
  S: 最初に、必ず整える
  D: 見る人が離れやすい
tiers:
  S:
    - name: 何を発信するアカウントか、ひと目で分かる自己紹介文
      short: 自己紹介文
      emoji: "📝"
      reason: プロフィールを見て、「このアカウントは、何が見られるのか」が、すぐ分かると、フォローしてもらいやすい。1〜2行で、ジャンルと特徴を書く。
    - name: アイコン（顔やキャラクターなど、覚えやすいもの）
      short: アイコン
      emoji: "🖼️"
      reason: 投稿一覧に、必ず出るので、印象を左右する。小さくても、見分けやすい画像を選ぶ。
  A:
    - name: 名前（覚えやすく、ジャンルが伝わる）
      short: 名前
      emoji: "🏷️"
      reason: 検索でも、見つけてもらいやすくなる。長すぎず、読みやすい名前に。
    - name: 固定投稿（いちばん見てほしい投稿）
      short: 固定投稿
      emoji: "📌"
      reason: プロフィールを見た人が、最初に目にする。自己紹介や、代表的な投稿を、置いておく。
    - name: 発信のテーマを、ひとつにしぼる
      short: テーマをしぼる
      emoji: "🎯"
      reason: 何のアカウントか分かりやすく、フォローされる理由になる。複数ある場合は、アカウントを分けるのも手。
    - name: ヘッダー画像・ハイライト・まとめ
      short: ヘッダー・ハイライト
      emoji: "🌄"
      reason: 世界観を伝えられる。投稿を見やすくまとめる機能もあり、見る人の手間が減る。
    - name: 投稿の見た目をそろえる（色・フォント・構図）
      short: 見た目をそろえる
      emoji: "🎨"
      reason: 統一感があると、ブランドのように見え、信頼感が出る。
  B:
    - name: リンク（サイト・ブログ・他のSNS）
      short: リンク
      emoji: "🔗"
      reason: 興味を持った人を、詳しい情報へ案内できる。リンク先が整っているか、確認しておく。
    - name: 投稿の頻度や時間帯の目安を書く
      short: 投稿頻度の目安
      emoji: "⏰"
      reason: 「毎日更新」などと書くと、見る人が待ちやすい。守れる範囲で書く。
    - name: 実績や経歴（無理のない範囲で）
      short: 実績・経歴
      emoji: "🏅"
      reason: 信頼につながる。誇張は避け、事実を書く。
    - name: 返信や問い合わせの方法
      short: 問い合わせ方法
      emoji: "📮"
      reason: 仕事や、コラボの依頼につながることがある。連絡先は、公開して問題のない範囲で。
    - name: ハッシュタグの活用
      short: ハッシュタグ
      emoji: "🔖"
      reason: 興味のある人に、見つけてもらいやすくなる。数は、絞って、関連のあるものを。
  C:
    - name: 趣味・好きなものの、ひとこと
      short: 趣味・好きなもの
      emoji: "💖"
      reason: 親しみやすさが出る。多すぎると、焦点がぼやける。
    - name: 誕生日・出身地などの、プロフィール情報
      short: 誕生日・出身地
      emoji: "🎂"
      reason: 親しみは増すが、個人情報は、載せすぎない。
    - name: 絵文字での装飾
      short: 絵文字の装飾
      emoji: "✨"
      reason: 見やすくなる効果もあるが、多すぎると読みにくい。
  D:
    - name: 長すぎる自己紹介
      short: 長すぎる自己紹介
      emoji: "📜"
      reason: 読む前に、離れてしまう。要点を絞って、短く。
    - name: 他の人のアイコンや写真を、無断で使う
      short: 他人の画像を使う
      emoji: "🚫"
      reason: 権利や、なりすましの問題になる。自分で用意した画像を使う。
    - name: 自分のことを、実際より大きく見せる
      short: 大きく見せる
      emoji: "🎈"
      reason: あとで事実と違うと、信用を失う。等身大が、いちばん長続きする。
summary: |
  プロフィールのSは、「何のアカウントかひと目で分かる自己紹介文」と「覚えやすいアイコン」。この2つが整っているだけで、フォローしてもらえる確率は、変わる。
  テーマをしぼって、見た目をそろえ、固定投稿で案内する、という流れが基本。個人情報は載せすぎず、等身大で、続けられる形に整えよう。
related: [sns-short-neta, sns-chuui, sns-tsuzukeyasusa]
