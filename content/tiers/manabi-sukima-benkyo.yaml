title: スキマ時間の勉強法 Tier表
description: 通勤・待ち時間・家事の合間…忙しい人のスキマ時間の勉強法を、ゾーマが「続けやすさ×身につきやすさ×手間の少なさ」でS〜Dにランク付け。英語・韓国語・資格どれにも使える。
category: manabi
tags:
- 初心者
- 続ける
published: '2026-11-07'
labels:
  S: 迷ったらこれ
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 続けやすさ

  ② 身につきやすさ

  ③ 準備の手間の少なさ

  ※ 運転中や歩きながらのスマホ操作は危険です。耳で聴くだけの勉強も、周りの音が聞こえる音量で、安全第一で'
rank_notes:
  S: 迷ったらここから
  D: 避けたい
tiers:
  S:
  - name: 歯みがきや食後など、毎日の行動にくっつける
    emoji: 🪥
    reason: いつやるかを決めると、意志の力に頼らず続けられる。習慣化のいちばんの近道。
  - name: 1回3〜5分の、小さなメニューにする
    emoji: ⏱️
    reason: 短いので始めやすく、疲れない。やめる日が出にくい。
  A:
  - name: 単語アプリで、1日10個だけ覚える
    emoji: 📱
    reason: 待ち時間にぴったり。復習のタイミングを、アプリが教えてくれる。
  - name: 耳で聞く（音声・ラジオ・音声教材）
    emoji: 🎧
    reason: 家事や移動中にできる。周りの音が聞こえる音量にして、安全に。
  - name: 付箋に書いて、目につく場所に貼る
    emoji: 📝
    reason: 目に入るたびに復習できる。冷蔵庫、洗面所、玄関が定番。
  - name: 前の日に、やる内容を決めておく
    emoji: 📅
    reason: 朝や待ち時間に迷わず始められる。準備の手間が減る。
  B:
  - name: ポケットサイズの、小さなメモ帳に書く
    emoji: 📒
    reason: スマホよりも、集中しやすい人もいる。持ち歩きやすい。
  - name: 1日の終わりに、覚えたことを1つ思い出す
    emoji: 🌙
    reason: 思い出すこと自体が、記憶の定着になる。寝る前の習慣にしやすい。
  - name: 電車やバスの中で、動画の字幕学習をする
    emoji: 🚃
    reason: 楽しみながら学べる。イヤホンの音量は控えめに。
  - name: カレンダーに、できた日のシールを貼る
    emoji: 📆
    reason: 続いた日が見えて、やる気が出る。1週間で達成感。
  - name: 家族や友だちに、今日の1つを話す
    emoji: 💬
    reason: アウトプットになり、記憶に残る。教えるのが最強の復習。
  C:
  - name: 参考書を持ち歩いて、広げる
    emoji: 📚
    reason: 重くて、結局広げないことも。ページを撮って、スマホで見る方が楽。
  - name: SNSで、勉強垢をたくさんフォローする
    emoji: 🔍
    reason: 刺激にはなるが、見ているだけで満足することも。時間を決めて使う。
  - name: ながら勉強だけで、まとまった時間を取らない
    emoji: 🔄
    reason: 内容によっては、集中して取り組む時間も必要。メリハリを。
  D:
  - name: まとまった時間が取れるまで、始めない
    emoji: ⏳
    reason: いつまでも始められなくなる。「今日は1個だけ」で十分。
  - name: 歩きながら、スマホで勉強する
    emoji: 🚶
    reason: 前を見ずに危険。立ち止まるか、耳で聞くだけにする。
  - name: 毎回、新しい教材に乗り換える
    emoji: 🔀
    reason: どれも中途半端になる。まず1冊、1アプリを最後まで。
summary: 'スキマ時間の勉強は、「長く勉強できないから無理」という気持ちを、いちばんシンプルに崩してくれる。S級は、1回3〜5分で終わる小さなメニューを、毎日同じタイミングにくっつけること。たとえば、歯みがきのあと、お湯を沸かしている間、電車を待つ間。「習慣にくっつける」と、意志の力に頼らなくて済む。

  A級・B級は、「耳で聞く」「単語アプリ」「付箋」「メモ帳に書く」など、準備が少なくて済む方法。道具を選びすぎると、準備だけで疲れてしまうので、使うものは2つくらいに絞るのがちょうどいい。

  逆に、D級の「勉強する時間をまとめて確保しないと始めない」は、続かない原因になりがち。完璧を目指すより、「今日は1個だけ」の積み重ねがいちばん強い。

  コツは3つ。①やる内容を前の日に決めておく。②終わったらカレンダーにシールを貼る。③1週間続いたら、自分にごほうび。

  短い時間でも、毎日続けた1年は、とても大きな差になる。今日の5分から、小さく始めてみてね。

  スキマ時間のいいところは、1回あたりの負担が小さいので、失敗しても罪悪感が残りにくいこと。できなかった日があっても、翌日にまた3分から再開すればいい。「毎日ゼロにしない」ことだけを目標にすると、気持ちが楽になって、結局いちばん長く続く。学ぶ内容は、英語でも韓国語でも資格でも、この考え方は共通で使えるよ。もし続かなくなったら、内容を変えるのではなく、時間をもっと短くするのがおすすめ。1分でも「やった」という事実が残れば、翌日の再開がずっと楽になる。自分に合う小さな単位を、じっくり見つけてね。'
