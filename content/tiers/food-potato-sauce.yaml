title: フライドポテトにつけるもの Tier表
description: ケチャップ、マヨネーズ、バーベキューソース、チーズソース、マスタード、塩、トリュフ塩、明太マヨ、シェイク…フライドポテトにつけるものを、AIが「ポテトが止まらない度」でランク付け。
category: food
genre: ファストフード・外食
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① ポテトが止まらなくなる度
  ② 手に入りやすさ（お店・家）
  ③ ポテトのおいしさを引き立てるか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: ポテトの三大相棒
  D: 一度試すとハマるかも
tiers:
  S:
    - name: ケチャップ
      emoji: "🍅"
      reason: ポテトの相棒の王様。甘酸っぱいトマトの味は、揚げたてのポテトと鉄板の組み合わせ。
    - name: 塩（そのまま）
      short: 塩
      emoji: "🧂"
      reason: 何もつけない、揚げたての塩味こそ最強という人も多い。じゃがいものおいしさが一番分かる。
    - name: マヨネーズ
      emoji: "🥚"
      reason: ベルギーやオランダでは、ポテトにマヨネーズが定番。こってりした満足感。
  A:
    - name: バーベキューソース
      emoji: "🔥"
      reason: スモーキーで甘辛いソース。ファストフードのナゲットのソースで試すのが定番。
    - name: チーズソース
      emoji: "🧀"
      reason: とろとろのチーズソースをかけたチーズフライは、ボリューム満点。
    - name: マスタード（はちみつマスタード）
      short: マスタード
      emoji: "🟡"
      reason: 甘さとピリッとした辛さのバランス。大人向けの味わい。
    - name: サワークリーム
      emoji: "🤍"
      reason: さっぱりした酸味。ハーブやオニオンと合わせるとおしゃれな味に。
    - name: 明太マヨ
      emoji: "🌶️"
      reason: 明太子とマヨネーズの日本らしい組み合わせ。居酒屋のポテトで人気。
  B:
    - name: のり塩
      emoji: "⬛"
      reason: 青のりの香りでポテトチップスのような味わいに。
    - name: トリュフ塩
      emoji: "🍄"
      reason: 高級食材トリュフの香り。ちょっと贅沢なポテトに。
    - name: カレー粉
      emoji: "🍛"
      reason: スパイスの香りで、いつものポテトが別の料理に。
    - name: タルタルソース
      emoji: "🥒"
      reason: 卵とピクルスのソース。フィッシュ＆チップス気分で。
    - name: グレイビーソース
      emoji: "🟤"
      reason: 肉汁のソースをかけたカナダの「プーティン」のような食べ方。
  C:
    - name: ガーリックバター
      emoji: "🧄"
      reason: にんにくとバターの香ばしさ。やみつきになるが、においが気になる日は控えたい。
    - name: 酢（モルトビネガー）
      short: ビネガー
      emoji: "🫗"
      reason: イギリスのフィッシュ＆チップスの定番。酸っぱさでさっぱり。日本ではなじみが薄い。
  D:
    - name: シェイク・ソフトクリーム
      short: シェイク
      emoji: "🥤"
      reason: 冷たくて甘いシェイクにポテトをつける、甘じょっぱい組み合わせ。驚かれるが、一度試すとハマる人が続出する。
    - name: チョコソース
      emoji: "🍫"
      reason: ポテトにチョコをかけた甘じょっぱいお菓子のような食べ方。好き嫌いはとても分かれる。
summary: |
  フライドポテトにつけるものは、ケチャップ・塩・マヨネーズがS。国によっても定番が違い、ベルギーはマヨネーズ、イギリスはビネガー、カナダはグレイビーソース。
  シェイクにポテトをつける甘じょっぱい食べ方は、試したことのない人ほど一度やってみてほしい。
related: [food-burger, food-potechi]
