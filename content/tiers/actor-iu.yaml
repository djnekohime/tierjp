title: IU（アイユー）出演作 Tier表
description: 私のおじさん、ホテルデルーナ、おつかれさま…歌手で俳優のIU（イ・ジウン）の出演作を、AIが「作品の面白さ×IUの魅力」でランク付け。
category: kanryu
tags: [韓国ドラマ, 俳優, IU]
published: 2026-09-29
criteria: |
  ① 作品そのものの面白さ
  ② IUの演技の魅力が最大限に出ているか
  ③ ファンでない人にもすすめられるか
  ※ ドラマ・映画・コンサート映画・トーク番組を対象
rank_notes:
  S: 俳優IUの到達点
tiers:
  S:
    - name: 私のおじさん〜My Mister〜（2018）
      emoji: "🌃"
      reason: イ・ソンギュンと共演。生きることに疲れ切った女性ジアン役で、「歌手のIU」のイメージを完全に塗り替えた。俳優としての評価を決定づけた作品。
    - name: おつかれさま（2025）
      emoji: "🍊"
      reason: パク・ボゴムと共演。済州島で生まれた女性の若い頃と、その娘の二役を演じる。一人の人生を丁寧に生きた演技に、世代を問わず涙した人が多い。
  A:
    - name: ホテルデルーナ〜月明かりの恋人〜（2019）
      emoji: "🏨"
      reason: ヨ・ジングと共演。わがままで華やかなホテルの社長役。毎回変わる豪華な衣装と、長い孤独を抱えた役の切なさが見どころ。
    - name: ベイビー・ブローカー（2022）
      emoji: "👶"
      reason: 是枝裕和監督、ソン・ガンホ共演の映画。赤ちゃんを手放した若い母親役。家族とは何かを問いかける静かな作品。
  B:
    - name: 麗〈レイ〉〜花萌ゆる8人の皇子たち〜（2016）
      emoji: "🌷"
      reason: イ・ジュンギと共演。高麗時代にタイムスリップした女性役。皇子たちとの恋が切なく、ファンの多い作品だが、演技の評価は分かれた。
    - name: 最高です！スンシンちゃん（2013）
      short: スンシンちゃん
      emoji: "🌻"
      reason: 家族の物語を描く週末ドラマで主演。明るくひたむきなヒロイン役。話数は多いが、家族みんなで見られる温かさがある。
    - name: 'プロデューサー（2015）'
      emoji: "📺"
      reason: 'キム・スヒョン、コン・ヒョジン、チャ・テヒョンと共演したドラマ。テレビ局の裏側を描き、IUはトップ歌手役を演じた。'
    - name: 'ペルソナ -仮面の下の素顔-（2019）'
      short: 'ペルソナ'
      emoji: "🎞️"
      reason: '4人の監督がIUを主人公に撮った短編映画集。作品ごとにまったく違う顔を見せる、IUのための映画。'
    - name: 'ドリーム（2023）'
      emoji: "⚽"
      reason: 'パク・ソジュンと共演した映画。ホームレスサッカー大会のドキュメンタリーを撮るプロデューサー役。明るく温かいコメディ。'
    - name: 'IU CONCERT : THE WINNING（2024）'
      short: 'コンサート映画'
      emoji: "🎤"
      reason: 'ソウルのワールドカップ競技場で行われたコンサートを収めた映画。歌手IUのステージの魅力を大画面で味わえる。'
  C:
    - name: ドリームハイ（2011）
      emoji: "🎤"
      reason: キム・スヒョン、スジらと共演した芸術高校の青春ドラマ。演技デビュー初期の作品で、出番は多くないが、歌の場面は今見ても魅力的。
    - name: 'キレイな男（2013）'
      emoji: "💄"
      reason: 'チャン・グンソクと共演したドラマ。まっすぐに恋するヒロイン役。明るく元気なIUが見られるが、作品の評価は控えめ。'
    - name: '夜明けの詩（2021）'
      emoji: "🌅"
      reason: 'ヨン・ウジン主演の映画に出演。ソウルに戻った小説家が出会う人々を描く、静かな会話劇。'
    - name: 'リアル（2017）'
      emoji: "🎲"
      reason: 'キム・スヒョン主演の映画に出演。カジノをめぐるアクション・ノワール。作品の評価は厳しめで、ファン向け。'
    - name: 'IUのパレット'
      emoji: "🎨"
      reason: 'IUがMCを務めるトーク番組。ゲストとの自然な会話や生の歌声が楽しめ、俳優とは違う素のIUに会える。'
summary: |
  IUは「明るいアイドル」から「人生を背負う役」まで演じ切る俳優に成長した。私のおじさんとおつかれさまは、どちらも見終わったあと何日も余韻が残る。
  歌手としてのIUしか知らない人にこそ、俳優IUを見てほしい。最初の1本なら華やかなホテルデルーナから入るのも◎。
related: [kandrama-human, kandrama-2020s, kandrama-fantasy]
