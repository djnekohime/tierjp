title: 猫に危険な食べもの・家の中のもの Tier表
description: ユリ、玉ねぎ、チョコ、人間用の薬…猫にとって危険になりうる食べものと家の中のものを、危険度でS〜Dにランク付け。
category: animals
tags:
- 猫
- 動物
- 初心者
published: '2026-10-06'
labels:
  S: 絶対NG
  A: 要注意
  B: あげないほうがいい
  C: 与え方しだい
  D: おおむね問題なし
criteria: '① 中毒や重い症状につながる危険度

  ② 家庭で猫の口に入る機会の多さ

  ③ 少量でも起こりうるか

  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。動物の種類・年齢・体質・量で影響は変わります。心配なときは、様子を見すぎず、動物病院に相談してください。食べてしまったときは、様子を見ずに、すぐ動物病院に連絡してください'
rank_notes:
  S: 少量でも命にかかわる可能性
  D: 量や与え方を守ればおおむね問題なし
tiers:
  S:
  - name: ユリ（花・花粉・花瓶の水）
    short: ユリ
    emoji: 💐
    reason: 猫が口にすると、腎臓に重い障害が出ることがある危険な植物。花びらや葉、花粉をなめる、花瓶の水を飲むだけでも危険と言われている。猫のいる家には飾らないのが安全。
  - name: 玉ねぎ・ネギ類
    short: ネギ類
    emoji: 🧅
    reason: 猫の赤血球をこわして、貧血を起こすことがある。加熱しても危険は消えない。ハンバーグ、スープ、だしの出がらしなどにも入っているので、人間の食べ物を分けるのは避ける。
  - name: チョコレート・ココア
    emoji: 🍫
    reason: 含まれる成分が猫には中毒を起こし、嘔吐・震え・けいれんなどにつながることがある。バレンタインやクリスマスなど、家に出る機会が多いので要注意。
  - name: 人間用の薬（痛み止め・風邪薬など）
    short: 人間用の薬
    emoji: 💊
    reason: 猫は人間の薬を分解するのが苦手で、少量でも重い中毒になることがある。落ちた錠剤をなめたり、飲みこんだりしないよう、必ずしまう。猫に人間の薬を飲ませるのも絶対にしない。
  - name: アルコール
    emoji: 🍺
    reason: 少量でも猫の体には大きな負担になる。飲みかけのグラスや、料理に使ったお酒にも注意。
  A:
  - name: コーヒー・紅茶・エナジードリンクなどカフェインを含むもの
    short: カフェイン
    emoji: ☕
    reason: カフェインは猫に興奮や心拍数の増加などを起こすことがある。飲みかけのカップ、コーヒーかす、ティーバッグにも注意。
  - name: 糸・ひも・ヘアゴム・リボン・ゴム
    short: 糸・ひも類
    emoji: 🧵
    reason: 猫は糸やひもにじゃれて、飲みこんでしまうことがある。腸にからまって、手術が必要になる事故につながることもある。遊ぶときは目を離さず、使い終わったらしまう。
  - name: 観葉植物・切り花（種類によっては有毒）
    short: 観葉植物
    emoji: 🪴
    reason: 猫が葉をかじると、よだれや嘔吐などが出る植物がある。新しく植物を迎えるときは、猫にとって安全かを調べてから置く。
  - name: アロマオイル・精油（ティーツリーなど）
    short: アロマ・精油
    emoji: 🕯️
    reason: 猫は精油の成分を分解するのが苦手で、体に入ると中毒を起こすことがある。ディフューザーの使用や、肌につく使い方は避けたほうが安心。
  - name: ぶどう・レーズン
    emoji: 🍇
    reason: 犬では腎臓への障害が報告されている食べ物。猫での影響ははっきりしないが、安全のため、あげないほうがいい。
  B:
  - name: 牛乳（人間用）
    short: 牛乳
    emoji: 🥛
    reason: 乳糖を分解しにくく、お腹をこわす猫が多い。飲ませるなら、猫用ミルクを。
  - name: 塩分の多い加工食品（ハム・ちくわ・スナック菓子など）
    short: 塩分の多い食品
    emoji: 🍥
    reason: 人間には普通の味付けでも、猫には塩分が多すぎる。続けると、腎臓や心臓への負担が心配になる。
  - name: 犬用のフード・おやつ
    short: 犬用フード
    emoji: 🐕
    reason: 犬と猫では、必要な栄養が違う。猫は特にタウリンなどが必要なので、犬用を食べ続けると栄養が足りなくなる。置きっぱなしのごはんの食べ間違いに注意。
  - name: 生の卵白・生肉・生の魚介
    short: 生の食材
    emoji: 🥚
    reason: 食中毒の心配がある。生のイカやエビなどを大量に食べ続けると、ビタミンB1が不足する心配も言われている。与えるなら、新鮮なものを加熱して、少量にする。
  - name: 鶏などの加熱した骨
    short: 骨
    emoji: 🍗
    reason: 加熱した骨は割れて鋭くなりやすく、のどや腸を傷つけることがある。食卓の骨は、猫が届かないところに捨てる。
  - name: ビニール袋・輪ゴム・小さなおもちゃ
    short: ビニール袋など
    emoji: 🛍️
    reason: かじって飲みこんだり、袋に頭を入れて息ができなくなったりする事故がある。猫が遊ぶ場所には置かない。
  C:
  - name: 人間用のツナ缶・かつお節
    short: ツナ・かつお節
    emoji: 🐟
    reason: 好きな猫は多いが、塩分や油分、栄養の偏りが心配。あげるなら、無塩・水煮タイプを、ごく少量のごほうびに。
  - name: 味付けなしの加熱した鶏ささみ
    short: ゆでた鶏ささみ
    emoji: 🍖
    reason: 味付けなしで、しっかり加熱し、細かくすれば、ごほうびとして使える。主食にはせず、あげすぎない。
  - name: 猫草以外の草・おやつの草
    short: 草類
    emoji: 🌿
    reason: 猫が草をかじること自体は珍しくない。ただ、農薬や、有毒な植物の可能性があるので、食べさせるなら、猫用に売られているものを。
  D:
  - name: 新鮮な水
    short: 水
    emoji: 💧
    reason: いちばん安全で、いちばん大切。いつでも新鮮な水が飲めるようにしておく。水飲み場を数か所に置くと、飲む量が増えることもある。
  - name: 猫用の総合栄養食フード
    short: 猫用フード
    emoji: 🐈
    reason: 猫の体に必要な栄養をバランスよく考えて作られている。量を守って与えるのがいちばん安心。
  - name: 猫草（猫用に売られているもの）
    short: 猫草
    emoji: 🌱
    reason: 毛玉の排出を助けると言われ、猫が好んでかじることも多い。食べ過ぎて吐くこともあるので、様子を見ながら。
summary: 'Sに入れたのは、少量でも重くなりうる「ユリ・ネギ類・チョコ・人間用の痛み止め・アルコール」。どれも家庭にふつうにあるので、うっかり事故が起こりやすい。特にユリは、花粉をなめたり、花瓶の水を飲んだりするだけでも危険と言われている。

  猫が口にしたかもしれないと思ったら、様子を見ず、食べたものと量を伝えてすぐ動物病院へ。普段から、猫の届かない場所にしまうのがいちばんの予防になる。'
related:
