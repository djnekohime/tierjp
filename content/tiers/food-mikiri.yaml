title: 見切り品で嬉しいもの Tier表
description: お刺身、お寿司、唐揚げ、お肉、パン、ケーキ、お惣菜、お弁当、果物、野菜…夕方のスーパーの見切り品で、見つけると嬉しいものを、AIが「嬉しさ×お得感」でランク付け。
category: food
genre: コンビニ・スーパー
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 見つけたときの嬉しさ

  ② お得感

  ③ 買ってよかった度

  ※ 見切り品は、その日のうちに食べきるのが基本。お肉やお刺身は、特に注意

  '
rank_notes:
  S: 見つけたら小躍り
  D: ちょっと微妙
tiers:
  S:
  - name: お肉（牛肉・豚肉）
    emoji: 🥩
    reason: 半額のお肉は、冷凍しておけば、数日分のごはんが助かる。
  - name: お寿司
    emoji: 🍣
    reason: 半額の、お寿司。ちょっと贅沢な晩ごはんに。
  - name: お刺身
    emoji: 🐟
    reason: 半額のお刺身は、その日のうちに食べきるのが大切。
  A:
  - name: 唐揚げ
    emoji: 🍗
    reason: 夕方の唐揚げ、半額。おかず1品が助かる。
  - name: ケーキ・スイーツ
    emoji: 🍰
    reason: ちょっといいスイーツが、半額で買えたら、幸せ。
  - name: お弁当
    emoji: 🍱
    reason: 半額のお弁当は、晩ごはんをラクにしてくれる。
  - name: パン（焼きたて）
    emoji: 🥐
    reason: 夕方のパン屋さんの、お得な詰め合わせ。
  - name: 天ぷら
    emoji: 🍤
    reason: 半額の天ぷらは、お蕎麦と合わせて。
  B:
  - name: お惣菜
    emoji: 🥘
    reason: コロッケ、煮物、サラダ。お得に1品ふえる。
  - name: 果物
    emoji: 🍎
    reason: 熟れすぎのバナナや、傷みかけの果物。ジャムやスムージーに。
  - name: 野菜（カット済み）
    emoji: 🥬
    reason: 半額のカット野菜は、すぐ使える。
  - name: 牛乳・ヨーグルト
    emoji: 🥛
    reason: 賞味期限が近い乳製品。
  C:
  - name: お弁当の揚げもの
    emoji: 🍤
    reason: 夕方になると、衣がしんなりして、ちょっと残念。
  - name: サラダ
    emoji: 🥗
    reason: 半額だけど、買ったらすぐ食べないと、しなびる。
  D:
  - name: パンの耳
    emoji: 🍞
    reason: 安くて、ラスクにもできる通の買い物。
  - name: 訳ありの果物
    emoji: 🍑
    reason: 見た目はふぞろいだけど、味は変わらない。
summary: '見切り品は、お肉・お寿司・お刺身がS。夕方のスーパーで、半額シールを見つけたときの嬉しさは、格別。

  お肉は冷凍できるけど、お刺身は、その日のうちに食べきるのが基本。

  '
