title: 入浴剤の種類・選び方 Tier表
description: 炭酸系、バスソルト、にごり湯、生薬、入浴剤なし…お風呂の入浴剤を、ゾーマが「気持ちよさ×手入れのラクさ×安全性」でS〜Dにランク付け。
category: kurashi
tags:
- 初心者
- あるある
published: '2026-11-01'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 入って気持ちよいか

  ② お風呂や追い焚きの手入れが少ないか

  ③ 安全性（肌への負担・使用上の注意）

  ※ 入浴剤は、各製品の使用上の注意に従ってください。皮膚の弱い方・持病のある方は医師に相談を'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 炭酸タブレット系
    emoji: 🫧
    reason: しゅわしゅわで気分が上がる。種類が多く、手に入りやすい。
  - name: にごり湯タイプ（白濁）
    emoji: 🥛
    reason: やわらかいお湯の感じで、見た目も癒やされる。使えるかは説明書で確認。
  A:
  - name: 香りを楽しむタイプ（ゆず・ラベンダーなど）
    emoji: 🌸
    reason: 気分転換になる。香りの好みは、事前に試すと安心。
  - name: 少量パックのお試しセット
    emoji: 🎁
    reason: 色々試せて、失敗が少ない。
  - name: ゆず湯（冬至の時期に）
    emoji: 🍊
    reason: 季節感があり、行事としても楽しい。皮を傷つけて入れると香りがよい。
  B:
  - name: バスソルト
    emoji: 🧂
    reason: さっぱりとした入り心地。浴槽や追い焚き設備への影響は、説明書で確認。
  - name: 生薬系・和漢系
    emoji: 🌿
    reason: 落ち着いた香りで、じっくり温まる気分。においの好みが分かれる。
  - name: 重炭酸系
    emoji: ♨️
    reason: ゆっくり温まる感じ。値段は高めなことが多い。
  - name: 入浴剤＋ゆっくり音楽
    emoji: 🎵
    reason: 入浴時間が楽しみに。長湯しすぎには注意。
  - name: バスボム（ギフト向き）
    emoji: 🎀
    reason: 見た目が華やかで、贈り物にも喜ばれる。
  C:
  - name: 発泡力の強すぎるタイプ
    emoji: ⚠️
    reason: 肌が刺激を感じる人もいる。
  - name: 色付きタイプ
    emoji: 🎨
    reason: 見た目は楽しいが、浴槽やタオルへの色移りが気になることも。
  - name: 入浴剤なしのお湯だけ
    emoji: 🚿
    reason: シンプルで手入れはラク。気分転換の楽しみは少なめ。
  D:
  - name: 追い焚き・循環式に、使用不可のものを入れる
    emoji: 🚫
    reason: 機器の故障の原因になる。必ず確認を。
  - name: ペットが近づける状態で入浴剤のお湯を放置
    emoji: 🐾
    reason: なめたり、飲んだりすると危険。浴室のドアは閉める。
  - name: 肌が荒れているときに、刺激の強いものを使う
    emoji: 🩹
    reason: 悪化の原因になる。無理せず、使わない選択を。
summary: '入浴剤は、気分転換にも、湯上がりの満足感にも役立つ。S級は、「ふつうに楽しめて、後始末がラクなもの」。炭酸系のタブレットや、ふつうの白濁タイプは、使いやすく、種類も豊富。

  注意したいのは、追い焚き・循環式の風呂釜に使えないタイプがあること。にごり湯や、粒の入ったタイプは、機器によって向かないものがある。必ず、製品と風呂釜の説明書を確認する。

  また、入浴剤を入れたあと、ペットが浴室に入らないよう気をつける。お湯を飲んでしまうと危ない。肌が弱い日は、入れない、あるいは量を減らす判断も大事。「入浴剤を入れる＝特別な時間」にして、がんばった自分へのごほうびにするのが、いちばん長続きする。'
related:
- food-fuyu-yoru
- kurashi-fuyu-bokan
