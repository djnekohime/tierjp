title: SNS投稿前のチェック項目 Tier表
description: 誤字、個人情報、写り込み、著作権、読み返し…SNSに投稿する前に見ておきたいチェック項目を、ゾーマが「トラブル予防の効果×手軽さ×続けやすさ」でS〜Dにランク付け。
category: sns
tags:
- 初心者
- 安全性
published: '2026-11-10'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① トラブル予防の効果

  ② 手軽さ

  ③ 続けやすさ

  ※ 各SNSの利用規約やルールは、サービスごとに違い、変わることがあります。権利や法律の判断は専門家の助言ではなく目安です。迷ったときは、投稿しない勇気も大切'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 写真の背景（住所・表札・駅名・顔）を確認する
    emoji: 🔍
    reason: 思わぬ写り込みから、場所や生活が特定されることがある。
  - name: 個人情報（本名・住所・電話・勤務先）を書いていないか見る
    emoji: 🛡️
    reason: 一度広まると、取り戻せない。最優先の確認。
  - name: 感情的な投稿は、一晩寝かせてから決める
    emoji: 🌙
    reason: 時間をおくと冷静に判断できる。後悔を減らせる。
  A:
  - name: 誤字・脱字、変換ミスを読み返す
    emoji: ✏️
    reason: 意味が変わることもある。声に出して読むと見つけやすい。
  - name: 他人の写真・作品は、許可と出典を確認する
    emoji: 📜
    reason: 著作権や肖像権のトラブルを防ぐ。
  - name: 他人が写っているものは、本人に確認する
    emoji: 👥
    reason: 写り込みでも、載せられたくない人がいる。
  - name: 位置情報の設定を、投稿前に見直す
    emoji: 📍
    reason: 現在地が分かる設定のまま出すのは、危ない。
  - name: 投稿の目的と、読む人を一度考える
    emoji: 🎯
    reason: 誰に何を伝えたいかが決まり、内容がぶれない。
  B:
  - name: ハッシュタグの内容が、意図と合っているか見る
    emoji: '#️⃣'
    reason: 違う意味に取られたり、予想外の層に届くことがある。
  - name: 画像・動画のサイズや、文字の読みやすさを確認
    emoji: 🖼️
    reason: 見づらいと、伝わらない。スマホでの見え方で確認。
  - name: 宣伝・広告の表記が、必要なものか確認する
    emoji: 📢
    reason: 案件やアフィリエイトは、ルールに沿った表記が必要。
  - name: 引用や、リンク先の内容を確認する
    emoji: 🔗
    reason: リンク先が思っていた内容と違うことがある。
  - name: 投稿の時間帯・頻度を、無理のない範囲にする
    emoji: ⏰
    reason: 続けられる範囲が、いちばん大切。
  C:
  - name: 友達に、事前に見てもらう
    emoji: 🧑‍🤝‍🧑
    reason: 客観的な意見がもらえるが、毎回は頼みにくい。
  - name: AIに、文章の言い回しをチェックしてもらう
    emoji: 🤖
    reason: 便利だが、個人情報は入れない。最終判断は自分で。
  - name: チェックを増やしすぎて、投稿できなくなる
    emoji: 😵
    reason: 完璧を目指すと続かない。5項目くらいに。
  D:
  - name: 勢いのまま、確認せずに投稿する
    emoji: ⚡
    reason: 後悔のもと。消してもスクリーンショットで残ることがある。
  - name: 他人への批判・悪口を、実名や特定できる形で書く
    emoji: 🚫
    reason: 名誉毀損などのトラブルになることがある。
summary: 'SNSの投稿は、押した瞬間に世界へ出ていく。消しても、スクリーンショットなどで残ることがあるので、投稿前の確認は、とても大切な習慣だ。

  S級は、写真の写り込み（住所・顔・表札など）の確認、個人情報を書いていないかの確認、そして一晩寝かせる必要のある投稿は、すぐ出さないこと。この3つは、トラブルをいちばん防いでくれる。

  特に、写真には思わぬ情報が写り込む。窓の外の景色、駅名、制服、車のナンバー。これらから、場所や生活が分かってしまうことがある。投稿前に、写真を拡大して、背景まで確認してみよう。

  他人の写真や、他人の作品を使うときは、許可と出典の確認が必要。音楽や映像は、著作権の扱いが特に厳しいことがある。「みんなが使っているから大丈夫」とは限らない。

  気持ちが高ぶっているときの投稿も、要注意。怒りや悲しみの勢いで書いた文章は、あとで読むと、思ったより強く見えることがある。少し時間をおくと、冷静に見直せる。

  確認のコツは、チェックリストを自分用に作ること。5項目くらいにしておけば、毎回続けられる。慣れてくると、数秒で終わる。あなたの発信を、あなた自身が守れるように、気楽に習慣にしてみてね。

  投稿してしまってから気づいたときは、慌てずに、まず投稿を非公開にするか削除する。その上で、必要があれば、関係する人にお詫びと説明をしよう。

  SNSは、楽しい交流の場。必要以上に怖がらなくても大丈夫。ただ、ほんの少しの確認で、多くのトラブルは防げる。あなたの発信が、あなたも読む人も、気持ちよくなるものでありますように。'
