      reason: '"IQレスラー"と呼ばれた桜庭和志の息子。偉大な父を持つ2世ファイターとして、これからの成長に期待が集まる。'
summary: |
  ライト級は2026年に王者が交代。グスタボがノジモフを一撃で沈め、新王者になった。前王者ノジモフ、柔術の天才サトシ、UFC経験者たちが王座を狙う。
  フェザー級より選手の数は少ないが、1発で試合が終わる重い打撃の迫力はこの階級ならでは。
  ※ 選手の状況（引退・階級変更・移籍など）は変わることがあります。最新情報はRIZIN公式サイトで確認してください。
