title: カレーと合わせる飲み物 Tier表
description: 水、ラッシー、牛乳、ビール、麦茶、ウーロン茶、チャイ、コーラ、マンゴージュース、ハイボール…カレーと一緒に飲むならどれ？AIが「辛さをやわらげる度×相性」でランク付け。
