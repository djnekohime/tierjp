rank_notes:
  S: カレーの相棒
  D: 通の組み合わせ
tiers:
  S:
  - name: 水
    emoji: 💧
    reason: カレー屋さんで最初に出てくる、一番の相棒。冷たい水でリセットしながら食べる。
  - name: ラッシー
    emoji: 🥛
    reason: インドのヨーグルトドリンク。甘くてまろやかで、辛さをやさしく包んでくれる。
  - name: 牛乳
    emoji: 🐄
    reason: 辛さをやわらげると言われる、昔からの組み合わせ。家のカレーの横にはこれ。
  A:
  - name: ビール
    emoji: 🍺
    reason: スパイスのきいたカレーに、冷えたビール。大人の組み合わせ。
  - name: 麦茶
    emoji: 🌾
    reason: 家のカレーの定番。香ばしくて、口の中がすっきりする。
  - name: ウーロン茶
    emoji: 🍵
    reason: 油っこさを流してくれる。カツカレーのときに特に。
  - name: チャイ
    emoji: ☕
    reason: スパイスとミルクの甘いお茶。インドカレーのあとに。
  B:
  - name: コーラ
    emoji: 🥤
    reason: 甘くてシュワっと。子供のころの、カレーのごちそうの日の味。
  - name: ジンジャーエール
    emoji: 🫚
    reason: 生姜の香りがスパイスとよく合う。
  - name: マンゴージュース
    emoji: 🥭
    reason: 甘いマンゴーで、辛さがやわらぐ。インドカレー屋さんで人気。
  - name: ハイボール
    emoji: 🥃
    reason: 炭酸ですっきり。脂っこいカレーにも合う。
  C:
  - name: 炭酸水
    emoji: 🫧
    reason: すっきりするけど、炭酸で辛さが強く感じることも。
  - name: 赤ワイン
    emoji: 🍷
    reason: ビーフカレーなら合う。スパイスが強いカレーには少し重い。
  D:
  - name: 白ワイン
    emoji: 🥂
    reason: シーフードカレーやグリーンカレーに合わせる、通の組み合わせ。
  - name: 熱いほうじ茶
    emoji: 🫖
    reason: 食べ終わりに飲むと、口の中がほっと落ち着く。
summary: 'カレーの飲み物は、水・ラッシー・牛乳がS。辛いカレーには、乳製品のまろやかさが助けてくれる。

  家のカレーには麦茶、インドカレーにはラッシーやチャイ、大人の夜にはビール。カレーの種類で選ぶと楽しい。

  '
