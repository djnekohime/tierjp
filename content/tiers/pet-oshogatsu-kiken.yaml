title: お正月にペットが危ないもの Tier表
description: おせち、お餅、お酒、ネギ類、お年玉の袋、飾り、来客、花火・爆竹の音、帰省…お正月にペットが危ないものを「危険度・起こりやすさ」でS〜Dにランク付け。年末年始の動物病院は休みが多いので、事前の備えに。
category: animals
tags: [ペット, 犬, 猫, 年末年始]
published: 2026-10-05
labels:
  S: 命に関わる
  A: 要注意
  B: 気をつけたい
  C: 心がけたい
  D: 小さな落とし穴
criteria: |
  ① 命や健康への危険度
  ② 起こりやすさ（お正月ならではか）
  ③ 飼い主が防ぎやすいか
  ※ 一般的な注意点の整理です。ペットの種類・体重・体調で、影響は変わります。心配なときは、すぐに動物病院に相談してください。年末年始は、休診の病院が多いので、救急対応の病院を、事前に調べておくと安心です
rank_notes:
  S: 絶対に近づけない
  D: 気をつけたい小さなこと
tiers:
  S:
    - name: ネギ類（おせち・お雑煮・お鍋に入っている玉ねぎ・長ねぎ）
      short: ネギ類
      emoji: "🧅"
      reason: 犬や猫には、中毒の危険がある。加熱しても、危険は残る。おせちや、お鍋の具を、与えない。
    - name: お酒・みりん・アルコールの入った料理
      short: お酒・アルコール
      emoji: "🍶"
      reason: 少量でも、危険になることがある。お屠蘇や、おせちの味つけにも、注意する。
    - name: 誤飲しやすいもの（お餅・串・竹串・アルミホイル・ひも）
      short: お餅・串・ひも
      emoji: "🍡"
      reason: のどに詰まったり、腸に詰まったりする危険がある。ごみ箱は、ふた付きにするか、手の届かない場所へ置く。
  A:
    - name: 人間用のごちそう（脂っこいもの・味の濃いもの）
      short: ごちそう
      emoji: "🍖"
      reason: 脂肪や、塩分が多すぎて、膵炎や、体調不良の原因になることがある。おすそ分けは、ペット用のものに。
    - name: チョコレート・甘いお菓子（キシリトール入りも）
      short: チョコ・お菓子
      emoji: "🍫"
      reason: チョコは、中毒を起こす。キシリトールは、犬に危険。お菓子の置き場所に、気をつける。
    - name: ぶどう・干しぶどう（おせち・おやつに入っていることも）
      short: ぶどう・干しぶどう
      emoji: "🍇"
      reason: 犬で、腎臓の障害を起こすことがある。少量でも、避ける。
    - name: 来客と、玄関・窓からの脱走
      short: 来客と脱走
      emoji: "🚪"
      reason: 人の出入りが多く、ドアが開く機会が増える。迷子札やマイクロチップの情報も、確認する。
    - name: 花火・爆竹・年越しの大きな音
      short: 花火・爆竹の音
      emoji: "🎆"
      reason: 驚いて、パニックになったり、逃げ出したりすることがある。静かな部屋で、安心できる場所を作る。
  B:
    - name: 飾り物（しめ飾り・正月の花・鏡餅）
      short: 正月飾り
      emoji: "🎍"
      reason: かじると、危ないものがある。猫が届かない高さに飾る。ユリ科の花は、猫にとって、非常に危険。
    - name: お年玉の袋・ポチ袋・お金
      short: お年玉の袋
      emoji: "🧧"
      reason: 小さくて、誤飲しやすい。遊び道具にしないように、片づける。
    - name: 暖房器具（こたつ・ストーブ）
      short: 暖房器具
      emoji: "🔥"
      reason: やけどや、脱水の心配がある。ペットだけを、こたつに残さない。
    - name: 帰省・旅行での、環境の変化
      short: 帰省・旅行
      emoji: "🧳"
      reason: 慣れない場所は、ストレスになる。預けるなら、早めに予約し、普段のごはんも渡す。
    - name: 飼い主の不在・留守番が長くなる
      short: 長い留守番
      emoji: "🕰️"
      reason: 寒さ・水・トイレの準備を、いつも以上に、しっかりする。
  C:
    - name: 年末年始の動物病院の休診
      short: 病院の休診
      emoji: "🏥"
      reason: いつもの病院が、休みのことがある。救急で、診てくれる病院を、事前に、調べておく。
    - name: 持病の薬・フードの不足
      short: 薬・フードの不足
      emoji: "💊"
      reason: 年末年始の分を、早めに用意する。
    - name: 来客を、怖がるペットのストレス
      short: 来客のストレス
      emoji: "😿"
      reason: 逃げ込める部屋を作り、無理に触らせない。
  D:
    - name: お正月の写真撮影で、仮装などをさせる
      short: 無理な仮装
      emoji: "🎀"
      reason: 嫌がるときは、すぐやめる。短時間で。
    - name: いつもと違う生活リズムで、食べすぎ・運動不足になる
      short: 生活リズムの乱れ
      emoji: "⚖️"
      reason: おやつの量と、散歩の時間を、できるだけ普段どおりに。
summary: |
  お正月のSは、「ネギ類」「お酒・アルコール」「お餅・串・ひもの誤飲」。おせちやお雑煮には、ペットに危険なものが、意外と多い。
  ペットには、ペット用のごちそうを。年末年始は、動物病院が休みになりやすいので、救急病院の連絡先を、今のうちに調べておこう。
related: [pet-fuyu-kiken, inu-kiken, food-osechi]
