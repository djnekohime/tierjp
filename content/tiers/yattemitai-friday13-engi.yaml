title: 13日の金曜日にやってみたい、気楽な験担ぎ Tier表
description: いつもの道を変える、ラッキーカラー、おいしいごはん、早めに寝る…13日の金曜日を「ちょっといい日」に変える気楽な験担ぎを、ゾーマが「楽しさ×気軽さ×気持ちが明るくなるか」でS〜Dにランク付け。
category: yattemitai
tags:
- 初心者
- あるある
published: '2026-11-13'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 楽しさ

  ② 気軽さ

  ③ 気持ちが明るくなるか

  ※ 13日の金曜日は、国や文化によって受け止め方が違う、迷信や言い伝えのひとつです。科学的な根拠があるものではなく、「気持ちを楽しくするための遊び」として楽しんでください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: いつもよりおいしいものを食べる
    emoji: 🍰
    reason: 気分が上がり、一日がいい日になる。お金をかけすぎなくてOK。
  - name: 好きな色や、お気に入りの小物を身につける
    emoji: 🎀
    reason: 「今日の私は大丈夫」と思える、気持ちのお守りになる。
  - name: 早めに寝て、しっかり休む
    emoji: 🌙
    reason: 験担ぎ以上に、体と気持ちを整えてくれる。
  A:
  - name: いつもと違う道を通ってみる
    emoji: 🛤️
    reason: 新しい発見があり、気分転換になる。歩きなれない道は、安全に注意。
  - name: 朝いちばんに、窓を開けて深呼吸する
    emoji: 🌤️
    reason: 空気が入れかわり、気持ちもリセットされる。
  - name: 感謝していることを、ひとつ書き出してみる
    emoji: 📝
    reason: 気持ちが落ち着き、前向きになれる。
  - name: 身の回りを、少しだけ片づける
    emoji: 🧹
    reason: 場が整うと、気持ちも整う。
  - name: 好きな音楽を、一曲じっくり聞く
    emoji: 🎵
    reason: 気分が明るくなり、集中力も戻る。
  B:
  - name: ラッキーカラーを、ひとつ決めて取り入れる
    emoji: 🌈
    reason: 小さな楽しみになり、会話のきっかけにもなる。
  - name: 友だちや家族に、「いい日だね」と声をかける
    emoji: 💬
    reason: 気持ちが伝わり、お互い明るくなる。
  - name: 13のつく数字で、遊んでみる（13時13分に写真を撮るなど）
    emoji: 🕐
    reason: ゆるい遊びとして楽しめる。
  - name: ペットと、のんびり過ごす時間をつくる
    emoji: 🐈
    reason: 癒されて、心が落ち着く。
  - name: お気に入りのカフェで、ちょっとひと息つく
    emoji: ☕
    reason: 自分へのごほうびになる。
  - name: 13日の金曜日を、話のタネにして話す
    emoji: 🗣️
    reason: ちょっとした雑談が、盛り上がる。
  C:
  - name: ホラー映画を見て、わざと怖がる
    emoji: 🎬
    reason: 盛り上がるが、苦手な人や、夜に見ると眠れなくなる人も。
  - name: お守りやパワーストーンに、頼りきる
    emoji: 📿
    reason: 気持ちの支えにはなるが、それだけで解決するわけではない。
  - name: 占いを、何件もはしごする
    emoji: 🔮
    reason: 楽しいが、見すぎて気分が下がることもある。
  D:
  - name: 不吉だからと、予定を急に変える
    emoji: 🙅
    reason: 大事な予定を、迷信だけで動かすと、かえって困る。
  - name: 一日中、悪いことが起きないか怯えて過ごす
    emoji: 😨
    reason: 気持ちが沈み、せっかくの一日がもったいない。
  - name: 「縁起が悪いから」と、家族や友だちを責める
    emoji: 💢
    reason: 迷信を人に押しつけると、関係が悪くなる。
summary: '13日の金曜日は、西洋で「不吉な日」と言われてきた迷信。日本ではあまり気にされないが、「今日は13日の金曜日だね」と話題にするだけで、ちょっとした話のきっかけになる。そして、せっかくなら、「不吉な日」を「ちょっといい日」に変えてしまうのが、ゾーマ流だ。

  S級は、「いつもよりおいしいものを食べる」「好きな色や、お気に入りの小物を身につける」「早めに寝て、しっかり休む」といった、気持ちが明るくなる験担ぎ。どれも、お金も手間もほとんどかからず、そのうえ、体にも優しい。

  験担ぎは、結果を変える魔法ではなく、「気持ちを整えるスイッチ」だと考えると、うまく付き合える。「今日はこれをしたから大丈夫」と思えるだけで、気持ちが落ち着き、いつもの力が出しやすくなる。

  反対に、D級の「不吉だから、何もしないで家にこもる」や「予定を無理にずらす」は、かえって気持ちが沈んでしまう。大事な予定や、通院、仕事などを、迷信だけで変えるのは、おすすめしない。迷信は、あくまで、遊びとして楽しむもの。

  ちなみに、日本には、「大安」「仏滅」のような、独自の暦の考え方もある。こうした言い伝えは、昔の人が、気持ちを整えるために作ったもの。「へえ、そんな風習があるんだ」と、ゆるく楽しむくらいが、ちょうどいい。

  13日の金曜日は、年に1〜3回やってくる。次の13日の金曜日にも、お気に入りの験担ぎを、ひとつ試してみてほしい。猫と一緒に、日向ぼっこをするのも、立派な験担ぎだ。'
