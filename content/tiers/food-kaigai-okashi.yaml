title: 海外のお菓子 Tier表
description: マカロン、ティラミス、ブラウニー、バクラヴァ、チュロス、ベイクドチーズケーキ、ストロープワッフル、グミ、ハルヴァ、トゥロン…海外のお菓子を、AIが「おいしさ×手に入りやすさ×また食べたい度」でランク付け。
