tiers:
  S:
  - name: マカロン
    emoji: 🍬
    reason: カラフルで、サクッとふんわり。フランスのお菓子の代表。
  - name: ティラミス
    emoji: ☕
    reason: コーヒーとチーズのクリーム。イタリアのデザートの定番。
  - name: ブラウニー
    emoji: 🍫
    reason: しっとり濃厚なチョコ菓子。アメリカの家庭の味。
  A:
  - name: チュロス
    emoji: 🥖
    reason: スペインの揚げ菓子。シナモンシュガーで、外はカリッと中はふわっと。
  - name: ストロープワッフル
    emoji: 🧇
    reason: オランダの、キャラメルをはさんだワッフル。紅茶とよく合う。
  - name: ベイクドチーズケーキ
    emoji: 🧀
    reason: 濃厚でしっとり。ニューヨークスタイルが人気。
  - name: クッキー（バタークッキー）
    short: バタークッキー
    emoji: 🍪
    reason: デンマークの缶入りのクッキーなど。おみやげの定番。
  - name: ガトーショコラ
    emoji: 🍰
    reason: フランスのチョコレートケーキ。濃厚で、しっとり。
  B:
  - name: バクラヴァ
    emoji: 🥜
    reason: トルコの、ナッツとパイのシロップ漬け。とても甘い。
  - name: ハルヴァ
    emoji: 🟫
    reason: ごまの、中東のお菓子。ほろっとした食感。
  - name: トゥロン
    emoji: 🍯
    reason: スペインの、ナッツとはちみつのお菓子。
  - name: ヨーロッパのグミ
    emoji: 🐻
    reason: かたくて、弾力があって、噛みごたえ抜群。
  C:
  - name: サルミアッキ
    emoji: ⚫
    reason: 北欧の、しょっぱい甘草のお菓子。世界一まずいと言われることも。
  - name: ターキッシュディライト
    emoji: 🍡
    reason: トルコの、もちもちのゼリー菓子。甘さが強い。
  D:
  - name: ストルーデル
    emoji: 🥧
    reason: オーストリアの、りんごを薄い生地で巻いたお菓子。
  - name: ババ・オ・ラム
    emoji: 🍷
    reason: お酒のシロップに浸した、フランスの大人のお菓子。
summary: '海外のお菓子は、マカロン・ティラミス・ブラウニーがS。日本でも人気で、手に入りやすい。

  バクラヴァやトゥロンのような、旅先で出会うお菓子もおもしろい。旅行のおみやげにも。

  '
