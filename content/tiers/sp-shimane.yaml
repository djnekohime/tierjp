title: 島根県のスーパー Tier表
description: 島根県の地元スーパーや生協、全国チェーンを、AIが「県内での存在感×使い勝手と個性×気軽さ」でS〜Dにランク付け。
category: super
tags:
- グルメ
- あるある
published: '2026-10-09'
labels:
  S: 県の顔
  A: 地域の主役
  B: 頼れる地元チェーン
  C: こぢんまり個性派
  D: ニッチ・特化型
criteria: '① 県内での存在感（店舗網・知名度・地域への根づき）

  ② 使い勝手と個性（品ぞろえ・業態・特色）

  ③ 気軽さ（行きやすさ・親しみやすさ）

  ※ AIは全店を回ったわけではありません。公開されている企業情報（本社・展開地域・規模など）とAIの印象で並べています。ランクは値段の安さやお店の良し悪しではなく、「県内での存在感・使い勝手・個性」の目立ち方です。店舗数や運営会社は変わるので、お出かけ前に公式サイトで確認してください（2026年10月時点）'
rank_notes:
  S: この県ならまず思い浮かぶ
  D: 特定の地域や用途に特化
tiers:
  S:
  - name: キヌヤ
    emoji: 🏔️
    reason: 益田市に本社を置く。1935年創業で、島根県西部と山口県北浦地方を営業基盤とするスーパー。
  A:
  - name: ウシオ（グッディー）
    emoji: 🌅
    reason: 出雲市を営業基盤とするスーパー「グッディー（Good Day）」を運営する企業。
  - name: みしまや
    emoji: 🌿
    reason: 松江市に本社を置き、スーパー事業を行う企業。CGCグループ加盟。
  - name: 丸合
    emoji: 🦀
    reason: 鳥取県米子市に本部を置き、鳥取・島根の両県でスーパーを運営する企業。
  - name: イオン（イオンリテール）
    emoji: 🌳
    reason: 千葉市の幕張新都心に本社を置く。東北を除く本州と四国で、総合スーパー（GMS）とスーパー（SM）の「イオン」「イオンスタイル」などを展開するイオングループの企業。
  B:
  - name: フーズマーケットホック
    emoji: 🐟
    reason: 島根・鳥取で営業するスーパー。さえきセルバHDグループ。
  - name: ラピタ（JAしまね）
    emoji: 🌾
    reason: 松江市に本店を置く島根県農業協同組合の、スーパー事業。県内全域が事業区域。
  C:
  - name: マルイ（津山）
    emoji: 🌸
    reason: 岡山県津山市に本部を置き、岡山・鳥取・島根でスーパー事業を展開する企業。
  D:
  - name: Gクラブ（吉寅商店）
    emoji: 🛒
    reason: 浜田市に本社を置く。島根・山口で食品卸売を展開し、会員制の食品スーパー「Gクラブ」も運営する。
summary: '島根は、益田のキヌヤ、出雲のウシオ（グッディー）、松江のみしまやなど、地域ごとに地元のスーパーが根づく県。

  松江に本店を置くJAしまねのAコープ（ラピタ）や、鳥取発の丸合も、県内の暮らしを支えている。'
