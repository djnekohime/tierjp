title: もんじゃ焼きの具 Tier表
description: 明太子、チーズ、餅、カレー、ベビースター、コーン、キムチ、豚肉、海鮮、ツナ、あんこ、ミックス…もんじゃ焼きの具を、AIが「おいしさ×もんじゃらしさ」でランク付け。
category: food
genre: 麺・粉もの
tags:
