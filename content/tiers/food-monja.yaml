criteria: '① もんじゃの生地とのバランス

  ② 「もんじゃ焼きらしい」おいしさ

  ③ 鉄板でこげこげにしたくなるか

  ※ 特定のお店ではなく「具の種類」のランキングです

  '
rank_notes:
  S: もんじゃの三大スター
  D: 通のトッピング
tiers:
  S:
