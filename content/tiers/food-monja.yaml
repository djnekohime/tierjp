  - name: チーズ
    emoji: 🧀
    reason: とろーり溶けて、こげたところがパリパリ。たまらない。
  - name: 餅
    emoji: 🍡
    reason: とろっとのびる餅と、もんじゃの組み合わせ。明太餅チーズは最強。
  A:
  - name: ミックス（豚肉・イカ）
    short: ミックス
    emoji: 🐷
    reason: 具がいろいろ入った定番。迷ったらこれ。
  - name: カレー
    emoji: 🍛
    reason: カレー粉の香りで、子供も食べやすい。
  - name: コーン
    emoji: 🌽
    reason: 甘くてプチプチ。子供に人気。
  - name: キムチ
    emoji: 🥬
    reason: ピリ辛で、ビールに合う。
  - name: 海鮮
    emoji: 🦐
    reason: エビやイカがたっぷり。ぜいたくなもんじゃ。
  B:
  - name: ベビースター
    emoji: 🍜
    reason: サクサクの食感がアクセント。もんじゃの定番トッピング。
  - name: ツナ
    emoji: 🐟
    reason: コクが出る。コーンやチーズと組み合わせて。
  - name: ベーコン
    emoji: 🥓
    reason: 香ばしくて、チーズと相性がいい。
  - name: ほうれん草
    emoji: 🥬
    reason: ほうれん草とベーコン、洋風もんじゃ。
  C:
  - name: 納豆
    emoji: 🫘
    reason: 意外と合うけど、好き嫌いが分かれる。
  - name: カニカマ
    emoji: 🦀
    reason: 彩りは華やかだけど、味の主役にはなりにくい。
  D:
  - name: あんこ・デザートもんじゃ
    short: デザートもんじゃ
    emoji: 🫘
    reason: あんこや、チョコ、バナナで作る、デザート用のもんじゃ。通好み。
  - name: カレーライス風（ご飯入り）
    short: ご飯入り
    emoji: 🍚
    reason: ご飯を入れて、焼きカレーのようにする食べ方。
summary: 'もんじゃ焼きの具は、明太子・チーズ・餅がS。「明太もちチーズ」は、もんじゃ屋さんの人気メニュー。

  鉄板でこげこげにしたところを、小さなヘラでかきとって食べるのが、一番おいしい。

  '
