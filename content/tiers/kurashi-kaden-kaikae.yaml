title: 家電の買い替えのサイン Tier表
description: 異音、焦げ臭いにおい、電源が入らない、冷えない…家電の買い替えのサインを、AIが「危険度×修理の難しさ」でS〜Dにランク付け。
category: kurashi
tags:
- 家電
- 節約
published: '2026-10-07'
labels:
  S: すぐ使用をやめる
  A: 早めに点検・買い替え
  B: 様子を見て検討
  C: 状況しだい
  D: まだ使える
criteria: '① 安全面の危険度（発火・感電など）

  ② 修理の難しさ・費用

  ③ 放っておくとどうなるか

  ※ 目安です。メーカーの修理窓口で、使用年数や保証の確認をしてください。焦げ臭い・煙・発熱があるときは、すぐ電源を切り、プラグを抜いてください'
rank_notes:
  S: 安全のため、すぐ使用をやめる
  D: まだ使い続けても問題が出にくい
tiers:
  S:
  - name: 焦げ臭いにおい・煙が出る
    emoji: 🔥
    reason: 発火のおそれ。すぐ電源を切り、プラグを抜いて、使用をやめる。
  - name: コードやプラグが異常に熱い・変形している
    emoji: 🔌
    reason: 火災の原因になる。そのまま使わず、点検・交換を。
  - name: 電気が漏れる感じ（ピリッとする）
    emoji: ⚡
    reason: 感電の危険。触らず、使用をやめて、メーカーや販売店に連絡する。
  A:
  - name: 電源が入ったり入らなかったりする
    emoji: 🔘
    reason: 基板や配線の不調の可能性。使い続けると、急に壊れることも。
  - name: 異常な大きな音・振動
    emoji: 🔊
    reason: 部品の摩耗や故障のサイン。放置すると悪化する。
  - name: 冷蔵庫が冷えない・水が漏れる
    emoji: 🧊
    reason: 食品が傷む。ほかの冷蔵庫に移して、点検を。
  - name: エアコンから水漏れ・異臭
    emoji: 💧
    reason: ドレンの詰まりや、カビの可能性。まず掃除、直らなければ点検を。
  B:
  - name: 使用年数が10年を超えた（冷蔵庫・エアコンなど）
    emoji: 📅
    reason: 設計上の使用期間の目安。電気代も省エネ新型のほうが安くなることがある。
  - name: 洗濯機が止まる・エラーが出る
    emoji: 🧺
    reason: 部品の故障の可能性。まず説明書で確認し、直らなければ修理か買い替えを。
  - name: 電子レンジが温まらない・火花が出る
    emoji: 🍽️
    reason: 火花が出たら使用をやめる。温まらないのも、部品の寿命のサイン。
  C:
  - name: 電気代が、前より高くなった気がする
    emoji: 💴
    reason: 古い家電の消費電力が大きいことがある。まず使い方を見直す。
  - name: ボタンが反応しにくい
    emoji: 🔘
    reason: 掃除で直ることもある。修理が安く済む場合も。
  - name: リモコンの反応が悪い
    emoji: 📡
    reason: 電池交換や、センサーの掃除で直ることが多い。
  D:
  - name: 見た目が古くなった
    emoji: 🕰️
    reason: 機能に問題がなければ、まだ使える。
  - name: 新型が出た
    emoji: 🆕
    reason: 今のものが問題なく使えているなら、急がなくてよい。
summary: '家電は、「壊れたら買い替える」より、「危ないサインが出たら使うのをやめる」ほうが安全。S級の、焦げ臭いにおい・煙・コードやプラグの異常な熱は、火災につながるおそれがある。

  冷蔵庫やエアコンのような大型家電は、設計上の使用期間（目安10年前後）を過ぎたら、買い替えを考える。'
related:
- kurashi-fuyu-setsuden
- bousai-teiden
- kurashi-osouji-basho
