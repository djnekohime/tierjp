title: グラタン・ドリアの具 Tier表
description: マカロニ、鶏肉、エビ、きのこ、ほうれん草、チーズ…寒い日に食べたいグラタン・ドリアの具を、ゾーマが「ホワイトソースとの相性×満足感×作りやすさ」でS〜Dにランク付け。
category: food
genre: ご飯もの
tags:
- グルメ
published: '2026-11-18'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① ホワイトソースとの相性

  ② 満足感（食べごたえ・彩り）

  ③ 作りやすさ・手に入りやすさ

  ※ 家庭や地域で定番は違います。好みで入れ替えて楽しんでください'
rank_notes:
  S: ないと寂しい
  D: 好みが分かれる・変わり種
tiers:
  S:
  - name: 鶏肉
    emoji: 🍗
    reason: ほどよい旨みで、ソースによく合う。火が通りやすく、ごろっと食べごたえも出る定番。
  - name: 玉ねぎ
    emoji: 🧅
    reason: 炒めると甘みが出て、ソースのコクが増す。ほとんど全部のグラタンに合う、土台の具。
  - name: チーズ（とろけるタイプ）
    emoji: 🧀
    reason: 焦げ目と、のびる食感が主役。これがないと、グラタンらしさが半減する。
  - name: マカロニ
    emoji: 🍝
    reason: ソースがよく絡み、つるんとした食感。具がなくても成立する、基本の主役。
  A:
  - name: エビ
    emoji: 🦐
    reason: ぷりっとした食感と、海の旨み。ソースと合わせると、ぐっとごちそう感が出る。
  - name: マッシュルーム・しめじ
    emoji: 🍄
    reason: ソースの旨みを吸って、香りもよい。炒めてから入れると、水っぽくならない。
  - name: ほうれん草
    emoji: 🥬
    reason: 彩りが加わり、栄養も足せる。下ゆでして水気を絞ってから入れるのがコツ。
  - name: ブロッコリー
    emoji: 🥦
    reason: 緑が映え、ほくほくした食感。冷凍でも使いやすく、ストックしやすい。
  - name: ベーコン
    emoji: 🥓
    reason: 塩気と燻製の香りで、味にメリハリが出る。少量でも、ぐっと旨みが増す。
  - name: じゃがいも
    emoji: 🥔
    reason: ほくほくでお腹にたまる。薄切りにして重ねると、グラタンらしい一皿に。
  B:
  - name: ホタテ
    emoji: 🦪
    reason: やわらかい甘みで、贅沢な気分になる。値段は少し上がるが、特別な日向き。
  - name: かぼちゃ
    emoji: 🎃
    reason: ほくほくと甘く、ソースとよく合う。冬至の時期にもぴったり。
  - name: コーン
    emoji: 🌽
    reason: 甘みと彩りが加わる。ドリアに入れると、子どもにも人気が出やすい。
  - name: ハム・ソーセージ
    emoji: 🌭
    reason: 手軽に旨みを足せる。冷蔵庫にあるもので作りたい日の味方。
  - name: 白身魚
    emoji: 🐟
    reason: あっさりした旨みで、魚のグラタンに。骨を取り除いてから入れる。
  - name: カニ風味かまぼこ
    emoji: 🦀
    reason: 彩りが華やかになり、手軽。ソースと合わせると、ほんのり甘い。
  C:
  - name: ミートソース
    emoji: 🍅
    reason: ミートドリア風になり、味が濃厚。ホワイトソースと重ねるなら、量は控えめにしたい。
  - name: ひき肉
    emoji: 🥩
    reason: 旨みは出るが、ほぐれて脂が出やすい。しっかり炒めて脂を切ると食べやすい。
  - name: カレー粉でアレンジ
    emoji: 🍛
    reason: カレードリア風になり、スパイシー。ホワイトソースの風味は変わる。
  D:
  - name: 水分の多い生野菜（トマトなど）を生で入れる
    emoji: 💦
    reason: 焼いている間に水が出て、ソースが水っぽくなりやすい。先に炒めて水分をとばしたい。
  - name: 味の強すぎる具（キムチなど）をたっぷり入れる
    emoji: 🌶
    reason: ソースの味とぶつかり、まとまりにくい。変わり種として少量で楽しむ程度に。
  - name: ソースが熱いうちに、焼かずにすぐ食べる
    emoji: 🔥
    reason: やけどの原因になる。少し冷まして、表面の焦げ目も楽しんでから食べたい。
summary: 'グラタンやドリアは、ホワイトソースとチーズの「こんがり焦げ目」があれば、具が何でも一気にごちそうになる料理。だから具選びは、ソースの味を邪魔せず、食感でアクセントをつけられるかがポイントだ。

  S級に置いたのは、鶏肉・玉ねぎ・チーズ・マカロニ。どれもソースと相性がよく、ほとんどの家庭で用意しやすい。特に玉ねぎは、炒めて甘みを出すとソースのコクがぐっと増す。

  A級のエビ・きのこ・ほうれん草・ブロッコリーは、彩りと食感が加わり、見た目も華やかになる。冷凍エビや冷凍ブロッコリーなら、ストックしておけて手軽。

  反対にD級の「生のまま入れる水分の多い野菜」「味の強すぎる具」は、ソースが水っぽくなったり、味がぶつかったりしやすい。トマトやキムチなどは、チャレンジ枠として楽しむくらいがちょうどいい。

  おいしく作るコツは、具を先に炒めて水分をとばすこと。具材の下ごしらえをしておくだけで、焼いたあとにソースが水っぽくなりにくい。ドリアなら、ご飯はバターで軽く炒めておくと、ソースとなじんで味がまとまる。焼く前にチーズをたっぷりのせ、オーブンかトースターで焦げ目がつくまで焼けば完成。熱々なので、やけどには気をつけて、少し冷ましてから食べよう。残ったら冷蔵して、翌日は温め直して食べるのもおすすめ。冬の食卓の定番として、ぜひお気に入りの組み合わせを見つけてほしい。

  具の組み合わせは、鶏肉＋玉ねぎ＋マカロニの王道か、エビ＋ブロッコリーの華やか系、きのこ＋ベーコンのコク系の3パターンから選ぶと迷わない。まずは王道で一度作って、次回から1品だけ入れ替えてみると、自分の好みの味が見つかりやすい。'
