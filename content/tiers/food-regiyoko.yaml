title: レジ横でつい買うもの Tier表
description: 唐揚げ、肉まん、フライドチキン、おでん、アメリカンドッグ、淹れたてコーヒー、あんまん、コロッケ、焼き鳥、ガム…コンビニのレジ横で、つい買ってしまうものを、AIが「誘惑度×満足度」でランク付け。
category: food
genre: コンビニ・スーパー
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① レジで目に入ったときの誘惑度

  ② 買ったあとの満足度

  ③ 「また買っちゃった」と思う回数

  ※ 特定のコンビニや商品ではなく「種類」のランキングです

  '
rank_notes:
  S: 誘惑の三大スター
  D: 気づいたら買ってる
tiers:
  S:
  - name: 唐揚げ
    emoji: 🍗
    reason: レジ横の王様。お弁当を買ったのに、つい追加してしまう。
  - name: 肉まん
    emoji: 🥟
    reason: 寒くなると、あの湯気に負ける。冬のレジ横の主役。
  - name: フライドチキン
    emoji: 🍖
    reason: 骨付きでも骨なしでも。おなかが空いているときは、だいたい負ける。
  A:
  - name: おでん
    emoji: 🍢
    reason: 秋冬の楽しみ。だしの香りで、つい「大根と卵」と言ってしまう。
  - name: アメリカンドッグ
    emoji: 🌭
    reason: 甘い生地とソーセージ。ケチャップとマスタードで。
  - name: 淹れたてコーヒー
    emoji: ☕
    reason: 安くておいしい。毎日の習慣になっている人も多い。
  - name: あんまん
    emoji: 🫘
    reason: 甘いものが食べたい日の、あったかい誘惑。
  B:
  - name: コロッケ
    emoji: 🥔
    reason: 安くてホクホク。おかずにもう1品。
  - name: フライドポテト
    emoji: 🍟
    reason: 揚げたてを見ると、つい。
  - name: 焼き鳥
    emoji: 🍢
    reason: 1本からでも買える、晩酌のお供。
  - name: ドーナツ
    emoji: 🍩
    reason: コーヒーと一緒に、ついでに。
  C:
  - name: ガム
    emoji: 🟩
    reason: レジの前に並んでいると、なんとなく手に取ってしまう。
  - name: のど飴
    emoji: 🍬
    reason: 乾燥する季節に、ついでに1袋。
  D:
  - name: キャラクターくじ
    short: キャラくじ
    emoji: 🎰
    reason: レジの奥に並ぶ景品を見ると、1回だけ…が止まらない。
  - name: 乾電池
    emoji: 🔋
    reason: 「そういえば家のリモコン…」と思い出して、ついでに買う。
summary: 'レジ横でつい買うものは、唐揚げ・肉まん・フライドチキンがS。寒くなると肉まんとおでんの誘惑が一気に強くなる。

  お弁当を買ったのに、唐揚げをもう1つ。それがレジ横の魔力。

  '
related:
- food-hot-snack
- food-conbini-bento
- food-oden
