  - name: ファイル名が「無題」「image1」のまま増やす
    emoji: ❓
    reason: あとで見分けがつかなくなる。
  - name: 規約を確認せず、商用で使う
    emoji: 📉
    reason: 利用停止やトラブルのリスクがある。
summary: 'AIで作ったものは、数が増えるのが早い。気づいたら数百枚になっていて、「あのときのあれ、どこ？」となりがち。

  S級は、プロンプト（AIへの指示文）も一緒に保存しておくこと。同じものをもう一度作りたいときや、少し変えたいときに、指示文がないと再現が難しい。

  フォルダは、日付と用途で分けておくと探しやすい。たとえば「2026-11/画像/ブログ用」のように、あとから見て分かる名前にしよう。

  バックアップは、安心のために必須。パソコンが壊れると、作ったものが全部消えてしまう。クラウドや外付けのディスクに、定期的に保存しておくと安心。

  AIで作ったものを公開するときは、サービスの規約を確認すること。商用利用の可否、クレジット表記、AI生成と明記する必要があるかなど、ルールが違う。

  人物の写真や、他人の作品に似すぎたものは、トラブルのもと。実在の人物に似たものを作ったり、公開したりするときは、特に注意が必要。

  整理のコツは「作ったらすぐ保存、週に1回見直し」。ためこまずに、習慣にしてしまおう。

  まずは今日作ったものから、日付フォルダを作って保存するところから始めよう。過去の分は、時間のあるときに少しずつでいい。仕組みができれば、AIでつくる作業そのものが、もっと楽しく、速くなる。

  ランクはあくまで目安。自分や家族の暮らしに合わせて、ぴったりの組み合わせを見つけてほしい。みんなのTier表と並べて、違いを楽しむのもおすすめ。やってみて合わなければ、気軽に変えていけばOK。'
