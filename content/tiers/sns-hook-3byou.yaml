title: ショート動画の冒頭3秒のつかみ Tier表
description: 結論から言う、問いかけ、動きのある画面、字幕…ショート動画の冒頭3秒の工夫を、AIが「続きを見たくなるか×誠実さ×作りやすさ」でS〜Dにランク付け。
category: sns
tags:
- SNS
- ショート動画
- 初心者
published: '2026-10-09'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 続きを見たくなるか

  ② 誇張せず誠実か

  ③ 毎回作りやすいか'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 最初に結論や見どころを見せる
    emoji: 🎬
    reason: 「今日の主役はこの子」など、先に見せると続きが気になる。
  - name: 一番かわいい・面白い瞬間を冒頭に置く
    emoji: 😻
    reason: 時系列にこだわらず、見せ場を先頭に。
  - name: 最初から字幕・テロップを入れる
    emoji: 🔤
    reason: 音を出さずに見る人も多い。内容がすぐ分かる。
  A:
  - name: 問いかけで始める（「これ、何だと思う？」）
    emoji: ❓
    reason: 答えが気になって見続けやすい。
  - name: 動きのある画面から始める
    emoji: 🏃
    reason: 静止画の始まりより、目に留まりやすい。
  - name: 「〇本目」とシリーズ名を小さく入れる
    emoji: 🔢
    reason: シリーズ視聴につながる。
  B:
  - name: 印象的な効果音・音楽で始める
    emoji: 🎵
    reason: 耳に残る。著作権のルールは守る。
  - name: ズームやカット割りでテンポを出す
    emoji: ✂️
    reason: 間延びしない。やりすぎると疲れる。
  - name: あいさつを短くする
    emoji: 👋
    reason: 長いあいさつは離脱のもと。1秒以内で。
  C:
  - name: ナレーションで説明から始める
    emoji: 🎙️
    reason: 丁寧だが、説明が長いと飛ばされる。
  - name: ロゴやタイトルアニメから始める
    emoji: 🏷️
    reason: 統一感は出る。最初の数秒を使うので短く。
  D:
  - name: 中身と関係ない煽り・釣り
    emoji: 🎣
    reason: 最後まで見た人をがっかりさせる。信頼を失う。
  - name: ずっと暗い・真っ黒な画面から始める
    emoji: ⬛
    reason: 何も起きないので、すぐに離脱される。
  - name: 長いあいさつと自己紹介から入る
    emoji: 🗣️
    reason: ショートでは、冒頭を無駄にしやすい。
summary: 'ショート動画は、最初の数秒で「見る・見ない」が決まりやすい。S級は、冒頭で「何の動画か」「見ると何が分かるか」を示すこと。

  ただし、煽りすぎて中身が違うと、離脱されるだけでなく信頼も失う。冒頭は、中身と合った約束をする場所。'
related:
- sns-short-neta
- sns-thumbnail-tsukurikata
