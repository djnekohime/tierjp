title: 犬の病院に行くべきサイン Tier表
description: ぐったりしている、呼吸が苦しそう、けいれん、誤食、血の混じった嘔吐…犬の体調の変化を「急ぎ度」でS〜Dにランク付け。「すぐ病院」「様子を見ながら相談」の目安に。
category: animals
tags: [犬, ペット, 防災]
published: 2026-10-05
labels:
  S: すぐ病院
  A: 当日中に相談
  B: 数日以内に受診
  C: 様子を見て相談
  D: 日ごろの観察
criteria: |
  ① 命や健康への危険度
  ② 急に悪化しやすいか
  ③ 家庭での対応のしやすさ
  ※ これは「一般的な目安」で、診断ではありません。ここに書いていなくても、いつもと違って心配なときは、かかりつけの動物病院に相談してください。夜間・休日に診てくれる病院も、あらかじめ調べておくと安心です
rank_notes:
  S: 迷わず、すぐ動物病院へ
  D: ふだんから、観察しておきたい
tiers:
  S:
    - name: 呼吸が苦しそう・ぐったりして動かない
      short: 呼吸が苦しい・ぐったり
      emoji: "🚨"
      reason: 命に関わる可能性がある。連絡して、すぐ病院へ。
    - name: けいれん・意識がもうろうとしている
      short: けいれん・意識がない
      emoji: "⚠️"
      reason: 緊急のサイン。周りの物をどけて安全を確保し、病院へ連絡する。
    - name: 危険なものを食べた（チョコ・ぶどう・玉ねぎ・薬・異物など）
      short: 危険なものを食べた
      emoji: "☠️"
      reason: 量や時間で、危険度が変わる。吐かせようとせず、食べたものと量を伝えて、すぐ病院に相談する。
    - name: 何度も吐こうとするのに、吐けない・お腹がふくらんでいる
      short: 吐けない・お腹が張る
      emoji: "🎈"
      reason: 大型犬などでは、命に関わる病気のこともある。すぐに病院へ連絡する。
    - name: 大量の出血・交通事故・高いところから落ちた
      short: 大量の出血・事故
      emoji: "🩸"
      reason: 見た目が元気でも、体の中を傷めていることがある。すぐ受診する。
  A:
    - name: 血の混じった嘔吐・血便・黒い便
      short: 血の混じった嘔吐・便
      emoji: "🔴"
      reason: 体の中の出血を示すこともある。当日中に連絡する。
    - name: 何も食べない・水も飲まない状態が続く
      short: 食べない・飲まない
      emoji: "🥣"
      reason: 脱水になりやすい。半日〜1日続くなら、相談する。
    - name: 尿が出ない・何度もトイレに行くのに出ない
      short: おしっこが出ない
      emoji: "🚽"
      reason: 尿路の病気の可能性がある。時間がたつと、重くなることもある。
    - name: 熱中症のようすがある（ハアハアが止まらない・ふらつく）
      short: 熱中症のよう
      emoji: "🥵"
      reason: 体を冷やしながら、すぐ病院に連絡する。
    - name: 目が白くにごる・強い痛みで目を開けられない
      short: 目の強い異常
      emoji: "👁️"
      reason: 放っておくと、視力に影響することがある。早めに受診する。
  B:
    - name: 下痢・軟便が続く
      short: 下痢が続く
      emoji: "💩"
      reason: 元気があっても、続くなら受診する。便の写真があると、伝えやすい。
    - name: 足をひきずる・痛がる
      short: 足をひきずる
      emoji: "🦵"
      reason: 骨や関節の問題のことがある。数日続くようなら、受診する。
    - name: 耳をよくかく・においがする・赤い
      short: 耳のかゆみ・におい
      emoji: "👂"
      reason: 外耳炎などのことがある。早めに診てもらうと、治りやすい。
    - name: 皮膚のかゆみ・赤み・脱毛
      short: 皮膚のかゆみ
      emoji: "🔴"
      reason: アレルギーや、ノミ・ダニのことも。かきこわす前に、相談する。
    - name: 水をいつもより、ずっと多く飲む
      short: 水をたくさん飲む
      emoji: "💧"
      reason: 病気のサインのことがある。量や期間を記録して、相談する。
  C:
    - name: 食欲が少し落ちた・元気が少ない
      short: 食欲・元気が少ない
      emoji: "😔"
      reason: 軽い不調のこともある。1〜2日で戻らなければ、相談する。
    - name: 口臭が強い・よだれが多い
      short: 口臭・よだれ
      emoji: "🦷"
      reason: 歯や、歯茎の病気のことがある。歯みがきと、定期的なチェックを。
    - name: 体重が、急に増えた・減った
      short: 急な体重の変化
      emoji: "⚖️"
      reason: 病気や、食事の量の問題のことがある。定期的に、体重をはかる。
  D:
    - name: いつもの様子を、写真・動画・メモで残しておく
      short: ふだんの記録
      emoji: "📝"
      reason: 異変に気づきやすくなり、獣医師にも、伝えやすい。
    - name: 夜間・休日に診てくれる病院を、調べておく
      short: 夜間病院を調べておく
      emoji: "🏥"
      reason: いざというとき、慌てずにすむ。連絡先を、スマホに登録しておく。
summary: |
  Sは、「呼吸が苦しい」「けいれん」「危険なものを食べた」「吐こうとしても吐けない」「大量の出血・事故」。迷わず、すぐ動物病院へ連絡しよう。
  この表は目安で、診断ではない。「いつもと違う」という飼い主の直感は、とても大切。夜間・休日の病院も、今のうちに調べておこう。
related: [inu-kiken, pet-bousai-goods, pet-fuyu-kiken]
