title: 金魚の飼育グッズ Tier表
description: 水槽、フィルター、カルキ抜き、エアポンプ…金魚を飼うときに、あると助かる・なくても大丈夫なグッズを、必要度でS〜Dにランク付け。
category: animals
tags:
- 金魚
- 動物
- 初心者
published: '2026-10-06'
labels:
  S: ぜひそろえたい
  A: あると安心
  B: あると便利
  C: 好みで
  D: なくても大丈夫（むしろ注意）
criteria: '① 金魚の健康に必要か

  ② 水質を安定させる効果

  ③ 初心者でも扱いやすいか

  ※ 金魚の種類や、飼う数、水槽の大きさで必要なものは変わります。迷ったら、お店の人にも相談を'
rank_notes:
  S: 金魚の健康を支える基本
  D: 必須ではない・注意が必要なもの
tiers:
  S:
  - name: 十分な大きさの水槽（または大きめの容器）
    short: 水槽
    emoji: 🫙
    reason: 金魚は、大きく育って、フンも多い。水の量が多いほど、水質が安定する。1匹でも、できれば45cm以上の水槽が目安。
  - name: フィルター（ろ過器）
    short: フィルター
    emoji: ⚙️
    reason: フンや食べ残しで汚れやすい水を、きれいに保つ。水槽の大きさにあった、ろ過能力のものを選ぶ。
  - name: カルキ抜き（水質調整剤）
    short: カルキ抜き
    emoji: 💧
    reason: 水道水の塩素は、金魚に有害。新しい水を入れるときは、必ずカルキ抜きを使う。
  - name: エアポンプ・エアストーン（エアレーション）
    short: エアポンプ
    emoji: 🫧
    reason: 水に酸素を送って、金魚が息をしやすくする。フィルターと併用すると、安心感が増す。
  A:
  - name: 水温計
    short: 水温計
    emoji: 🌡️
    reason: 水温の急な変化は、金魚の体調をくずす原因。見やすいところに、温度計をつけておく。
  - name: 金魚用フード（浮上・沈下）
    short: 金魚用フード
    emoji: 🥣
    reason: 金魚の体に合わせた栄養が入っている。食べ残しは、水の汚れのもとなので、少量ずつ。
  - name: 水換え用のバケツ・ホース
    short: 水換え用バケツ
    emoji: 🪣
    reason: 水換えは、金魚飼育のいちばんの基本。専用のバケツがあると、気軽に水換えできる。
  - name: 水槽のフタ
    short: フタ
    emoji: 🔲
    reason: 金魚が飛び出したり、ほかのペットがいたずらしたりする事故を防ぐ。通気性のあるものを。
  B:
  - name: 水質テストキット
    short: 水質テストキット
    emoji: 🧪
    reason: アンモニアなどの水の状態を、目に見える形で確認できる。水がにごる、金魚の調子が悪いときの助けに。
  - name: 水草（アナカリスなど）
    short: 水草
    emoji: 🌿
    reason: 水をきれいにするのを助け、隠れ場所にもなる。金魚に食べられることもあるので、丈夫なものを。
  - name: 底砂・大磯砂
    short: 底砂
    emoji: 🏖️
    reason: 見た目がよくなり、バクテリアの住みかにもなる。細かすぎると、飲みこみ事故の心配も。
  - name: LEDライト
    short: LEDライト
    emoji: 💡
    reason: 金魚の色がきれいに見え、昼夜のリズムも作りやすい。1日8〜10時間くらいを目安に。
  - name: 金魚用の網
    short: 網
    emoji: 🥅
    reason: 金魚を移すときに使う。目の細かいものは、ヒレを傷つけにくい。
  C:
  - name: 隠れ家・飾り（オブジェ）
    short: 隠れ家・飾り
    emoji: 🏯
    reason: 見た目のたのしみ。とがったものは、ヒレを傷つけるので、角のないものを選ぶ。
  - name: ヒーター（水温を保つ）
    short: ヒーター
    emoji: 🔌
    reason: 金魚は、基本は、ヒーターなしでも飼える。冬の水温の急な低下が心配なときや、病気のときに、使うことがある。
  D:
  - name: 小さな丸い金魚鉢
    short: 金魚鉢
    emoji: 🔮
    reason: 水が汚れやすく、酸素も少なくなりがち。ミニサイズでは、金魚が大きくなったときに、すぐ手狭になる。
  - name: 水を長期間かえないこと
    short: 水換えしない
    emoji: ⏳
    reason: 「水がきれいに見える」のと、「水質がよい」のは別。見た目にだまされず、決まった間隔で、少しずつ水換えを。
summary: '金魚は、丈夫そうに見えて、水質の悪化にとても弱い。Sは「十分な大きさの水槽・フィルター・カルキ抜き・エアレーション」。この4つがあると、水が安定して、失敗が減る。

  小さな丸い金魚鉢は、水が汚れやすく、酸素も少なくなりがち。迎える前に、大きめの水槽とフィルターを準備して、水を先に回しておくと安心。'
related:
- kingyo-esa
- kingyo-shurui
- medaka-goods
