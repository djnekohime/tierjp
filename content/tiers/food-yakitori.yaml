title: 焼き鳥の部位 Tier表
description: もも、ねぎま、つくね、皮、ぼんじり、砂肝、レバー、せせり、手羽先…焼き鳥の部位を、AIが「頼みたい度×満足感×焼き鳥屋らしさ」でランク付け。たれ派？塩派？
category: food
genre: 肉料理
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 焼き鳥屋さんで「まず頼む」人気
  ② 一本食べたときの満足感
  ③ 焼き鳥屋さんならではの楽しさ（希少部位・食感）
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 最初の注文の定番
  D: 一羽から少ししかとれない希少部位
tiers:
  S:
    - name: もも
      emoji: "🍗"
      reason: ジューシーな肉汁があふれる焼き鳥の王道。たれでも塩でもおいしい、外れのない一本。
    - name: ねぎま
      emoji: "🧅"
      reason: 鶏肉とねぎを交互に刺した定番。焼いたねぎの甘みと肉のうまみが一本で楽しめる。
    - name: つくね
      emoji: "🟤"
      reason: 鶏ひき肉を丸めた焼き鳥。卵黄につけて食べる「月見つくね」は店の看板になることも。
  A:
    - name: 皮
      emoji: "🟨"
      reason: パリッと焼いた香ばしさと脂の甘み。福岡では、何度もたれにつけて焼く「くるくる巻いた皮」が名物。
    - name: ぼんじり
      emoji: "🔺"
      reason: 鶏のお尻のまわりの部位。一羽から少ししかとれず、脂のジューシーさとぷりっとした食感が人気。
    - name: 砂肝
      emoji: "🔘"
      reason: コリコリした食感がクセになる。脂が少なく、塩でさっぱり食べたい一本。
    - name: せせり
      emoji: "✨"
      reason: 鶏の首の肉。よく動かす部分なので弾力があり、うまみも濃い。
    - name: 手羽先
      emoji: "🪽"
      reason: 皮はパリッ、中はジューシー。名古屋の手羽先の甘辛い味つけも有名。
  B:
    - name: レバー
      emoji: "🟫"
      reason: とろっとした濃厚な味わい。好き嫌いは分かれるが、新鮮なレバーは焼き鳥屋さんの実力が分かる一本。
    - name: ハツ
      emoji: "❤️"
      reason: 鶏の心臓。くせが少なく、プリッとした歯ごたえ。
    - name: なんこつ
      emoji: "🦴"
      reason: コリコリの食感が楽しい一本。お酒のおつまみにぴったり。
    - name: ささみ（わさび・梅）
      short: ささみ
      emoji: "🟢"
      reason: 脂の少ないささみを、わさびや梅でさっぱりと。こってりした部位の合間の口直しに。
    - name: うずら卵
      emoji: "🥚"
      reason: 小さな卵を串に刺した一本。子供にも人気で、見た目もかわいい。
  C:
    - name: 豚バラ
      emoji: "🐖"
      reason: 鶏ではないが、福岡や北海道の室蘭などでは焼き鳥屋の定番。地域によって「焼き鳥」の意味が違うのも面白い。
    - name: 野菜巻き
      emoji: "🥬"
      reason: 豚バラでトマトやアスパラを巻いた一本。福岡など九州で人気で、見た目もおしゃれ。
  D:
    - name: ちょうちん
      emoji: "🏮"
      reason: 卵になる前の黄身とその管を一緒に焼いた希少部位。とろける黄身が口の中ではじける。
    - name: ソリレス
      emoji: "💎"
      reason: ももの付け根の小さな肉。フランス語で「愚か者は残す」という意味の名前を持つ、一羽から少ししかとれない希少部位。
summary: |
  焼き鳥は、もも・ねぎま・つくねがS。最初の注文はこの3本、というお店は多い。
  ぼんじり・せせり・ちょうちんのような希少部位に手を伸ばすと、焼き鳥の奥深さが分かる。福岡の豚バラや野菜巻きのように、地域ごとに「焼き鳥」の中身が違うのも楽しい。
related: [food-yakiniku-bui, food-don]
