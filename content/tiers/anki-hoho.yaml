title: 暗記の方法 Tier表
description: 間隔をあけて復習、思い出す練習、声に出す、書く、語呂合わせ、人に説明する…単語や知識の暗記の方法を「記憶に残りやすさ・続けやすさ」でS〜Dにランク付け。
category: manabi
tags: [勉強法, 英語, 韓国語]
published: 2026-10-05
labels:
  S: 効果が高い
  A: かなり効く
  B: 合う人には効く
  C: 補助的
  D: 効果が出にくい
criteria: |
  ① 記憶に残りやすさ（学習の研究などで、よく紹介される方法か）
  ② 続けやすさ（手間・時間）
  ③ 幅広い内容に使えるか（単語・年号・資格・語学）
  ※ 向き不向きには、個人差があります。一般的に言われている方法を整理した、ひとつの見方です
rank_notes:
  S: まずこの2つ
  D: やった気になりやすく、効果が出にくい
tiers:
  S:
    - name: 間隔をあけて、何度も復習する
      short: 間隔をあけて復習
      emoji: "📆"
      reason: 覚えた直後・1日後・1週間後と、少しずつ間隔を広げながら、見直す。一度に詰め込むより、記憶に残りやすいとされる。暗記アプリの多くが、この仕組みを使っている。
    - name: 「思い出す練習」をする（見ずに言ってみる）
      short: 思い出す練習
      emoji: "🧠"
      reason: 答えを見る前に、頭の中で思い出してみる。テストのように、自分に問題を出すほうが、読み返すだけより、記憶に残りやすいと言われる。
  A:
    - name: 声に出して言う
      short: 声に出す
      emoji: "🗣️"
      reason: 目・口・耳を、同時に使うので、記憶に残りやすい。語学には、特に向く。
    - name: 手で書く
      short: 手で書く
      emoji: "✍️"
      reason: 書くことで、集中して、形を覚えられる。何度も同じ字を書くより、思い出しながら書くほうが効果的。
    - name: 暗記カード（アプリ・紙）で、自分でテストする
      short: 暗記カード
      emoji: "🃏"
      reason: 表に問題、裏に答え。シャッフルして、何度も取り組める。作ること自体が、勉強になる。
    - name: 人に説明する・教える
      short: 人に説明する
      emoji: "👥"
      reason: 説明しようとすると、分かっていない部分がはっきりする。相手がいなければ、独り言でもよい。
    - name: 寝る前に復習して、しっかり寝る
      short: 寝る前に復習
      emoji: "🌙"
      reason: 睡眠は、記憶を整理する時間とも言われる。寝る前の短い復習と、十分な睡眠が、セットで効く。
  B:
    - name: 語呂合わせ・連想で覚える
      short: 語呂合わせ
      emoji: "🔗"
      reason: 年号や、順番のあるものなど、丸暗記が必要なものに便利。作る手間はかかる。
    - name: イメージや場所と結びつける
      short: イメージで覚える
      emoji: "🖼️"
      reason: 言葉を、絵や場所に結びつけると、思い出しやすい。語彙の暗記で、効果を感じる人も多い。
    - name: 関連づけて、まとまりで覚える
      short: まとまりで覚える
      emoji: "🧩"
      reason: ばらばらに覚えるより、意味のつながりで、グループにすると覚えやすい。
    - name: 付箋・メモを、よく見る場所に貼る
      short: 付箋を貼る
      emoji: "📌"
      reason: 目にする回数を増やせる。貼りすぎると、景色になって、効果が薄れる。
    - name: 通勤・家事の時間に音声で聞く
      short: ながら聞き
      emoji: "🎧"
      reason: すき間時間を、使える。聞くだけで、覚えられるかは、内容による。
  C:
    - name: 色分けマーカー・ノートのまとめ方にこだわる
      short: 色分け・ノート整理
      emoji: "🖍️"
      reason: 見やすく、整理されるが、きれいにまとめること自体に、時間をかけすぎないように。
    - name: 歌やリズムにのせて覚える
      short: 歌・リズム
      emoji: "🎵"
      reason: 覚えやすい人には、効果的。作る手間と、内容との相性がある。
    - name: 英語・韓国語を、好きな歌やドラマで覚える
      short: 歌・ドラマで覚える
      emoji: "📺"
      reason: 好きなものなら、続きやすい。覚えたい単語と、場面を、結びつけやすい。
  D:
    - name: 教科書やノートを、何度も読み返すだけ
      short: 読み返すだけ
      emoji: "👀"
      reason: 分かったつもりになりやすく、記憶に残りにくいと言われる。思い出す練習とセットにする。
    - name: 一夜漬け・詰め込み
      short: 一夜漬け
      emoji: "🌃"
      reason: 短期的には、役立つこともあるが、すぐ忘れやすい。長く覚えたいなら、少しずつ復習を。
    - name: マーカーを引くだけで満足する
      short: マーカーだけ
      emoji: "🟨"
      reason: 線を引くことで、勉強した気分になりやすい。引いたあとに、思い出す練習をする。
summary: |
  暗記のSは、「間隔をあけて復習」と「思い出す練習」。読み返すより、思い出そうとするほうが、記憶に残りやすいと言われる。
  語学なら、声に出す、書く、好きな歌やドラマで覚える、といった工夫と組み合わせると、楽しく続く。完璧を目指さず、少しずつ、くり返そう。
related: [benkyo-tsuzukekata, eigo-gakushu-hoho, hangul-phrase]
