title: メダカの飼育容器 Tier表
description: 発泡スチロール箱、プラ舟、睡蓮鉢、ガラス水槽、バケツ、金魚鉢…メダカの飼育容器を「飼いやすさ・水温の安定・見た目・手に入れやすさ」でS〜Dにランク付け。
category: animals
tags: [メダカ, 動物, 初心者]
published: 2026-10-03
criteria: |
  ① 水温と水質の安定しやすさ（容量の大きさ）
  ② お手入れのしやすさ
  ③ 見た目・観賞しやすさ
  ④ 手に入れやすさ・値段
  ※ メダカは丈夫ですが、容器が小さいほど水温や水質が急に変わります。置き場所（直射日光・猫やカラスの対策）とあわせて考えてください
rank_notes:
  S: 迷ったらここから
  D: メダカにはおすすめしにくい
tiers:
  S:
    - name: 発泡スチロール箱
      emoji: "📦"
      reason: 安くて軽く、断熱性が高いので、夏も冬も水温が安定しやすい。屋外で何匹も飼いたい人の定番。見た目は地味だが、メダカにとって快適。
    - name: プラ舟（トロ舟）
      short: プラ舟
      emoji: "🛶"
      reason: 広くて浅く、軽くて丈夫。屋外飼育の人気者で、メダカをたくさん育てるのに向く。ホームセンターで安く手に入る。
  A:
    - name: 睡蓮鉢（陶器・樹脂）
      short: 睡蓮鉢
      emoji: "🏺"
      reason: ベランダや庭で、景観を楽しめる。水量が大きめで、水温も安定しやすい。重いので、置き場所を決めてから水を入れる。
    - name: ガラス水槽（30〜60cm）
      short: ガラス水槽
      emoji: "🐟"
      reason: 横から泳ぐ姿が見られ、観賞に最も向く。室内飼育にも向き、水草レイアウトも楽しめる。重さと水量の管理が必要。
    - name: 衣装ケース（プラスチック）
      short: 衣装ケース
      emoji: "🧺"
      reason: 手軽に手に入って、大きさも選べる。安価で試しやすく、稚魚の育成にも使える。透明度や紫外線による劣化に注意。
  B:
    - name: バケツ
      emoji: "🪣"
      reason: どの家にもあるので、気軽に始められる。深さがあって、観賞はしにくい。水量が少ないと水温が不安定。
    - name: 大きな甕（かめ）
      short: 甕
      emoji: "🫙"
      reason: 趣があり、庭の景観にもなる。水量が多く、水温も安定する。重くて、動かしにくい。
    - name: スリムな小型水槽
      short: 小型水槽
      emoji: "🔲"
      reason: 机の上に置ける、小さな水槽。見て楽しめるが、水質が変わりやすく、こまめな管理が必要。
    - name: ビオトープセット
      emoji: "🌿"
      reason: 水草や鉢がそろっていて、手軽に始められる。容量が小さいものは、メダカの数を少なくする。
    - name: 洗面器・たらい
      emoji: "🛁"
      reason: 浅くて広く、稚魚や一時的な避難場所に便利。水量が少なく、夏の水温上昇に注意。
  C:
    - name: 丸型の金魚鉢
      short: 金魚鉢
      emoji: "🫧"
      reason: 見た目はかわいらしいが、水量が少なく、水質が悪くなりやすい。ガラスが丸いと景色が歪んで見える。
    - name: ガラス瓶・ジャム瓶
      short: ガラス瓶
      emoji: "🫙"
      reason: インテリアとして映えるが、水量がとても少ない。たくさんは飼えず、水質管理も大変。
    - name: ペットボトル
      emoji: "🧴"
      reason: 稚魚の一時的な育成や、卵の管理に使えることもある。長期の飼育には向かない。
  D:
    - name: 穴の開いた容器・底が割れた容器
      short: 穴あき容器
      emoji: "🕳️"
      reason: 水がもれて、メダカが危険にさらされる。使う前に、必ず水もれがないか確認する。
    - name: 金属製や、直射日光で高温になる色の濃い容器
      short: 金属・黒い容器
      emoji: "🔥"
      reason: 金属がさびたり、成分がしみ出したりするほか、水温が上がりすぎて危険。メダカにはおすすめしにくい。
summary: |
  迷ったら、屋外なら「発泡スチロール箱」か「プラ舟」、室内でじっくり見たいなら「ガラス水槽」。水量が多いほど、水温や水質が安定して、メダカにとって育てやすい。
  小さな瓶や金魚鉢はかわいいが、水が急に変わりやすく、管理が難しい。まずは、少し大きめの容器から始めるのがおすすめ。
related: [medaka-goods, medaka-suisou, medaka-shippai]
