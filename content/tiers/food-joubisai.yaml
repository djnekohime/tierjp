title: 常備菜・作り置きおかず Tier表
description: きんぴら、ひじき煮、切り干し大根、鶏ハム、味玉、浅漬け…作り置きの定番おかずを、ゾーマが「日持ち×アレンジのしやすさ×手軽さ」でS〜Dにランク付け。
category: food
genre: 食べ方・食のあるある
tags:
- グルメ
published: '2026-11-01'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 日持ちと、食べ方のアレンジしやすさ

  ② 作る手軽さ

  ③ 飽きにくさ

  ※ 保存期間はあくまで目安です。清潔な容器を使い、冷蔵庫に入れて、早めに食べ切ってください'
rank_notes:
  S: 作り置きの王道
  D: 作り置きに不向き
tiers:
  S:
  - name: きんぴらごぼう
    emoji: 🥕
    reason: 甘辛でごはんがすすむ。冷めてもおいしく、お弁当にも使える。
  - name: ひじきの煮物
    emoji: 🌿
    reason: ミネラルが豊富で、アレンジもしやすい。混ぜごはんにも合う。
  A:
  - name: 切り干し大根の煮物
    emoji: 🥢
    reason: やさしい甘み。水で戻すだけで、手間が少ない。
  - name: 鶏ハム
    emoji: 🍗
    reason: しっとりしていて、サラダやサンドイッチにも。切って使える万能選手。
  - name: 味付け卵（味玉）
    emoji: 🥚
    reason: ラーメンやお弁当に添えやすい。仕込みは前日に。
  - name: 肉みそ
    emoji: 🥓
    reason: ごはん、豆腐、野菜に合う。冷凍もしやすい。
  - name: 浅漬け・即席漬け
    emoji: 🥒
    reason: さっぱり系の箸休め。日持ちは短めなので、早めに食べる。
  B:
  - name: ラタトゥイユ
    emoji: 🍅
    reason: 野菜がたくさんとれる。パスタやパンにも合う。
  - name: 南蛮漬け
    emoji: 🐟
    reason: 酸味で日持ちしやすく、さっぱり食べられる。
  - name: ほうれん草のおひたし
    emoji: 🥬
    reason: 手軽だが、水っぽくなりやすい。小分けにして保存する。
  - name: ポテトサラダ
    emoji: 🥔
    reason: 人気のおかずだが、傷みやすい。冷蔵保存で早めに食べる。
  - name: 煮豆
    emoji: 🫘
    reason: 甘めの味つけが多い。小分けにして食べ切る。
  C:
  - name: 唐揚げ（揚げたてが基本）
    emoji: 🍗
    reason: 作り置きもできるが、衣がべちゃっとしやすい。温め直しにはコツがいる。
  - name: サラダ（葉物野菜）
    emoji: 🥗
    reason: 水分が出やすく、日持ちは短め。ドレッシングは食べる直前に。
  - name: 刺身・生ものの漬け
    emoji: 🍣
    reason: 傷みやすい。作り置きには向かない。
  D:
  - name: 常温で冷ますだけで、そのまま保存
    emoji: ⚠️
    reason: 雑菌が増えやすい。粗熱をとって、すぐ冷蔵庫へ。
  - name: 何日たったか分からない、容器を使い回す
    emoji: 🚫
    reason: いつ作ったか分からないと、食べられるか判断できない。日付を書くのが安全。
  - name: においや見た目が変でも、もったいなくて食べる
    emoji: 🙈
    reason: 食あたりの原因になる。迷ったら食べない。
summary: '常備菜のいちばんの魅力は、「疲れた日の自分を助けてくれる」こと。S級は、日持ちしやすく、アレンジもきく定番。きんぴらや切り干し大根は、そのまま食べても、卵とじや炒め物にも変身する。

  気をつけたいのは、保存と衛生。清潔な容器に入れ、しっかり冷ましてから冷蔵庫へ。日持ちは材料や季節で変わるので、「作った日付を書いておく」のが安全。変なにおいやぬめりがあれば、食べない判断を。

  夏は傷みやすいので、冬のほうが向いている。2〜3種類を週末にまとめて作って、味つけを変えたり、薬味でアレンジしたりすると、1週間飽きずに食べられる。無理に全部を作ろうとせず、「得意な2品を回す」くらいがちょうどよい。'
related:
