title: 焼肉の部位 Tier表
description: タン塩、カルビ、ハラミ、ロース、ホルモン、ミスジ…焼肉の部位を、AIが「食べたい度×満足感×焼肉らしさ」でランク付け。最初の一皿は何にする？
category: food
genre: 肉料理
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「これは絶対に頼む」と思える人気
  ② 口に入れたときの満足感
  ③ 焼肉ならではの楽しさ（焼き方・食べ方）
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 焼肉屋に来たら必ず頼む
  D: 焼肉通が頼む渋い部位
tiers:
  S:
    - name: タン塩
      emoji: "👅"
      reason: 焼肉の最初の一皿の定番。コリッとした歯ごたえに塩とレモンがよく合う。薄切りもいいが、厚切りタンは店の実力が出る。
    - name: カルビ
      emoji: "🔥"
      reason: 甘辛いたれと脂のうまみで、ご飯が止まらない焼肉の王様。「焼肉といえばカルビ」という人は多い。
    - name: ハラミ
      emoji: "🥩"
      reason: 横隔膜の部位で、やわらかくジューシー。赤身のように見えて実はホルモンの仲間。脂がしつこくなく、たくさん食べられる。
  A:
    - name: ロース
      emoji: "🟥"
      reason: 赤身の肉らしいうまみを味わえる。カルビより脂が少なく、さっぱり食べたい人に。
    - name: 上ミノ
      emoji: "⚪"
      reason: 牛の第一胃。コリコリとした独特の食感がクセになる、ホルモンの入門編。
    - name: ミスジ
      emoji: "✨"
      reason: 肩の部分で、一頭から少ししかとれない希少部位。きれいな霜降りで、とろける食感。
    - name: シマチョウ（テッチャン）
      short: シマチョウ
      emoji: "🌀"
      reason: 牛の大腸。ぷりぷりの脂の甘みが魅力で、ホルモン好きにはたまらない。
    - name: 豚トロ
      emoji: "🐖"
      reason: 豚の首まわりの部位。脂がのっているのにさっぱりしていて、コリッとした食感も楽しい。
  B:
    - name: 上カルビ
      emoji: "💎"
      reason: カルビの中でも霜降りのいい部分。おいしいが脂が強く、たくさんは食べられない。
    - name: レバー
      emoji: "🟤"
      reason: 独特の濃厚な味わい。ごま油と塩で食べるとおいしい。好き嫌いがはっきり分かれる部位。
    - name: ザブトン
      emoji: "🟪"
      reason: 肩ロースの一部の希少部位。サシが美しく、さっと焼いてとろける食感を楽しむ。
    - name: ハツ
      emoji: "❤️"
      reason: 牛の心臓。くせが少なく、シャキッとした歯ごたえ。ホルモンの中でも食べやすい。
    - name: 鶏もも
      emoji: "🐔"
      reason: 牛や豚に疲れたときのやさしい選択肢。ジューシーで、子供にも人気。
  C:
    - name: ギアラ
      emoji: "🟫"
      reason: 牛の第四胃で、やわらかく脂の甘みがある。店によってはあまり見かけない部位。
    - name: ウインナー
      emoji: "🌭"
      reason: 焼肉屋の定番のサイドの肉。子供は大喜びだが、焼肉に来たならもっと他を食べたいという人も。
  D:
    - name: センマイ
      emoji: "📖"
      reason: 牛の第三胃。ひだが本のページのように重なった見た目で、刺しや湯引きで酢味噌で食べる。通好みの一品。
    - name: コプチャン
      emoji: "🔘"
      reason: 牛の小腸。脂がたっぷりで、韓国の焼肉では人気の部位。焼き加減に少しコツがいる。
summary: |
  焼肉の部位は、タン塩・カルビ・ハラミが三大人気。最初はタン塩、ご飯にはカルビ、たくさん食べたいならハラミが鉄板の流れ。
  ミスジやザブトンのような希少部位、ミノやシマチョウなどのホルモンに手を伸ばすと、焼肉の楽しさは何倍にもなる。
related: [food-sushi-neta, kandrama-gourmet]
