title: AI画像のプロンプト（指示文）の書き方 Tier表
description: 被写体、雰囲気、構図、光、ネガティブ指定…AI画像生成の指示文（プロンプト）の書き方を、ゾーマが「狙い通りに出るか×再現しやすさ×続けやすさ」でS〜Dにランク付け。
category: ai
tags:
- AI画像
- 初心者
published: '2026-11-03'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 狙い通りの画像が出るか

  ② 再現しやすさ（同じ雰囲気を何度も作れるか）

  ③ 続けやすさ

  ※ ツールやモデルによって、効く書き方は違います。実際に試して合う型を見つけるための目安です'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 被写体を具体的に書く（何が・どこで）
    emoji: 🐈
    reason: 場面が浮かぶ言葉は、狙い通りに出る確率が上がる。
  - name: 短く始めて、少しずつ足す
    emoji: ➕
    reason: 何が効いたか分かりやすく、失敗の原因もつかみやすい。
  - name: 良かったプロンプトを保存して使い回す
    emoji: 💾
    reason: 再現しやすく、シリーズ作品がそろえやすい。
  A:
  - name: 光・色・雰囲気を指定する（朝の光、夜景など）
    emoji: 🌅
    reason: 画面の印象が決まる。出来が大きく変わる。
  - name: 構図・距離を指定する（アップ、全身、俯瞰など）
    emoji: 📐
    reason: 見せたい部分が決まり、使いやすい画像になる。
  - name: 一度に1つだけ変える
    emoji: 🔬
    reason: 何が効いたかが分かる。上達が早い。
  - name: ネガティブ指定（出したくない要素）を使う
    emoji: 🚫
    reason: 余計なものを減らせる。対応していないツールもある。
  - name: 試行回数をまとめて回し、気に入ったものを選ぶ
    emoji: 🎲
    reason: 1回で当てようとしない。たくさん作って選ぶほうが効率的。
  B:
  - name: 画風を指定する（水彩、アニメ調など）
    emoji: 🎨
    reason: 雰囲気が一気に決まる。実在の作家名を使うのは避けたい。
  - name: アスペクト比（縦・横）を指定する
    emoji: 🖼️
    reason: SNSの形式に合わせられる。縦動画向けに最初から縦で作る。
  - name: 参考画像（リファレンス）を使う
    emoji: 📎
    reason: イメージを伝えやすい。権利に気をつけて使う。
  - name: 日本語と英語で書き比べる
    emoji: 🔤
    reason: ツールによって、効きやすい言語が違う。試して決める。
  - name: AIに、プロンプトの案を相談する
    emoji: 🤖
    reason: ひらめきの助けになる。そのまま使わず調整する。
  C:
  - name: 長文で細かく全部指定する
    emoji: 📜
    reason: 狙い通りになることもあるが、矛盾しやすく、うまくいかないことも多い。
  - name: 流行りの呪文を、そのままコピーする
    emoji: ✨
    reason: うまくいくこともあるが、意味が分からず応用が利かない。
  - name: 1回で完成を狙って、回数をかけない
    emoji: 🎯
    reason: 当たるときもあるが、再現できず安定しない。
  D:
  - name: 実在の人物や、他の人の作品をそのまま真似る
    emoji: ⚠️
    reason: 権利や肖像、トラブルの原因になる。避けたい。
  - name: 利用規約を確認せずに、公開・販売する
    emoji: 📋
    reason: ツールごとに商用利用のルールが違う。必ず確認する。
  - name: プロンプトを保存せず、毎回ゼロから書く
    emoji: 🌀
    reason: 同じ雰囲気を出せず、時間もかかる。
summary: 'AI画像の出来は、プロンプト（指示文）で大きく変わる。でも、最初から長く細かく書こうとしなくていい。S級は、「何が・どこで・どんな雰囲気か」を短く書いて、少しずつ足していくやり方。

  まず被写体をはっきり書くのが第一歩。「猫」ではなく「窓辺で丸くなる白い猫」のように、場面が浮かぶ言葉にする。次に、光や色、雰囲気（やわらかい朝の光、夜のネオンなど）を足すと、画面の印象が決まる。

  気に入った画像が出たら、そのプロンプトを保存しておくこと。同じ型を使い回すと、シリーズ作品がそろえやすい。毎回ゼロから書くより、ずっと効率がいい。

  D級の「他人の作品や実在の人物をそのまま真似る」は、権利やトラブルの原因になる。自分の作品として公開する場合は、ツールの利用規約を必ず確認しておくこと。

  試行錯誤はつきもの。一度に1つだけ変えて、何が効いたかをメモすると、上達が早い。失敗した画像も、実は次のヒントになる。作品の整理や、公開前のチェックも忘れずに。

  最後に覚えておきたいのは、「画像は編集してもよい」ということ。AIが出した画像がほぼ理想に近ければ、色を整えたり、文字を後から入れたりして仕上げる方が、プロンプトを延々と直すより早いことも多い。AIは完成品を作る道具というより、素材を出してくれる助手。出た画像の良いところを褒めて、次のプロンプトに反映させるくらいの気持ちで、気軽に付き合うのが長続きの秘訣。'
