title: 昭和の名作アニメ Tier表
description: サザエさん、ドラえもん、アルプスの少女ハイジ、宇宙戦艦ヤマト、機動戦士ガンダム、キャンディ・キャンディ…昭和を彩ったテレビアニメを、知名度と愛され度でS〜Dにランク付け。
category: entame
tags: [昭和, レトロ, 名作]
published: 2026-10-05
labels:
  S: 国民的アニメ
  A: 誰もが知っている
  B: 世代の思い出
  C: 渋い名作
  D: 通好み
criteria: |
  ① 世代を超えた知名度（今も再放送・新作・グッズがあるか）
  ② 愛され度・語り継がれ度
  ③ その後のアニメや文化への影響
  ※ 放送時期や好みで順位は変わります。同じ作品でも、思い出は人それぞれです。これは、AIが基準を決めて並べた、ひとつの見方です
rank_notes:
  S: 昭和の顔
  D: 知っていたらかなりの通
tiers:
  S:
    - name: サザエさん
      emoji: "🏠"
      reason: 日曜の夕方の、国民的な長寿アニメ。磯野家と、フグ田家の日常が、世代を超えて親しまれている。
    - name: ドラえもん
      emoji: "🔔"
      reason: 未来から来た猫型ロボットと、少年の物語。世代を超えて愛され、国内外で親しまれている。
    - name: アルプスの少女ハイジ
      short: ハイジ
      emoji: "🐐"
      reason: スイスのアルプスを舞台にした、少女の物語。高畑勲が演出を手がけた作品として知られ、今も愛されている。
  A:
    - name: 機動戦士ガンダム
      short: ガンダム
      emoji: "🤖"
      reason: ロボットアニメの歴史を変えた、と語られる作品。プラモデルなど、文化として広がった。
    - name: 宇宙戦艦ヤマト
      short: ヤマト
      emoji: "🚀"
      reason: 宇宙を舞台にした壮大な物語で、大人も夢中になったアニメブームの火付け役のひとつ。
    - name: フランダースの犬
      emoji: "🐕"
      reason: 少年と愛犬パトラッシュの物語。結末が、多くの人の心に残る名作。
    - name: 母をたずねて三千里
      short: 三千里
      emoji: "🌎"
      reason: 少年が、母を探して遠い国を旅する物語。高畑勲が手がけた、世界名作劇場の名作。
    - name: 銀河鉄道999
      short: 999
      emoji: "🚂"
      reason: 宇宙を走る列車の旅を描いた、ロマンあふれる作品。松本零士の世界観が魅力。
    - name: キャンディ・キャンディ
      emoji: "🎀"
      reason: 孤児の少女の、成長と恋を描いた少女向けの人気作。主題歌も、よく知られている。
  B:
    - name: ルパン三世
      emoji: "🕵️"
      reason: 大泥棒ルパンの活躍を描いた、大人向けの雰囲気のあるアニメ。シリーズが長く続いている。
    - name: 巨人の星
      emoji: "⚾"
      reason: 野球に人生をかけた親子の物語。熱血スポ根の代名詞として、語り継がれる。
    - name: あしたのジョー
      emoji: "🥊"
      reason: ボクシングに打ち込む青年を描いた、熱い物語。「真っ白な灰」の名場面で、今も知られる。
    - name: ベルサイユのばら
      emoji: "🌹"
      reason: フランス革命を舞台にした、華やかな少女漫画原作の物語。
    - name: 天才バカボン
      emoji: "🎩"
      reason: 「これでいいのだ」の名ゼリフで知られる、ナンセンスギャグの名作。
    - name: うる星やつら
      emoji: "⚡"
      reason: 宇宙人の少女と、ふつうの高校生のドタバタラブコメ。昭和の後半を代表する人気作。
    - name: Dr.スランプ アラレちゃん
      short: アラレちゃん
      emoji: "🕶️"
      reason: ロボットの女の子が主人公の、明るいギャグアニメ。「んちゃ！」の挨拶で、大ブームになった。
    - name: キャプテン翼
      emoji: "⚽"
      reason: サッカーを題材にした、スポーツアニメの人気作。多くの子どもがサッカーを始めるきっかけになった、と語られる。
  C:
    - name: 鉄腕アトム
      emoji: "🚀"
      reason: 日本のテレビアニメの歴史の、はじまりを告げる作品として語られる。手塚治虫の世界観が、今も受け継がれる。
    - name: 科学忍者隊ガッチャマン
      short: ガッチャマン
      emoji: "🦅"
      reason: 5人のヒーローが活躍する、人気のSFアクション。
    - name: アタックNo.1
      emoji: "🏐"
      reason: バレーボールの青春ドラマ。スポ根ブームを作った作品のひとつ。
    - name: ひみつのアッコちゃん
      emoji: "🪞"
      reason: 魔法の鏡で、いろんなものに変身できる少女の物語。「テクマクマヤコン」の呪文が有名。
    - name: マジンガーZ
      emoji: "🔩"
      reason: 巨大ロボットの先駆けとして、のちのロボットアニメに影響を与えた。
  D:
    - name: 魔法の天使クリィミーマミ
      short: クリィミーマミ
      emoji: "🪄"
      reason: 魔法で、アイドルに変身する少女の物語。昭和のアイドルブームの空気を映した作品として、ファンが多い。
summary: |
  昭和アニメのSは、今も毎週のように見られる「サザエさん」と、世代を超えて愛される「ドラえもん」「アルプスの少女ハイジ」。どれも、昭和から続く、国民的な作品。
  同じ作品でも、いつ・どこで見たかで、思い出は違う。あなたの一番の昭和アニメは、何ランク？ ぜひ一言コメントで教えてね。
related: [music-showa-kayo, showa-drama, ghibli-eiga]
