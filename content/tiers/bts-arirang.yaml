title: BTS『ARIRANG』収録曲 Tier表
description: SWIM、Body to Body、Hooligan、NORMAL…2026年3月発売、BTS完全体の5thアルバム『ARIRANG』の全曲を、AIがランク付け。
category: bts
tags: [BTS, K-POP, ARIRANG]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 名曲
  B: 大好き
  C: 沼の入口
criteria: |
  ① 曲の完成度と、アルバムの中での役割
  ② シングルとしての広がり・チャートでの記録
  ③ 「韓国から始まったグループ」というアルバムのテーマを体現しているか
  ※ 通常盤14曲＋デラックス盤のボーナストラックが対象。歌詞は掲載していません
  ※ どの曲も名曲。ランクは「このアルバムを初めて聴く人に、どの順ですすめるか」です
rank_notes:
  S: 『ARIRANG』を語るならまずこの3曲
  C: アルバムを通して聴くと、じわじわ効いてくる曲
tiers:
  S:
    - name: SWIM
      emoji: "🏊"
      reason: アルバムのタイトル曲。人生の荒波の中でも前へ泳ぎ続ける決意を歌う、明るいオルタナティブ・ポップ。Billboard Hot 100で1位を獲得した。完全体BTSの「これから」を一番まっすぐ伝える曲。
    - name: Body to Body
      emoji: "🥁"
      reason: アルバムの1曲目。韓国の民謡「アリラン」をサンプリングし、力強い打楽器のビートで始まる。アルバムの名前の意味を、最初の数秒で伝えてくれる。
    - name: Hooligan
      emoji: "⚔️"
      reason: 2曲目のシングル。刻むようなストリングスが緊張感を生み、グループの未来への思いを描く。SWIMとは違う、鋭いBTSが見られる。
  A:
    - name: NORMAL
      emoji: "🎭"
      reason: 3曲目のシングル。世界中から注目され続ける日々と、普通の暮らしへの思いの間で揺れる気持ちを、エッジの効いたポップで表現した。
    - name: Aliens
      emoji: "👽"
      reason: 80年代ヒップホップの香りがするラップ曲。世界に広がった韓国文化と、その中を歩んできたBTS自身の物語を重ねる。
    - name: Merry Go Round
      emoji: "🎠"
      reason: テーム・インパラのケヴィン・パーカーが制作に参加した、サイケデリックなロック。内と外からのプレッシャーに回り続ける感覚を音にした。
    - name: Please
      emoji: "🫶"
      reason: 「一緒にいること」を歌うラブソング。ボーカルラインの歌声が中心で、アルバムの中で一番優しい時間。
    - name: Into the Sun
      emoji: "🌅"
      reason: 通常盤の最後を飾る曲。ボコーダーを使ったオルタナティブR&Bで、アルバムを静かに締めくくる。
  B:
    - name: FYA
      emoji: "🔥"
      reason: ポップラップにジャージークラブのリズムを取り入れた、跳ねるようなダンスナンバー。ライブで盛り上がること間違いなし。
    - name: 2.0
      emoji: "🔄"
      reason: ラップを中心に、グループが新しい段階に「アップデート」したことを宣言する曲。
    - name: they don't know 'bout us
      emoji: "🤫"
      reason: オールドスクールなヒップホップとトラップを混ぜたサウンド。周りからの見られ方に言い返す、ラップラインの見せ場。
    - name: Like Animals
      emoji: "🐾"
      reason: 生楽器の温かさが際立つポップロックのバラード。アルバムの後半へ空気を切り替える役割を持つ。
    - name: One More Night
      emoji: "🪩"
      reason: 90年代のハウスミュージックを思わせるダンスポップ。夢の中のような世界観で、思わず体が揺れる。
  C:
    - name: No. 29
      emoji: "🔔"
      reason: 韓国の国宝第29号「聖徳大王神鐘」の鐘の音を収めた、1分半ほどの短いトラック。単独で聴くより、アルバムの流れの中で聴くと意味が分かる、まさに沼の入口。
    - name: Come Over
      emoji: "💌"
      reason: デラックス盤のボーナストラック。スタジアムで合唱したくなるリズムの、ARMYへのメッセージがこもった曲。手に入れた人だけのごほうび。
summary: |
  『ARIRANG』は、兵役を終えた7人がそろって出した、約4年ぶりの完全体アルバム。Billboard 200で初登場1位、しかも3週連続1位という大記録を作った。
  タイトルの「アリラン」は韓国を代表する民謡。1曲目のBody to Bodyでアリランが鳴り、タイトル曲SWIMで「それでも前へ」と泳ぎ出す。韓国から始まったグループが、世界の真ん中で自分たちのルーツを歌ったアルバム。
  ※ シングル曲のSWIM・Hooligan・NORMALなどは、BTSの曲・ラップ・ダンス・バラードの各Tier表にも入っています。
related: [bts-songs, bts-rap, bts-dance, bts-ballad, bts-solo]
