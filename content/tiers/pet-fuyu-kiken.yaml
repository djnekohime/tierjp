title: 冬にペットが危ないもの・やりがちな失敗 Tier表
description: こたつ、ストーブ、不凍液、ユリ、車のエンジンルーム、融雪剤…犬猫の冬の危険を「危険度」でS〜Dにランク付け。事故を防ぐための冬のチェックリスト。
category: animals
tags: [犬, 猫, 寒さ対策, 動物]
published: 2026-10-03
labels:
  S: 命にかかわる
  A: 要注意
  B: 気をつけたい
  C: 対策しだい
  D: 知っておけば大丈夫
criteria: |
  ① 命や健康への危険度
  ② 冬の家庭で起こりやすいか
  ③ 事前の対策のしやすさ
  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。ペットが口にした、様子がおかしいときは、様子見せず、すぐ動物病院に連絡してください
rank_notes:
  S: 少しの油断が命にかかわる
  D: 知っておけば防げる
tiers:
  S:
    - name: 不凍液（エチレングリコール）
      short: 不凍液
      emoji: "🧪"
      reason: 車の不凍液などに含まれる成分で、犬や猫が少量でも口にすると、急性腎不全など重い中毒になる危険がある。甘い味でなめることがあるので、こぼれたら、すぐ拭きとる。ガレージや駐車場も要注意。
    - name: ユリ（猫に特に危険）
      short: ユリ
      emoji: "🌷"
      reason: 猫がユリの花粉や葉をなめたり、花瓶の水を飲んだりするだけで、腎臓に重い障害が起こることがある。クリスマスやお正月の花束に、ユリが入っていないか確認する。
    - name: 車のエンジンルームに入りこむ猫
      short: エンジンルーム
      emoji: "🚗"
      reason: 寒い季節、暖かいエンジン付近に猫が入りこむことがある。乗る前に、ボンネットを軽くたたく、車の下を確認する習慣を。
    - name: 暖房器具の一酸化炭素中毒（換気不足）
      short: 換気不足
      emoji: "☁️"
      reason: 締め切った部屋で、ガスや灯油のストーブを使うと、人もペットも危険。ときどき換気をして、安全な機器を使う。
  A:
    - name: ストーブ・ファンヒーターへの接触・火事
      short: ストーブ
      emoji: "🔥"
      reason: ペットが近づきすぎて、やけどをしたり、倒して火事になったりする危険がある。ガードで囲み、離れた場所に置く。
    - name: 電気コード・暖房器具のコードをかじる
      short: コードをかじる
      emoji: "🔌"
      reason: 感電や、火事の原因になる。コードを隠すカバーを使うか、近づけない工夫を。
    - name: 鍋・料理の食材（ネギ類・チョコ・おせちなど）
      short: 鍋・おせち
      emoji: "🍲"
      reason: 鍋の具や、おせち、クリスマスのお菓子には、犬猫に危険な食材が多い。玉ねぎやネギ類、チョコレートは特に注意。食卓の食べ物は分けない。
    - name: 低温やけど（こたつ・ホットカーペット・電気毛布）
      short: 低温やけど
      emoji: "♨️"
      reason: ぬくぬくと同じ場所で寝続けると、皮膚の深い部分までやけどになることがある。熱い場所だけでなく、涼しい逃げ場も用意する。
    - name: 融雪剤・凍結防止剤の誤飲
      short: 融雪剤
      emoji: "🧂"
      reason: 散歩で足についた融雪剤をなめると、口やお腹のトラブルになる。帰宅したら、足をよく洗って拭く。
  B:
    - name: 寒すぎる室温で、関節や体調を悪くする
      short: 寒すぎる室温
      emoji: "🥶"
      reason: 子犬・子猫・高齢のペットは、寒さで体調をくずしやすい。持病がある場合は、特に室温を保つ。
    - name: 暖房での乾燥・脱水
      short: 乾燥・脱水
      emoji: "💧"
      reason: 暖房で、空気が乾燥し、水を飲む量が減ることがある。新鮮な水を、あちこちに用意する。
    - name: 水が冷たすぎる・凍る
      short: 凍る水
      emoji: "🧊"
      reason: 冷たすぎる水は、飲まなくなる原因にも。室内でも、水が冷えすぎないよう、置き場所を考える。
    - name: 散歩中に凍結した道で滑る
      short: 凍った道
      emoji: "⛸️"
      reason: 人も犬も転んで、ケガをする危険がある。凍った道は避け、歩くときは、ゆっくり。
    - name: 閉じこめ事故（暖かい家具・押し入れ・洗濯機）
      short: 閉じこめ事故
      emoji: "🚪"
      reason: 暖かい場所に入りこんで、閉じこめられることがある。扉を閉める前に、ペットがいないか確認する。
  C:
    - name: クリスマスツリーの飾り・電飾
      short: ツリーの飾り
      emoji: "🎄"
      reason: 飲みこんだり、コードをかじったりする危険がある。ツリーの下のほうは、ペットの手が届かないように。
    - name: ポインセチアなどの観葉植物
      short: ポインセチア
      emoji: "🌿"
      reason: 口にすると、お腹をこわすなどの症状が出ることがある。ペットが届く場所には置かない。
    - name: 年末年始の来客や大きな音で、ストレスを受ける
      short: 年末年始のストレス
      emoji: "🔔"
      reason: 来客や、いつもと違う家の様子で、不安になるペットもいる。落ち着ける隠れ場所を用意しておく。
  D:
    - name: 室内にあるだけの人用の暖房（エアコンの風）
      short: エアコンの風
      emoji: "💨"
      reason: 暖かくても、風が直接当たり続けると、乾燥や体調不良の原因になる。風が直接ペットに当たらないよう、向きを調整する。
    - name: 冬の抜け毛・毛玉
      short: 抜け毛・毛玉
      emoji: "🪮"
      reason: 冬毛への生えかわりで、毛が増える時期もある。ブラッシングで、毛玉を予防できる。
summary: |
  冬の危険の最大級は、「不凍液」「猫のユリ」「エンジンルーム」「換気不足」。どれも、少しの油断が命にかかわる。
  暖かさを求めるペットの習性と、人間の暖房や行事の道具は、ときに危険と隣り合わせ。冬が来る前に、家の中と車、庭の危険をチェックしておきたい。
related: [pet-fuyu-goods, inu-kiken, neko-nerubasho]
