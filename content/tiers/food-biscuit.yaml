  - name: ミルクビスケット
    emoji: 🥛
    reason: やさしい甘さ。子供のころの定番おやつ。
  A:
  - name: ソーダクラッカー
    emoji: ⚪
    reason: シンプルで、軽い。チーズやパテをのせて。
  - name: ココナッツビスケット
    emoji: 🥥
    reason: ココナッツの香り。ザクザク食感。
  - name: ピーナッツサンド
    emoji: 🥜
    reason: クラッカーにピーナッツバターをはさんだおやつ。
  - name: ビスコッティ
    emoji: 🍪
    reason: イタリアの、2度焼きのかたいビスケット。コーヒーに浸して食べる。
  - name: 全粒粉ビスケット
    emoji: 🌾
    reason: 素朴な香ばしさ。ヘルシー派の人気者。
  B:
  - name: クリームサンドビスケット
    emoji: 🍥
    reason: クリームをはさんだ、ちょっとぜいたくな味。
  - name: ライ麦クラッカー
    emoji: 🟫
    reason: 香ばしくて、チーズやサーモンと合う。
  - name: ハーブクラッカー
    emoji: 🌿
    reason: ハーブの香りで、大人のおつまみ。
  - name: チョコビスケット
    emoji: 🍫
    reason: チョコレートをかけたビスケット。
  C:
  - name: ダイエットビスケット
    emoji: 🍞
    reason: 体にはよさそうだけど、味は少し物足りない。
  - name: 動物ビスケット
    emoji: 🐻
    reason: かわいいけど、大人には少し物足りない。
  D:
  - name: オートミールビスケット
    emoji: 🥣
    reason: ザクザクした素朴な味。通好み。
  - name: ショートブレッド
    emoji: 🫖
