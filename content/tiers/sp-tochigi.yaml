summary: 栃木は、茂木町のかましん、宇都宮のオータニ、鹿沼の八百半フードセンター（ヤオハン）など、県内発のチェーンが元気。群馬発のベイシアや、福島発のヨークベニマルも、県内に店舗を持っている。
