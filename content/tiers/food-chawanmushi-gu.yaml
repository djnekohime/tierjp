criteria: '① 茶碗蒸しに入れたときのおいしさ

  ② 茶碗蒸しらしさ（入っているとうれしい度）

  ③ 作りやすさ（火の通りやすさ・手に入りやすさ）

  ※ 家庭や地域で定番は違います。ぎんなんは食べすぎに注意が必要と言われ、小さな子どもには控えめに'
