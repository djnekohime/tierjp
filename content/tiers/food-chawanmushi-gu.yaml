summary: '茶碗蒸しは、だしと卵だけでも十分おいしいが、具が加わると、一口ごとに違う味が出て楽しい。S級の「えび」「鶏肉」「しいたけ」は、だしが出て、茶碗蒸し全体の味を底上げしてくれる三本柱。

  具を入れすぎると、卵液が固まりにくくなったり、食べにくくなったりする。1つの器に3〜4種類くらいまでが、ちょうどいい。

  作るときは、卵とだしの割合と、火加減が大事。強火にすると、表面に小さな穴（す）が開いてしまう。弱火でじっくり蒸すか、蒸し器のふたに布巾をはさむと、なめらかに仕上がる。

  冬は、あつあつの茶碗蒸しが、ごちそうになる。お正月やクリスマスの献立にも、一品加えるだけで華やかになる。余ったかまぼこや鶏肉でも作れるので、冷蔵庫の整理にも向いている。

  具に迷ったら、まず「えび・鶏肉・しいたけ・かまぼこ」の4つ。そこから、好みで、ぎんなんやみつばを足していけば、自分の家の定番ができる。

  作る量は、器の7〜8分目まで。ふたをして蒸すと、ふくらんでも安心。蒸し器がなくても、フライパンに水を入れて、ふきんを敷いた上に器を置けば、だいたい同じように作れる。電子レンジを使う場合は、低めの出力で少しずつ加熱し、様子を見ながら調整するのがコツ。具は先に火を通しておくと、仕上がりが安定する。残った茶碗蒸しは、冷やして食べても意外においしい。小さな子どもには、具を細かく刻み、よく冷ましてから食べさせると安心。卵アレルギーのある人には、別の料理を用意しよう。'
