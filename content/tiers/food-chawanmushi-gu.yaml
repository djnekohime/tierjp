title: 茶碗蒸しの具 Tier表
description: えび、鶏肉、しいたけ、かまぼこ、ぎんなん、銀杏…茶碗蒸しの具を、ゾーマが「おいしさ×茶碗蒸しらしさ×作りやすさ」でS〜Dにランク付け。
category: food
