title: 買う予定がなかったのに買った食べ物 Tier表
description: 限定スイーツ、お惣菜の半額シール、試食で買ったもの、新発売、おやつコーナーのお菓子、レジ前のお菓子、ご当地の限定品、パン屋の焼きたて、アイス、特売のお肉…予定外に買ってしまった食べ物を、AIが「つい買っちゃう度」でランク付け。
category: food
genre: コンビニ・スーパー
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① つい手に取ってしまう度

  ② 買ったあとの満足度

  ③ 「また買っちゃった」と思う回数

  '
rank_notes:
  S: 財布の天敵
  D: 意外と買わない
tiers:
  S:
  - name: 半額シールのお惣菜
    short: 半額惣菜
    emoji: 🏷️
    reason: 夕方のスーパーで見かけたら、つい手がのびる。唐揚げ、お寿司、コロッケ。
  - name: コンビニの新発売スイーツ
    short: 新発売スイーツ
    emoji: 🍰
    reason: 「新発売」の文字に弱い。今日だけ、と言いながら買う。
  - name: 試食コーナーで食べたもの
    short: 試食で買った
    emoji: 🥢
    reason: 食べたあとの「悪いなあ」という気持ちが、財布をゆるめる。
  A:
  - name: パン屋の焼きたて
    emoji: 🥐
    reason: 焼きたての香りには勝てない。
  - name: 季節限定のお菓子
    emoji: 🌸
    reason: 桜味、栗味、かぼちゃ味。限定の文字にも弱い。
  - name: レジ横のホットスナック
    short: レジ横スナック
    emoji: 🍗
    reason: レジに並んでいる間に、つい追加。
  - name: アイスクリーム
    emoji: 🍨
    reason: 夏は特に。冷凍ケースの前で、つい足が止まる。
  - name: ご当地の限定品
    emoji: 🎁
    reason: 旅行先や物産展で、ついおみやげを買いすぎる。
  B:
  - name: 特売の肉
    emoji: 🥩
    reason: 安くて買ったけど、冷凍庫に入りきらない。
  - name: お菓子の新商品
    short: お菓子新商品
    emoji: 🍬
    reason: パッケージがかわいいと、つい。
  - name: 野菜の特売
    emoji: 🥬
    reason: 安いからと買ったけど、使い切れない。
  - name: チーズ・ハム
    emoji: 🧀
    reason: おつまみが足りない気がして、カゴに入れる。
  C:
  - name: 調味料の新商品
    short: 調味料新商品
    emoji: 🧂
    reason: 使い切れないのに、新しい味に興味が湧く。
  - name: レトルトカレー
    emoji: 🍛
    reason: ストックに、ついでに1つ。
  D:
  - name: お茶漬けの素・ふりかけ
    short: ふりかけ
    emoji: 🍚
    reason: 使うかわからないけど、あると便利。
  - name: 粉末のスープ
    emoji: 🥣
    reason: ストックして、あまり使わない。
summary: '予定外に買った食べ物は、半額シールのお惣菜・新発売スイーツ・試食で食べたものがS。つい手が出る、財布の天敵たち。

  夕方のスーパーと、レジ前のホットスナックには、特に注意。

  '
