title: AIで作った画像・音楽・動画を使うときの注意 Tier表
description: 利用規約、商用利用、他人の作品や実在の人物に似せない、AI生成の申告、個人情報…AIで作った作品を公開・販売するときの注意を「トラブルの大きさ」でS〜Dにランク付け。
category: ai
tags: [AI, 画像生成, 動画, 音楽制作]
published: 2026-10-05
labels:
  S: 必ず確認
  A: かなり重要
  B: 場面によって
  C: 知っておきたい
  D: 意外な落とし穴
criteria: |
  ① トラブルになったときの大きさ（削除・アカウント停止・損害・信用）
  ② 起こりやすさ（うっかりやってしまいやすいか）
  ③ 事前に防ぎやすいか
  ※ 法律やサービスの規約は、国や時期で変わります。これは一般的な注意点の整理で、法的な助言ではありません。具体的な判断は、使うサービスの最新の規約や、専門家の情報で確認してください
rank_notes:
  S: ここを間違えると、大きなトラブルに
  D: 意外と見落としがち
tiers:
  S:
    - name: 使うAIサービスの、利用規約と商用利用の条件を確認する
      short: 規約・商用利用の確認
      emoji: "📜"
      reason: 作ったものを、販売したり、広告で使ったりできるかは、サービスと契約内容によって違う。無料プランと有料プランで、条件が変わることもある。公開や販売の前に、必ず確認する。
    - name: 実在の人物の顔・声・名前を、本人の許可なく使う
      short: 実在の人物を使う
      emoji: "🧑"
      reason: 肖像や、声、名前の無断利用は、トラブルになりやすい。有名人はもちろん、一般の人も同じ。偽の発言や、本人が言っていないことを作るのも、危険。
    - name: 他人の作品・キャラクターに、そっくりなものを作って公開する
      short: 他人の作品に似せる
      emoji: "🎭"
      reason: 特定の作家やキャラクターに、そっくりなものを公開すると、問題になることがある。「似せて」と指示するのは、避けたほうがよい。
  A:
    - name: AI生成であることの申告が必要なサービスで、申告しない
      short: AI生成の申告
      emoji: "🏷️"
      reason: 販売サイトや動画サービスの中には、AI生成物の申告や表示を求めるところがある。申告しないと、規約違反になる。出品や投稿の画面で、確認する。
    - name: 出力された作品を、確認せずに、そのまま使う
      short: 確認せず公開
      emoji: "👀"
      reason: 画像の中の文字、指の数、背景の細部、音楽の既存曲に似た部分など、思わぬ問題が混ざることがある。公開前に、人の目で確認する。
    - name: 個人情報や、他人の写真を、AIに入力する
      short: 個人情報・他人の写真
      emoji: "🔑"
      reason: 入力した画像や情報の扱いは、サービスごとに違う。人の写真を、許可なく使うのも、避ける。
    - name: ロゴ・ブランド名・商品名を、そのまま作品に入れる
      short: ロゴ・ブランド名
      emoji: "🔖"
      reason: 商標などの権利に関わる。商品として販売するものには、特に注意が必要。
  B:
    - name: 既存の曲に似たメロディが、出てきてしまう
      short: 既存曲に似る
      emoji: "🎵"
      reason: AI音楽でも、偶然、既存曲に似てしまう可能性がある。気になったら、公開を避けたり、別のメロディで作り直したりする。
    - name: AIで作った作品に、自分の「著作権」があると思い込む
      short: 権利の思い込み
      emoji: "🪪"
      reason: AIが作った部分の権利は、国やサービスの規約で扱いが違い、はっきり決まっていない面もある。「自分だけのもの」と、決めつけない。
    - name: 他の人のAI作品を、無断で転載する
      short: 他人のAI作品を転載
      emoji: "🔁"
      reason: AIで作られた作品でも、作った人の権利や、サービスの規約がある。転載する場合は、許可を得る。
    - name: 学習用のデータとして、他人の作品を使う
      short: 他人の作品を学習に
      emoji: "📚"
      reason: 他人の作品を、自分のAIモデルの学習に使う場合は、規約や権利の確認が必要。
    - name: AI生成物であることを、隠して販売する
      short: AI生成を隠す
      emoji: "🙈"
      reason: 買う人に、誤解を与えると、信用を失う。表示ルールに合わせて、正直に伝える。
  C:
    - name: 広告やアフィリエイトに使うときの表示ルール
      short: 広告の表示ルール
      emoji: "📣"
      reason: 実在しない人物の「体験談」風の画像などは、誤解を与えると、問題になる。広告である旨の表記も、必要。
    - name: 素材サイトやフォントの利用条件を、AIの作品に入れて使う
      short: 素材・フォントの条件
      emoji: "🔤"
      reason: AI作品に、他の素材やフォントを組み合わせるときは、それぞれの利用条件も確認する。
    - name: 公開の範囲（SNS・販売・商用）を、あとで変える
      short: 使い道の変更
      emoji: "🔀"
      reason: 最初は個人利用のつもりでも、あとで販売するなら、そのときの規約を、もう一度確認する。
  D:
    - name: 規約の変更に、気づかない
      short: 規約の変更
      emoji: "🔔"
      reason: サービスの規約は、更新される。長く使うなら、ときどき確認する。
    - name: 作った記録を残さない（プロンプト・日付・サービス名）
      short: 記録を残さない
      emoji: "🗃️"
      reason: 後から、どう作ったのか説明が必要になることがある。生成日、使ったサービス、指示の内容を、メモしておくと安心。
summary: |
  いちばん大事なのは、「使うサービスの規約と商用利用の条件を、公開や販売の前に確認する」こと。次に、実在の人物や、他人の作品・キャラクターに似せないこと。
  AI生成の申告が必要なサービスもあるので、正直に、きちんと表示する。法律や規約は変わるので、迷ったら、公式の情報や専門家に確認しよう。
related: [ai-nani-makaseru, ai-fact-check, ai-tools-creator]
