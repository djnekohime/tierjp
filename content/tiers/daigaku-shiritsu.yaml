summary: '私立大学は、早稲田・慶應の「早慶」を頂点に、上智・東京理科・国際基督教（ICU）、そして「MARCH」（明治・青山学院・立教・中央・法政）に、学習院を加えた「GMARCH」が続く。関西では、同志社を筆頭に、関西学院・立命館・関西大学の「関関同立」がある。

  その下に、日東駒専（日本・東洋・駒澤・専修）、産近甲龍（京都産業・近畿・甲南・龍谷）などの大学群が続く。'
