title: 好きな野菜 Tier表
description: じゃがいも、トマト、キャベツ、玉ねぎ、ブロッコリー、きゅうり、なす、ピーマン、ゴーヤ…野菜を、AIが「好きな人の多さ×料理の使いやすさ」でランク付け。子供のころ苦手だった野菜は何位？
category: food
genre: 野菜・果物
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 好きな人の多さ
  ② いろいろな料理に使える便利さ
  ③ その野菜ならではのおいしさ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 台所に欠かせない三大野菜
  D: 大人になって好きになる野菜
tiers:
  S:
    - name: じゃがいも
      emoji: "🥔"
      reason: カレー、肉じゃが、ポテトサラダ、フライドポテト。どんな料理にも変身できる、好きな人が一番多い野菜の一つ。
    - name: トマト
      emoji: "🍅"
      reason: そのままでも、ソースにしても、スープにしてもおいしい。うまみ成分がたっぷりの万能野菜。
    - name: 玉ねぎ
      emoji: "🧅"
      reason: 炒めると甘くなり、料理の味の土台になる。台所にないと困る野菜の代表。
  A:
    - name: キャベツ
      emoji: "🥬"
      reason: 千切り、炒め物、ロールキャベツ、お好み焼き。とんかつのお供にも欠かせない。
    - name: ブロッコリー
      emoji: "🥦"
      reason: 栄養たっぷりで、ゆでるだけでおいしい。お弁当の彩りにも欠かせない。
    - name: とうもろこし
      emoji: "🌽"
      reason: 甘くてプチプチの食感。夏に焼きとうもろこしで食べると最高。
    - name: さつまいも
      emoji: "🍠"
      reason: 焼き芋にするとねっとり甘いスイーツに。秋冬の人気者。
    - name: きゅうり
      emoji: "🥒"
      reason: みずみずしくパリッとした食感。サラダや漬物、冷やしきゅうりで夏に大活躍。
  B:
    - name: にんじん
      emoji: "🥕"
      reason: 彩りと甘みで料理を支える。子供のころ苦手だった人も、グラッセなら食べられることも。
    - name: なす
      emoji: "🍆"
      reason: 油との相性が抜群で、焼きなすや麻婆なすで大活躍。
    - name: かぼちゃ
      emoji: "🎃"
      reason: ほくほくの甘さ。煮物やスープ、スイーツにも使える。
    - name: 大根
      emoji: "⚪"
      reason: おでん、煮物、大根おろし。煮てよし、生でよしの万能選手。
    - name: ほうれん草
      emoji: "🥬"
      reason: 栄養たっぷりの緑の野菜。おひたしやバターソテーで。
  C:
    - name: ピーマン
      emoji: "🫑"
      reason: 子供が苦手な野菜の代表格だが、大人になると青椒肉絲や肉詰めで好きになる人も多い。
    - name: セロリ
      emoji: "🌿"
      reason: 独特の香りで好き嫌いがはっきり分かれる野菜。好きな人はそのままかじるほど。
  D:
    - name: ゴーヤ
      emoji: "🟢"
      reason: 沖縄のゴーヤチャンプルーで知られる苦い野菜。苦みがおいしいと感じるのは、大人になってから。
    - name: パクチー
      emoji: "🌱"
      reason: タイ料理などに欠かせない香りの強い野菜。「大好き」と「絶対に無理」に分かれる、好き嫌いの両極端の代表。
summary: |
  好きな野菜は、じゃがいも・トマト・玉ねぎがS。どれも料理の主役にも脇役にもなれる、台所の三大野菜。
  ピーマン、ゴーヤ、パクチーのように、子供のころは苦手でも、大人になって好きになる野菜も多い。あなたが最近好きになった野菜は？
related: [food-fruits, food-curry-gu]
