title: 勉強する場所の選び方 Tier表
description: 自分の部屋、図書館、カフェ、リビング、オンライン自習室…勉強する場所を、ゾーマが「集中できる度×続けやすさ×手軽さ」でS〜Dにランク付け。
category: manabi
tags:
- 勉強法
- 習慣
published: '2026-10-12'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 集中できるか

  ② 続けやすさ（通いやすさ）

  ③ 手軽さ・費用

  ※ 場所の利用ルールや時間は、各施設で確認してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 図書館・自習室
    emoji: 🏛️
    reason: 静かで、周りも勉強している。やる気が続きやすい。
  - name: 自宅の勉強専用の席
    emoji: 🪑
    reason: 通う手間がない。「ここに座ったら勉強」と決めると効果的。
  A:
  - name: リビングのテーブル
    emoji: 🛋️
    reason: 家族の気配があり、さぼりにくい。ただし、テレビの音に注意。
  - name: カフェ・喫茶店
    emoji: ☕
    reason: 適度なざわめきで集中できる人も。長居には気をつける。
  - name: オンライン自習室・作業部屋
    emoji: 💻
    reason: 画面越しに誰かがいる安心感。どこからでも参加できる。
  - name: 朝の静かな時間帯の自分の部屋
    emoji: 🌅
    reason: 誘惑が少なく、頭がすっきり。
  B:
  - name: 電車・バスの移動中
    emoji: 🚃
    reason: スキマ時間の暗記に最適。
  - name: 公園・ベンチ
    emoji: 🌳
    reason: 気分転換になる。天気に左右される。
  - name: 学校や職場の空き時間・空き教室
    emoji: 🏫
    reason: 使える環境なら便利。
  - name: コワーキングスペース
    emoji: 🖥️
    reason: 集中できる環境。費用がかかる。
  - name: ファミレス・フードコート
    emoji: 🍽️
    reason: ざわざわしている。場所によっては長居しにくい。
  C:
  - name: 寝室・ベッドの上
    emoji: 🛏️
    reason: 眠くなりやすい。
  - name: スマホが手の届くところ
    emoji: 📱
    reason: 通知が気になって、集中が切れる。
  D:
  - name: テレビをつけっぱなしの部屋
    emoji: 📺
    reason: 集中が分散する。
  - name: 長時間のカフェ居座り
    emoji: ⚠️
    reason: お店に迷惑。時間やルールを守る。
  - name: 場所を毎日ころころ変えて探し続ける
    emoji: 🔄
    reason: 探すだけで疲れる。ある程度固定する。
summary: '勉強の場所は、「勉強モードになれるか」で選ぶ。S級は、静かで、ほどよく人の気配がある場所。図書館や自習室がその代表。

  自宅だと誘惑が多いので、勉強専用の席をつくって「ここに座ったら勉強」と決めるのが効果的。'
related:
- benkyo-tsuzukekata
- manabi-kyuukei-kotsu
