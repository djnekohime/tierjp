title: 弁当の主役おかず Tier表
description: 唐揚げ、卵焼き、ハンバーグ、しょうが焼き、焼き鮭、エビフライ、ウインナー、コロッケ…お弁当の主役おかずを、AIが「ふたを開けたときのうれしさ×冷めてもおいしいか」でランク付け。
category: food
genre: ご飯もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① お弁当のふたを開けたときのうれしさ
  ② 冷めてもおいしいか
  ③ 作りやすさ・詰めやすさ
  ※ お弁当は傷まないよう、夏場は保冷剤などで冷やしてください
rank_notes:
  S: お弁当の三大主役
tiers:
  S:
    - name: 唐揚げ
      emoji: "🍗"
      reason: お弁当に入っていてうれしいおかずの王様。冷めても下味がしっかりしていておいしい。
    - name: 卵焼き
      emoji: "🟨"
      reason: 甘い派・しょっぱい派・だし巻き派と、家庭の味が一番出るおかず。黄色い彩りもお弁当に欠かせない。
    - name: ハンバーグ
      emoji: "🍖"
      reason: ソースがからんだハンバーグは、子供のお弁当の主役。
  A:
    - name: しょうが焼き
      emoji: "🐖"
      reason: ご飯がすすむ甘辛いたれ。ご飯の上にのせる「のっけ弁」にも。
    - name: エビフライ
      emoji: "🍤"
      reason: 入っているとテンションが上がる、お弁当のごちそう。
    - name: タコさんウインナー
      short: ウインナー
      emoji: "🐙"
      reason: 切り込みを入れて焼くとタコの形に。子供のころのお弁当の思い出。
    - name: 焼き鮭
      emoji: "🐟"
      reason: のり弁や和風のお弁当の定番。冷めても塩気でご飯がすすむ。
    - name: ミートボール
      emoji: "🟤"
      reason: 甘辛いたれの一口サイズ。お弁当のすき間を埋める人気者。
  B:
    - name: コロッケ
      emoji: "🥔"
      reason: ボリュームがあって、ソースをかければご飯のおかずに。
    - name: 肉巻き
      emoji: "🥕"
      reason: いんげんやにんじんを豚肉で巻いた、彩りのいいおかず。
    - name: とんかつ
      emoji: "🐷"
      reason: ソースのしみたとんかつは、冷めてもおいしい。
    - name: ちくわの磯辺揚げ
      short: 磯辺揚げ
      emoji: "🍥"
      reason: 青のりの香りの揚げたちくわ。のり弁の定番。
    - name: 鶏の照り焼き
      short: 照り焼きチキン
      emoji: "🐔"
      reason: 甘辛いたれで、ご飯とよく合う。
  C:
    - name: ポテトサラダ
      emoji: "🥗"
      reason: お弁当のすき間を埋める名脇役。主役にはなりにくい。
    - name: 煮物
      emoji: "🥕"
      reason: 冷めて味がしみた煮物は、大人のお弁当の主役。
  D:
    - name: さばの味噌煮
      emoji: "🐠"
      reason: 濃いめの味で冷めてもおいしい、渋い主役おかず。
    - name: ナポリタン（お弁当のすき間用）
      short: 弁当のナポリタン
      emoji: "🍝"
      reason: お弁当のすき間に入っている少しのナポリタン。主役ではないが、なぜか一番うれしいという人もいる。
summary: |
  お弁当の主役おかずは、唐揚げ・卵焼き・ハンバーグがS。どれも冷めてもおいしく、ふたを開けた瞬間に笑顔になれるおかず。
  タコさんウインナーやすき間のナポリタンのように、小さなおかずにこそお弁当の思い出が詰まっている。
related: [food-sametemo, food-onigiri, food-karaage]
