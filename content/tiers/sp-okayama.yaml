summary: '岡山は、大黒天物産（ラ・ムー）、天満屋ストア、ハローズ、ニシナ、両備ストアカンパニー、わたなべ生鮮館と、全国的にも知られる地元チェーンが多い。

  県内の小さなスーパーが集まった共同仕入れ組織の「シーエムシー」加盟企業が多いのも、岡山らしい特徴。'
