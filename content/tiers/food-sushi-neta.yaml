title: 寿司ネタ Tier表
description: サーモン、中トロ、うに、いくら、えんがわ、甘えび…回転寿司でも高級店でも愛される寿司ネタを、AIが「食べたい度×満足感×お値打ち感」でランク付け。
category: food
genre: 寿司・海鮮
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「まずこれを食べたい」と思える人気
  ② 口に入れたときの満足感
  ③ 回転寿司でも楽しめるか（お値打ち感）
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 寿司屋に来たら絶対に食べる
  D: 寿司通ほど頼みたくなる
tiers:
  S:
    - name: サーモン
      emoji: "🍣"
      reason: 回転寿司の人気ランキングで長年トップを走り続けるネタ。とろけるような脂と食べやすさで、子供から大人まで大好き。今では寿司の新しい定番。
    - name: 中トロ
      emoji: "🐟"
      reason: マグロの赤身と大トロのいいとこどり。ほどよい脂とうまみで、「寿司といえばマグロ」を実感できる一貫。
    - name: うに
      emoji: "🟡"
      reason: とろける甘さと濃厚な海の香り。値段は高めでも、一貫食べただけで特別な日になる、寿司のごちそう代表。
  A:
    - name: 大トロ
      emoji: "✨"
      reason: 口の中で溶ける脂の甘さは最高級。ただ脂が強いので、何貫も続けて食べるより一貫を味わうタイプ。
    - name: いくら
      emoji: "🔴"
      reason: 軍艦でプチプチはじける食感が楽しい。見た目の華やかさでもテンションが上がる。
    - name: えんがわ
      emoji: "🐠"
      reason: ヒラメやカレイのひれの付け根の部分。コリコリした食感と脂ののりで、回転寿司の人気ネタに。
    - name: ハマチ
      emoji: "🐡"
      reason: ほどよい脂とさっぱりした後味。ブリの若魚で、お手ごろなのにしっかり満足できる。
    - name: 甘えび
      emoji: "🦐"
      reason: ねっとりとした甘さが名前どおり。頭の味噌汁が出てくる店もあり、最後まで楽しめる。
    - name: ほたて
      emoji: "🐚"
      reason: やわらかい身と上品な甘み。炙りにすると香ばしさが加わって、また違ったおいしさになる。
  B:
    - name: 赤身マグロ
      emoji: "🔺"
      reason: マグロ本来のうまみを味わえる定番。脂が少ないのでさっぱり食べられ、何貫でもいける。
    - name: 玉子
      emoji: "🟨"
      reason: 甘い厚焼き玉子。店の味の個性が出るネタとして、玉子で店を選ぶ通もいる。子供にも人気。
    - name: 穴子
      emoji: "🐍"
      reason: ふわっと煮た穴子に甘いつめ（たれ）。江戸前寿司を代表する一貫で、口の中でほどける。
    - name: 真鯛
      emoji: "🎏"
      reason: 上品でくせのない白身の王様。昆布じめにするとうまみが増し、寿司通にも愛される。
    - name: かんぱち
      emoji: "🌊"
      reason: ブリの仲間で、コリッとした歯ごたえとすっきりした脂が魅力。
    - name: しめさば
      emoji: "💠"
      reason: 酢でしめたさばは、脂とさっぱり感のバランスが絶妙。光り物好きにはたまらない。
  C:
    - name: たこ
      emoji: "🐙"
      reason: 噛むほどに味が出るネタ。ただ食感が好みを分けるので、毎回頼む人は少なめ。
    - name: いか
      emoji: "🦑"
      reason: ねっとりとした甘みと歯ごたえ。塩とすだちで食べるとさっぱり。地味だが根強いファンがいる。
    - name: 数の子
      emoji: "🟠"
      reason: コリコリした独特の食感が楽しい、お正月気分のネタ。見かける機会が限られるのでC。
  D:
    - name: 光り物（こはだ・あじ）
      short: こはだ・あじ
      emoji: "🪙"
      reason: 江戸前寿司の職人の腕が分かるといわれるネタ。青魚のくせを楽しめる人ほど、最初や最後に頼みたくなる。
    - name: 白子
      emoji: "☁️"
      reason: クリーミーでとろける冬の味。独特の見た目と味で好みは大きく分かれるが、好きな人には最高のごちそう。
summary: |
  寿司ネタのSは、サーモン・中トロ・うに。特にサーモンは、回転寿司の人気で何年もトップに立ち続ける、今の寿司の主役。
  赤身・白身・光り物・貝と、ネタの種類を知ると寿司はもっと楽しくなる。「最初の一貫」と「最後の一貫」を何にするかで、その人の寿司の好みが分かる。
related: [food-onigiri, kandrama-gourmet]
