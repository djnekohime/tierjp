title: 韓国語で最初に覚えたい言葉・フレーズ Tier表
description: 안녕하세요、감사합니다、네・아니요、맛있어요、사랑해요、화이팅…韓国語の最初に覚えたい言葉やフレーズを、「使う頻度・ドラマや旅行での役立ち度」でS〜Dにランク付け。カタカナ読み付き。
category: manabi
tags: [韓国語, 勉強法, 初心者]
published: 2026-10-05
labels:
  S: 最初の最初に
  A: すぐ使える
  B: 旅行で役立つ
  C: ドラマ・K-POP好きに
  D: 慣れてから
criteria: |
  ① 使う頻度（毎日・旅行・ドラマで耳にするか）
  ② 覚えやすさ（短い・発音しやすい）
  ③ 会話の幅が広がるか
  ※ カタカナ読みは、あくまで目安です。実際の発音は、動画や音声で確認してください。丁寧な言い方（ヘヨ体・ハムニダ体）を中心に載せています
rank_notes:
  S: まずこの数個
  D: 少し慣れてから
tiers:
  S:
    - name: 안녕하세요（アンニョンハセヨ）
      short: こんにちは
      emoji: "👋"
      reason: 「こんにちは」。朝昼晩いつでも使える、いちばん基本のあいさつ。まずこれだけ覚えたら、会話の入り口に立てる。
    - name: 감사합니다（カムサハムニダ）
      short: ありがとうございます
      emoji: "🙏"
      reason: 丁寧な「ありがとうございます」。旅行でも、お店でも、よく使う。
    - name: 네（ネ）／아니요（アニヨ）
      short: はい／いいえ
      emoji: "⭕"
      reason: 「はい」と「いいえ」。短くて、会話の返事に、ひんぱんに使う。
  A:
    - name: 죄송합니다（チェソンハムニダ）
      short: 申し訳ありません
      emoji: "🙇"
      reason: 丁寧な「すみません・申し訳ありません」。お店や、人にぶつかったときなどに。
    - name: 괜찮아요（ケンチャナヨ）
      short: 大丈夫です
      emoji: "👌"
      reason: 「大丈夫です」。ドラマでもよく聞く、使いやすい言葉。断るときにも使える。
    - name: 맛있어요（マシッソヨ）
      short: おいしいです
      emoji: "😋"
      reason: 「おいしいです」。食事のときに使えて、お店の人にも喜ばれる。
    - name: 주세요（チュセヨ）
      short: ください
      emoji: "🤲"
      reason: 「ください」。注文や買い物で、物の名前に付けて使う、大活躍の言葉。
    - name: 고마워요（コマウォヨ）
      short: ありがとう
      emoji: "💕"
      reason: 少しやわらかい、「ありがとう」。親しい人や、ドラマの会話でよく聞く。
  B:
    - name: 얼마예요?（オルマエヨ）
      short: いくらですか
      emoji: "💰"
      reason: 「いくらですか」。買い物や、屋台で、すぐ使える。
    - name: 화장실이 어디예요?（ファジャンシリ オディエヨ）
      short: トイレはどこですか
      emoji: "🚻"
      reason: 「トイレはどこですか」。旅行で、いざというとき、とても役に立つ。
    - name: 처음 뵙겠습니다（チョウム ペッケッスムニダ）
      short: はじめまして
      emoji: "🤝"
      reason: 「はじめまして」。丁寧な自己紹介のはじめに。
    - name: 잘 먹겠습니다（チャル モッケッスムニダ）
      short: いただきます
      emoji: "🍽️"
      reason: 「いただきます」。食事の前に、言うと、礼儀正しい印象になる。
    - name: 안녕히 가세요／안녕히 계세요（アンニョンイ カセヨ／アンニョンイ ケセヨ）
      short: さようなら
      emoji: "👋"
      reason: 「さようなら」。去る人には「カセヨ」、残る人には「ケセヨ」と、使い分ける。
    - name: 잠깐만요（チャムカンマンニョ）
      short: ちょっと待って
      emoji: "✋"
      reason: 「ちょっと待ってください」。お店や、人混みなどで、使いやすい。
  C:
    - name: 사랑해요（サランヘヨ）
      short: 愛しています
      emoji: "❤️"
      reason: 「愛しています」。ドラマや歌で、何度も耳にする、有名な言葉。
    - name: 보고 싶어요（ポゴ シッポヨ）
      short: 会いたいです
      emoji: "🥺"
      reason: 「会いたいです」。ドラマの名場面や、歌詞によく出てくる。
    - name: 화이팅（ファイティン）
      short: ファイト！
      emoji: "💪"
      reason: 「がんばれ！」の応援。ドラマ、K-POP、スポーツなどで、よく聞く。
    - name: 대박（テバク）
      short: すごい！
      emoji: "🎉"
      reason: 「すごい！」「最高！」。驚いたり、感動したときの、カジュアルな言葉。
    - name: 진짜（チンチャ）
      short: 本当に
      emoji: "😲"
      reason: 「本当に」「マジで」。会話によく出てくる、便利な言葉。
  D:
    - name: 오빠（オッパ）／언니（オンニ）
      short: 呼び方（兄・姉）
      emoji: "👫"
      reason: 年上の人への呼び方。女性が年上の男性を「オッパ」、年上の女性を「オンニ」と呼ぶ。使う相手や場面があるので、ドラマで雰囲気をつかんでから。
    - name: 미안해요（ミアネヨ）
      short: ごめんなさい
      emoji: "😔"
      reason: やわらかい「ごめんなさい」。親しい間柄で使い、目上の人には、「チェソンハムニダ」などのほうが、丁寧。
summary: |
  最初に覚えたいSは、「アンニョンハセヨ」「カムサハムニダ」「ネ／アニヨ」の3つ。たったこれだけでも、あいさつと返事ができて、ぐっと距離が縮まる。
  ドラマやK-POPで、耳にした言葉を、少しずつ増やしていくのが、楽しく続けるコツ。カタカナ読みは目安なので、音声を聞いて、真似してみよう。
related: [kankokugo-benkyou, eigo-ryoko-phrase, benkyo-tsuzukekata]
