title: ポトフ・洋風煮込みの具 Tier表
description: ソーセージ、キャベツ、じゃがいも、にんじん、玉ねぎ、かぶ…ポトフや洋風煮込みに入れる具を、ゾーマが「おいしさ×煮込み向き×手軽さ」でS〜Dにランク付け。
category: food
genre: 鍋・季節の食べ物
tags:
- グルメ
- 冬
published: '2026-11-25'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① ポトフに入れたときのおいしさ（スープに旨みが出るか）

  ② 煮込み向きか（煮くずれしにくいか）

  ③ 手軽さ（下ごしらえ・手に入りやすさ）

  ※ 家庭や地域で定番は違います。ランクは「いちばん多くの人が喜びそうな順」の目安です'
rank_notes:
  S: 迷ったらこれ
  D: 好みが分かれる・変わり種
tiers:
  S:
  - name: ソーセージ
    emoji: 🌭
    reason: 塩気と旨みがスープに溶け出し、これだけで味が決まる。ポトフの主役。
  - name: キャベツ
    emoji: 🥬
    reason: くし切りで入れると、とろっと甘くなる。スープの甘みのもと。
  - name: じゃがいも
    emoji: 🥔
    reason: ほくほくで食べごたえが出る。煮くずれしにくい品種だと形がきれい。
  - name: にんじん
    emoji: 🥕
    reason: 彩りと甘みの担当。大きめに切って、最初から煮るのがコツ。
  A:
  - name: 玉ねぎ
    emoji: 🧅
    reason: 大きめに切ると、とろとろに甘くなる。スープのコクも増す。
  - name: かぶ
    emoji: ⚪
    reason: 煮えるのが早く、やわらかくて甘い。後から入れて煮くずれ防止。
  - name: ベーコン（かたまり）
    emoji: 🥓
    reason: 燻製の香りが加わり、スープが一段おいしくなる。
  - name: 鶏手羽元
    emoji: 🍗
    reason: 骨から旨みが出て、メインのおかずになる。下ゆですると澄んだスープに。
  - name: ブロッコリー
    emoji: 🥦
    reason: 彩りがよく、最後に入れれば色鮮やか。栄養面でもうれしい。
  B:
  - name: 大根
    emoji: ⚪
    reason: 和風寄りだが、だしを吸っておいしい。厚めに切ると煮くずれしにくい。
  - name: セロリ
    emoji: 🌿
    reason: 香りがスープの奥行きになる。苦手な人もいるので少量から。
  - name: カリフラワー
    emoji: 🤍
    reason: ほくっとした食感で、洋風煮込みによく合う。
  - name: ミニトマト
    emoji: 🍅
    reason: 最後に入れると酸味がアクセントに。煮すぎると皮がはがれる。
  - name: マッシュルーム・きのこ
    emoji: 🍄
    reason: 旨みが増して、香りもよい。冷蔵庫の残りきのこも使える。
  - name: ゆで卵
    emoji: 🥚
    reason: あとから入れると、スープが染みた味玉風に。お腹も満たされる。
  C:
  - name: かぼちゃ
    emoji: 🎃
    reason: 甘くておいしいが、煮くずれしやすい。大きめに切って最後に。
  - name: 白菜
    emoji: 🥬
    reason: 甘みは出るが、水分が多く、スープが薄まりやすい。
  - name: れんこん
    emoji: 🟤
    reason: シャキシャキ食感が楽しいが、洋風の味とは好みが分かれる。
  D:
  - name: 葉物を最初から長時間煮る
    emoji: ⏳
    reason: 色がくすみ、くたくたに。葉物は最後にさっと入れたい。
  - name: 味の強い具（キムチなど）をたくさん入れる
    emoji: 🌶️
    reason: ポトフのやさしい味がかき消される。アレンジは翌日に。
summary: 'ポトフは、具を大きめに切って、水と塩とコンソメで煮るだけ。手間が少ないのに、寒い夜にはごちそうになる、冬の頼れる一品だ。S級は「ソーセージ」「キャベツ」「じゃがいも」「にんじん」。ソーセージの塩気と旨みがスープに溶け出し、キャベツの甘みと合わさるだけで、味が決まる。じゃがいもとにんじんは、ほくほくとした食べごたえと彩りの担当。この4つがあれば、まず失敗しない。

  A級には、玉ねぎ、かぶ、ベーコン、ブロッコリー、鶏手羽元など。玉ねぎは丸ごとに近い大きさで入れると、とろっと甘くなる。かぶは煮えるのが早いので、後から入れるのがコツ。鶏手羽元を入れると、スープがぐっと濃くなり、メインのおかずにもなる。

  おいしく作るコツは3つ。①具は大きめに切る（煮くずれしにくく、食べごたえが出る）②火の通りにくい根菜から先に入れる ③ぐらぐら沸騰させず、弱火でことこと煮る。これだけで、スープが澄んで、やさしい味に仕上がる。

  D級の「葉物を最初から長時間煮る」「味の強い具を入れすぎる」は、色や香りが悪くなったり、スープの味がぶつかったりしやすい。

  残ったら、翌日はカレールーを入れてカレーに、牛乳を足してクリーム煮に、トマト缶でトマト煮に。2日目のアレンジまで楽しめるのも、ポトフのいいところ。粒マスタードを添えると、味が引き締まって大人の味になる。あなたの家のポトフに欠かせない具は、どれ？ ぜひ並べ替えて、自分のTier表を作ってみてほしい。'
