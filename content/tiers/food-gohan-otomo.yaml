title: ご飯のお供 Tier表
description: 明太子、納豆、卵かけご飯、のりの佃煮、梅干し、鮭フレーク、キムチ、しらす…ご飯のお供を、AIが「ご飯が止まらない度×手軽さ」でランク付け。白いご飯に何をのせる？
category: food
genre: ご飯もの
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① ご飯が止まらなくなる度
  ② 冷蔵庫から出してすぐ食べられる手軽さ
  ③ 毎日食べても飽きないか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: ご飯が何杯でもいける
  D: ご当地・通好みのお供
tiers:
  S:
    - name: 明太子
      emoji: "🌶️"
      reason: ピリッと辛く、プチプチ食感。一切れでご飯一杯いける、ご飯のお供の王様。
    - name: 卵かけご飯（生卵）
      short: 卵かけご飯
      emoji: "🥚"
      reason: 生卵としょうゆだけで、最高の一杯に。専用のしょうゆが売られるほど、日本人に愛されている。
    - name: 納豆
      emoji: "🫘"
      reason: ねばねばとうまみでご飯が進む、朝ごはんの定番。ねぎやからし、キムチを足すアレンジも楽しい。
  A:
    - name: 鮭フレーク
      emoji: "🐟"
      reason: ほぐした鮭の塩気がご飯にぴったり。瓶から出してすぐ使える手軽さが強み。
    - name: のりの佃煮
      emoji: "⬛"
      reason: 甘辛い味で、子供のころから食べてきた人が多い懐かしいお供。
    - name: 梅干し
      emoji: "🟣"
      reason: すっぱさで食欲がわく、昔ながらのお供。お茶漬けにしてもおいしい。
    - name: キムチ
      emoji: "🌶️"
      reason: 辛さとうまみ、シャキシャキ食感。納豆や卵と合わせてもおいしい。
    - name: しらす
      emoji: "🐟"
      reason: やさしい塩気。大根おろしやしょうゆと合わせて、さっぱり食べられる。
  B:
    - name: 牛肉のしぐれ煮
      emoji: "🥩"
      reason: 甘辛く煮た牛肉としょうがの香り。ちょっと贅沢なお供。
    - name: なめたけ
      emoji: "🍄"
      reason: えのきを甘辛く煮たとろとろのお供。冷奴やおろしにのせてもおいしい。
    - name: たくあん
      emoji: "🟨"
      reason: ポリポリした食感と甘み。ご飯の合間の箸休めの定番。
    - name: ふりかけ
      emoji: "🧂"
      reason: かけるだけで手軽に味が変わる。種類が多く、子供のお弁当の強い味方。
    - name: 食べるラー油
      emoji: "🔥"
      reason: フライドガーリックとラー油のザクザク食感。一時は大ブームになり、今も定番のお供に。
  C:
    - name: 昆布の佃煮
      emoji: "🌿"
      reason: 甘辛く煮た昆布。おにぎりの具にもなる万能選手だが、ご飯のお供としては控えめ。
    - name: ちりめん山椒
      emoji: "🟢"
      reason: 京都の名物。山椒のピリッとした香りが大人の味わい。
  D:
    - name: いかの塩辛
      emoji: "🦑"
      reason: 独特の塩気とうまみ。お酒のつまみとしても人気だが、好き嫌いははっきり分かれる。
    - name: 辛子高菜
      emoji: "🥬"
      reason: 九州でおなじみのピリ辛の高菜漬け。豚骨ラーメンのお店でご飯と一緒に食べるとやみつきに。
summary: |
  ご飯のお供は、明太子・卵かけご飯・納豆がS。どれも白いご飯のおいしさを最大限に引き出す、日本の食卓の宝物。
  ちりめん山椒や辛子高菜のようなご当地のお供は、旅行のおみやげにもぴったり。あなたの「これがあればご飯三杯」は？
related: [food-onigiri, food-don]
