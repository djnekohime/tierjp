title: 冬の柑橘・みかんの種類 Tier表
description: 温州みかん、デコポン、せとか、はるみ、ポンカン、伊予柑…冬の柑橘を、ゾーマが「甘さ×食べやすさ×手に入りやすさ」でS〜Dにランク付け。
category: food
genre: 野菜・果物
tags:
- グルメ
published: '2026-11-01'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 甘さと酸味のバランス

  ② 食べやすさ（皮のむきやすさ・種の少なさ）

  ③ 手に入りやすさ

  ※ 品種や産地、収穫の時期で味はかなり変わります。ここでは一般的な傾向をまとめています'
rank_notes:
  S: 迷ったらこれ
  D: 好みが分かれる
tiers:
  S:
  - name: 温州みかん
    emoji: 🍊
    reason: 冬の定番。皮がむきやすく、甘酸っぱいバランス。毎日食べても飽きない。
  - name: デコポン（不知火）
    emoji: 🍊
    reason: ぷりっとした食感と強い甘み。ヘタ部分の出っぱりが目印。
  A:
  - name: せとか
    emoji: 🍊
    reason: とろけるような食感と濃い甘み。「柑橘の大トロ」と呼ばれることも。
  - name: はるみ
    emoji: 🍊
    reason: 甘みが強く、袋ごと食べやすい。出回る時期は冬〜早春。
  - name: ポンカン
    emoji: 🍊
    reason: 香りがよく、皮がむきやすい。甘みが際立つ品種。
  - name: ネーブルオレンジ
    emoji: 🍊
    reason: ジューシーで甘み強め。底のへそ部分が特徴。
  B:
  - name: 清見（きよみ）
    emoji: 🍊
    reason: ほどよい甘酸っぱさ。種が少なめで食べやすい。
  - name: 伊予柑
    emoji: 🍊
    reason: さわやかな香りとシャキッとした食感。
  - name: ハッサク
    emoji: 🍊
    reason: ほろ苦さと甘みのバランス。独特の味わいで、ファンが多い。
  - name: いよかんゼリー・加工品
    emoji: 🍮
    reason: 生とは違う楽しみ方。旬を逃しても楽しめる。
  - name: 金柑
    emoji: 🍊
    reason: 皮ごと食べる小粒の柑橘。のどにやさしいイメージで人気。
  C:
  - name: グレープフルーツ
    emoji: 🍊
    reason: さっぱり系。薬との飲み合わせに注意が必要なことがある。
  - name: ブンタン（ザボン）
    emoji: 🍊
    reason: 大きくて爽やか。皮が厚く、むくのに手間がかかる。
  - name: ゆず（食べるより香り用）
    emoji: 🍊
    reason: 皮や果汁を料理や入浴に使うのが一般的。
  D:
  - name: 皮に傷みやカビがある実
    emoji: ⚠️
    reason: 食べないほうが安心。ほかの実にも広がりやすい。
  - name: 食べすぎて、お腹をこわす
    emoji: 🤢
    reason: 1日2〜3個を目安に、ほどほどに。
  - name: ワックス・防腐剤の説明を確認せず、皮を食べる
    emoji: 🔍
    reason: 皮ごと食べる場合は、国産で皮まで使える表示を確認する。
summary: '冬の柑橘は、こたつの友。S級の温州みかんは、皮がむきやすく、甘みと酸味のバランスもよく、手に入りやすい。毎日食べても飽きにくい。

  デコポンやせとかのような少し贅沢な品種は、ぷりっとした食感や、強い甘みが魅力。ただし、価格は高めなので、ごほうびに。

  みかんは、食べすぎると、手が黄色くなることがある。これは、カロテンの影響で、心配はいらない。ただ、食べすぎでお腹がゆるくなる人もいるので、1日2〜3個くらいを目安に。薬を飲んでいる方は、グレープフルーツ類との組み合わせに注意が必要な場合があるので、医師や薬剤師に確認を。'
related:
