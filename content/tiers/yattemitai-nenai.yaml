title: 年内に、やってみたいこと Tier表
description: 押し入れの整理、写真のバックアップ、感謝の連絡、1年の振り返り…今年のうちにやっておきたい小さなことを、ゾーマが「スッキリ度×手軽さ×来年への効き目」でS〜Dにランク付け。
category: yattemitai
tags:
