criteria: '① スッキリ度（やって気持ちいいか）

  ② 手軽さ（1日以内で終わるか）

  ③ 来年への効き目

  ※ 全部やる必要はありません。今年は、できることだけで大丈夫です'
rank_notes:
  S: 今年のうちに
