  - name: 写真・データを、バックアップする
    emoji: 💾
    reason: 故障や紛失から、思い出を守れる。やっておくと、本当に安心。
  - name: 大切な人に、感謝のメッセージを送る
    emoji: 💌
    reason: 短くてもいい。送る側も、もらう側も、あたたかくなる。
  - name: 1年の「できたこと」を、3つ書き出す
    emoji: 📝
    reason: 自分を認められて、気持ちが前向きに。来年の自信になる。
  A:
  - name: スマホの写真を、整理する
    emoji: 📸
    reason: 探しやすくなり、見返す楽しみが増える。
  - name: 財布・カバンの中を、整える
    emoji: 👜
    reason: ごちゃごちゃが減り、気持ちもすっきりする。
  - name: 読みたかった本を、1冊読み切る
    emoji: 📚
    reason: 小さな達成感が味わえる。年内の自信になる。
  - name: 冬支度のものを、点検する
    emoji: 🧣
    reason: 必要なものが分かり、寒さに慌てずにすむ。
  - name: 来年の手帳・カレンダーを、先に用意する
    emoji: 📒
    reason: 新しい年のワクワクが、今から始まる。
  B:
  - name: 押し入れ・クローゼットを、少しだけ整理する
    emoji: 🧺
    reason: 1段だけでも、見える景色が変わる。
  - name: 家計を、ざっくり見直す
    emoji: 💰
    reason: 無駄に気づける。年末の出費に備えられる。
  - name: ずっと気になっていた場所へ、出かける
    emoji: 🚃
    reason: 年内にやっておくと、心残りが減る。
  - name: 気になる習い事・講座を、体験してみる
    emoji: 🎓
    reason: 新しい年に向けた、一歩になる。
  - name: おいしいものを、自分にごほうびで食べる
    emoji: 🍰
    reason: 頑張った1年を、ねぎらう時間に。
  - name: 年賀状やあいさつの準備を、始める
    emoji: ✉️
    reason: ぎりぎりに慌てず、余裕を持てる。
  C:
  - name: 大掃除を、全部こなそうとする
    emoji: 🧹
    reason: やる気は大事だが、無理すると疲れる。場所を絞ると続く。
  - name: 新しい目標を、たくさん立てる
    emoji: 🎯
    reason: 増やしすぎると、重たくなる。1〜2個に絞ると◎。
  - name: 年内に、全部終わらせようと焦る
    emoji: ⏰
    reason: 焦ると疲れて、楽しめない。できる分だけで十分。
  D:
  - name: やらなきゃ、と自分を責める
    emoji: 🙅
    reason: 気持ちが重くなるだけ。できなかった分は来年に回していい。
  - name: 寝不足になるまで、頑張りすぎる
    emoji: 🌙
    reason: 体調をくずしては、元も子もない。休むことも、大事な年内のタスク。
summary: '11月に入ると、「今年のうちにやっておきたい」という気持ちが、ふっと出てくる。S級は、写真やデータのバックアップ、大切な人への感謝の連絡、1年の振り返り。どれも、やったあとに気持ちが軽くなる。

  大事なのは、「全部やらなくていい」と決めること。やることリストを増やしすぎると、年末が重くなってしまう。おすすめは、まず3つだけ選ぶこと。残りは、来年に回していい。

  おすすめの流れは、「①今日はスマホの写真を整理 ②来週は1人に感謝のメッセージ ③12月の最初に、1年を振り返る時間をつくる」。1つずつ小さく片づければ、年末の大掃除にも、落ち着いて向かえる。

  バックアップは、「やろうと思って先延ばし」にしやすい。でも、スマホの故障や紛失は、突然やってくる。思い出の写真や大事な書類は、今のうちに別の場所にも保存しておくと、本当に安心。

  気持ちの整理も、年内の大事な宿題。「できたこと」を3つ書き出すだけで、今年の自分を肯定できる。「やってみたい」を、自分へのごほうびとして、ぜひ楽しんでね。

  年内にやりたいことは、「終わらせるため」ではなく、「新しい年を気持ちよく迎えるため」にやるもの。できなかったことがあっても、それは、あなたが怠けたわけではなく、今年はそこまで手が回らなかっただけ。来年に、また持ち越せばいい。

  おすすめは、やりたいことを3つだけ、カレンダーに書き込んでおくこと。日付が決まると、不思議と実行できる。そして、やり終えたら、ちゃんと自分をほめてあげてね。あなたの1年は、もう十分頑張った1年。のんびり、楽しく、年末へ向かおう。'
