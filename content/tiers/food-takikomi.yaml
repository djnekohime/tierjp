title: 炊き込みご飯 Tier表
description: 鶏五目、たけのこご飯、栗ご飯、きのこご飯、鯛めし、豆ご飯、あさりご飯、かやくご飯、牡蠣ご飯…炊き込みご飯を、AIが「食べたい度×季節感×おこげのおいしさ」でランク付け。
category: food
genre: ご飯もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「今日はこれが食べたい」と思える人気
  ② 季節を感じる楽しさ
  ③ 冷めてもおいしいか（おにぎり向き）
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 炊き込みご飯の三大定番
  D: ご当地・季節限定の一品
tiers:
  S:
    - name: 鶏五目
      emoji: "🐔"
      reason: 鶏肉、にんじん、ごぼう、しいたけ、油揚げ。家庭の炊き込みご飯の王道。
    - name: たけのこご飯
      emoji: "🎋"
      reason: 春の味覚の代表。シャキシャキのたけのこの香りで季節を感じる。
    - name: 栗ご飯
      emoji: "🌰"
      reason: ほくほくの栗の甘さは、秋のごちそう。
  A:
    - name: きのこご飯
      emoji: "🍄"
      reason: しめじやまいたけのうまみがたっぷり。秋に食べたい。
    - name: 鯛めし
      emoji: "🎏"
      reason: 鯛をまるごと一尾のせて炊き込む、愛媛などの名物。お祝いの日のごちそう。
    - name: 豆ご飯
      emoji: "🫛"
      reason: えんどう豆の甘さと彩り。春の食卓の定番。
    - name: あさりご飯（深川めし）
      short: あさりご飯
      emoji: "🐚"
      reason: あさりのうまみがご飯にしみる。東京・深川の名物としても知られる。
    - name: 牡蠣ご飯
      emoji: "🦪"
      reason: 冬の牡蠣のうまみをご飯にたっぷり。広島などの冬の楽しみ。
  B:
    - name: かやくご飯
      emoji: "🥕"
      reason: 関西での炊き込みご飯の呼び名。具だくさんのやさしい味。
    - name: さつまいもご飯
      emoji: "🍠"
      reason: 甘いさつまいもとご飯の組み合わせ。子供に人気。
    - name: とうもろこしご飯
      emoji: "🌽"
      reason: 芯も一緒に炊くと甘みが出る。夏の人気メニュー。
    - name: 鮭ご飯
      emoji: "🐟"
      reason: 鮭の塩気とうまみで、手軽においしい。
    - name: ツナと塩昆布ご飯
      short: ツナ塩昆布
      emoji: "🥫"
      reason: 家にあるもので作れる、手軽な炊き込みご飯。
  C:
    - name: 赤飯
      emoji: "🔴"
      reason: お祝いの日に炊くもち米のご飯。特別な日の味だが、日常では少なめ。
    - name: パエリア
      emoji: "🥘"
      reason: スペインの炊き込みご飯。魚介たっぷりで華やかだが、家では少し手間がかかる。
  D:
    - name: 峠の釜めし
      short: 峠の釜めし
      emoji: "🍲"
      reason: 群馬県の横川駅で知られる駅弁の釜めし。益子焼の器ごと持ち帰れる、旅の思い出の味。
    - name: いかめし
      emoji: "🦑"
      reason: いかの中にもち米を詰めて炊いた、北海道・森町の駅弁として有名な一品。
summary: |
  炊き込みご飯は、鶏五目・たけのこご飯・栗ご飯がS。春はたけのこ、秋は栗ときのこ、冬は牡蠣と、季節ごとに具を変えて楽しめる。
  鯛めしや深川めし、峠の釜めし、いかめしのように、ご当地の名物になっている炊き込みご飯も多い。釜の底のおこげは、作った人だけのごほうび。
related: [food-onigiri, food-don, food-chahan]
