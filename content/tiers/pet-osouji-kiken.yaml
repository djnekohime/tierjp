title: 大掃除の洗剤・薬品とペット Tier表
description: 塩素系漂白剤、混ぜるな危険、芳香剤、殺虫剤、防虫剤、床用ワックス、掃除機・ほこり、換気…大掃除でペットに危ないものを「危険度・起こりやすさ」でS〜Dにランク付け。年末の掃除で、ペットを守るために。
category: animals
tags: [ペット, 犬, 猫, 年末年始]
published: 2026-10-05
labels:
  S: 命に関わる
  A: 要注意
  B: 気をつけたい
  C: 心がけたい
  D: 小さな落とし穴
criteria: |
  ① 命や健康への危険度
  ② 大掃除で使いやすいか
  ③ 飼い主が防ぎやすいか
  ※ 一般的な注意点の整理です。ペットの種類・体重・体調で、影響は変わります。獣医さんの助言ではなく目安です。製品の注意書きを必ず読み、誤って口にしたときは、すぐに動物病院や、製品の問い合わせ窓口に相談してください
rank_notes:
  S: ペットのいない所で使う
  D: 気をつけたい小さなこと
tiers:
  S:
    - name: 塩素系の漂白剤・カビ取り剤
      short: 塩素系の洗剤
      emoji: "🧴"
      reason: 舐めたり、ガスを吸ったりすると、危険。使うときは、ペットを別の部屋へ離し、よく換気する。
    - name: 洗剤どうしを混ぜる（混ぜるな危険）
      short: 洗剤を混ぜる
      emoji: "☠️"
      reason: 有毒なガスが出ることがある。人にもペットにも危ない。洗剤は、1つずつ使う。
    - name: 殺虫剤・ネズミ駆除剤・防虫剤
      short: 殺虫剤・防虫剤
      emoji: "🪲"
      reason: 舐めたり、食べたりすると、中毒の危険がある。置き場所は、ペットの届かない所に。
  A:
    - name: トイレ・排水口用の強い洗剤
      short: トイレ・排水口洗剤
      emoji: "🚽"
      reason: 便器の水を飲む子には、特に危険。使ったあとは、よく流して、ふたを閉める。
    - name: 床・家具のワックスや、洗浄剤が乾く前の床
      short: 乾く前の床
      emoji: "🧽"
      reason: 乾く前に歩いて、足を舐めてしまうことがある。完全に乾くまで、ペットを入れない。
    - name: 精油（アロマ）・芳香剤・消臭スプレー
      short: アロマ・芳香剤
      emoji: "🌸"
      reason: 特に猫は、精油の成分を分解しにくく、体調をくずすことがある。使うなら、ペットのいない部屋で。
  B:
    - name: 大掃除で出た、ごみ・不用品（ひも・ビニール・電池）
      short: ごみ・不用品
      emoji: "🗑️"
      reason: 袋を開けて、誤飲することがある。電池やボタン電池は、特に危険。ふた付きの容器や、高い所へ。
    - name: 脚立・高い所の作業（落下・ケガ）
      short: 脚立・高所作業
      emoji: "🪜"
      reason: 足元に、ペットがいると、つまずいて、危ない。作業中は、別の部屋で休んでもらう。
    - name: 開けっぱなしのドア・窓（脱走）
      short: ドア・窓の開けっぱなし
      emoji: "🚪"
      reason: 換気や、ごみ出しで、出入りが増える。脱走を防ぐため、ペットのいる部屋は、閉める。
    - name: '窓・ベランダ掃除での転落や脱走'
      emoji: "🪟"
      reason: '網戸を外したり、窓を開けたりして、落ちたり、出てしまったりする。掃除中は、ペットを別の部屋へ。'
  C:
    - name: 掃除機の音・大きな音
      short: 掃除機の音
      emoji: "🔊"
      reason: 音が苦手な子は、ストレスを受ける。落ち着ける場所に、避難させる。
    - name: ほこり・ハウスダストが舞うこと
      short: ほこり・ハウスダスト
      emoji: "🌫️"
      reason: 目や、呼吸器に、刺激になることがある。掃除中は、ペットを別の部屋へ。
    - name: '掃除中に出た小さな部品・ほこりの中の落とし物'
      emoji: "🔩"
      reason: '家具をずらしたときに見つかる、画びょうやゴムなどを、誤飲することがある。見つけたら、すぐ片づける。'
  D:
    - name: 掃除のあとの、洗剤の拭き残し
      short: 洗剤の拭き残し
      emoji: "🧼"
      reason: 床や、ケージ、ペットの食器に残ると、口に入ることがある。水拭きで、しっかり仕上げる。
    - name: 'ペットの食器・ベッドを洗わずに放置する'
      emoji: "🥣"
      reason: '年末にまとめて洗うと、清潔に過ごせる。洗剤は、よくすすいで、完全に乾かしてから戻す。'
summary: |
  Sは、「塩素系の洗剤」「洗剤を混ぜる」「殺虫剤・防虫剤」。大掃除では、強い薬品を使う場面が増えるので、ペットを別の部屋にして、換気をしながら。
  自分で口にしたかもしれないときは、製品名と、量を確認して、すぐに動物病院へ。年末は休診が多いので、連絡先は、先に確認しておこう。
related: [kurashi-osouji-basho, kurashi-nenmatsu-yaru, pet-oshogatsu-kiken]
