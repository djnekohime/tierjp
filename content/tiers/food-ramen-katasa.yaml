title: ラーメンの麺の硬さ Tier表
description: 粉落とし、ハリガネ、バリカタ、カタ、普通、やわ、バリやわ…ラーメンの麺の硬さを、AIが「おいしさ×スープとのなじみ×替え玉との相性」でランク付け。
category: food
genre: ラーメン
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 麺そのもののおいしさ

  ② スープとのなじみ方

  ③ 最後まで食感が続くか

  ※ 呼び方や硬さの基準はお店によってちがいます。目安のランキングです

  '
rank_notes:
  S: 迷ったらこのへん
  D: かなり上級者向け
tiers:
  S:
  - name: カタ
    emoji: 🍜
    reason: 普通より少しだけ硬め。最後まで麺がのびにくく、スープともなじむ、いいとこどり。
  - name: 普通（お店のおすすめ）
    short: 普通
    emoji: ⭐
    reason: 店主が一番おいしいと思って決めた硬さ。初めてのお店はまずこれ。
  - name: バリカタ
    emoji: 🐷
    reason: 博多ラーメンの人気の硬さ。芯が少し残る歯ごたえがクセになる。
  A:
  - name: ハリガネ
    emoji: 🪡
    reason: バリカタよりさらに硬い。数秒しか茹でない、博多ならではの硬さ。
  - name: つけ麺の冷水でしめた麺
    short: 冷水しめ
    emoji: 🧊
    reason: 冷たい水でぎゅっとしめた麺は、コシが強くてつるつる。
  - name: 替え玉はもう一段硬く
    short: 替え玉は硬め
    emoji: 🔁
    reason: 最初は普通、替え玉はバリカタ。スープが冷めてきても麺がのびにくい、通の頼み方。
  - name: 硬め（家系）
    emoji: 🥬
    reason: 家系ラーメンの「麺硬め」。濃いスープの中でも、もちもち感が続く。
  B:
  - name: 粉落とし
    emoji: 💨
    reason: 麺の表面の粉を落とすだけ、というくらい一瞬で上げる硬さ。小麦の味がよくわかる。
  - name: やわ
    emoji: ☁️
    reason: やわらかめ。スープをよく吸って、やさしい食感。
  - name: 柔らかめ（家系）
    emoji: 🍥
    reason: 家系の「麺やわらかめ」。スープがよくからむので、好きな人も多い。
  - name: あつもり
    emoji: ♨️
    reason: つけ麺の麺を温かいまま出してもらう頼み方。つけ汁が冷めにくい。
  C:
  - name: バリやわ
    emoji: 🫠
    reason: かなりやわらかい。のど越しはいいけど、すぐにのびてしまう。
  - name: 子供向けのやわらかめ
    short: お子さまやわ
    emoji: 🧒
    reason: 小さい子も食べやすい、やわらかい麺。大人には物足りない。
  D:
  - name: 湯気通し
    emoji: 🌫️
    reason: 茹でるというより、湯気にくぐらせるだけ。ほぼ生に近い、かなり上級者向けの硬さ。
  - name: 出前でのびた麺
    short: のびた麺
    emoji: 🛵
    reason: スープを吸ってふにゃふにゃ。でも、なんだか懐かしい味がする。
summary: '麺の硬さは、カタ・普通・バリカタがS。初めてのお店では、まず店主おすすめの「普通」を食べてみるのがおすすめ。

  博多ラーメンは、最初は普通、替え玉はバリカタのように、1杯の中で硬さを変えるのも楽しい。

  '
related:
- food-ramen-futosa
- food-ramen-aji
- food-ramen-topping
