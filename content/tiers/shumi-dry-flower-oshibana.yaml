title: ドライフラワー・押し花の作り方 Tier表
description: ハンギング、シリカゲル、本に挟む、電子レンジ…お花を長く楽しむドライフラワー・押し花の作り方を、ゾーマが「失敗しにくさ×仕上がり×手軽さ」でS〜Dにランク付け。
category: shumi
tags:
- 初心者
- ハンドメイド
published: '2026-11-13'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 失敗しにくさ

  ② 仕上がりのきれいさ

  ③ 手軽さ（道具・時間）

  ※ 花の種類や季節、お部屋の環境で結果は変わります。電子レンジや火の使用は、説明書や安全に十分注意してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: ハンギング（逆さにつるして乾かす）
    emoji: 💐
    reason: 道具が要らず、いちばん手軽。風通しのよい場所なら、失敗しにくい。
  - name: 本や新聞紙に挟んで作る押し花
    emoji: 📖
    reason: 重しにもなり、待つだけで完成。初心者でも始めやすい。
  A:
  - name: 直射日光を避けて、日陰で乾かす
    emoji: 🌙
    reason: 色あせを防ぎ、きれいな色が残る。
  - name: かすみ草・スターチス・ラベンダーなど、乾きやすい花を選ぶ
    emoji: 🌸
    reason: 最初の1回は、失敗しにくい花から。
  - name: しおりやハガキなど、小さな作品にする
    emoji: 🔖
    reason: 少ない花でも作れて、プレゼントにもなる。
  - name: 乾いたら、ガラス瓶やフレームに飾る
    emoji: 🫙
    reason: ほこりよけにもなり、見映えもよい。
  B:
  - name: シリカゲルで色を残す
    emoji: 🧂
    reason: 色がきれいに残る。粉を吸い込まないように。
  - name: 吊るした花を、吊るす前に葉を取る
    emoji: 🍃
    reason: 乾きやすくなり、カビの予防にもなる。
  - name: ワックスやレジンで固める
    emoji: ✨
    reason: 長持ちするが、道具と手順が必要。換気や使い方に注意。
  - name: 花束をもらったら、一部だけドライにする
    emoji: 🎁
    reason: 思い出を、そっと残せる。
  - name: 好きな色や雰囲気で、花を組み合わせる
    emoji: 🎨
    reason: スワッグにすると、壁のアクセントになる。
  C:
  - name: 電子レンジで、短時間で乾かす
    emoji: ⚡
    reason: 早いが、焦げたり、加熱しすぎたりしやすい。説明書や安全に注意。
  - name: 自然乾燥のまま、室内に長く飾り続ける
    emoji: ⏳
    reason: ほこりや色あせが気になる。数か月で入れ替えを。
  - name: 生花をそのまま、乾いた場所に置いておく
    emoji: 🌾
    reason: うまく乾くこともあるが、色が変わったり、カビたりしやすい。
  D:
  - name: 水分の多い花を、そのまま挟む
    emoji: 💦
    reason: カビや変色の原因になる。先に水気を取る。
  - name: 湿気の多い場所で、乾かす
    emoji: 🌧️
    reason: 乾かず、カビが生えやすい。
  - name: ペットが届く場所に、花を置く
    emoji: 🐾
    reason: 花の種類によっては、有害なものも。置き場所と種類に注意。
  - name: 火を使って乾かす
    emoji: 🔥
    reason: 焦げたり、火事の危険もある。安全な方法を選ぶ。
summary: 'ドライフラワーや押し花は、お花を長く楽しめる、とても気軽な趣味。S級は「ハンギング（逆さにつるして乾かす）」と「本や新聞紙に挟む押し花」。道具はほとんど要らず、失敗しても、お花代が少しもったいないくらいで済む。

  ハンギングは、風通しのよい、直射日光の当たらない場所でつるすのがコツ。日に当たると、色があせやすい。バラやかすみ草、スターチスのような、水分が少なめのお花は、とくに向いている。

  シリカゲルは、色をきれいに残したいときの強い味方。ただし、粉末を使うので、使う場所や、吸い込まないことに気をつけたい。電子レンジを使う方法は、短時間でできるが、焦げたり、発火したりすることもあるので、様子を見ながら、少しずつ。

  押し花は、本に挟んで、数日〜数週間待つだけ。待つ時間が、楽しみにもなる。ティッシュや新聞紙で挟むと、本が湿気を吸ってしまうのを防げる。

  できあがったお花は、しおり、ハガキ、フォトフレームなどに使うと、手作りのプレゼントにもなる。お気に入りの花束を、長く手元に残すのは、とても豊かな時間だ。

  ドライフラワーは、時間がたつと、ほこりを吸ったり、色があせたりする。数か月を目安に、入れ替えるつもりで楽しむのが、いちばん気楽。ペットがいる家では、お花の種類によって、猫や犬に有害なものもあるので、置き場所と種類に注意してほしい。

  仕上げのひとことを添えると、作ったドライフラワーは、ぐっと特別になる。たとえば、小さな瓶にまとめて、日付と花の名前を書いたタグを付けておくと、あとで見返したときの思い出になる。花束をいただいた日のことも、きっと一緒によみがえってくるはず。うまくできなかった日も、それはそれで味わい。肩の力を抜いて、季節ごとに少しずつ楽しんでみてほしい。'
