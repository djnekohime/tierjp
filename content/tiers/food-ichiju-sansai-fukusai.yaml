title: 一汁三菜の副菜 Tier表
description: ほうれん草のおひたし、きんぴら、冷奴、ひじき煮、切り干し大根…11月13日「一汁三菜の日」にちなみ、定番の副菜を、ゾーマが「作りやすさ×栄養のバランス×ごはんとの相性」でS〜Dにランク付け。
category: food
genre: ご飯もの
tags:
- グルメ
- 初心者
published: '2026-11-13'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 作りやすさ（手間・時間）

  ② 献立のバランスがとりやすいか

  ③ ごはん・味噌汁との相性

  ※ 栄養の話は一般的な目安です。持病や食事制限のある方は、医師・管理栄養士の指示に従ってください'
rank_notes:
  S: 迷ったらこれ
  D: 好みが分かれる・変わり種
tiers:
  S:
  - name: ほうれん草のおひたし
    emoji: 🥬
    reason: ゆでて、しょうゆとだしで和えるだけ。緑が入り、献立の彩りがよくなる。
  - name: 冷奴
    emoji: ⬜
    reason: 切って薬味をのせるだけ。どんな主菜とも合い、疲れた日の強い味方。
  - name: きんぴらごぼう
    emoji: 🥕
    reason: 甘辛い味でごはんが進む。作り置きもでき、食物繊維もとれる。
  A:
  - name: ひじき煮
    emoji: 🌿
    reason: 作り置きの定番。ごはんにのせても、おにぎりに混ぜてもおいしい。
  - name: 切り干し大根の煮物
    emoji: 🥢
    reason: 乾物で常備でき、甘みがやさしい。戻す時間さえ守れば簡単。
  - name: きゅうりとわかめの酢の物
    emoji: 🥒
    reason: さっぱりして、こってりした主菜の口直しになる。
  - name: かぼちゃの煮物
    emoji: 🎃
    reason: ほくほくと甘く、冬至の頃にもぴったり。やわらかく煮えれば、子どもも食べやすい。
  - name: 白和え
    emoji: ☁️
    reason: 豆腐の衣でやさしい味。手間はややかかるが、特別感がある。
  B:
  - name: ごま和え（いんげん・小松菜など）
    emoji: 🌱
    reason: ごまの香りで、野菜がたっぷり食べられる。
  - name: だし巻き卵
    emoji: 🍳
    reason: ふんわり黄色で、食卓が明るくなる。巻くのに少し慣れが必要。
  - name: 里芋の煮っころがし
    emoji: 🥔
    reason: ねっとり甘辛く、冬にうれしい。皮むきが少し手間。
  - name: 大根のそぼろ煮
    emoji: ⚪
    reason: 大根がやわらかく、体が温まる。主菜にもなる。
  - name: なすの煮浸し
    emoji: 🍆
    reason: だしを含んでじゅわっと。夏は冷やしても。冬はあたためて。
  - name: ポテトサラダ
    emoji: 🥔
    reason: 洋風だが、一汁三菜にも合わせやすい。作り置きに向く。
  - name: 納豆
    emoji: 🫘
    reason: 混ぜるだけの最強の副菜。好みは分かれるが、手軽さは随一。
  C:
  - name: トマトやレタスを、そのまま出すだけ
    emoji: 🍅
    reason: 手軽だが、味つけがなく、物足りなく感じる人も。ドレッシングやだしで一工夫を。
  - name: 揚げ物系の副菜（かき揚げ・コロッケなど）
    emoji: 🍤
    reason: おいしいが、主菜と重なると、こってりしすぎる。
  - name: 煮物を、大量に作りすぎる
    emoji: 🍲
    reason: おいしくても、飽きる。保存のしかたにも注意。
  D:
  - name: 副菜も主菜も、すべて同じ味つけで揃える
    emoji: 😵
    reason: 味が単調になり、食べ疲れる。
  - name: ごはんと汁物だけで、おかずを省く
    emoji: 🍚
    reason: 忙しい日はあっても、続けるとバランスがかたよる。
  - name: 作り置きを、保存せず、常温に出しっぱなしにする
    emoji: ⚠️
    reason: 傷みやすく、食中毒の原因になることがある。
summary: '一汁三菜は、ごはん・汁物・主菜1品・副菜2品という和食の基本の形。難しく考えず、「汁物＋おかず3つ」と覚えておけば十分だ。ただ、毎日3品も作るのは大変。そこで、副菜は「作り置きできるもの」と「切るだけ・和えるだけのもの」の2種類を用意しておくと、ぐっと楽になる。

  S級の「ほうれん草のおひたし」「冷奴」「きんぴらごぼう」は、味つけが決まっていて失敗しにくく、主菜が何でも合わせやすい万能選手。とくに冷奴は、豆腐を切って薬味をのせるだけなので、疲れた日の強い味方になる。

  副菜を選ぶときは、主菜とのバランスを見るのがコツ。主菜が肉なら、さっぱりした酢の物やおひたしを。主菜が魚なら、煮物や和え物で、色とりどりにするときれいに仕上がる。色の目安は「赤・黄・緑・白・黒」の5色。毎回そろえなくても、「今日は緑が足りないな」と気づくだけで、ぐっとバランスがよくなる。

  忙しい日は、ミニトマトをのせる、きゅうりを塩もみする、納豆を出す、といった「1分副菜」でも立派な一品。完璧な一汁三菜を目指して疲れるより、できる日に、できる形で。続けることのほうが、ずっと大事だ。

  冬は、根菜や、体が温まる煮物が恋しい季節。作り置きの煮物を、毎日少しずつ食べ回すと、忙しい日の安心にもなる。保存するときは、粗熱をとってから冷蔵庫へ入れ、早めに食べ切ること。

  最後に、副菜づくりを楽にする小さなコツをひとつ。週末に2品だけ作り置きしておけば、平日は「汁物を温めて、主菜を焼いて、副菜は出すだけ」で食卓が整う。味つけの系統を、甘辛・さっぱり・こっくりと変えておくと、続けて食べても飽きにくい。完璧な三菜でなくても、「今日は二菜でOK」と自分にやさしくしながら、和食の良さを日々の食卓に取り入れてみてほしい。'
