title: 猫砂の種類 Tier表
description: 鉱物系、紙、おから、ヒノキ、シリカゲル…猫砂の種類を「固まりやすさ・消臭・お手入れ・処分のしやすさ」でS〜Dにランク付け。選び方のコツも。
category: animals
tags: [猫, 動物, 初心者]
published: 2026-10-03
criteria: |
  ① 固まりやすさ・消臭力
  ② 飛び散りにくさ・お手入れのしやすさ
  ③ 処分のしやすさ（トイレに流せる・燃えるごみ）
  ④ 猫の使い心地（足ざわり）
  ※ 特定の商品ではなく「種類」のランキングです。いちばん大事なのは、猫が気に入るかどうか。猫によって好みは違います
rank_notes:
  S: 迷ったらここから
  D: おすすめしにくい
tiers:
  S:
    - name: 鉱物系（ベントナイトなど）
      short: 鉱物系
      emoji: "🪨"
      reason: 固まる力と消臭力が高く、猫の足ざわりも自然に近いので、使う猫が多い定番。ただし重く、粉が舞いやすく、トイレには流せないのが難点。
    - name: 紙系（固まるタイプ）
      short: 紙系
      emoji: "📄"
      reason: 軽くて持ち運びやすく、燃えるごみに出せる地域が多い。固まる力や消臭は鉱物系ほどではない商品もあるが、バランスのよい選択肢。
  A:
    - name: おから系
      emoji: "🫘"
      reason: おからで作られており、トイレに流せる商品も多い。足ざわりがやわらかく、食べものに近いにおいで、気に入る猫もいる。ただし、固まりにくい商品や、においが残りやすい商品もある。
    - name: ヒノキ・木質ペレット系
      short: ヒノキ・木系
      emoji: "🌲"
      reason: 木のよい香りで、消臭にも使われる。飛び散りにくいが、固まらないタイプが多く、毎日の掃除が必要。木の香りが苦手な猫もいる。
    - name: 紙ペレット（固まらない）
      short: 紙ペレット
      emoji: "🧻"
      reason: 軽くて燃えるごみにしやすく、飛び散りにくい。尿を吸収して崩れるタイプで、小さい子猫にも使いやすい。
  B:
    - name: 松（パイン）系
      short: 松系
      emoji: "🌲"
      reason: 木の香りと消臭力がある。ペレット状のものが多く、飛び散りにくい。ただし、においの強さが気になる猫もいる。
    - name: ゼオライト（沸石）系
      short: ゼオライト系
      emoji: "💎"
      reason: 吸水と消臭のはたらきがあり、使える期間が長い商品もある。砂の足ざわりが好きな猫に向く。重さと処分方法を確認したい。
    - name: とうもろこし系
      emoji: "🌽"
      reason: 自然素材でトイレに流せる商品もある。食べ物に近いにおいで、猫によって好みが分かれる。
    - name: 竹系
      emoji: "🎋"
      reason: 軽くて吸水しやすく、においがつきにくい商品もある。猫の好き嫌いが分かれる。
  C:
    - name: シリカゲル（クリスタル）系
      short: シリカゲル系
      emoji: "🔮"
      reason: 水分をよく吸い、交換の頻度が少なくて済む。ただし、ザラザラした足ざわりを嫌がる猫もいる。かたまる砂ではなく、掃除の仕方も異なる。
    - name: やし殻（ココナッツ）系
      short: やし殻系
      emoji: "🥥"
      reason: 自然素材で軽く、においがつきにくいとされる。固まりにくい商品が多く、粉が舞うことがある。
    - name: おがくず・ウッドチップ系
      short: おがくず系
      emoji: "🪵"
      reason: 木材から作られていて、安く手に入りやすく、木の香りで消臭もする。固まらないタイプが多く、細かい粉が出る商品もあるので、足ざわりを猫が気に入るか試したい。
    - name: 活性炭入り消臭タイプ
      short: 消臭タイプ
      emoji: "⚫"
      reason: においをおさえたい人に向くが、猫によってはにおいの変化を嫌がる。まず少量で試して、猫の反応を見る。
  D:
    - name: 新聞紙・ちぎった紙
      short: ちぎった紙
      emoji: "📰"
      reason: 手軽にできるが、吸水力や消臭力が弱く、頻繁な交換が必要。非常時の代用品として、知っておく程度でよい。
    - name: 園芸用の土・砂
      short: 土・砂
      emoji: "🌱"
      reason: 虫や雑菌の心配があり、掃除もしにくい。室内飼いのトイレにはおすすめしない。
summary: |
  迷ったら、まずは鉱物系か紙系の「固まるタイプ」から。固まる砂は掃除が簡単で、毎日の健康チェックもしやすい。
  最終的に決めるのは猫。猫砂を変えたいときは、いまの砂に少しずつ新しい砂を混ぜて慣らすと失敗しにくい。トイレが気に入らないと、ほかの場所でしてしまうので、猫の反応を最優先に。
related: [neko-goods, neko-nigate, neko-shurui-shoshinsha]
