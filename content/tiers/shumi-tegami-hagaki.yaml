summary: '手紙やハガキは、メッセージアプリより少し手間がかかる。でも、その手間こそが、相手への「あなたのために時間を使ったよ」という気持ちになる。S級は、短いひとことだけ書くこと、ハガキを数枚ストックしておくこと、書き出しの型を持っておくこと。どれも、気軽に始められる工夫だ。

  おすすめの順番は、①まず1枚、身近な人に「ありがとう」を書く ②季節の切手やハガキを選ぶ ③慣れたら、近況を2〜3行足す。最初から長い文章を書こうとしないのが、続くコツ。

  書き出しは、「寒くなってきましたね」のように、季節のひとことから入れば迷わない。結びは「どうぞ体を大事にね」と、相手を気づかう一言を。

  年末は、年賀状や挨拶状でペンを持つ機会が増える。普段から、少しだけ手書きに慣れておくと、慌てずにすむ。字に自信がなくても大丈夫。丁寧に書いた手書きは、それだけで十分温かい。

  住所録は、年に1度見直すと、宛先の間違いが減る。投函するときは、宛名・住所・切手の貼り忘れがないか、もう一度見ること。気持ちを込めた1枚が、誰かの1日を明るくするかも。

  書くことが思いつかないときは、「最近うれしかったこと」「最近食べておいしかったもの」を1つ書くだけで、立派な手紙になる。長く書かなくても、相手は、あなたの様子が分かって喜んでくれる。

  手紙は、書いた時間も一緒に届く贈りもの。メッセージアプリが便利な時代だからこそ、手書きのハガキが1枚届くと、特別な気持ちになる。今月、誰か1人に出してみようかな、くらいの軽い気持ちで、まず1枚、始めてみて。'
