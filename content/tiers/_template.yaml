      reason: なぜこのランクか（必須）
      # image: /static/img/xxx.png
      # link: https://アフィリエイトURL
      # after: B                # challengeのみ：挑戦後のランク
      # after_comment: やってみた感想
  A: []
  B: []
  C: []
  D: []
summary: |
  総評
related: []                 # 関連Tierのファイル名（書かなくても自動で補う）
