title: スマホ写真がきれいになるコツ Tier表
description: 明るさ、レンズ拭き、光の向き、構図、ピント、手ブレ対策、加工、撮りためた写真の整理…スマホ写真がきれいになるコツを「効果・手軽さ」でS〜Dにランク付け。
category: shumi
tags: [初心者]
published: 2026-10-05
labels:
  S: 効果が大きい
  A: おすすめ
  B: 慣れてきたら
  C: 人を選ぶ
  D: 逆効果になりがち
criteria: |
  ① 写真の見栄えが、よくなる効果
  ② 手軽さ（すぐ試せるか）
  ③ 機種を選ばず、使えるか
  ※ 一般的な目安です。スマホの機種や、設定で、できることは変わります。人物や、子供を撮るときは、相手の同意と、プライバシーに配慮し、SNSに載せる前に、背景や、個人情報が写っていないか確認してください
rank_notes:
  S: まず、これだけで変わる
  D: やりすぎに注意
tiers:
  S:
    - name: レンズの汚れを、拭く
      short: レンズを拭く
      emoji: "🧼"
      reason: 指紋や、ポケットの汚れで、写真がぼんやりすることが多い。柔らかい布で、拭くだけで、見違える。
    - name: 明るい場所で撮る（窓際・屋外の日陰）
      short: 明るい場所で撮る
      emoji: "☀️"
      reason: 光が足りないと、暗くて、ざらつく。やわらかい自然光が、いちばんきれい。
    - name: 光の向きを意識する（順光・逆光を使い分ける）
      short: 光の向き
      emoji: "💡"
      reason: 順光は、はっきり、逆光は、雰囲気のある写真になる。目的に合わせて選ぶ。
  A:
    - name: 画面をタップして、ピントと明るさを合わせる
      short: タップでピント
      emoji: "👆"
      reason: 狙った所に、ピントが合う。明るさも、スライドで調整できる機種が多い。
    - name: 水平・垂直を意識する（グリッド線を使う）
      short: グリッド線
      emoji: "📐"
      reason: 傾きがなくなり、安定した写真になる。設定で、グリッドを表示できる。
    - name: 近づいて撮る（ズームより、自分が寄る）
      short: 自分が寄る
      emoji: "🚶"
      reason: 画質が、落ちにくい。主役が、はっきりする。
    - name: 背景をすっきりさせる（余計なものを写さない）
      short: 背景を整理
      emoji: "🧹"
      reason: 主役が、引き立つ。撮る前に、ごみや、散らかりを、ひとつどけるだけで、変わる。
    - name: 両手で持つ・脇をしめて撮る（手ブレ対策）
      short: 手ブレ対策
      emoji: "🙌"
      reason: ぶれを、減らせる。暗い場所では、特に大事。
  B:
    - name: 構図を工夫する（三分割・斜め・低い位置から）
      short: 構図の工夫
      emoji: "🖼️"
      reason: 同じ被写体でも、印象が変わる。いろいろな角度から撮ると、発見がある。
    - name: 連写・何枚も撮って、よいものを選ぶ
      short: 何枚も撮る
      emoji: "📸"
      reason: 動く被写体や、人物は、表情のよいものを選べる。保存容量には、注意する。
    - name: 三脚・スマホスタンドを使う
      short: 三脚・スタンド
      emoji: "🪜"
      reason: 暗い場所や、夜景でも、ぶれにくい。手頃な価格のものが、ある。
    - name: 写真アプリで、明るさ・色を、少しだけ整える
      short: 軽い編集
      emoji: "🎚️"
      reason: 見栄えが、整う。少し控えめにするのが、自然。
  C:
    - name: 外付けレンズ・ライトなど、スマホ用のアクセサリー
      short: アクセサリー
      emoji: "🔭"
      reason: 表現の幅は広がるが、費用がかかる。まず、標準のカメラを使いこなしてから。
    - name: マニュアル設定（ISO・シャッタースピード）
      short: マニュアル設定
      emoji: "⚙️"
      reason: 細かく調整できるが、知識が必要。慣れてきたら、挑戦する。
  D:
    - name: フラッシュを、ほとんどの場面で使う
      short: フラッシュ多用
      emoji: "⚡"
      reason: 不自然に、白っぽくなりやすい。ペットや、人の目にも、負担になることがある。
    - name: 加工フィルターを、強くかけすぎる
      short: 加工しすぎ
      emoji: "🎭"
      reason: 実物と、かけ離れたり、不自然になったりする。控えめが、基本。
    - name: 人の写真を、許可なく、SNSに載せる
      short: 無断で投稿
      emoji: "🚫"
      reason: 肖像権や、プライバシーの問題になる。載せる前に、必ず、確認する。
summary: |
  Sは、「レンズを拭く」「明るい場所で撮る」「光の向き」。特別な機材がなくても、この3つだけで、スマホ写真は大きく変わる。
  人物や、子供を載せるときは、同意と、背景の個人情報に、気をつけよう。
related: [shumi-hajimeyasui, shumi-shitsunai, sns-short-neta]
