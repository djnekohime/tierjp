title: インコ・小鳥のしぐさの意味 Tier表
description: 羽をふくらませる、片足で立つ、くちばしカチカチ、頭をかしげる…インコや小鳥のしぐさに込められた気持ちを、「うれしい度・注意度」でS〜Dにランク付け。
category: animals
tags: [鳥, 動物, あるある]
published: 2026-10-03
labels:
  S: 大満足
  A: 安心している
  B: ふつう
  C: ちょっと注意
  D: 要注意
criteria: |
  ① 飼い主が見てうれしいか（かわいい・安心できる）
  ② 気持ちの分かりやすさ
  ③ 体調や警戒のサインとして注意が必要か
  ※ 鳥の気持ちは種類や個体で違うので、「よくある意味」として読んでください。元気がない、羽をふくらませたまま動かないなど、調子が悪そうなときは、鳥を診られる動物病院へ
rank_notes:
  S: 鳥がくつろぎきっている合図
  D: 体調や強い不安のサイン
tiers:
  S:
    - name: 片足で立って目を細める
      short: 片足立ち
      emoji: "🦩"
      reason: 片足で立ってうとうとしているのは、リラックスしているとき。安心して、くつろいでいるサイン。
    - name: くちばしを軽くカチカチ鳴らす
      short: カチカチ
      emoji: "🔔"
      reason: 眠る前などに、小さくカチカチと鳴らす。リラックスしているときの、くちばしのお手入れでもある。
  A:
    - name: 羽づくろいをする
      short: 羽づくろい
      emoji: "🪶"
      reason: くちばしで羽を整える動き。落ち着いている証拠で、元気なサイン。
    - name: 体を軽くふくらませて、ふわふわになる
      short: ふわふわ
      emoji: "☁️"
      reason: 軽くふくらんで、目を細めているのは、くつろいでいるとき。ただし、ずっとふくらんだままで、元気がないときは、体調不良や寒さのサインのこともある。
    - name: 尾羽をふりふりする
      short: 尾羽ふりふり
      emoji: "🎶"
      reason: うれしいときや、満足しているときにみられることが多い。見ているだけで、こちらも楽しくなる。
    - name: 肩や手に乗ってくる
      short: 肩に乗る
      emoji: "🧍"
      reason: 飼い主を信頼しているサイン。ひとときも離れたくない鳥もいる。
    - name: 頭を下げて、なでてほしそうにする
      short: 頭を差し出す
      emoji: "💗"
      reason: 頭をなでてほしいときの、お誘いのポーズ。そっとなでると、気持ちよさそうに目を閉じる。
  B:
    - name: 首をかしげてじっと見る
      short: 首をかしげる
      emoji: "🤔"
      reason: 興味をもって、見たり聞いたりしているサイン。声をかけると、よく反応してくれる。
    - name: 水浴びをする
      short: 水浴び
      emoji: "🛁"
      reason: 水浴びで、体の汚れを落とす。大好きな鳥は多いが、苦手な子もいるので、無理強いはしない。
    - name: 鳴き声やおしゃべりをする
      short: おしゃべり
      emoji: "🗣️"
      reason: 仲間や飼い主へのコミュニケーション。おしゃべりを覚える種類もいるが、個体差が大きい。
    - name: 足で頭をかく
      short: 頭をかく
      emoji: "🦶"
      reason: 羽づくろいの一部。かゆいところをかく、くつろぎの動き。
    - name: 吐き戻しをする
      short: 吐き戻し
      emoji: "💞"
      reason: 愛情表現や求愛のサインとして、えさを吐き戻して見せるインコもいる。ただし、病気の嘔吐との区別が必要で、頻繁にあるなら、獣医さんに相談。
  C:
    - name: 甘がみをする
      short: 甘がみ
      emoji: "🦷"
      reason: 愛情表現や、遊びのつもりのことも。強くなったり、頻繁だったりするときは、無理に続けず、距離をとる。
    - name: 羽をばたばたさせて、鳴き続ける
      short: 鳴き続ける
      emoji: "📢"
      reason: 呼び鳥や、構ってほしいときの行動。呼ぶたびに応えてしまうと、ますます続くので、対応のルールを決めておく。
    - name: 翼をたたまず、少し広げている
      short: 翼を広げる
      emoji: "🪽"
      reason: 暑いときや、体温を調節しているときにみられる。暑がっていたら、室温をチェックする。
  D:
    - name: 羽をふくらませたまま、動かず目を閉じている
      short: ふくらんだまま動かない
      emoji: "🚨"
      reason: 体調が悪いときや、寒いときのサイン。鳥は具合の悪さを隠すので、見つけたらすぐ保温して、鳥を診られる動物病院へ。
    - name: 羽を抜く・自分の羽をかじる
      short: 羽をむしる
      emoji: "⚠️"
      reason: ストレスや退屈、病気が原因のことがある。続くなら、環境を見直すか、獣医さんに相談する。
    - name: くちばしを大きく開けて、息が荒い
      short: 息が荒い
      emoji: "🆘"
      reason: 暑さや呼吸器の病気のサインのこともある。すぐに涼しい場所に移して、様子がおかしいなら、すぐ動物病院へ。
summary: |
  くつろぎのサインは、片足立ちと軽いくちばしカチカチ。安心している鳥の姿は、飼い主にとっていちばんの癒やし。
  一方で、羽をふくらませたまま動かない、息が荒いなどは、体調不良のサイン。鳥は体の弱さを隠すので、小さな変化に早く気づくことが大切。いつもと違うと思ったら、鳥を診られる動物病院に相談を。
related: [tori-shurui, tori-kiken, usagi-shigusa]
