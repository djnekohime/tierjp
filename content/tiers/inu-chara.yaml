title: 犬が活躍する名作キャラクター Tier表
description: ハチ公、スヌーピー、パトラッシュ、ラッシー、タロとジロ…アニメ・映画・実話に登場する有名な犬を、知名度と愛され度でS〜Dにランク付け。
category: animals
tags: [犬, 動物, 名作]
published: 2026-10-03
labels:
  S: 国民的スター
  A: 大人気
  B: 愛される名脇役
  C: 渋い名キャラ
  D: 知る人ぞ知る
criteria: |
  ① 知名度（世代を超えて知られているか）
  ② 愛され度（グッズやファンの多さ）
  ③ 物語の中での存在感
  ※ 好みで順位は変わります。これはAIが基準を決めて並べた、ひとつの見方です
rank_notes:
  S: 誰もが知っている犬たち
  D: 知っていたらかなりの通
tiers:
  S:
    - name: 忠犬ハチ公
      short: ハチ公
      emoji: "🚉"
      reason: 亡くなった飼い主を、渋谷駅で待ち続けた実在の秋田犬。像は待ち合わせ場所として、いまも多くの人に親しまれている。
    - name: スヌーピー（『ピーナッツ』）
      short: スヌーピー
      emoji: "🐶"
      reason: 想像力ゆたかなビーグル犬。世界中で愛される、漫画『ピーナッツ』の人気者。グッズもたくさんあり、世代を超えて愛されている。
    - name: パトラッシュ（『フランダースの犬』）
      short: パトラッシュ
      emoji: "⛪"
      reason: 少年ネロに寄りそった、大きくて優しい犬。物語の結末が、多くの人の心に残る名作。
  A:
    - name: ラッシー（『名犬ラッシー』）
      short: ラッシー
      emoji: "🏞️"
      reason: 賢くて勇敢な、コリー犬の代表的な存在。「名犬」という言葉のイメージを作った。
    - name: タロとジロ（南極物語）
      short: タロとジロ
      emoji: "🧊"
      reason: 南極観測隊に同行した、樺太犬の兄弟。置き去りにされた後に、生き延びたという実話が、映画にもなり、多くの人に知られている。
    - name: プルート（ディズニー）
      short: プルート
      emoji: "🐕"
      reason: ミッキーマウスの飼い犬。言葉は話さず、表情と動きだけで感情を表すのが魅力。
    - name: レディ（『わんわん物語』）
      short: レディ
      emoji: "🍝"
      reason: 気品あふれるコッカー・スパニエルのお嬢さん。野良犬トランプとの、有名なスパゲッティのシーンで知られる。
    - name: ダルメシアン（『101匹わんちゃん』）
      short: 101匹わんちゃん
      emoji: "⚫"
      reason: 白地に黒い斑点が特徴の犬たちの、大冒険を描いた作品。大量の子犬のシーンが印象的。
  B:
    - name: スクービー・ドゥー
      emoji: "🔍"
      reason: ミステリーを解く仲間と一緒に活躍する、臆病な大型犬。ごはんで動く愛らしさが、世代を超えて人気。
    - name: ベートーベン（映画『ベートーベン』）
      short: ベートーベン
      emoji: "🎬"
      reason: 家族に迎えられるセントバーナードの映画。おおらかな大型犬と暮らす楽しさを描いた。
    - name: マーリー（『マーリー 世界一おバカな犬が教えてくれたこと』）
      short: マーリー
      emoji: "🏖️"
      reason: やんちゃで手のかかる、ラブラドールの実話をもとにした物語。やがて家族の大切な存在になっていく姿が胸を打つ。
    - name: スパイク（『トムとジェリー』）
      short: スパイク
      emoji: "🦴"
      reason: 猫のトムを追い払う、強面のブルドッグ。強そうな見た目と、子犬への優しさのギャップが魅力。
    - name: ブルーイ
      emoji: "🔵"
      reason: オーストラリア発のアニメの主人公で、遊び好きな青い子犬。家族の毎日を描いて、大人にも評判になった。
  C:
    - name: チェイス（『パウ・パトロール』）
      short: チェイス
      emoji: "🚓"
      reason: 子どもたちに人気のアニメの、警察犬の役のジャーマン・シェパード。頼れる優等生の人気者。
    - name: シロ（『花咲かじいさん』）
      short: シロ
      emoji: "🌸"
      reason: 日本の昔話で、よいおじいさんを助ける白い犬。昔から語り継がれてきた、日本の犬の原型のような存在。
    - name: 桃太郎のお供の犬
      short: 桃太郎の犬
      emoji: "🍑"
      reason: きびだんごをもらって、鬼退治に加わる、日本人にはおなじみの仲間。昔話の中の「頼れる友」の代表。
  D:
    - name: ライカ犬（宇宙を飛んだ犬）
      short: ライカ
      emoji: "🚀"
      reason: 1957年に、旧ソ連の人工衛星スプートニク2号に乗って、地球を回った最初の動物の一匹として知られる実在の犬。宇宙開発の歴史に名前が残っている。
summary: |
  犬キャラクターの頂点は、実在の物語で心を打つ「ハチ公」と、世界中で愛される「スヌーピー」。犬は昔から、忠実さや優しさの象徴として、たくさんの物語に登場してきた。
  ジャンルがばらばらでも、犬には「忠実」「元気」「あたたかい」というイメージが共通している。あなたの推し犬キャラは何ランク？ ぜひ一言コメントで教えてね。
related: [inu-aijo, inu-aruaru, neko-chara]
