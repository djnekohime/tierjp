title: 昭和歌謡の名曲 Tier表
description: 川の流れのように、上を向いて歩こう、木綿のハンカチーフ、津軽海峡・冬景色、UFO…昭和を彩った名曲を、世代を超えた歌い継がれ度・知名度・カラオケ定番度でS〜Dにランク付け。
category: music
tags: [昭和, レトロ, 音楽制作, 名作]
published: 2026-10-05
labels:
  S: 国民的名曲
  A: 誰もが知っている
  B: 歌えるとうれしい
  C: 渋い名曲
  D: 通好み
criteria: |
  ① 世代を超えた知名度・歌い継がれ度
  ② 今もカラオケや番組で聴く機会の多さ
  ③ 曲の印象の強さ
  ※ 好みや世代で順位は変わります。歌詞は載せていません。これは、AIが基準を決めて並べた、ひとつの見方です
rank_notes:
  S: 昭和の顔になった曲
  D: 知っていたらかなりの通
tiers:
  S:
    - name: 上を向いて歩こう（坂本九）
      short: 上を向いて歩こう
      emoji: "🌠"
      reason: 海外でも「SUKIYAKI」の名で知られ、世界的にヒットした日本の曲として語り継がれている。昭和を代表する1曲。
    - name: 川の流れのように（美空ひばり）
      short: 川の流れのように
      emoji: "🌊"
      reason: 昭和を代表する歌手の、代表曲のひとつとして、今も歌い継がれている。人生を川に重ねた、ゆったりした曲調が印象的。
    - name: 勝手にシンドバッド（サザンオールスターズ）
      short: 勝手にシンドバッド
      emoji: "🏖️"
      reason: ひと目見たら忘れない、強烈なデビュー曲。夏の定番として、世代を超えて親しまれている。
  A:
    - name: 喝采（ちあきなおみ）
      short: 喝采
      emoji: "👏"
      reason: ドラマのように物語が展開する、昭和歌謡の名曲。ちあきなおみの歌唱が、強い印象を残す。
    - name: 木綿のハンカチーフ（太田裕美）
      short: 木綿のハンカチーフ
      emoji: "🧣"
      reason: 男女のやりとりを、交互の歌詞で描いた名曲。素朴な歌声が、今も愛される。
    - name: 津軽海峡・冬景色（石川さゆり）
      short: 津軽海峡・冬景色
      emoji: "⛴️"
      reason: 演歌の代表曲として、広く知られる。紅白歌合戦などでも、長く歌われてきた。
    - name: UFO（ピンク・レディー）
      short: UFO
      emoji: "🛸"
      reason: 振り付けとセットで、社会現象になった。今でも、宴会やパーティーで盛り上がる定番。
    - name: プレイバックPart2（山口百恵）
      short: プレイバックPart2
      emoji: "🚗"
      reason: 歯切れのよいフレーズが印象的で、山口百恵の代表曲として語り継がれる。
    - name: 瀬戸の花嫁（小柳ルミ子）
      short: 瀬戸の花嫁
      emoji: "👰"
      reason: 瀬戸内の景色を思わせる、爽やかなメロディが印象的。結婚式の定番としても親しまれてきた。
  B:
    - name: 異邦人（久保田早紀）
      short: 異邦人
      emoji: "🕌"
      reason: エキゾチックな雰囲気が印象的で、一度聴くと忘れにくい名曲。
    - name: ひこうき雲（荒井由実）
      short: ひこうき雲
      emoji: "☁️"
      reason: 透明感のある歌声が魅力で、アニメ映画をきっかけに、新しい世代にも知られるようになった。
    - name: 赤いスイートピー（松田聖子）
      short: 赤いスイートピー
      emoji: "🌸"
      reason: 昭和のアイドル歌謡を代表する、爽やかな恋の曲。
    - name: 時の過ぎゆくままに（沢田研二）
      short: 時の過ぎゆくままに
      emoji: "🕰️"
      reason: 大人っぽく色気のある歌声で、昭和の歌番組を思い出させる。
    - name: 北国の春（千昌夫）
      short: 北国の春
      emoji: "🌱"
      reason: 故郷を思わせる曲として、日本はもちろん、海外でも歌われてきた。
    - name: 青い山脈
      emoji: "⛰️"
      reason: 戦後の明るい空気を代表する、古くから歌われてきた曲。今も、世代を超えて親しまれる。
  C:
    - name: ブルー・ライト・ヨコハマ（いしだあゆみ）
      short: ブルー・ライト・ヨコハマ
      emoji: "🌃"
      reason: 横浜の夜景を思わせる、しっとりした大人の歌。昭和歌謡らしい雰囲気が楽しめる。
    - name: また逢う日まで（尾崎紀世彦）
      short: また逢う日まで
      emoji: "🎩"
      reason: 力強く、豊かな歌声が印象的。昭和のヒット曲として、今も歌い継がれる。
    - name: よこはま・たそがれ（五木ひろし）
      short: よこはま・たそがれ
      emoji: "🌇"
      reason: ムード歌謡の雰囲気を感じられる、哀愁のある曲。
    - name: 時代（中島みゆき）
      short: 時代
      emoji: "🌅"
      reason: 時の流れと、人生を静かに歌った、長く愛されてきた1曲。
  D:
    - name: 圭子の夢は夜ひらく（藤圭子）
      short: 圭子の夢は夜ひらく
      emoji: "🌙"
      reason: 独特のかすれた歌声と、哀愁のある曲調が、昭和の夜の空気を伝える。知る人ぞ知る名曲として語られることも多い。
    - name: 夜明けのスキャット（由紀さおり）
      short: 夜明けのスキャット
      emoji: "🌄"
      reason: 歌詞のない「スキャット」で歌い出す、印象的な曲。静かで、雰囲気のある1曲。
summary: |
  昭和歌謡のSは、世代を超えて知られる「上を向いて歩こう」「川の流れのように」「勝手にシンドバッド」。誰でも1フレーズは口ずさめる、国民的な曲。
  好みや思い出で、順位は大きく変わるジャンル。あなたの思い出の1曲は、何ランク？ ぜひ一言コメントで教えてね。
related: [showa-anime, showa-drama, showa-retro-items]
