summary: 'ペットの写真は、かわいい瞬間を逃さないことがすべて。S級は、ペットと同じ目線の高さで撮ることと、自然光を使うこと。目線を合わせるだけで、表情がぐっと生き生きして見える。

  明るい窓際で撮ると、毛並みがきれいに写る。フラッシュは、目に負担がかかる場合があるので、できるだけ使わないほうが安心。

  連写機能は、動き回る子の強い味方。シャッターチャンスを逃さずに済む。

  ペットがリラックスしているときが、いちばん自然な表情が撮れる。無理に押さえたり、長時間撮りつづけたりすると、ストレスになってしまう。短時間で切り上げ、おやつやほめ言葉で終わるのがコツ。

  撮影の前後に、遊びやごほうびの時間を入れると、写真を撮られるのが好きになってくれることも。

  高い場所や道具を使うときは、ペットが落ちたり、誤って飲み込んだりしないよう、周りに危険なものがないか確認しておこう。撮った写真は、日付ごとにフォルダに分けておくと、成長の記録として見返せる。

  写真は上手に撮ることより、「いつもの表情を残すこと」が大切。何気ない日常の一枚が、数年後にはいちばんの宝物になる。ペットが年を重ねたとき、見返して笑顔になれる写真をたくさん残しておこう。

  ランクはあくまで目安。自分や家族の暮らしに合わせて、ぴったりの組み合わせを見つけてほしい。みんなのTier表と並べて、違いを楽しむのもおすすめ。やってみて合わなければ、気軽に変えていけばOK。'
