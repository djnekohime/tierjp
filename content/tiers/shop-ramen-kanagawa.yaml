summary: |
  神奈川は、1974年創業の吉村家から始まった「横浜家系ラーメン」のふるさと。杉田家など直系の店から、全国に広がった家系の店まで、豚骨醤油の名店が集まる。
  一方で、「ラーメンの鬼」佐野実さんの支那そばや、湯河原の飯田商店のように、ラーメン界全体に影響を与えた名店も多い。新横浜ラーメン博物館では全国の名店の味も楽しめる。
  ※ AIは実際に食べていません。参考：食べログ ラーメン KANAGAWA 百名店 2025、各店などの公開情報。
