title: SNSで、見たくない投稿との距離の置き方 Tier表
description: ミュート、キーワード非表示、ブロック、通知オフ、見る時間を決める…SNSで疲れる投稿やアカウントとの距離の置き方を、ゾーマが「心の負担の軽さ×角が立たないか×続けやすさ」でS〜Dにランク付け。
category: sns
tags:
- 初心者
- 安全性
published: '2026-11-18'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 心の負担が軽くなるか

  ② 相手との関係に角が立たないか

  ③ 続けやすさ

  ※ サービスごとに機能名や設定場所は変わります。最新の設定は、各SNSのヘルプで確認してください。つらさが強いときは、ひとりで抱えず、身近な人や相談窓口に相談してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: ミュートで、静かに見えなくする
    emoji: 🔇
    reason: 相手に通知されないことが多く、角が立たない。距離を置く、いちばん使いやすい方法。
  - name: 苦手な話題は、キーワードで非表示にする
    emoji: 🚫
    reason: ネタバレや、見たくない話題を先に避けられる。毎回気分を乱されない。
  - name: 見る時間を、1日の中で決める
    emoji: ⏰
    reason: ダラダラ見を防げる。疲れていない時間帯だけにするのがコツ。
  A:
  - name: 通知をオフにする
    emoji: 🔕
    reason: 反応を気にしすぎなくなる。必要なものだけ残せる。
  - name: おすすめ表示・関連表示を、減らす設定にする
    emoji: ⚙
    reason: 見たくない投稿が、そもそも流れてこなくなる。
  - name: フォローは外さず、タイムラインだけ整理する
    emoji: 🧹
    reason: 人間関係を壊さず、気持ちを守れる。
  - name: リストやグループ機能で、見たい人だけを見る
    emoji: 📋
    reason: 必要な情報だけに集中できる。
  - name: 悪質な投稿は、スクリーンショットで記録して通報する
    emoji: 📸
    reason: 証拠が残り、対応してもらいやすい。個人で抱え込まない。
  B:
  - name: ブロックで、完全に関わりを断つ
    emoji: ⛔
    reason: しつこい迷惑行為や安全に関わるときは有効。ためらわなくていい。
  - name: 鍵アカウント（非公開）にする
    emoji: 🔒
    reason: 見られる相手を絞れる。ただし、発信の広がりは減る。
  - name: 寝る前の1時間は、SNSを見ない
    emoji: 🌙
    reason: 眠りの質を守れる。見ないことで気持ちも落ち着く。
  - name: フォロワー整理の日を、月に1回つくる
    emoji: 🗓
    reason: 習慣になれば、ため込まない。
  - name: 見たいアカウントだけをお気に入りに入れる
    emoji: ⭐
    reason: 探す手間が減り、疲れにくい。
  - name: 別のアプリや趣味に、気をそらす時間をつくる
    emoji: 🌿
    reason: SNSから離れる時間が、気持ちを軽くする。
  C:
  - name: アカウントを一時的に休む
    emoji: 😴
    reason: 疲れたときは有効。ただし、戻りにくくなる人もいる。
  - name: 相手のフォローを外す
    emoji: 🚪
    reason: 関係が気まずくなる場合もある。まずはミュートの方が、穏やか。
  - name: サブアカウントを新しく作って、見る用にする
    emoji: 🧩
    reason: 管理が増える。ルールを決めないと、かえって見る時間が増える。
  D:
  - name: 感情的に、言い返す
    emoji: 🔥
    reason: 相手を刺激して、トラブルが広がりやすい。あとから後悔しやすい。
  - name: 引用して、皮肉や批判を書く
    emoji: 💢
    reason: 相手に伝わり、争いになりやすい。拡散されると収拾がつかない。
  - name: 見たくないのに、つい探し続ける
    emoji: 🔍
    reason: 心が疲れる悪循環に。意識して、画面から離れたい。
  - name: つらいのに、ひとりで我慢して見続ける
    emoji: 😞
    reason: 心の負担が積もる。離れる、人に話すなど、早めに手を打ちたい。
summary: 'SNSは便利で楽しい一方、見たくない投稿が流れてきて、心がざわつくこともある。我慢して見続けるのも、感情的に反応するのも、あとから疲れてしまう。

  S級に置いたのは、ミュートと、キーワード非表示、そして見る時間を決めること。ミュートは、相手に通知されないことが多く、角が立たない。距離を置きたいときの、いちばん使いやすい方法だ。

  A級は、通知オフや、おすすめ表示を減らす設定。フォローは外さず、自分の画面から静かに見えなくするだけで、気持ちが楽になる。

  一方、ブロックは、しつこい迷惑行為や、安全に関わるときの手段。ためらわず使っていいが、日常の「ちょっと苦手」くらいなら、まずミュートから試すのがおすすめ。

  D級の「言い返す」「引用で批判する」は、相手を刺激して、トラブルが広がることもある。誹謗中傷や脅しなど、悪質な内容は、スクリーンショットで記録を残して、各SNSの通報機能や、必要に応じて公的な相談窓口を使おう。

  基本の流れは、①まずミュートか通知オフ ②それでも続くなら、ブロック ③悪質ならば通報、の3ステップ。さらに、寝る前の1時間はSNSを見ない、1日の合計時間を決める、など、自分のルールを持つと、気持ちが安定しやすい。見るのがしんどいときは、無理に続けず、アプリを離れて休むのも立派な選択だ。

  なお、SNSでの距離の置き方に正解はない。人によって、気になる話題も、疲れるポイントも違う。大切なのは、「自分の心が軽い状態を、自分で選んでいい」と知っておくこと。ミュートも、通知オフも、休むことも、立派な選択肢。使いやすい方法を、少しずつ試して、自分に合う形を見つけてほしい。'
