summary: |
  大阪のラーメンは、人類みな麺類やカドヤ食堂のように、全国から客が訪れる名店がそろう激戦区。福島・天神橋筋六丁目・高槻などに百名店が集まっている。
  京都の無鉄砲やたけ井、東京の篝、広島の尾道ラーメン、博多豚骨まで、全国の味が集まるのも大阪の特徴。
