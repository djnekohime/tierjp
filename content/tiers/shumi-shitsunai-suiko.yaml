title: 室内で育てる野菜・水耕栽培 Tier表
description: 豆苗、ミニトマト、ハーブ、スプラウト、小ねぎ…窓辺や台所で育てられる野菜・ハーブを、ゾーマが「育てやすさ×楽しさ×食べるおいしさ」でS〜Dにランク付け。
category: shumi
tags:
- 初心者
- 冬
published: '2026-11-11'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 育てやすさ（失敗しにくいか）

  ② 楽しさ（変化が見える）

  ③ 食べておいしいか

  ※ 水耕栽培は、容器や水を清潔に保つことが大切です。体調や食品の安全面は、購入した種やキットの説明に従ってください'
rank_notes:
  S: ぜひ実践
