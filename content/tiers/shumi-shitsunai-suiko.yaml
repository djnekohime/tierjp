tiers:
  S:
  - name: 豆苗（再生栽培）
    emoji: 🌱
    reason: 買った根を水に浸けるだけ。数日で伸びて、再収穫できる。変化が早くて楽しい。
  - name: 小ねぎ（再生栽培）
    emoji: 🌿
    reason: 根元を水に浸けておくと、また伸びてくる。薬味にすぐ使えて、実用的。
  - name: スプラウト（かいわれ・ブロッコリー）
    emoji: 🥬
    reason: 短い期間で収穫でき、失敗しにくい。サラダやサンドイッチに使いやすい。
  A:
  - name: バジル
    emoji: 🌿
    reason: 香りがよく、成長も早い。パスタやピザに使えて、料理が楽しくなる。
  - name: ミント
    emoji: 🍃
    reason: 丈夫で育てやすい。お茶やデザートにも使える。
  - name: パセリ
    emoji: 🌱
    reason: 彩りや香りづけに使いやすい。少し収穫が長く続く。
  - name: レタス・ベビーリーフ
    emoji: 🥗
    reason: やわらかい葉を少しずつ収穫できる。サラダにすぐ使える。
  - name: にんじんの葉（へた再生）
    emoji: 🥕
    reason: 切れ端から芽が出る。育てて食べる、かわいい楽しみ。
  B:
  - name: ミニトマト（窓辺）
    emoji: 🍅
    reason: 日当たりが必要で、少し難しいが、実がなったときの感動が大きい。
  - name: 大葉（しそ）
    emoji: 🌿
    reason: 香りがよく、薬味に便利。日当たりが必要。
  - name: クレソン
    emoji: 🥬
    reason: 水が好きで、水耕栽培に向いている。ピリッとした辛みがある。
  - name: パクチー
    emoji: 🌿
    reason: 好きな人には最高の香り。発芽に少し時間がかかる。
  - name: ローズマリー
    emoji: 🌿
    reason: 丈夫で、肉料理に使える。冬の寒さ対策が必要。
  - name: ラディッシュ（二十日大根）
    emoji: 🔴
    reason: 早く収穫でき、小さな畑気分を味わえる。
  C:
  - name: ピーマン・ナス
    emoji: 🍆
    reason: 室内では、日光や温度の管理が難しい。慣れてから。
  - name: いちご（室内）
    emoji: 🍓
    reason: 実がなるまで手間がかかる。小さな収穫に感動するが、上級者向け。
  - name: 大根（室内の容器栽培）
    emoji: ⚪
    reason: 根が育つスペースが必要。小型の品種から試したい。
  D:
  - name: 土のない容器を放置して、水を替えない
    emoji: 💧
    reason: 水が汚れ、においや雑菌の原因になる。
  - name: 日光の当たらない場所に置く
    emoji: 🌑
    reason: 徒長（ひょろひょろ）して、元気に育たない。
  - name: 食用でない植物を、うっかり口にする
    emoji: ⚠️
    reason: 観賞用の植物には、食べられないものもある。食用か必ず確認する。
summary: '冬は外での家庭菜園がお休みになりやすいが、室内なら、年じゅう植物を育てられる。台所の窓辺や、ちょっとした棚の上でも始められる手軽さが、水耕栽培の魅力だ。


  S級は、豆苗と小ねぎ。スーパーで買った根の部分を、水に浸けておくだけで、数日で再び伸びてくる。変化が目に見えるので、初めての人でも、育てる楽しみを実感しやすい。そして、収穫して食べるところまでが、手軽にできるのが嬉しい。


  続けるコツは、水の取り替えを、毎日の習慣にすること。水が汚れると、においや雑菌の原因になる。置き場所は、日当たりのよい窓辺が基本だが、冬は夜の冷え込みに注意。窓から少し離したり、夜だけ部屋の中央に移すと安心だ。


  野菜は、種から育てるほうが、達成感は大きい。ただし、発芽や管理に少し手間がかかる。まずは、手軽な豆苗や小ねぎから始めて、慣れてきたら、ハーブやミニトマトにも挑戦してみよう。


  収穫したものを、味噌汁やサラダ、パスタに加えるだけで、いつもの料理が少し特別になる。小さな収穫を、写真に撮って記録すると、さらに続けやすくなる。

  容器は、100円ショップのコップや、牛乳パックを切ったものでも代用できる。大切なのは、清潔に保てること。使うたびに洗い、水を替えれば、においも出にくい。育てた野菜は、食べる前によく洗って、状態を確認しよう。もし、ぬめりやにおいが強いときは、無理をせず処分するのが安心。収穫量は多くないけれど、成長の様子を眺める時間そのものが、冬の暮らしを楽しくしてくれる。'
