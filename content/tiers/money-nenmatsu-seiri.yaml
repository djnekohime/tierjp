title: 年末にやるお金の整理 Tier表
description: サブスクの見直し、家計の振り返り、ふるさと納税、年賀状・お歳暮の予算…年末にやるお金の整理を、AIが「効果×手間の少なさ×やり忘れ防止」でS〜Dにランク付け。
category: money
tags:
- お金
- 節約
- 家計
published: '2026-10-09'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 効果の大きさ

  ② 手間の少なさ

  ③ やり忘れを防げるか

  ※ 契約や投資の判断は、ご自身で、必要に応じて専門家にご相談ください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: サブスク・固定費を全部書き出して見直す
    emoji: 📋
    reason: 効果が大きく、翌年ずっと続く節約になる。
  - name: ふるさと納税の期限・上限額を確認する
    emoji: 🗓️
    reason: 年内に申し込む必要がある。
  A:
  - name: 家計をざっくり振り返る（収入・出費・貯金）
    emoji: 📊
    reason: どこにお金が使われたか見える。
  - name: 医療費・寄付などの領収書を、まとめる
    emoji: 🧾
    reason: 確定申告・控除に必要なことも。
  - name: 来年の貯金の目標を決める
    emoji: 🎯
    reason: 金額を具体的にすると、続けやすい。
  - name: 年末の支払い（カード・公共料金）の予定を確認
    emoji: 💳
    reason: 引き落としで残高不足にならないように。
  B:
  - name: 年賀状・お歳暮・お年玉の予算を決める
    emoji: 🎁
    reason: 使いすぎを防げる。
  - name: 使っていないカード・口座を、整理する
    emoji: 🏦
    reason: 管理が楽になる。
  - name: ポイントの期限を確認
    emoji: 🪙
    reason: 失効する前に使う。
  C:
  - name: 年始のセールを見越して、買い物を我慢
    emoji: 🛍️
    reason: 必要なものだけ。衝動買いに注意。
  D:
  - name: 年末年始の勢いで、大きな買い物や契約をする
    emoji: ⚠️
    reason: 落ち着いてから決める。
  - name: 確認せずに、新年を迎える
    emoji: 🙈
    reason: やり忘れが出やすい。
summary: '年末は、1年のお金を振り返る絶好のタイミング。S級は、毎月かかっている固定費とサブスクを、全部見直すこと。

  ふるさと納税など、期限のあるものは、早めに確認しておくと、慌てずに済む。'
related:
- koteihi-minaoshi
- okane-subsc-minaoshi
- okane-furusato
