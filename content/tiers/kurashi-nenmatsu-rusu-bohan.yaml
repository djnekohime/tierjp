title: 年末年始の留守中の防犯対策 Tier表
description: 帰省や旅行で数日家を空けるとき。郵便物、SNS投稿、戸締まり、照明…留守中の防犯対策を、ゾーマが「効果×手軽さ×続けやすさ」でS〜Dにランク付け。
category: kurashi
tags:
- 初心者
- 安全性
published: '2026-11-11'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 防犯の効果

  ② 手軽さ

  ③ 続けやすさ

  ※ 防犯の万全な方法はありません。心配なときは、地域の警察や、防犯の専門業者にも相談してください。ここでの内容は専門家の助言ではなく、一般的な目安です'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 出発前に、窓・勝手口・ベランダの鍵を指さし確認する
    emoji: 🔒
    reason: 見落としがちな場所から、侵入されることがある。確認の習慣が、いちばん効く。
  - name: 郵便物・新聞をためない（配達停止・回収の依頼）
    emoji: 📬
    reason: 郵便受けがあふれていると、留守が一目で分かってしまう。
  - name: 旅行や帰省の予定を、SNSに投稿しない
    emoji: 📵
    reason: 留守の情報を、不特定多数に知らせてしまう。投稿は帰ってからが安全。
  A:
  - name: 信頼できる家族・ご近所に、留守を伝えておく
    emoji: 🤝
    reason: 見守りになり、何かあったときにも気づいてもらえる。
  - name: 照明をタイマーで点灯させる
    emoji: 💡
    reason: 人がいるように見せられる。タイマー付きプラグが手軽。
  - name: センサーライトを玄関・庭に付ける
    emoji: 🔦
    reason: 暗がりをなくすと、侵入を避ける効果が期待できる。
  - name: 貴重品を、分かりにくい場所や金庫に保管する
    emoji: 🔐
    reason: 万一のときにも、被害を減らせる。隠し場所を家族と共有しておく。
  - name: ガスの元栓・電気のブレーカーを確認する
    emoji: 🔥
    reason: 防犯だけでなく、火災予防にもなる。長期不在のときは特に。
  B:
  - name: 防犯カメラ（屋外・玄関）を設置する
    emoji: 📹
    reason: 抑止効果が期待できる。設置場所や、近隣への配慮が必要。
  - name: 補助錠（窓や玄関の二重ロック）を付ける
    emoji: 🗝️
    reason: 侵入に時間をかけさせる。手軽に追加できる。
  - name: 防犯フィルムを窓に貼る
    emoji: 🪟
    reason: ガラスを割られにくくする効果が期待できる。
  - name: 防犯砂利を庭に敷く
    emoji: 🪨
    reason: 歩くと音がして、侵入者が嫌がるといわれている。
  - name: ゴミ出しの日程を、事前に確認しておく
    emoji: 🗑️
    reason: 生ごみを放置すると、においや害虫の原因になる。
  C:
  - name: ドアの前に、不自然な目印を置く
    emoji: ⚠️
    reason: 留守の確認に使われるおそれも。やりすぎには注意。
  - name: カーテンを全部閉めっぱなしにする
    emoji: 🪟
    reason: 留守が分かりやすくなることも。1日中同じ状態は避ける。
  - name: 大きな防犯設備を、一度に導入する
    emoji: 💸
    reason: 費用が大きく、使いこなせないこともある。必要に応じて。
  D:
  - name: 玄関や窓の鍵をかけずに「少しだけ」外出する
    emoji: 🚪
    reason: 短時間でも、被害に遭う可能性がある。
  - name: 合鍵を、郵便受けや植木鉢の下に隠す
    emoji: 🌱
    reason: 空き巣は、よくある隠し場所を知っていることが多い。
  - name: 旅行先の写真を、リアルタイムでSNSに載せる
    emoji: 📸
    reason: 今、家にいないことが分かってしまう。
summary: '年末年始は、帰省や旅行で家を空ける人が多い時期。留守だと分かると、空き巣に狙われやすくなるといわれている。大げさな設備がなくても、日頃の習慣と少しの工夫で、リスクは下げられる。


  S級は、出かける前の戸締まりの再確認。窓、勝手口、ベランダ、浴室など、見落としがちな場所を、指さしで確認するのが確実。次に、郵便物や新聞をためないこと。郵便受けがあふれていると、留守が一目で分かってしまう。配達の一時停止や、家族・信頼できる人への依頼を考えよう。


  そしてもう一つ大切なのが、SNSでの発信。「今から旅行です」「明日から実家」といった投稿は、留守の情報を不特定多数に知らせてしまう。旅行の写真は、帰ってからまとめて投稿するのが安心だ。


  照明をタイマーで点灯させる、防犯カメラやセンサーライトを置く、といった工夫も効果が期待できる。ただし、「これさえあれば絶対に安全」ということはない。複数の対策を、無理のない範囲で組み合わせるのがおすすめ。


  鍵の閉め忘れが多い人は、出発の前日に準備を終える習慣をつけると、慌てずに済む。留守中は、ご近所の方とのあいさつも、見守りになる。

  防犯対策は、一度やって終わりではなく、日常の習慣として続けるのが大切。出かける前に、チェックリストを作っておくと、慌てている日でも確認もれが減る。スマホのメモに、「窓・勝手口・ガス・郵便・SNS」といった項目を書いておくだけでもいい。また、集合住宅と一戸建てでは、気をつける点が違う。心配な点があれば、管理会社や、地域の防犯の窓口に相談してみよう。'
