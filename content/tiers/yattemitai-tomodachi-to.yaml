title: 友だちと一緒にやってみたいこと Tier表
description: おでかけ、手作り、食べ歩き、オンライン飲み会…友だちとやってみたいことを、AIが「ワクワク度×手軽さ×思い出になる度」でS〜Dにランク付け。
category: yattemitai
tags:
- 挑戦
- 初心者
published: '2026-10-09'
labels:
  S: 今すぐ
  A: 週末に
  B: 気分が向いたら
  C: 少し準備して
  D: 思ったより…
criteria: '① ワクワク度

  ② 手軽さ・予定の合わせやすさ

  ③ 思い出になる度'
rank_notes:
  S: 今すぐ
  D: 思ったより…
tiers:
  S:
  - name: ランチやカフェで、ゆっくりおしゃべり
    emoji: ☕
    reason: 一番ハードルが低く、気軽に誘える。
  - name: 食べ歩き・ご当地グルメめぐり
    emoji: 🍡
    reason: 歩きながら話せる。写真もたくさん撮れる。
  A:
  - name: 一緒に手作り（お菓子・雑貨・ワークショップ）
    emoji: 🎨
    reason: 完成品が思い出になる。
  - name: 日帰り旅行・温泉
    emoji: ♨️
    reason: 1日たっぷり楽しめる。予定を合わせる準備が必要。
  - name: 写真を撮りに行く（花・紅葉・街歩き）
    emoji: 📷
    reason: お金をかけずに楽しめる。
  - name: 映画・ライブ・展覧会に行く
    emoji: 🎬
    reason: 感想を語り合える。
  B:
  - name: 一緒に習い事の体験に参加
    emoji: 🏫
    reason: 新しいことを一緒に始める楽しさ。
  - name: オンラインでおしゃべり・飲み会
    emoji: 💻
    reason: 離れていても会える。
  - name: 誕生日や記念日を、サプライズでお祝い
    emoji: 🎁
    reason: 喜んでもらえると、うれしい。相手の好みを考えて。
  - name: ボードゲーム・ゲーム大会
    emoji: 🎲
    reason: 盛り上がる。人数に合わせて。
  C:
  - name: 旅行の計画から一緒に立てる
    emoji: ✈️
    reason: 楽しいが、予定と予算の調整が大変。
  - name: 大人数のイベントを企画
    emoji: 🎉
    reason: 幹事の負担が大きい。分担して。
  D:
  - name: 予定を詰め込みすぎる
    emoji: 📋
    reason: 疲れて、楽しめなくなる。
  - name: 相手の都合を考えずに誘い続ける
    emoji: ⚠️
    reason: 気まずくなる。無理のない範囲で。
summary: '友だちとやってみたいことは、「会う口実」になることが大切。S級は、準備が少なく、気軽に誘えて、後から話のタネになること。

  人数や予定が合わせにくいときは、オンラインでも楽しめる。'
related:
- yattemitai-shumatsu
- yattemitai-tezukuri
