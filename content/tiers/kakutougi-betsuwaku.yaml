title: エンタメ格闘技 Tier表【BreakingDownなど別枠】
description: BreakingDown、THE MATCH、超RIZINのエキシビション、ベアナックル、平手打ち…普通の格闘技とはひと味違う「別枠」のエンタメ格闘技を、AIが「盛り上がり度」でランク付け。
category: kakutougi
tags: [格闘技, BreakingDown]
published: 2026-09-29
labels:
  S: 社会現象
  A: 大盛り上がり
  B: クセになる
  C: 好みが分かれる
criteria: |
  ① 大会・企画の盛り上がり（話題性・視聴数）
  ② 格闘技ファン以外も巻き込んでいるか
  ③ 見ていて楽しいか
  ※ 一般的な格闘技の大会とは別の「エンタメ性の強い格闘イベントや試合形式」をまとめた別枠のTier表です
rank_notes:
  S: 格闘技を知らない人まで巻き込んだ
  C: 刺激が強く、見る人を選ぶ
tiers:
  S:
    - name: BreakingDown
      emoji: "⏱️"
      reason: 朝倉未来がプロデュースする「1分間最強」を決める大会。試合だけでなく、オーディションでの舌戦や因縁も見どころで、YouTubeを中心に若い世代で社会現象になった。
    - name: 団体の頂上決戦（THE MATCH型）
      short: THE MATCH型
      emoji: "🏟️"
      reason: 2022年、那須川天心と武尊の一戦が東京ドームで実現した「THE MATCH」のように、団体の垣根を越えた夢の対決。格闘技ファンが何年も待ち望んだ試合は、日本中の注目を集める。
  A:
    - name: 超RIZINのエキシビション
      emoji: "🌟"
      reason: フロイド・メイウェザーが那須川天心や朝倉未来と戦ったように、ボクシングの伝説とのエキシビションマッチ。勝敗より「夢の対戦を見る」お祭り。
    - name: 団体対抗戦（RIZIN vs Bellatorなど）
      short: 団体対抗戦
      emoji: "🆚"
      reason: 団体同士のプライドをかけた対抗戦。応援する側がはっきりしていて、1試合ごとに会場が一体になる。
    - name: 格闘代理戦争
      emoji: "📺"
      reason: ABEMAの格闘技リアリティ番組。有名格闘家が弟子を育てて戦わせる形式で、若手の成長物語に引き込まれる。
    - name: 異種格闘技戦
      emoji: "🤜"
      reason: 1976年のアントニオ猪木 vs モハメド・アリに代表される、違うジャンルの格闘家同士の戦い。「どっちが強いのか」というロマンが詰まっている。
  B:
    - name: YouTuberボクシング
      emoji: "📱"
      reason: アメリカのジェイク・ポールのように、人気YouTuberがボクシングで戦うイベント。格闘技ファン以外の視聴者を大量に呼び込んだ。
    - name: ベアナックル（BKFC）
      short: ベアナックル
      emoji: "✊"
      reason: グローブをつけず素手で殴り合う、アメリカ発の大会。危険と隣り合わせの緊張感が独特の人気を生んでいる。
    - name: アームレスリング（East vs West）
      short: アームレスリング
      emoji: "💪"
      reason: 世界のトップ腕相撲選手が戦う「East vs West」などの大会が、動画で大人気に。分かりやすさと筋肉の迫力が魅力。
    - name: 打撃ルールの特別試合（スタンディングバウト）
      short: スタンディングバウト
      emoji: "🥊"
      reason: MMAの大会の中で、あえて寝技なしの打撃だけで戦う特別ルールの試合。人気選手同士の対戦を実現させる方法として使われる。
  C:
    - name: 平手打ちの大会（Power Slap）
      short: Power Slap
      emoji: "✋"
      reason: 交互に平手打ちをし合う、アメリカ発の大会。一撃の迫力は強烈だが、選手の安全面を心配する声も多く、好みが大きく分かれる。
summary: |
  「別枠」のエンタメ格闘技の中心はBreakingDown。1分間という短さと、試合の前の舌戦まで含めたドラマで、格闘技を知らない若い世代を一気に取り込んだ。
  一方で、THE MATCHや団体対抗戦のような「夢の対決」は、長年の格闘技ファンほど熱くなる別枠。どちらも、格闘技の入口を広げてきた存在。
  ※ 危険性の高い形式もあるので、真似は絶対にしないでください。
related: [kakutougi-genre, kakutougi-dantai-1ji]
