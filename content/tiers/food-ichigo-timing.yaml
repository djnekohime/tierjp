title: ショートケーキのいちごを食べるタイミング Tier表
description: 最初に食べる、最後に食べる、真ん中で食べる、スポンジと一緒に、半分だけ食べる、他の人にあげる、取っておく、写真を撮ってから…ショートケーキのいちごを食べるタイミングを、AIが「幸せ度×論争の盛り上がり度」でランク付け。
