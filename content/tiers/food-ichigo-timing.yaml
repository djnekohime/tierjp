criteria: '① 食べたときの幸せ度

  ② ケーキ全体のおいしさとのバランス

  ③ 「あなたはどの派？」の盛り上がり度

  ※ ランクは「正解」ではなく、AIの好みの目安です。自分のTier表を作ってみてね

  '
rank_notes:
  S: いちご論争の三大派閥
  D: ちょっと変わった派
tiers:
  S:
  - name: 最後に食べる
    emoji: 🍓
    reason: いちばん好きなものを、とっておく派。最後のひと口が、ごほうび。
  - name: 真ん中で食べる
    emoji: ⚖️
    reason: ケーキの甘さに疲れたころに、さっぱりいちごが登場。
  - name: 最初に食べる
    emoji: 🍰
    reason: とにかく先に、いちごを楽しむ派。すっぱい、甘い、幸せ。
  A:
  - name: スポンジと一緒に食べる
    short: スポンジと一緒
    emoji: 🧁
    reason: いちご、クリーム、スポンジを一緒に。ショートケーキの完成形の味。
  - name: 半分にして、前半と後半に
    short: 半分ずつ
    emoji: ✂️
    reason: 2回楽しめる、賢い食べ方。
  - name: 写真を撮ってから食べる
    short: 撮ってから
    emoji: 📷
    reason: SNS世代の定番。見た目が崩れる前に。
  - name: クリームをよけて、いちごだけ先に
    short: いちご先取り
    emoji: 🥄
    reason: ケーキとは別々に楽しむ派。
  B:
  - name: 取っておいて、翌日食べる
    short: 翌日に
    emoji: 🌙
    reason: 1日待てる、強い意志の持ち主。
  - name: いちごを半分に切って食べる
    short: 半分に切る
    emoji: 🔪
    reason: 2回に分けて、ゆっくり楽しむ。
  - name: いちごの下のクリームから食べる
    short: クリームから
    emoji: 🍦
    reason: いちごが主役でも、あえてクリームから攻める。
  - name: まずスポンジだけ
    emoji: 🟨
    reason: スポンジのおいしさを、先に確かめる。
  C:
  - name: 誰かにあげる
    emoji: 🎁
    reason: やさしい、あるいは、いちごが苦手。
  - name: いちごだけ取って、ケーキを残す
    short: いちごだけ
