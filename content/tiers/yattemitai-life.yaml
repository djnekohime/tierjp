title: 人生で一度はやってみたいこと Tier表
description: スカイダイビング、オーロラ、気球…人生で一度はやってみたい体験を「ワクワク度×実現しやすさ」でランク付け。
category: yattemitai
tags: [挑戦, 旅行, 世界]
type: challenge
published: 2026-09-23
criteria: |
  ① やる前のワクワク度（想像しただけで楽しいか）
  ② 実現しやすさ（お金・体力・時間）
  ③ 一生の思い出になるか
  ※ 実際に挑戦した人の体験談が集まったら「挑戦後」のランクを追記していきます
rank_notes:
  S: 一生に一度は絶対やるべき
  D: 憧れはあるが、ハードルが高すぎる
tiers:
  S:
    - name: オーロラを見る
      emoji: "🌌"
      reason: 見られた瞬間の感動はどの体験談でも別格。北欧・カナダ・アラスカなどのツアーも充実していて、体力もいらない。ただし天気次第で見られないこともあるのがドキドキポイント。
    - name: 熱気球に乗る
      emoji: "🎈"
      reason: 日の出と一緒にゆっくり浮かぶ体験は、怖さより感動が勝つ。トルコのカッパドキアが有名だが、日本でも体験フライトができる所があり、意外と手が届く。
  A:
    - name: スカイダイビング
      emoji: "🪂"
      reason: ワクワク度は最高クラス。インストラクターと一緒に飛ぶ「タンデム」なら未経験でもできる。ただ怖さも最高クラスなので、人を選ぶ分A。
    - name: 世界遺産で朝日を見る
      emoji: "🌅"
      reason: アンコールワットやマチュピチュなど、朝日と世界遺産の組み合わせは写真でも記憶でも一生もの。早起きが必要なだけで、特別な体力はいらない。
    - name: '富士山に登る'
      emoji: "🗻"
      reason: '日本一の山頂で見るご来光は一生もの。登山シーズンは夏の短い期間だけで体力も必要だが、日本国内で挑戦できる。'
    - name: 'ウユニ塩湖に行く'
      emoji: "🪞"
      reason: '空と大地が鏡のようにつながる絶景。遠く標高も高いので体調管理が必要だが、写真を見るだけでワクワクが止まらない。'
    - name: '寝台列車で旅をする'
      emoji: "🚂"
      reason: '寝ている間に遠くの街へ。窓の外を流れる夜景と、朝起きたら知らない景色が広がっている体験は特別。'
  B:
    - name: バンジージャンプ
      emoji: "🤸"
      reason: 時間にして数秒の体験に、何十分もの勇気が必要。「やった」という達成感は大きいが、楽しさより度胸試しの色が強い。
    - name: 豪華客船で世界一周
      emoji: "🚢"
      reason: 憧れ度は満点だが、期間が長く費用も大きい。まずは数日のショートクルーズで試すのが現実的。
    - name: '体験ダイビング'
      emoji: "🤿"
      reason: 'ライセンスがなくても、インストラクターと一緒に海の中へ。魚と同じ目線で泳ぐ体験は想像以上の感動。'
    - name: '犬ぞりに乗る'
      emoji: "🐕"
      reason: '雪原を犬たちと一緒に駆け抜ける。北海道や北欧などで体験でき、犬好きにはたまらない。'
    - name: '流氷の上を歩く'
      emoji: "🧊"
      reason: '北海道・知床の流氷ウォーク。ドライスーツを着て流氷の上を歩いたり、海に浮かんだりできる冬だけの体験。'
  C:
    - name: フルマラソン完走
      emoji: "🏃"
      reason: 完走した時の感動は大きいが、そこまでの練習期間が長い。「一日でできる体験」ではないのでワクワク度でやや下がる。
    - name: '屋久島の縄文杉に会いに行く'
      short: '縄文杉'
      emoji: "🌳"
      reason: '樹齢数千年ともいわれる巨木との対面は感動的。ただ往復10時間前後の山道を歩く必要があり、体力の準備が必須。'
  D:
    - name: 宇宙旅行
      emoji: "🚀"
      reason: 夢としてはS以上。ただ現時点では費用が桁違いで、一般の人が「やってみたい」から実行に移すのは難しい。将来ランクが上がる候補No.1。
summary: |
  上位は「体力より感動」の体験が並んだ。オーロラと熱気球は、年齢を問わずできて一生の思い出になる最強コンビ。
  このTier表は「挑戦前」の予想ランク。実際にやってみると、「スカイダイビングは思ったよりS」「バンジーは思ったよりC」のように動くはず。挑戦後の結果を追記していく、成長するTier表です。
related: [kaigai-hajimete]
