  C: ほどほどに
  D: 避けたい
criteria: '① ハマってもらえる確率

  ② 相手の負担の少なさ（時間・気持ち）

  ③ 楽しさ（すすめる側もすすめられる側も）

  ※ 配信サービスの配信状況は時期によって変わります。すすめる前に、相手が見られる環境か確認すると親切です'
