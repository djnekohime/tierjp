title: 韓ドラを友だちにすすめるコツ Tier表
description: 相手の好みを聞く、1話だけ一緒に見る、名シーンを熱く語りすぎる、ネタバレ…韓国ドラマを友だちにすすめるコツを、ゾーマが「ハマってもらえる確率×相手の負担の少なさ×楽しさ」でS〜Dにランク付け。
