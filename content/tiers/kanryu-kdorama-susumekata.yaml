summary: '好きな韓国ドラマにハマると、誰かと語り合いたくなる。「あのシーン、見た？」と話せる友だちがいたら、楽しさは何倍にもなる。でも、熱く語りすぎて相手が引いてしまったり、16話以上あると聞いて「長いからいいや」と断られたり。好きだからこそ、すすめ方にはちょっとしたコツがある。

  S級は「相手の好きなジャンル（恋愛・サスペンス・家族もの・コメディ）を聞いてから選ぶ」「まず1〜2話だけ見てみて、と軽く伝える」「相手が見られる配信サービスにある作品を選ぶ」。自分の最高傑作が、相手の好みとは限らない。ふだん刑事ドラマが好きな人にはサスペンス、明るい話が好きな人にはラブコメ、と相手に合わせるのがいちばんの近道。そして、「全部見て」ではなく「1話だけ」と言われると、気軽に始められる。

  A級は、見どころを一言で伝える、話数の少ない作品や短編から選ぶ、一緒に1話目を見る、見たあとの感想を聞く楽しみにする、など。最近は、全8話前後の短めの作品も増えている。最初の1本は、長さも大事なポイントだ。一緒に見られるなら、1話目を並んで見るのが最強。好きな人の解説つきなら、韓ドラ独特のお約束も楽しみに変わる。

  B級は、推し俳優の魅力を伝える、名シーンの写真や予告を見せる、など。相手が興味を持ってくれたら効果大だが、温度差があると逆効果になりやすい。C級は、名シーンを熱く語りすぎること、何本もまとめてすすめること。好きの気持ちは伝わるが、相手は「宿題」のように感じてしまう。

  D級は「ネタバレをする」「見ていないことを責める・感想を急かす」。ドラマは、展開を知らずに見る驚きが何よりの楽しみ。そして、相手が見るペースは相手のもの。合わなかったと言われても、「教えてくれてありがとう」と受け止めれば、また次の作品をすすめられる関係が続く。

  友だちがハマってくれたら、一緒にロケ地を調べたり、韓国料理を食べに行ったり、楽しみがどんどん広がる。あなたが最初にすすめたい一本は、どの作品？ ぜひ自分のTier表も作ってみてほしい。'
