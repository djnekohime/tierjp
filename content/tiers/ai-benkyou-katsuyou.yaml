title: 勉強にAIを使うときの使い方 Tier表
description: 分からない所を質問、問題を作ってもらう、要約、答えを丸写し…勉強でのAIの使い方を、AIが「理解が深まるか×安全性×続けやすさ」でS〜Dにランク付け。
category: ai
tags:
- AI
- 勉強法
- 初心者
published: '2026-10-09'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 理解が深まるか

  ② 間違いに気づけるか

  ③ 続けやすさ

  ※ AIの機能や規約は変わります。使う前に、各サービスの最新の案内を確認してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 分からない所を、やさしく説明してもらう
    emoji: 💡
    reason: 自分のレベルに合わせて、言い換えてもらえる。
  - name: 自分の理解を、AIに説明して確認してもらう
    emoji: 🗣️
    reason: 間違いに気づける。教える形で、定着もする。
  A:
  - name: 練習問題・小テストを作ってもらう
    emoji: 📝
    reason: 自分の弱点に合わせた問題を、何度でも。
  - name: 長い資料を要約して、全体像をつかむ
    emoji: 📄
    reason: 最初の理解に便利。あとで原文も確認する。
  - name: 英語・韓国語の会話練習の相手にする
    emoji: 💬
    reason: 間違いを気にせず練習できる。
  - name: 間違えた問題の原因を、一緒に考えてもらう
    emoji: 🧐
    reason: 答え合わせより、理由が分かる。
  B:
  - name: 暗記のコツ（語呂合わせ・例え）を出してもらう
    emoji: 🧠
    reason: 覚えやすい工夫が見つかる。
  - name: 学習計画を立ててもらう
    emoji: 📅
    reason: たたき台に便利。自分の生活に合わせて直す。
  - name: ノートの整理を手伝ってもらう
    emoji: 📒
    reason: まとめ方のヒントに。
  C:
  - name: 資格試験の過去問解説を聞く
    emoji: 🎓
    reason: 便利だが、解説が間違うこともある。公式の解説と照らして。
  - name: 翻訳に頼って読む
    emoji: 🌐
    reason: 速いが、語学の力は付きにくい。
  D:
  - name: 宿題・課題の答えを、そのまま写す
    emoji: 🚫
    reason: 自分の力にならない。提出ルールに違反することも。
  - name: AIの説明を、確認せず信じる
    emoji: ⚠️
    reason: 間違うこともある。重要なことは必ず確認。
summary: 'AIは、「いつでも聞ける家庭教師」として使うと強い。S級は、分からない部分を質問したり、自分に合う問題を作らせたりして、自分で考える時間を増やす使い方。

  答えだけ写すのは、勉強にならない。AIの説明が正しいとは限らないので、教科書や公式情報で確認する習慣も必要。'
related:
- ai-fact-check
- kankokugo-benkyou
