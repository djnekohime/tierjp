summary: '秋の夜長は、映画を見るのにちょうどいい季節。外が暗くなるのが早く、温かい飲み物を片手に、じっくり映画に向き合える。

  S級は、没入感が高くて後味もよいジャンル。ヒューマンドラマやミステリーは、時間を忘れて見られる定番。恋愛ものも、秋の少し切ない空気にぴったり。

  A級は、気分に合わせて選べるジャンル。ミュージカルは、見終わったあとに歌を口ずさみたくなる。ドキュメンタリーは、学びがあって知的な満足感がある。

  D級は、悪いという意味ではなく、気分や体力が必要なジャンルのこと。たとえば、怖いホラーを夜遅くに見ると、眠れなくなることもある。

  選び方のコツは、その日の気分で決めること。疲れた日は軽めのコメディ、気持ちに余裕がある日はじっくり系、というふうに使い分けると、見終わったあとの満足度が高い。

  夜に見るときは、画面の明るさを少し下げて、見終わる時間も考えておこう。翌日の予定があるなら、短めの作品にするのもひとつの手。

  なお、年齢制限のある作品は、年齢の目安を守って楽しんでほしい。家族で見るなら、全員が楽しめるジャンルを選ぶと、会話も弾む。

  見る前に、上映時間とあらすじだけ確認しておくと、「思っていたのと違った」が減る。見終わったあとは、感想をひと言メモしておくと、次に選ぶときの参考になる。気になる作品は、リストにしておくと迷わない。

  ランクはあくまで目安。自分や家族の暮らしに合わせて、ぴったりの組み合わせを見つけてほしい。みんなのTier表と並べて、違いを楽しむのもおすすめ。やってみて合わなければ、気軽に変えていけばOK。'
