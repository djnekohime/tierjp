title: 防災の備蓄グッズ Tier表
description: 水、食料、携帯トイレ、懐中電灯、ラジオ、モバイルバッテリー、常備薬、現金…災害に備えて家庭にそろえたい備蓄グッズを「命と生活を守る度」でS〜Dにランク付け。ローリングストックのコツも。
category: kurashi
tags: [防災, 初心者]
published: 2026-10-05
labels:
  S: 最優先
  A: ないと困る
  B: あると安心
  C: 余裕があれば
  D: 優先度は低い
criteria: |
  ① 命や健康を守るために、どれだけ必要か
  ② 災害後の生活で、困りやすいか（代わりがきかないか）
  ③ 備えやすさ・日ごろの使いやすさ
  ※ 政府広報などでは、水・食料などの備蓄は最低3日分、できれば1週間分が目安とされています。家族の人数・年齢・持病で、必要なものは変わります。お住まいの自治体の情報も、あわせて確認してください
rank_notes:
  S: まずここから
  D: 後回しでもよい
tiers:
  S:
    - name: 飲料水（1人1日3リットルが目安）
      short: 飲料水
      emoji: "💧"
      reason: 命をつなぐ、いちばん大事なもの。1人1日3リットルを目安に、最低3日分、できれば1週間分。ふだん飲む水を、少し多めに買い置きしておくと、無理がない。
    - name: 食料（そのまま食べられるもの・ごはん・缶詰など）
      short: 食料
      emoji: "🥫"
      reason: 最低3日分、できれば1週間分。アルファ米、缶詰、レトルト、ビスケットなど、火や水が少なくても食べられるものを、中心に。
    - name: 携帯トイレ・簡易トイレ
      short: 携帯トイレ
      emoji: "🚽"
      reason: 断水すると、トイレが使えなくなり、とても困る。1人1日5回が目安とされ、人数×日数分を備えておく。見落としがちだが、必需品。
  A:
    - name: 懐中電灯・ヘッドライト（予備の電池も）
      short: 懐中電灯
      emoji: "🔦"
      reason: 停電の夜に、両手が使えるヘッドライトが、役に立つ。家族の人数分と、予備の電池を用意する。
    - name: 携帯ラジオ（電池式・手回し式）
      short: ラジオ
      emoji: "📻"
      reason: 通信が途切れても、情報を得られる。電池や、手回し充電で、使えるものが安心。
    - name: モバイルバッテリー・充電器
      short: モバイルバッテリー
      emoji: "🔋"
      reason: スマホは、連絡・情報・ライトに使える。大容量のものを、ふだんから充電しておく。
    - name: 常備薬・持病の薬・お薬手帳のコピー
      short: 常備薬
      emoji: "💊"
      reason: 薬がないと、命に関わる人もいる。予備を多めに持ち、お薬手帳のコピーを、非常用バッグに入れておく。
    - name: 現金（千円札・小銭）
      short: 現金
      emoji: "💴"
      reason: 停電すると、カードや電子決済が使えないことがある。小銭も、あると便利。
  B:
    - name: カセットコンロとボンベ
      short: カセットコンロ
      emoji: "🔥"
      reason: 温かい食事は、心も落ち着かせる。使うときは、必ず換気をして、安全に気をつける。
    - name: 毛布・防寒具・使い捨てカイロ
      short: 防寒具
      emoji: "🧣"
      reason: 冬の停電は、寒さが大きな負担になる。アルミ製の保温シートも、軽くて役立つ。
    - name: 救急セット（絆創膏・消毒・包帯・体温計）
      short: 救急セット
      emoji: "🩹"
      reason: ケガの手当てに、すぐ使える。家族の必要に合わせて、中身を足す。
    - name: 衛生用品（マスク・ウェットティッシュ・歯みがきシート・生理用品）
      short: 衛生用品
      emoji: "🧼"
      reason: 断水中は、手や体を清潔に保つことが難しい。感染症の予防にもなる。
    - name: 軍手・ホイッスル・ヘルメット
      short: 軍手・笛
      emoji: "🧤"
      reason: がれきでの、ケガを防ぐ。閉じ込められたときに、笛で居場所を知らせられる。
    - name: ローリングストックの保存食（ふだんから食べるもの）
      short: ローリングストック
      emoji: "🔁"
      reason: ふだん食べるものを、多めに買い、古いものから食べて、買い足す方法。賞味期限切れを防ぎやすく、いざというときも、食べ慣れたものが食べられる。
  C:
    - name: ポータブル電源
      emoji: "⚡"
      reason: 電気を、使える時間が長くなる。価格が高めで、家族の使い方に合わせて、選ぶ。
    - name: ラップ・使い捨て食器・アルミホイル
      short: ラップ・使い捨て食器
      emoji: "🍽️"
      reason: 水が少ないときに、食器を洗わずに済む。ラップを皿に敷くと、洗い物が減る。
    - name: 家族の連絡先メモ・身分証のコピー
      short: 連絡先メモ
      emoji: "📝"
      reason: スマホが使えないときのために、紙に書いておく。避難先や集合場所も、家族で決めておく。
    - name: 予備のメガネ・コンタクト
      short: 予備のメガネ
      emoji: "👓"
      reason: 視力が、生活に直結する人には、必需品。壊れたときの備えに。
  D:
    - name: 高級な、非常食セット（食べ慣れない味のもの）
      short: 食べ慣れない非常食
      emoji: "🎁"
      reason: 備えにはなるが、口に合わなくて、食べられないこともある。ふだん食べる味のものを、中心にしたい。
    - name: 水を、ポリタンクにためたまま長期間放置する
      short: 長期間の水の放置
      emoji: "🛢️"
      reason: 水は、時間がたつと、傷みやすい。定期的に入れ替える。
summary: |
  Sは、「水」「食料」「携帯トイレ」の3つ。水は1人1日3リットル、水と食料は最低3日分、できれば1週間分が目安とされる。
  いざというとき、食べ慣れたものがあることが、心の支えになる。ふだんの食品を少し多めに買い、古いものから食べて買い足す「ローリングストック」で、無理なく備えよう。ペットがいる家は、ペットの分も、忘れずに。
related: [bousai-teiden, pet-bousai-goods, kurashi-fuyu-bokan]
