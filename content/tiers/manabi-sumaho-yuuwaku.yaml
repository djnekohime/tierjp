title: 勉強中のスマホの誘惑を断つ工夫 Tier表
description: 別の部屋に置く、通知オフ、タイマー、勉強アプリの活用…勉強中のスマホの誘惑を減らす工夫を、ゾーマが「効果×続けやすさ×勉強との両立」でS〜Dにランク付け。
category: manabi
tags:
- 初心者
- 集中
published: '2026-11-24'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 効果の高さ

  ② 続けやすさ

  ③ 勉強との両立（スマホで調べたい時にも困らないか）

  ※ 集中の感じ方には個人差があります。長時間続けて疲れたら、休憩をとってください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: スマホを、別の部屋に置く
    emoji: 🚪
    reason: 見えない・届かないのが、がまん不要で、いちばん効く。
  - name: 通知をオフ・おやすみモードにする
    emoji: 🔕
    reason: 通知で集中が途切れるのを、根本から防げる。
  - name: 勉強時間をタイマーで区切る（25分など）
    emoji: ⏲️
    reason: 終わりが決まると、集中しやすい。休憩も取りやすい。
  A:
  - name: 必要なアプリだけ使える「集中モード」を使う
    emoji: 📵
    reason: 調べものと両立できて、現実的。
  - name: 勉強を終えたら見ていい、とご褒美にする
    emoji: 🎁
    reason: 楽しみがあるので、頑張りやすくなる。
  - name: 机の上から、見えない場所（かばんの中）に置く
    emoji: 🎒
    reason: 目に入らないだけで、気が散りにくい。
  - name: 勉強用の端末（タブレットなど）を分ける
    emoji: 📱
    reason: 遊びと勉強を、物理的に分けられる。
  - name: スマホを見たくなる時間を、記録しておく
    emoji: 📝
    reason: 何がきっかけかが分かり、対策を立てやすい。
  B:
  - name: アプリの利用時間制限を、設定する
    emoji: ⏳
    reason: 一定時間で止まる。解除しやすいと、効果が薄い。
  - name: 友だちや家族と、一緒に頑張る
    emoji: 🤝
    reason: 見守りがあると、続けやすい。
  - name: ホーム画面から、SNSアプリを隠す
    emoji: 🙈
    reason: 開くまでの手間が増えて、つい見るのを防げる。
  - name: 図書館や自習室など、スマホを触りにくい場所で勉強する
    emoji: 🏛️
    reason: 周りの目があると、集中しやすい。
  - name: グレースケール（白黒）画面にする
    emoji: ⬛
    reason: 画面が魅力的でなくなり、見る気が減る。
  C:
  - name: スマホの電源を、完全に切る
    emoji: ⚡
    reason: 効果は高いが、緊急連絡が取れなくなる。
  - name: 「見ないぞ」と強く決意する
    emoji: 💪
    reason: 意志の力だけだと、長続きしにくい。
  - name: SNSのアカウントを、一時的に削除する
    emoji: 🗑️
    reason: 効果はあるが、戻すのが大変なので、慎重に。
  D:
  - name: 机の上に置いたまま、がまんする
    emoji: 👀
    reason: 置いてあるだけで、気が散りやすい。
  - name: 通知をオンのまま、勉強する
    emoji: 🔔
    reason: 短い通知でも、集中の流れが途切れる。
  - name: 休憩のつもりで、SNSを開く
    emoji: 🌀
    reason: 短い休憩のはずが、長くなりやすい。休憩は、スマホ以外で。
summary: 'スマホは便利な勉強道具でもあり、最大の誘惑でもある。意志の力でがまんしようとすると、続かない。だから、見えない・届かない・通知が来ない、という「環境」を整えるのがいちばん効く。

  S級は、スマホを別の部屋に置くこと、通知をオフにすること、そして勉強時間をタイマーで区切ること。どれも、がまんを必要としない仕組みだ。

  調べものや、勉強アプリにスマホを使いたい日は、「機能制限」や「集中モード」で、必要なアプリだけを使えるようにするのが現実的。

  反対にD級は、「机の上に置いたまま、見ないようにがんばる」。通知が来なくても、そこにあるだけで気が散ることが知られている。

  まずは、1日30分だけ、スマホを別の部屋に置くことから始めてみよう。慣れたら60分、90分と伸ばす。「終わったらスマホを見ていい」とご褒美を決めておくと、頑張りやすい。

  家族と暮らしている人は、緊急の連絡だけは受けられるようにしておくと安心。完璧を目指さず、少しずつ。

  【ひとこと】スマホをがまんできないのは、意志が弱いからではない。そもそも、そう作られている。だから、「見えない・届かない・鳴らない」の環境づくりで、味方につけよう。まずは今日30分だけ、別の部屋に置いてみる。それだけで、勉強の進み方が変わるかもしれない。

  【補足】集中が切れたら、無理に続けず、立ち上がって水を飲む、軽く伸びをするなど、スマホ以外の休憩を挟もう。無理のない範囲で。'
