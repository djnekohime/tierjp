title: ピクサーの長編映画 Tier表
description: トイ・ストーリー、モンスターズ・インク、ファインディング・ニモ、カールじいさんの空飛ぶ家、リメンバー・ミー…ピクサーの長編映画を、「何度も見たい度・知名度・愛され度」でS〜Dにランク付け。
category: entame
tags: [名作, 映画]
published: 2026-10-05
labels:
  S: 殿堂入り
  A: 大人気
  B: 名作
  C: 渋い名作
  D: 通好み
criteria: |
  ① 何度も見たくなる度
  ② 知名度・世代を超えた愛され度
  ③ 作品の印象の強さ（映像・音楽・物語）
  ※ 好みで順位は大きく変わります。ストーリーの結末などは書いていません。日本公開時の題名で並べています。これは、AIが基準を決めて並べた、ひとつの見方です
rank_notes:
  S: 何度見ても好き
  D: 好きな人は、とことん好き
tiers:
  S:
    - name: トイ・ストーリー
      emoji: "🤠"
      reason: 世界初の、全編フルCGの長編アニメとして知られるシリーズの第1作。おもちゃが持ち主のいない間に動き出す、という発想が、世代を超えて愛される。
    - name: ファインディング・ニモ
      short: ニモ
      emoji: "🐠"
      reason: 迷子になった小さな魚を探す、親子の冒険。海の美しい映像と、ユーモアのある掛け合いが人気。
    - name: モンスターズ・インク
      emoji: "👁️"
      reason: 子どもを怖がらせる、モンスターたちの会社が舞台。怪物と少女の、かけがえのない交流が、胸にしみる。
  A:
    - name: カールじいさんの空飛ぶ家
      short: カールじいさん
      emoji: "🎈"
      reason: 風船で家ごと空を飛ぶ、老人の冒険。冒頭のワンシーンが、特に強い印象を残すと語られる。
    - name: リメンバー・ミー
      emoji: "💀"
      reason: メキシコの「死者の日」を舞台にした、家族と音楽の物語。色彩の美しさと、歌の力が魅力。
    - name: インサイド・ヘッド
      emoji: "🧠"
      reason: 人の頭の中の「感情」たちが主役の、発想のユニークな作品。大人も子どもも楽しめる。
    - name: トイ・ストーリー3
      emoji: "🧸"
      reason: シリーズの中でも、大人が涙したと語られる1本。おもちゃたちとの別れが、心に響く。
    - name: レミーのおいしいレストラン
      short: レミー
      emoji: "🐀"
      reason: 料理が得意なネズミが、パリのレストランで活躍する物語。食べ物の描写が、とてもおいしそう。
    - name: Mr.インクレディブル
      short: インクレディブル
      emoji: "🦸"
      reason: 家族みんなが、ヒーローの力を持つ設定。家族の物語としても、楽しめる。
  B:
    - name: ウォーリー
      emoji: "🤖"
      reason: 地球に残されたゴミ処理ロボットの物語。ほとんどセリフがなく、映像と音で、感情を伝える。
    - name: ソウルフル・ワールド
      emoji: "🎷"
      reason: 音楽に夢を持つ男性が、人生について考える物語。ジャズの音楽が印象的。
    - name: インサイド・ヘッド2
      emoji: "😰"
      reason: 成長した主人公の頭の中に、新しい感情が増える続編。「思春期」の心の動きを描く。
    - name: バグズ・ライフ
      emoji: "🐜"
      reason: アリの世界の、小さな英雄たちの物語。昆虫の目線の映像が、楽しい。
    - name: インクレディブル・ファミリー
      emoji: "🦸"
      reason: ヒーロー一家の活躍を描いた続編。家族の協力と、日常のドタバタが魅力。
    - name: ファインディング・ドリー
      short: ドリー
      emoji: "🐟"
      reason: ニモの仲間のドリーが、自分の家族を探す物語。
    - name: トイ・ストーリー4
      emoji: "🍴"
      reason: シリーズ第4作。新しい仲間が加わり、物語は新しい方向に進む。
  C:
    - name: 2分の1の魔法
      emoji: "🪄"
      reason: 魔法のある世界に住む兄弟の、父親をめぐる冒険。兄弟の絆がテーマ。
    - name: メリダとおそろしの森
      short: メリダ
      emoji: "🏹"
      reason: スコットランドを思わせる世界で、王女と母の関係を描いた物語。
    - name: あの夏のルカ
      short: ルカ
      emoji: "🌊"
      reason: イタリアの海辺の町を舞台にした、少年たちの友情と夏の物語。
    - name: モンスターズ・ユニバーシティ
      emoji: "🎓"
      reason: 「モンスターズ・インク」の主人公たちの、大学時代を描いた前日譚。
    - name: アーロと少年
      emoji: "🦕"
      reason: 恐竜が絶滅しなかった世界を舞台にした、少年と恐竜の友情の物語。
  D:
    - name: カーズ
      emoji: "🏎️"
      reason: 車たちの世界を描いたシリーズ。好きな人はとことん好きで、グッズも人気。
    - name: 私ときどきレッサーパンダ
      short: レッサーパンダ
      emoji: "🐼"
      reason: 思春期の少女が、感情が高ぶると、レッサーパンダになってしまう物語。ユニークな発想の作品。
    - name: マイ・エレメント
      emoji: "🔥"
      reason: 火・水・土・風の住人たちがいる都市を舞台にした、異文化の恋の物語。
summary: |
  ピクサーのSは、「トイ・ストーリー」「ファインディング・ニモ」「モンスターズ・インク」。発想の面白さと、心にしみる物語が揃った、シリーズを代表する3作。
  どの作品も、家族や友情の物語として、大人も子どもも楽しめる。あなたの一番好きなピクサーは、何ランク？ ぜひ一言コメントで教えてね。
related: [ghibli-eiga, showa-anime, kankoku-eiga]
