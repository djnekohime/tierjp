title: RIZINフライ級 選手Tier表
description: 神龍誠、扇久保博正、元谷友貴、トニー・ララミー…RIZINフライ級（57kg）の選手を、2026年の最新結果をふまえてAIがランク付け。
category: kakutougi
tags: [格闘技, RIZIN, MMA]
published: 2026-09-29
labels:
  S: 絶対王者
  A: タイトル戦線
  B: 上位常連
  C: 実力派
  D: 注目株
criteria: |
  ① 最近の戦績（RIZINでの勝ち負け）
  ② タイトルへの距離（王者・挑戦者・挑戦者候補か）
  ③ 実績と試合の内容
  ※ GAMIS MMA「RIZINフライ級ランキング」（2026年1月1日更新）と、2026年9月までのRIZINの試合結果をもとにAIが判断。選手の評価は2026年9月時点のものです
rank_notes:
  S: 2026年6月に王座を奪った新王者
  A: いつベルトを巻いてもおかしくない
tiers:
  S:
    - name: 神龍誠
      emoji: "🐉"
      reason: '2026年6月、地元・仙台の「RIZIN LANDMARK 14」で扇久保博正に判定勝ちし、悲願のフライ級王座を獲得。かつて敗れた先輩へのリベンジで頂点に立った。'
  A:
    - name: トニー・ララミー
      emoji: "🦅"
      reason: 'アメリカの選手。2026年6月の仙台大会で元谷友貴に完封勝利し、11月の「RIZIN.55」で神龍誠のベルトに挑戦する予定。'
    - name: 扇久保博正
      emoji: "🧗"
      reason: '前王者。2026年6月に神龍誠に判定で敗れて王座を失ったが、レスリングと寝技の技術は階級トップクラス。王座奪還を狙う。'
    - name: 元谷友貴
      emoji: "🎯"
      reason: 'DEEPで王者になった経験を持つベテラン。フライ級とバンタム級の両方でトップ戦線を戦ってきた。2026年6月にララミーに敗れ、再起を目指す。'
  B:
    - name: 征矢貴
      emoji: "🗡️"
      reason: 'フライ級の上位戦線で経験を積む日本人選手。ランキング上位の常連。'
    - name: ジョン・ドッドソン
      emoji: "⚡"
      reason: 'アメリカのベテランで、UFCではタイトルマッチも経験した元トップ選手。持ち前のスピードは今も健在。'
    - name: ホジェリオ・ボントリン
      emoji: "🌴"
      reason: 'ブラジル出身で、UFCでも戦った経験を持つ。寝技と打撃のバランスがいい実力派。'
    - name: 伊藤裕樹
      emoji: "🔥"
      reason: 'フライ級で試合を重ねる日本人選手。2026年8月の「RIZIN.54」でランキング上位のガジャマトフを2ラウンドTKOで破り、一気に評価を上げた。'
  C:
    - name: 山本アーセン
      emoji: "🧬"
      reason: '母はレスリングの山本美憂、叔父は"KID"の愛称で知られた山本徳郁という格闘技一家の出身。2026年7月の広島大会で判定勝ちを収めた。'
    - name: エンカジムーロ・ズールー
      emoji: "🌍"
      reason: '南アフリカ出身の選手。フィジカルの強さを生かして、日本人トップ選手とも戦ってきた。'
    - name: ヒロヤ
      emoji: "🌱"
      reason: '若いころからRIZINのリングに上がり続けてきた選手。経験を力に変えて、上位への返り咲きを狙う。'
    - name: 柴田"MONKEY"有哉
      short: 柴田有哉
      emoji: "🐒"
      reason: '"MONKEY"の愛称で知られるベテラン。独特の動きと経験値で試合を作る。'
    - name: アリベク・ガジャマトフ
      emoji: "🐺"
      reason: 'ロシア出身の選手。フライ級ランキングの上位に名前を連ねる実力者。2026年8月の「RIZIN.54」では体重超過のうえ、伊藤裕樹にTKOで敗れた。'
  D:
    - name: 北方大地
      emoji: "🧭"
      reason: 'フライ級ランキングに名前が入る注目選手。RIZINでの経験を積み、上位進出を狙う。'
    - name: 村元友太郎
      emoji: "🌟"
      reason: 'フライ級ランキングに食い込んだ注目選手。これからの伸びしろに期待がかかる。'
summary: |
  フライ級は2026年に大きく動いた。長く頂点にいた扇久保博正を、かつての後輩・神龍誠が破って新時代へ。11月にはララミーの挑戦が控える。
  日本人選手の層が厚い一方、ララミーやドッドソンのような海外の実力者も多く、どの試合も目が離せない階級。
  ※ 選手の状況（引退・階級変更・移籍など）は変わることがあります。最新情報はRIZIN公式サイトで確認してください。
