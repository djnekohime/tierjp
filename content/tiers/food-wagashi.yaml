title: 和菓子 Tier表
description: 大福、どら焼き、みたらし団子、たい焼き、羊羹、桜餅、おはぎ、わらび餅、きんつば…和菓子を、AIが「食べたい度×お茶との相性×季節感」でランク付け。
category: food
genre: スイーツ
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「食べたい！」と思える人気
  ② お茶と一緒に食べたときのおいしさ
  ③ 季節を感じる楽しさ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 和菓子屋さんの三大定番
  D: 和菓子好きが最後にたどり着く
tiers:
  S:
    - name: 大福
      emoji: "⚪"
      reason: やわらかいお餅とあんこの組み合わせ。いちご大福は、今では春の定番になった大人気の和菓子。
    - name: どら焼き
      emoji: "🥞"
      reason: ふんわりした生地であんこをはさんだ和菓子。子供から大人まで大好きで、アニメのキャラクターの好物としても有名。
    - name: みたらし団子
      emoji: "🍡"
      reason: 甘じょっぱいしょうゆのたれがかかった団子。京都の下鴨神社のそばが発祥とされる。
  A:
    - name: たい焼き
      emoji: "🐟"
      reason: 鯛の形の焼き菓子。頭から食べるか、しっぽから食べるかで性格が出るといわれる。
    - name: 桜餅
      emoji: "🌸"
      reason: 桜の葉の香りがする春の和菓子。関東の長命寺と、関西の道明寺という二つのタイプがある。
    - name: おはぎ（ぼたもち）
      short: おはぎ
      emoji: "🟤"
      reason: もち米をあんこで包んだ和菓子。春のお彼岸は「ぼたもち」、秋は「おはぎ」と呼び方が変わる。
    - name: わらび餅
      emoji: "🟫"
      reason: ぷるぷるの食感にきなこと黒蜜。夏の暑い日にひんやりおいしい。
    - name: 柏餅
      emoji: "🍃"
      reason: 柏の葉で包んだ、こどもの日の和菓子。葉が落ちないことから、家が続く縁起物とされる。
  B:
    - name: 羊羹
      emoji: "🧱"
      reason: 日持ちがよく、お茶菓子の定番。とろける水羊羹は夏にぴったり。
    - name: 最中
      emoji: "🟨"
      reason: パリッとした皮にあんこ。皮と中身を別々にして、食べる直前にはさむタイプも人気。
    - name: 草餅（よもぎ餅）
      short: 草餅
      emoji: "🌿"
      reason: よもぎの香りがさわやかな春の和菓子。ひなまつりにも食べられる。
    - name: 栗きんとん
      emoji: "🌰"
      reason: 秋の栗を使った和菓子。岐阜の中津川は、栗きんとんの名所として知られる。
    - name: 生八ツ橋
      emoji: "🔺"
      reason: 京都のおみやげの定番。ニッキの香りのやわらかい皮であんこを包んだ三角形の和菓子。
  C:
    - name: きんつば
      emoji: "🟫"
      reason: 小豆をほとんどそのまま固めて焼いた、あんこ好きのための和菓子。甘さは強め。
    - name: 練り切り
      emoji: "🌺"
      reason: 花などの季節の形に作った美しい上生菓子。見た目は芸術品だが、食べる機会は限られる。
  D:
    - name: 落雁
      emoji: "🪷"
      reason: 砂糖と粉を型で固めた干菓子。お供えのイメージが強いが、お茶席で食べる上品な甘さは和菓子好きの楽しみ。
    - name: かるかん
      emoji: "⬜"
      reason: 山芋と米粉で作る、鹿児島の銘菓。ふんわり、しっとりしたやさしい甘さ。
summary: |
  和菓子は、大福・どら焼き・みたらし団子がS。どれも、あんこやお餅のやさしい甘さで、世代を問わず愛されている。
  春の桜餅と草餅、こどもの日の柏餅、秋の栗きんとんのように、和菓子は季節を食べるお菓子。お茶と一緒に、季節の和菓子を楽しんで。
related: [food-cake, food-ocha, food-dagashi]
