title: 英語を読む習慣をつくる、読み物の選び方 Tier表
description: やさしい読み物、絵本、ニュースの短い記事、好きな分野の記事…英語を読む習慣をつくるための読み物の選び方を、ゾーマが「続けやすさ×楽しさ×力がつくか」でS〜Dにランク付け。
category: manabi
tags:
- 初心者
- あるある
published: '2026-11-18'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 続けやすさ

  ② 楽しさ

  ③ 力がつくか

  ※ 作品名は挙げず、選び方のランクです。レベルや目的によって、合う読み物は変わります'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 自分のレベルより、少しやさしい読み物を選ぶ
    emoji: 📗
    reason: 7〜8割分かるのが目安。辞書に頼らず、すらすら読めて続く。
  - name: 好きな分野（料理・旅・猫・音楽など）の読み物を選ぶ
    emoji: 💖
    reason: 興味があると、分からない部分も想像で読める。
  - name: 1日5〜10分だけ、短く読む習慣をつける
    emoji: ⏱
    reason: 少しずつでも、毎日が力になる。長く続けやすい。
  A:
  - name: 絵本・子ども向けの本
    emoji: 🧸
    reason: 文が短く、絵がヒントになる。同じ表現が出て、覚えやすい。
  - name: 短いニュース記事
    emoji: 📰
    reason: 最新の話題を、短く読める。単語も、現実で使うものが多い。
  - name: レシピ・取扱説明書など、実用的な文章
    emoji: 🍳
    reason: 使う単語が決まっていて、読むと実際に役立つ。
  - name: やさしい英語で書かれた学習者向けの読み物
    emoji: 📘
    reason: 語彙が調整されていて、レベルに合わせて選べる。
  - name: 気に入った1冊を、くり返し読む
    emoji: 🔁
    reason: 同じ文章を読み返すと、表現が定着する。
  - name: 声に出して読む
    emoji: 🗣
    reason: リスニングやスピーキングにもつながる。
  B:
  - name: ブログ・SNSの短い英語投稿を読む
    emoji: 📱
    reason: 自然な表現が学べる。スラングなど、正確でない表現もある。
  - name: 歌詞は読まず、好きなアーティストのインタビュー記事を読む
    emoji: 🎵
    reason: 好きな人の言葉は、意欲が続く。
  - name: 分からない単語は、まず想像して読む
    emoji: 🧠
    reason: 飛ばして読む練習になる。意味が合っているかは、あとで確認すればよい。
  - name: 読んだ感想を、英語で一言メモする
    emoji: ✍
    reason: アウトプットになり、記憶に残りやすい。
  - name: AIや翻訳アプリで、分からない部分だけ確認する
    emoji: 🤖
    reason: 解決が早い。ただし、全部頼らず、推測してから使う。
  - name: 電子書籍の辞書機能を使う
    emoji: 📲
    reason: タップするだけで調べられ、流れが止まりにくい。
  C:
  - name: 長編小説に、いきなり挑戦する
    emoji: 📚
    reason: 達成感はあるが、ハードルが高い。慣れてからが安心。
  - name: 洋書を、日本語訳つきで読む
    emoji: 🔤
    reason: 理解は進むが、訳に頼りすぎると英文を読む力がつきにくい。
  - name: 専門書・論文を読む
    emoji: 🔬
    reason: 仕事や研究に必要なら有効。語彙が難しいので、初心者向きではない。
  D:
  - name: 分からない単語を、すべて辞書で調べる
    emoji: 📕
    reason: 読むテンポが止まり、疲れて続かなくなる。
  - name: 自分のレベルより、とても難しい本を選ぶ
    emoji: ⛰
    reason: 読めず、挫折しやすい。
  - name: 最初から最後まで、全部訳そうとする
    emoji: 🌀
    reason: 時間がかかり、読む力もつきにくい。意味をつかむ練習を優先したい。
summary: '英語を読む習慣は、リスニングやスピーキングの土台にもなる。ただ、いきなり難しい本を選ぶと、辞書を引いてばかりで疲れて、続かない。

  S級に置いたのは、「自分のレベルより少しやさしい」読み物と、好きな分野の読み物、そして短いもの。ポイントは、7〜8割が分かるくらいのやさしさ。辞書を引かなくても、流れが分かるものがちょうどいい。

  A級には、絵本・子ども向けの本、短いニュース記事、レシピなどの実用的な文章が入る。どれも、文章が短く、使われる単語が身近。同じ表現がくり返し出てくるので、自然に覚えられる。

  一方、D級の「難しい原書を、辞書を引きながら全部読む」「分からない単語を全部調べる」は、続けるうちに疲れてしまう。分からない単語は、意味が想像できれば飛ばしていい。

  おすすめの進め方は、①1日5〜10分から始める ②気に入った1冊や記事を、くり返し読む ③ときどき、声に出して読む、の3つ。気に入ったフレーズをノートに書き写すのも効果的だ。

  翻訳アプリやAIを使って、分からない部分だけ確認するのもよい。ただし、全部を訳すのではなく、意味を推測する練習も忘れずに。読み終えたら、感想を英語で一言メモすると、アウトプットにもなって、記憶に残りやすい。

  読む習慣をつくるうえで、いちばん大事なのは「楽しい」と感じられること。難しいものを頑張って読むより、気楽に読めるものを毎日少しずつ読むほうが、結果的に力がつく。気になった表現を見つけたら、付箋やノートにメモして、ときどき見返すと、読んだ内容がぐっと定着する。'
