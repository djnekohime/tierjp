title: コーヒーの飲み方 Tier表
description: ブラック、カフェラテ、カフェオレ、カプチーノ、アイスコーヒー、エスプレッソ、カフェモカ、コールドブリュー、アフォガート…コーヒーの飲み方を、AIが「毎日飲みたい度×ほっとする度」でランク付け。
category: food
genre: 飲み物
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 毎日飲みたいと思える人気
  ② ほっとできる・目が覚めるなどの満足感
  ③ 家でもお店でも楽しめるか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: コーヒーの三大定番
  D: コーヒー好きがたどり着く一杯
tiers:
  S:
    - name: カフェラテ
      emoji: "🥛"
      reason: エスプレッソにたっぷりのスチームミルク。まろやかで飲みやすく、カフェで一番人気の一杯。
    - name: ブラック（ホット）
      short: ブラック
      emoji: "☕"
      reason: コーヒー本来の香りと苦みを味わう基本の飲み方。豆の違いが一番よく分かる。
    - name: アイスコーヒー
      emoji: "🧊"
      reason: 暑い日にごくごく飲める。実は日本で広まった飲み方として知られる。
  A:
    - name: カフェオレ
      emoji: "🟫"
      reason: ドリップコーヒーと温めた牛乳を合わせた、家でも作りやすい一杯。
    - name: カプチーノ
      emoji: "☁️"
      reason: ふわふわのミルクの泡がのったイタリアの定番。ラテアートを楽しめるのも魅力。
    - name: カフェモカ
      emoji: "🍫"
      reason: チョコレートシロップを加えた甘い一杯。デザート気分で。
    - name: 缶コーヒー
      emoji: "🥫"
      reason: 自動販売機でいつでも買える、日本独特のコーヒー文化。冬のホット缶は手を温めるカイロ代わりにも。
    - name: エスプレッソ
      emoji: "🔥"
      reason: 小さなカップで一気に飲む、濃厚なイタリアのコーヒー。砂糖を入れて飲むのが本場流。
  B:
    - name: コールドブリュー（水出し）
      short: 水出しコーヒー
      emoji: "💧"
      reason: 水でゆっくり抽出した、苦みが少なくまろやかなコーヒー。
    - name: キャラメルマキアート
      emoji: "🍯"
      reason: キャラメルソースの甘さ。カフェの人気メニュー。
    - name: 加糖のミルクコーヒー
      short: 甘いミルクコーヒー
      emoji: "🍼"
      reason: 甘くてやさしい味。コーヒー牛乳の懐かしさにも通じる。
    - name: アメリカーノ
      emoji: "🗽"
      reason: エスプレッソをお湯で薄めた、すっきり飲みやすい一杯。
    - name: ソイラテ・オーツラテ
      short: ソイラテ
      emoji: "🌱"
      reason: 豆乳やオーツミルクで作るラテ。ほんのり香ばしく、牛乳が苦手な人にも。
  C:
    - name: ダルゴナコーヒー
      emoji: "🟨"
      reason: インスタントコーヒーを泡立ててミルクにのせる、韓国発で世界的に流行した飲み方。
    - name: ウィンナーコーヒー
      emoji: "🍦"
      reason: コーヒーにホイップクリームをのせた、昭和の喫茶店の定番。
  D:
    - name: アフォガート
      emoji: "🍨"
      reason: バニラアイスに熱いエスプレッソをかけるイタリアのデザート。飲み物というより大人のスイーツ。
    - name: スペシャルティコーヒーのハンドドリップ
      short: ハンドドリップ
      emoji: "🫗"
      reason: 産地や焙煎にこだわった豆を、一杯ずつていねいにいれる。フルーツのような香りに驚く、コーヒー好きの終着点。
summary: |
  コーヒーの飲み方は、カフェラテ・ブラック・アイスコーヒーがS。缶コーヒーや喫茶店のウィンナーコーヒーのように、日本独自のコーヒー文化も根強い。
  ハンドドリップのスペシャルティコーヒーまでたどり着くと、「コーヒーってフルーツだったんだ」と驚くはず。
related: [food-ocha, food-furoagari]
