title: 中古楽器の選び方・買うときのチェック Tier表
description: 状態の写真、返品条件、試奏、信頼できるお店…中古楽器を買うときのチェック項目を、ゾーマが「失敗の少なさ×確認のしやすさ×続けやすさ」でS〜Dにランク付け。
category: music
tags:
- 初心者
- 買い物
published: '2026-11-24'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 失敗の少なさ

  ② 確認のしやすさ

  ③ 続けやすさ

  ※ 楽器の種類（ギター・キーボード・管楽器など）で、チェックする場所は違います。分からない点は、お店や、詳しい人に相談してください。購入条件は、必ず各店舗の案内に従ってください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 返品・保証の条件を、購入前に確認する
    emoji: 📋
    reason: 万一の不具合があったときの、いちばんの保険になる。
  - name: 状態の写真が、複数ある店を選ぶ
    emoji: 📷
    reason: 傷や汚れ、パーツの状態が、事前に分かる。
  - name: 可能なら試奏する
    emoji: 🎹
    reason: 音と弾き心地は、写真では分からない。実際に触るのがいちばん確実。
  A:
  - name: 楽器専門店で、店員さんに相談する
    emoji: 🏪
    reason: 状態を見分けてもらえて、初心者でも安心。
  - name: 予算の上限を、先に決める
    emoji: 💰
    reason: 予算が決まると、迷わず選べる。付属品のぶんも考える。
  - name: 整備・調整済みのものを選ぶ
    emoji: 🔧
    reason: すぐ弾ける状態なら、買ってからの手間が少ない。
  - name: ケースや付属品がそろっているか確認する
    emoji: 🧰
    reason: 別に買うと、意外と出費がかさむ。
  - name: 同じモデルの新品価格も、確認しておく
    emoji: ⚖️
    reason: 差が小さいなら、新品の保証のほうが安心なことも。
  B:
  - name: ネットオークション・フリマで買う（出品者の評価を確認）
    emoji: 🌐
    reason: 安く買える場合もあるが、返品条件が弱い。慎重に。
  - name: 知り合いから譲ってもらう
    emoji: 🤝
    reason: 状態を聞きやすい。ただし、保証はなく、気まずくなることも。
  - name: 型落ちのモデルを選ぶ
    emoji: 📅
    reason: 機能は十分で、安いことが多い。パーツの入手は確認したい。
  - name: レビューや口コミで、モデルの評判を調べる
    emoji: 🔍
    reason: 弱点が事前に分かる。個人差は割り引いて読む。
  - name: 1台目は中古・続いたら買い替える
    emoji: 🔁
    reason: 続くか分からないうちは、賢い選択。
  C:
  - name: 見た目のきれいさだけで選ぶ
    emoji: ✨
    reason: 内部の状態は、外見では分からない。
  - name: 安い楽器を、とにかく数多く集める
    emoji: 📦
    reason: 置き場所に困る。演奏するのは1台なので、厳選したい。
  - name: 限定品・ヴィンテージを、初心者が選ぶ
    emoji: 🕰️
    reason: 魅力はあるが、メンテナンスや価格が難しい。
  D:
  - name: 写真1枚だけの個人取引で、即決する
    emoji: ⚠️
    reason: 状態が分からず、返品できないことが多い。
  - name: 安さだけで、よく調べずに選ぶ
    emoji: 💸
    reason: 修理で結局高くつくことがある。
  - name: 試奏も保証もなく、高額な楽器を買う
    emoji: 🚫
    reason: 失敗したときの痛手が大きい。
summary: '中古楽器は、新品よりぐっと安く手に入る一方、「状態が分からない」というリスクがある。だからS級は、「返品・保証の条件を確認する」「状態の写真が複数ある店を選ぶ」「可能なら試奏する」の3つ。どれも、失敗したときの痛手を小さくする方法だ。

  楽器は、見た目がきれいでも、内部のへたりや調整のずれがあることも。初心者は、状態を見分けるのが難しいので、専門店で、店員さんに相談しながら選ぶのが、安心。

  反対に、D級の「写真1枚だけの個人取引」「安さだけで即決」は、トラブルのもと。返品できないケースも多い。

  まずは、予算と、続けたい期間を決めよう。続くか分からないうちは、中古は賢い選択。気に入ったら、あとで買い替えればいい。

  おすすめの順番は、①予算と種類を決める ②信頼できる店をいくつか比べる ③試奏または、返品条件を確認、の3ステップ。

  購入後は、すぐに音を出して、不具合がないか確認し、気になる点があれば、保証期間内に店へ連絡を。

  【ひとこと】中古楽器は、うまく選べば、新品より良い出会いがあることも。ポイントは、焦らず、比べて、確認すること。お店の人にたくさん質問して、納得してから決めよう。最初の1台が、長い付き合いの相棒になるかもしれない。音を出す日が、楽しみだね。

  【補足】楽器の種類で見るポイントは違う。弦楽器は反りや弦高、鍵盤は鍵の戻りや音の出方など、分からなければ店員さんに聞こう。焦らず選ぼう。'
