title: 里芋の食べ方・料理 Tier表
description: 煮っころがし、豚汁、芋煮、衣かつぎ、コロッケ、グラタン…里芋の食べ方を、ゾーマが「おいしさ×ねっとり感×作りやすさ」でS〜Dにランク付け。
category: food
genre: 野菜・果物
tags:
- グルメ
published: '2026-11-16'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① おいしさ

  ② 里芋らしいねっとり・ほくほく感が活きるか

  ③ 作りやすさ（皮むき・ぬめり処理の手間）

  ※ 地域や家庭で定番は違います。ランクは「多くの人が喜びそうな順」です。里芋は必ず加熱して食べましょう'
rank_notes:
  S: 迷ったらこれ
  D: 好みが分かれる・避けたい
tiers:
  S:
  - name: 煮っころがし
    emoji: 🥘
    reason: 甘辛い煮汁をまとった、ねっとりした里芋は、ご飯が進む定番中の定番。
  - name: 豚汁・けんちん汁の具
    emoji: 🍲
    reason: 汁にとろみがついて、体が温まる。根菜との相性も抜群。
  - name: 芋煮
    emoji: 🍢
    reason: 肉と一緒にぐつぐつ煮ると、里芋の旨みが引き立つ。秋の行事食としても人気。
  A:
  - name: 衣かつぎ（皮つきゆで）
    emoji: 🥔
    reason: 皮のまま蒸す・ゆでるだけで、里芋本来の甘みが味わえる。塩をつけて素朴に。
  - name: コロッケ（つぶして揚げる）
    emoji: 🍘
    reason: ねっとり食感の、ひと味違うコロッケに。ひき肉と合わせても。
  - name: 揚げ出し
    emoji: 🍤
    reason: 外はカリッ、中はとろり。だし汁をかけると、ごちそうの味に。
  - name: グラタン・ドリア
    emoji: 🧀
    reason: ホワイトソースとチーズに、ねっとり食感が意外に合う。
  - name: 味噌田楽
    emoji: 🍡
    reason: ゆでた里芋に、甘い味噌をぬって焼く。素朴で香ばしい。
  B:
  - name: ポタージュ
    emoji: 🥣
    reason: なめらかでやさしい味。ぬめりがとろみになって、満足感がある。
  - name: いかと一緒に煮る
    emoji: 🦑
    reason: 旨みが里芋にしみる、郷土色のある定番の組み合わせ。
  - name: バター焼き・ソテー
    emoji: 🧈
    reason: 洋風に仕上げると、ビールやワインにも合う。
  - name: ハンバーグ・つくねに混ぜる
    emoji: 🍔
    reason: もちもち食感が加わり、ふんわり仕上がる。
  - name: 筑前煮に入れる
    emoji: 🍲
    reason: 根菜と一緒に煮ると、コクが出る。お正月の料理にも。
  - name: おでんの具
    emoji: 🍢
    reason: だしを吸って、ほくほく、とろり。冬の定番。
  C:
  - name: フライドポテト風に揚げる
    emoji: 🍟
    reason: ねっとり感があるので、好みが分かれる。塩で素朴に。
  - name: サラダ（ゆでてマヨネーズ）
    emoji: 🥗
    reason: さっぱり食べたいときに。冷たいと食感が変わる。
  D:
  - name: 生のまま食べる
    emoji: ⚠️
    reason: えぐみが強く、口やのどがかゆくなることがある。必ず加熱して食べる。
  - name: 冷蔵庫に長く入れて保存する
    emoji: 🧊
    reason: 低温で傷みやすい。泥つきのまま涼しい場所に置くのが基本。
  - name: 強火で長時間ぐらぐら煮る
    emoji: 💥
    reason: 煮崩れして、ぬめりで煮汁が濁る。弱めの火でじっくりと。
summary: '里芋は、秋から冬にかけてが旬。ねっとりとした独特の食感と、やさしい甘みが魅力で、煮ても揚げても焼いてもおいしい、頼れる根菜だ。

  S級は、定番の煮っころがし、豚汁、芋煮。だしや肉の旨みをしっかり吸って、体の芯から温まる。寒い日の食卓に、ぜひ登場させたい顔ぶれだ。

  里芋でいちばん手こずるのが、皮むきとぬめり。皮をむくと手がかゆくなる人もいるので、気になる場合は、ゴム手袋を使うか、洗ってしっかり乾かしてからむくと、ぬめりが出にくくて作業が楽になる。泥つきなら、先に洗って乾かしておくのがコツ。冷凍の里芋や、皮つきでゆでてからむくやり方も、手軽でおすすめ。

  煮物にするときは、下ゆで、または塩もみでぬめりを取ってから煮ると、煮汁が濁らず、味もしみやすい。ただし、煮崩れしやすいので、強火でぐらぐら煮ず、弱めの火加減で。

  里芋は、生のままでは食べられない。必ず加熱して食べよう。保存は、泥つきのまま新聞紙に包み、風通しのよい涼しい場所で。冷蔵庫に入れると傷みやすいので注意。

  秋冬の食卓を、ほっとさせてくれる里芋。ぜひ、いろいろな食べ方で試してみてほしい。'
related:
