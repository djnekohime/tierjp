title: 丼もの Tier表
description: 牛丼、親子丼、カツ丼、天丼、海鮮丼、うな丼、豚丼、ソースカツ丼…丼ものを、AIが「かき込みたい度×満足感×手軽さ」でランク付け。
category: food
genre: ご飯もの
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「今日はこれをかき込みたい」と思える人気
  ② 一杯食べたときの満足感
  ③ 気軽に食べられるか（値段・お店の多さ）
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 日本の丼の三大巨頭
  D: ご当地の名物丼
tiers:
  S:
    - name: 牛丼
      emoji: "🐂"
      reason: 甘辛く煮た牛肉と玉ねぎ。早くて安くておいしい、日本のファストフードの代表。つゆだく・卵・紅しょうがで自分好みに。
    - name: 親子丼
      emoji: "🐔"
      reason: 鶏肉と卵のやさしい組み合わせ。ふわとろの卵とだしがご飯にしみて、ほっとする味。
    - name: カツ丼
      emoji: "🐖"
      reason: 卵でとじたとんかつがどーんとのった、ボリューム満点の一杯。「勝つ」にかけて、試験や試合の前の験担ぎにも。
  A:
    - name: 天丼
      emoji: "🍤"
      reason: えびや野菜の天ぷらに甘辛いたれ。たれのしみたご飯が一番おいしいという人も。
    - name: 海鮮丼
      emoji: "🐟"
      reason: 新鮮な刺身をたっぷりのせた、港町や市場の名物。見た目の豪華さでテンションが上がる。
    - name: うな丼
      emoji: "🐍"
      reason: 香ばしく焼いたうなぎと甘いたれ。値段は高めでも、特別な日のごちそう。
    - name: 豚丼
      emoji: "🔥"
      reason: 北海道・帯広の名物。炭火で焼いた豚肉に甘辛いたれをからめた、香ばしい一杯。
    - name: ローストビーフ丼
      emoji: "🥩"
      reason: 薄切りのローストビーフを山盛りにした、写真映えする丼。卵黄をからめて食べるのが人気。
  B:
    - name: 中華丼
      emoji: "🥢"
      reason: 野菜たっぷりのとろみあんをかけた丼。栄養のバランスがよく、やさしい味。
    - name: 鉄火丼
      emoji: "🔴"
      reason: マグロの赤身をたっぷりのせた丼。シンプルだからこそ、マグロの質が分かる。
    - name: 麻婆丼
      emoji: "🌶️"
      reason: ピリ辛の麻婆豆腐をご飯にかけて。辛さとご飯の相性は抜群。
    - name: 天津飯
      emoji: "🟡"
      reason: かに玉をご飯にのせて甘酢あんをかけた、日本生まれの中華料理。
    - name: そぼろ丼
      emoji: "🌼"
      reason: 鶏そぼろと炒り卵、緑の野菜で三色に。お弁当でもおなじみ。
  C:
    - name: 他人丼
      emoji: "🐂"
      reason: 親子丼の鶏肉を牛肉や豚肉に変えた丼。「他人」という名前が面白いが、見かける機会は少なめ。
    - name: ロコモコ
      emoji: "🌺"
      reason: ハンバーグと目玉焼きをのせたハワイの丼。グレイビーソースの洋風の味。
  D:
    - name: ソースカツ丼
      emoji: "🫗"
      reason: 卵でとじず、ソースにくぐらせたカツをのせる丼。福井や会津若松などのご当地名物で、地元では「カツ丼といえばこれ」という人も多い。
    - name: 他の地域のご当地丼（しらす丼・いくら丼など）
      short: ご当地の海鮮丼
      emoji: "🐚"
      reason: 湘南のしらす丼、北海道のいくら丼など、その土地の名産をのせた丼。旅先でしか味わえない特別な一杯。
summary: |
  丼ものは、牛丼・親子丼・カツ丼がS。どれも「ご飯にしみたたれやだし」が主役ともいえる、丼ならではのおいしさ。
  帯広の豚丼や福井・会津のソースカツ丼のように、地域によって「当たり前の丼」が違うのも面白い。旅先ではご当地の丼を探してみて。
related: [food-gohan-otomo, food-yakitori, food-yakiniku-bui]
