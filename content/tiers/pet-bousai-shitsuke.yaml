title: 災害に備えて、ペットに慣らしておきたいこと Tier表
description: キャリーに慣れる、待て・おいで、ケージで落ち着く、無駄吠えの対策、人や犬に慣れる…災害時のために、ふだんから犬猫に練習しておきたいことを重要度でS〜Dにランク付け。
category: animals
tags: [犬, 猫, 防災, 動物]
published: 2026-10-03
labels:
  S: 最優先
  A: かなり重要
  B: できればやりたい
  C: あると助かる
  D: 無理しなくていい
criteria: |
  ① 避難のしやすさ・安全に直結するか
  ② 避難所で周りに迷惑をかけず過ごせるか
  ③ 練習しやすさ
  ※ しつけは、動物の性格や年齢で、進み方が違います。無理に練習させると、逆効果になることもあります。ごほうびを使って、楽しく少しずつ進めましょう。難しい場合は、獣医さんやトレーナーに相談してください
rank_notes:
  S: 避難の成否を分ける
  D: 完璧を求めなくていい
tiers:
  S:
    - name: キャリー・ケージ・クレートに慣れる
      short: キャリーに慣れる
      emoji: "🧳"
      reason: 避難の基本は、キャリーで安全に移動すること。日ごろから部屋に置き、おやつをあげたり、中で食事をさせたりして、「安心できる場所」にしておく。
    - name: 「おいで」「待て」などの基本の声かけ
      short: おいで・待て
      emoji: "🗣️"
      reason: 脱走や、危険な場面で、飼い主の声に反応できることが、命を守る。遊びながら、少しずつ練習する。
  A:
    - name: ケージやクレートで、静かに過ごせる
      short: ケージで静かに
      emoji: "🏠"
      reason: 避難所では、ケージで過ごす時間が長くなる。短い時間から慣らして、リラックスして過ごせるようにする。
    - name: 首輪・ハーネス・リードをつけるのに慣れる
      short: リードに慣れる
      emoji: "🦮"
      reason: 避難時は、脱走を防ぐため、すぐにリードをつけられることが大切。嫌がらずにつけられるよう、日ごろから慣らす。
    - name: ペットシーツなどで、決まった場所でトイレができる
      short: トイレの練習
      emoji: "🚽"
      reason: 散歩に出られない状況でも、トイレができると、避難所で過ごしやすくなる。ペットシーツで排泄できるよう、練習しておく。
    - name: 無駄吠えや鳴き声をコントロールする
      short: 吠え・鳴き声
      emoji: "🔇"
      reason: 避難所では、鳴き声が周囲の迷惑になりやすい。吠える原因を探りながら、落ち着く練習をする。
    - name: 他の人や、動物に慣れる（社会化）
      short: 人・動物に慣れる
      emoji: "👥"
      reason: 避難所では、知らない人や動物が多い。小さいうちから、少しずつ、いろいろな人や環境に慣れさせておく。
  B:
    - name: 抱っこやさわられることに慣れる
      short: さわられ慣れ
      emoji: "🤲"
      reason: 健康チェックや、移動のときに役立つ。日ごろから、体を触る練習をする。
    - name: 缶フードやいろいろなフードを食べられる
      short: フードに慣れる
      emoji: "🍽️"
      reason: 避難先では、いつものフードが手に入らないこともある。数種類のフードを食べられると、安心。
    - name: 音（雷・地鳴り・サイレン）に慣れる
      short: 音に慣れる
      emoji: "🔊"
      reason: 災害時の音は、ペットを驚かせる。小さな音から、ごほうびと一緒に少しずつ慣らす。
    - name: 車に乗ることに慣れる
      short: 車に慣れる
      emoji: "🚗"
      reason: 車での避難や、病院への移動に必要。短い距離から、少しずつ慣らして、車酔いも確認する。
    - name: 他の動物と、距離を保って過ごせる
      short: 他の動物との距離
      emoji: "🐕"
      reason: 避難所では、ほかの動物との距離が近くなる。距離をとって、落ち着いて過ごせるよう、練習する。
  C:
    - name: ブラッシング・爪切り・歯みがきに慣れる
      short: お手入れに慣れる
      emoji: "🪮"
      reason: 避難が長引くときの、衛生管理に役立つ。日ごろから、少しずつ慣らす。
    - name: 夜に暗いところで落ち着ける
      short: 暗がりに慣れる
      emoji: "🌙"
      reason: 停電で、暗い中で過ごすこともある。暗い部屋でも落ち着けるよう、慣らしておく。
    - name: 水や食事を、決まった場所で食べられる
      short: 決まった場所で食事
      emoji: "🥣"
      reason: 避難先でも、ごはんを食べてくれることが、体調維持の助けになる。
  D:
    - name: 完璧な芸やトリックを覚える
      short: 芸・トリック
      emoji: "🎪"
      reason: 災害時に役立つのは、基本の声かけと落ち着き。芸やトリックは、楽しみとしては素晴らしいが、避難の備えとしては優先度が低い。
    - name: 嫌がっているのに、無理に慣らす
      short: 無理な練習
      emoji: "🚫"
      reason: 怖がっているのに無理に慣らすと、逆に苦手意識が強まる。少しずつ、ごほうびと一緒に進める。
summary: |
  最優先は、「キャリーに慣れる」と「おいで・待て」。この2つが、避難時に、ペットの命と、飼い主の安心を守る。
  避難所では、静かにケージで過ごせることや、トイレの練習も大きな助けになる。完璧を目指さず、楽しく、少しずつ、日ごろから積み重ねたい。
related: [pet-bousai-goods, pet-bousai-hinan, pet-bousai-sumai]
