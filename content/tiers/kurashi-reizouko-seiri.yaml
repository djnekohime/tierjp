title: 冷蔵庫の整理と食品ロスを減らす工夫 Tier表
description: 在庫を見える化、買い物前にチェック、冷凍保存、使い切りレシピ…冷蔵庫の整理と食品ロスを減らす工夫を、AIが「効果×続けやすさ」でS〜Dにランク付け。
category: kurashi
tags:
- 節約
- キッチン
published: '2026-10-12'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 食品ロスを減らす効果

  ② 続けやすさ

  ③ 手間の少なさ

  ※ 食品の保存の目安は、パッケージの表示や公的な案内に従ってください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 買い物の前に、冷蔵庫の中をチェックする
    emoji: 👀
    reason: 同じものを買う無駄が、一気に減る。
  - name: 古いものを手前、新しいものを奥に置く
    emoji: 📦
    reason: 賞味期限が近いものから使える。
  - name: 冷蔵庫を詰め込みすぎない（7割くらい）
    emoji: 🧊
    reason: 中が見えやすく、冷えも均一になる。
  A:
  - name: 買ってきたら、すぐ小分けして冷凍する
    emoji: ❄️
    reason: 使い切れない分を、無駄にしない。
  - name: 期限が近いものを、まとめて使う日を決める
    emoji: 📅
    reason: 使い切りの習慣になる。
  - name: 使い切りやすい量だけ買う
    emoji: 🛒
    reason: 特売でも、食べきれない量は買わない。
  - name: 冷蔵庫の中身を、写真やメモに残す
    emoji: 📱
    reason: 外出先でも在庫が分かる。
  B:
  - name: 野菜は新聞紙や保存袋で保存する
    emoji: 🥬
    reason: 鮮度が長持ちする。
  - name: 作り置きをしすぎない
    emoji: 🍱
    reason: 食べきれず、傷ませてしまうことも。
  - name: 余り野菜でスープや炒め物をつくる
    emoji: 🍲
    reason: 最後まで使い切れる。
  - name: ストック食材を定期的に見直す
    emoji: 🥫
    reason: 奥に眠ったものを使える。
  - name: ラベルに日付を書く
    emoji: 🏷️
    reason: いつのものか、すぐ分かる。
  C:
  - name: まとめ買いをする
    emoji: 🛍️
    reason: 安く済むが、傷ませやすい。
  - name: 冷凍庫に詰め込みすぎる
    emoji: 🧊
    reason: 何があるか分からなくなる。
  D:
  - name: においや見た目がおかしいのに、もったいなくて食べる
    emoji: ⚠️
    reason: 体調を崩す恐れがある。迷ったら食べない。
  - name: 期限切れを気にせず放置する
    emoji: 🙅
    reason: 気づいたら捨てることに。
  - name: 安いからと、食べきれない量を買う
    emoji: 📉
    reason: 結局、捨てることになりやすい。
summary: '食品ロスを減らす一番の近道は、「持っているものを把握すること」。S級は、買い物の前に冷蔵庫の中を見ること。

  冷蔵庫は詰め込みすぎない。7割くらいにしておくと、中が見えて、冷えも均一になる。'
related:
- okane-shokuhi
- kurashi-kitchen-dougu
