title: 韓国ドラマあるあるシーン Tier表
description: 手首つかみ、財閥、記憶喪失…韓国ドラマ定番シーンを「見た瞬間の盛り上がり度」でランク付け。
category: kanryu
tags: [韓国ドラマ, あるある]
published: 2026-09-22
criteria: |
  ① 見た瞬間に「来た！」とテンションが上がるか
  ② 何度見ても飽きないか
  ③ 韓ドラらしさ（他の国のドラマでは味わえない度）
rank_notes:
  S: これがあるから韓ドラはやめられない
  D: 分かっていても、ちょっと疲れる
tiers:
  S:
    - name: 手首をつかんで連れ去る
      emoji: "✋"
      reason: 韓ドラの代名詞。ヒロインが別の男性といる場面で、主人公が手首をつかんで無言で連れていく。現実なら問題だが、ドラマだと毎回ときめくのが不思議。
    - name: おんぶして夜道を歩く
      emoji: "🌙"
      reason: 酔ったヒロインをおんぶするのは恋が動き出すサイン。背中ごしの本音トークまでがセットで、名場面が生まれやすい。
  A:
    - name: 屋台でソジュ（焼酎）
      emoji: "🍶"
      reason: 緑の瓶と屋台のテントが出たら、登場人物の本音タイム。見ている側もなぜか飲みたくなる。
    - name: 財閥の御曹司
      emoji: "💎"
      reason: 無愛想でお金持ちの御曹司と、明るい庶民ヒロイン。王道すぎるが、王道だから安心して見られる。
    - name: 雨の中で傘を差し出す
      emoji: "☂️"
      reason: 雨が降ったらだいたい恋が始まる。スローモーションとOST（劇中歌）が流れれば完成。
    - name: '空港での別れと追いかけ'
      short: '空港で追いかける'
      emoji: "✈️"
      reason: '旅立つ恋人を追いかけて空港を走る。間に合うのか、間に合わないのか。最終回近くの定番で、分かっていても手に汗をにぎる。'
    - name: 'キスシーンで回るカメラ'
      short: '回転カメラのキス'
      emoji: "🎥"
      reason: '2人の周りをカメラがぐるぐる回り、OSTが流れる。「来た来た！」と画面の前で叫びたくなる、韓ドラ名物の演出。'
  B:
    - name: 子供の頃に実は出会っていた
      emoji: "🧒"
      reason: 終盤で「あの時の子が…！」と判明する運命演出。感動するが、途中で気づいてしまうことも多い。
    - name: 反対するお母さん（封筒でお金）
      emoji: "💰"
      reason: 「これで息子と別れて」と封筒を差し出す名物シーン。ドラマを盛り上げるが、見ているとちょっとイライラする。
    - name: '主人公のシャワーシーン'
      short: 'シャワーシーン'
      emoji: "🚿"
      reason: '物語に関係あるのか分からないけれど、なぜか差し込まれるサービスシーン。視聴者へのごほうび。'
    - name: '酔って目覚めたら相手の家'
      short: '酔って翌朝'
      emoji: "🛏️"
      reason: 'お酒で記憶をなくし、翌朝目覚めると知らない部屋。ここから2人の関係が一気に動き出す。'
  C:
    - name: 記憶喪失
      emoji: "🤕"
      reason: 一気に話が動くが、何度も使われすぎて「またか」となりやすい。ただし使い方がうまい作品は名作になる。
    - name: '出生の秘密'
      emoji: "🧬"
      reason: '実は財閥の子供だった、実は兄妹だった…。物語を大きく動かすが、使われすぎて「また？」となることも。'
    - name: '最終回直前の「◯年後」'
      short: '◯年後'
      emoji: "⏳"
      reason: '急に数年後に飛んで、みんなの近況が描かれる。すっきりする一方で、「その間が見たかった！」とツッコみたくなる。'
  D:
    - name: トラックにひかれそうになる
      emoji: "🚚"
      reason: 突然のトラックは韓ドラ界最大の災害。展開を動かすためだと分かっていても、毎回ハラハラさせられて心臓に悪い。
summary: |
  S級の2つは「距離が一気に縮む瞬間」という共通点がある。韓ドラの魅力は大事件よりも、こういう小さな接近シーンにあるというのがAIくろの結論。
  C〜Dの「記憶喪失」「トラック」は、嫌いというより「また来た！」とツッコむための様式美。ツッコミながら見るのも韓ドラの楽しみ方。
related: [kankokugo-benkyou]
