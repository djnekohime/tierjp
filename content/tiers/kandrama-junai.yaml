title: 韓国ドラマ 純愛・メロドラマ Tier表
description: 冬のソナタ、愛の不時着、トッケビ、涙の女王…泣ける韓国の純愛ドラマを、AIが「涙の量×心に残る度」でランク付け。
category: kanryu
tags: [韓国ドラマ, 純愛]
published: 2026-09-29
criteria: |
  ① 泣けるか（涙の量）
  ② 見終わったあと、心に残り続けるか
  ③ 悲しいだけで終わらないか（救いがあるか）
rank_notes:
  S: ティッシュ1箱じゃ足りない
tiers:
  S:
    - name: 愛の不時着（2019）
      emoji: "🪂"
      reason: ヒョンビンとソン・イェジン主演。国境を越えた恋という大きな壁があるからこそ、2人の一途さが際立つ。笑いも多く、泣けるのに見ていてつらくない。
    - name: トッケビ〜君がくれた愛しい日々〜（2016）
      emoji: "🕯️"
      reason: コン・ユとキム・ゴウン主演。永遠の命と運命の恋。美しいセリフと映像が心に残り、何年たっても思い出す人が多い。
  A:
    - name: 冬のソナタ（2002）
      emoji: "❄️"
      reason: ペ・ヨンジュンとチェ・ジウ主演。初恋を一生かけて貫く、韓国純愛ドラマの原点。音楽を聴くだけで場面がよみがえる人も多い。
    - name: 涙の女王（2024）
      emoji: "👑"
      reason: キム・スヒョンとキム・ジウォン主演。夫婦が失いかけた愛を取り戻していく。コメディ要素も多く、泣きと笑いの配分がうまい。
    - name: 二十五、二十一（2022）
      emoji: "🤺"
      reason: キム・テリとナム・ジュヒョク主演。青春のまぶしさと、大人になって変わっていく関係の切なさ。結末について今も語られるほど心に残る。
    - name: 'その年、私たちは（2021）'
      emoji: "📹"
      reason: 'チェ・ウシクとキム・ダミ主演。高校時代の元恋人が、ドキュメンタリーの撮影で再会する。静かで切なく、見終わったあと温かい。'
    - name: 'ミスター・サンシャイン（2018）'
      emoji: "🎩"
      reason: 'イ・ビョンホンとキム・テリ主演。朝鮮末期の激動の時代に生まれた愛。壮大で美しく、涙なしには見られない。'
  B:
    - name: ごめん、愛してる（2004）
      emoji: "🧣"
      reason: ソ・ジソブとイム・スジョン主演。孤独な主人公の激しく切ない愛。韓国では伝説的な人気作だが、とても重いので見る日を選ぶ。
    - name: 天国の階段（2003）
      emoji: "🪜"
      reason: クォン・サンウとチェ・ジウ主演。次々に襲いかかる試練に涙が止まらない。今見ると展開の激しさにツッコミたくなるのも楽しみ方。
    - name: '太陽の末裔 Love Under The Sun（2016）'
      short: '太陽の末裔'
      emoji: "🪖"
      reason: 'ソン・ジュンギとソン・ヘギョ主演。軍人と医師の恋。名セリフが多く、ロマンスの王道を楽しめる。'
    - name: 'ボーイフレンド（2018）'
      emoji: "🌊"
      reason: 'ソン・ヘギョとパク・ボゴム主演。立場の違う2人の静かな恋。映像がとても美しい大人の純愛。'
  C:
    - name: 秋の童話（2000）
      emoji: "🍁"
      reason: ソン・スンホンとソン・ヘギョ主演。美しい映像の悲恋ドラマだが、救いの少ない展開が続くので、見終わったあとの疲労感も大きい。
    - name: '美しき日々（2001）'
      emoji: "🎹"
      reason: 'イ・ビョンホンとチェ・ジウ主演。2000年代初めの王道メロドラマ。今見ると展開の古さを感じるが、それも味わい。'
    - name: '雪の女王（2006）'
      emoji: "⛄"
      reason: 'ヒョンビンとソン・ユリ主演。心に傷を抱えた2人の切ない純愛。美しいが悲しい展開が続く。'
    - name: '今、別れの途中です（2021）'
      emoji: "👗"
      reason: 'ソン・ヘギョとチャン・ギヨン主演。ファッション業界の大人の恋。映像はおしゃれだが、物語はゆっくりめ。'
summary: |
  いい純愛ドラマは「悲しいだけ」で終わらない。Sの2本は、泣いたあとに温かい気持ちが残るのが強さ。
  2000年代の純愛ドラマは涙の量では最強クラス。ただし体力を使うので、元気な日に見るのがおすすめ。
related: [kandrama-romcom, kandrama-fantasy, kandrama-2000s]
