title: 焼肉屋のサイドメニュー Tier表
description: ライス、キムチ、ナムル、冷麺、ビビンバ、チョレギサラダ、クッパ、わかめスープ、石焼ビビンバ…焼肉屋さんの肉以外のメニューを、AIが「頼みたい度×肉との相性」でランク付け。
category: food
genre: 肉料理
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 焼肉屋さんで「肉と一緒に必ず頼む」人気
  ② 焼肉との相性（口直し・締め）
  ③ 満足感
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 焼肉には欠かせない三大サイド
tiers:
  S:
    - name: ライス
      emoji: "🍚"
      reason: たれのついた焼肉をワンバウンドさせて食べる白いご飯。焼肉の最強の相棒。
    - name: キムチ
      emoji: "🌶️"
      reason: 焼肉の前菜の定番。肉と一緒にサンチュで巻いても最高。
    - name: 冷麺
      emoji: "🍜"
      reason: 焼肉の締めといえば冷麺。こってりした後に、冷たくさっぱりしたスープとコシのある麺がうれしい。
  A:
    - name: ナムル
      emoji: "🥬"
      reason: ごま油であえた野菜の小皿。肉の合間の箸休めに。
    - name: 石焼ビビンバ
      emoji: "🔥"
      reason: 熱々の石鍋で、おこげがパリパリ。締めに頼みたい人気メニュー。
    - name: チョレギサラダ
      emoji: "🥗"
      reason: ごま油と塩のドレッシングで食べる韓国風サラダ。肉の前に食べてさっぱり。
    - name: わかめスープ
      emoji: "🥣"
      reason: ごま油の香るやさしいスープ。焼肉の合間にほっとする。
    - name: サンチュ
      emoji: "🌿"
      reason: 焼肉を包んで食べる葉野菜。味噌やキムチと一緒に巻くと、いくらでも食べられる。
  B:
    - name: クッパ
      emoji: "🍲"
      reason: スープにご飯を入れた韓国料理。締めにお腹を温めたいときに。
    - name: ビビンバ
      emoji: "🍳"
      reason: ナムルや卵をご飯にのせて混ぜて食べる。石焼より手軽。
    - name: チヂミ
      emoji: "🥞"
      reason: 韓国風のお好み焼き。みんなでシェアしやすい。
    - name: カクテキ
      emoji: "🟥"
      reason: 大根のキムチ。シャキシャキ食感でさっぱり。
    - name: テールスープ
      emoji: "🐂"
      reason: 牛のしっぽを煮込んだ濃厚なスープ。滋味深い一杯。
  C:
    - name: ユッケジャンスープ
      emoji: "🌶️"
      reason: 辛い牛肉のスープ。辛いもの好きには締めの定番だが、好みは分かれる。
    - name: 杏仁豆腐・アイス
      short: デザート
      emoji: "🍨"
      reason: 焼肉の後の口直しのデザート。お腹に余裕があれば。
  D:
    - name: 焼き野菜
      emoji: "🧅"
      reason: 玉ねぎ、かぼちゃ、しいたけなどを網で焼く。肉の脂を吸った野菜は、実はとてもおいしい通好みの一品。
    - name: ガーリックライス
      emoji: "🧄"
      reason: 焼肉屋さんによっては鉄板で作ってくれる、香ばしいガーリックライス。見つけたら頼みたい。
summary: |
  焼肉屋のサイドメニューは、ライス・キムチ・冷麺がS。肉の前にキムチ、肉と一緒にライス、締めに冷麺という流れは、焼肉の黄金コース。
  石焼ビビンバやクッパのように、韓国料理のメニューが充実しているのも焼肉屋さんの楽しみ。
related: [food-yakiniku-bui, kandrama-gourmet]
