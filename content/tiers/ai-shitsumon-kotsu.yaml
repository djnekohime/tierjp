title: AIへの質問・お願いのコツ Tier表
description: 目的を伝える、条件を書く、例を見せる、一度に一つずつ聞く、聞き返す、出典を聞く…AIにうまく答えてもらうコツを「効果の大きさ・手軽さ」でS〜Dにランク付け。
category: ai
tags: [AI, 初心者]
published: 2026-10-05
labels:
  S: まずこれ
  A: かなり効く
  B: 合う場面で
  C: 慣れてから
  D: 逆効果になりやすい
criteria: |
  ① 答えの質が、どれくらい上がるか
  ② 手軽さ（すぐ使えるか）
  ③ いろいろな場面で使えるか
  ※ AIの種類や、バージョンによって、反応は変わります。一般的に役立つとされる使い方を、整理したものです。完璧な「呪文」はなく、試しながら調整するのが基本です
rank_notes:
  S: 迷ったらここから
  D: かえって、答えが悪くなりやすい
tiers:
  S:
    - name: 「何のために」「誰に向けて」を最初に伝える
      short: 目的と相手を伝える
      emoji: "🎯"
      reason: 同じ質問でも、目的や読む人が違えば、答えは変わる。「友だちに送るLINE」「上司に出すメール」など、背景を伝えるだけで、ぐっと使える答えになる。
    - name: 条件を具体的に書く（文字数・トーン・形式）
      short: 条件を書く
      emoji: "📏"
      reason: 「300字で」「やさしい言葉で」「箇条書きで」など、希望をはっきり書く。後から直す手間が、大きく減る。
  A:
    - name: 例を見せる（「こんな感じで」）
      short: 例を見せる
      emoji: "📋"
      reason: 文章のトーンや、書き方を、実際の例で伝えると、イメージのずれが少ない。
    - name: 一度に、頼むことを一つにしぼる
      short: 一度に一つ
      emoji: "☝️"
      reason: たくさんの依頼を一度に出すと、抜けや混乱が起きやすい。順番に、一つずつ頼む。
    - name: 返ってきた答えに、聞き返して直してもらう
      short: 聞き返して直す
      emoji: "🔁"
      reason: 最初の答えが、完璧でなくても、「もう少しやさしく」「もっと短く」と直してもらえる。会話するつもりで、使う。
    - name: 「分からないことは質問してから進めて」と伝える
      short: 質問してから進めて
      emoji: "🙋"
      reason: AIが、足りない情報を、先に聞いてくれる。勝手な思い込みで、進められるのを、防げる。
    - name: 役割を決める（「編集者として」「先生として」）
      short: 役割を決める
      emoji: "🎭"
      reason: 見方や、答え方が、整いやすい。場面によって、効果の大きさは変わる。
  B:
    - name: 長い資料は、分けて渡す
      short: 資料は分けて渡す
      emoji: "✂️"
      reason: 一度に長すぎると、途中の内容が、抜けやすい。区切って渡し、要点を確認する。
    - name: 「出典や根拠も教えて」と頼む
      short: 出典を聞く
      emoji: "🔗"
      reason: 確認する手がかりになる。ただし、出典自体が、間違っていることもあるので、実際に調べて確認する。
    - name: 「やってはいけないこと」を、具体的に書く
      short: NGを伝える
      emoji: "🚫"
      reason: 「専門用語は使わない」など、避けたいことを書くと、ずれにくい。
    - name: 考え方・手順を、順に説明してもらう
      short: 手順を説明してもらう
      emoji: "🪜"
      reason: 結論だけでなく、理由も確認できるので、間違いを見つけやすい。
    - name: 複数の案を出してもらい、比べる
      short: 複数案を比べる
      emoji: "⚖️"
      reason: 選択肢が見えると、自分に合うものを選びやすい。
  C:
    - name: 長くて複雑な指示を、一度に書く
      short: 長い指示を一度に
      emoji: "📜"
      reason: 慣れると、強力だが、最初は抜けや矛盾が起きやすい。少しずつ、足していくのがおすすめ。
    - name: 感情を込めて頼む（「お願い！」など）
      short: 感情を込める
      emoji: "🥺"
      reason: 効果は、はっきりしない。言い方より、情報や条件を、具体的にするほうが確実。
    - name: ほかのAIの答えを貼って、比べてもらう
      short: 別の答えと比較
      emoji: "🔬"
      reason: 見比べるのには便利。どちらも、間違っていることがあるので、最後は、自分で確認する。
  D:
    - name: 「いい感じに」「適当に」だけで頼む
      short: ふわっとした依頼
      emoji: "☁️"
      reason: 何を求めているのか、AIにも伝わらない。条件をひとつでも書くと、ぐっと良くなる。
    - name: 一回の答えが気に入らなくて、すぐ諦める
      short: すぐ諦める
      emoji: "🏳️"
      reason: 聞き返して直せるのが、AIのよいところ。数回やりとりすると、見違えることが多い。
    - name: 個人情報や、秘密の情報をそのまま入力する
      short: 個人情報を入れる
      emoji: "🔑"
      reason: 入力した情報の扱いは、サービスによって違う。名前・住所・パスワードなどは、入れない。
summary: |
  質問のSは、「目的と相手を伝える」「条件を具体的に書く」。この2つだけで、答えの質は、大きく変わる。
  最初から完璧を目指さず、会話しながら直してもらうのが、AIとの上手な付き合い方。個人情報は入れず、答えは、最後に自分で確認しよう。
related: [ai-nani-makaseru, ai-fact-check, ai-gazou-chui]
