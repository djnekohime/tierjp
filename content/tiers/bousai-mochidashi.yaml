title: 非常持ち出し袋の中身 Tier表
description: 水、食料、ライト、ラジオ、モバイルバッテリー、簡易トイレ、常備薬…非常持ち出し袋の中身を、AIが「必須度×命に関わる度」でS〜Dにランク付け。
category: kurashi
tags:
- 防災
- 初心者
published: '2026-10-07'
labels:
  S: 最優先
  A: 入れておきたい
  B: あると安心
  C: 家庭しだい
  D: 優先度は低い
criteria: '① 命・健康に関わる度

  ② 避難した直後に必要か

  ③ 重さ・かさばりの少なさ

  ※ 家族構成・持病・ペットの有無で必要なものは変わります。自治体の防災情報や、防災の公式ガイドも確認してください。定期的に、期限や電池を点検してください'
rank_notes:
  S: 最優先で入れる
  D: 優先度は低い
tiers:
  S:
  - name: 飲料水
    emoji: 💧
    reason: 命に関わる最優先。持てる範囲で、ペットボトルや飲料パックを。
  - name: 非常食（そのまま食べられるもの）
    emoji: 🥫
    reason: 加熱不要で、軽く、賞味期限が長いものを。
  - name: 懐中電灯・ヘッドライト
    emoji: 🔦
    reason: 停電時の夜に必須。両手が空くヘッドライトが便利。予備の電池も。
  - name: 携帯ラジオ・手回し充電ラジオ
    emoji: 📻
    reason: 情報を得る手段。電池式か、手回し式が安心。
  - name: モバイルバッテリー・充電ケーブル
    emoji: 🔋
    reason: 連絡・情報のために、スマホを使えるように。
  A:
  - name: 携帯トイレ（簡易トイレ）
    emoji: 🚽
    reason: 断水・混雑時に必須。1人1日数回分が目安。
  - name: 常備薬・持病の薬・お薬手帳のコピー
    emoji: 💊
    reason: 慣れた薬が、すぐ手に入らないことがある。
  - name: マスク・衛生用品・生理用品
    emoji: 😷
    reason: 避難所で必要。使い慣れたものを。
  - name: 軍手・厚手の手袋
    emoji: 🧤
    reason: がれきや、割れたガラスから手を守る。
  - name: 現金（小銭）・身分証のコピー
    emoji: 💴
    reason: 停電時は、カードが使えないことも。公衆電話用の10円玉も。
  - name: 歩きやすい靴・靴下
    emoji: 👟
    reason: 避難のとき、足を守る。枕元に置いておく手もある。
  B:
  - name: 雨具・ポンチョ
    emoji: ☔
    reason: 雨や、寒さを防ぐ。コンパクトなもの。
  - name: 防寒シート（アルミ）・ブランケット
    emoji: 🧣
    reason: 寒さ対策。軽くて小さい。
  - name: ホイッスル（笛）
    emoji: 📢
    reason: 閉じ込められたときに、居場所を知らせる。
  - name: ウェットティッシュ・ビニール袋
    emoji: 🧻
    reason: 水が使えないときの衛生に。ゴミ袋としても。
  C:
  - name: 家族の写真・連絡先メモ
    emoji: 📇
    reason: はぐれたときの確認に。スマホが使えないときのバックアップ。
  - name: ペット・赤ちゃん用品（家庭しだい）
    emoji: 🐾
    reason: 必要な家庭は、専用のものを。ペットは、フード・水・キャリーなど。
  D:
  - name: 大きな調理器具・かさばる食品
    emoji: 🍳
    reason: 重く、持ち出せない。家の備蓄（在宅避難）用に。
summary: '非常持ち出し袋は、「避難した最初の数日を、自力で乗り切るための袋」。S級は、水・食料・ライト・情報を得る手段・連絡手段。

  あれもこれも入れると重くなって、持ち出せなくなる。まず軽く、必要なものだけをそろえて、半年に1回、中身を点検するのがおすすめ。'
related:
- bousai-bichiku
- bousai-teiden
- pet-bousai-goods
