title: 家系ラーメンのお店・チェーン Tier表
description: 吉村家、町田商店、壱角家、六角家、本牧家、壱六家、魂心家、王道家、武蔵家…豚骨醤油に、太いちぢれ麺。家系ラーメンの元祖から人気チェーンまで、AIが「歴史や個性×また行きたい度」でランク付け。
category: food
genre: ラーメン
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 歴史や個性（このお店ならでは、があるか）

  ② また行きたくなる度

  ③ 家系らしさ

  ※ AIは全店で食べたわけではありません。公開情報（創業・系譜・店舗数）と、AIの好みで並べています。ランクはお店の良し悪しではなく「歴史や特徴の目立ち方」です。

  家系には「直系」「壱系」などの系譜があります。店舗数は町田商店のみ公式の店舗一覧による目安です。

  '
rank_notes:
  S: 家系といえば、まずここ
  D: 知る人ぞ知る
tiers:
  S:
  - name: 吉村家
    emoji: 👑
    reason: 1974年に横浜で創業。約1000店あると言われる家系ラーメンの起源で、「総本山」と呼ばれる。豚骨醤油スープと極太ちぢれ麺。
  - name: 町田商店
    emoji: 🍥
    reason: 2008年に厚木で開店。自社製麺とセントラルキッチンで、全国194店舗に拡大。玉葱・漬物・刻み生姜・ふりかけが無料。口コミ調査では、4ブランド中で平均評価が最も高かった。
  - name: 壱角家
    emoji: 🔰
    reason: 2014年3月に1号店。急速に拡大した、家系チェーンのひとつ。運営はマック。
  A:
  - name: 六角家
    emoji: 🏯
    reason: 吉村家・本牧家とならぶ、家系の「御三家」。弟子たちが各地に暖簾分けし、「最大派閥」と呼ばれた。
  - name: 本牧家
    emoji: 🌊
    reason: 吉村家・六角家とならぶ、家系の「御三家」のひとつ。
  - name: 壱六家
    emoji: 🧭
    reason: 1992年に磯子で創業。吉村家とは関係なく、「壱系」と呼ばれる系譜の源流。
  - name: 魂心家
    emoji: 🔥
    reason: 2010年に開店。トイダックが運営。ライス無料が特徴。
  - name: 王道家
    emoji: 🛤️
    reason: 店主は吉村家で修行した人。直系として営業していたが、のちに離脱して独自の道へ。
  B:
  - name: 武蔵家
    emoji: 🌳
    reason: 吉祥寺の人気店。「武蔵家系」と呼ばれる系譜で、家系の新しい流れを作った。
  - name: 杉田家
    emoji: 🏠
    reason: 吉村家の直系を掲げるお店のひとつ。
  - name: 末廣家
    emoji: 🎌
    reason: 吉村家の直系を掲げるお店のひとつ。
  - name: 環2家
    emoji: 🛣️
    reason: 吉村家の直系を掲げるお店のひとつ。
  C:
  - name: 厚木家
    emoji: 🍜
    reason: 吉村家の直系を掲げるお店のひとつ。
  - name: 松壱家
    emoji: 🥬
    reason: 壱系のチェーンで、口コミ調査の4ブランドに入っている。
  D:
  - name: はじめ家
    emoji: 🌱
    reason: 吉村家の直系を掲げるお店のひとつ。
summary: '家系ラーメンは、吉村家・町田商店・壱角家がS。元祖の総本山と、全国で出会えるチェーン、勢いのある新しい流れ。

  家系には、直系、壱系、武蔵家系、王道家系など、いくつもの系譜がある。系譜を知ってから食べ比べると、もっとおもしろい。調べた日は2026年10月3日。

  '
