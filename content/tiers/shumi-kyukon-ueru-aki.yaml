criteria: '① 育てやすさ

  ② 咲いたときの感動

  ③ コスパ（手間とお金のバランス）

  ※ 球根の植えどきや深さは、地域・品種によって違います。購入した球根のラベルや、販売店の案内に従ってください。球根の一部は、ペットや小さな子どもが食べると危険な種類もあるので、置き場所に注意してください'
