summary: '秋に球根を植えて、冬を越し、春に花を咲かせる。球根の園芸は、待つ楽しみがぎゅっと詰まった趣味だ。植えるのは今の時期が適期で、手間も少ないので、初心者にも向いている。

  S級は、チューリップ、スイセン、クロッカス。どれも、植えっぱなしでも比較的育てやすく、春の庭やベランダを明るくしてくれる。水栽培のヒヤシンスは、根が伸びる様子まで観察できて、お部屋でも楽しめる。

  植え方の基本は、球根の高さの2〜3倍の深さに植えること。とがった方を上にし、肥料は、植え付け時に元肥を少し混ぜておく。水はけのよい土を使い、植えたあとにたっぷり水を与える。その後は、土が乾いたら水やりをする程度でいい。

  ただし、水の与えすぎは、球根が腐る原因になる。鉢植えの場合は、冬の間、受け皿に水をためないように。

  スイセンやヒヤシンスなど、有毒な成分を含む球根もある。ペットが誤って食べないよう、保管や植える場所に気をつけたい。

  咲き終わった花がらは、早めに摘むのがコツ。翌年も咲かせたいなら、葉が枯れるまで残して、球根に栄養を蓄えさせよう。春の開花が待ち遠しくなる、冬の楽しみになる。'
