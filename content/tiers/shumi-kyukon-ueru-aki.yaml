  - name: アネモネ
    emoji: 🌺
    reason: 色鮮やかな花が楽しめる。球根の吸水の準備が必要な種類もある。
  - name: ラナンキュラス
    emoji: 🌹
    reason: ゴージャスな花びらが人気。鉢植えにも向く。
