title: 爬虫類飼育グッズ Tier表
description: サーモスタット、パネルヒーター、UVBライト、シェルター、温湿度計…爬虫類を飼うときの定番グッズを、必要度と安全性でS〜Dにランク付け。
category: animals
tags: [爬虫類, 動物, 初心者]
published: 2026-10-03
criteria: |
  ① 命や健康にとって、どれだけ必要か
  ② 毎日の使いやすさ・手間
  ③ 安全性（やけど・脱走・事故の防ぎやすさ）
  ※ 特定の商品ではなく「種類」のランキングです。種類によって必要なグッズは大きく変わります（昼行性・夜行性・ヘビ・カメなど）。必ず、飼う種類に合った情報を確認してください
rank_notes:
  S: 迎える前にそろえたい
  D: 買う前に必要か考えたい
tiers:
  S:
    - name: ケージ（ガラス・プラスチックなど）
      short: ケージ
      emoji: "🏠"
      reason: 脱走を防いで、温度や湿度を保つための基本。ふたがしっかり閉まり、種類と大きさに合ったものを選ぶ。
    - name: ヒーター（パネルヒーター・保温球など）
      short: ヒーター
      emoji: "🔥"
      reason: 変温動物にとって、命を守る設備。ケージ全体ではなく、一部分だけ温めて、温度の高い場所と低い場所を作る。
    - name: サーモスタット
      emoji: "🌡️"
      reason: ヒーターの温度を、自動で調整してくれる安全装置。使わないと、温めすぎて、やけどや熱中症になる危険がある。
    - name: 温湿度計
      emoji: "📏"
      reason: 目で見て確認できないと、環境の変化に気づけない。ケージの高い所と低い所に置くと、温度差も確認できる。
  A:
    - name: 紫外線（UVB）ライト
      short: UVBライト
      emoji: "🔆"
      reason: 昼行性の種類にとって、骨の健康に欠かせない。使用期間があるので、古くなったら交換する。種類に合った強さを選ぶ。
    - name: シェルター（隠れ家）
      emoji: "🪨"
      reason: 隠れる場所があるだけで、ストレスがぐっと減る。大きさが合ったものを、温度の高い側と低い側に置くのが理想。
    - name: 水入れ
      emoji: "🥣"
      reason: 水分補給や、湿度の調整にも使う。ひっくり返りにくい、浅めの器を選ぶ。
    - name: 床材（ペーパー・ヤシ殻・土など）
      short: 床材
      emoji: "🟫"
      reason: 種類と年齢に合ったものを選ぶ。砂を誤飲する事故もあるので、最初はキッチンペーパーなどでも安心。
    - name: ピンセット・えさ入れ
      short: ピンセット
      emoji: "🥢"
      reason: えさを与えるときの、安全な道具。直接手から与えると、かまれたり、えさの反応が強くなったりする。
  B:
    - name: 流木・岩・登り木
      short: レイアウト用品
      emoji: "🌿"
      reason: 登ったり、日光浴をしたりする場所になる。種類に合った高さや形を用意する。
    - name: 霧吹き
      emoji: "🌫️"
      reason: 湿度の調整や、水分補給に使う。種類によって、必要性が違う。
    - name: カルシウム・ビタミン剤
      short: サプリ
      emoji: "💊"
      reason: えさにふりかけて、栄養を補う。種類や年齢に合わせて、量を調整する。
    - name: タイマー
      emoji: "⏰"
      reason: ライトの点灯時間を、自動で管理できる。昼夜のリズムを保てる。
    - name: キャリーケース
      emoji: "🧳"
      reason: 病院に行くときや、掃除のときに役立つ。保温の工夫も必要。
  C:
    - name: 観賞用のオブジェ・飾り
      short: 飾り
      emoji: "🏰"
      reason: 見た目は楽しいが、隙間に挟まったり、ケガをしたりする危険もある。安全な素材と形かを確認する。
    - name: ホットロック（石型ヒーター）
      short: ホットロック
      emoji: "🪨"
      reason: 直接触れる場所が高温になり、やけどの危険がある。安全な方法で温めたほうが安心。
    - name: 霧発生装置・自動給水器
      short: 自動装置
      emoji: "🤖"
      reason: 便利だが、故障すると影響が大きい。種類と環境に合うか、確認してから導入する。
  D:
    - name: 温度を調整できない安価なヒーター
      short: 調整できないヒーター
      emoji: "⚠️"
      reason: 温めすぎる事故につながる。温度を調整できる仕組みが、必ず必要。
    - name: 種類や成長に合わない大きすぎるケージ
      short: 大きすぎるケージ
      emoji: "📦"
      reason: 種類や成長に合わない大きすぎるケージは、温度管理が難しく、えさ場所も分かりにくい。大きさは、種類と成長に合わせる。
summary: |
  Sは、命を守る「ケージ・ヒーター・サーモスタット・温湿度計」の4つ。この4つがそろっていないなら、迎えてはいけない。
  種類によって、必要な紫外線ライトや隠れ家も変わる。購入する前に、飼う種類に合った飼い方を調べて、最低限の環境を整えてから迎えたい。
related: [hachurui-shurui, hachurui-shippai, inu-goods]
