title: 作業用BGMのジャンル Tier表
description: Lo-fi、ジャズ、クラシック、ボサノバ、アンビエント、ゲーム音楽、自然音…作業用BGMのジャンルを「集中しやすさ・飽きにくさ・眠くなりにくさ」でS〜Dにランク付け。
category: music
tags: [音楽制作, あるある]
published: 2026-10-05
labels:
  S: 集中の味方
  A: かなり使える
  B: 気分しだい
  C: 人を選ぶ
  D: 作業には不向き
criteria: |
  ① 集中しやすさ（歌詞やメロディに気を取られにくい）
  ② 飽きにくさ・長時間聴いても疲れにくいか
  ③ 眠くなりすぎないか・気分が上がるか
  ※ 集中できる音楽は、人や作業の内容（読む・書く・計算・作曲）で変わります。これは「一般的に作業用に選ばれやすい傾向」としてのランクです
rank_notes:
  S: 迷ったらここ
  D: 作業より「聴く」ほうに向く
tiers:
  S:
    - name: Lo-fi（ローファイ）ヒップホップ
      short: Lo-fi
      emoji: "☕"
      reason: ゆったりしたビートと、やわらかい音で、作業用の定番になった。歌詞がなく、同じような雰囲気がずっと続くので、集中の邪魔になりにくい。
    - name: ピアノのインスト
      short: ピアノ
      emoji: "🎹"
      reason: 歌詞がなく、音数も少なめなものが多い。読む・書く作業のお供に使いやすい。
  A:
    - name: ジャズ（インスト）
      short: ジャズ
      emoji: "🎷"
      reason: おしゃれな雰囲気で、カフェのような気分で作業できる。複雑な演奏だと、つい聴き入ってしまうこともある。
    - name: ボサノバ
      emoji: "🌴"
      reason: ゆるやかなリズムで、リラックスしやすい。歌が入ると、歌詞が気になる場合もある。
    - name: バロック音楽などのクラシック
      short: クラシック
      emoji: "🎻"
      reason: 古くから、勉強や仕事のお供に選ばれてきた。曲の展開が激しいものより、穏やかなものが向く。
    - name: ギターのインスト（アコースティック）
      short: アコギのインスト
      emoji: "🎸"
      reason: 暖かい音色で、気持ちが落ち着く。歌がないので、言葉に邪魔されない。
  B:
    - name: アンビエント
      emoji: "🌌"
      reason: 音が空間に広がるような音楽。集中しやすい人もいれば、眠くなる人もいる。
    - name: ゲーム音楽（インスト）
      short: ゲーム音楽
      emoji: "🎮"
      reason: ゲームの進行を邪魔しないように作られていて、作業にも合いやすい。場面に合った盛り上がりのものを選ぶと、やる気が出る。
    - name: 自然の音（雨・波・森）
      short: 自然音
      emoji: "🌧️"
      reason: 周りの雑音を消す効果があり、落ち着ける。音楽ではないので、気分が上がりにくいと感じる人もいる。
    - name: ヒーリング・オルゴール
      short: ヒーリング
      emoji: "🎁"
      reason: とてもおだやかで、リラックスしたい時に向く。眠くなりすぎる人もいる。
    - name: シティポップ
      emoji: "🌃"
      reason: 気分が上がる、おしゃれな雰囲気。歌詞がある曲だと、つい口ずさんでしまうことも。
  C:
    - name: 洋楽ポップス（歌あり）
      short: 洋楽ポップス
      emoji: "🎤"
      reason: 気分が上がりやすいが、英語がわかる人は、歌詞が気になる。作業内容によっては、集中が乱れることがある。
    - name: J-POP・アニソン（歌あり）
      short: J-POP・アニソン
      emoji: "🎶"
      reason: 好きな曲だと、作業が楽しくなる。歌詞が耳に入ると、文章を書く作業には向かない。
    - name: ロック（激しめ）
      short: ロック
      emoji: "🤘"
      reason: 単純作業や、体を動かす作業にはテンションが上がる。頭を使う作業では、集中が散りやすい。
  D:
    - name: 好きなアーティストの新曲（初聴き）
      short: 初聴きの新曲
      emoji: "🆕"
      reason: 初めて聴く曲は、気になってしまい、手が止まる。作業中ではなく、聴く時間を別に作るほうが楽しめる。
    - name: 感動して泣いてしまうバラード
      short: 泣けるバラード
      emoji: "😭"
      reason: 感情が動きすぎて、作業どころではなくなる。
summary: |
  迷ったら、歌詞がなくて、同じような雰囲気が続く「Lo-fi」か「ピアノのインスト」。作業の内容によって、読み書きにはインスト、単純作業には少し元気な曲、と使い分けるのがおすすめ。
  歌詞が気になる作業中は、歌ありの曲を避けると集中しやすい。好きな曲は、休憩時間のごほうびにしよう。
related: [music-gakki, music-daw, music-kizai]
