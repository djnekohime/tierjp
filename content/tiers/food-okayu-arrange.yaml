summary: 'おかゆは、シンプルだからこそ、足すものでまったく違う料理になる。S級の梅干し・溶き卵・鮭フレークは、どれも手元にあることが多く、入れるだけで味が決まる、頼れる3人組だ。

  白がゆは、ごはんから作ると意外と手軽。炊いたごはん1に対して水3〜5くらいを鍋に入れ、弱火で10〜15分ほど煮るだけ。炊飯器のおかゆモードを使えば、ほったらかしでもできる。

  味に飽きたら、薬味や香りで変化をつけるのがコツ。ねぎ、しょうが、ごま油、のりを少し足すだけで、気分が変わる。冷え込む朝や、ちょっと疲れた夜、胃を休ませたい日に、おかゆは心強い味方になる。

  作り置きするなら、小分けにして冷凍しておくと便利。食べるときは、水を少し足して温め直すと、なめらかに戻る。具は、食べる直前に足すと、味も食感も楽しめる。

  ただし、体調が悪いときの食事は、人によって適した内容が違う。症状が続くときや、食べられない状態が続くときは、無理をせず、早めに医療機関に相談してね。毎日の食卓では、「おかゆの日」を気軽に作って、あなたのS級アレンジを見つけてみて。

  おかゆは、土鍋で作ると、ふっくらとやさしく仕上がる。ふたをして弱火でじっくり、が基本。急いでいるときは、電子レンジ用の容器で作る方法もある。

  余ったおかゆは、お茶碗1杯ぶんずつ冷凍しておくと、思い立った日にすぐ食べられる。冬の朝のごはんに、夜食に、ちょっと食欲がない日に。あなたのお気に入りの「おかゆの日」を、季節ごとに増やしていくのも楽しいよ。'
