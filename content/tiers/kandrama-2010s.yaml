title: 2010年代の韓国ドラマ Tier表
description: 星から来たあなた、トッケビ、応答せよ1988、愛の不時着…名作ぞろいの2010年代の韓国ドラマを、AIが本気でランク付け。
category: entame
tags: [韓国ドラマ, 2010年代, 名作]
published: 2026-09-29
criteria: |
  ① 物語の完成度（最後まで失速しないか）
  ② 見終わったあとに心に残るか
  ③ これから見る人へのおすすめ度
  ※ 年は韓国での放送開始年
rank_notes:
  S: 韓ドラの最高到達点
  C: 良作だが、S〜Aが強すぎた
tiers:
  S:
    - name: 応答せよ1988（2015）
      emoji: "🏘️"
      reason: 1988年のソウルの路地で暮らす5つの家族の物語。恋の行方だけでなく、親子や友達の何気ない日常が泣けて笑える。「人生ドラマ」に挙げる人がとても多い一本。
    - name: トッケビ〜君がくれた愛しい日々〜（2016）
      emoji: "🕯️"
      reason: コン・ユ、キム・ゴウン、イ・ドンウク出演。900年以上生きるトッケビ（鬼）と、その花嫁の物語。映像・音楽・セリフの美しさがそろった、ファンタジーロマンスの最高峰。
    - name: 愛の不時着（2019）
      emoji: "🪂"
      reason: ヒョンビンとソン・イェジン主演。パラグライダー事故で北朝鮮に不時着した財閥令嬢と将校の恋。日本でも社会現象になり、韓ドラを見なかった層まで引き込んだ。
  A:
    - name: 星から来たあなた（2013）
      emoji: "⭐"
      reason: キム・スヒョンとチョン・ジヒョン主演。400年前に地球に来た宇宙人とトップ女優の恋。コメディとロマンスのバランスが絶妙で、アジア中で大ブームになった。
    - name: 私のおじさん〜My Mister〜（2018）
      emoji: "🌃"
      reason: IUとイ・ソンギュン主演。生きづらさを抱えた2人が、少しずつお互いを支えていく物語。派手さはないが、心にじわじわ染みる名作として評価が高い。
    - name: ミスター・サンシャイン（2018）
      emoji: "🎩"
      reason: イ・ビョンホンとキム・テリ主演。朝鮮末期を舞台にした壮大な物語で、映画のような映像美が圧倒的。重いテーマだが見応えは抜群。
    - name: 秘密の森（2017）
      emoji: "🌲"
      reason: チョ・スンウとペ・ドゥナ主演。感情を持たない検事が権力の闇に迫るサスペンス。伏線の張り方がうまく、韓国サスペンスのレベルの高さを示した。
  B:
    - name: 太陽の末裔 Love Under The Sun（2016）
      short: 太陽の末裔
      emoji: "🪖"
      reason: ソン・ジュンギとソン・ヘギョ主演。軍人と医師の恋を描き、韓国で大ヒット。名セリフが多く、華やかさは抜群だが、ストーリーは王道寄り。
    - name: キム秘書はいったい、なぜ?（2018）
      emoji: "👓"
      reason: パク・ソジュンとパク・ミニョン主演。ナルシストな副会長と有能な秘書のラブコメ。テンポが良く、ラブコメ入門にぴったり。
    - name: 椿の花咲く頃（2019）
      emoji: "🌺"
      reason: コン・ヒョジンとカン・ハヌル主演。小さな町のスナックを舞台に、恋・家族・事件が温かく描かれる。笑えて泣けて、町の人たちみんなが愛おしくなる。
  C:
    - name: 相続者たち（2013）
      emoji: "🎓"
      reason: イ・ミンホとパク・シネ主演。財閥の子供たちが通う高校の恋愛群像劇。豪華キャストで話題性は抜群だが、物語の新しさではA以上に届かなかった。
    - name: 成均館スキャンダル（2010）
      emoji: "📜"
      reason: パク・ミニョン、ユチョン、ソン・ジュンギ、ユ・アイン出演。男装ヒロインの時代劇青春もの。爽やかで楽しいが、2010年代の名作の中では控えめな評価に。
summary: |
  2010年代は、韓国ドラマが「アジアのブーム」から「世界の名作」に変わった時代。Sの3本はジャンルがバラバラなのに、どれも一生もの。
  この年代はBやCでも十分面白いのが強み。迷ったら、泣きたい日は応答せよ1988、ときめきたい日はトッケビか愛の不時着。
related: [kandrama-2000s, kandrama-2020s, kandrama-fantasy]
