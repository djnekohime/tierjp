title: 兵庫の百貨店 Tier表
description: 大丸神戸、神戸阪急、西宮阪急、阪神・御影、山陽百貨店、加古川ヤマトヤシキ…兵庫の百貨店を、AIが「街での存在感×立地×個性」でS〜Dにランク付け。
category: depart
tags:
- 旅行
- あるある
published: '2026-10-09'
labels:
  S: 街の顔
  A: 地域の主役
  B: ほどよく便利
  C: こぢんまり個性派
  D: 変化の途中
criteria: '① 街での存在感（その地域で「あの百貨店」と言われるか）

  ② 立地の便利さ（駅直結・中心街など）

  ③ その店ならではの個性

  ※ AIは全店を回ったわけではありません。日本百貨店協会の店舗一覧と、各社・百貨店の公開情報、AIの印象で並べています。ランクは売上順や店の良し悪しではなく、「街での存在感・立地・個性」の目立ち方です。百貨店は閉店・改装・運営会社の変更が多いので、お出かけ前に公式サイトで最新の営業状況を確認してください（2026年10月時点）'
rank_notes:
  S: ここに行けば、その街とわかる
  D: 縮小・閉店予定など、変化の途中
tiers:
  S:
  - name: 大丸神戸店
    emoji: ⚓
    reason: 三宮・元町地区の中心。売上高で神戸阪急を上回る地域一番店と紹介される。
  - name: 神戸阪急
    emoji: 🌉
    reason: 旧そごう神戸店。2019年10月に阪急百貨店に屋号を変更した。
  A:
  - name: 西宮阪急
    emoji: 🌸
    reason: 阪急西宮ガーデンズの核テナント。阪急百貨店の主要店舗のひとつ。
  - name: 阪神・御影
    emoji: 🏡
    reason: 神戸・御影の阪神百貨店。
  - name: あまがさき阪神
    emoji: 🛍️
    reason: 尼崎の駅前にある阪神百貨店。
  B:
  - name: 山陽百貨店（姫路）
    emoji: 🏯
    reason: 姫路駅前の百貨店。山陽電気鉄道の子会社で、日本百貨店協会加盟。
  - name: 阪神・にしのみや
    emoji: ⛩️
    reason: 西宮にある阪神百貨店。
  - name: 大丸芦屋店
    emoji: 🏘️
    reason: 芦屋の大丸。落ち着いた住宅街のお店。
  - name: 宝塚阪急
    emoji: 🎭
    reason: 宝塚駅前の阪急。
  C:
  - name: 加古川ヤマトヤシキ
    emoji: 🎈
    reason: 播磨地域の百貨店。ラオックスのグループ企業が運営。姫路店は2018年に閉店している。
  - name: 川西阪急
    emoji: 🌿
    reason: 川西能勢口駅前の阪急。
  - name: 大丸須磨店
    emoji: 🌊
    reason: 神戸市須磨区にある大丸。
  D: []
summary: '兵庫は、神戸・阪神間・播磨で、百貨店の色が変わる。神戸の中心は、大丸神戸店と神戸阪急。阪神間（西宮・尼崎・宝塚）は、阪急・阪神の百貨店が駅前に並ぶ。

  神戸阪急は、2019年にそごう神戸店から屋号を変えた店。'
related:
- depart-osaka
- depart-kyoto-shiga-nara-wakayama
