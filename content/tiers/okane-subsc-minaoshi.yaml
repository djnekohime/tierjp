title: サブスクの見直し Tier表
description: 使っていない動画配信、音楽、アプリの課金…サブスクの見直しを、AIが「節約効果×手間の少なさ×後悔しにくさ」でS〜Dにランク付け。
category: money
tags:
- お金
- 節約
- 固定費
published: '2026-10-09'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 節約効果の大きさ

  ② 手間の少なさ

  ③ 後悔しにくさ

  ※ 契約や投資の判断は、ご自身で、必要に応じて専門家にご相談ください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 契約しているサブスクを、全部書き出す
    emoji: 📋
    reason: 忘れているものが見つかることも。見直しの第一歩。
  - name: この3か月、使っていないものを解約
    emoji: ✂️
    reason: 効果が大きく、後悔しにくい。必要になったら再契約すればいい。
  A:
  - name: クレジットカード明細・アプリストアで確認
    emoji: 💳
    reason: 契約の見落としを防げる。
  - name: 年払いと月払いを比べる
    emoji: 📆
    reason: 年払いのほうが安いことも。使い続ける前提で。
  - name: 家族で共有できるプランを使う
    emoji: 👨‍👩‍👧
    reason: 1人あたりが安くなることも。規約で許される範囲で。
  B:
  - name: 無料期間のサービスは、解約日をカレンダーに入れる
    emoji: ⏰
    reason: うっかり課金を防げる。
  - name: 複数の動画配信を、順番に契約する
    emoji: 🔄
    reason: 必要なときだけ契約。見たい作品が終わったら解約。
  - name: 使う頻度が低いなら、安いプランに変更
    emoji: 📉
    reason: 解約まではしなくていい場合に。
  C:
  - name: 1つのサービスに絞る
    emoji: 🎯
    reason: 管理が楽。使い勝手がよく、満足度が高いものを。
  - name: ポイントやキャンペーンを活用
    emoji: 🎁
    reason: お得になる。条件を確認して。
  D:
  - name: 解約すると損な気がして、使わないまま継続
    emoji: 😣
    reason: 使っていないなら、実質ムダ。
  - name: 無料体験を、解約日を決めずに登録
    emoji: ⚠️
    reason: 気づかず課金されがち。
  - name: 「見る時間がない」のに、複数加入
    emoji: 📺
    reason: 時間が取れる時期に絞って契約。
summary: 'サブスクは、1つ1つは小さくても、積み重なると年間でかなりの金額に。S級は、まず「契約している全サービスを書き出す」こと。

  使っていないものは、解約を。解約しにくいと感じたら、契約した画面（アプリストアやクレジットカード明細）から確認できる。'
related:
- koteihi-minaoshi
- okane-kakeibo
- okane-point-katsuyo
