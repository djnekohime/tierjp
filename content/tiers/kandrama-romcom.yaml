title: 韓国ドラマ ラブコメ Tier表
description: キム秘書、社内お見合い、力の強い女ト・ボンスン…笑えてときめく韓国ラブコメを、AIが「ニヤニヤ度×笑い」でランク付け。
category: kanryu
tags: [韓国ドラマ, ラブコメ]
published: 2026-09-29
criteria: |
  ① ニヤニヤできるか（ときめきの量）
  ② ちゃんと笑えるか
  ③ 気軽に見始められるか（重すぎないか）
rank_notes:
  S: 疲れた日に見たい、ラブコメの頂点
tiers:
  S:
    - name: 社内お見合い（2022）
      emoji: "💼"
      reason: アン・ヒョソプとキム・セジョン主演。友達の代わりにお見合いに行ったら相手が自分の会社の社長だった、という王道設定。テンポ・笑い・ときめきが全部そろっていて、ラブコメ入門に最適。
    - name: 力の強い女ト・ボンスン（2017）
      emoji: "💪"
      reason: パク・ボヨンとパク・ヒョンシク主演。怪力を持つヒロインとゲーム会社社長のラブコメ。可愛さと笑いに事件のハラハラもあって、最後まで飽きない。
  A:
    - name: キム秘書はいったい、なぜ?（2018）
      emoji: "👓"
      reason: パク・ソジュンとパク・ミニョン主演。ナルシスト副会長の空回りが愛おしい。オフィスラブコメの定番中の定番。
    - name: 彼女はキレイだった（2015）
      emoji: "💄"
      reason: パク・ソジュンとファン・ジョンウム主演。初恋の相手と再会したら、自分だけ冴えない姿になっていた…という切なさと笑いのバランスが絶妙。
    - name: 私の名前はキム・サムスン（2005）
      emoji: "🍰"
      reason: キム・ソナとヒョンビン主演。等身大のヒロインがラブコメの型を変えた。古さはあるが、今見ても主人公に共感できる。
    - name: 'シークレット・ガーデン（2010）'
      emoji: "🌹"
      reason: 'ヒョンビンとハ・ジウォン主演。魂が入れ替わるファンタジーラブコメ。俺様御曹司の空回りが笑えて、ときめく。'
    - name: '海街チャチャチャ（2021）'
      emoji: "🏖️"
      reason: 'シン・ミナとキム・ソンホ主演。海辺の町の歯科医と「何でも屋」の恋。のんびりした町の空気と2人の掛け合いに癒やされる。'
  B:
    - name: コーヒープリンス1号店（2007）
      emoji: "☕"
      reason: ユン・ウネとコン・ユ主演。男装ヒロインとカフェの青春ラブコメ。おしゃれで爽やか、恋の悩み方がリアル。
    - name: 私のIDはカンナム美人（2018）
      emoji: "🪞"
      reason: イム・スヒャンとチャ・ウヌ主演。整形して大学に入ったヒロインの恋と成長。ラブコメだけでなく、見た目の悩みにも向き合っている。
    - name: 'サム、マイウェイ〜恋の一発逆転！〜（2017）'
      short: 'サム、マイウェイ'
      emoji: "🥊"
      reason: 'パク・ソジュンとキム・ジウォン主演。幼なじみ同士の恋と夢。等身大の2人の言い合いが楽しい。'
    - name: '恋のゴールドメダル〜僕が恋したキム・ボクジュ〜（2016）'
      short: '恋のゴールドメダル'
      emoji: "🏋️"
      reason: 'イ・ソンギョンとナム・ジュヒョク主演。重量挙げ選手の大学生の青春ラブコメ。爽やかでかわいい。'
    - name: 'ロマンスは別冊付録（2019）'
      emoji: "📚"
      reason: 'イ・ナヨンとイ・ジョンソク主演。出版社を舞台にした大人のラブコメ。落ち着いたときめきが心地いい。'
    - name: '知ってるワイフ（2018）'
      emoji: "💍"
      reason: 'チソンとハン・ジミン主演。過去に戻って別の人と結婚したら…という設定のラブコメ。笑えて、夫婦について考えさせられる。'
  C:
    - name: フルハウス（2004）
      emoji: "🏠"
      reason: ピ（RAIN）とソン・ヘギョ主演。契約結婚ラブコメの元祖的作品。ほのぼの楽しいが、今のテンポに慣れているとゆっくりに感じる。
    - name: '花より男子〜Boys Over Flowers（2009）'
      short: '花より男子'
      emoji: "🌸"
      reason: 'イ・ミンホとク・ヘソン主演。F4の華やかさは今も伝説だが、ラブコメとしてはベタな展開が多め。'
summary: |
  ラブコメの勝ち負けは「主人公2人の掛け合い」で決まる。Sの2本は、どのシーンを切り取っても2人のやり取りが楽しい。
  重い話に疲れたときはラブコメに限る。1話目で笑えたら、その作品はだいたい最後まで楽しめる。
related: [kandrama-junai, kandrama-2010s, kandrama-aruaru]
