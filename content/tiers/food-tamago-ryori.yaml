rank_notes:
  S: 卵料理の三大スター
  D: 通好み
tiers:
  S:
  - name: 卵焼き
    emoji: 🍳
    reason: 甘い卵焼き、しょっぱいだし巻き。お弁当の主役。
  - name: 目玉焼き
    emoji: 🥚
    reason: 朝ごはんの定番。トロッとした黄身が最高。
  - name: 卵かけご飯
    emoji: 🍚
    reason: ご飯に卵と醤油。シンプルだけど、日本の朝の幸せ。
  A:
  - name: オムレツ
    emoji: 🥞
    reason: ふわふわの卵に、チーズや野菜。洋食の定番。
  - name: スクランブルエッグ
    emoji: 🧈
    reason: バターの香りで、ふわっとやさしい味。
  - name: 茶碗蒸し
    emoji: 🍵
    reason: なめらかな口当たりと、だしの香り。ほっとする。
  - name: ゆで卵
    emoji: 🥚
    reason: 半熟でも固ゆででも。お弁当にも、サラダにも。
  - name: 温泉卵
    emoji: ♨️
    reason: とろっと半熟。うどんやご飯にのせて。
  B:
  - name: 親子丼
    emoji: 🐔
    reason: ふわとろの卵と鶏肉。ご飯が進む丼もの。
  - name: オムライス
    emoji: 🍅
    reason: ケチャップライスに、ふわふわの卵。子供も大人も好き。
  - name: エッグベネディクト
    emoji: 🍞
    reason: ポーチドエッグとハム、ソース。ホテルの朝食のような一皿。
  - name: 煮卵
    emoji: 🟤
    reason: ラーメンにのせる、味のしみた卵。
  C:
  - name: 卵サンド
    emoji: 🥪
    reason: ふわふわのたまごと、マヨネーズ。パンに合う。
  - name: 天津飯
    emoji: 🥢
    reason: ふわふわ卵に、甘酢あん。中華の定番。
  D:
  - name: スコッチエッグ
    emoji: 🧆
    reason: ゆで卵をひき肉で包んで揚げる。通好みのごちそう。
  - name: ピータン
    emoji: ⬛
    reason: 中国の黒い卵。独特な味で、好き嫌いが分かれる。
summary: '卵料理は、卵焼き・目玉焼き・卵かけご飯がS。毎日食べても飽きない、日本の食卓の定番。

  卵は、新鮮なものを選ぶのが大切。体調が悪いときは、生卵を避けると安心。

  '
