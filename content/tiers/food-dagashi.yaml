title: 駄菓子 Tier表
description: うまい棒系のスナック、きなこ棒、ヨーグルト味のカップ菓子、酢漬けいか、麩菓子、よっちゃんイカ系、ラムネ…駄菓子屋さんの定番を、AIが「懐かしさ×今でも食べたい度×コスパ」でランク付け。
category: food
genre: お菓子・スナック
tags: [グルメ, 昭和, レトロ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 子供のころの思い出がよみがえる懐かしさ
  ② 大人になった今でも食べたいか
  ③ 少ないお小遣いで買えるコスパ
  ※ 特定の商品ではなく「駄菓子の種類」のランキングです
rank_notes:
  S: 駄菓子屋さんの三大スター
  D: 知る人ぞ知る渋い駄菓子
tiers:
  S:
    - name: 棒状のコーンスナック（10円スナック）
      short: 10円スナック
      emoji: "🌽"
      reason: 細長いコーンスナックに、めんたい・チーズ・コンポタなど味の種類がずらり。安さと味のバリエーションで、駄菓子の王様。
    - name: ヨーグルト味のカップ菓子
      short: ヨーグルト菓子
      emoji: "🥄"
      reason: 小さなカップに入った甘酸っぱいクリームを、木のスプーンですくって食べる。あの小さなスプーンまで思い出。
    - name: 酢漬けのいか
      emoji: "🦑"
      reason: 甘酸っぱいたれに漬けた、くせになるいかの駄菓子。大人になるとお酒のおつまみにもなる。
  A:
    - name: きなこ棒
      emoji: "🟫"
      reason: きなこと黒蜜を固めた棒状のお菓子。当たりの印が出るともう一本もらえるドキドキ感。
    - name: 麩菓子
      emoji: "🥖"
      reason: 黒糖をまぶした大きな麩のお菓子。軽くて大きいのに安い、コスパの王様。
    - name: ラムネ菓子
      emoji: "🔵"
      reason: 口の中でシュワッと溶けるラムネ。容器がおもちゃになっているものもあった。
    - name: ソースせんべい
      emoji: "🟤"
      reason: 薄いせんべいにソースや梅ジャムをぬって食べる。紙芝居屋さんの時代から続く懐かしい味。
    - name: 餅系のお菓子（きなこ餅・串団子風）
      short: 餅系の駄菓子
      emoji: "🍡"
      reason: 小さな四角い餅にきなこをかけたものなど、つまようじで食べる駄菓子。当たりつきのものも多い。
  B:
    - name: 当たりつきのガム
      short: 当たりガム
      emoji: "🎯"
      reason: 小さなガムと、当たりが出たらもう一個の楽しみ。当たりが出たときの喜びは格別。
    - name: 串カツ風のスナック
      short: 串カツスナック
      emoji: "🍢"
      reason: ソース味の小麦粉のスナックを串に刺した、見た目も楽しい駄菓子。
    - name: 粉末ジュース
      emoji: "🧃"
      reason: 水に溶かしたり、そのままなめたりする粉末のジュース。舌の色が変わるのも楽しかった。
    - name: チョコ系の駄菓子
      emoji: "🍫"
      reason: 10円チョコや、ビスケットにチョコをかけたもの。駄菓子屋さんのチョコは特別な味がした。
    - name: 焼肉風のシート菓子
      emoji: "🥩"
      reason: 薄いシート状の、焼肉のたれ味の駄菓子。独特の味がくせになる。
  C:
    - name: 型抜き
      emoji: "🧩"
      reason: 砂糖の板から絵の形を針でくりぬく遊び菓子。成功すると景品がもらえることも。食べるより遊ぶ駄菓子。
    - name: ココアシガレット
      emoji: "🍬"
      reason: たばこのような形の、ハッカ入りのラムネ菓子。大人のまねができるのが楽しかった。
  D:
    - name: あんずボー
      emoji: "🧡"
      reason: あんずのシロップを棒状に凍らせて食べる、関東の駄菓子屋さんの夏の定番。知る人ぞ知る懐かしい味。
    - name: 梅ジャム
      emoji: "🟥"
      reason: ソースせんべいにぬる、甘酸っぱい梅のジャム。昭和の子供たちに愛された、今では見かけなくなった懐かしの味。
summary: |
  駄菓子の魅力は、少ないお小遣いで選ぶワクワク感。10円スナック・ヨーグルト菓子・酢漬けいかは、今でも大人が懐かしくて買ってしまう三大スター。
  当たりつきのきなこ棒やガム、型抜きのように、駄菓子屋さんは「食べる」と「遊ぶ」が一緒になった場所だった。
related: [showa-retro-items, food-choco-gashi]
