title: 韓国ドラマ サスペンス・復讐 Tier表
description: ザ・グローリー、秘密の森、シグナル、SKYキャッスル…止まらない韓国のサスペンス・復讐ドラマを、AIが「一気見度」でランク付け。
category: kanryu
tags: [韓国ドラマ, サスペンス, 復讐]
published: 2026-09-29
criteria: |
  ① 次の話が気になって止まらないか（一気見度）
  ② 伏線と結末の納得感
  ③ 見終わったあとのスッキリ感
rank_notes:
  S: 気づいたら朝になっている
tiers:
  S:
    - name: シグナル（2016）
      emoji: "📻"
      reason: イ・ジェフン、キム・ヘス、チョ・ジヌン出演。過去の刑事と無線機でつながり、未解決事件に挑む。実際の事件をもとにした重厚さと、時間を越える仕掛けの面白さが両立した名作。
    - name: ザ・グローリー〜輝かしき復讐〜（2022）
      emoji: "♟️"
      reason: ソン・ヘギョ主演。何年もかけて準備した復讐が、静かに確実に進んでいく。緊張感が最後まで途切れない。
  A:
    - name: 秘密の森（2017）
      emoji: "🌲"
      reason: チョ・スンウとペ・ドゥナ主演。検事と刑事が権力の闇に迫る。セリフのひとつひとつが伏線になっている、サスペンス好きのための作品。
    - name: SKYキャッスル〜上流階級の妻たち〜（2018）
      emoji: "🏰"
      reason: 子供を名門大学に入れるためなら何でもする親たちの物語。ブラックユーモアとサスペンスが混ざった独特の面白さで、韓国で社会現象になった。
    - name: ヴィンチェンツォ（2021）
      emoji: "🍷"
      reason: ソン・ジュンギ主演。イタリアマフィアの弁護士が悪徳企業に立ち向かう。痛快さとコメディが強く、復讐ものなのに楽しく見られる。
    - name: '悪の花（2020）'
      emoji: "🌼"
      reason: 'イ・ジュンギとムン・チェウォン主演。愛する夫が殺人犯かもしれない——。夫婦の愛とサスペンスが見事に絡み合う。'
    - name: '未成年裁判（2022）'
      emoji: "⚖️"
      reason: 'キム・ヘス主演のNetflixシリーズ。少年犯罪を裁く判事の物語。重いテーマを真正面から描き、考えさせられる。'
  B:
    - name: 財閥家の末息子（2022）
      emoji: "💼"
      reason: ソン・ジュンギ主演。財閥の末息子に生まれ変わった男の復讐。途中までは最高に面白いが、結末の評価が割れたのでB。
    - name: 模範タクシー（2021）
      emoji: "🚕"
      reason: イ・ジェフン主演。法で裁けない悪人に、タクシー会社が代わりに復讐する。1話ごとにスカッとできる勧善懲悪もの。
    - name: 'ボイス（2017）'
      emoji: "📞"
      reason: 'イ・ハナとチャン・ヒョク主演。通報センターを舞台に、事件の「声」から犯人を追う。スピード感のある犯罪サスペンス。'
    - name: 'マウス（2021）'
      emoji: "🐭"
      reason: 'イ・スンギ主演。連続殺人犯をめぐる衝撃の展開が続くサイコスリラー。予想を裏切るどんでん返しが魅力。'
    - name: 'D.P. -脱走兵追跡官-（2021）'
      short: 'D.P.'
      emoji: "🎖️"
      reason: 'チョン・ヘイン主演のNetflixシリーズ。軍隊の脱走兵を追う兵士の物語。軍の中の暴力という重い現実を描いた。'
  C:
    - name: ペントハウス（2020）
      emoji: "🏙️"
      reason: 超高級マンションを舞台にした、欲望と復讐のドラマ。展開の激しさは韓ドラ随一で、ツッコミながら見るのは楽しいが、納得感は低め。
    - name: 'ブラッドハウンド（2023）'
      emoji: "🥊"
      reason: 'ウ・ドファン主演のNetflixシリーズ。ボクサーの青年たちが悪徳金融に立ち向かう。アクションは爽快だが、物語はシンプル。'
    - name: 'トンネル（2017）'
      emoji: "🚇"
      reason: 'チェ・ジニョク主演。1986年の刑事が現代へタイムスリップし、連続殺人事件を追う。設定は面白いが、同じタイプのシグナルが強すぎた。'
summary: |
  サスペンスの評価は「最後に納得できるか」で決まる。シグナルとザ・グローリーは、最後まで見た人が「見てよかった」と言える作品。
  スカッとしたい日はヴィンチェンツォや模範タクシー、頭を使いたい日は秘密の森と、気分で選ぶのがおすすめ。
related: [kandrama-2020s, kandrama-human]
