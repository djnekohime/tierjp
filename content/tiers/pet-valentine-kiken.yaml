title: バレンタインにペットが危ないもの Tier表
description: チョコレート、ココア、キシリトール、ナッツ、洋酒入りのお菓子、ラッピング、花束…バレンタインにペットが危ないものを「危険度・起こりやすさ」でS〜Dにランク付け。置きっぱなしのプレゼントに、ご注意。
category: animals
tags: [ペット, 犬, 猫]
published: 2026-10-05
labels:
  S: 命に関わる
  A: 要注意
  B: 気をつけたい
  C: 心がけたい
  D: 小さな落とし穴
criteria: |
  ① 命や健康への危険度
  ② 起こりやすさ（バレンタインならではか）
  ③ 飼い主が防ぎやすいか
  ※ 一般的な注意点の整理です。ペットの種類・体重・体調で、影響は変わります。獣医さんの助言ではなく目安です。食べてしまったときは、食べたものと量、時間を伝えて、すぐに動物病院に相談してください
rank_notes:
  S: 絶対に届かない所へ
  D: 気をつけたい小さなこと
tiers:
  S:
    - name: チョコレート（ミルク・ビター・カカオ多め）
      short: チョコレート
      emoji: "🍫"
      reason: 犬や猫に、中毒を起こす成分が入っている。特に、カカオが多いものは、危険。少量でも、体の小さい子は、危ない。
    - name: ココア・チョコ入りの飲み物や、焼き菓子
      short: ココア・焼き菓子
      emoji: "☕"
      reason: ココアパウダーや、チョコ入りのクッキー・ケーキにも、同じ成分がある。見た目で、わかりにくい。
    - name: キシリトール入りのガム・お菓子
      short: キシリトール
      emoji: "🍬"
      reason: 犬に、低血糖や、肝臓の障害を起こすことがある。バッグの中身にも、注意する。
  A:
    - name: 洋酒入りのチョコ・ボンボン
      short: 洋酒入りチョコ
      emoji: "🥃"
      reason: チョコと、アルコールの、両方の危険がある。少量でも、避ける。
    - name: マカダミアナッツ・ナッツ入りのチョコ
      short: ナッツ入り
      emoji: "🥜"
      reason: 犬に、体調不良を起こすことがある。ナッツは、そのほかにも、のどに詰まる危険がある。
    - name: ぶどう・レーズン入りのお菓子
      short: レーズン入り
      emoji: "🍇"
      reason: 犬で、腎臓の障害の報告がある。少量でも与えない。
    - name: 箱ごと置きっぱなしのプレゼント
      short: 置きっぱなしのチョコ
      emoji: "🎁"
      reason: 袋ごと、かじって食べてしまう事故が多い。もらったら、高い棚や、ふたつきの場所へ。
  B:
    - name: ラッピング（リボン・ひも・セロファン・包み紙）
      short: ラッピング材
      emoji: "🎀"
      reason: 飲み込むと、腸に詰まることがある。開けたら、すぐ片づける。
    - name: 乾燥剤・保冷剤・箱の中の緩衝材
      short: 乾燥剤・保冷剤
      emoji: "🧊"
      reason: 中身を舐めたり、誤飲したりする。小さな袋ものは、ごみ箱にふたを。
    - name: 生クリーム・脂っこい手作りお菓子
      short: 脂の多いお菓子
      emoji: "🧁"
      reason: 脂肪が多すぎると、膵炎や下痢の原因になることがある。ペットに、おすそ分けしない。
  C:
    - name: 花束・バラのとげ・花の種類
      short: 花束
      emoji: "💐"
      reason: ユリは、猫に危険。とげで、ケガをすることも。ペットが、届かない所へ飾る。
    - name: 手作りチョコの、型・道具の片づけ
      short: 型・道具の片づけ
      emoji: "🥄"
      reason: 溶けたチョコがついた道具を、舐めてしまうことがある。洗うまで、台の上に置かない。
    - name: 'チョコの食べこぼし・包み紙のにおいがついたごみ'
      emoji: "🗑️"
      reason: 'ごみ箱をあさって、包み紙や、食べ残しを口にすることがある。ふた付きのごみ箱に、入れる。'
  D:
    - name: 来客や、持ち帰ったバッグの中身
      short: バッグの中身
      emoji: "👜"
      reason: 床に置いたバッグを、あさられる。お菓子や、ガムが入っていることがある。
    - name: ペットにも、チョコ風のおやつをあげたくなる気持ち
      short: チョコ風おやつ
      emoji: "🐶"
      reason: ペット用の「キャロブ」などの、チョコ風のおやつを選べば、安心。人間用は、あげない。
summary: |
  Sは、「チョコレート」「ココア・焼き菓子」「キシリトール」。バレンタインは、チョコが家に増える時期なので、置き場所が、いちばんの対策。
  食べてしまったときは、食べたもの・量・時間を、すぐに動物病院へ伝えよう。ペットには、ペット用のおやつで、一緒にお祝いしよう。
related: [pet-xmas-kiken, pet-halloween-kiken, pet-oshogatsu-kiken]
