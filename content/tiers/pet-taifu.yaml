title: 台風・水害のときのペットの備え Tier表
description: ハザードマップの確認、早めの避難、キャリー・ケージ、ごはんと水、薬・ワクチン記録、ペット同行の避難先、停電・浸水への備え、窓の対策…台風・水害に備えたペットの準備を「大事さ・早めにやる度」でS〜Dにランク付け。
category: animals
tags: [ペット, 犬, 猫, 防災]
published: 2026-10-05
labels:
  S: 必ず備える
  A: 早めに備える
  B: できれば
  C: 余裕があれば
  D: やってはいけない
criteria: |
  ① ペットと飼い主の命を守る大きさ
  ② 台風・水害ならではの重要さ（浸水・停電・早めの避難）
  ③ 直前でも間に合うか
  ※ 一般的な注意点の整理です。避難の情報や、避難所のルールは、自治体ごとに違います。お住まいの地域のハザードマップと、自治体の案内を確認してください。環境省の「同行避難」の考え方を参考にしています。獣医さんの助言ではなく目安です
rank_notes:
  S: 台風シーズンの前に、確認する
  D: 命に関わる危険がある
tiers:
  S:
    - name: ハザードマップで、自宅の浸水・土砂災害の危険を確認する
      short: ハザードマップ確認
      emoji: "🗺️"
      reason: 自宅が、どんな危険にあるかで、避難の判断が変わる。ペットと一緒に避難できる場所も、あわせて調べる。
    - name: 避難が必要なときは、暗くなる前・早めに、ペットと一緒に動く
      short: 早めの避難
      emoji: "🏃"
      reason: 水が増えてからでは、動けなくなる。台風や大雨の情報で、早めに判断する。
    - name: キャリー・ケージに慣らしておく
      short: キャリーに慣らす
      emoji: "🧳"
      reason: 避難のとき、安全に運べる。ふだんから、中で落ち着ける練習をしておく。
  A:
    - name: ペットのごはん・水・薬を、数日分用意する
      short: ごはん・水・薬
      emoji: "🥣"
      reason: 避難生活が、長引くことがある。数日分を、すぐ持ち出せる場所に置く。
    - name: ペットの、ワクチン証明・健康記録・写真のコピーを用意する
      short: 健康記録・写真
      emoji: "📄"
      reason: 避難先で、求められることがある。迷子になったときの、手がかりにもなる。
    - name: 迷子札・マイクロチップの登録情報を確認する
      short: 迷子対策
      emoji: "🏷️"
      reason: 避難中に、はぐれることもある。連絡先が、最新か、確認する。
    - name: ペット同行できる避難先・預け先を、事前に複数調べる
      short: 避難先の確認
      emoji: "🏫"
      reason: 避難所のルールや、受け入れ方法は、地域で違う。親戚・友人・ペットホテルも、候補に入れる。
    - name: 停電・断水に備える（ライト・予備の水・暑さ寒さ対策）
      short: 停電・断水の備え
      emoji: "🔦"
      reason: 台風のあとは、停電が長引くことがある。暑さ寒さ対策グッズも、用意する。
  B:
    - name: 窓・ベランダ・ドアの対策（飛来物・雨風・脱走）
      short: 窓・ドアの対策
      emoji: "🪟"
      reason: 割れた窓から、ペットが逃げることがある。ペットは、窓から離れた部屋にいてもらう。
    - name: ペットの居場所を、浸水しにくい場所（2階など）に移す
      short: 浸水しにくい場所へ
      emoji: "🏠"
      reason: 家の中に残る場合の、備え。ただし、避難が必要なときは、一緒に避難する。
    - name: トイレ用品・ごみ袋・ウェットシートの用意
      short: トイレ用品
      emoji: "🧻"
      reason: 避難先でも、衛生を保てる。猫砂は、小分けにしておくと、持ち出しやすい。
    - name: 台風の前に、ペットの健康・ストレスをチェックする
      short: 体調チェック
      emoji: "🩺"
      reason: 災害時は、体調をくずしやすい。気圧や、音にも、敏感な子がいる。
  C:
    - name: ペット用の避難リュック・防災セットを、用意する
      short: 避難セット
      emoji: "🎒"
      reason: すぐに持ち出せる。中身は、定期的に、見直して、期限を確認する。
    - name: ペット保険・災害時の補償の確認
      short: 保険の確認
      emoji: "🛡️"
      reason: 災害時に、使える補償がある場合も。内容は、契約ごとに違うので、確認する。
  D:
    - name: ペットを、家に置いて避難する・放置する
      short: 置いていく
      emoji: "🚫"
      reason: 命が危険になる。環境省は、ペットとの同行避難を、基本としている。
    - name: 増水した川・用水路・道路を、様子を見に行く
      short: 様子を見に行く
      emoji: "🌊"
      reason: 命に関わる。ペットの散歩でも、近づかない。
    - name: 「うちは大丈夫」と、準備せずに、直前まで待つ
      short: 直前まで待つ
      emoji: "⏳"
      reason: 暗くなったり、道が冠水したりすると、動けなくなる。早めの準備が、いちばんの安全。
summary: |
  Sは、「ハザードマップの確認」「早めの避難」「キャリーに慣らす」。台風や水害は、予報があるので、早めに動けば、ペットも自分も守れる。
  ペット同行の避難先は、地域ごとに違う。台風シーズンの前に、自治体の情報と、預け先の候補を、確認しておこう。
related: [pet-bousai-goods, pet-bousai-hinan, pet-bousai-shitsuke]
