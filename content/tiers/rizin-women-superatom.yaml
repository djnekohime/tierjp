      reason: '柔道のオリンピックメダリスト。2026年4月の福岡大会でレジェンド浜崎朱加を1ラウンド腕十字で下し、9月の超RIZIN.5ではRENAをギロチンチョークで一本。「チャンピオンになります」と王座獲りを宣言した。'
  A:
    - name: パク・シウ
      emoji: "🐝"
      reason: '韓国の選手で、テコンドー仕込みの打撃が武器。2026年7月の広島大会で須田萌里に判定勝ちし、王座戦線に残った。大島沙緒里との3度目の対決も期待される。'
