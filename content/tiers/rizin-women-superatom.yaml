      reason: '寝技の名手で、複数の団体でベルトを巻いてきた実力者。2026年7月の広島大会でイ・イェジにヒザ十字固めで約100秒の一本勝ちを収め、リベンジと同時に大晦日の王座決定戦へ大きく前進した。'
    - name: ナターシャ・クジュティナ
