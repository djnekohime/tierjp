    - name: イ・イェジ
      emoji: "🐯"
      reason: '韓国の選手。一度は大島沙緒里に勝った実績を持つが、2026年7月の再戦では一本負けを喫した。'
    - name: 須田萌里
      emoji: "🦂"
      reason: 'ブラジリアン柔術を得意とする若手。2026年7月にパク・シウに判定で敗れたが、タックルで苦しめる健闘を見せた。'
    - name: 浜崎朱加
      emoji: "🏆"
      reason: 'RIZINの王座を2度獲得し、アメリカのInvicta FCでもベルトを巻いたレジェンド。2026年4月の福岡大会でクジュティナに一本負けし、DEEP JEWELSで再起を図る。'
  C:
    - name: 万智
      emoji: "🌸"
      reason: '寝技が得意な若手で、タイトルを獲得した実績もある成長株。上位陣との対戦が待たれる。'
    - name: クレア・ロペス
      emoji: "🥐"
