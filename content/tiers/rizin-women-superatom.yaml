    - name: 彩綺
      emoji: "✨"
      reason: 'DEEP JEWELSで経験を積む選手。パク・シウとの対戦が組まれるなど、上位との戦いに挑んでいる。'
    - name: ののか
      emoji: "🌼"
      reason: 'DEEP JEWELSで戦う若手。元パンクラス王者の重田ホノカとの対戦が組まれ、次の世代を担う存在として注目される。'
summary: |
  女王・伊澤星花が産休で王座を返上し、女子スーパーアトム級は一気に群雄割拠へ。RIZINは4試合の「見えないトーナメント」の内容を見て、大晦日の王座決定戦の2人を選ぶ。
  リードしているのは、約100秒の一本勝ちを見せた大島沙緒里と、RENAを下したクジュティナ。10月の長崎大会でのケイト・ロータスvs.NOELの結果も、大晦日のカードを左右する。
  ※ 選手の状況（引退・階級変更・移籍など）は変わることがあります。最新情報はRIZIN公式サイトで確認してください。
