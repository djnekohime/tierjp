title: ご飯にワンバウンドさせたいおかず Tier表
description: 焼肉、しょうが焼き、うなぎ、すき焼きの肉、麻婆豆腐、焼き鳥、ハンバーグ…一度白いご飯にのせてから食べたいおかずを、AIが「ワンバウンドの幸せ度×たれがしみたご飯のおいしさ」でランク付け。
category: food
genre: 食べ方・食のあるある
tags: [グルメ, あるある]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① ご飯にワンバウンドさせたくなる度
  ② たれやソースがしみた白いご飯のおいしさ
  ③ ご飯がどれだけ進むか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: ワンバウンドのために生まれたおかず
tiers:
  S:
    - name: 焼肉
      emoji: "🥩"
      reason: たれをまとった焼肉を、一度ご飯にのせてから口へ。ご飯についたたれのしみた部分こそが、焼肉の一番のごちそう。
    - name: すき焼きの牛肉
      short: すき焼き
      emoji: "🥘"
      reason: 溶き卵にくぐらせた牛肉を、ご飯にワンバウンド。甘辛い割り下と卵がご飯にしみて、たまらない。
    - name: うなぎの蒲焼き
      short: うなぎ
      emoji: "🐍"
      reason: 甘いたれのしみたご飯は、うな丼の主役ともいえる。ワンバウンドさせたくなる、たれの王様。
  A:
    - name: 豚のしょうが焼き
      short: しょうが焼き
      emoji: "🐖"
      reason: しょうがじょうゆのたれとご飯の相性は抜群。定食屋さんの定番。
    - name: ハンバーグ
      emoji: "🍖"
      reason: デミグラスソースや和風おろしソースを、ご飯にちょっとつけて。
    - name: 焼き鳥（たれ）
      short: 焼き鳥
      emoji: "🍢"
      reason: 甘辛いたれの焼き鳥を、ご飯にのせて一口。焼き鳥丼にしたくなる。
    - name: 麻婆豆腐
      emoji: "🌶️"
      reason: ピリ辛のとろみがご飯にからむ。ワンバウンドというより、ご飯にかけたくなる。
    - name: 豚キムチ
      emoji: "🥬"
      reason: キムチの汁がしみたご飯は、それだけでおかずになる。
  B:
    - name: 照り焼きチキン
      emoji: "🐔"
      reason: 甘辛い照り焼きのたれがご飯にぴったり。
    - name: 牛丼の具
      emoji: "🍚"
      reason: 甘辛い牛肉と玉ねぎ。つゆだくにすれば、ご飯までしみしみ。
    - name: エビチリ
      emoji: "🦐"
      reason: 甘辛いチリソースがご飯によく合う中華のおかず。
    - name: 回鍋肉
      emoji: "🥬"
      reason: 甘味噌のたれでご飯がどんどん進む。
    - name: 鶏の唐揚げ（甘酢あん）
      short: 甘酢唐揚げ
      emoji: "🍗"
      reason: 甘酢のあんをまとった唐揚げは、ご飯にのせたくなる。
  C:
    - name: 煮魚
      emoji: "🐟"
      reason: 甘辛い煮汁をご飯にかけて食べる人も。骨に注意しながら。
    - name: 餃子（たれ）
      short: 餃子
      emoji: "🥟"
      reason: 酢じょうゆとラー油をつけた餃子を、ご飯に一度のせて。好みは分かれる。
  D:
    - name: 目玉焼き（しょうゆ）
      short: 目玉焼き
      emoji: "🍳"
      reason: 半熟の黄身としょうゆをご飯にのせる、シンプルな朝のワンバウンド。
    - name: 刺身
      emoji: "🍣"
      reason: しょうゆをつけた刺身を、ご飯にワンバウンドさせる食べ方。海鮮丼気分が味わえる、通の技。
summary: |
  ご飯にワンバウンドさせたいおかずは、焼肉・すき焼き・うなぎがS。たれやソースがしみた白いご飯こそが、実は一番のごちそう。
  「ワンバウンド」は、日本の白いご飯文化が生んだ、小さな幸せの食べ方。あなたは何をワンバウンドさせる？
related: [food-yakiniku-bui, food-don, food-gohan-otomo]
