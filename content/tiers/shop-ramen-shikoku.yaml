summary: |
  四国のラーメンは、茶色いスープに甘辛い豚バラ肉と生卵をのせる「徳島ラーメン」が代表格。高知・須崎の土鍋で出てくる「鍋焼きラーメン」も有名。
  うどん県・香川にも、百名店に選ばれたはまんどをはじめ、ラーメンの名店がちゃんとある。
  ※ AIは実際に食べていません。参考：食べログ ラーメン 各県 評価順（2026年9月30日時点）、食べログ ラーメン百名店（2021〜2025）。
