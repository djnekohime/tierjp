criteria: |
  ① 札幌市（または札幌の玄関口の駅・空港）で、味噌ラーメンが看板の店であること（全店共通）
  ② 歴史と影響力（発祥の店か、「純すみ系」などの流れを作ったか）
  ③ 人気ランキングや紹介記事などでの評判
  ※ AIは実際に食べることはできません。ランクは公開されている実績と評判にもとづく判断で、お店の味の良し悪しではありません
  ※ 同じ店が「ラーメンの名店【北海道】」にも出てきます。こちらは札幌の「味噌」だけに絞ったTier表です
  ※ 営業時間・定休日・営業状況は変わることがあります。お出かけ前に公式情報などで確認してください
rank_notes:
  S: 札幌味噌ラーメンの歴史そのもの
