  '
rank_notes:
  S: 食卓の三大スター
  D: 通好み
tiers:
  S:
  - name: ウインナー
    emoji: 🌭
    reason: 朝ごはんにも、お弁当にも。パリッとした皮の食感が楽しい。
  - name: ベーコン
    emoji: 🥓
    reason: カリカリに焼いて、卵と一緒に。香ばしさが最高。
  - name: ロースハム
    emoji: 🍖
    reason: サンドイッチにも、サラダにも。万能のハム。
  A:
  - name: 粗挽きソーセージ
    emoji: 🔥
    reason: お肉の食感が強く、ビールのおともに最高。
  - name: 生ハム
    emoji: 🌸
    reason: とろけるような口当たり。メロンと合わせても。
  - name: フランクフルト
    emoji: 🌭
    reason: お祭りやバーベキューの定番。ケチャップとマスタードで。
  - name: サラミ
    emoji: 🧂
    reason: ワインやビールのおつまみに。
  - name: チョリソー
    emoji: 🌶️
    reason: ピリ辛で、パンチがある。
  B:
  - name: ポークビッツ
    emoji: 🤏
    reason: 小さくて、お弁当にぴったり。
  - name: ボンレスハム
    emoji: 🥩
    reason: しっとりやわらかい、昔ながらのハム。
  - name: ボロニアソーセージ
    emoji: 🔵
    reason: 大きくて、厚切りにして食べる。
  - name: ブラートヴルスト
    short: ドイツソーセージ
    emoji: 🌭
    reason: ドイツの白いソーセージ。ザワークラウトと一緒に。
  C:
  - name: 魚肉ソーセージ
    emoji: 🐟
    reason: 子供のころのおやつ。大人になると少し懐かしい。
  - name: ランチョンミート
    emoji: 🥫
    reason: 沖縄の定番。チャンプルーやおにぎりに。
  D:
  - name: レバーソーセージ
    emoji: 🟤
    reason: 独特のコクがある、通好みのソーセージ。
  - name: ブラッドソーセージ
    emoji: ⚫
    reason: ヨーロッパの、血を使ったソーセージ。好きな人は大好き。
summary: 'ソーセージ・ハムは、ウインナー・ベーコン・ロースハムがS。朝ごはんにも、お弁当にも、毎日使える。

  粗挽きソーセージや生ハムのような、ちょっとぜいたくなものも、ビールやワインに合う。

  '
