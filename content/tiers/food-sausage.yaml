published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① おいしさ

  ② お弁当や朝食、おつまみでの使いやすさ

  ③ 「また食べたい」と思う度

