title: ソーセージ・ハムの種類 Tier表
description: ウインナー、ポークビッツ、フランクフルト、ボロニアソーセージ、ロースハム、生ハム、ベーコン、サラミ、粗挽きソーセージ、ボンレスハム、チョリソー…ソーセージとハムの種類を、AIが「おいしさ×使いやすさ×また食べたい度」でランク付け。
