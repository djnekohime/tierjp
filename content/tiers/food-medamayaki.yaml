title: 目玉焼きにかけるもの Tier表
description: 醤油、ソース、塩コショウ、ケチャップ、マヨネーズ、塩、七味、ポン酢、バター醤油、マスタード、なにもかけない…目玉焼きにかけるものを、AIが「おいしさ×論争が起きる度」でランク付け。
category: food
genre: パン・朝食
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 目玉焼きがおいしくなるか

  ② ご飯やパンとの相性

  ③ 家族で意見が割れる度

  ※ 「醤油派」「ソース派」「塩コショウ派」の永遠の論争です

  '
rank_notes:
  S: 目玉焼き戦争の三大勢力
  D: 通好み
tiers:
  S:
  - name: 醤油
    emoji: 🟤
    reason: 日本の朝ごはんの定番。白いご飯と、半熟の黄身との相性は最高。
  - name: 塩コショウ
    emoji: 🧂
    reason: シンプルに、卵の味を楽しむ。トーストにのせて食べるときの定番。
  - name: ソース
    emoji: 🟫
    reason: ウスターソースやとんかつソース。西日本に多いと言われる、濃い味派。
  A:
  - name: ケチャップ
    emoji: 🍅
    reason: 子供のころの味。オムレツ感覚で食べる。
  - name: マヨネーズ
    emoji: 🥚
    reason: まろやかで、トーストに合う。
  - name: バター醤油
    emoji: 🧈
    reason: バターをのせて、醤油をたらす。ご飯に合う、リッチな食べ方。
  - name: 塩
    emoji: ⚪
    reason: シンプルな味つけ。卵の甘みがよくわかる。
  B:
  - name: ポン酢
    emoji: 🍊
    reason: さっぱり。大根おろしを添えても。
  - name: 七味・唐辛子
    emoji: 🌶️
    reason: ピリッとアクセント。朝から目が覚める。
  - name: マスタード
    emoji: 🟨
    reason: 洋風にするなら。ソーセージと一緒に。
  - name: めんつゆ
    emoji: 🥣
    reason: だしの香りで、おだやかな味。
  C:
  - name: 砂糖
    emoji: 🍬
    reason: 甘い卵焼き派がたどりつく、甘い目玉焼き。好みが分かれる。
  - name: ごま油と塩
    emoji: 🫗
    reason: 中華風にするなら。ご飯と合わせて。
  D:
  - name: なにもかけない
    short: なにもかけない
    emoji: ✨
    reason: 卵そのものの味を楽しむ、通の食べ方。
  - name: オイスターソース
    emoji: 🦪
    reason: コクとうまみがたっぷり。通の人が好む。
summary: '目玉焼きは、醤油・塩コショウ・ソースがS。三大勢力で、家族の中でも意見が割れる永遠のテーマ。

  ご飯なら醤油、トーストなら塩コショウ、というように、組み合わせで変えるのもおすすめ。

  '
