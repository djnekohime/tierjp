title: すき焼きの具 Tier表
description: 牛肉、焼き豆腐、白菜、ねぎ、しいたけ、しらたき…すき焼きの具を、AIが「おいしさ×割り下との相性×満足感」でS〜Dにランク付け。
category: food
genre: 鍋・季節の食べ物
tags:
- グルメ
published: '2026-10-07'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 割り下がしみたときのおいしさ

  ② すき焼きらしさ（これがないと始まらない度）

  ③ 満足感

  ※ 関東は割り下で煮る、関西は肉を焼いてから味つけするなど、地域で作り方が違います'
rank_notes:
  S: ないとすき焼きにならない
  D: 好みが分かれる・変わり種
tiers:
  S:
  - name: 牛肉
    emoji: 🥩
    reason: すき焼きの主役。割り下と脂の甘みが合わさって、溶き卵にくぐらせると格別。
  - name: 焼き豆腐
    emoji: ⬜
    reason: 割り下をたっぷり吸い、煮崩れしにくい。肉のあとに食べるとほっとする味。
  - name: ねぎ
    emoji: 🌱
    reason: 甘みが出て、肉の脂とよく合う。すき焼きに欠かせない。
  A:
  - name: しらたき
    emoji: 🍜
    reason: 味がしみ、つるっとした食感。肉と一緒に煮ると、肉が固くなると言われるので、離して入れる人も。
  - name: しいたけ
    emoji: 🍄
    reason: 旨みが出て、割り下がおいしくなる。軸の石づきを取って入れる。
  - name: 春菊
    emoji: 🌿
    reason: 独特の香りが、肉の脂をさっぱりさせる。火を通しすぎないのがコツ。
  - name: 溶き卵（つけ）
    emoji: 🥚
    reason: 熱い肉を冷まし、まろやかにする。厳密には具ではないが、欠かせない相棒。
  B:
  - name: 白菜
    emoji: 🥬
    reason: 甘みが出て、水分もたっぷり。入れすぎると味が薄まる。
  - name: 麩（車麩）
    emoji: 🍘
    reason: 割り下を吸うと、じゅわっとおいしい。好きな人は麩目当てで食べる。
  - name: えのきだけ
    emoji: 🍄
    reason: 手軽で、シャキシャキ。割り下が絡みやすい。
  - name: にんじん
    emoji: 🥕
    reason: 彩りよく、甘みが出る。花形にすると見た目が華やか。
  C:
  - name: 玉ねぎ
    emoji: 🧅
    reason: 甘みが出て、肉との相性がよい。関西風では入れる人が多い。
  - name: ごぼう
    emoji: 🌱
    reason: ささがきにして入れると、香りが出る。好みが分かれる具。
  - name: うどん（締め）
    emoji: 🍜
    reason: 具材の旨みが出た割り下で食べる締めの定番。最後のお楽しみ。
  D:
  - name: じゃがいも
    emoji: 🥔
    reason: ほくほくだが、煮崩れて汁が濁りやすい。好みが分かれる。
  - name: トマト
    emoji: 🍅
    reason: 変わり種アレンジ。酸味と旨みが加わる。
  - name: チーズ
    emoji: 🧀
    reason: 濃厚になる、アレンジ系。割り下との相性は好みが分かれる。
summary: 'すき焼きは、肉・豆腐・ねぎ・しらたきの「4大具材」が、S〜A級の中心。割り下を吸った具を、溶き卵にくぐらせて食べるのがたまらない。

  野菜は、水分が出る白菜や春菊を入れすぎると、味がぼやけやすい。最後は、うどんで締めるのが定番。'
related:
- food-nabe-aji
- food-nabe-yasai
- food-shabu-gu
