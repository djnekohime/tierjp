title: 食べ方でもめる料理 Tier表
description: 目玉焼きの調味料、たけのこの里、酢豚のパイナップル、カレーうどんの汁、お好み焼きとご飯、味噌汁の具、お雑煮の味、ラーメンのスープ、ご飯とお米、うな重のタレ、寿司の食べ方、ハンバーグのソース…食べ方でもめる料理を、AIが「もめる度」でランク付け。
category: food
genre: 食べ方・食のあるある
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 家族や友達で意見が割れるか

  ② 「うちはこう」が強いか

  ③ 議論が盛り上がる度

  ※ 正解はありません。ランクは「もめる度」の目安です。仲よく食べましょう

  '
rank_notes:
  S: 戦争になる三大料理
  D: ほぼ平和
tiers:
  S:
  - name: 目玉焼きにかけるもの
    emoji: 🍳
    reason: 醤油派、ソース派、塩コショウ派。永遠の論争。
  - name: 酢豚のパイナップル
    emoji: 🍍
    reason: 入れる派と入れない派。パイナップルが入っているだけで、大論争。
  - name: お雑煮の味
    emoji: 🎍
    reason: 白味噌、すまし、小豆。家ごとに、地域ごとに、全部ちがう。
  A:
  - name: カレーのじゃがいも
    emoji: 🥔
    reason: 入れる派、入れない派、溶かす派。
  - name: カレーライスの食べ方
    emoji: 🍛
    reason: ルウとご飯を混ぜる派と、混ぜない派。
  - name: お好み焼き定食
    emoji: 🥞
    reason: ご飯と合わせるか、そのまま食べるか。
  - name: ラーメンのスープ
    emoji: 🍜
    reason: 飲み干す派と、残す派。
  - name: 寿司のわさび
    emoji: 💚
    reason: ネタにのせる派と、醤油に溶く派。
  B:
  - name: 味噌汁の具
    emoji: 🍲
    reason: 豆腐とわかめ？ 大根と油揚げ？ 家の味が出る。
  - name: おでんの具
    emoji: 🍢
    reason: 大根？ ちくわぶ？ 地域によってちがう。
  - name: ハンバーグのソース
    emoji: 🍔
    reason: デミグラス？ 和風？ ケチャップ？
  - name: うなぎのタレ
    emoji: 🐍
    reason: 関東風と関西風。焼き方もちがう。
  C:
  - name: たこ焼きのソース
    emoji: 🐙
    reason: ソースと醤油とポン酢。
  - name: 天ぷらのつけるもの
    emoji: 🍤
    reason: 天つゆ、塩、レモン。
  D:
  - name: 唐揚げにレモン
    emoji: 🍋
    reason: かける派と、かけない派。意外と、血を見る争い。
  - name: ポテトサラダにりんご
    emoji: 🍎
    reason: 入れる派と、入れない派。静かなる戦い。
summary: '食べ方でもめる料理は、目玉焼き・酢豚のパイナップル・お雑煮の味がS。うちの当たり前が、他の家では通用しない。

  正解はないから、仲よく食べるのが、いちばん。あなたは、どの派？

  '
related:
- food-medamayaki
- food-curry-kenka
- food-gyojishoku
