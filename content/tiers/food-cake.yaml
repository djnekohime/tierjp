title: ケーキの種類 Tier表
description: ショートケーキ、チーズケーキ、モンブラン、チョコレートケーキ、ティラミス…ケーキ屋さんのケーキを、AIが「選ばれる度×満足感×特別感」でランク付け。ケーキ屋さんで何を選ぶ？
category: food
genre: スイーツ
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① ケーキ屋さんで「まずこれを選ぶ」人気
  ② 食べたときの満足感
  ③ 誕生日などの特別な日にふさわしいか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: ケーキ屋さんの三大スター
  D: 好きな人にはたまらない個性派
tiers:
  S:
    - name: ショートケーキ
      emoji: "🍰"
      reason: いちごと生クリーム、スポンジの組み合わせは、日本のケーキの代名詞。誕生日やクリスマスの主役で、いちごを最初に食べるか最後に食べるかで性格が出る。
    - name: チーズケーキ
      emoji: "🧀"
      reason: ベイクド・レア・スフレと種類が豊富で、好みの一つが必ず見つかる。甘すぎず、大人にも人気。
    - name: チョコレートケーキ
      emoji: "🍫"
      reason: 濃厚なチョコの満足感は格別。ガトーショコラ、ザッハトルテなど、いろいろな形で楽しめる。
  A:
    - name: モンブラン
      emoji: "🌰"
      reason: 栗のクリームを山のように絞ったケーキ。秋になると特に食べたくなる、季節感のある人気者。
    - name: ティラミス
      emoji: "☕"
      reason: コーヒーとマスカルポーネチーズのイタリアのケーキ。日本では平成の初めに大ブームになった。
    - name: フルーツタルト
      emoji: "🍓"
      reason: サクサクのタルト生地に色とりどりのフルーツ。宝石箱のような見た目で気分が上がる。
    - name: シュークリーム
      emoji: "🟡"
      reason: ケーキ屋さんの定番。カスタードと生クリームのダブルなど、店ごとの個性が出る。
    - name: ロールケーキ
      emoji: "🌀"
      reason: ふわふわの生地でクリームを巻いたケーキ。切り分けやすく、家族みんなで食べやすい。
  B:
    - name: ミルクレープ
      emoji: "📚"
      reason: 薄いクレープとクリームを何層にも重ねたケーキ。フォークを入れたときの層の美しさが楽しい。
    - name: シフォンケーキ
      emoji: "☁️"
      reason: ふわっふわの軽い食感。生クリームを添えて食べると、いくらでも食べられそう。
    - name: エクレア
      emoji: "⚡"
      reason: 細長いシュー生地にチョコをかけた定番。手で持って食べられる手軽さもいい。
    - name: プリン・ア・ラ・モード
      short: プリンアラモード
      emoji: "🍮"
      reason: プリンにフルーツとクリームを盛り付けた、昭和の喫茶店を思わせるごちそうスイーツ。
    - name: ガトーショコラ
      emoji: "🟫"
      reason: しっとり濃厚な焼きチョコレートケーキ。バレンタインの手作りでも定番。
  C:
    - name: パウンドケーキ
      emoji: "🧱"
      reason: バターたっぷりの焼き菓子。日持ちしておみやげにぴったりだが、ケーキ屋さんで生ケーキと並ぶと地味に見える。
    - name: サバラン
      emoji: "🍾"
      reason: 洋酒のシロップをたっぷりしみこませた大人のケーキ。お酒の香りが強く、好みが分かれる。
  D:
    - name: キャロットケーキ
      emoji: "🥕"
      reason: にんじんとスパイス、クリームチーズの組み合わせ。海外では定番だが、日本ではまだ通好みの一品。
    - name: オペラ
      emoji: "🎼"
      reason: コーヒーとチョコを何層にも重ねたフランスの伝統菓子。薄く美しい層は職人の技の結晶。
summary: |
  ケーキはショートケーキ・チーズケーキ・チョコレートケーキがS。特に日本のショートケーキは、いちごと生クリームの組み合わせで独自の進化をとげた、日本の国民的ケーキ。
  モンブランは秋、ガトーショコラはバレンタインと、季節で食べたいケーキが変わるのも楽しい。
related: [food-sozai-pan, food-potechi]
