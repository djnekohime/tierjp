title: 炭酸飲料 Tier表
description: コーラ、サイダー、ジンジャーエール、メロンソーダ、ラムネ、炭酸水、オレンジソーダ、エナジードリンク…炭酸飲料を、AIが「シュワッと爽快度×定番力」でランク付け。
category: food
genre: 飲み物
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 一口目の「シュワッ」と爽快な気持ちよさ
  ② 長く愛されている定番力
  ③ 食事やおやつとの相性
  ※ 特定の商品ではなく「炭酸飲料の種類」のランキングです
rank_notes:
  S: 炭酸飲料の三大定番
  D: 好きな人は熱狂的な個性派
tiers:
  S:
    - name: コーラ
      emoji: "🥤"
      reason: 世界で一番有名な炭酸飲料。ピザやハンバーガーとの相性は最強で、映画館やパーティーの定番。
    - name: サイダー
      emoji: "🫧"
      reason: 透明で爽やかな甘さ。日本では明治時代から親しまれてきた、夏の定番。
    - name: 炭酸水
      emoji: "💧"
      reason: 甘くない炭酸水は、健康志向で一気に人気に。レモンやグレープフルーツの香りつきも。
  A:
    - name: ジンジャーエール
      emoji: "🫚"
      reason: しょうがのピリッとした刺激。甘口と辛口で好みが分かれる、大人の炭酸。
    - name: メロンソーダ
      emoji: "🟢"
      reason: 鮮やかな緑色。アイスをのせたクリームソーダは喫茶店の人気者。
    - name: ラムネ
      emoji: "🔵"
      reason: ビー玉入りの瓶で、夏祭りの思い出の味。
    - name: オレンジソーダ
      emoji: "🍊"
      reason: フルーティーな甘さで、子供に人気の炭酸。
    - name: 乳酸菌入りの炭酸飲料
      short: 乳酸菌ソーダ
      emoji: "🥛"
      reason: 甘酸っぱい乳酸菌飲料を炭酸にした、日本らしいさわやかな味。
  B:
    - name: グレープソーダ
      emoji: "🍇"
      reason: ぶどうの香りの甘い炭酸。
    - name: レモンスカッシュ
      emoji: "🍋"
      reason: レモンの酸味でさっぱり。喫茶店の懐かしいメニュー。
    - name: エナジードリンク
      emoji: "⚡"
      reason: 仕事や勉強の追い込みの味方。ただしカフェインが多いので飲みすぎ注意。
    - name: トニックウォーター
      emoji: "🍸"
      reason: ほろ苦さのある炭酸。お酒を割るのにも使われる。
    - name: ゼロカロリーのコーラ
      short: ゼロコーラ
      emoji: "🫙"
      reason: カロリーを気にする人の強い味方。味の違いを語る人も多い。
  C:
    - name: クリームソーダ（フロート）
      short: クリームソーダ
      emoji: "🍨"
      reason: 飲み物というよりデザート。喫茶店で頼むと特別な気分に。
    - name: 果汁入りのスパークリング
      short: スパークリングジュース
      emoji: "🍾"
      reason: お祝いの席で子供も楽しめる、シャンパン風の炭酸。
  D:
    - name: ルートビア
      emoji: "🟤"
      reason: 薬草の香りがするアメリカの炭酸。「湿布の味」と言われることもあるが、沖縄などで根強い人気。
    - name: チェリー風味の独特な炭酸
      short: 独特な炭酸
      emoji: "🍒"
      reason: フルーティーで不思議な香りの炭酸飲料。一度ハマると抜け出せない、熱狂的なファンがいる。
summary: |
  炭酸飲料は、コーラ・サイダー・炭酸水がS。最近は甘くない炭酸水の人気が急上昇している。
  ラムネやクリームソーダのように、炭酸飲料は夏祭りや喫茶店の思い出とセット。沖縄のルートビアのように、地域で愛される炭酸もある。
related: [food-juice, food-furoagari]
