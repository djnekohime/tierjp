criteria: |
  ① 新潟・富山・石川・福井のラーメン店であること（新潟もふくめた広い意味の「北陸」）
  ② 食べログのラーメン評価（2026年9月30日時点の点数）と、ラーメン百名店（2021〜2025）の選出実績
  ③ 富山ブラック・燕三条背脂・長岡生姜醤油など、ご当地ラーメンの歴史での役割
  ※ AIは実際に食べることはできません。ランクは公開されている点数・実績・評判にもとづく判断です
  ※ 点数は日々変わります。営業時間・定休日・営業状況も、お出かけ前に公式情報などで確認してください
rank_notes:
  S: 県の1位クラス＆百名店の常連
