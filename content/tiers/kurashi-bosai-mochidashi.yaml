title: 防災の持ち出し袋の中身 Tier表
description: 水、携帯トイレ、ライト、モバイルバッテリー、常備薬、現金…防災の持ち出し袋に入れたいものを、AIが「必要度×代わりのききにくさ×かさばらなさ」でS〜Dにランク付け。
category: kurashi
tags:
- 防災
- 初心者
published: '2026-10-07'
labels:
  S: 必須
  A: あると安心
  B: あると便利
  C: 好みで
  D: なくても大丈夫（注意）
criteria: '① なくて困る度

  ② 避難先で手に入りにくいか

  ③ 軽さ・かさばらなさ

  ※ 家族構成や持病で必要なものは変わります。自治体の防災ガイドも合わせて確認を'
rank_notes:
  S: 必須
  D: なくても大丈夫
tiers:
  S:
  - name: 飲料水（1人1日3リットルが目安）
    emoji: 💧
    reason: 生きるために必須。重いので、家の備蓄と分けて考える。
  - name: 携帯トイレ
    emoji: 🚽
    reason: 断水・停電時の最重要アイテム。1人1日5回分を目安に。
  - name: 常備薬・お薬手帳
    emoji: 💊
    reason: 代わりがきかない。持病がある人は、特に多めに。
  - name: スマホ・モバイルバッテリー・充電ケーブル
    emoji: 🔋
    reason: 情報と連絡の命綱。
  - name: ライト（懐中電灯・ヘッドライト）
    emoji: 🔦
    reason: 両手が空くヘッドライトが便利。予備の電池も。
  A:
  - name: 非常食（すぐ食べられるもの）
    emoji: 🥫
    reason: 調理不要のものを。いつも食べているものを多めに。
  - name: 現金（小銭を含む）
    emoji: 💴
    reason: 停電時は、カードや電子マネーが使えない。
  - name: マスク・衛生用品
    emoji: 😷
    reason: 避難所では、感染対策に。
  - name: ラジオ（手回しなど）
    emoji: 📻
    reason: 停電時の情報源。
  - name: 防寒具・レインコート
    emoji: 🧥
    reason: 体温維持に。アルミ製のブランケットは軽い。
  B:
  - name: 軍手・厚手の靴下
    emoji: 🧤
    reason: がれきの中を歩くときに。
  - name: ウェットティッシュ・タオル
    emoji: 🧻
    reason: 水が使えないときの衛生に。
  - name: 筆記用具・メモ帳
    emoji: 📝
    reason: 連絡先の控えに。
  - name: 身分証・保険証のコピー
    emoji: 🪪
    reason: 避難先での手続きに。
  C:
  - name: おもちゃ・本・トランプ
    emoji: 🃏
    reason: 子供の気持ちをやわらげる。
  D:
  - name: 重くてかさばるものを、全部詰め込む
    emoji: ⚠️
    reason: 持ち出せなければ意味がない。優先順位をつけて。
summary: '持ち出し袋は「重すぎて持てない」が失敗のもと。S級を優先して、体力に合わせて量を決めたい。

  半年に1回、食品の期限や電池を確認する日を決めておくと、いざというときに使える。'
related:
- kurashi-fuyu-setsuden
- pet-bosai-bichiku
- kurashi-nenmatsu-yaru
