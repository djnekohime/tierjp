title: 今年の学びを振り返る方法 Tier表
description: やったことを書き出す、できたことを数える、積み残しを分ける、来年の1つを決める…年末に1年の勉強・学びを振り返る方法を、ゾーマが「前向きになれるか×手軽さ×来年につながるか」でS〜Dにランク付け。
category: manabi
tags:
- 初心者
published: '2026-11-08'
labels:
  S: 迷ったらこれ
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 前向きな気持ちになれるか

  ② 手軽さ（短時間でできるか）

  ③ 来年の行動につながるか

  ※ 無理に反省会を開く必要はありません。できなかったことより、できたことを先に見るのがおすすめです。気持ちが落ち込むときは、休むことも大切な選択です'
rank_notes:
  S: 迷ったらここから
  D: 避けたい
tiers:
  S:
  - name: やったことを、全部書き出す
    emoji: 📝
    reason: 頭の中にあるだけだと見えない。書き出すと「意外とやっていた」と気づける。
  - name: できたことを、先に数える
    emoji: 🔢
    reason: 反省より先に、達成を見る。前向きな気持ちで、次の行動に進める。
  - name: 来年やることを、1つだけ決める
    emoji: 🎯
    reason: 欲張らず1つに絞ると、続けやすい。小さな目標ほど、成功しやすい。
  A:
  - name: カレンダーや手帳を見返す
    emoji: 📅
    reason: 記憶より正確で、忘れていた頑張りも見つかる。
  - name: 積み残しを「来年もやる／やめる／保留」に分ける
    emoji: 🗂
    reason: 全部やろうとしないための、整理の方法。
  - name: 15分だけ、タイマーをかけて振り返る
    emoji: ⏲
    reason: だらだら続けず、短時間で終えられる。年末の忙しさにも合う。
  - name: 数字で成果を見る（勉強した日数・読んだ本の数）
    emoji: 📊
    reason: 感覚より、事実で自信がつく。
  B:
  - name: 1年前の自分の目標を、見直してみる
    emoji: 🔙
    reason: 変化に気づける。達成度より「成長した点」に注目。
  - name: 友だちや家族と、1年の話をする
    emoji: 🗣
    reason: 思い出す手助けになり、気づきが増える。
  - name: 今年いちばん学んだことを、一言にまとめる
    emoji: ✨
    reason: 短くまとめると、来年も思い出しやすい。
  - name: 写真や記録を整理しながら振り返る
    emoji: 📷
    reason: 楽しく見返せて、思い出と学びがつながる。
  C:
  - name: 大きな表やグラフを、きれいに作る
    emoji: 🎨
    reason: 満足感はあるが、作ることが目的になりやすい。
  - name: 他人の1年と、自分を比べる
    emoji: 👀
    reason: やる気が出ることもあるが、焦りや落ち込みにつながりやすい。
  - name: 来年の目標を、10個以上立てる
    emoji: 📚
    reason: 多すぎて続かないことが多い。絞ったほうが達成しやすい。
  D:
  - name: できなかったことだけを、リストにする
    emoji: 😞
    reason: 自分を責める時間になりやすい。気持ちが沈んで、来年のやる気が落ちる。
  - name: 振り返りを、新年にまとめて先送りする
    emoji: ⏳
    reason: 忘れていくうえ、年始も忙しい。年内に少しだけやっておくのが楽。
  - name: 完璧な計画を立てないと始めないと決める
    emoji: 🛑
    reason: 完璧を目指すほど、動けなくなる。ざっくりでも始めるほうがいい。
summary: '年末に、1年の学びを振り返ると、「思ったよりやっていた」と気づけることが多い。S級は、やったことをまず全部書き出すこと、できたことを数えること、来年やることを「1つ」に絞ること。振り返りの目的は、自分を責めることではなく、来年を楽にすること。

  手帳やスマホのメモ、カレンダーを見返すと、意外な発見がある。やり始めたけど続かなかったものも、「試した」という立派な経験になる。

  積み残したものは、「来年もやる」「やめる」「保留」の3つに分ける。全部やろうとしなくていい。やめる決断も、前に進むための大切な作業。

  コツは4つ。①書き出す時間は、15分だけ。タイマーを使うと、考えすぎない。②数字で見ると分かりやすい（読んだ本の数、勉強した日数など）。③できたことは、小さなことも書く。④来年の目標は、「毎日5分」のように、続けやすい形にする。

  年末は忙しいので、完璧な振り返りは不要。12月に入ってから、1日ずつ小さく進めても十分。来年の自分に向けて、一言メモを残すのもおすすめ。今日は、今年いちばん頑張ったことを1つ、書き出してみて。

  振り返りのときは、静かで気持ちが落ち着く時間を選ぶと、前向きな気持ちで書きやすい。お気に入りの飲みものと一緒に、10分だけ机に向かうのも、続けやすい工夫。書いたものは、ノートやスマホに残しておけば、来年の年末に読み返して、成長に気づける楽しみも生まれる。

  学びは、結果がすぐに出ないことも多い。だからこそ、過程を記録することが、自信と継続の力になる。完璧な1年じゃなくても、「続けようとした」自分を、ちゃんと認めてあげてね。'
