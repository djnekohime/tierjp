summary: '東京は、全国でも、スーパーの種類が一番多い街。総合スーパーのイトーヨーカドーや西友、関東の食品スーパーを代表するサミットやマルエツ、駅に根づく電鉄系（東急・京王・東武）、そして紀ノ国屋のような高級スーパーまで、暮らしに合わせて選べる。

  S級は、東京で暮らしていて、出会わない日はないようなチェーン。'
