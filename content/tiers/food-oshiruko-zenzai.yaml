summary: '寒い日に、湯気の立つおしるこやぜんざいを一杯。小豆のやさしい甘さは、冬のごほうびそのものだ。ちなみに呼び方は地域で違い、関東では汁気のあるものを「おしるこ」、汁気の少ないものを「ぜんざい」と呼ぶことが多く、関西では、こしあんの汁を「おしるこ」、粒あんの汁を「ぜんざい」と呼ぶことが多いと言われる。どちらにしても、主役はあんこと、そこに入れる具だ。

  S級は「香ばしく焼いた角餅・丸餅」「つるんとした白玉」「箸休めの塩昆布・しば漬け」。焼き餅は、表面のカリッとした香ばしさと、とろける中身が、甘い汁によく合う定番中の定番。白玉は、餅より軽く、子どもからお年寄りまで食べやすい。そして、意外な名脇役が塩気。甘いものの合間に塩昆布をひとつまみ食べると、口の中がリセットされて、最後まで飽きずに食べられる。

  A級には、栗の甘露煮、きなこ、さつまいも、かぼちゃ、ほうじ茶を添える、など。栗や芋は、甘さと食べごたえを足してくれる。きなこをひとふりすると、香ばしさが加わって、ぐっと和菓子屋さんの味に近づく。

  B級は、バニラアイス、生クリーム、シナモンなどの洋風アレンジ。熱いぜんざいに冷たいアイスをのせると、温度差が楽しいデザートになる。C級は、甘さを足しすぎるトッピング。あんこ自体が十分甘いので、さらに甘いものを重ねると、くどくなりやすい。

  D級は「大きなお餅をそのまま、急いで食べる」。お餅は、のどに詰まらせる事故が年末年始に多い食べ物。小さく切って、よくかんで、お茶などで口をしめらせながら食べよう。特に高齢の家族や小さな子どもと食べるときは、白玉を小さめにするなどの工夫をしてあげてほしい。

  市販のゆであずきの缶詰を使えば、水でのばして温めるだけで、5分でおしるこができる。鏡開きの残ったお餅の使い道にもぴったり。あなたのおしるこのS級トッピングは、どれ？ ぜひ並べ替えて、自分のTier表を作ってみてほしい。'
