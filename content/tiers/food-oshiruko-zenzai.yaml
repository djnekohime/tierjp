criteria: '① おいしさ（あんこの甘さを引き立てるか）

  ② 相性（おしるこ・ぜんざいらしさを壊さないか）

  ③ 手軽さ（家で用意しやすいか）

  ※ おしることぜんざいの呼び分けは地域で違います。ランクは「多くの人が喜びそうな順」の目安です。お餅はのどに詰まらせないよう、小さく切ってよくかんで食べてください'
