title: おしるこ・ぜんざいの具とトッピング Tier表
description: 焼き餅、白玉、栗の甘露煮、塩昆布、きなこ、バニラアイス…おしるこ・ぜんざいに合わせたい具とトッピングを、ゾーマが「おいしさ×相性×手軽さ」でS〜Dにランク付け。
category: food
