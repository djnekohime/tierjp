title: ペットのための家の地震対策 Tier表
description: 家具の固定、ケージの置き場所、寝場所の安全、脱走防止、ガラスの飛散対策…地震に備えて、ペットと暮らす家で整えたい対策を、効果と手軽さでS〜Dにランク付け。
category: animals
tags: [犬, 猫, 防災, 動物]
published: 2026-10-03
criteria: |
  ① ペットのケガや、命の危険をどれだけ減らせるか
  ② 脱走や、迷子になるリスクをどれだけ減らせるか
  ③ 手軽さ・費用
  ※ 大型家具の固定などは、人の安全のための対策でもあります。賃貸の場合は、壁や床に穴をあけてよいか、管理会社に確認してから行ってください
rank_notes:
  S: 最優先で整えたい
  D: やっても、あまり効果がない
tiers:
  S:
    - name: 大型家具・家電の固定（倒れない対策）
      short: 家具の固定
      emoji: "🪑"
      reason: 家具の転倒は、人にもペットにも、命にかかわる。突っ張り棒や、耐震ジェルなどで固定して、ペットがよく過ごす場所の周りは、特に重点的に。
    - name: ペットの寝場所や、ケージを「安全な場所」に置く
      short: ケージの置き場所
      emoji: "🏠"
      reason: 家具が倒れてきそうな場所や、ガラスの近くは避ける。揺れたときに、落下物の少ない場所にケージを置く。
  A:
    - name: 玄関・窓・ベランダからの脱走防止
      short: 脱走防止
      emoji: "🚪"
      reason: 地震後は、ドアが歪んだり、ペットが怖がって外に飛び出したりしやすい。玄関前に柵を置く、窓にロックをかけるなど、二重の対策を。
    - name: ガラス・割れ物の飛散防止（フィルム・扉ロック）
      short: ガラスの飛散防止
      emoji: "🪟"
      reason: 揺れで割れたガラスや食器は、足のケガにつながる。飛散防止フィルムや、食器棚の扉ロックを。
    - name: ケージ内を、落下物から守る
      short: ケージの上に物を置かない
      emoji: "📦"
      reason: ケージの上に、物を置かないのが基本。上から物が落ちると、ペットが大けがをする。
    - name: 避難用キャリーを、すぐ取り出せる場所に置く
      short: キャリーの定位置
      emoji: "🧳"
      reason: 揺れが収まってからすぐ、ペットを入れられると、安全に避難できる。階段下や、玄関近くなど、取り出しやすい場所に。
    - name: 首輪・迷子札を、日ごろからつけておく
      short: 迷子札をつける
      emoji: "🏷️"
      reason: 地震後の脱走や、迷子に備える基本の対策。外れにくい首輪やハーネスで、連絡先を確認できるように。
  B:
    - name: 寝室や、ペットのいる部屋の照明やテレビの落下防止
      short: 落下物の対策
      emoji: "💡"
      reason: 天井の照明や、壁の飾り、テレビなどが落ちる危険がある。固定できるものは、固定しておく。
    - name: 水槽・ケージの転倒防止（小動物・鳥・魚）
      short: 水槽・ケージの固定
      emoji: "🐟"
      reason: 水槽の転倒や、ケージの落下は、ペットの命に直結する。専用の耐震マットや、固定具を使う。
    - name: 床に、すべり止めのマットを敷く
      short: すべり止め
      emoji: "🟫"
      reason: 揺れの中で、ペットが足をすべらせてケガをするのを防ぐ。高齢のペットがいる家庭には、特におすすめ。
    - name: 室温を保つための、停電への備え（ポータブル電源など）
      short: 停電への備え
      emoji: "🔋"
      reason: 停電で、エアコンやヒーターが止まると、ペットの体調に影響する。必要な場合は、ポータブル電源や、保温・保冷グッズを備える。
    - name: ペットの居場所と、飼い主の居場所を近くする
      short: 近くで過ごす
      emoji: "👥"
      reason: 地震のときに、すぐペットを守りに行ける。寝室とペットのスペースを近づけておく。
  C:
    - name: 家の中の危険なもの（薬・洗剤など）を、倒れない場所に置く
      short: 薬・洗剤の収納
      emoji: "🧴"
      reason: 揺れでこぼれると、ペットが口にする危険がある。固定できる棚や、ふたつきの容器に入れる。
    - name: 非常用持ち出し袋の中に、ペット用品を一緒に入れる
      short: 持ち出し袋にペット用品
      emoji: "🎒"
      reason: 人の防災グッズと一緒に、ペット用品も用意すると、すぐ持ち出せる。
    - name: 家族で、避難のときの役割分担を決めておく
      short: 避難の役割分担
      emoji: "📝"
      reason: 誰がペットを連れ、誰が荷物を持つか、事前に決めておくと慌てない。
  D:
    - name: ケージの上に、おもちゃや荷物を積み上げる
      short: ケージの上に積む
      emoji: "🚫"
      reason: 揺れで落ちてきて、ペットがケガをする危険がある。ケージの上には、物を置かない。
    - name: ペットだけで留守番させるときに、窓やドアを少し開けておく
      short: 窓やドアを開けて外出
      emoji: "⚠️"
      reason: 脱走や、侵入のおそれがある。地震のような急な出来事でも、閉めてあるほうが安全。
summary: |
  最優先は、「大型家具の固定」と「ケージの置き場所」。ペットの命も、飼い主の命も守る基本の備え。
  地震のあとは、脱走や迷子も多い。玄関や窓の脱走防止と、迷子札を、いつもの習慣にしておきたい。家の中を、ペットの目線で見直してみるのが、備えの第一歩。
related: [pet-bousai-goods, pet-bousai-hinan, pet-bousai-shitsuke]
