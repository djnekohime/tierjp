title: 海外旅行の持ち物 Tier表
description: パスポート、お金とカード、スマホと充電器、海外旅行保険、変換プラグ、常備薬、折りたたみバッグ…海外旅行の持ち物を「忘れると困る度」でS〜Dにランク付け。出発前のチェックリストに。
category: travel
tags: [旅行, 初心者]
published: 2026-10-05
labels:
  S: 絶対に忘れない
  A: ないと困る
  B: あると安心
  C: あると便利
  D: 持っていかなくていい
criteria: |
  ① 忘れたときの困りやすさ（旅行に影響するか）
  ② 現地で手に入れにくいか
  ③ 出番の多さ
  ※ 行き先・日数・季節・航空会社のルールで、必要なものは変わります。持ち込める量や物は、航空会社や空港の最新ルールで確認してください（特に、液体や電池類）
rank_notes:
  S: 忘れたら出発できない
  D: 現地で買える、または出番が少ない
tiers:
  S:
    - name: パスポート（有効期限・残りの期間を確認）
      short: パスポート
      emoji: "🛂"
      reason: ないと出国できない、いちばん大事なもの。国によっては、入国時に、残りの有効期間が必要なこともあるので、出発前に確認する。
    - name: 航空券・予約の控え（スマホと紙の両方）
      short: 航空券・予約控え
      emoji: "🎫"
      reason: 電波が悪かったり、電池が切れたりしても、見せられるようにしておく。宿やツアーの予約も、まとめて保存する。
    - name: クレジットカードと、少額の現金
      short: カード・現金
      emoji: "💳"
      reason: カードは、1枚だけでなく、予備を別々に持つと安心。現金は、到着直後の移動や、小さな支払い用に、少し両替しておく。
  A:
    - name: スマホと、充電器・モバイルバッテリー
      short: スマホ・充電器
      emoji: "📱"
      reason: 地図、翻訳、連絡、決済と、旅の中心になる。モバイルバッテリーは、機内持ち込みのルールを、確認する。
    - name: 海外旅行保険の情報（連絡先・証書番号）
      short: 海外旅行保険
      emoji: "🛡️"
      reason: ケガや病気で、海外の医療費は、高額になることがある。万が一のとき、すぐ連絡できるよう、番号や連絡先を、控えておく。
    - name: 変換プラグ・変圧器（必要な場合）
      short: 変換プラグ
      emoji: "🔌"
      reason: 国によって、コンセントの形や電圧が違う。持っている機器が対応しているかも、確認する。
    - name: 常備薬・持病の薬（英文の説明があると安心）
      short: 常備薬
      emoji: "💊"
      reason: 慣れない食事や気候で、体調をくずすことがある。普段飲んでいる薬は、多めに用意し、入国時のルールも確認する。
    - name: 通信手段（海外eSIM・Wi-Fiルーターなど）
      short: 通信手段
      emoji: "📶"
      reason: 現地で地図や翻訳を使うために、通信の準備は大切。出発前に、手配しておくと、安心。
  B:
    - name: 現地の地図・翻訳のアプリ（オフライン対応も）
      short: 地図・翻訳アプリ
      emoji: "🗺️"
      reason: 通信が途切れたときのために、オフラインで使える設定にしておくと、安心。
    - name: 折りたたみのバッグ（予備）
      short: 折りたたみバッグ
      emoji: "👜"
      reason: 荷物が増えて、帰りに困ることがある。軽くて、あまり場所を取らないものが便利。
    - name: パスポートのコピー・写真のデータ
      short: パスポートのコピー
      emoji: "📸"
      reason: 紛失したときの、再発行の手続きに役立つ。本体とは、別の場所に保管する。
    - name: 防犯グッズ（貴重品入れ・鍵）
      short: 防犯グッズ
      emoji: "🔒"
      reason: スリや置き引きから、身を守る。服の内側に入れるタイプの、貴重品入れが人気。
    - name: 現地の気候に合った上着・雨具
      short: 上着・雨具
      emoji: "🧥"
      reason: 天気が変わりやすい場所もある。重ね着できるものを、持っていくと調整しやすい。
    - name: 歩きやすい靴
      short: 歩きやすい靴
      emoji: "👟"
      reason: 旅行は、思った以上に歩く。慣れた靴が、いちばん安心。
  C:
    - name: 圧縮袋・ポーチ類
      short: 圧縮袋・ポーチ
      emoji: "🎒"
      reason: 荷物の整理がしやすくなる。小物をまとめておくと、探しやすい。
    - name: 洗濯用のハンガー・洗剤（長期旅行向け）
      short: 洗濯グッズ
      emoji: "🧺"
      reason: 数日以上の旅行では、洗濯できると荷物が減らせる。
    - name: 水筒やマイボトル
      short: 水筒
      emoji: "🧉"
      reason: 国によっては、水道水が飲めないこともあるので、ペットボトルや、現地の水の情報を、確認する。
    - name: ガイドブック・小さなメモ帳
      short: ガイドブック・メモ
      emoji: "📖"
      reason: スマホの電池が切れたときにも、頼りになる。
  D:
    - name: 現地で簡単に買えるもの（シャンプー・歯ブラシなど）
      short: 現地で買えるもの
      emoji: "🧴"
      reason: 大きな荷物になるので、基本は現地調達。ただし、肌に合うものにこだわる人は、小分けにして持っていく。
    - name: 大量の現金
      short: 大量の現金
      emoji: "💴"
      reason: 盗難や紛失のリスクが高い。カードと、必要な分の現金を、分けて持つほうが安全。
    - name: 高価なアクセサリー・ブランド品
      short: 高価な貴重品
      emoji: "💍"
      reason: 目立つので、トラブルのもとになる。旅行には、必要最小限にする。
summary: |
  持ち物のSは、「パスポート」「航空券・予約の控え」「カードと少額の現金」。この3つがなければ、旅が始まらない。
  出発前に、パスポートの有効期限や、航空会社の持ち込みルールを、必ず確認しよう。あとは、現地で買えるものは持たずに、荷物を軽くするのが、旅を楽しむコツ。
related: [travel-trouble-taisaku, travel-yado-type, kaigai-hajimete]
