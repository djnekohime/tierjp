title: 日本の百貨店グループ・ブランド Tier表
description: 三越伊勢丹、大丸松坂屋、髙島屋、阪急阪神、そごう・西武、近鉄、東急…全国の百貨店グループと地場の名店を、AIが「全国での存在感×歴史・個性×地域への根づき」でS〜Dにランク付け。
category: depart
tags:
- 旅行
- あるある
published: '2026-10-09'
labels:
  S: 街の顔
  A: 地域の主役
  B: ほどよく便利
  C: こぢんまり個性派
  D: 変化の途中
criteria: '① 街での存在感（その地域で「あの百貨店」と言われるか）

  ② 立地の便利さ（駅直結・中心街など）

  ③ その店ならではの個性

  ※ AIは全店を回ったわけではありません。日本百貨店協会の店舗一覧と、各社・百貨店の公開情報、AIの印象で並べています。ランクは売上順や店の良し悪しではなく、「街での存在感・立地・個性」の目立ち方です。百貨店は閉店・改装・運営会社の変更が多いので、お出かけ前に公式サイトで最新の営業状況を確認してください（2026年10月時点）'
rank_notes:
  S: ここに行けば、その街とわかる
  D: 縮小・閉店予定など、変化の途中
tiers:
  S:
  - name: 三越伊勢丹
    emoji: 🏬
    reason: 三越（創業1673年）と伊勢丹を持つ、国内最大級の百貨店グループ。東京の本店のほか、札幌・仙台・新潟・静岡・名古屋・広島・高松・松山・福岡などに地域の店がある。
  - name: 髙島屋
    emoji: 🏯
    reason: 大阪・難波の大阪店を登記上の本店とする老舗。日本橋・新宿・横浜・京都・大阪など全国に店を持つ。ハイランドグループを形成し、各地の地場百貨店とも組んでいる。
  - name: 大丸松坂屋
    emoji: 🛍️
    reason: 大丸と松坂屋を運営する百貨店。J.フロント リテイリンググループで、心斎橋・京都・神戸・東京・札幌・名古屋・上野などに店がある。
  - name: 阪急阪神百貨店
    emoji: 🚃
    reason: 阪急うめだ本店と阪神梅田本店を運営する、関西の大手。梅田から神戸、福岡の博多阪急まで広がる。
  A:
  - name: そごう・西武
    emoji: 🏷️
    reason: そごうと西武を運営する百貨店。横浜・千葉・大宮・広島のそごう、池袋の西武など、都市の基幹店がある。店舗の統廃合が進んでいる。
  - name: 近鉄百貨店
    emoji: 🚆
    reason: 大阪・あべのハルカスの本店を中心に、奈良・和歌山・四日市・草津など近鉄沿線に店を持つ電鉄系百貨店。
  - name: 東急百貨店
    emoji: 🌳
    reason: 東急グループの百貨店。札幌、吉祥寺、たまプラーザ、日吉などで営業。長野の「ながの東急百貨店」は関連会社。
  - name: 松屋
    emoji: ✨
    reason: 銀座本店と浅草店の2店。銀座では銀座三越と人気を争う老舗で、浅草店は関東初の駅直結の百貨店として知られる。
  B:
  - name: 京王百貨店
    emoji: 👑
    reason: 新宿駅西口の京王グループの百貨店。聖蹟桜ヶ丘にも店がある。毎年の駅弁大会で有名。
  - name: 小田急百貨店
    emoji: 🚉
    reason: 新宿・町田・藤沢で営業する小田急グループの百貨店。
  - name: 東武百貨店
    emoji: 🌉
    reason: 池袋と船橋を運営。栃木の「東武宇都宮百貨店」は別会社の兄弟会社だが、同じ名前で親しまれている。
  - name: 京阪百貨店
    emoji: 🛤️
    reason: 守口を本社に、京橋・くずは・ひらかた・すみのどうなど大阪の京阪沿線に店を持つ。
  - name: 天満屋
    emoji: 🍑
    reason: 岡山を本社とする、大手や私鉄系を除いた地場百貨店として日本一の売上と言われる。岡山・倉敷・津山・福山に店。
  C:
  - name: 山形屋
    emoji: 🌺
    reason: 鹿児島の老舗地場百貨店。鹿児島と宮崎で4店舗を展開。
  - name: 鶴屋百貨店
    emoji: 🕊️
    reason: 熊本市中心街で1952年に創業。売場面積は日本最大級と紹介される、熊本の郷土のデパート。
  - name: トキハ
    emoji: 🌲
    reason: 大分の地場百貨店。本店・わさだ店・別府店の3店を運営。社名は「常葉」に由来する。
  D:
  - name: さくら野百貨店
    emoji: 🌸
    reason: 東北で展開する百貨店。青森本店、弘前店、八戸店。仙台店などは閉店済みで、規模は縮小している。
summary: '日本の百貨店は、呉服店を起源にする老舗系（三越・大丸・髙島屋・松坂屋）と、鉄道会社が駅に作った電鉄系（阪急・東急・近鉄・京王・小田急・東武など）、旧そごう・西武系、そして各県の地場百貨店に分けて見ると、わかりやすい。

  ここでは全国にまたがる大手グループを上位に、地方に根づく地場の名店も、ぜひ見てほしい。地場百貨店は、その街の暮らしそのもの。'
