title: AIに入力してはいけない情報 Tier表
description: パスワード、マイナンバー、他人の個人情報、仕事の機密…AIに入力する情報のリスクを、AIが「危険度の高い順」でS〜Dにランク付け。
category: ai
tags:
- AI
- 安全性
- 初心者
published: '2026-10-09'
labels:
  S: 絶対に入れない
  A: 入れない
  B: よく考えて
  C: 注意して
  D: 比較的安全
criteria: '① 漏れたときの被害の大きさ

  ② 取り返しがつくか

  ③ 他人に迷惑がかかるか

  ※ AIの機能や規約は変わります。使う前に、各サービスの最新の案内を確認してください'
rank_notes:
  S: 絶対に入れない
  D: 比較的安全
tiers:
  S:
  - name: パスワード・暗証番号・認証コード
    emoji: 🔑
    reason: 漏れたら、アカウントやお金が危険。絶対に入れない。
  - name: マイナンバー・クレジットカード番号
    emoji: 💳
    reason: 悪用されると被害が大きい。
  - name: 他人の個人情報（住所・電話番号・病気など）
    emoji: 👥
    reason: 本人の許可なく入力しない。迷惑をかける。
  A:
  - name: 勤務先・取引先の機密情報
    emoji: 🏢
    reason: 契約違反になることも。会社のルールを確認。
  - name: 家族や子供の写真・個人が特定できる情報
    emoji: 👶
    reason: 公開・流出のリスク。
  - name: 病気・健康状態などの詳細な個人情報
    emoji: 🩺
    reason: プライバシーの中でも、特に慎重に。
  B:
  - name: 自分の住所・勤務先・日課
    emoji: 🏠
    reason: 個人が特定されやすい。必要なら、ぼかして入れる。
  - name: 公開前の作品・企画・原稿
    emoji: 🎬
    reason: 設定によっては、利用される可能性がある。
  - name: 口座や契約の具体的な内容
    emoji: 🏦
    reason: 必要なら、金額などを伏せて質問する。
  C:
  - name: 他人の作品（文章・画像）をそのまま入れる
    emoji: 🖼️
    reason: 著作権に注意。使い道を確認する。
  - name: 仕事の資料の一部
    emoji: 📑
    reason: 会社のルールで許可されているか確認。
  D:
  - name: 公開済みの情報（ニュース・一般的な知識）
    emoji: 📰
    reason: 比較的安全。ただし、正しいかは確認する。
  - name: 一般的な質問・アイデア相談
    emoji: 💭
    reason: 個人が特定されない内容なら、気軽に使える。
summary: 'AIサービスに入力した内容は、サービスの設定や規約によって、保存・利用されることがある。そのため、漏れたら困る情報は、最初から入れないのが基本。

  ここでは「危険度が高い情報ほどS級」。使うサービスの設定（学習に使われるかどうか）も、一度確認しておくと安心。'
related:
- ai-nani-makaseru
- ai-fact-check
- ai-shitsumon-kotsu
