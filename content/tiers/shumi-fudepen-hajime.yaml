    emoji: 💨
    reason: 線が乱れて、字がくずれる。筆ペンはゆっくりが基本。
  - name: 人の字と比べて落ち込む
    emoji: 😢
    reason: 字はその人らしさ。ていねいな字は、それだけで伝わる。
  - name: キャップを開けたまま放置する
    emoji: 🧢
    reason: インクが乾いて書けなくなる。使ったらすぐ閉める。
summary: '年賀状の宛名、ご祝儀袋、お礼の一筆箋、そしてお正月の書き初め。「字がきれいに書けたらいいのに」と思う場面が、年末年始には一気に増える。そこでおすすめなのが筆ペン。墨をすったり、筆を洗ったりする手間がなく、ペンケースに入れて持ち歩ける。少し練習するだけで、ぐっと味のある字が書けるようになる。

  S級は「ひらがなから練習する」「お手本をなぞってから、横に見ながら書く」「ゆっくり、止め・はね・はらいを意識して書く」。日本語の文章の多くはひらがななので、ひらがなが整うと、全体がぐっときれいに見える。いきなり自己流で書くより、お手本を何度かなぞって、筆の動きを手に覚えさせるのが近道だ。そして、きれいな字の秘密は、速さではなく、ゆっくり書くこと。筆先が紙に触れる感覚を楽しみながら書こう。

  A級は、自分に合った筆ペンを選ぶ、自分の名前と住所を集中して練習する、姿勢と持ち方を整える、など。筆ペンには、毛筆のようなやわらかい穂先のものと、サインペンに近い硬めのものがある。初めてなら、硬めのほうが思い通りに線を引きやすい。そして、いちばん使う機会が多いのは、自分の名前と住所。ここだけを集中して練習すると、のし袋や宛名書きで自信が持てる。

  B級は、書き初めで一年の目標を書く、一筆箋でお礼を書く、など。書き初めは、新年に初めて筆をとって字を書く行事。上手に書くことより、その年の抱負を言葉にすることに意味がある。

  C級は、高価な道具を最初からそろえること、難しい漢字や長い文章からいきなり始めること。D級は「急いで速く書く」「人の字と比べて落ち込む」。字には、その人らしさが出る。上手かどうかより、ていねいに書かれた字は、それだけで気持ちが伝わる。

  1日1行、好きな言葉を書くだけでも、1か月後には筆の運びが変わってくる。冬の夜、温かい飲み物を用意して、静かに字と向き合う時間は、とても贅沢な癒やしでもある。あなたは、最初にどんな言葉を書いてみたい？'
