title: ハンバーガーの具 Tier表
description: パティ、チーズ、ベーコン、目玉焼き、アボカド、照り焼き、レタス、トマト、ピクルス…ハンバーガーの具を、AIが「追加したい度×満足感」でランク付け。ピクルスは抜く派？
category: food
genre: ファストフード・外食
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「これは入れたい」と思える人気
  ② 一口食べたときの満足感
  ③ ハンバーガーらしさ
  ※ 特定の店の商品ではなく「具」のランキングです
rank_notes:
  S: これがないとハンバーガーじゃない
  D: 好き嫌いがはっきり分かれる
tiers:
  S:
    - name: ビーフパティ
      emoji: "🍔"
      reason: ハンバーガーの主役。肉汁たっぷりのパティが二枚、三枚と重なるほどテンションが上がる。
    - name: チーズ
      emoji: "🧀"
      reason: とろけたチーズがパティにからむチーズバーガーは、定番の中の定番。
    - name: ベーコン
      emoji: "🥓"
      reason: カリッとした食感と燻製の香り。ベーコンチーズバーガーは満足感が最大級。
  A:
    - name: 目玉焼き
      emoji: "🍳"
      reason: 半熟の黄身がとろりとパティにからむ。月見バーガーのように季節限定で人気が出ることも。
    - name: 照り焼きソース
      emoji: "🍯"
      reason: 甘辛い照り焼き味は、日本で生まれて定着した人気の味。マヨネーズとの相性が抜群。
    - name: アボカド
      emoji: "🥑"
      reason: クリーミーなアボカドは、専門店のグルメバーガーで人気の具。
    - name: トマト
      emoji: "🍅"
      reason: みずみずしい酸味が、こってりしたパティをさっぱりさせてくれる。
    - name: レタス
      emoji: "🥬"
      reason: シャキシャキ食感を足す、ハンバーガーの名脇役。
  B:
    - name: オニオン（生・フライ・ソテー）
      short: オニオン
      emoji: "🧅"
      reason: 生ならシャキッと、炒めれば甘く、フライならサクッと。調理法で印象が変わる。
    - name: フィッシュフライ
      emoji: "🐟"
      reason: 白身魚のフライとタルタルソース。肉のハンバーガーとは違うあっさり派の定番。
    - name: チキンフライ
      emoji: "🐔"
      reason: サクサクのチキンにマヨネーズ。チキンバーガーも根強い人気。
    - name: マッシュルーム
      emoji: "🍄"
      reason: ソテーしたマッシュルームのうまみ。グルメバーガーでよく見かける。
    - name: ハラペーニョ
      emoji: "🌶️"
      reason: ピリッとした辛さで、刺激が欲しい人向け。
  C:
    - name: パイナップル
      emoji: "🍍"
      reason: ハワイ風のハンバーガーで見かける甘酸っぱい具。好みは大きく分かれる。
    - name: ライスバンズ
      emoji: "🍙"
      reason: パンの代わりにご飯で具をはさむ、日本ならではのアレンジ。具というより「バンズの種類」。
  D:
    - name: ピクルス
      emoji: "🥒"
      reason: 酸味がパティの脂を引き締める、アメリカのハンバーガーには欠かせない具。ただ「必ず抜いてもらう」派も多く、好き嫌いがもっともはっきり分かれる具。
    - name: ピーナッツバター
      emoji: "🥜"
      reason: アメリカの一部のお店で見かける変わり種。甘じょっぱさにハマる人がいる、通好みの組み合わせ。
summary: |
  ハンバーガーの具は、パティ・チーズ・ベーコンがS。この3つを重ねたハンバーガーは、ファストフードでもグルメバーガーでも最強の組み合わせ。
  照り焼きやライスバンズのように、日本で生まれたアレンジも多い。そしてピクルスは「入れる派・抜く派」の永遠の論争。あなたはどっち？
related: [food-pizza, food-famires]
