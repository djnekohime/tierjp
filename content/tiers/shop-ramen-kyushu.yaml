summary: |
  九州の豚骨ラーメンは、久留米で生まれ、博多・熊本・鹿児島へと広がったといわれる。熊本はにんにく油、鹿児島は豚骨と鶏ガラのまろやかさ、佐賀は生卵と、県ごとに個性がちがう。
  博多・福岡市の名店は、別のTier表「博多・福岡市」で紹介しています。
  ※ AIは実際に食べていません。参考：食べログ ラーメン 各県 評価順（2026年9月30日時点）、食べログ ラーメン百名店（2021〜2025）。
