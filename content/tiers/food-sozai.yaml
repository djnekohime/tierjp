title: スーパーの惣菜 Tier表
description: 唐揚げ、コロッケ、お寿司、焼き鳥、ポテトサラダ、天ぷら、とんかつ、餃子、だし巻き卵…スーパーの惣菜を、AIが「つい買う度×晩ごはんの助かり度」でランク付け。
category: food
genre: コンビニ・スーパー
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① スーパーで「つい買ってしまう」度
  ② 忙しい日の晩ごはんがどれだけ助かるか
  ③ 家で作るより買った方がいい理由（手間・油）
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 惣菜売り場の三大スター
  D: 見つけたらうれしい一品
tiers:
  S:
    - name: 唐揚げ
      emoji: "🍗"
      reason: スーパーの惣菜の王様。家で揚げると油の片づけが大変だからこそ、買ってくるとうれしい。
    - name: コロッケ
      emoji: "🥔"
      reason: 手ごろな値段でお腹がふくれる。揚げたてに出会えたら迷わず買う。
    - name: お寿司（パック寿司）
      short: パック寿司
      emoji: "🍣"
      reason: 夕方の値引きシールがついたパック寿司は、ちょっとした幸せ。お祝いの日の食卓にも。
  A:
    - name: 焼き鳥
      emoji: "🍢"
      reason: たれと塩が選べる、晩酌のお供。温めるだけで一品になる。
    - name: 天ぷら
      emoji: "🍤"
      reason: 家で作るのが大変な料理の代表。うどんやそばにのせて、天ぷらうどんに。
    - name: とんかつ
      emoji: "🐖"
      reason: かつ丼やカツカレーにもアレンジできる万能惣菜。
    - name: ポテトサラダ
      emoji: "🥗"
      reason: 家で作ると意外に手間がかかる副菜。量り売りで少しだけ買えるのもうれしい。
    - name: 餃子
      emoji: "🥟"
      reason: 焼いてあるものも、焼くだけのものも便利。晩ごはんのもう一品に。
  B:
    - name: だし巻き卵
      emoji: "🟨"
      reason: お店のだし巻き卵は、ふわふわでだしがじゅわっと。お弁当にも使える。
    - name: 煮物
      emoji: "🥕"
      reason: 手間のかかる煮物を少しだけ食べたいときに。
    - name: メンチカツ
      emoji: "🟤"
      reason: 肉汁たっぷりの揚げもの。コロッケよりボリュームが欲しい日に。
    - name: サラダ（量り売り）
      short: サラダ
      emoji: "🥬"
      reason: 野菜不足をおぎなえる。種類をいろいろ選べるのがうれしい。
    - name: 春巻き
      emoji: "🥠"
      reason: パリパリの皮と中華の具。家で巻くのは手間がかかる。
  C:
    - name: 焼き魚
      emoji: "🐟"
      reason: 家で焼くと煙やにおいが気になる魚。買ってくると後片づけが楽。
    - name: おにぎり・弁当
      emoji: "🍙"
      reason: 手作りのおにぎりやお弁当は、スーパーによって味の個性が出る。
  D:
    - name: ローストビーフ
      emoji: "🥩"
      reason: ちょっと贅沢なごちそう惣菜。お祝いの日に、家で作るのは難しい一品を手軽に。
    - name: ご当地惣菜
      emoji: "🗾"
      reason: 地域のスーパーならではの郷土料理の惣菜。旅先でスーパーに寄ると、その土地の食文化が分かる。
summary: |
  スーパーの惣菜は、唐揚げ・コロッケ・パック寿司がS。どれも「家で作ると手間や油が大変」な料理で、買ってくる価値が一番大きい。
  旅行先でスーパーの惣菜売り場をのぞくと、その土地ならではの料理に出会える。地元の人の食卓がのぞける、小さな観光スポット。
related: [food-hot-snack, food-reitou]
