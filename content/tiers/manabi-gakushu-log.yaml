title: 勉強の記録・見える化 Tier表
description: 時間を記録、やったページに〇、カレンダー、アプリ、週の振り返り…勉強の記録の付け方を、ゾーマが「続けやすさ×やる気への効果×手間の少なさ」でS〜Dにランク付け。
category: manabi
tags:
- 初心者
- 節約
published: '2026-11-10'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 続けやすさ

  ② やる気が出るか

  ③ 手間の少なさ

  ※ 記録は、あくまで続けるための道具です。記録がつらくなったら、方法を変えてかまいません'
rank_notes:
  S: ぜひ実践
