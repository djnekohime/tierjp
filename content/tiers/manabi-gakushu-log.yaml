    reason: 続かなくなる原因。空白があっても、再開すればOK。
  - name: 他人の記録と、比べて落ち込む
    emoji: 🙈
    reason: ペースは人それぞれ。自分の昨日と比べるのがいちばん。
summary: '勉強が続かない原因の多くは、「やっているのに、成果が見えない」こと。だから、記録を付けて見える化するのは、とても効果的だ。

  S級は、日付と時間だけをメモすること、カレンダーに〇をつけること、そして週に1回だけ振り返ること。どれも30秒でできて、続けやすい。

  気をつけたいのは、記録が目的になってしまうこと。細かく付けすぎると、記録だけで疲れてしまう。最初は、「やった日に〇をつける」くらいでちょうどいい。慣れてきたら、時間や内容を足していけば十分だ。

  スマホのアプリやカレンダーを使えば、グラフで変化が見えるので、やる気が出やすい。紙の手帳が好きなら、お気に入りの手帳に書くのも楽しい。自分が手に取りやすい形がいちばん。

  週に1回の振り返りでは、「できたこと」を3つ書き出す。できなかったことは、反省せず、「来週どうするか」だけを決める。これだけで、気持ちが前向きに保てる。

  何も記録できなかった週があっても、やめなくていい。また〇をつければ、そこから再開できる。記録は、あなたを責めるものではなく、応援するもの。気楽に、続けていこう。

  記録を続けていると、数か月後に見返したとき、「こんなにやってきたんだ」と自分でも驚く。その驚きが、また次の勉強の力になる。

  試験や資格の勉強では、本番の日から逆算して、1週間ごとの目標を決めておくと、記録がさらに生きる。ただし、予定通りに進まなくても大丈夫。計画は、何度でも直していい。あなたのペースで、少しずつ進んでいこう。'
