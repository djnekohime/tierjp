  - name: 勉強前後の、気分や集中度を一言メモ
    emoji: 💭
    reason: 自分に合う時間帯や環境が分かってくる。
  - name: ごほうびを決めておく（30日続けたら〇〇）
    emoji: 🎁
    reason: 楽しみがあると、続きやすい。
  - name: 家族や友達に、報告する
    emoji: 🗣️
