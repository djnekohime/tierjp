  D: []
summary: '香川は、高松のマルヨシセンターが、県内の代表的な地元スーパー。そのほか、愛媛のフジやハローズ、広島発のイズミなど、瀬戸内の近隣県のチェーンも、暮らしの身近な存在。

  小さな県だからこそ、地元のスーパーの存在が際立つ。'
