rank_notes:
  S: 2026年に2度の防衛に成功
tiers:
  S:
    - name: ダニー・サバテロ
      emoji: "👑"
      reason: 'アメリカの王者。2026年4月の福岡大会で後藤丈治に判定勝ち、7月の広島大会では鹿志村仁之介を3ラウンドKOで下し、2度の防衛に成功した。レスリングの強さが武器。'
  A:
    - name: 井上直樹
      emoji: "🥋"
      reason: '元王者。2025年に福田龍彌との王座決定戦を制してベルトを巻いた実力者。打撃と寝技の両方がトップレベルで、王座奪還の第一候補。'
    - name: 鹿志村仁之介
      emoji: "🌊"
      reason: '寝技が得意な若手。2026年7月にサバテロのベルトに挑戦したが、3ラウンドKOで敗れた。挑戦者まで上り詰めた実力は本物。'
    - name: 後藤丈治
      emoji: "🛡️"
      reason: '2026年4月の福岡大会でサバテロに挑戦し、判定で敗れた。王者と最後まで戦い抜いた粘り強さが持ち味。'
    - name: イリスベク・ティレノフ
      emoji: "🏔️"
      reason: 'フェザー級王者シェイドゥラエフと同じチームに所属する選手。2026年7月の広島大会で、五輪メダリストの太田忍を2ラウンドにヒザ蹴りでKOし、一気にタイトル戦線に浮上した。'
  B:
    - name: 福田龍彌
      emoji: "🐉"
      reason: '王座決定戦まで進んだ実力者。打撃の鋭さで上位の選手とも互角に戦う。'
    - name: 佐藤将光
      emoji: "🧠"
      reason: '修斗で実績を積んだベテラン。技術と経験で試合を組み立てる、バンタム級上位の常連。'
    - name: キム・スーチョル
      emoji: "🐯"
      reason: '韓国のROAD FCで王者になった経験を持つ実力者。日韓の対抗戦でも存在感を示してきた。'
    - name: 安藤達也
      emoji: "💪"
      reason: 'バンタム級ランキングの上位に入る日本人選手。パワーのある戦いで上位を狙う。'
    - name: 太田忍
      emoji: "🥈"
      reason: 'レスリングでリオデジャネイロ五輪の銀メダルを獲得した選手。2026年5月の神戸大会では金太郎に肩固めで一本勝ちしたが、7月の広島大会でティレノフにヒザ蹴りでKO負けを喫した。'
  C:
    - name: ヤン・ジヨン
      emoji: "🌀"
      reason: '韓国出身の選手。バンタム級のランキングに名前を連ねる実力派。'
    - name: 金太郎
      emoji: "🐻"
      reason: '2026年5月の神戸大会で太田忍に一本負けしたが、打撃の破壊力は階級屈指。'
summary: |
  バンタム級は、アメリカのサバテロが2026年に2度の防衛を果たし「長期政権」の気配。止められるとしたら、元王者の井上直樹か、太田忍をKOして急浮上したティレノフか。
  日本人の挑戦者が次々と現れては跳ね返されている今、誰がサバテロを倒すのかが最大の注目点。
  ※ 選手の状況（引退・階級変更・移籍など）は変わることがあります。最新情報はRIZIN公式サイトで確認してください。
