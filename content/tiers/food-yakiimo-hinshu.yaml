title: 焼き芋にしたいさつまいも・品種 Tier表
description: 紅はるか、シルクスイート、安納芋、鳴門金時、紅あずま…焼き芋にしたいさつまいもを、ゾーマが「甘さ×食感×手に入りやすさ」でS〜Dにランク付け。
category: food
genre: 野菜・果物
tags:
- グルメ
published: '2026-11-01'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 焼いたときの甘さ

  ② 食感（ねっとり・しっとり・ほくほく）

  ③ 手に入りやすさ

  ※ 同じ品種でも、産地や貯蔵期間、焼き方で味はかなり変わります'
rank_notes:
  S: 焼き芋の定番
  D: 焼き芋以外が向く
tiers:
  S:
  - name: 紅はるか
    emoji: 🍠
    reason: ねっとり甘い、焼き芋の人気者。糖度が上がりやすく、手に入りやすいのも強い。
  - name: シルクスイート
    emoji: 🍠
    reason: しっとりなめらかで、上品な甘さ。絹のような舌ざわりが人気。
  A:
  - name: 安納芋
    emoji: 🍠
    reason: 蜜のようなとろける甘さ。種子島発祥で、ねっとり系の代表。
  - name: 鳴門金時
    emoji: 🍠
    reason: ほくほく食感で、昔ながらの焼き芋らしい味。皮の赤みもきれい。
  - name: 紅あずま
    emoji: 🍠
    reason: 関東で定番のほくほく系。甘さ控えめで、食事にも合う。
  - name: ベニアカリ
    emoji: 🍠
    reason: 甘さとしっとり感のバランスがよい、新しめの品種。
  B:
  - name: べにまさり
    emoji: 🍠
    reason: なめらかで、甘みがしっかり。やや高めなこともある。
  - name: パープルスイートロード
    emoji: 🍠
    reason: 紫色が特徴。甘みもあり、見た目でも楽しめる。
  - name: ほしキラリ
    emoji: 🍠
    reason: 干し芋に向く品種だが、焼いてもねっとり。
  - name: ハロウィンスイート
    emoji: 🍠
    reason: ほっくり系で、焼いた皮もきれい。秋に出回りやすい。
  - name: 黄金千貫
    emoji: 🍠
    reason: 焼酎やでんぷん向けの品種として知られる。家庭向けは少なめ。
  C:
  - name: 甘みの少ないスーパーの特売芋
    emoji: 🛒
    reason: 品種不明のことも多く、当たり外れが出やすい。
  - name: 小さすぎる芋
    emoji: 🔍
    reason: 火は通りやすいが、水分が飛びやすい。
  - name: 太すぎる芋
    emoji: 📏
    reason: 中まで火が通りにくい。大きいものは半分に切ると焼きやすい。
  D:
  - name: 傷んだ・黒く変色した芋
    emoji: ⚠️
    reason: 苦みが出たり、食べないほうがよいことがある。無理せず処分を。
  - name: 冷蔵庫で長く保管した芋
    emoji: 🥶
    reason: 低温で傷みやすく、味も落ちやすい。常温の冷暗所が向く。
  - name: 焦がしすぎた焼き芋
    emoji: 🔥
    reason: 苦くなる。皮が焦げたら、むいて食べるのがおすすめ。
summary: '焼き芋の食感は、大きく「ねっとり系」「しっとり系」「ほくほく系」に分かれる。好みを先に決めると、品種選びで迷わない。ねっとり系は紅はるかや安納芋。しっとり系はシルクスイート。ほくほく系は鳴門金時や紅あずまが代表。

  さつまいもは、収穫してすぐより、少し寝かせたほうが甘みが増しやすい。低めの温度（180℃前後）でじっくり時間をかけると、でんぷんが糖に変わって甘くなりやすい。トースターや炊飯器、フライパンでも作れるので、家でも試しやすい。

  ただし、味の感じ方には個人差がある。この表は「大勢が選びやすい順」の目安なので、気になる品種を見かけたら、ぜひ食べ比べてみてほしい。'
related:
