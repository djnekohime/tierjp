title: メダカの品種 Tier表
description: ヒメダカ、青メダカ、楊貴妃、幹之、三色、ダルマ、ラメ…人気のメダカの品種を「飼いやすさ・見た目の華やかさ・手に入れやすさ」でS〜Dにランク付け。
category: animals
tags: [メダカ, 動物, 初心者]
published: 2026-10-03
labels:
  S: 迷ったらこれ
  A: 人気で飼いやすい
  B: 見た目で選ぶ
  C: ちょっと上級
  D: 通好みのこだわり
criteria: |
  ① 飼いやすさ（丈夫さ・水温や水質への強さ）
  ② 見た目の華やかさ・個性
  ③ 手に入れやすさ・値段
  ※ メダカの品種は、毎年のように新しいものが生まれています。ここに載せたのは、よく知られた定番の一部です。同じ品種でも個体によって見た目が違います
rank_notes:
  S: 初めてのメダカにおすすめ
  D: 好きな人がとことん楽しむ領域
tiers:
  S:
    - name: ヒメダカ
      emoji: "🟠"
      reason: オレンジ色の、昔からおなじみの定番品種。丈夫で値段も手頃で、初めて飼う人に向く。水面に浮かぶ姿が見つけやすいのも魅力。
    - name: 青メダカ
      emoji: "🔵"
      reason: うすい青みがかった体が、すっきり涼しげ。飼育もしやすく、ヒメダカと並べると色の対比がきれい。
  A:
    - name: 白メダカ
      emoji: "⚪"
      reason: 白っぽくて上品な見た目で、水草の緑とのコントラストが映える。丈夫で、繁殖しやすい。
    - name: 黒メダカ（野生に近い体色）
      short: 黒メダカ
      emoji: "⚫"
      reason: 自然の川や田んぼにいるメダカに近い、落ち着いた体色。丈夫で、昔ながらの風情を楽しめる。
    - name: 楊貴妃メダカ
      short: 楊貴妃
      emoji: "🔴"
      reason: 鮮やかな朱赤色が美しい人気品種。日光や水の色で、赤みが変わることがある。ビオトープでも映える。
    - name: 幹之メダカ
      short: 幹之
      emoji: "✨"
      reason: 背中に青白い光沢が走る、メダカブームを牽引してきた人気品種。上から見るときれいで、種類ごとに光り方が違う。
    - name: 紅白メダカ
      short: 紅白
      emoji: "🎏"
      reason: 赤と白のおめでたい模様。ひとつひとつ柄が違い、お気に入りを探す楽しみがある。
  B:
    - name: 三色メダカ
      emoji: "🎨"
      reason: 赤・白・黒の3色が入った、錦鯉のような華やかな品種。柄の出方が1匹ずつ違うので、見ていて飽きない。
    - name: ラメメダカ
      emoji: "💎"
      reason: 体にきらきらと光る粒が入り、光が当たるとまぶしい。ラメの出方は個体によって違う。
    - name: パンダメダカ
      short: パンダ
      emoji: "🐼"
      reason: 目が黒く大きく見えて、パンダのような顔つきが愛らしい。かわいらしさで選ぶ人に人気。
    - name: 琥珀メダカ
      short: 琥珀
      emoji: "🍯"
      reason: 琥珀のようなあたたかい色合いが魅力。ほかの色と組み合わせて飼うと、水の中が華やかになる。
    - name: ヒカリ体型のメダカ
      short: ヒカリ体型
      emoji: "🌟"
      reason: 背びれの形が特徴的で、上から見るとすっきりした姿。選ぶと、観賞の幅が広がる。
  C:
    - name: ダルマメダカ
      short: ダルマ
      emoji: "🥚"
      reason: 体が短くて丸い体型がかわいい。泳ぎがゆっくりで、ほかの元気なメダカと一緒だと、えさを食べそびれやすいことがある。
    - name: 透明鱗メダカ
      short: 透明鱗
      emoji: "🔍"
      reason: 体が透けて見えるような質感が特徴。繊細な美しさがあり、好みがはっきり分かれる。
    - name: アルビノメダカ
      short: アルビノ
      emoji: "🔴"
      reason: 目が赤く、体の色が淡い品種。強い日差しは苦手と言われ、直射日光を避けて、やさしい環境で育てたい。
  D:
    - name: 品評会向けの高級品種
      short: 高級品種
      emoji: "🏆"
      reason: 色の濃さ・光沢・体型を、とことん追求した個体は、高い値段がつくこともある。選別や管理のこだわりも大きく、通好みの世界。
    - name: 新しく生まれた新品種
      short: 新品種
      emoji: "🆕"
      reason: ブームの中で次々と新しい品種が登場している。人気が出るかどうかは未知数で、好奇心とロマンで選ぶ楽しみがある。
summary: |
  迷ったら、丈夫で手に入りやすい「ヒメダカ」と「青メダカ」から。慣れてきたら、幹之や楊貴妃など、見た目が華やかな品種に広げるのがおすすめ。
  メダカは品種を増やしても、水質や水温、えさの基本は同じ。まずは基本の飼い方を押さえてから、お気に入りの品種を探すと、失敗が少なくなる。
related: [medaka-goods, medaka-yoki, medaka-esa]
