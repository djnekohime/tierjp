title: やることが多すぎる日の、頭の整え方 Tier表
description: 全部書き出す、今日の3つだけ、5分で終わるものから…やることが多すぎて混乱する日の整え方を、ゾーマが「気持ちの軽さ×実行しやすさ×続けやすさ」でS〜Dにランク付け。
category: kurashi
tags:
- 初心者
- あるある
published: '2026-10-31'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 気持ちが軽くなるか

  ② 実行しやすさ

  ③ 続けやすさ

  ※ 眠れない・気分の落ち込みが続くなど、つらさが強いときは、ひとりで抱えず専門家に相談してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: やることを、全部書き出す
    emoji: 📝
    reason: 頭の中がからっぽになり、気持ちが軽くなる。
  - name: 今日やることを、3つだけ選ぶ
    emoji: 3️⃣
    reason: 全部やろうとしないのが、続けるコツ。
  A:
  - name: 5分で終わるものから、先に片づける
    emoji: ⚡
    reason: ひとつ終わると、勢いがつく。
  - name: 期限があるものに、印をつける
    emoji: 🚩
    reason: 優先順位がひと目で分かる。
  - name: 頭が働く時間に、重い用事を置く
    emoji: ☀️
    reason: 疲れた時間より、はかどる。
  B:
  - name: 付箋やボードで、見える場所に貼る
    emoji: 📌
    reason: 忘れにくく、終わった達成感もある。
  - name: 週に1回、見直す日をつくる
    emoji: 🗓️
    reason: 先送りを、早めに拾える。
  - name: 予定と予定の間に、余白をつくる
    emoji: 🫧
    reason: 遅れても、全体が崩れにくい。
  - name: スマホのリマインダーを使う
    emoji: ⏰
    reason: 忘れたくないことを、機械に任せられる。
  C:
  - name: 色分けに、凝りすぎる
    emoji: 🎨
    reason: きれいだが、続けるのが大変になる。
  - name: 完璧な計画表を、つくる
    emoji: 📐
    reason: つくって満足しやすい。簡単なもので十分。
  - name: 全部を、同じ重要度で並べる
    emoji: ⚖️
    reason: 何から手をつけるか、決められなくなる。
  D:
  - name: 頭の中だけで、覚えておく
    emoji: 🧠
    reason: 思い出すたびに疲れる。忘れる不安も残る。
  - name: 夜中に思いついた用事を抱えたまま寝る
    emoji: 🌙
    reason: 頭が休まらない。枕元にメモを置くと安心。
  - name: 「あとでやる」を、何度も先送りする
    emoji: 📉
    reason: 気持ちの重さだけが、積もっていく。
  - name: 1日に、予定を詰め込みすぎる
    emoji: 📦
    reason: ひとつ遅れると、全部が崩れる。
summary: 'やることが多い日は、頭の中がいっぱいで、何から始めればいいか分からなくなる。S級は、まず全部書き出して、頭の外に出すこと。それだけで、気持ちがかなり軽くなる。

  そのうえで、今日やることを3つだけ選ぶ。全部やろうとしないのがコツ。

  反対に、頭の中だけで覚えておくのはD級。思い出すたびに、気持ちが疲れてしまう。

  完璧な計画表より、「今日の3つ」のほうがずっと続く。できなかった分は、明日に回していい。

  朝のうちに「今日の3つ」を決める時間を、2〜3分だけつくってみて。夜に見返して、終わったものに線を引くと、1日の達成感が目に見える。終わらなかったものは、消さずに明日の最初に移す。それだけで、「やり残した」という重さが、ぐっと軽くなる。

  週末に10分だけ、1週間ぶんを見返す時間をとると、先送りしがちなものに気づける。同じ用事を何度も後回しにしているなら、それは「大きすぎる」サイン。「資料を開く」「電話番号を調べる」のように、最初の一歩だけに小さく切り分けると、動き出しやすい。'
