title: 韓国ドラマ ファンタジー Tier表
description: トッケビ、星から来たあなた、ホテルデルーナ、W、ムービング…韓国のファンタジードラマを、AIが「設定の面白さ×ときめき」でランク付け。
category: kanryu
tags: [韓国ドラマ, ファンタジー]
published: 2026-09-29
criteria: |
  ① 設定の面白さ・新しさ
  ② ファンタジー設定がちゃんと物語に生きているか
  ③ ロマンスやドラマとしての満足度
rank_notes:
  S: 設定も物語も、両方最高
tiers:
  S:
    - name: トッケビ〜君がくれた愛しい日々〜（2016）
      emoji: "🕯️"
      reason: コン・ユ、キム・ゴウン、イ・ドンウク出演。不死のトッケビ、死神、花嫁という設定を、ロマンスとユーモアで美しくまとめた。韓国ファンタジーの代表作。
    - name: ムービング（2023）
      emoji: "🦸"
      reason: リュ・スンリョン、ハン・ヒョジュ出演。超能力を持つ親子たちの物語。アクションだけでなく家族の愛が泣ける、韓国発の本格ヒーロードラマ。
  A:
    - name: 星から来たあなた（2013）
      emoji: "⭐"
      reason: キム・スヒョンとチョン・ジヒョン主演。400年地球に住む宇宙人とトップ女優の恋。コメディとSFロマンスの絶妙な配合。
    - name: ホテルデルーナ〜月明かりの恋人〜（2019）
      emoji: "🏨"
      reason: IUとヨ・ジング主演。幽霊だけが泊まるホテルの物語。毎回の幽霊のエピソードと衣装の美しさが魅力。
    - name: W -君と僕の世界-（2016）
      short: W 君と僕の世界
      emoji: "✏️"
      reason: イ・ジョンソクとハン・ヒョジュ主演。ウェブ漫画の世界と現実を行き来する。設定の斬新さはトップクラス。
    - name: ソンジェ背負って走れ（2024）
      emoji: "⏰"
      reason: ビョン・ウソクとキム・ヘユン主演。推しを救うためのタイムスリップ。ファンタジー設定が切なさを最大限に引き出している。
    - name: '君の声が聞こえる（2013）'
      emoji: "👂"
      reason: 'イ・ボヨンとイ・ジョンソク主演。人の心の声が聞こえる少年と国選弁護士の物語。法廷サスペンスとロマンスが絶妙。'
  B:
    - name: 屋根部屋のプリンス（2012）
      emoji: "🤴"
      reason: ユチョンとハン・ジミン主演。朝鮮時代の王子が現代のソウルにタイムスリップ。カルチャーギャップの笑いが楽しい。
    - name: 青い海の伝説（2016）
      emoji: "🧜"
      reason: イ・ミンホとチョン・ジヒョン主演。人魚と詐欺師の恋。映像は華やかだが、物語は王道寄り。
    - name: '悪鬼（2023）'
      emoji: "👻"
      reason: 'キム・テリ主演。悪鬼に取りつかれた女性と、鬼が見える民俗学者の物語。本格的な韓国オカルトホラー。'
    - name: 'Sweet Home -俺と世界の絶望-（2020）'
      short: 'Sweet Home'
      emoji: "🏢"
      reason: 'ソン・ガン主演のNetflixシリーズ。人間が怪物に変わる世界で、マンションの住民たちが生き残りをかけて戦う。'
    - name: '還魂（2022）'
      emoji: "🔮"
      reason: 'イ・ジェウクとチョン・ソミン主演。魂を入れ替える術がある架空の国のファンタジー時代劇。世界観の作り込みがすごい。'
  C:
    - name: 九尾狐伝〜不滅の愛〜（2020）
      emoji: "🦊"
      reason: イ・ドンウク主演。現代に生きる九尾の狐の物語。キャラクターは魅力的だが、S〜Aの作品と比べると物語のまとまりで一歩劣る。
    - name: '九家の書（2013）'
      emoji: "🐺"
      reason: 'イ・スンギとスジ主演。半人半獣の青年が人間になろうとする時代劇ファンタジー。キャラクターは魅力的だが物語は王道。'
    - name: '華遊記（2017）'
      emoji: "🐵"
      reason: 'イ・スンギとオ・ヨンソ主演。西遊記を現代に置き換えたファンタジー。設定は面白いが、途中から展開が散らかりがち。'
summary: |
  いいファンタジーは「設定のための物語」ではなく「物語のための設定」になっている。トッケビもムービングも、不思議な力が家族や愛を描くためにある。
  韓国ファンタジーは、ロマンスが好きならトッケビ、アクションが好きならムービングから。
related: [kandrama-junai, kandrama-jidaigeki, kandrama-2010s]
