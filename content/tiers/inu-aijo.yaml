title: 犬の愛情表現・しぐさの意味 Tier表
description: しっぽを振る、お腹を見せる、見つめる、顔をなめる…犬が「好き」を伝えるしぐさを、愛情の深さと分かりやすさでS〜Dにランク付け。誤解しやすいサインも。
category: animals
tags: [犬, 動物, あるある]
published: 2026-10-03
labels:
  S: 最大の信頼
  A: かなり好き
  B: 好き
  C: ふつうの愛情
  D: 勘違いしやすい
criteria: |
  ① 信頼や愛情の深さ
  ② サインの分かりやすさ
  ③ 飼い主が気づけるか
  ※ 犬の気持ちは個体差が大きく、ここに書いたのは「よく言われる意味」です。ほかのしぐさと合わせて見てください
rank_notes:
  S: 「あなたが大好き」
  D: 愛情表現のようで、そうでないことも
tiers:
  S:
    - name: 飼い主のそばでリラックスして眠る
      short: そばで眠る
      emoji: "💤"
      reason: 犬は眠っている間が無防備なので、安心して眠るのは最高の信頼の証。足元やひざの上で寝息を立てていたら、完全に心を許している。
    - name: 目を合わせてやわらかい表情で見つめる
      short: やわらかい視線
      emoji: "🥰"
      reason: 力が抜けた表情で目を合わせるのは、安心や愛情のサインと言われる。飼い主を見つめる犬の目には、愛情を感じる人も多い。
    - name: 全力でお出迎えする
      short: お出迎え
      emoji: "🏠"
      reason: 帰宅した飼い主に、しっぽを振って全身で喜ぶ。1日で何度でも、全力で喜んでくれる。
  A:
    - name: お腹を見せる
      emoji: "🐶"
      reason: 急所のお腹を見せるのは、信頼しているサインと言われる。撫でてほしいのかもしれないが、犬によっては服従や不安のサインのこともあるので、様子も見る。
    - name: そっと体をくっつけて寄りかかる
      short: 寄りかかる
      emoji: "🫂"
      reason: 体を寄せて安心を得ようとする行動。ぬくもりを分け合うことで、犬も安心している。
    - name: あごを足やひざにのせる
      short: あごをのせる
      emoji: "😌"
      reason: 甘えたいときや、くつろいでいるときの定番のしぐさ。そのまま動けなくなって、ついそっとしてあげたくなる。
    - name: あとをついてくる
      emoji: "🐾"
      reason: 家の中でも、飼い主の姿を追ってついてくる犬は多い。そばにいたい、安心できる存在だと思っているサイン。
  B:
    - name: 顔や手をなめる
      short: なめる
      emoji: "👅"
      reason: 愛情や、あいさつの気持ちの表れと言われる。子犬のころの、母犬の口をなめる行動の名残とも。過剰なら、遊びに切り替えるのも手。
    - name: おもちゃを持ってくる
      short: おもちゃを持ってくる
      emoji: "🎾"
      reason: 「遊ぼう」のお誘いや、うれしい気持ちを分けたい行動。飼い主を信頼しているからこそ、見せてくれる。
    - name: 飛びついてくる
      emoji: "🐕"
      reason: うれしさがあふれて、体が先に動く。かわいいが、子どもや高齢者にはケガの心配もあるので、落ち着いてから迎える練習をする。
    - name: ため息をつく
      emoji: "😮"
      reason: 長く息を吐くのは、リラックスして満足しているときに多いと言われる。静かな時間を一緒に過ごせている証拠。
    - name: 前足でちょいちょいと触ってくる
      short: ちょいちょい
      emoji: "🐾"
      reason: 注意をひきたいときや、撫でてほしいときの合図。構ってあげると、ますますやるようになることもある。
  C:
    - name: 鼻をくっつけてくる
      emoji: "👃"
      reason: においを確かめるあいさつの行動。愛情の表れのことも、ただの好奇心のこともある。
    - name: ごはん前のおねだり顔
      emoji: "🍽️"
      reason: 愛情と食欲が混ざった、いちばん難しい表情。かわいすぎて、つい負けそうになる。
    - name: 首をかしげて聞いてくれる
      short: 首をかしげる
      emoji: "🤔"
      reason: 飼い主の声に注意を向けているしるし。愛情というより、興味と理解の表れ。
  D:
    - name: しっぽを振る
      emoji: "🐕"
      reason: 振っているからといって、うれしいとは限らない。高く速く振るのは興奮、低く小さく振るのは不安のことも。体全体の様子を見て判断する。
    - name: あくびをする
      emoji: "🥱"
      reason: 眠いだけでなく、緊張をほぐそうとするサインのことも。いつもより多いときは、ストレスがないか様子を見る。
summary: |
  犬の愛情表現でいちばん深いのは、「安心してそばで眠ること」と「やわらかい視線」。どちらも、飼い主を心から信頼している状態。
  しっぽを振るのは、うれしいときだけではない。しぐさは単独ではなく、体全体で読むと、犬の気持ちが分かりやすくなる。
related: [inu-aruaru, inu-nakigoe, neko-aijo]
