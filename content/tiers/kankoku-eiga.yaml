title: 韓国映画の名作 Tier表
description: パラサイト、新感染、殺人の追憶、オールド・ボーイ、私の頭の中の消しゴム、8月のクリスマス…韓国映画の名作を、知名度と印象の強さでS〜Dにランク付け。
category: entame
tags: [名作, 映画, 韓国ドラマ]
published: 2026-10-05
labels:
  S: 殿堂入り
  A: 大人気
  B: 名作
  C: 渋い名作
  D: 通好み
criteria: |
  ① 知名度・世代を超えた愛され度
  ② 作品の印象の強さ（映像・脚本・演出）
  ③ 海外での評価や、その後への影響
  ※ 好みで順位は大きく変わります。結末などは書いていません。日本公開時の題名で並べています。これは、AIが基準を決めて並べた、ひとつの見方です
rank_notes:
  S: 韓国映画の代表格
  D: 好きな人はとことん好き
tiers:
  S:
    - name: パラサイト 半地下の家族
      short: パラサイト
      emoji: "🏠"
      reason: ポン・ジュノ監督作。カンヌ国際映画祭の最高賞（パルム・ドール）と、アカデミー賞の作品賞を受賞した作品として知られ、韓国映画の名を世界に広げた。
    - name: 新感染 ファイナル・エクスプレス
      short: 新感染
      emoji: "🚆"
      reason: 走る列車を舞台にした、ゾンビ・パニック映画。日本でも大きな話題になり、韓国映画のイメージを広げた1本。
    - name: 私の頭の中の消しゴム
      short: 私の頭の中の消しゴム
      emoji: "🧼"
      reason: 若い夫婦の、切なく美しい純愛を描いた作品。日本でも涙した人が多く、韓流ブームのなかで、よく語られる。
  A:
    - name: 殺人の追憶
      emoji: "🔍"
      reason: 実際の事件をもとにした、サスペンス。ポン・ジュノ監督の代表作のひとつとして、評価が高い。
    - name: オールド・ボーイ
      emoji: "🔨"
      reason: パク・チャヌク監督のサスペンス。衝撃的な展開と映像が、強烈な印象を残す。
    - name: 8月のクリスマス
      emoji: "🎄"
      reason: 静かな恋を描いた、日本でも愛される作品。穏やかな雰囲気が魅力。
    - name: シュリ
      emoji: "🕊️"
      reason: 南北の分断を背景にした、アクション大作。韓国映画が世界に注目されるきっかけのひとつ。
    - name: 猟奇的な彼女
      emoji: "👊"
      reason: 破天荒な彼女と青年の、ラブコメディ。アジアでヒットし、日本でも話題になった。
    - name: タクシー運転手 約束は海を越えて
      short: タクシー運転手
      emoji: "🚕"
      reason: 実話をもとにした、感動のヒューマンドラマ。主演のソン・ガンホの演技が印象的。
  B:
    - name: 母なる証明
      emoji: "👩"
      reason: 息子を守ろうとする母の姿を描いた、サスペンス。ポン・ジュノ監督作。
    - name: JSA
      emoji: "🪖"
      reason: 南北の国境で起きた事件を描いたサスペンス。当時、韓国で大ヒットした。
    - name: ブラザーフッド
      emoji: "👬"
      reason: 朝鮮戦争を背景にした、兄弟の物語。迫力ある戦闘シーンが話題になった。
    - name: 最後まで行く
      emoji: "🚗"
      reason: ひとつの事件から、泥沼にはまっていくサスペンス。展開の速さが魅力。
    - name: 国際市場で逢いましょう
      emoji: "🛍️"
      reason: 激動の時代を生き抜いた、ひとりの男性の人生を描いた作品。家族愛の物語。
    - name: 82年生まれ、キム・ジヨン
      short: キム・ジヨン
      emoji: "📖"
      reason: ベストセラー小説の映画化。ある女性の日常を通して、社会のありかたを問いかける。
  C:
    - name: 悪魔を見た
      emoji: "🩸"
      reason: 復讐をテーマにした、暴力的な描写の強いサスペンス。見る人を選ぶ。
    - name: 観相師
      emoji: "🧐"
      reason: 人の顔から運命を読む男が、歴史の事件に巻き込まれる時代劇。
    - name: 1987、ある闘いの真実
      short: 1987
      emoji: "📅"
      reason: 実際にあった事件をもとにした、社会派のドラマ。
    - name: 密偵
      emoji: "🕶️"
      reason: 日本の統治時代を背景にした、スパイ・サスペンス。映像のスタイリッシュさが魅力。
  D:
    - name: 工作 黒金星と呼ばれた男
      short: 工作
      emoji: "🕵️"
      reason: 南北の情報戦を描いた、実話ベースのスパイ映画。静かな緊張感で、通好みの評価を受ける。
    - name: ベテラン
      emoji: "🚨"
      reason: 悪を追う刑事たちを描いた、痛快な刑事アクション。大ヒットした一方、好みが分かれる。
summary: |
  韓国映画のSは、世界的な評価を得た「パラサイト」と、日本でも大ヒットした「新感染」、涙の純愛「私の頭の中の消しゴム」。ジャンルの幅広さが、韓国映画の魅力。
  ドラマとは違う、凝縮された映画ならではの迫力がある。あなたのいちばん好きな韓国映画は、何ランク？ ぜひ一言コメントで教えてね。
related: [ghibli-eiga, pixar-eiga, music-showa-kayo]
