title: いもの種類 Tier表
description: さつまいも、じゃがいも、里芋、山芋（長芋）、こんにゃくいも、ヤーコン、むかご、タロイモ、安納芋、紫芋、新じゃが…いもの種類を、AIが「おいしさ×使いやすさ×食べごたえ」でランク付け。
category: food
genre: 野菜・果物
tags:
