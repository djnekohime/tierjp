title: かき氷のシロップ Tier表
description: いちご、メロン、ブルーハワイ、レモン、宇治金時、練乳、マンゴー、みぞれ…かき氷のシロップを、AIが「食べたい度×夏らしさ×見た目」でランク付け。
category: food
genre: スイーツ
tags: [グルメ, あるある]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① かき氷屋さん・屋台で「まずこれ」と思える人気
  ② 夏らしさ・涼しさ
  ③ 見た目のかわいさ・楽しさ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: かき氷の三大シロップ
  D: 大人のかき氷
tiers:
  S:
    - name: いちご
      emoji: "🍓"
      reason: かき氷の王様。真っ赤なシロップと練乳の組み合わせは、夏の定番中の定番。
    - name: 宇治金時
      emoji: "🍵"
      reason: 抹茶のシロップに小豆をのせた、和風かき氷の代表。京都・宇治の抹茶にちなんだ名前。
    - name: 練乳（ミルク）
      short: 練乳
      emoji: "🥛"
      reason: どのシロップにも合わせられる、まろやかな甘さ。練乳だけのかき氷もおいしい。
  A:
    - name: メロン
      emoji: "🍈"
      reason: 鮮やかな緑色が夏らしい。屋台のかき氷の人気者。
    - name: ブルーハワイ
      emoji: "🔵"
      reason: 青い色が涼しげで、見た目のインパクトは一番。「何味なのか分からない」のも魅力。
    - name: マンゴー
      emoji: "🥭"
      reason: 果肉たっぷりのマンゴーのかき氷は、台湾スイーツの影響で大人気に。
    - name: レモン
      emoji: "🍋"
      reason: さっぱりした酸味で、暑い日にすっきり。
    - name: みぞれ
      emoji: "🤍"
      reason: 透明な砂糖のシロップ。シンプルだからこそ、氷の口どけがよく分かる。
  B:
    - name: 天然のいちごソース（果肉入り）
      short: 果肉いちご
      emoji: "🫐"
      reason: 本物のいちごをたっぷり使ったソース。専門店のかき氷で味わいたい。
    - name: 黒蜜きなこ
      emoji: "🟤"
      reason: 黒蜜の甘さときなこの香ばしさ。和風かき氷の人気者。
    - name: ピーチ
      emoji: "🍑"
      reason: 桃の甘い香り。ピンク色がかわいい。
    - name: コーラ
      emoji: "🥤"
      reason: 炭酸飲料の味のシロップ。子供に人気。
    - name: 白くま（鹿児島）
      short: 白くま
      emoji: "🐻‍❄️"
      reason: 練乳のかき氷にフルーツや小豆をのせた、鹿児島名物。上から見ると白くまの顔に見える。
  C:
    - name: ぶどう
      emoji: "🍇"
      reason: 紫色のシロップ。定番だが、屋台では見かける機会が少なめ。
    - name: パイナップル
      emoji: "🍍"
      reason: 甘酸っぱい南国の味。
  D:
    - name: 専門店の創作かき氷
      short: 専門店の創作かき氷
      emoji: "✨"
      reason: ふわふわの氷に、エスプーマや自家製ソースを重ねた専門店のかき氷。行列してでも食べたい大人の一杯。
    - name: 梅
      emoji: "🟣"
      reason: 梅の甘酸っぱさで、さっぱりした大人のかき氷。
summary: |
  かき氷のシロップは、いちご・宇治金時・練乳がS。いちごミルクや宇治金時ミルクのように、練乳と合わせるのが最強の組み合わせ。
  鹿児島の白くま、台湾風のマンゴーかき氷、専門店のふわふわ氷と、かき氷は屋台のおやつから、行列ができるスイーツへと進化している。
related: [food-ice, food-yatai]
