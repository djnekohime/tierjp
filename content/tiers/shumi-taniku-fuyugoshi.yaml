title: 多肉植物の冬越しのコツ Tier表
description: 水やりを控える、日当たり、室内に取り込む、霜よけ、暖房の風…多肉植物の冬越しのコツを、ゾーマが「枯らしにくさ×手軽さ×失敗の防ぎやすさ」でS〜Dにランク付け。
category: shumi
tags:
- 初心者
- 冬
published: '2026-11-25'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 枯らしにくさ

  ② 手軽さ

  ③ 失敗の防ぎやすさ

  ※ 多肉植物は種類によって育つ季節が違います（冬に育つタイプもあります）。お持ちの品種の育て方を確認してください。ランクは一般的な目安です'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 冬は水やりを控えめにする
    emoji: 💧
    reason: 成長がゆっくりになるので、水のやりすぎは根腐れのもと。
  - name: 日当たりのいい場所に置く
    emoji: ☀️
    reason: 冬の日光は貴重。光が足りないと、ひょろひょろに伸びる。
  - name: 霜・凍結から守る（寒い夜は室内へ）
    emoji: ❄️
    reason: 凍ると細胞が傷み、溶けたあとぐずぐずになる。
  A:
  - name: 室内の明るい窓辺に置く
    emoji: 🪟
    reason: 光と寒さよけを両立できる、冬の定番の置き場所。
  - name: 水やりは、晴れた日の午前中に
    emoji: 🌤️
    reason: 夕方に水をやると、夜の冷え込みで土が冷えたままに。
  - name: 暖房の風が直接当たらない場所に置く
    emoji: 🌬️
    reason: 乾燥しすぎて、葉がしわしわになることがある。
  - name: 自分の多肉の「育つ季節のタイプ」を確認する
    emoji: 🔖
    reason: 冬に育つタイプもある。お世話の仕方が変わる。
  - name: 寒い夜は、窓から少し離す
    emoji: 🌙
    reason: 夜の窓辺は意外と冷える。昼と夜で場所を変えるのも手。
  B:
  - name: 鉢の下に、すのこや台を置く
    emoji: 🪵
    reason: 床や棚からの冷えが伝わりにくくなる。
  - name: 屋外なら、軒下に移す
    emoji: 🏠
    reason: 霜や冷たい雨を避けられる。地域の寒さに合わせて判断。
  - name: 簡易温室・ビニールカバーを使う
    emoji: 🏕️
    reason: 寒さよけになるが、晴れた日の高温と蒸れに注意。
  - name: 紅葉（色づき）を楽しむ
    emoji: 🍁
    reason: 適度な寒さと日光で、赤やピンクに色づく種類も多い。
  - name: 冬の植え替えは避けて、春まで待つ
    emoji: ⏳
    reason: 成長が止まる時期の植え替えは、根が傷みやすい。
  C:
  - name: 心配して、毎日鉢を動かす
    emoji: 🔄
    reason: 環境が変わりすぎると、かえって弱ることがある。
  - name: 室内の暗い場所にしまい込む
    emoji: 🌑
    reason: 寒さはしのげても、光不足でひょろひょろに伸びやすい。
  - name: 冬に肥料をあげる
    emoji: 🧪
    reason: 成長がゆっくりな時期は、肥料が負担になりやすい。
  D:
  - name: 冬もいつも通り、たっぷり水をやる
    emoji: 🌊
    reason: 根腐れのいちばんの原因。土が乾いてから控えめに。
  - name: 暖房の風が当たる場所に置く
    emoji: ♨️
    reason: 急な乾燥で、葉が傷みやすい。
  - name: 霜の当たる屋外に、出しっぱなしにする
    emoji: 🥶
    reason: 一晩の霜で、ぐずぐずになってしまうことがある。
summary: '多肉植物は、水やりが少なくていい、育てやすい植物として人気。でも、冬は意外と失敗が多い季節だ。いちばんの原因は、寒さと、水のやりすぎ。多くの多肉植物は、気温が下がると成長がゆっくりになり、水をあまり吸わなくなる。そこにいつもと同じように水をあげると、土が乾かず、根が傷んでしまう。S級は「冬は水やりを控えめにする」「日当たりのいい場所に置く」「霜や凍結から守る（寒い夜は室内へ）」の3つ。

  ただし、多肉植物と一口に言っても、種類によって育つ季節が違う。春や秋に育つタイプ、夏に育つタイプ、そして冬に育つタイプもある。自分の多肉がどのタイプかを、ラベルや図鑑で確認しておくと、冬のお世話がぐっと分かりやすくなる。

  A級は、室内の明るい窓辺に置く、晴れた日の暖かい時間に水をやる、暖房の風が直接当たらない場所に置く、など。夜の窓辺は意外と冷えるので、寒い夜は窓から少し離すのもいい。水やりは、土がしっかり乾いてから、晴れた日の午前中に。夕方に水をやると、夜の冷え込みで土が冷たいままになる。

  D級は「冬もいつも通りたっぷり水をやる」「暖房の風が当たる場所に置く」「霜の当たる屋外に出しっぱなし」。どれも、冬の多肉が弱るいちばんの原因になる。

  冬の間に、色づき（紅葉）を楽しめる種類も多い。寒さに少し当たると、赤やピンクに色が変わり、夏とは違う姿を見せてくれる。これは、適度な寒さと日光があるからこそ。守りすぎず、甘やかしすぎず、ちょうどいい距離感で見守るのが、冬越し成功のコツ。

  春になって新しい葉が出てきたら、冬越し成功の合図。あなたの家の多肉は、どこで冬を越す？ ぜひ自分のTier表を作ってみてほしい。'
