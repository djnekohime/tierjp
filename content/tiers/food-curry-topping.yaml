title: カレーのトッピング Tier表
description: カツ、チーズ、ゆで卵、ハンバーグ、唐揚げ、ほうれん草、なす、納豆、福神漬け…カレーのトッピングを、AIが「追加したい度×カレーとの相性×満足感」でランク付け。
category: food
genre: カレー
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① カレー屋さんで「これを追加したい」と思える人気
  ② カレーのルーとの相性
  ③ 一皿の満足感をどれだけ上げるか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: カレー屋さんの三大トッピング
tiers:
  S:
    - name: カツ
      emoji: "🐖"
      reason: カツカレーは、日本のカレーの最強の形。サクサクの衣がルーを吸っていく変化も楽しい。
    - name: チーズ
      emoji: "🧀"
      reason: とろけたチーズがカレーをまろやかに。辛いカレーが苦手な人の味方。
    - name: ゆで卵
      emoji: "🥚"
      reason: 半熟卵を崩してルーと混ぜると、コクが増す。値段も手ごろな定番トッピング。
  A:
    - name: ハンバーグ
      emoji: "🍖"
      reason: カレーとハンバーグの組み合わせは、子供も大人も大好き。
    - name: 唐揚げ
      emoji: "🍗"
      reason: ボリュームを足したいときに。カツより軽く食べられる。
    - name: ほうれん草
      emoji: "🥬"
      reason: 彩りと栄養をプラス。ほうれん草カレーとして人気のトッピング。
    - name: なす
      emoji: "🍆"
      reason: 揚げたなすはカレーをたっぷり吸って、とろとろに。
    - name: ソーセージ
      emoji: "🌭"
      reason: パリッとした食感とうまみ。子供に人気。
  B:
    - name: 納豆
      emoji: "🫘"
      reason: 意外に合う組み合わせで、カレー専門店の人気トッピングにもなっている。好みは分かれる。
    - name: コロッケ
      emoji: "🥔"
      reason: ほくほくのコロッケをカレーにのせて、ボリューム満点に。
    - name: シーフード
      emoji: "🦐"
      reason: えびやいかで、海の幸のうまみを足す。
    - name: 温泉卵
      emoji: "🍳"
      reason: とろっとした黄身がルーにからんで、まろやかに。
    - name: 牛すじ
      emoji: "🐂"
      reason: とろとろに煮込んだ牛すじで、カレーにコクと深みを。
  C:
    - name: 福神漬け
      emoji: "🔴"
      reason: カレーの添え物の定番。トッピングというより、なくてはならない脇役。
    - name: らっきょう
      emoji: "⚪"
      reason: カリカリの食感と甘酸っぱさで、口の中をリセットしてくれる。好きな人はたっぷりのせる。
  D:
    - name: 生卵
      emoji: "🥚"
      reason: 大阪のカレー店などで見かける、カレーに生卵をのせて混ぜて食べるスタイル。地域の食べ方として根強い人気。
    - name: 揚げもち
      emoji: "⬜"
      reason: カレーを吸ったもちの食感が楽しい、知る人ぞ知るトッピング。
summary: |
  カレーのトッピングは、カツ・チーズ・ゆで卵がS。どれも、カレーの辛さとコクを受け止めて、満足感を一段上げてくれる。
  納豆や生卵のように、「意外だけどおいしい」トッピングが多いのもカレーの懐の深さ。
related: [food-curry-gu, food-curry-shurui]
