title: AIでメールの下書きを作るコツ Tier表
description: 目的を伝える、相手との関係を書く、トーンの指定、個人情報は入れない、最後は自分で読む…AIでメールや連絡文の下書きを作るコツを、ゾーマが「仕上がり×安全性×手間の少なさ」でS〜Dにランク付け。
category: ai
tags:
- 初心者
- 安全性
published: '2026-11-10'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 仕上がり（伝わるか）

  ② 安全性（個人情報・機密を守れるか）

  ③ 手間の少なさ

  ※ AIサービスのデータの扱いや規約は、サービスごとに違い、変わることがあります。仕事や契約に関わる文面は、最終的に必ず自分で確認してください。専門家の助言ではなく目安です'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 個人情報・機密情報は入力しない（仮名に置き換える）
    emoji: 🔒
    reason: 情報漏れを防ぐ、いちばん大切なルール。
  - name: 目的・相手・雰囲気の3つを、最初に伝える
    emoji: 🎯
    reason: 指示が具体的だと、イメージに近い文面になる。
  - name: 最後は必ず、自分で読んで直す
    emoji: 👀
    reason: 事実の誤りや、不自然な言い回しを防げる。
  A:
  - name: 日付・金額・固有名詞を、必ず確認する
    emoji: 🔍
    reason: AIは、もっともらしい間違いをすることがある。
  - name: 丁寧さの度合い（カジュアル〜フォーマル）を指定する
    emoji: 🎩
    reason: 場面に合ったトーンになる。
  - name: 文字数や、段落の数を指定する
    emoji: 📏
    reason: 長すぎ・短すぎを防げる。
  - name: いくつか案を出してもらい、選ぶ
    emoji: 🎲
    reason: 比べると、いちばん合うものが見つかる。
  - name: 自分の過去の文章の言い回しを、参考に伝える
    emoji: 🪞
    reason: 自分らしさが出て、直す手間も減る。
  B:
  - name: 件名の案も、いっしょに作ってもらう
    emoji: 📨
    reason: 内容が伝わる件名は、読んでもらいやすい。
  - name: 断る・お詫びの文面を、やわらかく整えてもらう
    emoji: 🙇
    reason: 言いにくいことの下書きに便利。ただし気持ちは自分の言葉で。
  - name: 返信メールの下書きを、元メール（仮名化）から作る
    emoji: ↩️
    reason: 返す内容が整理しやすい。
  - name: 敬語のチェックだけをお願いする
    emoji: ✅
    reason: 自分で書いた文を、整える使い方。
  - name: よく使う指示を、テンプレートとして保存する
    emoji: 📂
    reason: 次から素早く使える。
  C:
  - name: 長文のメールの要約を、AIにまとめてもらう
    emoji: 📄
    reason: 便利だが、重要な部分が抜けることも。原文も確認。
  - name: AIの文面を、そのまま全部コピーして送る
    emoji: 📋
    reason: 不自然さや、誤りに気づけない。
  - name: 感情的な内容を、AIにきれいに整えさせる
    emoji: 🌀
    reason: トラブルの種になることも。冷静になってから。
  D:
  - name: 契約や金銭に関わる文面を、確認なしで送る
    emoji: 🚨
    reason: 取り返しがつかなくなる恐れがある。専門家にも確認を。
  - name: 顧客リストや社内資料を、そのまま貼り付ける
    emoji: ⛔
    reason: 情報漏えいにつながる。絶対に避けたい。
summary: 'メールや連絡文を書くのが苦手でも、AIを使えば、下書きは数十秒でできる。ただし、使い方を間違えると、かえって失礼な文面になったり、大事な情報が漏れたりする。

  S級は、目的をはっきり伝えること、個人情報や機密情報を入れないこと、そして最後は必ず自分で読んで直すこと。AIはあくまで下書き係。最終判断は人間がする。

  指示のコツは、「誰に」「何のために」「どんな雰囲気で」の3つを伝えること。たとえば「お世話になっている取引先に、納期の延長をお願いするメールを、丁寧だけれど堅すぎない雰囲気で」と書くと、イメージに近い文面が出やすい。

  注意したいのは、実名、住所、電話番号、会社の内部情報を、そのまま入力しないこと。「Aさん」「B社」のように置き換えて、あとで自分で書き換えれば、安全に使える。

  AIは、事実と違うことをもっともらしく書くことがある。日付、金額、固有名詞、約束の内容は、必ず確認しよう。

  出てきた文面は、自分の言葉に少し直すと、あなたらしさが残る。毎回直す部分が決まってきたら、「私はこう言い回す」と指示に入れておくと、さらに手間が減る。便利な道具として、上手に使ってね。

  AIが作った下書きを、毎回少しずつ直していくうちに、「自分の言葉」で書くコツも身についてくる。AIは先生のような存在としても使える。

  ただし、AIのサービスは、規約やデータの扱いが変わることがある。仕事で使う場合は、勤務先のルールも確認しておこう。便利さと安全を両立させて、ストレスの少ないやりとりを目指してね。'
