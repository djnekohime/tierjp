    reason: 噛むほどにうまみが出る。ずっと噛んでいられる。
  - name: 柿の種
    emoji: 🌶️
    reason: ピリ辛のせんべいと、ピーナッツ。止まらない組み合わせ。
  A:
  - name: チーズ鱈
    emoji: 🧀
    reason: チーズと鱈のコンビ。ビールにも日本酒にも合う。
  - name: ミックスナッツ
    emoji: 🌰
    reason: アーモンド、カシューナッツ、くるみ。ワインにも合う。
  - name: ビーフジャーキー
    emoji: 🥩
    reason: 噛みごたえがあって、お肉の味がぎゅっと詰まっている。
  - name: あたりめ
    emoji: 🐙
    reason: 炙って食べると、香ばしくて最高。
  - name: サラミ
    emoji: 🥓
    reason: ワインにも、ビールにも合う。
  B:
  - name: 燻製チーズ
    emoji: 💨
    reason: スモークの香りで、ウイスキーにも合う。
  - name: 貝ひも
    emoji: 🐚
    reason: 甘辛く煮た貝ひも。噛みごたえがある。
  - name: ポテトチップス
    emoji: 🥔
    reason: 乾き物ではないけど、つい手が出る。
  - name: ドライフルーツ
    emoji: 🍇
    reason: ワインのおともに。
  C:
  - name: おつまみ昆布
    emoji: 🌿
    reason: 酸っぱくて、じんわり。好き嫌いが分かれる。
  - name: 小魚アーモンド
    emoji: 🐟
    reason: 栄養たっぷりで、おつまみにもなる。
  D:
  - name: エイヒレ
    emoji: 🪽
    reason: 炙って、マヨネーズと七味で。日本酒のおつまみの通。
  - name: いかの塩辛風スナック
    short: 塩辛風スナック
    emoji: 🦑
    reason: 塩辛の味を乾燥させた、通好みのつまみ。
summary: '乾き物のおつまみは、ピーナッツ・さきいか・柿の種がS。噛むほどにおいしい、昔ながらの定番。

  お酒を飲まない人も、おやつとして楽しめる。ビールにはピーナッツ、日本酒にはあたりめ、ワインにはチーズ。

  '
