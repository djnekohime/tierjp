title: おつまみ（乾き物） Tier表
description: ピーナッツ、さきいか、チーズ鱈、ナッツ、ビーフジャーキー、あたりめ、柿の種、サラミ、燻製チーズ、貝ひも、ミックスナッツ…乾き物のおつまみを、AIが「お酒が進む度×手が止まらない度」でランク付け。
