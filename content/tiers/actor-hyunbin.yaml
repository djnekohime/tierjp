title: ヒョンビン出演作 Tier表
description: 愛の不時着、シークレット・ガーデン、私の名前はキム・サムスン…ヒョンビンの出演ドラマ・映画を、AIが「作品の面白さ×ヒョンビンの魅力」でランク付け。
category: kanryu
tags: [韓国ドラマ, 俳優, ヒョンビン]
published: 2026-09-29
criteria: |
  ① 作品そのものの面白さ
  ② ヒョンビンの魅力が最大限に出ているか
  ③ ファンでない人にもすすめられるか
  ※ ドラマと映画の両方を対象
rank_notes:
  S: ヒョンビンを知るならまずこれ
tiers:
  S:
    - name: 愛の不時着（2019）
      emoji: "🪂"
      reason: ソン・イェジンと共演。北朝鮮の将校リ・ジョンヒョク役で、無口で一途な優しさが世界中の視聴者の心をつかんだ。代表作中の代表作。
    - name: シークレット・ガーデン（2010）
      emoji: "🌹"
      reason: ハ・ジウォンと共演。高慢な御曹司とスタントウーマンの魂が入れ替わるファンタジーラブコメ。俺様キャラなのに憎めない、ヒョンビンの魅力が全開。
  A:
    - name: 私の名前はキム・サムスン（2005）
      emoji: "🍰"
      reason: キム・ソナと共演。わがままなレストラン社長役で一躍スターに。ラブコメの名作としても今なお評価が高い。
    - name: アルハンブラ宮殿の思い出（2018）
      emoji: "🎮"
      reason: パク・シネと共演。AR（拡張現実）ゲームを題材にしたサスペンス。設定の新しさは随一で、ヒョンビンの緊迫した演技が光る。
    - name: '晩秋（2010）'
      emoji: "🍂"
      reason: 'タン・ウェイと共演した映画。シアトルを舞台に、3日間だけ外出を許された女性と謎の男の出会いを描く。静かで大人の余韻が残る名作。'
    - name: 'コンフィデンシャル／共助（2017）'
      short: 'コンフィデンシャル'
      emoji: "🔫"
      reason: 'ユ・ヘジンと共演したアクション映画。北朝鮮の刑事役で、キレのあるアクションとユ・ヘジンとの凸凹コンビが大ヒットした。'
    - name: 'ハルビン（2024）'
      emoji: "🚂"
      reason: '独立運動家・安重根を演じた歴史映画。重厚な映像の中で、苦悩する人間としての姿を演じ切った。'
  B:
    - name: 彼らが生きる世界（2008）
      emoji: "🎬"
      reason: ソン・ヘギョと共演。ドラマ制作の現場で働く人たちの恋と仕事。静かで大人っぽい作品で、じっくり見たい人向け。
    - name: ハイド・ジキル、私（2015）
      emoji: "🎭"
      reason: ハン・ジミンと共演。二重人格の御曹司を一人二役で演じ分ける。演技の見どころは多いが、物語の評価はやや控えめ。
    - name: '交渉（2018）'
      emoji: "📞"
      reason: 'ソン・イェジンと共演した映画。人質事件を起こした犯人役で、いつもと違う悪役の顔を見せた。'
    - name: 'コンフィデンシャル：国際共助捜査（2022）'
      short: 'コンフィデンシャル2'
      emoji: "🤝"
      reason: '大ヒット映画の続編。前作のコンビにダニエル・ヘニーが加わり、スケールが大きくなった痛快アクション。'
  C:
    - name: 雪の女王（2006）
      emoji: "⛄"
      reason: ソン・ユリと共演。心に傷を抱えた青年の切ない純愛。美しいが悲しい展開が続くので、見る人を選ぶ。
    - name: '王の涙 -イ・サンの決断-（2014）'
      short: '王の涙'
      emoji: "🏯"
      reason: '朝鮮王朝の王・正祖を演じた時代劇映画。王の暗殺計画をめぐる緊迫の一日を描く。重厚だが地味な印象。'
    - name: '猖獗（2018）'
      emoji: "🧟"
      reason: '朝鮮時代を舞台にしたゾンビアクション映画。剣を振るう王子役でアクションは見応えがあるが、作品の評価は分かれた。'
    - name: '愛してる、愛してない（2011）'
      emoji: "☔"
      reason: 'イム・スジョンと共演した映画。別れを決めた夫婦の最後の一日を、静かに見つめる。とても静かな作品で人を選ぶ。'
summary: |
  ヒョンビンは「ツンとしているのに優しい」役で最も輝く俳優。愛の不時着とシークレット・ガーデンはその魅力が最高潮に達した2本。
  若い頃のキム・サムスンから見ると、俳優としての成長がよく分かる。時間があれば年代順に見るのもおすすめ。
related: [kandrama-2010s, kandrama-junai]
