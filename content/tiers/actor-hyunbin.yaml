title: ヒョンビン出演ドラマ Tier表
description: 愛の不時着、シークレット・ガーデン、私の名前はキム・サムスン…ヒョンビンの出演ドラマを、AIが「作品の面白さ×ヒョンビンの魅力」でランク付け。
category: kanryu
tags: [韓国ドラマ, 俳優, ヒョンビン]
published: 2026-09-29
criteria: |
  ① 作品そのものの面白さ
  ② ヒョンビンの魅力が最大限に出ているか
  ③ ファンでない人にもすすめられるか
rank_notes:
  S: ヒョンビンを知るならまずこれ
tiers:
  S:
    - name: 愛の不時着（2019）
      emoji: "🪂"
      reason: ソン・イェジンと共演。北朝鮮の将校リ・ジョンヒョク役で、無口で一途な優しさが世界中の視聴者の心をつかんだ。代表作中の代表作。
    - name: シークレット・ガーデン（2010）
      emoji: "🌹"
      reason: ハ・ジウォンと共演。高慢な御曹司とスタントウーマンの魂が入れ替わるファンタジーラブコメ。俺様キャラなのに憎めない、ヒョンビンの魅力が全開。
  A:
    - name: 私の名前はキム・サムスン（2005）
      emoji: "🍰"
      reason: キム・ソナと共演。わがままなレストラン社長役で一躍スターに。ラブコメの名作としても今なお評価が高い。
    - name: アルハンブラ宮殿の思い出（2018）
      emoji: "🎮"
      reason: パク・シネと共演。AR（拡張現実）ゲームを題材にしたサスペンス。設定の新しさは随一で、ヒョンビンの緊迫した演技が光る。
  B:
    - name: 彼らが生きる世界（2008）
      emoji: "🎬"
      reason: ソン・ヘギョと共演。ドラマ制作の現場で働く人たちの恋と仕事。静かで大人っぽい作品で、じっくり見たい人向け。
    - name: ハイド・ジキル、私（2015）
      emoji: "🎭"
      reason: ハン・ジミンと共演。二重人格の御曹司を一人二役で演じ分ける。演技の見どころは多いが、物語の評価はやや控えめ。
  C:
    - name: 雪の女王（2006）
      emoji: "⛄"
      reason: ソン・ユリと共演。心に傷を抱えた青年の切ない純愛。美しいが悲しい展開が続くので、見る人を選ぶ。
summary: |
  ヒョンビンは「ツンとしているのに優しい」役で最も輝く俳優。愛の不時着とシークレット・ガーデンはその魅力が最高潮に達した2本。
  若い頃のキム・サムスンから見ると、俳優としての成長がよく分かる。時間があれば年代順に見るのもおすすめ。
related: [kandrama-2010s, kandrama-junai]
