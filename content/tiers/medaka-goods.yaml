title: メダカ飼育の初心者グッズ Tier表
description: これからメダカを飼う人向けに、飼育グッズを「あると助かる度」でランク付け。買いすぎ注意のアイテムも。
category: animals
tags: [メダカ, 初心者, 動物]
published: 2026-09-27
criteria: |
  ① メダカが元気に暮らせるかに直結するか
  ② 初心者の失敗（水の汚れ・病気・全滅）を防げるか
  ③ 値段に見合うか
rank_notes:
  S: 最初にそろえる
  D: 最初は買わなくていい
tiers:
  S:
    - name: 大きめの容器（睡蓮鉢・プラ舟）
      emoji: "🪷"
      reason: 水の量が多いほど水質も水温も安定する。小さな水槽より、屋外なら大きめの鉢やプラ舟の方が失敗しにくい。
    - name: カルキ抜き
      emoji: "💧"
      reason: 水道水の塩素はメダカに有害。汲み置きでも抜けるが、すぐ使えるカルキ抜きがあると水換えがぐっと楽になる。
  A:
    - name: 水草（ホテイアオイ・マツモなど）
      emoji: "🌿"
      reason: 隠れ家・日よけ・産卵場所の3役。水をきれいに保つ助けにもなる。
    - name: メダカ用のエサ
      emoji: "🍚"
      reason: 小さな口に合う粒の大きさで食べ残しが出にくい。量は「数分で食べきれる分」が目安。
  B:
    - name: 小さな網
      emoji: "🥅"
      reason: 引っ越しや水換えの時にあると便利。メダカを傷つけにくい目の細かいものを選ぶ。
    - name: 水温計
      emoji: "🌡️"
      reason: 夏の高水温・冬の低水温に気づける。屋外飼育では特に安心材料になる。
  C:
    - name: ろ過フィルター
      emoji: "⚙️"
      reason: 室内の小さな水槽なら役立つが、大きめの容器と水草で十分な場合も多い。水流が強すぎるとメダカが疲れるので注意。
  D:
    - name: 飾りのオブジェ・派手な砂利
      emoji: "🗿"
      reason: 見た目は楽しいが、すき間に汚れがたまりやすく掃除が大変になる。慣れてから足しても遅くない。
summary: |
  メダカ飼育の失敗の多くは「水が小さい・汚れる」ことから始まる。だから1位は機材より、大きめの容器とカルキ抜き。
  最初は「容器・カルキ抜き・水草・エサ」の4点で十分。慣れてきたら、網や水温計を足していくのがおすすめ。
related: [neko-omocha]
