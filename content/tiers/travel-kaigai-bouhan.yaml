title: 海外旅行の防犯対策 Tier表
description: 貴重品の分散、スリ対策、ひったくり、ぼったくり…海外旅行の防犯対策を、AIが「効果×簡単さ×必須度」でS〜Dにランク付け。
category: travel
tags:
- 旅行
- 初心者
- 防犯
published: '2026-10-07'
labels:
  S: 外しにくい
  A: 満足度が高い
  B: 目的しだい
  C: 慣れてから
  D: おすすめしにくい
criteria: '① 被害を防ぐ効果

  ② 簡単さ（すぐ実践できるか）

  ③ 必須度

  ※ 国や地域、時期で状況は違います。出発前に、外務省の「海外安全情報」（海外安全ホームページ）で、行き先の最新情報を確認してください'
rank_notes:
  S: 必ずやりたい
  D: 危険・避けたい行動
tiers:
  S:
  - name: 貴重品を分けて持つ（財布・カード・現金）
    emoji: 💼
    reason: 1か所にまとめると、盗まれたとき全部失う。ホテルの金庫と、持ち歩きに分ける。
  - name: 出発前に「海外安全情報」を確認
    emoji: 📋
    reason: 行き先の最新の治安・注意点が分かる。外務省の海外安全情報で確認できる。
  A:
  - name: バッグは前に持つ・しっかり閉める
    emoji: 🎒
    reason: スリは、後ろや開いたバッグを狙う。ファスナーつき、体の前で持つ。
  - name: スマホを人混みで出しっぱなしにしない
    emoji: 📱
    reason: ひったくりに狙われやすい。地図は立ち止まって見る。
  - name: パスポートのコピーと写真を別に保管
    emoji: 📄
    reason: 紛失しても、再発行の手続きがスムーズになる。スマホにも保存しておく。
  - name: カードの連絡先をメモしておく
    emoji: 💳
    reason: 盗難のとき、すぐ止められる。スマホが盗まれても分かるよう、紙にも。
  B:
  - name: 派手な服装・ブランド品を避ける
    emoji: 👜
    reason: 目立たないほうが、狙われにくい。
  - name: 夜道・人気のない道を避ける
    emoji: 🌙
    reason: 被害に遭いやすい場所を避ける。タクシーを使うほうが安全。
  - name: 現金を見せびらかさない
    emoji: 💵
    reason: 支払いのときも、財布の中身を見せない。
  - name: 配車アプリ・正規のタクシーを使う
    emoji: 🚕
    reason: ぼったくりや、白タクを避けられる。
  C:
  - name: 声をかけてくる人を、うのみにしない
    emoji: 🗣️
    reason: 親切を装ったトラブルがある。むやみについていかない。
  - name: ホテルの部屋で、貴重品は金庫に入れる
    emoji: 🔐
    reason: ホテルでも盗難はある。外出時は、貴重品を出しっぱなしにしない。
  - name: 旅行保険に入る
    emoji: 🛡️
    reason: ケガ・病気・盗難に備えられる。カード付帯の保険も確認。
  D:
  - name: 貴重品を宿泊先の部屋に置きっぱなし
    emoji: 🚫
    reason: 盗難の危険がある。金庫か、身につけて持つ。
  - name: 知らない人に、荷物を預ける・持ってもらう
    emoji: ⚠️
    reason: 犯罪に巻き込まれる危険がある。絶対にしない。
  - name: 酔って、一人で出歩く
    emoji: 🍺
    reason: 被害に遭いやすい。飲み過ぎない。
summary: '旅先のトラブルで多いのは、スリ・置き引き・ぼったくり。完璧に防ぐのは難しいけど、「目立たない・隙を見せない・貴重品を分ける」で、被害に遭う確率を大きく下げられる。

  もし被害に遭ったら、まず安全を確保して、警察と、カード会社・大使館に連絡する。'
related:
- kaigai-hajimete
- travel-trouble-taisaku
