title: SNSで気をつけたいこと Tier表
description: 個人情報、写り込み、他人の写真、炎上、著作権、悪口、広告の表記…SNSで気をつけたいことを「トラブルの大きさ」でS〜Dにランク付け。安心して続けるためのチェックリスト。
category: sns
tags: [SNS, 防犯, 初心者]
published: 2026-10-05
labels:
  S: 特に注意
  A: 要注意
  B: 気をつけたい
  C: 心がけたい
  D: 小さな落とし穴
criteria: |
  ① トラブルになったときの大きさ（個人情報・信用・法的な問題）
  ② うっかりやってしまいやすいか
  ③ 一度出ると、消しにくいか
  ※ 一般的な注意点の整理で、法律の助言ではありません。各SNSのルールや、法律は変わるので、最新の情報も確認してください
rank_notes:
  S: 取り返しがつきにくい
  D: 小さいけれど、積み重なる
tiers:
  S:
    - name: 住所・勤務先・学校などの、個人を特定できる情報
      short: 個人を特定できる情報
      emoji: "🏠"
      reason: 投稿の内容や、写真の細部から、場所が特定されることがある。自宅や、よく行く場所が、わかるような書き方は避ける。
    - name: 写真の写り込み（表札・制服・景色・窓・車のナンバー）
      short: 写真の写り込み
      emoji: "📸"
      reason: 背景から、場所や人が分かってしまう。投稿前に、画像の隅々まで確認する。リアルタイムでなく、時間をおいて投稿するのも、安全。
    - name: 他の人の顔・個人情報を、許可なく載せる
      short: 他人の顔・情報
      emoji: "👤"
      reason: 家族や友人でも、本人に確認する。子どもの写真は、特に慎重に。
  A:
    - name: 悪口・誹謗中傷・特定の人への攻撃
      short: 悪口・誹謗中傷
      emoji: "💢"
      reason: 相手を傷つけるだけでなく、法的な責任を問われることもある。感情的なときは、投稿を、いったん保存だけにして、時間をおく。
    - name: 他人の画像・文章・音楽の無断使用
      short: 無断使用
      emoji: "⚖️"
      reason: 権利の侵害になることがある。使うときは、利用条件を確認し、出典を示すか、自分で作ったものを使う。
    - name: デマ・確認していない情報の拡散
      short: デマの拡散
      emoji: "📢"
      reason: 悪気がなくても、広げてしまうと、人を傷つけたり、混乱を招いたりする。出典を確認してから、共有する。
    - name: 一度炎上するような、極端な言い方や、決めつけ
      short: 炎上しやすい発言
      emoji: "🔥"
      reason: 反応が大きくなると、収まりにくい。特定の人・グループを、決めつけるような表現は、避ける。
    - name: 公開の範囲を、確認していない（誰に見えているか）
      short: 公開範囲
      emoji: "👁️"
      reason: 友だち限定のつもりが、公開だったということがある。設定を、ときどき見直す。
  B:
    - name: 広告・PRの表記を、していない
      short: 広告の表記
      emoji: "📣"
      reason: 報酬をもらった投稿や、アフィリエイトは、広告であることを表記するルールがある。表記しないと、信用も失う。
    - name: 位置情報の設定
      short: 位置情報
      emoji: "📍"
      reason: 写真に、位置情報が付いて、場所が分かることがある。投稿前に、設定を確認する。
    - name: 旅行中・留守中に、リアルタイムで投稿する
      short: 留守を知らせる投稿
      emoji: "🧳"
      reason: 家を空けていることが、伝わってしまう。旅行の写真は、帰ってから投稿するほうが、安全。
    - name: 知らない人からのDM・リンク
      short: 知らない人からのDM
      emoji: "✉️"
      reason: 詐欺や、フィッシングのことがある。リンクは開かず、個人情報は教えない。
    - name: 愚痴や自慢が、続きすぎる投稿
      short: 愚痴・自慢の連投
      emoji: "😮"
      reason: たまには、いいが、続くと、見る人が疲れる。ほどよいバランスで。
  C:
    - name: アカウントの、パスワード・二段階認証
      short: パスワード・二段階認証
      emoji: "🔑"
      reason: 乗っ取りを防ぐ基本。パスワードの使い回しは避け、二段階認証を設定する。
    - name: 過去の投稿を、ときどき見直す
      short: 過去の投稿の見直し
      emoji: "🗃️"
      reason: 昔の投稿が、今の自分に合わないことがある。必要なら、整理する。
    - name: コメントや返信の、ルールを決める
      short: 返信のルール
      emoji: "💬"
      reason: 荒らしや、批判的なコメントへの対応を、決めておくと、気が楽になる。
  D:
    - name: 誤字・誤変換・表現のミス
      short: 誤字・誤変換
      emoji: "✏️"
      reason: 小さなことだが、印象に影響する。投稿前に、一度読み返す。
    - name: 夜中の勢いでの投稿
      short: 夜中の勢い投稿
      emoji: "🌙"
      reason: 感情が高ぶっているときの投稿は、後で後悔しやすい。翌朝、読み返してから、出す。
summary: |
  SNSの安全のSは、「個人を特定できる情報」「写り込み」「他人の顔・情報」。一度出ると、消しにくいので、投稿前の確認が、いちばんの防御。
  悪口や無断使用、デマも、トラブルのもと。感情が動いたときは、少し時間をおいてから、出すのがおすすめ。安心して、長く、楽しく続けよう。
related: [sns-short-neta, sns-profile, okane-sagi]
