summary: '三重は、北部の四日市・鈴鹿から、中部の津、南部の伊勢志摩まで、地域ごとに地元のスーパーがある県。四日市の一号館、鈴鹿のスーパーサンシ、津のマルヤス、伊勢のぎゅーとらなど。

  愛知発のカネスエやヤマナカなども、県内に店舗を持っている。'
