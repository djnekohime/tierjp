summary: '舞台の魅力は、目の前で生身の人が演じる、その一回きりの空気を味わえること。映画や配信にはない、迫力と、客席みんなで作る空気感がある。

  S級は、公演の公式情報を事前に確認すること、時間に余裕を持って会場へ向かうこと、あらすじを軽く予習しておくこと。この3つだけで、ぐっと安心して楽しめる。

  席は、前の方が表情まで見えて迫力があり、後ろの方は全体の動きや照明、フォーメーションがよく見える。どちらにもよさがあるので、好みで選ぼう。

  双眼鏡は、表情を見たい人には心強いが、ずっと使うと舞台全体を見逃す。たまに使うくらいが、ちょうどいい。

  マナーとして、上演中の撮影・録音は、基本的にNG。スマホの電源は切るか、機内モード。咳やくしゃみが出そうなときは、ハンカチで押さえよう。

  開演前に、トイレを済ませておくことも大切。途中休憩の時間は、公演によって違うので、確認しておくと安心。

  観終わったあと、感想を誰かと話したり、ひとことメモに残したりすると、余韻がずっと続く。ぜひ、気軽に、一度足を運んでみてほしい。

  舞台には、ミュージカル、演劇、歌舞伎、コンサート形式など、さまざまなジャンルがある。最初は、あらすじが分かりやすく、上演時間が長すぎない作品から選ぶと、気軽に楽しめる。

  観終わったあとに、お気に入りのシーンを1つ、誰かに話してみよう。生の舞台の余韻は、その日だけの宝物。ルールを守って、まわりの人とも気持ちよく、素敵な時間を過ごしてね。'
