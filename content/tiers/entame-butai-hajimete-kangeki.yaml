criteria: '① 楽しさ

  ② 安心感（マナー・失敗の少なさ）

  ③ 準備のしやすさ

  ※ 公演ごとに、上演時間・撮影や録音のルール・入場の決まりが違います。必ず公式の案内を確認してください'
