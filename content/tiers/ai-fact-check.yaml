title: AIの答えを確認する方法 Tier表
description: 公的機関のサイトで確認、複数の情報源と比べる、日付を見る、数字や固有名詞を調べる、専門家に聞く…AIの答えが正しいかを確かめる方法を「確実さ・手軽さ」でS〜Dにランク付け。
category: ai
tags: [AI, 初心者]
published: 2026-10-05
labels:
  S: いちばん確実
  A: かなり頼れる
  B: 補助的に
  C: 参考程度
  D: これだけは危ない
criteria: |
  ① 確実さ（間違いを見つけやすいか）
  ② 手軽さ（すぐできるか）
  ③ いろいろな内容に使えるか
  ※ AIは、もっともらしい間違いを、自信ありげに答えることがあります。確認する習慣が、いちばんの防御です。どれくらい確認するかは、「間違えたときの影響の大きさ」で決めましょう
rank_notes:
  S: まずここで確認
  D: 確認したことにならない
tiers:
  S:
    - name: 公的機関・公式サイトの情報で確認する
      short: 公式サイトで確認
      emoji: "🏛️"
      reason: 法律・制度・数字・病気・安全のことは、省庁、自治体、公式な団体のサイトで確認するのが、最も確実。AIの答えは、調べる入り口として使う。
    - name: 一次情報（元の資料・論文・原文）にあたる
      short: 元の資料にあたる
      emoji: "📑"
      reason: 引用や要約は、元の文章と見比べるのが基本。AIが要約したものは、元の意味とずれることがある。
  A:
    - name: 複数の、別々の情報源と見比べる
      short: 複数の情報源と比べる
      emoji: "⚖️"
      reason: 同じことを、別の信頼できる情報源でも確認できれば、安心。ひとつのサイトだけで、決めない。
    - name: 情報の日付を確認する
      short: 日付を確認
      emoji: "📅"
      reason: 制度や価格、サービスの内容は、変わることが多い。古い情報を、今の話として答えていないか、確認する。
    - name: 数字・固有名詞・年号を、ひとつずつ検索する
      short: 数字・固有名詞を調べる
      emoji: "🔢"
      reason: AIは、数字や名前を、取り違えることがある。大事な部分だけでも、検索して確かめる。
    - name: 「その根拠は？」「出典は？」と、聞き返す
      short: 根拠を聞く
      emoji: "🔗"
      reason: 手がかりになる。ただし、出典として挙げられたものが、実在しないこともあるので、実際に開いて確認する。
    - name: 専門家（医師・弁護士・税理士など）に相談する
      short: 専門家に相談
      emoji: "🩺"
      reason: 命や、お金、権利に関わることは、専門家に確認するのが、いちばん安全。
  B:
    - name: AIに「間違っていないか、もう一度確認して」と頼む
      short: AIに再確認させる
      emoji: "🔁"
      reason: 間違いに気づいて直してくれることもある。ただし、同じ間違いを繰り返すこともあるので、これだけでは、確認とは言えない。
    - name: 別のAIにも、同じ質問をして比べる
      short: 別のAIで比べる
      emoji: "🤖"
      reason: 答えが違えば、確認が必要なサインになる。同じ答えでも、両方が間違っていることはある。
    - name: 自分の知識や経験と、照らし合わせる
      short: 自分の経験と比べる
      emoji: "🧠"
      reason: おかしいと感じる直感は、意外と頼りになる。違和感があれば、調べるきっかけに。
    - name: 書かれている内容が「具体的すぎないか」を見る
      short: 具体的すぎないか
      emoji: "🔎"
      reason: 細かい数字や名前が、あまりに具体的に並んでいたら、念のため、確認する。
    - name: 説明の筋道に、矛盾がないか読み直す
      short: 矛盾がないか読む
      emoji: "📖"
      reason: 前後で言っていることが違う、というのは、間違いのサイン。
  C:
    - name: SNSでの、他の人のコメント
      short: SNSのコメント
      emoji: "💬"
      reason: 参考になる体験談もあるが、誤情報や、うわさも多い。事実の確認には、向かない。
    - name: AIの答えの「口調の自信」で、判断する
      short: 口調で判断
      emoji: "😎"
      reason: 自信ありげな言い方と、正しさは、関係がない。口調に惑わされない。
    - name: 検索結果の、上位に出たものを、そのまま信じる
      short: 検索の上位を信じる
      emoji: "🔝"
      reason: 上位に出ることと、正確なことは、別。広告や、まとめサイトも混ざっている。
  D:
    - name: 確認せずに、そのまま人に伝える・公開する
      short: 確認せず公開
      emoji: "🚫"
      reason: いちばん危ない使い方。間違いを広げてしまい、信用を失うことにもなる。
    - name: 「AIが言ったから大丈夫」と考える
      short: AIが言ったから
      emoji: "🤷"
      reason: AIは、間違えることがある。責任は、使う人にある。
summary: |
  確認のSは、「公的機関・公式サイトで確認」と「元の資料にあたる」。法律・制度・数字・健康のことは、必ず、ここで確かめる。
  AIは、調べる入り口や、下書きに使うのが、得意。「確認する習慣」さえあれば、とても頼れる助手になる。大事なことほど、最後は、人が確かめよう。
related: [ai-nani-makaseru, ai-shitsumon-kotsu, ai-gazou-chui]
