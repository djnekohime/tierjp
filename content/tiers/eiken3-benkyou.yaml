title: 英検3級の勉強法 Tier表
description: 大人の学び直しで英検3級を目指す人向けに、勉強法を「合格への近さ×続けやすさ」でランク付け。
category: manabi
tags: [英語, 英検, 勉強法, 初心者]
published: 2026-09-26
criteria: |
  ① 合格点に直結するか（出題形式に合っているか）
  ② 大人が忙しい毎日の中で続けられるか
  ③ 面接（二次試験）まで対応できるか
rank_notes:
  S: 合格したいなら絶対やる
tiers:
  S:
    - name: 過去問を解く
      emoji: "📝"
      reason: 出題形式・時間配分・よく出る単語が一度に分かる。英検は形式がはっきりした試験なので、過去問を解くことが一番の近道。
    - name: 単語を「例文ごと」覚える
      emoji: "📖"
      reason: 3級は単語が分かれば解ける問題が多い。単語だけでなく短い例文で覚えると、長文やリスニングでも気づけるようになる。
  A:
    - name: リスニングを毎日5分
      emoji: "🎧"
      reason: リスニングは配点が大きいのに後回しにされがち。音声を毎日少しずつ聞くだけで、耳が英語の速さに慣れていく。
    - name: ライティングの型を覚える
      emoji: "✍️"
      reason: 「意見 → 理由2つ → まとめ」の型を覚えておけば、どんなお題でも書ける。短期間で点数が上がりやすい分野。
    - name: '音読する'
      emoji: "🗣️"
      reason: '教科書や過去問の英文を声に出して読む。単語・文法・リスニングの力がまとめて伸びる、効率のいい練習法。'
    - name: '単語アプリを使う'
      emoji: "📱"
      reason: 'スキマ時間に少しずつ単語を覚えられる。忙しい大人の学び直しと相性がいい。'
  B:
    - name: 面接の練習を声に出してする
      emoji: "🙋"
      reason: 二次試験は声に出した経験があるかどうかで差がつく。一次試験の後からでも間に合うのでB。
    - name: 文法を中学英語から復習
      emoji: "🏫"
      reason: 3級の範囲はほぼ中学英語。苦手な単元だけやり直すと効率が良いが、全部をやり直すと時間がかかりすぎる。
    - name: '予想問題集を解く'
      emoji: "📘"
      reason: '過去問を解き終わった後の仕上げに。出題形式に慣れて、本番の緊張を減らせる。'
    - name: 'オンライン英会話で面接練習'
      short: 'オンライン英会話'
      emoji: "💻"
      reason: '二次試験の面接を人相手に練習できる。声に出して答える経験が自信になる。'
    - name: '英語で日記を書く'
      emoji: "📔"
      reason: '短い文でも毎日書くと、ライティングの型が自然に身につく。'
  C:
    - name: 洋画を字幕なしで見る
      emoji: "🎬"
      reason: 楽しいが、スピードも単語も3級より難しすぎる。モチベーション用と割り切るのがおすすめ。
    - name: '英語の歌を聴く'
      emoji: "🎵"
      reason: '楽しく英語に触れられるが、試験の点数に直結するまでには時間がかかる。'
    - name: 'やさしい英語の本を読む（多読）'
      short: '多読'
      emoji: "📖"
      reason: '英語を英語のまま理解する力がつく。ただ3級の短期合格が目標なら、優先度は低め。'
  D:
    - name: 分厚い参考書を最初から全部
      emoji: "📚"
      reason: 最初のページで力尽きるパターンの代表。試験に出ない部分も多いので、過去問で弱点を見つけてから辞書のように使う方が良い。
summary: |
  最短ルートは「過去問で形式を知る → 単語を例文ごと → 毎日リスニング → 型でライティング」。
  大人の学び直しは、完璧より「毎日ちょっとずつ」が勝ち。1日15分でも、試験日から逆算して続ければ3級は十分狙えます。
related: [kankokugo-benkyou]
