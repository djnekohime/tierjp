title: お金の守り方・増やし方の入口 Tier表
description: 預貯金、個人向け国債、新NISA、iDeCo、投資信託、株式、FX、暗号資産…お金の守り方・増やし方を、「始めやすさ・損をするリスクの低さ・仕組みの分かりやすさ」でS〜Dにランク付け。投資の助言ではなく、入口の整理です。
category: money
tags: [お金, 投資, 初心者]
published: 2026-10-05
labels:
  S: まず土台
  A: 入口として知っておきたい
  B: 理解してから
  C: 経験者向き
  D: 初心者は手を出さない
criteria: |
  ① 損をするリスクの低さ（元本が減る可能性の小ささ）
  ② 始めやすさ・仕組みの分かりやすさ
  ③ 税制優遇などの制度の有無
  ※ これは投資の助言や、特定の商品のおすすめではありません。投資には、元本割れ（お金が減る）のリスクがあります。ランクが高いほど「有利」という意味ではなく、「初心者にとって、仕組みが分かりやすく、リスクが小さい順」の整理です。制度や数字は、変わることがあるので、金融庁や各公式サイトで、最新の情報を確認してください。余裕資金で、自分の判断で行ってください
rank_notes:
  S: 投資の前に、まず整えたい土台
  D: 仕組みが複雑で、損失も大きくなりやすい
tiers:
  S:
    - name: 預貯金で、生活防衛資金を作る
      short: 生活防衛資金
      emoji: "🏦"
      reason: 急な出費や、収入が減ったときのための、「使わない前提のお金」。投資を始める前に、まず用意しておくと、不安で売ってしまうことが減る。目安は、人によって違う。
    - name: 家計の見直しで、「入る・出る」を把握する
      short: 家計の把握
      emoji: "📒"
      reason: 投資に回せるお金があるかは、家計が見えてこそ分かる。増やす前に、「守る」と「把握する」が土台になる。
  A:
    - name: 個人向け国債
      short: 個人向け国債
      emoji: "🏛️"
      reason: 国が発行する債券で、元本割れの心配が小さいことが、特徴として説明される。大きく増えることは期待できないが、安全性を重視する人の選択肢。商品の種類と条件は、公式で確認する。
    - name: 新NISA（つみたて投資枠）
      short: つみたて投資枠
      emoji: "🌱"
      reason: 少額から積み立てで投資でき、運用で出た利益が非課税になる制度。年間の投資枠は120万円まで。金融庁が、長期・積立・分散の投資を、後押しするために作った制度。元本割れの可能性はある。
    - name: iDeCo（イデコ）
      short: iDeCo
      emoji: "🔒"
      reason: 老後のための、私的な積み立ての制度。掛金が全額、所得控除の対象になるなどの優遇がある。一方、原則60歳になるまで、引き出せない。使えるお金が減るので、生活の余裕を考えて。
  B:
    - name: 投資信託（インデックスファンドなど）
      short: 投資信託
      emoji: "📈"
      reason: 多くの株式や債券に、まとめて分散して投資できる。少額から始められるが、値動きがあり、元本割れの可能性がある。手数料（信託報酬など）も確認したい。
    - name: 新NISA（成長投資枠）
      short: 成長投資枠
      emoji: "🌿"
      reason: 個別株などにも投資できる枠。年間の投資枠は240万円まで、生涯の非課税保有限度額は、全体で1,800万円（成長投資枠はそのうち1,200万円まで）。自由度が高い分、自己責任の部分も大きい。
    - name: ETF（上場投資信託）
      short: ETF
      emoji: "📊"
      reason: 株のように、市場で売買できる投資信託。取引の仕組みを理解してから始めたい。
    - name: 株式（個別株）
      short: 個別株
      emoji: "🏢"
      reason: 会社の成長に投資する。値動きが大きく、会社の業績によって、元本が大きく減る可能性もある。分散を意識しないと、リスクが偏る。
    - name: 債券（社債・外債など）
      short: 債券
      emoji: "📜"
      reason: 発行する国や会社の信用が、リスクにつながる。種類によって、仕組みや条件が違い、分かりにくい面もある。
  C:
    - name: 金（ゴールド）
      short: 金
      emoji: "🥇"
      reason: 値動きが、株式とは違う動きをすることがあるとされるが、利息や配当は生まれない。保管や手数料の面も、考えておく。
    - name: 不動産投資
      short: 不動産投資
      emoji: "🏠"
      reason: 大きなお金が動き、ローンを使うことも多い。空室や、修繕などのリスクがあり、初心者がいきなり始めるには、ハードルが高い。
    - name: 外貨預金・外国株
      short: 外貨・外国株
      emoji: "💱"
      reason: 為替の変動で、円に換算したときの価値が、大きく変わることがある。手数料も、確認が必要。
  D:
    - name: 暗号資産（仮想通貨）
      short: 暗号資産
      emoji: "🪙"
      reason: 価格の変動がとても大きく、短期間で大きく減る可能性もある。初心者は、仕組みとリスクを、十分理解するまで、手を出さない。
    - name: FX（外国為替証拠金取引）・レバレッジ取引
      short: FX・レバレッジ
      emoji: "⚡"
      reason: 少ない元手で大きな取引ができる一方、損失も大きくなり、元本以上に損をする可能性がある。初心者には、おすすめしにくい。
    - name: 信用取引・先物・オプション
      short: 信用取引・先物
      emoji: "🎢"
      reason: 仕組みが複雑で、損失が大きくなりやすい。経験者向けの取引。
    - name: 「元本保証で高利回り」「必ずもうかる」という話
      short: うますぎる話
      emoji: "🚨"
      reason: 元本保証で高い利回りを約束する話は、詐欺である可能性が高い。「必ずもうかる」「あなただけに」と言われたら、投資ではなく、危険のサインと考える。
summary: |
  いちばん大事なのは、投資の前の土台。「生活防衛資金」と「家計の把握」ができてから、制度（新NISAやiDeCo）や、投資信託のような分散できるものを、少額から学ぶ、という順番が、無理がない。
  逆に、FXや暗号資産、「必ずもうかる」という話は、初心者にはリスクが大きい。投資は、余裕資金で、自分で理解して、納得してから。迷ったら、金融庁や、公的な相談窓口の情報を見てみよう。
related: [okane-kakeibo, okane-sagi, koteihi-minaoshi]
