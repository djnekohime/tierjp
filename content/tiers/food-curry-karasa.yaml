title: カレーの辛さ Tier表
description: 甘口、中辛、辛口、大辛、激辛、超激辛、スパイスカレー、グリーンカレー…カレーの辛さを、AIが「おいしく食べられる度×みんなで食べられる度」でランク付け。
category: food
genre: カレー
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① おいしく食べられる辛さか

  ② 家族やみんなで食べられるか

  ③ カレーの味・香りが楽しめるか

  ※ お店や商品によって「○辛」の基準はちがいます。目安のランキングです

  '
rank_notes:
  S: 家のカレーの定番
  D: 挑戦者向け
tiers:
  S:
  - name: 中辛
    emoji: 🍛
    reason: 家のカレーで一番選ばれる辛さ。辛さとうまみのバランスがちょうどいい。
  - name: 甘口と中辛を半分ずつ
    short: 甘口＋中辛
    emoji: 🤝
    reason: 家族みんなで食べられる、家庭の知恵。ルウを2種類混ぜると、味に深みも出る。
  - name: 辛口
    emoji: 🔥
    reason: しっかり辛くて、スパイスの香りも立つ。大人のカレー。
  A:
  - name: 甘口
    emoji: 🍯
    reason: 子供のころのカレーの味。りんごとはちみつのやさしい甘さ。
  - name: スパイスは強いけど辛くない
    short: 香り系スパイス
    emoji: 🌿
    reason: スパイスカレーやインドカレーには、香りは強くても辛さはひかえめなものも多い。
  - name: ピリ辛
    emoji: 🌶️
    reason: 中辛より少しだけ辛い。汗が出るほどではない、ちょうどいい刺激。
  - name: 大辛
    emoji: 🥵
    reason: 辛口のさらに上。辛いもの好きが「おいしい」と思える最後のライン。
  B:
  - name: あとからじわじわくる辛さ
    short: じわじわ辛
    emoji: ⏳
    reason: 食べはじめは平気なのに、半分くらいで汗が止まらなくなるタイプ。
  - name: グリーンカレーの辛さ
    short: グリーンカレー
    emoji: 🟢
    reason: タイのカレー。ココナッツミルクの甘さのあとに、青唐辛子の辛さがくる。
  - name: 子供向けのやさしい甘口
    short: お子さま甘口
    emoji: 🧸
    reason: 小さい子も食べられる、辛さほぼゼロのカレー。大人には物足りない。
  - name: 甘口＋辛いソースを後がけ
    short: 後がけで調整
    emoji: 🧪
    reason: 家族は甘口、自分だけ辛いソースをかける。一人ずつ辛さを変えられる。
  C:
  - name: 激辛
    emoji: 🌋
    reason: 「5倍」などの激辛。辛さは楽しいけど、カレーの味がわからなくなる日も。
  - name: しびれる辛さ
    emoji: ⚡
    reason: 花椒（中国の山椒）入りの、舌がしびれる辛さ。好きな人はハマる。
  D:
  - name: 超激辛（10倍以上）
    short: 超激辛
    emoji: 💀
    reason: 完食すると名前が貼り出されるような、チャレンジ級の辛さ。挑戦者向け。
  - name: 20倍以上のチャレンジ級
    short: チャレンジ級
    emoji: ☠️
    reason: もはや食べ物というより、体力勝負。食べたあとの胃のことも考えて。
summary: 'カレーの辛さは、中辛・甘口と中辛のブレンド・辛口がS。家族で食べるなら、甘口と中辛を混ぜるか、辛いソースを後がけにするのが便利。

  辛ければ辛いほどおいしい、というわけではない。カレーの香りとうまみがわかる辛さが、いちばんおいしい。

  '
related:
- food-curry-shurui
- food-curry-gu
- food-curry-topping
