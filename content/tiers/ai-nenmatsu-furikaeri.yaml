title: AIと年末の振り返り・来年の目標を作るコツ Tier表
description: 今年の出来事を書き出す、AIに質問してもらう、目標を小さく分ける…AIを使った年末の振り返りと目標づくりを、ゾーマが「役立つ度×続けやすさ×安心」でS〜Dにランク付け。
category: ai
tags:
- 初心者
- AI活用
published: '2026-11-22'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 役立つ度（気づきが増えるか）

  ② 続けやすさ

  ③ 安心（個人情報・プライバシー）

  ※ AIの回答は、正確とは限りません。名前・住所・勤務先・健康や家計の詳細など、個人を特定できる情報は入力しないでください。大きな決断は、自分や身近な人、専門家と相談して決めましょう'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: AIに質問してもらいながら、1年を振り返る
    emoji: 🗣
    reason: 白紙で悩まず、本音を引き出してもらえる。いちばん使いやすい方法。
  - name: 個人情報は入れず、ぼかして相談する
    emoji: 🔒
    reason: プライバシーを守れる。安心して使い続けるための、最低限の約束。
  - name: 今年の「よかったこと」から先に書く
    emoji: 🌟
    reason: 前向きな気持ちで始められ、振り返りが続きやすい。
  A:
  - name: 目標を、小さく3つまでに絞る
    emoji: 🎯
    reason: 欲張らないほうが続く。達成感も得やすい。
  - name: AIに、月ごとの小さな行動に分けてもらう
    emoji: 📅
    reason: 大きな目標が、今日できることに変わる。
  - name: うまくいかなかったことも、「学び」として整理する
    emoji: 🧩
    reason: 責めずに、次に活かせる形に変えられる。
  - name: 手帳・ノートに、自分の言葉で書き写す
    emoji: 📓
    reason: AIの文を写すことで、自分のものになる。
  B:
  - name: AIに、去年の目標との比較を手伝ってもらう
    emoji: ⚖
    reason: 変化に気づける。記録が残っている場合のみ。
  - name: 家族や友だちと、AIの提案について話し合う
    emoji: 👥
    reason: ひとりでは気づけない視点が得られる。
  - name: 1月に、もう一度AIと見直す
    emoji: 🔁
    reason: 三日坊主を防ぎやすい。
  - name: AIに、やりたいことリスト（バケットリスト）を整理してもらう
    emoji: 🪄
    reason: 楽しい気持ちで、来年を考えられる。
  C:
  - name: AIが出した目標を、そのまま採用する
    emoji: 📋
    reason: 自分の気持ちに合わないと、続きにくい。
  - name: 毎日、AIに目標の進み具合を報告する
    emoji: 📲
    reason: 続けば強力だが、負担になることも。
  D:
  - name: 名前・勤務先・住所など、詳しい個人情報を入力する
    emoji: ⚠
    reason: 情報が外に出る恐れがある。入力しない。
  - name: 健康や家計の詳細を、AIの回答だけで判断する
    emoji: 🩺
    reason: 正確とは限らない。専門家や公的機関に確認を。
  - name: AIの答えを、うのみにして大きな決断をする
    emoji: 🌀
    reason: 転職・引っ越しなどは、自分や専門家とよく相談して決めたい。
  - name: 目標を、10個も20個も立てる
    emoji: 📚
    reason: 管理しきれず、全部が中途半端になりやすい。
summary: '年末は、1年を振り返って、来年を考える絶好のタイミング。でも、白紙の前で手が止まりがち。そんなとき、AIは「質問してくれる聞き役」として使える。

  S級は、AIに質問してもらうこと。「今年、うれしかったことは？」「やめたいことは？」と聞いてもらい、答えを書き出していくと、自分でも気づかなかった本音が見えてくる。

  コツは、個人情報を入れないこと。名前や勤務先などは伏せて、「ある会社員」「家族のひとり」など、ぼかして相談する。

  目標は、大きく1つより、小さく3つ。AIに「それを、月ごとの小さな行動に分けてほしい」と頼むと、続けやすい計画になる。

  AIの提案は、あくまで参考。自分の気持ちに合わなければ、遠慮なく変えていい。最終的に決めるのは自分だと、忘れないこと。

  1月の最初に、もう一度AIと一緒に見直すと、三日坊主を防げる。振り返りの内容は、手帳やノートに書き写して残しておくと、1年後の自分への手紙になる。

  振り返りのあとは、「来年やめること」を1つ決めるのもおすすめ。やることを足すだけでなく、減らす決断が、気持ちの余裕をつくる。AIに「今年の私に、ねぎらいの言葉をかけて」と頼んでみるのも、意外と心があたたまる。ただし、AIの言葉が、人からの言葉の代わりになるわけではない。気持ちがつらいときは、身近な人や、相談窓口に頼ってね。年末の静かな夜に、ホットドリンクを片手に、ゆっくり1年を振り返ってみよう。'
