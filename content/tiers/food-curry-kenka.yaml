title: 入れるとケンカになるカレーの具 Tier表
description: じゃがいも、にんじん、玉ねぎ、豚肉、牛肉、チキン、シーフード、ナス、コーン、チーズ、ゆで卵、りんご、はちみつ…カレーに入れるか、入れないかで意見が割れる具を、AIが「議論が盛り上がる度」でランク付け。
category: food
genre: カレー
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 家族や友達で意見が割れるか

  ② 入れたときの「おいしい派」の数

  ③ 入れたときの「えー派」の数

  ※ ランクは「正解」ではなく、「みんなの意見が割れる度」の目安です

  '
rank_notes:
  S: 戦争になる
  D: ほぼみんな賛成
tiers:
  S:
  - name: じゃがいも
    emoji: 🥔
    reason: 入れる派と入れない派が、家庭で永遠にもめる。ごろっとか、とろけるまで煮込むか。
  - name: 豚肉・牛肉・鶏肉のどれか
    short: 肉の種類
    emoji: 🥩
    reason: 肉の種類は、家庭によって「うちはこれ」が固定されている。
  - name: りんご・はちみつ
    short: りんご・はちみつ
    emoji: 🍎
    reason: 隠し味にするか。入れると甘くなる派と、カレーは辛いものだ派。
  A:
  - name: ゆで卵
    emoji: 🥚
    reason: のせるか、のせないか。半熟派と固ゆで派もいる。
  - name: ナス
    emoji: 🍆
    reason: 夏カレーの定番。入れる派はこだわる。
  - name: チーズ
    emoji: 🧀
    reason: 入れるととろっと、こってり。賛否両論。
  - name: コーン
    emoji: 🌽
    reason: 子供は喜ぶ。大人は、いるかなあ？と悩む。
  B:
  - name: シーフード
    emoji: 🦐
    reason: エビやイカを入れるシーフードカレーは、別の料理という派。
  - name: きのこ
    emoji: 🍄
    reason: 入れるとうまみが出る。入れない派は「歯ごたえが…」と言う。
  - name: トマト
    emoji: 🍅
    reason: さっぱりして、おいしくなる。入れない派は少数。
  - name: ほうれん草
    emoji: 🥬
    reason: 緑が入るとヘルシー。お店ではよく見るけど、家では少ない。
  C:
  - name: にんじん
    emoji: 🥕
    reason: 入れない家庭は少ない。でも、大きすぎると子供が残す。
  - name: 玉ねぎ
    emoji: 🧅
    reason: とろけるまで炒めるのが基本。入れない人はほぼいない。
  D:
  - name: ご飯の上に福神漬け
    short: 福神漬け
    emoji: 🟥
    reason: これを入れるか、別皿にするか。ほぼ全員が「あると嬉しい」派。
  - name: らっきょう
    emoji: ⚪
    reason: カレーのおともの定番。好きな人は絶対ほしい。
summary: 'カレーに入れるかどうかで割れるのは、じゃがいも・肉の種類・隠し味のりんごとはちみつ。家庭によって、うちのカレーが決まっている。

  どれが正解かは、ない。自分の家のカレーが、一番おいしいカレー。

  '
related:
- food-curry-gu
- food-curry-topping
- food-curry-kakushiaji
