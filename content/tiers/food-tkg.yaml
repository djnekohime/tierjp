title: 卵かけご飯の追加具材 Tier表
description: しょうゆだけでも最高の卵かけご飯に、何を足す？ ごま油、のり、納豆、明太子、チーズ、バター、天かす…追加具材を、AIが「おいしさアップ度×手軽さ」でランク付け。
category: food
genre: ご飯もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 卵かけご飯がどれだけおいしくなるか
  ② 冷蔵庫にありそうな手軽さ
  ③ 卵とご飯の味をじゃましないか
  ※ 生卵は新鮮なものを使い、体調が気になるときは控えてください
rank_notes:
  S: 足すだけで別次元のおいしさ
  D: 冒険したい日のアレンジ
tiers:
  S:
    - name: 刻みのり
      emoji: "⬛"
      reason: 磯の香りが加わって、一気に料亭の朝ごはんのような一杯に。のりと卵としょうゆは鉄板の組み合わせ。
    - name: ごま油
      emoji: "🫗"
      reason: 数滴たらすだけで香ばしさが広がり、韓国風のコクのある味に。塩と合わせるのもおすすめ。
    - name: 納豆
      emoji: "🫘"
      reason: 卵と納豆のダブルのねばねばで、ふわふわの食感に。栄養もたっぷりの最強の朝ごはん。
  A:
    - name: 明太子
      emoji: "🌶️"
      reason: 卵のまろやかさに明太子のピリ辛と塩気。ぜいたくな一杯になる。
    - name: 天かす
      emoji: "🟡"
      reason: サクサク食感とだしのうまみがプラスされる。めんつゆと合わせると、たぬきご飯のよう。
    - name: かつお節
      emoji: "🪵"
      reason: うまみと香りがぐっと増す。しょうゆとの相性は抜群。
    - name: バター
      emoji: "🧈"
      reason: 熱々のご飯でとろけたバターが、卵をさらにまろやかに。洋風のこってり卵かけご飯に。
    - name: 刻みねぎ
      emoji: "🧅"
      reason: シャキシャキ食感とさわやかな香り。どんな組み合わせにも合う名脇役。
  B:
    - name: チーズ
      emoji: "🧀"
      reason: 粉チーズでカルボナーラ風に、とろけるチーズでとろとろに。黒こしょうを足すと大人の味。
    - name: しらす
      emoji: "🐟"
      reason: やさしい塩気とうまみ。ご飯と卵の味をじゃませず、上品な一杯に。
    - name: キムチ
      emoji: "🥬"
      reason: 辛さと酸味で、ごま油と合わせれば韓国風の卵かけご飯に。
    - name: めんつゆ
      emoji: "🍶"
      reason: しょうゆの代わりにすると、だしのきいたまろやかな味に。
    - name: 塩昆布
      emoji: "🌿"
      reason: 塩気とうまみを一度に足せる。ごま油と合わせると止まらない。
  C:
    - name: ツナ
      emoji: "🥫"
      reason: ボリュームが出て、マヨネーズを足せばツナマヨ卵かけご飯に。好みは分かれる。
    - name: 辣油
      emoji: "🔥"
      reason: ピリ辛で食欲がわく。入れすぎると卵の味が消えるのが注意点。
  D:
    - name: 砂糖
      emoji: "🍬"
      reason: 地域や家庭によっては、甘い卵かけご飯が当たり前のことも。驚かれるが、甘じょっぱさがおいしいという人もいる。
    - name: オリーブオイルと塩
      short: オリーブオイル
      emoji: "🫒"
      reason: しょうゆを使わない洋風の卵かけご飯。意外な組み合わせだが、卵の味が引き立つ。
summary: |
  卵かけご飯の追加具材は、刻みのり・ごま油・納豆がS。どれも、卵としょうゆの味を引き立てながら、別のおいしさを足してくれる。
  砂糖を入れる家庭もあれば、オリーブオイルで洋風にする人もいる。シンプルな料理だからこそ、アレンジは無限大。
related: [food-gohan-otomo, food-onigiri]
