    emoji: 🙈
    reason: 仕上がりがゆがみ、きれいに作れない。最初の折り目が大切。
  - name: 仕上げを急いで、のりやテープで雑に仕上げる
    emoji: 💨
    reason: 見た目が崩れやすい。ていねいに仕上げたい。
summary: '折り紙は、一枚の紙があれば、いつでも始められる手軽な趣味。年末が近づく今の時期は、お正月飾りやクリスマス飾りにもぴったりだ。

  S級に置いたのは、鶴、箱、星の3つ。鶴は定番で、何度折っても飽きず、千羽鶴のように数を重ねても映える。箱は、小物入れやお菓子入れとして実用的。星は、ガーランドにすると、冬の部屋が華やかになる。

  A級は、ぴょんぴょんかえる・手裏剣・風船・コマなど、折ったあとで遊べるもの。子どもと一緒に折ると、会話も弾む。

  コツは、はじめに折り目をしっかりつけること。折り紙の角をきちんと合わせると、仕上がりがきれいになる。指の腹で、折り目をなぞるだけでも違う。

  D級に置いたのは、「難易度の高いものを、最初から無理に折る」「小さい折り紙を、子どもやペットの手の届くところに置く」。誤飲やけがの原因になり、楽しめなくなってしまう。

  飾り方の工夫としては、①色の組み合わせを3色くらいに絞る ②糸でつなげてガーランドにする ③季節の飾りとして、玄関や窓辺に置く、の3つがおすすめ。完成した作品は、写真に残しておくと、あとで楽しく見返せる。

  また、折り紙は気持ちが落ち着く時間にもなる。1日10分だけでも、折ることに集中するのは、気分転換にぴったりだ。

  折り紙は、道具がほとんどいらないのが魅力。寒い日の夜、温かい飲み物を用意して、静かな音楽を流しながら折る時間は、ちょっとした贅沢だ。完成した作品を、手紙に添えたり、友だちにプレゼントしたりすると、気持ちが伝わって、喜ばれることも多い。'
