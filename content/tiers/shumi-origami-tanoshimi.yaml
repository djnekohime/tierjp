  - name: 星
    emoji: ⭐
    reason: ガーランドにすると、冬の部屋が華やかに。クリスマス飾りにも向く。
  A:
  - name: ぴょんぴょんかえる
    emoji: 🐸
    reason: 折ったあと、遊べる。子どもと一緒に折ると盛り上がる。
  - name: 手裏剣
    emoji: ⭐
    reason: ひとひねりで作れて、かっこいい。遊びにも飾りにも使える。
  - name: 風船
    emoji: 🎈
    reason: ふくらませて遊べて、軽い飾りにもなる。折り方も、わりと簡単。
  - name: コマ
    emoji: 🪀
    reason: 回して遊べる。折り紙のサイズで、回り方が変わる。
  - name: ハート
    emoji: 💗
    reason: ちょっとしたメッセージに添えるのにぴったり。
  - name: お正月飾り（鶴・扇など）
    emoji: 🎍
    reason: 年末年始の玄関や窓辺に。季節感が出て、家が明るくなる。
  B:
  - name: 花（チューリップ・桜など）
    emoji: 🌷
    reason: 色の組み合わせで、華やかに。季節の飾りになる。
  - name: 動物（犬・猫・うさぎなど）
    emoji: 🐱
    reason: 愛着がわく。顔を描き入れると、個性が出る。
  - name: ガーランド（連続飾り）
    emoji: 🎀
    reason: 同じ形をつなげるだけで、部屋の印象が変わる。
  - name: ポチ袋
    emoji: 🧧
    reason: お正月やお礼のとき、ちょっとした気持ちを包める。
  - name: 箸袋
    emoji: 🥢
    reason: 食卓がちょっと華やぐ。来客のときにも使える。
  - name: ミニ立体ツリー
    emoji: 🎄
    reason: クリスマスのテーブル飾りに。ふたつ折りで作れるものもある。
  C:
  - name: くす玉（ユニット折り）
    emoji: 🔮
    reason: 完成すると華やか。数が多く、時間がかかるので、根気のある日に。
  - name: 千羽鶴に、挑戦する
    emoji: 🕊
    reason: 気持ちがこもる。完成まで時間がかかるので、小さな目標から。
  - name: 大きな折り紙を、使う
    emoji: 🟥
    reason: 折りやすいが、収納や飾る場所をとる。
