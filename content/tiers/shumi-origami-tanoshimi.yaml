title: 折り紙を楽しむ・おうち飾りにするコツ Tier表
description: 鶴、ぴょんぴょんかえる、星、箱、お正月飾り…折り紙を楽しむコツと、おうち飾りにできる折り方を、ゾーマが「作りやすさ×飾り映え×続けやすさ」でS〜Dにランク付け。
category: shumi
tags:
- 初心者
- あるある
published: '2026-11-18'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 作りやすさ

  ② 飾り映え

  ③ 続けやすさ

  ※ 折り方の名前を挙げたランクです。小さな子どもやペットのいるご家庭では、小さな折り紙の誤飲に気をつけてください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
