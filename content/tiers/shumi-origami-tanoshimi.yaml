    emoji: 🧩
    reason: 途中でつまずき、嫌になりやすい。やさしいものから慣らしたい。
  - name: 小さな折り紙を、子どもやペットの手の届く場所に置く
    emoji: ⚠
    reason: 誤飲の危険がある。置き場所に注意したい。
