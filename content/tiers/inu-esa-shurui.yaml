title: 犬のごはんの種類 Tier表
description: ドライ、ウェット、半生、療法食、手作りごはん…犬のごはんを、栄養・続けやすさ・安全性でS〜Dにランク付け。
category: animals
tags:
- 犬
- 動物
- 初心者
published: '2026-10-06'
criteria: '① 毎日それだけで必要な栄養をとれるか

  ② 続けやすさ（手間・入手のしやすさ）

  ③ 安全性

  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。動物の種類・年齢・体質・量で影響は変わります。心配なときは、様子を見すぎず、動物病院に相談してください。持病や体質にあわせたごはんは、必ず獣医さんと相談して決めてください'
rank_notes:
  S: 迷ったらまずここ
  D: ふだんの主食にはおすすめしにくい
tiers:
  S:
  - name: 総合栄養食のドライフード
    short: ドライフード
    emoji: 🥣
    reason: 水とそのフードだけで、必要な栄養がとれるように作られている。保存しやすく、歯や口の中の汚れも比較的つきにくい。犬の大きさにあった粒のものを選ぶ。
  - name: 体の大きさ・年齢にあわせたフード
    short: 体格・年齢別
    emoji: 🐕
    reason: 小型犬・大型犬、子犬・成犬・シニアで、必要なエネルギーや栄養は違う。体にあった種類を選ぶのが基本。
  A:
  - name: ドライにウェットをトッピング
    short: ウェットトッピング
    emoji: 🍽️
    reason: 食欲が落ちたときや、好き嫌いのある犬に使いやすい。トッピングの分は、ごはんの量を減らして調整する。
  - name: 総合栄養食のウェットフード（缶・パウチ）
    short: ウェットフード
    emoji: 🥫
    reason: 水分をとりやすく、においも強くて、食べやすい。開けたあとは傷みやすいので、残りは早めに処理。
  - name: 子犬用フード
    short: 子犬用
    emoji: 🍼
    reason: 成長に必要なエネルギーや栄養が多い。子犬の時期は、成犬用ではなく子犬用を。回数は小分けにする。
  - name: シニア犬用フード
    short: シニア用
    emoji: 👴
    reason: 年齢にあわせて、消化しやすさやエネルギー量が考えられている。7歳ごろから、切りかえを考える目安になる。
  - name: 獣医師が指示する療法食
    short: 療法食
    emoji: 🩺
    reason: 腎臓や皮膚、アレルギーなど、病気や体質にあわせて作られたフード。自己判断で与えず、獣医さんの指示で。
  B:
  - name: 半生（セミモイスト）タイプ
    short: 半生タイプ
    emoji: 🥩
    reason: やわらかく食いつきがよい。ただ、糖分や保存料が多めのものもあるので、原材料の表示を確認する。
  - name: 一般食（おかず・トッピング用）
    short: 一般食
    emoji: 🍖
    reason: おいしくて食欲が出やすいが、それだけでは栄養が足りないものが多い。主食ではなく、ごほうび用に。
  - name: グレインフリー（穀物不使用）フード
    short: グレインフリー
    emoji: 🌾
    reason: 「穀物が入っていないから良い」とは限らない。栄養がとれているかを、表示で確認してから選ぶ。
  C:
  - name: 手作りごはん
    short: 手作りごはん
    emoji: 🍳
    reason: 愛情はこもるが、栄養のバランスをとるのが難しい。長く続けるなら、獣医さんに相談しながら、レシピを決めると安心。
  - name: 生肉・生食（BARFなど）
    short: 生食
    emoji: 🥩
    reason: 食中毒や、栄養の偏りの心配がある。人にも菌がうつるおそれがあるので、衛生管理がとても大切。
  - name: ふやかしフード（ドライをお湯でやわらかく）
    short: ふやかしフード
    emoji: 🍲
    reason: 子犬、シニア、食欲のない犬に使いやすい。ただし、時間がたつと傷みやすいので、食べきれる量で作る。
  D:
  - name: 人間の食事の残り
    short: 人間の食事
    emoji: 🍚
    reason: 塩分・油分が多く、犬に危険な玉ねぎやぶどうなどが入っていることも。ねだられても、分けないのが安全。
  - name: 猫用フード（主食として）
    short: 猫用フード
    emoji: 🐈
    reason: 猫用は、犬には脂肪やたんぱく質が多めのことがある。ときどきの食べ間違いはともかく、主食にはしない。
summary: '迷ったら、パッケージに「総合栄養食」と書かれたフードが基本。犬の大きさ（小型・大型）と年齢（子犬・成犬・シニア）にあわせて選ぶのがコツ。

  おやつやトッピングは、1日の量の中におさめる。手作りや生食は、栄養バランスの難しさがあるので、獣医さんに相談しながら。ごはんを変えるときは、1〜2週間かけて少しずつ切りかえると、お腹の負担が少ない。'
related:
- inu-kiken
- inu-oyatsu
- inu-goods
