title: 猫が病院に行くべきサイン Tier表
description: トイレに行くのに出ない、口を開けて息をする、ぐったり…猫の様子から、動物病院に行く急ぎ度をS〜Dで整理。
category: animals
tags:
- 猫
- 動物
- 初心者
published: '2026-10-06'
labels:
  S: 今すぐ病院へ
  A: 今日〜明日に受診
  B: 早めに受診
  C: 気になるなら相談
  D: ふつうの範囲が多い
criteria: '① 命にかかわる可能性の高さ

  ② 放っておくと悪くなりやすいか

  ③ 家で判断するのが難しいか

  ※ 病気を診断するものではなく、一般的に知られている目安です。獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。動物の種類・年齢・体質・量で影響は変わります。心配なときは、様子を見すぎず、動物病院に相談してください。迷ったときは「様子を見る」より「電話で相談」を'
rank_notes:
  S: 夜間・休日でも急いで連絡
  D: 様子を見てよいことが多い（続くなら相談）
tiers:
  S:
  - name: トイレに何度も行くのに、おしっこが出ない
    short: おしっこが出ない
    emoji: 🚽
    reason: 特にオス猫では、尿道がつまると命にかかわることがある。トイレで力んでいる、少ししか出ない、何度も出入りするときは、夜でもすぐ連絡を。
  - name: 口を開けて息をする・息が苦しそう
    short: 呼吸が苦しそう
    emoji: 😮‍💨
    reason: 猫は、普通、口を開けて呼吸しない。ぜいぜいする、おなかが大きく動くときは、呼吸器や心臓の問題のことがあるので、急いで受診を。
  - name: ぐったりして動かない・呼びかけに反応しない
    short: ぐったり
    emoji: 🥀
    reason: 意識がぼんやりしている、立てない、体が冷たいなどは緊急のサイン。毛布でくるんで、すぐ連絡して病院へ。
  - name: けいれん・発作
    short: けいれん
    emoji: ⚡
    reason: 体がつっぱる、ふるえが止まらない、倒れて手足をばたつかせる、など。時間を測って、動画が撮れるなら撮って、すぐ病院へ。
  - name: 毒になるものを食べた疑いがある
    short: 毒物の疑い
    emoji: ☠️
    reason: ユリ、玉ねぎ、人間の薬、チョコなどを口にした疑いがあるときは、症状が出る前でも連絡を。食べたものとパッケージを持っていくと、診断が早い。
  - name: 高いところから落ちた・交通事故・ひどいケガや出血
    short: 事故・大きなケガ
    emoji: 🩸
    reason: 元気そうに見えても、体の中を痛めていることがある。出血が多いときは、清潔な布で押さえて、すぐ病院へ。
  A:
  - name: 嘔吐が何度も続く（1日に数回以上）
    short: 吐き続ける
    emoji: 🤢
    reason: 1回だけの毛玉吐きとは別。続く場合は、脱水や、病気、異物の可能性がある。吐いたものの様子も、スマホで撮っておくと役に立つ。
  - name: 丸1日以上、ごはんを食べない
    short: 食べない
    emoji: 🍽️
    reason: 猫は、食べない時間が長いと、体に負担がかかりやすい。特に太めの猫は注意。元気がない、水も飲まないなら、さらに急ぐ。
  - name: 血のまじったおしっこ・うんち
    short: 血が出る
    emoji: 🩸
    reason: 膀胱炎や結石、消化器の病気などのサインのことがある。トイレの回数の変化と一緒に、先生に伝える。
  - name: 目が開かない・ひどい目やに・白目の充血
    short: 目の異常
    emoji: 👁️
    reason: 猫風邪や、ケガ、角膜の傷のこともある。目をこすっている様子が強いときは、早めに受診。
  - name: 下痢が24時間以上続く・水のような下痢
    short: 下痢が続く
    emoji: 💧
    reason: 脱水しやすく、子猫やシニア猫は特に急ぐ。食べたものや、うんちの様子を伝えられるようにしておく。
  B:
  - name: 水をたくさん飲み、おしっこの量が増えた
    short: 水をよく飲む
    emoji: 🚰
    reason: 腎臓や、ホルモンの病気のサインのことがある。1日に飲む量や、トイレの大きさを、数日記録して先生に伝えるとよい。
  - name: 体重が少しずつ減っている
    short: 体重が減る
    emoji: ⚖️
    reason: 食べているのに痩せるときは、病気が隠れていることがある。月に1回、体重を測るくせをつけると気づきやすい。
  - name: 口臭・よだれが強い、食べ方がおかしい
    short: 口の異常
    emoji: 🦷
    reason: 歯周病や口内炎のサインのことがある。痛くて、ごはんを片側でしか噛まないこともある。
  - name: 咳や、くしゃみ・鼻水が数日続く
    short: 咳・くしゃみ
    emoji: 🤧
    reason: 猫風邪や、気管支の問題のことも。ごはんを食べられていても、続くなら受診を。
  C:
  - name: 鳴き声が急に変わった・夜によく鳴くようになった
    short: 鳴き方の変化
    emoji: 🗣️
    reason: 高齢の猫では、認知機能の変化や、甲状腺などの病気のサインのことも。気になったら相談を。
  - name: 毛づやが悪い・フケが増えた・毛がたくさん抜ける
    short: 毛の変化
    emoji: 🪮
    reason: 季節の変わり目の換毛もあるが、皮膚の病気や、栄養、ストレスのこともある。
  - name: 爪とぎをしなくなった・ジャンプをしなくなった
    short: 動きの変化
    emoji: 🐾
    reason: 関節の痛みが隠れていることがある。高いところに上らなくなったら、様子を見て相談を。
  D:
  - name: たまに毛玉を吐く
    short: たまの毛玉吐き
    emoji: 🧶
    reason: 毛づくろいで飲みこんだ毛を、たまに吐くのは、健康な猫でも見られる。頻度が増える、元気がないなら相談。
  - name: 1〜2回のくしゃみ
    short: 軽いくしゃみ
    emoji: 🤧
    reason: ほこりや、においで、くしゃみをすることはよくある。続く、鼻水や目やにが出るなら相談。
  - name: 1日の大半を寝て過ごす
    short: よく寝る
    emoji: 😴
    reason: 猫は1日に12〜16時間ほど眠るとされる。食欲や排泄がふだん通りなら、あまり心配しすぎなくてよい。
summary: '猫は、痛みや不調をがまんして隠す生き物。気づいたときには、進んでいることもある。

  Sの項目は、時間との勝負。夜でも休日でも、すぐ動物病院（救急対応のところ）に電話して。普段から、かかりつけの病院と、夜間・休日に診てくれる病院の連絡先を、スマホと冷蔵庫に控えておくと安心。体重と、トイレの回数、ごはんの量を日ごろから見ておくと、変化に気づきやすい。'
related:
