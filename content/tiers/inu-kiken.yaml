title: 犬に危険な食べもの Tier表
description: チョコレート、玉ねぎ、ぶどう、キシリトール…犬が食べてはいけない食べものを、危険度でS〜Dにランク付け。うっかり事故を防ぐための一覧。
category: animals
tags: [犬, 動物, 初心者]
published: 2026-10-03
labels:
  S: 絶対NG
  A: 要注意
  B: あげないほうがいい
  C: 与え方しだい
  D: 少量ならまず問題なし
criteria: |
  ① 中毒や重い症状につながる危険度
  ② 家庭で犬の口に入る機会の多さ
  ③ 少量でも起こりうるか
  ※ 獣医師の診断や助言ではなく、一般的に知られている情報を整理したものです。犬の大きさや体質、食べた量で影響は変わります。食べてしまったときは、様子を見ずに、すぐ動物病院に連絡してください
rank_notes:
  S: 少量でも命にかかわる可能性
  D: 量や与え方を守ればおおむね問題なし
tiers:
  S:
    - name: チョコレート・ココア
      short: チョコレート
      emoji: "🍫"
      reason: 含まれる成分が犬には中毒を起こし、嘔吐・震え・けいれんなどにつながることがある。特にカカオ分の高いものは危険。クリスマスやバレンタインなど、家に出る機会が多いので要注意。
    - name: 玉ねぎ・ネギ類
      short: ネギ類
      emoji: "🧅"
      reason: 犬の赤血球をこわして、貧血を起こすことがある。加熱しても危険は消えない。ハンバーグやカレー、スープなどに入っているので、食卓の食べ物を分けるのは避ける。
    - name: ぶどう・レーズン
      emoji: "🍇"
      reason: 少量でも、犬の腎臓に重い影響を与えた例が報告されている。原因ははっきりしていないが、安全な量が分からないので、あげない。
    - name: キシリトール入りのガム・お菓子
      short: キシリトール
      emoji: "🍬"
      reason: 犬が食べると、急激な低血糖や肝臓の障害を起こす危険がある。人間用のガムやのど飴に入っているので、バッグの中の置き場所にも注意。
    - name: アルコール
      emoji: "🍺"
      reason: 少量でも犬には強く影響して、危険な状態になる。お酒を舐めさせるのは絶対にしない。お料理に使うみりんや料理酒にも注意。
  A:
    - name: マカダミアナッツ
      emoji: "🥜"
      reason: 犬が食べると、ふるえや歩行のふらつき、嘔吐などが起こることがある。クッキーやチョコの中に入っていることも多いので、注意が必要。
    - name: コーヒー・紅茶などカフェインを含むもの
      short: カフェイン
      emoji: "☕"
      reason: カフェインは犬に興奮、心拍数の増加などを起こすことがある。コーヒーかすや、飲みかけのカップにも注意。
    - name: 膨らむパン生地
      short: パン生地
      emoji: "🍞"
      reason: 生地が胃の中で膨らんで苦しくなるほか、発酵でできるアルコールが影響することもある。手作りパンの準備中は、犬の手が届かないところへ。
    - name: にんにく
      emoji: "🧄"
      reason: ネギ類の仲間で、犬の赤血球に影響することがある。少量でも避けたほうがいいので、料理の残り物をあげない。
    - name: 加熱した鶏の骨・魚の骨
      short: 加熱した骨
      emoji: "🍖"
      reason: 加熱した骨は、折れると鋭く裂けやすく、のどや消化管を傷つける危険がある。食べ終わったあとのごみを、犬が漁らないように片づける。
  B:
    - name: 塩分の多い加工食品（ハム・ソーセージ・ラーメンなど）
      short: 塩分の多い食品
      emoji: "🍜"
      reason: 人間には普通でも、犬には塩分も脂肪も多く、体に負担になる。食べ続けると、肥満や腎臓、心臓への影響が心配になる。
    - name: アボカド
      emoji: "🥑"
      reason: 犬への影響が議論される食べ物で、種を飲みこむ危険も大きい。安全のため、あげないほうが無難。
    - name: もち・こんにゃくゼリーなど喉に詰まりやすいもの
      short: 喉に詰まる食べ物
      emoji: "🍡"
      reason: 毒ではないが、のどに詰まらせて窒息する危険がある。お正月のおもちは、特に注意が必要。
    - name: 焼き鳥の串・竹串
      emoji: "🍢"
      reason: 串ごと飲みこんだり、のどや胃を傷つけたりする危険がある。バーベキューや屋台のごみの扱いに気をつける。
  C:
    - name: 牛乳
      emoji: "🥛"
      reason: 乳糖を分解しにくく、お腹をこわす犬が多い。犬用のミルクなら飲めるものが多い。
    - name: 生の卵白・生の肉や魚
      short: 生の食材
      emoji: "🥚"
      reason: 食中毒の心配がある。与えるなら、鮮度のよいものを、しっかり加熱して。手作り食は、栄養バランスも獣医さんに相談を。
    - name: 柑橘類の皮・種
      short: 柑橘の皮
      emoji: "🍊"
      reason: 果肉を少しならよいとされることもあるが、皮や種は消化に悪く、お腹をこわすことがある。
  D:
    - name: ゆでたにんじん・かぼちゃなどの野菜
      short: ゆで野菜
      emoji: "🥕"
      reason: 小さく切ってやわらかくゆでれば、おやつにもなる。与えすぎはお腹をこわすので、少量から。
    - name: 犬用に調整されたおやつ・フード
      short: 犬用フード
      emoji: "🐕"
      reason: 犬の体を考えて作られているので、安全にあげやすい。それでも、量を決めて、あげすぎないことが大切。
summary: |
  Sに入れたのは、少量でも危険になりうる「チョコ・ネギ類・ぶどう・キシリトール・アルコール」。どれも人間の家庭にふつうにあるので、うっかり事故が起こりやすい。
  犬が口にしたかもしれないと思ったら、様子を見ず、食べたものと量を伝えて、すぐ動物病院に連絡すること。普段から、犬の届かない場所に置くのが、いちばんの予防になる。
related: [inu-oyatsu, inu-goods, neko-oyatsu]
