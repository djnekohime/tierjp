title: 大学グループ（大学群）Tier表
description: 旧帝大、早慶、上智・理科大、MARCH、関関同立、日東駒専、産近甲龍、大東亜帝国…受験でよく聞く「大学群」を、AIが入試の難しさの目安でS〜Dにランク付け。
category: koukou
tags:
- 勉強法
published: '2026-10-09'
labels:
  S: 最難関
  A: 難関
  B: 準難関
  C: 中堅
  D: 身近な大学
criteria: '① 入試の難しさの目安（全体の傾向）

  ② 受験の世界で広く使われている呼び方か

  ※ 予備校などの公開情報で広く使われている「大学群」の見方と、AIの印象をもとにした、大まかな並べ方です。同じ大学でも、学部・学科・入試方式で難しさは大きく変わります。ランクは大学の良し悪しや、学べる内容の価値ではなく、入試の難しさの目安です。進路は、各大学の公式情報や、先生・予備校にご相談ください（2026年10月時点）'
rank_notes:
  S: 最難関
  D: 身近な大学
tiers:
  S:
  - name: 東大・京大
    emoji: 🥇
    reason: 東京大学と京都大学。国内の大学の最難関として知られる2校。
  A:
  - name: 旧帝大（北大・東北大・名大・阪大・九大）
    emoji: 🏛️
    reason: 旧帝国大学のうち、東大・京大以外の5校。北海道大学、東北大学、名古屋大学、大阪大学、九州大学。
  - name: 東京科学大・一橋大
    emoji: 🔬
    reason: 東京科学大学（旧・東京工業大学と東京医科歯科大学）と一橋大学。東京の難関国立。
  - name: 早慶（早稲田・慶應）
    emoji: 🔴
    reason: 私立の最難関として知られる、早稲田大学と慶應義塾大学。
  - name: 上理ICU（上智・東京理科・国際基督教）
    emoji: 🌐
    reason: 上智大学、東京理科大学、国際基督教大学。早慶に続く、難関私立。
  B:
  - name: MARCH（明治・青山学院・立教・中央・法政）
    emoji: 💜
    reason: 首都圏の私立の大学群。学習院を加えて「GMARCH」とも呼ぶ。
  - name: 関関同立（関西・関西学院・同志社・立命館）
    emoji: 🏯
    reason: 関西の私立の大学群。同志社大学、立命館大学、関西学院大学、関西大学。
  - name: 神戸大・筑波大・横浜国大など
    emoji: 🌿
    reason: 旧帝大に続く、難関・準難関の国立大学。神戸大学、筑波大学、横浜国立大学、千葉大学、広島大学など。
  C:
  - name: 成成明學獨國武
    emoji: 🏫
    reason: 成蹊・成城・明治学院・獨協・國學院・武蔵の6大学。MARCHに続く、首都圏の私立の大学群。
  - name: 日東駒専（日本・東洋・駒澤・専修）
    emoji: 📚
    reason: 首都圏の私立の大学群。日本大学、東洋大学、駒澤大学、専修大学。
  - name: 産近甲龍（京都産業・近畿・甲南・龍谷）
    emoji: 🏯
    reason: 関西の私立の大学群。京都産業大学、近畿大学、甲南大学、龍谷大学。
  - name: 地方の旧国立大学（岡山・熊本・金沢・新潟など）
    emoji: 🏫
    reason: 各地方の、中心的な国立大学。岡山大学、熊本大学、金沢大学、新潟大学など。
  D:
  - name: 大東亜帝国（大東文化・東海・亜細亜・帝京・国士舘）
    emoji: 🏫
    reason: 首都圏の私立の大学群。大東文化大学、東海大学、亜細亜大学、帝京大学、国士舘大学。
  - name: 摂神追桜（摂南・神戸学院・追手門学院・桃山学院）
    emoji: 🏫
    reason: 関西の私立の大学群。摂南大学、神戸学院大学、追手門学院大学、桃山学院大学。
summary: '受験の世界では、大学を「グループ」でまとめて呼ぶことが多い。旧帝大（旧帝国大学）、早慶、MARCH、関関同立、日東駒専、産近甲龍など。

  これは、あくまで入試の難しさの大まかな目安で、大学の価値や、学べる内容の良し悪しを示すものではない。同じ大学でも、学部や入試方式で、難しさは大きく変わる。'
