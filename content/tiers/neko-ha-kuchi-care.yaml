criteria: '① 安全性

  ② 猫の負担の少なさ

  ③ 続けやすさ

  ※ 獣医さんの助言ではなく目安です。口臭・出血・食欲不振・よだれなどが見られたら、早めに動物病院へ。人用の歯みがき粉は使わないでください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: まず、口のまわりを触られることに慣らす
    emoji: 🐾
    reason: いきなり歯ブラシは、猫が嫌がる原因に。段階的にが基本。
  - name: 口臭・よだれ・出血などのサインを、日ごろ見ておく
    emoji: 👀
    reason: 不調のサインに早く気づけて、受診につなげられる。
  - name: 異変があれば、早めに動物病院へ行く
    emoji: 🏥
    reason: 歯周病は痛みを伴う。自己判断せず、診てもらう。
  A:
  - name: 慣れたら、猫用の歯ブラシ・ガーゼを使う
    emoji: 🪥
    reason: 歯垢をとるのに、いちばん確実な方法。
  - name: 猫用の歯みがきペーストを使う
    emoji: 🧴
    reason: 猫が好む味で、嫌がりにくい。人用は使わない。
  - name: 1回は短く、嫌がる前に終わらせる
    emoji: ⏱️
    reason: 成功体験を積み重ねると、続けやすい。
  - name: ごほうびをセットにして、いい印象にする
    emoji: 🍬
    reason: 歯みがき＝いいことが起こる、と覚えてくれる。
  B:
  - name: 歯みがきの前に、なでなでで落ち着かせる
    emoji: 🤲
    reason: リラックスした状態のほうが、受け入れやすい。
  - name: 週に数回からでも、続ける
    emoji: 📆
    reason: 毎日が難しくても、続けることに意味がある。
  - name: 定期健診で、歯の状態を診てもらう
    emoji: 📋
    reason: 自宅では気づけない変化を、早く見つけられる。
  - name: デンタルケア用のおやつ・フードを併用する
    emoji: 🍪
    reason: 補助的な効果。これだけに頼らない。
  - name: 水を飲みやすい環境を整える
    emoji: 💧
    reason: 口の中をうるおす助けになる。
  C:
  - name: 歯みがきシートを、指に巻いて使う
    emoji: 🧻
    reason: 慣れには役立つが、細かい部分は届きにくい。
  - name: 口に入れるタイプのジェル・スプレーに頼る
    emoji: 🧪
    reason: 補助的な使い方。製品の説明をよく読む。
  - name: 自宅で、歯石を取ろうとする
    emoji: ⚠️
    reason: 歯ぐきを傷つけることがある。獣医さんに任せたほうが安全。
  D:
  - name: 人間用の歯みがき粉を使う
    emoji: 🚫
    reason: 飲み込むと危険な成分が入っていることがある。
  - name: 嫌がる猫を、押さえつけて無理にみがく
    emoji: 😾
    reason: 猫が怖がり、触れること自体を嫌がるようになる。
  - name: 口臭や食欲低下を、年齢のせいと放置する
    emoji: ⏳
    reason: 歯周病や他の病気のサインのことがある。早めに受診を。
summary: '猫も、人と同じように歯垢や歯石がたまり、歯周病になることがある。口の痛みで、食べにくそうにする猫も少なくない。それなのに、猫は不調を隠すのが上手で、気づくのが遅れがち。だから、日ごろからのケアが大切になる。

  S級は、まず口まわりを触られることに慣らすこと。いきなり歯ブラシを入れようとすると、猫は嫌がって、歯みがきそのものが嫌いになってしまう。数日から数週間かけて、顔、口もと、歯ぐきの順に、少しずつ触れるのが基本。

  慣れたら、猫用のガーゼや歯ブラシ、猫用の歯みがきペーストを使う。人間用の歯みがき粉は、猫が飲み込むと危険な成分が入っていることがあるので、絶対に使わない。

  嫌がる猫に、無理強いはしない。1日1回が理想でも、続かなければ意味がない。できる範囲で、少しずつ増やそう。

  おやつやフードタイプのケアは、補助的なもの。それだけで歯石が取れるわけではない。

  口臭が強い、よだれが多い、歯ぐきが赤い、食べるときに痛そうにする。こうしたサインがあれば、すぐに動物病院で診てもらおう。定期的な健康診断のときに、歯のチェックをお願いするのも、おすすめだ。

  猫の口のケアは、「完璧にやること」より、「嫌いにさせないこと」が大切。1日に数秒でも、毎日少しずつ触れていれば、猫は少しずつ慣れていく。

  また、年齢とともに歯の状態は変わってくる。子猫の頃から習慣にしておくと、成猫になってからのケアが、ずっと楽になる。心配なときは、かかりつけの動物病院に、歯みがきの仕方も聞いてみよう。'
