title: 勉強を続けるコツ Tier表
description: 毎日の時間を決める、スマホを別室に置く、小さな目標、記録をつける、仲間を作る…大人の勉強を続けるコツを「効果・続けやすさ」でS〜Dにランク付け。三日坊主の味方。
category: manabi
tags: [勉強法, 初心者]
published: 2026-10-05
labels:
  S: まずこれ
  A: かなり効く
  B: 合う人には効く
  C: 好みしだい
  D: 続かない
criteria: |
  ① 続けやすさ（無理なく習慣になるか）
  ② 効果（勉強の量・質につながるか）
  ③ 始めやすさ（準備・費用）
  ※ 向き不向きには、個人差があります。一般的に言われている方法を整理した、ひとつの見方です
rank_notes:
  S: 迷ったらここから
  D: 続かない、または逆効果になりやすい
tiers:
  S:
    - name: 「毎日、これだけ」の最低ラインを小さく決める
      short: 小さな最低ライン
      emoji: "🌱"
      reason: 「1日5分」「1ページだけ」など、ぜったいできる量にする。やる気がない日も、ゼロにしないことが、続くいちばんのコツ。
    - name: 勉強する時間と場所を、固定する
      short: 時間と場所を固定
      emoji: "⏰"
      reason: 「朝のコーヒーのあと」など、決まった習慣に結びつけると、考えなくても始められる。やる気に頼らなくて済む。
  A:
    - name: スマホを、別の部屋やかばんの中に置く
      short: スマホを遠ざける
      emoji: "📵"
      reason: 通知や、つい見てしまう誘惑を、物理的に遠ざける。集中力が、ぐっと変わる。
    - name: 勉強した日に、カレンダーに印をつける
      short: 記録をつける
      emoji: "📅"
      reason: 並んだ印が、「ここまで続けた」という自信になる。途切れさせたくない気持ちが、続ける力になる。
    - name: ゴールを小さく区切る
      short: 小さなゴール
      emoji: "🏁"
      reason: 「1年で英検」より、「今週はここまで」のほうが、手の届く目標になる。達成感が、積み重なる。
    - name: 勉強の前に、準備を整えておく（机・ノート・教材）
      short: 準備を整える
      emoji: "🧰"
      reason: 始めるまでの面倒を減らすと、取りかかりやすい。前の晩に、机の上に出しておく。
    - name: 勉強のあとに、小さなごほうびを用意する
      short: ごほうび
      emoji: "🍫"
      reason: 「終わったらお茶を飲む」など。楽しみを、勉強の後ろにつなげる。
  B:
    - name: 勉強の仲間を作る（SNS・オンライン・教室）
      short: 仲間を作る
      emoji: "👥"
      reason: 同じ目標の人がいると、励みになる。ほどよい距離感の、仲間を探したい。
    - name: 「やります」と、周りに宣言する
      short: 宣言する
      emoji: "📣"
      reason: 家族や友だち、SNSなどに言うと、やめにくくなる。プレッシャーが、苦手な人には向かない。
    - name: 図書館やカフェなど、環境を変えて勉強する
      short: 場所を変える
      emoji: "☕"
      reason: 気分が変わって、集中しやすくなることがある。移動の手間と、費用は、考えておく。
    - name: ポモドーロ（25分勉強して5分休む）
      short: タイマー学習
      emoji: "🍅"
      reason: 区切りをつけると、集中しやすい。タイマーをかけるだけで、始めやすい。
    - name: 勉強アプリの連続記録やバッジ
      short: アプリの記録
      emoji: "🏅"
      reason: ゲーム感覚で続けやすい。記録のために、勉強が形だけにならないよう、注意。
  C:
    - name: 早起きして、朝に勉強する
      short: 朝活
      emoji: "🌅"
      reason: 頭がすっきりしている人には、合う。夜型の人には、無理があることも。
    - name: 通勤や家事の「ながら勉強」
      short: ながら勉強
      emoji: "🚃"
      reason: すき間時間を、有効に使える。聞く勉強には向くが、書く・考える勉強には向きにくい。
    - name: 勉強用の、お気に入りの文房具を使う
      short: 道具にこだわる
      emoji: "✏️"
      reason: 気分が上がる。道具選びが、目的にならないようにしたい。
  D:
    - name: 最初から、長時間の計画を立てる
      short: 最初から長時間
      emoji: "⏳"
      reason: 数日で息切れして、やめてしまう、典型的なパターン。まず、短い時間から。
    - name: 1日休んだら、「もうダメだ」とやめてしまう
      short: 休んだらやめる
      emoji: "💔"
      reason: 習慣は、1日の休みでは、壊れない。翌日、また再開すれば、それでいい。
    - name: 教材を、次々に買い替える
      short: 教材を買い替える
      emoji: "📚"
      reason: 買うことが、勉強したつもりになってしまう。使い込むのが、近道。
summary: |
  続けるコツのSは、「最低ラインを小さく決めること」と「時間と場所を固定すること」。やる気に頼らず、毎日やれる仕組みを作るのが、いちばん強い。
  休んでしまう日があっても、気にしすぎない。次の日にまた始めれば、それが「続けている」ということ。小さく、気楽に、長く続けよう。
related: [eigo-gakushu-hoho, anki-hoho, hangul-phrase]
