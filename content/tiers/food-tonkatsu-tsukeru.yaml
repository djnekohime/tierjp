summary: 'とんかつにつけるものは、ソース・塩・からしがS。ソースは定番、いいお肉は塩、からしでさっぱり。

  名古屋では赤味噌の味噌ダレ、洋食屋さんではデミグラス。土地やお店で、つけるものも変わる。

  '
