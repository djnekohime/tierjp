  - name: ごまダレ
    emoji: ⚪
    reason: 香ばしくて、キャベツにもよく合う。
  B:
  - name: デミグラスソース
    emoji: 🍷
    reason: 洋食屋さんのカツレツ風に。ご飯にもパンにも合う。
  - name: 梅肉
    emoji: 🔴
    reason: さっぱり酸っぱい梅で、脂をやわらげる。
  - name: ケチャップ
    emoji: 🍅
    reason: 子供向け。大人もハマる、甘酸っぱい味。
  - name: カレーソース
    emoji: 🍛
    reason: カツカレーのように。ご飯と一緒に。
  C:
  - name: マヨネーズ
    emoji: 🥚
    reason: こってりが好きな人に。キャベツにもよく合う。
  - name: 醤油
    emoji: 🥢
    reason: 和風な味。ご飯と合わせると、間違いない。
