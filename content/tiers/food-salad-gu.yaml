title: サラダの具 Tier表
description: トマト、アボカド、ゆで卵、ツナ、チーズ、クルトン、コーン、ブロッコリー、ベーコン、サーモン…サラダの具を、AIが「入っているとうれしい度×食べごたえ」でランク付け。
category: food
genre: 野菜・果物
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① サラダに入っていると「うれしい！」と思える人気
  ② 食べごたえ・食感の楽しさ
  ③ いろいろなドレッシングに合うか
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: サラダの三大スター
tiers:
  S:
    - name: トマト
      emoji: "🍅"
      reason: 赤い色で見た目が一気に華やかに。みずみずしい酸味と甘みで、サラダに欠かせない。
    - name: アボカド
      emoji: "🥑"
      reason: 「森のバター」と呼ばれるクリーミーな食感。サラダを主役級の一皿にしてくれる。
    - name: ゆで卵
      emoji: "🥚"
      reason: たんぱく質が加わって、食べごたえがぐっとアップ。半熟卵ならさらにうれしい。
  A:
    - name: ツナ
      emoji: "🥫"
      reason: うまみとボリュームを手軽に足せる。和風ドレッシングとの相性がいい。
    - name: チーズ
      emoji: "🧀"
      reason: 粉チーズでもモッツァレラでも、コクが加わる。
    - name: クルトン
      emoji: "🍞"
      reason: カリカリ食感がアクセントに。シーザーサラダには欠かせない。
    - name: ベーコン
      emoji: "🥓"
      reason: カリカリに焼いたベーコンの香ばしさ。ほうれん草のサラダと相性抜群。
    - name: サーモン
      emoji: "🍣"
      reason: スモークサーモンや生サーモンで、ごちそうサラダに。
  B:
    - name: コーン
      emoji: "🌽"
      reason: 甘みと彩り。子供が喜ぶ具。
    - name: ブロッコリー
      emoji: "🥦"
      reason: 栄養たっぷりで、ゆでるだけで使える。
    - name: きゅうり
      emoji: "🥒"
      reason: パリッとした食感とみずみずしさ。
    - name: 鶏ささみ・サラダチキン
      short: サラダチキン
      emoji: "🐔"
      reason: 高たんぱくでヘルシー。サラダを一食分のおかずに。
    - name: ナッツ
      emoji: "🥜"
      reason: 香ばしさとカリッとした食感。
  C:
    - name: ひじき・海藻
      short: 海藻
      emoji: "🌊"
      reason: 和風サラダの定番。体にいいが、主役にはなりにくい。
    - name: 豆（ミックスビーンズ）
      short: ミックスビーンズ
      emoji: "🫘"
      reason: 栄養たっぷりで彩りもいいが、好みは分かれる。
  D:
    - name: フルーツ（りんご・いちご）
      short: フルーツ
      emoji: "🍎"
      reason: サラダに甘いフルーツを入れる組み合わせ。好きな人と苦手な人がはっきり分かれる。
    - name: パクチー
      emoji: "🌱"
      reason: エスニックなサラダの主役。香りが強く、好き嫌いの両極端。
summary: |
  サラダの具は、トマト・アボカド・ゆで卵がS。この3つが入っているだけで、サラダは脇役から主役になる。
  ツナやサラダチキンのようなたんぱく質を足すと、サラダだけでも立派な一食に。ポテトサラダにりんごは「あり派・なし派」の論争も有名。
related: [food-dressing, food-yasai]
