title: 旅行のトラブルと対策 Tier表
description: スリ・置き引き、パスポート紛失、体調不良、荷物の遅延、飛行機の遅れ、ぼったくり…旅行中のトラブルを「起こりやすさと被害の大きさ」でS〜Dにランク付け。対策つき。
category: travel
tags: [旅行, 防犯, 初心者]
published: 2026-10-05
labels:
  S: 特に注意
  A: 要注意
  B: 気をつけたい
  C: 備えておく
  D: 心の準備を
criteria: |
  ① 起こりやすさ
  ② 被害の大きさ（お金・時間・体調・旅の続行）
  ③ 事前に防ぎやすいか
  ※ 一般的なトラブルの整理です。国や地域によって、状況は大きく異なります。外務省の海外安全情報や、現地の公的な情報も、出発前に確認してください
rank_notes:
  S: 起こりやすく、影響も大きい
  D: めったにないが、備えておきたい
tiers:
  S:
    - name: スリ・置き引き・ひったくり
      short: スリ・置き引き
      emoji: "👜"
      reason: 観光地や、駅、混雑した場所で起こりやすい。貴重品は分けて持ち、バッグは前に抱える。席にバッグを置いたまま、離れない。
    - name: パスポート・貴重品の紛失や盗難
      short: パスポート・貴重品の紛失
      emoji: "🛂"
      reason: 旅の続行や、帰国に影響する。コピーやデータを、別の場所に保管しておく。紛失したら、警察や大使館・領事館に相談する。
    - name: 体調不良・ケガ（食あたり・水が合わない・熱中症）
      short: 体調不良・ケガ
      emoji: "🤒"
      reason: 慣れない環境で、体調をくずしやすい。海外旅行保険に入り、常備薬を持つ。無理な日程を、組まない。
  A:
    - name: 飛行機の遅延・欠航・乗り継ぎ失敗
      short: 飛行機の遅れ
      emoji: "✈️"
      reason: 天候やトラブルで、予定が変わる。余裕のある日程や、予備の時間を作る。航空会社のアプリや、連絡を、こまめに確認する。
    - name: 荷物の紛失・到着の遅れ（ロストバゲージ）
      short: ロストバゲージ
      emoji: "🧳"
      reason: 数日分の着替えと薬は、機内持ち込みの荷物に入れておくと安心。到着したら、その場で航空会社の窓口に、申し出る。
    - name: ぼったくり・過剰な客引き・料金トラブル
      short: ぼったくり・客引き
      emoji: "💸"
      reason: タクシーや、土産物店、飲食店などで起こりやすい。料金を、乗る前や頼む前に確認し、強引な誘いは、きっぱり断る。
    - name: クレジットカードの不正利用・スキミング
      short: カードの不正利用
      emoji: "💳"
      reason: 利用明細をこまめに確認する。カードを、目の前で扱ってもらう。不審な請求があれば、すぐカード会社に連絡する。
    - name: 通信がつながらない・地図が使えない
      short: 通信トラブル
      emoji: "📶"
      reason: 迷子の原因になる。オフラインで使える地図や、予備の通信手段を、準備しておく。
  B:
    - name: 言葉が通じない・間違った注文
      short: 言葉が通じない
      emoji: "🗣️"
      reason: 翻訳アプリや、写真を見せるのが、助けになる。アレルギーがある場合は、伝え方を、事前に調べておく。
    - name: 宿のトラブル（予約が通っていない・設備が違う）
      short: 宿のトラブル
      emoji: "🏨"
      reason: 予約の確認メールや、画面の控えを、保存しておく。到着前に、連絡すると、安心。
    - name: 交通機関のストライキ・運休
      short: 交通のストライキ
      emoji: "🚇"
      reason: 国や地域によっては、ときどき起こる。予定を変えられるよう、予備の移動手段を、考えておく。
    - name: 偽の警察官・偽の係員
      short: 偽の警察官・係員
      emoji: "👮"
      reason: 「財布を見せて」などと言って、お金をだまし取る。身分証の確認を求めるか、その場を離れて、公的な窓口に相談する。
    - name: 偽物のチケット・ツアーの詐欺
      short: 偽チケット
      emoji: "🎟️"
      reason: 正規の販売所や、公式サイトで購入する。路上の売り手は、避ける。
  C:
    - name: 現地の治安や、デモ・災害
      short: 治安・デモ・災害
      emoji: "⚠️"
      reason: 外務省の海外安全情報で、出発前と滞在中に確認する。危険な地域・時間帯は、避ける。
    - name: 時差ぼけ・疲れ
      short: 時差ぼけ・疲れ
      emoji: "😴"
      reason: 初日に、予定を詰め込みすぎない。睡眠を大切にする。
    - name: 乗り物酔い・高山病
      short: 乗り物酔い・高山病
      emoji: "🤢"
      reason: 行き先によって、心配なものがある。酔い止めや、現地の情報を、事前に確認する。
  D:
    - name: 大きな事故・事件・災害に巻き込まれる
      short: 重大な事故・災害
      emoji: "🚨"
      reason: めったにないが、備えは大切。在外公館の連絡先や、海外旅行保険の緊急連絡先を、控えておく。外務省の「たびレジ」で、現地の安全情報を受け取れる。
    - name: 帰国のための費用が急に必要になる
      short: 急な費用
      emoji: "🪙"
      reason: 緊急時の連絡先と、支払い手段を、複数用意しておくと、安心。
summary: |
  トラブルのSは、「スリ・置き引き」「貴重品の紛失」「体調不良・ケガ」。この3つに備えるだけで、旅の安心感が、大きく変わる。
  出発前に、外務省の海外安全情報を確認し、海外旅行保険と、パスポートのコピーを準備しよう。トラブルが起きても、慌てず、公的な窓口や、保険の連絡先に、相談すれば、大丈夫。
related: [travel-kaigai-mochimono, travel-yado-type, kaigai-hajimete]
