title: パフェの具 Tier表
description: 生クリーム、アイス、いちご、コーンフレーク、チョコソース、プリン、ブラウニー、白玉、抹茶ゼリー…パフェの具を、AIが「入っているとうれしい度×層ごとの楽しさ」でランク付け。
category: food
genre: スイーツ
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① パフェに入っていると「うれしい！」と思える人気
  ② 層ごとに味が変わる楽しさ
  ③ 見た目の華やかさ
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: パフェの三大主役
  D: パフェ好きがうなる名脇役
tiers:
  S:
    - name: アイスクリーム
      emoji: "🍨"
      reason: パフェの主役。バニラ、チョコ、抹茶と、どのパフェにも欠かせない。
    - name: 生クリーム
      emoji: "☁️"
      reason: ふわふわのホイップクリームは、パフェの見た目も味も決める。
    - name: いちご
      emoji: "🍓"
      reason: 赤い色で一気に華やかに。いちごパフェは季節限定で大人気。
  A:
    - name: チョコソース
      emoji: "🍫"
      reason: とろっとかけたチョコソースは、チョコパフェの決め手。
    - name: プリン
      emoji: "🍮"
      reason: プリンがまるごとのったパフェは、ごちそう感たっぷり。
    - name: バナナ
      emoji: "🍌"
      reason: チョコバナナパフェは昭和からの定番の組み合わせ。
    - name: ブラウニー・スポンジ
      short: ブラウニー
      emoji: "🟫"
      reason: しっとりした焼き菓子が入ると、食べごたえがアップ。
    - name: 白玉
      emoji: "⚪"
      reason: もちもちの白玉は、和風パフェの主役。
  B:
    - name: コーンフレーク
      emoji: "🥣"
      reason: サクサク食感で、パフェの下の方で活躍。「かさ増し」と言われても、なくてはならない存在。
    - name: 抹茶ゼリー・わらび餅
      short: 抹茶ゼリー
      emoji: "🍵"
      reason: 抹茶パフェの層に入っていると、つるんとした食感が楽しい。
    - name: マンゴー
      emoji: "🥭"
      reason: 夏の南国パフェの主役。
    - name: クッキー
      emoji: "🍪"
      reason: 上に刺さったクッキーは、パフェの王冠。
    - name: あんこ
      emoji: "🫘"
      reason: 和風パフェの定番。アイスとの相性がいい。
  C:
    - name: ウエハース
      emoji: "📜"
      reason: 昔ながらのパフェに刺さっている定番。食べるタイミングに迷う。
    - name: さくらんぼ（缶詰）
      short: さくらんぼ
      emoji: "🍒"
      reason: てっぺんにのった赤いさくらんぼは、昭和のパフェの象徴。見た目担当。
  D:
    - name: シャーベット
      emoji: "🧊"
      reason: 甘いパフェの中で、さっぱりした酸味が口直しになる。パフェ好きがうなる名脇役。
    - name: 焼き菓子のクランブル
      short: クランブル
      emoji: "🟤"
      reason: サクサクのそぼろ状の焼き菓子。専門店のパフェでよく使われる、食感のアクセント。
summary: |
  パフェの具は、アイス・生クリーム・いちごがS。上から下まで、層ごとに味と食感が変わるのがパフェの楽しさ。
  コーンフレークは「かさ増し」と言われがちだけど、サクサク食感でクリームの甘さをリセットしてくれる大事な存在。
related: [food-ice, food-cake, food-kakigori]
