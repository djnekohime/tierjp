title: スマホで縦動画を撮るときのコツ Tier表
description: 明るさ、手ブレ対策、レンズの汚れ、音、構図…ショート動画やリールのための縦動画撮影のコツを、ゾーマが「見やすさの改善効果×手軽さ」でS〜Dにランク付け。
category: sns
tags:
- 初心者
- 動画
published: '2026-11-25'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 見やすさの改善効果

  ② 手軽さ（特別な機材がなくてもできるか）

  ③ 失敗の防ぎやすさ

  ※ 撮影場所のルールや、写り込む人のプライバシーには十分注意してください'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 明るい場所（窓の光）で撮る
    emoji: ☀️
    reason: 暗い動画は、それだけで見られにくい。自然光がいちばん手軽。
  - name: 撮る前に、レンズを拭く
    emoji: 🧽
    reason: 指の油でぼやけている動画は意外と多い。拭くだけで鮮明に。
  - name: スマホを固定する（または両手で持つ）
    emoji: 📱
    reason: 手ブレが減って、見ていて疲れない動画になる。
  A:
  - name: 大事なものは、画面の真ん中に置く
    emoji: 🎯
    reason: 縦動画は上下にボタンや文字が重なりやすい。
  - name: 周りの音を減らして、声をはっきり録る
    emoji: 🎙️
    reason: 音が聞こえにくい動画は、途中で離脱されやすい。
  - name: 1カットを短く撮る
    emoji: ✂️
    reason: 編集でつなぎやすく、テンポのいい動画になる。
  - name: 撮影前に、流れ（3〜4カット）を決めておく
    emoji: 📝
    reason: 撮り直しが減り、伝わりやすい構成になる。
  - name: 顔や被写体に、正面から光を当てる
    emoji: 💡
    reason: 逆光を避けるだけで、表情も物もきれいに写る。
  B:
  - name: 三脚・スマホホルダーを使う
    emoji: 🗜️
    reason: 固定が楽になり、手元の作業動画も撮りやすい。
  - name: 画面を縦に、まっすぐ構える（水平を意識）
    emoji: 📐
    reason: 傾いた映像は落ち着かない。グリッド線表示が便利。
  - name: ピントと明るさを、画面タップで固定する
    emoji: 👆
    reason: 撮っている途中で明るさが変わるのを防げる。
  - name: スマホ用の小さなマイクを使う
    emoji: 🎤
    reason: 声の聞きやすさが大きく変わる。話す動画なら効果大。
  - name: 本番前に、短いテスト撮影をする
    emoji: 🔁
    reason: 明るさや音の失敗に、撮る前に気づける。
  C:
  - name: デジタルズームで大きく寄る
    emoji: 🔍
    reason: 画質が落ちやすい。できれば自分が近づいて撮る。
  - name: とりあえず長回しする
    emoji: ⏳
    reason: 撮るのは楽だが、編集で切る手間が大きくなる。
  - name: 撮影中に、いろいろな効果をかける
    emoji: 🌈
    reason: やり直しがきかない。効果は編集で付けるほうが安心。
  D:
  - name: 通行人や他人の家などが写り込んだまま投稿する
    emoji: 🙈
    reason: プライバシーのトラブルになりやすい。必ず確認を。
  - name: 撮影禁止の場所で撮る
    emoji: 🚫
    reason: お店や施設のルールは必ず確認。迷惑にもなる。
  - name: 窓や照明を背にして撮る（逆光）
    emoji: 🌑
    reason: 顔が真っ暗になり、表情が伝わらない。
summary: 'ショート動画やリールは、編集より前に、撮影の段階でほとんど決まる。暗い、ブレる、音が聞こえにくい。この3つがあると、どれだけ編集をがんばっても、見てもらいにくい。逆に言えば、撮るときに少し気をつけるだけで、動画の見やすさは大きく変わる。S級は「明るい場所で撮る」「撮る前にレンズを拭く」「スマホを固定する（または両手で持つ）」の3つ。どれもお金がかからず、今日からできる。

  明るさは、窓からの自然光がいちばん手軽。顔や被写体に光が当たる向きで撮ると、肌も物もきれいに写る。逆に、窓を背にすると、顔が暗くなってしまう。夜は部屋の照明をつけて、できれば正面からやわらかい光を当てたい。

  A級は、音をクリアにする工夫、画面の上下に文字や操作ボタンが重なることを意識した構図、1カットを短く撮ること、撮影前に流れを決めておくこと。縦動画は、画面の上と下に、アプリのボタンや説明文が重なりやすい。大事なものは、画面の真ん中あたりに置こう。

  C級は「デジタルズームで大きく寄る」「とりあえず長回しする」。画質が落ちたり、あとで切るのが大変になったりする。D級は、通行人や他人の家などが写り込んだまま投稿すること、撮影禁止の場所で撮ること。トラブルのもとなので必ず確認を。

  撮影に慣れてきたら、三脚やスマホホルダー、小さなライト、スマホ用のマイクを足していくといい。最初から全部そろえる必要はない。まずは、明るい場所で、レンズを拭いて、固定して撮る。この3つから始めて、撮った動画を見返しながら、少しずつ改善していこう。あなたが次に撮る動画は、どのコツから試してみる？'
