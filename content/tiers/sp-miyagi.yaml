summary: '宮城は、仙台を中心に、福島発のヨークベニマル、山形発のヤマザワ、地元のウジエスーパーなど、県外のチェーンも交えて並ぶ。

  秋保温泉の「主婦の店さいち」のように、スーパーなのに全国から人が訪れる店があるのも、宮城の面白いところ。'
