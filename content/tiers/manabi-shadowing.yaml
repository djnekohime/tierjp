title: 英語シャドーイングのやり方・教材選び Tier表
description: 短い音声から、スクリプト確認、遅いスピード、録音して比べる…英語のシャドーイングを続けるコツを、ゾーマが「効果×続けやすさ×挫折しにくさ」でS〜Dにランク付け。
category: manabi
tags:
- 初心者
- 英語
- おうち学習
published: '2026-11-05'
labels:
  S: 迷ったらこれ
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 効果の出やすさ

  ② 続けやすさ

  ③ 挫折しにくさ

  ※ 学習の進み方は人それぞれです。声を出す練習は、住環境に合わせて、音量や時間帯に気をつけてください'
rank_notes:
  S: 迷ったらここから
  D: 避けたい
tiers:
  S:
  - name: 短い音声（30秒〜1分）から始める
    emoji: ⏱️
    reason: 短いと集中でき、繰り返しやすい。1日で完結する達成感がある。
  - name: スクリプト（文字）を先に確認する
    emoji: 📄
    reason: 意味と単語が分かってから真似すると、効果がぐんと上がる。
  A:
  - name: ゆっくり再生できる教材を選ぶ
    emoji: 🐢
    reason: 0.75倍速などで始められると、無理なく追いつける。
  - name: 自分の声を録音して聞き返す
    emoji: 🎙️
    reason: ずれやクセが分かる。最初は恥ずかしいが、上達に直結する。
  - name: 同じ素材を3〜5日繰り返す
    emoji: 🔁
    reason: 口が慣れてくるのが分かる。新しい素材を次々探すより、効果的。
  - name: 毎日10分と決めて続ける
    emoji: 📆
    reason: 短時間でも毎日のほうが、週末にまとめてやるより定着しやすい。
  B:
  - name: 好きなドラマ・映画のセリフで練習する
    emoji: 🎬
    reason: 好きなものなら続けられる。日常会話の表現も学べる。
  - name: 通勤・家事の合間に、小声でやる
    emoji: 🚶
    reason: スキマ時間の活用に。周りの迷惑にならない声量で。
  - name: 歌の一節で、リズムをつかむ
    emoji: 🎵
    reason: リズムや息つぎの練習に。歌詞の細かい引用はせず、自分で楽しむ程度に。
  - name: 慣れたらスクリプトなしに挑戦する
    emoji: 🙈
    reason: 耳だけで追う練習。むずかしく感じたら、スクリプトに戻ってOK。
  - name: 友だちと一緒に、お互いに発表し合う
    emoji: 🤝
    reason: 張り合いが出て、続けるきっかけになる。
  C:
  - name: いきなりニュースの速い音声に挑む
    emoji: 📰
    reason: 情報量が多く、ついていけない。中級以降のほうが向いている。
  - name: 意味が分からないまま、音だけ真似る
    emoji: 🔇
    reason: 発音の練習にはなるが、理解が伴わないので伸びにくい。
  - name: 発音の細かい間違いを気にしすぎる
    emoji: 🔬
    reason: 完璧を目指すと続かない。通じる英語を目指そう。
  D:
  - name: 1回やって、すぐ教材を替える
    emoji: 🔀
    reason: 身につく前に次へ進むと、結局どれも中途半端になる。
  - name: 大きな声で、深夜に練習する
    emoji: 🌙
    reason: 近所迷惑になる。時間帯と音量は、環境に合わせて調整を。
  - name: つまずいた日に、練習そのものをやめてしまう
    emoji: 🛑
    reason: うまくいかない日は誰にでもある。5分だけでもやる習慣を。
summary: 'シャドーイングは、聞こえてくる英語を、影（シャドー）のように少し遅れて声に出して追いかける練習。聞く力と話すリズムを同時に鍛えられるが、むずかしい教材から始めると続かない。

  S級は、短い音声（30秒〜1分）から始めること、スクリプト（文字）を先に確認すること。意味が分からないものを真似し続けても、ただの音の練習になってしまう。『意味が分かる＋音をなぞる』の組み合わせが、いちばん成果が出やすい。

  A級は、ゆっくり再生できる教材を選ぶ、録音して聞き返す、など。自分の声を聞くと、思ったよりずれていることに気づける。ここが上達のポイントだ。

  B級は、好きな映画やドラマ、歌の一節を使うなどの楽しい工夫。好きなものは続きやすい。

  C・Dは、おすすめしにくい方法。いきなり速くて長い音声に挑むと、ついていけず自信を失ってしまう。

  毎日10分で十分。同じ素材を3〜5日続けて繰り返すと、少しずつ口が追いつくようになる。うまくいかない日は、スクリプトを見ながら音読に戻るだけでもOK。英検や旅行、海外ドラマを字幕なしで楽しみたい人の、強い味方になってくれる。

  教材は、自分の目的に合ったものを選ぶとよい。旅行英語なら会話文、英検なら過去問のリスニング、海外ドラマが好きなら短いシーンから。目的がはっきりしていると、続けるモチベーションが保てる。焦らず、1か月続けた自分を、ぜひ褒めてあげてね。なお、練習の前後に発音を確かめたいときは、辞書アプリの音声機能なども活用できる。'
