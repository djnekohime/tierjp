title: 軍艦巻き Tier表
description: いくら、うに、ねぎとろ、かにみそ、コーン、ツナサラダ、納豆、しらす…寿司の軍艦巻きを、AIが「食べたい度×軍艦ならではのおいしさ」でランク付け。
category: food
genre: 寿司・海鮮
tags: [グルメ]
published: 2026-09-29
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「まずこれを取る」と思える人気
  ② のりとシャリとの相性（軍艦にしてこそのおいしさ）
  ③ 回転寿司でも楽しめるお値打ち感
  ※ 好みは人それぞれ。ランクは「一番多くの人が喜びそうな順」です
rank_notes:
  S: 軍艦巻きの三大スター
  D: 好きな人にはたまらない個性派
tiers:
  S:
    - name: いくら
      emoji: "🔴"
      reason: 軍艦巻きの王様。こぼれそうなほど盛られたいくらは、見た目も味も華やか。
    - name: うに
      emoji: "🟡"
      reason: とろける甘さと海の香り。軍艦巻きは、うにのおいしさを一番引き立てる形。
    - name: ねぎとろ
      emoji: "🟣"
      reason: マグロのたたきとねぎの組み合わせ。とろける食感と手ごろさで、回転寿司の大人気メニュー。
  A:
    - name: かにみそ
      emoji: "🦀"
      reason: 濃厚でコクのあるかにみそは、お酒好きに特に人気。少量でも満足感が大きい。
    - name: とびこ
      emoji: "🟠"
      reason: トビウオの卵。プチプチした食感が楽しく、色も鮮やか。
    - name: 生しらす
      emoji: "✨"
      reason: 透き通ったしらすに生姜としょうゆ。水揚げされた港の近くでしか食べられない、鮮度が命の一貫。
    - name: かにサラダ
      emoji: "🥗"
      reason: かにかまとマヨネーズのやさしい味。子供から大人まで幅広く人気。
    - name: 白子
      emoji: "☁️"
      reason: 冬に登場するクリーミーな一貫。好き嫌いは分かれるが、好きな人には最高のごちそう。
  B:
    - name: ツナサラダ
      emoji: "🥫"
      reason: ツナマヨの軍艦は、回転寿司の子供人気ナンバーワン候補。
    - name: コーン
      emoji: "🌽"
      reason: マヨネーズであえたコーンの軍艦。寿司に慣れていない子供の強い味方。
    - name: 納豆
      emoji: "🫘"
      reason: ねばねばの納豆とのりの相性は抜群。好き嫌いは分かれるが、根強いファンがいる。
    - name: 数の子
      emoji: "🟨"
      reason: コリコリの食感とほどよい塩気。お正月気分を感じられる一貫。
    - name: たらこ・明太子
      short: たらこ・明太子
      emoji: "🌶️"
      reason: 粒々の食感と塩気がシャリに合う。明太マヨにするとさらに人気。
    - name: 小柱
      emoji: "🐚"
      reason: バカガイの貝柱。甘みと歯ごたえがあり、軍艦にすると粒がそろって美しい。
  C:
    - name: 釜揚げしらす
      emoji: "🍚"
      reason: ふっくらした釜揚げのしらす。やさしい味だが、生しらすに比べると印象は控えめ。
    - name: まぐろユッケ
      emoji: "🥚"
      reason: 甘辛いたれであえたマグロに卵黄をのせた軍艦。回転寿司の創作メニューとして人気。
  D:
    - name: あん肝
      emoji: "🟤"
      reason: 「海のフォアグラ」とも呼ばれる、濃厚でとろける一貫。冬の通好みのネタ。
    - name: ハンバーグ・唐揚げ軍艦
      short: 肉系の軍艦
      emoji: "🍖"
      reason: 回転寿司ならではの自由な発想の軍艦。寿司好きには賛否両論だが、子供は大喜び。
summary: |
  軍艦巻きは、いくら・うに・ねぎとろがS。どれも、のりで囲うことで初めて一貫の寿司になる、軍艦巻きのために生まれたようなネタ。
  ツナサラダやコーン、肉系の軍艦は、回転寿司が生んだ新しい寿司の文化。寿司通には賛否があっても、家族みんなで楽しめる形として定着した。
related: [food-sushi-neta, food-kaitenzushi-side]
