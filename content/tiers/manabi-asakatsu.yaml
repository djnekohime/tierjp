  - name: 起きたら、カーテンを開けて光を浴びる
    emoji: 🌅
    reason: 目が覚めやすく、頭がすっきりする。
  - name: 最初の一口は、水か温かい飲み物
    emoji: ☕
    reason: 体が目覚め、落ち着いて始められる。
  - name: やる内容を、前日に決めておく
    emoji: 📝
    reason: 迷う時間がなくなり、すぐ集中できる。
  - name: スマホは、別の場所に置いておく
    emoji: 📵
    reason: 通知で手が止まらず、集中が続く。
  B:
  - name: できた日に、カレンダーに印をつける
    emoji: ✅
    reason: 目に見える達成感が、続ける力になる。
  - name: 勉強する場所を、決めておく
    emoji: 📍
    reason: 場所に慣れると、スイッチが入りやすい。
  - name: 友だちや家族に、宣言しておく
    emoji: 📣
