summary: '朝活がうまくいかない一番の理由は、「いきなり頑張りすぎること」。1時間早起きして2時間勉強しよう、と決めると、3日で挫折しやすい。

  S級は、前日の夜に準備しておくことと、まず15分から始めること。起きてから何をするか迷わなければ、布団から出る負担がぐっと減る。

  睡眠時間を削ってまで早起きするのは、長い目で見ると逆効果。まずは、夜に寝る時間を30分早めて、その分だけ早く起きるのが基本。

  続けるコツは、勉強の内容を軽くすること。朝は頭がすっきりしているので、単語や計算など、短時間で終わるものが向いている。難しい作業は、最後に回さず、最初に持ってくるのもおすすめ。

  朝活の目的は、勉強時間を増やすことより、「毎日少しでも続ける習慣」をつくること。できなかった日があっても、翌日に戻れば大丈夫。

  1週間続いたら、時間を5分ずつ増やしてみよう。無理のない範囲で伸ばすのがポイント。体調が悪い日は、休んでも問題ない。睡眠の悩みが続くときは、専門家に相談してみてほしい。

  続かなかったときは、時間を短くするか、内容を軽くするかのどちらかを試してみよう。自分を責めずに、仕組みのほうを調整するのがコツ。2週間続けば、体のリズムが整って、ぐっと楽になってくる。

  ランクはあくまで目安。自分や家族の暮らしに合わせて、ぴったりの組み合わせを見つけてほしい。みんなのTier表と並べて、違いを楽しむのもおすすめ。やってみて合わなければ、気軽に変えていけばOK。'
