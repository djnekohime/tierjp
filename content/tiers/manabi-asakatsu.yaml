title: 朝活の勉強、続けるコツ Tier表
description: 前日に準備、15分から、起きる時間を一定に、スマホは別の部屋…朝の勉強を続けるコツを、ゾーマが「続けやすさ×無理のなさ×効果の出やすさ」でS〜Dにランク付け。
category: manabi
tags:
- 初心者
- あるある
published: '2026-11-01'
labels:
  S: ぜひ実践
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 続けやすさ

  ② 無理のなさ（睡眠や体調を削らないか）

  ③ 効果の出やすさ

  ※ 朝型・夜型には個人差があります。睡眠不足になるほど早起きするのはおすすめしません'
rank_notes:
  S: ぜひ実践
  D: 避けたい
tiers:
  S:
  - name: 前日の夜に、教材を出しておく
    emoji: 📚
    reason: 起きたら迷わず始められて、布団を出る負担が減る。
  - name: 最初は、15分だけにする
    emoji: ⏱️
