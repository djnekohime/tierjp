title: さつまいもの料理 Tier表
description: 焼き芋、大学いも、スイートポテト、天ぷら、芋けんぴ、味噌汁…さつまいもの食べ方を、AIが「おいしさ×手軽さ×また食べたい度」でS〜Dにランク付け。
category: food
genre: 野菜・果物
tags:
- グルメ
published: '2026-10-07'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① おいしさ・好きな人の多さ

  ② 手軽さ（家で作りやすいか）

  ③ また食べたくなる度

  ※ さつまいもの品種（ねっとり系・ほくほく系）でも、向く料理が変わります'
rank_notes:
  S: 秋はまずこれ
  D: 好みが分かれる・変わり種
tiers:
  S:
  - name: 焼き芋
    emoji: 🍠
    reason: じっくり焼いた甘みは、秋冬のごちそう。ねっとり系の品種なら、スイーツのような甘さ。
  - name: 大学いも
    emoji: 🍬
    reason: カリッと揚げて、甘い蜜をからめる。お店の味が家庭でも作れる人気の味。
  A:
  - name: スイートポテト
    emoji: 🧁
    reason: バターと卵でなめらかに。おもてなしにも向く、定番のスイーツ。
  - name: 天ぷら
    emoji: 🍤
    reason: ほくほくで、衣のサクサク感との対比が最高。塩でも、天つゆでもおいしい。
  - name: 芋けんぴ
    emoji: 🥢
    reason: カリッとした食感と、素朴な甘さ。つい手が止まらないおやつ。
  B:
  - name: 蒸かし芋
    emoji: 🍠
    reason: 素材の味がそのまま。皮ごと食べれば、食物繊維もとれる。
  - name: さつまいもご飯
    emoji: 🍚
    reason: 炊き込むと、ほんのり甘く、やさしい味に。塩をひとつまみ入れるのがコツ。
  - name: 味噌汁
    emoji: 🥣
    reason: 甘みが味噌とよく合う、秋冬の汁物。具だくさんにもなる。
  - name: 干し芋
    emoji: 🟠
    reason: じっくり干して、甘みが凝縮。素朴で、噛むほど味が出る。
  C:
  - name: 煮物（甘煮・レモン煮）
    emoji: 🍯
    reason: ほくほくに、やさしい甘さ。副菜にも、おやつにもなる。
  - name: ポタージュ
    emoji: 🥛
    reason: なめらかで、体が温まる。寒い日の朝食にも。
  - name: サラダ（さつまいも）
    emoji: 🥗
    reason: マヨネーズで和えると、甘じょっぱい味に。ランチにもなる。
  - name: チップス
    emoji: 🍟
    reason: 薄く切って揚げると、サクサクのスナックに。
  D:
  - name: きんとん
    emoji: 🌰
    reason: おせちの定番。甘さが強く、好みは分かれる。
  - name: モンブラン風
    emoji: 🌰
    reason: 栗の代わりにさつまいもで作る、アレンジスイーツ。
summary: 'さつまいもは、秋冬の甘いごちそう。S級の「焼き芋」は、じっくり焼くとでんぷんが糖に変わり、自然な甘さが引き出される。

  おやつにもおかずにもなる、万能食材。電子レンジでも、トースターでも、手軽においしく作れる。'
related:
- food-aki
- food-imo
- food-imo-okashi
