rank_notes:
  S: パン屋さんの三大スター
  D: 通好み
tiers:
  S:
  - name: クロワッサン
    emoji: 🥐
    reason: 焼きたてのバターの香り。パン屋さんの入り口で、必ず手がのびる。
  - name: 食パン
    emoji: 🍞
    reason: 毎日の定番。焼きたてをすぐ買うのは、ちょっとした贅沢。
  - name: カレーパン
    emoji: 🥟
    reason: 揚げたての香ばしさ。1個は必ず買う。
  A:
  - name: メロンパン
    emoji: 🍈
    reason: 外はサクサク、中はふわふわ。子供も大人も好き。
  - name: あんパン
    emoji: 🫘
    reason: やさしい甘さの、日本のパンの代表。
  - name: クリームパン
    emoji: 🍮
    reason: とろっとしたカスタード。
  - name: 塩パン
    emoji: 🧂
    reason: バターの香りと、塩気。バリエーションも多い。
  - name: チョコパン
    emoji: 🍫
    reason: チョコレートの甘さ。子供のころの思い出。
  B:
  - name: 焼きそばパン
    emoji: 🍝
    reason: 炭水化物の組み合わせ。罪悪感と満足感。
  - name: コロッケパン
    emoji: 🥔
    reason: ソースをしみ込ませた、ほくほくの組み合わせ。
  - name: フランスパン
    emoji: 🥖
    reason: パリッと香ばしい。チーズやハムと一緒に。
  - name: デニッシュ
    emoji: 🍎
    reason: バターの層と、フルーツ。ちょっとぜいたく。
  C:
  - name: サンドイッチ
    emoji: 🥪
    reason: ランチに。パン屋さんのは、ちょっと高い。
  - name: ドーナツ
    emoji: 🍩
    reason: パン屋さんにもあると、つい。
  D:
  - name: ハード系のパン（カンパーニュ）
    short: ハード系
    emoji: 🌾
    reason: 噛めば噛むほど、味が出る。通好みのパン。
  - name: 季節限定のパン
    emoji: 🍂
    reason: 栗やさつまいも。その時期だけの楽しみ。
summary: 'パン屋さんで必ず買うものは、クロワッサン・食パン・カレーパンがS。焼きたての香りには、勝てない。

