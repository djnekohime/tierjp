title: パン屋さんで必ず買うもの Tier表
description: クロワッサン、食パン、メロンパン、あんパン、カレーパン、クリームパン、チョコパン、焼きそばパン、フランスパン、デニッシュ、コロッケパン、塩パン…パン屋さんで必ず買ってしまうものを、AIが「つい買っちゃう度×満足度」でランク付け。
