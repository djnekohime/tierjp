  ② 続けやすさ

  ③ 相手への配慮（角が立たないか）

  ※ SNSの機能や名称は、サービスごとに違い、変わることもあります。つらい投稿や言葉で心が重いときは、無理せず距離を置き、必要なら周りの人や相談窓口を頼ってください'
