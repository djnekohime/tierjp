summary: 'SNSのタイムラインは、気づくと「見たくない投稿」「疲れる投稿」で埋まりやすい。フォロー整理の目的は、誰かを切り捨てることではなく、自分が気持ちよく使える場所を整えること。

  S級は、ミュート（相手に通知されない）、リスト機能で分ける、見る時間を決める。どれも、相手に気づかれず、角が立たない方法だ。

  年末は、見直しにぴったりの時期。1年を振り返って、「今の自分に必要な情報か」を軽く確認してみよう。

  反対に、D級は「あてつけのように、突然ブロックする」「整理しすぎて、見るものが何もなくなる」。後で気まずくなったり、つまらなくなったりする。

  フォロー数が多すぎると、情報が流れすぎて疲れる。逆に、少なすぎると、新しい発見がなくなる。「楽しい」「役に立つ」が7割、「たまに刺激」が3割くらいのバランスが、続けやすい。

  整理は、1日に10人だけ、のように小分けにするのがおすすめ。一気にやると、疲れるし、後悔しやすい。

  整理した後も、ときどき見直して、いまの自分に合うか確認しよう。

  【ひとこと】フォロー整理は、「大掃除」ではなく「模様替え」くらいの気持ちでいい。年末に少しだけ見直して、新年を気持ちよく迎えよう。整理したあとは、好きなアカウントを新しく見つけるのも楽しい。自分にとって、居心地のいいタイムラインを育てていこう。

  【補足】整理の基準は人それぞれ。「見て心が軽くなるか」を一つの目安にして、迷ったらミュートで様子を見るのがおすすめ。'
