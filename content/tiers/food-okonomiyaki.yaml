title: お好み焼きの具 Tier表
description: 豚玉、いか、えび、もち、チーズ、そば、ねぎ、紅しょうが、天かす…お好み焼きの具を、AIが「入れたい度×満足感×お好み焼きらしさ」でランク付け。関西風か広島風かでも意見が割れる。
category: food
genre: 麺・粉もの
tags: [グルメ]
published: 2026-09-30
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: |
  ① 「これは絶対に入れたい」と思える人気
  ② 焼いたときのおいしさと満足感
  ③ お好み焼きらしさ（生地とソースとの相性）
  ※ 関西風（混ぜ焼き）・広島風（重ね焼き）など、地域で作り方が違います
rank_notes:
  S: 迷ったらこの組み合わせ
tiers:
  S:
    - name: 豚肉
      emoji: "🐖"
      reason: お好み焼きの王道「豚玉」の主役。カリッと焼けた豚バラの脂が、生地とソースに合う。
    - name: キャベツ
      emoji: "🥬"
      reason: 具というより、お好み焼きの土台。甘みとシャキシャキ感が、ふわっとした食感を生む。
    - name: 天かす
      emoji: "🟡"
      reason: 生地に入れると、ふっくら軽い食感とコクが出る。目立たないが欠かせない名脇役。
  A:
    - name: いか
      emoji: "🦑"
      reason: シーフード系の定番。噛むほどにうまみが出る。
    - name: えび
      emoji: "🦐"
      reason: プリプリの食感と甘み。豚やいかと合わせた「ミックス」は人気メニュー。
    - name: 焼きそば（そば入り）
      short: そば
      emoji: "🍝"
      reason: 広島風お好み焼きの主役の一つ。関西では「モダン焼き」として楽しまれる、ボリューム満点の具。
    - name: もち
      emoji: "⬜"
      reason: とろっと伸びるもちが、食感にアクセントをくれる。チーズと合わせた「もちチーズ」は大人気。
    - name: チーズ
      emoji: "🧀"
      reason: とろける濃厚なコク。子供から大人まで好きな人が多い。
  B:
    - name: 紅しょうが
      emoji: "🔴"
      reason: 少し入れるだけでさっぱりしたアクセントになる。
    - name: 青ねぎ
      emoji: "🧅"
      reason: たっぷり入れた「ねぎ焼き」は大阪の名物。しょうゆ味で食べるのもおいしい。
    - name: 牛すじ
      emoji: "🐂"
      reason: 甘辛く煮込んだ牛すじとこんにゃくの「すじこん」は、関西のお好み焼き屋さんの人気メニュー。
    - name: コーン
      emoji: "🌽"
      reason: 甘みとプチプチ感。子供に人気の具。
    - name: たこ
      emoji: "🐙"
      reason: たこ焼きのように、弾力のある食感を楽しめる。
  C:
    - name: 明太子
      emoji: "🌶️"
      reason: もちやチーズと合わせた「明太もちチーズ」は人気だが、単体では好みが分かれる。
    - name: キムチ
      emoji: "🥬"
      reason: 豚キムチのお好み焼きは、ピリ辛でビールに合う。
  D:
    - name: とろろ（山芋）
      emoji: "🤍"
      reason: 生地に混ぜると、ふわふわのやわらかい食感に。具というより「プロの隠し技」。
    - name: カレー粉
      emoji: "🍛"
      reason: 生地やソースにカレー粉を加えるアレンジ。意外にソースと合う、通好みの味変。
summary: |
  お好み焼きの具は、豚肉・キャベツ・天かすがS。関西風は混ぜて焼き、広島風はそばを入れて重ねて焼くなど、地域で作り方がまったく違う。
  もちチーズやすじこんのように、お店ごとの人気メニューを試すのも楽しい。家で焼くなら、とろろを混ぜるとお店のようなふわふわ食感に近づく。
related: [food-udon, food-yakiniku-bui]
