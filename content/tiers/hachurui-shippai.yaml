title: 爬虫類飼育のやりがちな失敗 Tier表
description: 温度管理、紫外線不足、湿度、えさ、脱走、病院探し…レオパやフトアゴなど爬虫類飼育でやりがちな失敗を「起こりやすさ×被害の大きさ」でS〜Dにランク付け。
category: animals
tags: [爬虫類, 動物, 初心者]
published: 2026-10-03
labels:
  S: いちばん多い失敗
  A: かなり多い
  B: ありがち
  C: 気づきにくい
  D: 防げる事故
criteria: |
  ① 初心者が経験しやすいか
  ② 動物への被害の大きさ
  ③ 対策のしやすさ
  ※ 爬虫類は、種類ごとに必要な温度・湿度・紫外線が違います。ここでは「ありがちな失敗」を整理しています。具合が悪いときは、爬虫類を診られる動物病院へ
rank_notes:
  S: 初心者が最初にぶつかる壁
  D: 気をつければ防げる
tiers:
  S:
    - name: 温度管理が足りない（温めすぎ・冷やしすぎ）
      short: 温度管理
      emoji: "🌡️"
      reason: 爬虫類は、体温を外の温度に頼っている。ヒーターとサーモスタットで、温度の高い場所と低い場所を作る。夏と冬の室温の変化にも、必ず備える。
    - name: 紫外線ライトが足りない・古い
      short: 紫外線不足
      emoji: "☀️"
      reason: 昼行性の種類（フトアゴやリクガメなど）は、紫外線が不足すると、骨の病気になることがある。ライトは、種類に合ったものを選び、古くなったら交換する。
    - name: 種類に合った湿度・水分管理をしていない
      short: 湿度・水分
      emoji: "💧"
      reason: 乾燥が好きな種類と、湿度が必要な種類がいる。湿度が合わないと、脱皮不全や、体調不良の原因になる。
  A:
    - name: 迎える前に病院を探していない
      short: 病院を探してない
      emoji: "🏥"
      reason: 爬虫類を診られる獣医さんは限られる。具合が悪くなってから探すと、間に合わないことがある。迎える前に、近くの病院を調べておく。
    - name: えさをあげすぎる
      short: えさのあげすぎ
      emoji: "🍽️"
      reason: 太りすぎは、病気の原因になる。種類と成長に合った量を守る。幼体と成体で、与える回数も変わる。
    - name: 触りすぎ・ハンドリングのしすぎ
      short: 触りすぎ
      emoji: "🤲"
      reason: 慣れていない状態で触りすぎると、ストレスでえさを食べなくなることがある。環境に慣れてから、少しずつ短時間で。
    - name: 床材の選び方がよくない
      short: 床材
      emoji: "🪵"
      reason: 砂を誤飲して、詰まらせる事故や、湿気で傷む原因になる。種類と年齢に合った、安全な床材を選ぶ。
    - name: 買ってきてすぐ触ったり、ようすを見すぎたりする
      short: 迎えてすぐ触る
      emoji: "📦"
      reason: 新しい環境には、慣れる時間が必要。最初の数日は、そっとして、落ち着かせる。
  B:
    - name: 脱走される
      emoji: "🏃"
      reason: ふたのすき間や、メンテナンス中の隙に、脱走してしまうことがある。ふたはしっかり閉め、ロックできるものにする。
    - name: 多頭飼いでけんかをさせる
      short: 多頭飼い
      emoji: "⚔️"
      reason: 縄張り意識の強い種類は、同じケージで飼うと、けんかや食いつきの原因になる。基本は、1匹ずつ別のケージで。
    - name: 生き餌をうまく管理できない
      short: 生き餌の管理
      emoji: "🦗"
      reason: コオロギなどは、においや逃げ出しが悩み。栄養を与える工夫（ガットローディング）もあるので、事前に確認する。
    - name: 食べないときにあわてて、えさを変えすぎる
      short: 拒食であわてる
      emoji: "🍴"
      reason: 季節や脱皮前などで、食べない時期があることも。あわてて、えさをころころ変えるのは逆効果なので、まず環境や体調を見直す。
    - name: 水入れの水が汚れたまま
      short: 水が汚れている
      emoji: "🚰"
      reason: 水が汚れると、病気の原因になる。毎日、きれいな水に取り替える。
  C:
    - name: 脱皮の不調に気づかない
      short: 脱皮不全
      emoji: "🩹"
      reason: 指先や尾に、皮が残っていると、血行障害になることがある。湿度を見直し、様子がおかしいときは、獣医さんに相談。
    - name: 寄生虫やダニの検査をしていない
      short: 寄生虫
      emoji: "🔬"
      reason: 迎えたばかりの個体は、寄生虫を持っていることがある。気になる場合は、動物病院で検査してもらう。
    - name: 家族に「飼い方の約束」を共有していない
      short: 家族への共有
      emoji: "👪"
      reason: 急に温度を変えたり、勝手にえさをあげたりすると、事故になりやすい。家族でルールを決めておく。
  D:
    - name: 手で触ったあとに、手を洗わない
      short: 手洗い
      emoji: "🧼"
      reason: 爬虫類は、サルモネラ菌を持っていることがある。触ったあとは、必ず手を洗う。小さな子どもや高齢者がいる家では、特に気をつける。
    - name: 飼えなくなって、野外に放す
      short: 野外に放す
      emoji: "🚫"
      reason: 外来の動物を野外に放すと、生態系に影響が出るほか、動物自身も生きられないことが多い。最後まで責任を持ち、飼えなくなったときは、引き取り手を探す。
summary: |
  爬虫類飼育の失敗の多くは、「温度」「紫外線」「湿度」の環境づくり。変温動物なので、環境がそのまま体調に出る。
  かわいさだけでなく、必要な環境と、診てもらえる病院、寿命までを考えて迎えたい。野外に放すことは、絶対にしない。
related: [hachurui-shurui, hachurui-goods, shoudoubutsu-shippai]
