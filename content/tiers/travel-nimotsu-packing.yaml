summary: '旅行の荷造りは、楽しい準備の一部。でも、当日の朝になって「あれがない！」と焦る経験は、誰にでもあるはず。

  S級は、前もってチェックリストを作ること、旅行の数日前に荷造りを始めること、そして「持っていくもの」より「なくても困らないもの」を見極めること。余裕を持った荷造りは、旅の質をぐっと上げてくれる。

  チェックリストは、一度作れば次からも使える。スマホのメモにテンプレートを保存しておくと、旅のたびに少し直すだけで済む。

  荷物は、少ないほど身軽に動ける。現地で買えるもの（シャンプーなど）は、持っていかない選択もある。迷ったものは、「現地で買えるか」「なくても何とかなるか」を考えて、減らしてみよう。

  服は、巻くか、畳んで、小分けのポーチや袋に入れると、取り出しやすい。貴重品、薬、充電器は、手元のバッグに入れ、預ける荷物には入れないのが基本。

  飛行機に乗る場合は、液体物の持ち込み制限、モバイルバッテリーの扱い、荷物の重さの制限に注意が必要。航空会社の案内を、事前に確認してね。

  帰りは、お土産で荷物が増える。最初から、少し余裕のあるバッグにしておくか、折りたたみのバッグを1つ入れておくと安心。準備をしっかりして、旅を楽しもう。

  旅から帰ったら、使わなかったものをメモしておくと、次の荷造りがぐっと楽になる。「持っていったけど使わなかった」ものは、次は置いていく候補だ。

  反対に、「あればよかった」と思ったものも、メモしておこう。この記録が、あなた専用の、最強のチェックリストになる。荷造りも、旅の楽しみのひとつ。わくわくしながら、準備してね。'
