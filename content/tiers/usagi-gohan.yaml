title: ウサギが食べていいもの・ダメなもの Tier表
description: チモシー、ペレット、小松菜、にんじん、チョコレート…ウサギに与えていい食べものと、危ない食べものを、おすすめ度と安全性でS〜Dにランク付け。
category: animals
tags: [ウサギ, 小動物, 動物, 初心者]
published: 2026-10-03
labels:
  S: 毎日の主役
  A: 安心して使える
  B: ごほうび向き
  C: 少量・要注意
  D: 与えない
criteria: |
  ① ウサギの体に合っているか（食物繊維・栄養のバランス）
  ② 安全性（中毒・消化への負担）
  ③ あげやすさ・続けやすさ
  ※ 獣医師の診断や助言ではありません。ウサギは消化器がデリケートで、食事の変更は少しずつ行います。体調がおかしいときは、すぐウサギを診られる動物病院へ
rank_notes:
  S: 食事の中心にすべきもの
  D: 食べさせてはいけないもの
tiers:
  S:
    - name: 牧草（チモシーなど）
      short: 牧草
      emoji: "🌾"
      reason: ウサギの食事の中心。食物繊維が豊富で、胃腸の動きと歯の伸びすぎを防ぐのに欠かせない。いつでも好きなだけ食べられるように用意する。
    - name: きれいな水
      emoji: "💧"
      reason: 食事とあわせて、いつでも飲めるようにする。ボトルでも皿でも、ウサギが飲みやすいほうを。毎日取り替える。
  A:
    - name: ウサギ用ペレット
      short: ペレット
      emoji: "🟤"
      reason: 栄養バランスが整った、固形のえさ。牧草とあわせて、決まった量をあげる。与えすぎると、太ったり、牧草を食べなくなったりする。
    - name: 小松菜
      emoji: "🥬"
      reason: 手に入りやすく、嗜好性もよい野菜。毎日あげるなら量を決め、洗って水気を切る。ほかの葉物とあわせて、種類を変える。
    - name: チンゲンサイ・大根の葉などの葉物野菜
      short: 葉物野菜
      emoji: "🥗"
      reason: 水分が多く、ビタミンも補える。農薬を落とし、傷んだ部分は取りのぞく。ウサギの好みに合わせて、少しずつ試す。
    - name: パセリ・セロリなどの香味野菜
      short: パセリ・セロリ
      emoji: "🌿"
      reason: 香りが好きなウサギが多い。栄養はあるが、与えすぎは避け、少量を目安にする。
  B:
    - name: にんじん（葉・根）
      short: にんじん
      emoji: "🥕"
      reason: ウサギの好物のイメージだが、根は糖分が多いので、ごほうび程度に。葉は、野菜として使いやすい。
    - name: 乾燥ハーブ・野草
      short: ハーブ・野草
      emoji: "🌼"
      reason: タンポポなどの野草や、ハーブのおやつは、香りがよく食いつきがよい。農薬や排気ガスのない場所のものを選ぶ。
    - name: りんご・バナナなどの果物
      short: 果物
      emoji: "🍎"
      reason: 糖分が多いので、ごくごく少量の、ごほうびにとどめる。種や皮、芯は取りのぞいておく。
    - name: ウサギ用のおやつ（ドライフルーツ・クッキー）
      short: ウサギ用おやつ
      emoji: "🍪"
      reason: しつけやふれあいのごほうびに便利。ただし、糖分が多いので、1日の量を決めて、あげすぎない。
  C:
    - name: 結球レタス・キャベツ
      short: レタス・キャベツ
      emoji: "🥬"
      reason: 水分が多く、食べ過ぎるとお腹をこわすことがある。与えるなら少量にして、様子を見る。
    - name: ひまわりの種・ナッツ類
      short: 種・ナッツ
      emoji: "🌻"
      reason: 脂肪が多く、ウサギの体に合わない。食べすぎると、肥満や消化のトラブルにつながる。
    - name: 市販のミックスえさ（種や穀物入り）
      short: ミックスえさ
      emoji: "🛍️"
      reason: 好きなものだけ選んで食べる偏食になりやすい。パッケージの表示を確認して、ペレット中心のほうが安心。
  D:
    - name: ネギ類（玉ねぎ・にんにくなど）
      short: ネギ類
      emoji: "🧅"
      reason: ウサギの体には有害になることがある。料理の残りも含めて、与えない。
    - name: チョコレート・人間のお菓子
      short: チョコ・お菓子
      emoji: "🍫"
      reason: 糖分や脂肪が多く、ウサギの体には負担が大きい。チョコレートは中毒の危険もあるので、置きっぱなしにしない。
    - name: じゃがいもの芽・皮、アボカド、ルバーブ
      short: 有害な野菜
      emoji: "⚠️"
      reason: ウサギには有害になる成分を含むものがある。これらは与えず、迷うときはあげない。
    - name: 乳製品・パン・お米などの人間の食べもの
      short: 人間の食べもの
      emoji: "🍞"
      reason: 消化がうまくできず、お腹をこわしたり、腸内のバランスが乱れたりする。人の食べものは分けない。
summary: |
  ウサギの食事の中心は、「牧草」と「きれいな水」。ペレットや野菜は、その補助と考えるのが基本。
  「ウサギ＝にんじん」のイメージは、実は糖分が多くて、与えすぎには向かない。迷ったら、まず牧草。食事のバランスや、変更の仕方は、ウサギを診られる獣医さんに相談しながら進めたい。
related: [usagi-shigusa, shoudoubutsu-shurui, shoudoubutsu-shippai]
