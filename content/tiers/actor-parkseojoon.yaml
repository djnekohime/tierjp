title: パク・ソジュン出演ドラマ Tier表
description: 梨泰院クラス、キム秘書、彼女はキレイだった…パク・ソジュンの出演ドラマを、AIが「作品の面白さ×パク・ソジュンの魅力」でランク付け。
category: entame
tags: [韓国ドラマ, 俳優, パク・ソジュン]
published: 2026-09-29
criteria: |
  ① 作品そのものの面白さ
  ② パク・ソジュンの魅力が最大限に出ているか
  ③ ファンでない人にもすすめられるか
rank_notes:
  S: パク・ソジュンの魅力が爆発
tiers:
  S:
    - name: キム秘書はいったい、なぜ?（2018）
      short: キム秘書
      emoji: "👓"
      reason: パク・ミニョンと共演。ナルシストな副会長役で、自信満々なのに空回りする姿が最高に愛おしい。ラブコメ王の称号を決定づけた作品。
    - name: 彼女はキレイだった（2015）
      emoji: "💄"
      reason: ファン・ジョンウムと共演。冷たい編集長が初恋の人に気づいていく姿に、ときめきと切なさがつまっている。
  A:
    - name: 梨泰院クラス（2020）
      emoji: "🍻"
      reason: 復讐のために飲食店を育てていく主人公パク・セロイ役。栗のような髪型まで話題になり、日本でも大ブームに。
    - name: サム、マイウェイ〜恋の一発逆転！〜（2017）
      emoji: "🥊"
      reason: キム・ジウォンと共演。夢をあきらめかけた幼なじみ2人の青春ラブコメ。等身大の若者を演じるパク・ソジュンの自然さが光る。
  B:
    - name: 京城クリーチャー（2023）
      emoji: "🧪"
      reason: ハン・ソヒと共演したNetflixシリーズ。1945年の京城（ソウル）を舞台にした怪物スリラー。大作感はあるが、重いテーマで好みが分かれる。
    - name: 花郎〈ファラン〉（2016）
      emoji: "🗡️"
      reason: コ・アラやパク・ヒョンシクと共演した時代劇青春もの。イケメン俳優がそろった華やかさが魅力だが、物語は王道寄り。
summary: |
  パク・ソジュンの真骨頂はラブコメ。キム秘書と彼女はキレイだったは、どちらも「ツンからデレ」への変化が見事。
  梨泰院クラス以降は、復讐劇やスリラーなど役の幅を広げている。ラブコメから入って、他のジャンルへ広げるのがおすすめ。
related: [kandrama-romcom, kandrama-2020s]
