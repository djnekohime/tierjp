title: パク・ソジュン出演作 Tier表
description: 梨泰院クラス、キム秘書、彼女はキレイだった…パク・ソジュンの出演ドラマ・映画を、AIが「作品の面白さ×パク・ソジュンの魅力」でランク付け。
category: kanryu
tags: [韓国ドラマ, 俳優, パク・ソジュン]
published: 2026-09-29
criteria: |
  ① 作品そのものの面白さ
  ② パク・ソジュンの魅力が最大限に出ているか
  ③ ファンでない人にもすすめられるか
  ※ ドラマと映画の両方を対象
rank_notes:
  S: パク・ソジュンの魅力が爆発
tiers:
  S:
    - name: キム秘書はいったい、なぜ?（2018）
      short: キム秘書
      emoji: "👓"
      reason: パク・ミニョンと共演。ナルシストな副会長役で、自信満々なのに空回りする姿が最高に愛おしい。ラブコメ王の称号を決定づけた作品。
    - name: 彼女はキレイだった（2015）
      emoji: "💄"
      reason: ファン・ジョンウムと共演。冷たい編集長が初恋の人に気づいていく姿に、ときめきと切なさがつまっている。
  A:
    - name: 梨泰院クラス（2020）
      emoji: "🍻"
      reason: 復讐のために飲食店を育てていく主人公パク・セロイ役。栗のような髪型まで話題になり、日本でも大ブームに。
    - name: サム、マイウェイ〜恋の一発逆転！〜（2017）
      emoji: "🥊"
      reason: キム・ジウォンと共演。夢をあきらめかけた幼なじみ2人の青春ラブコメ。等身大の若者を演じるパク・ソジュンの自然さが光る。
    - name: 'キルミー・ヒールミー（2015）'
      emoji: "🎭"
      reason: 'チソン、ファン・ジョンウムと共演したドラマ。ヒロインの双子の兄役で、コミカルな演技が大人気に。ブレイクのきっかけになった。'
    - name: 'ミッドナイト・ランナー（2017）'
      emoji: "👮"
      reason: 'カン・ハヌルと共演した映画。警察大学の学生2人が誘拐事件に挑む青春アクション。2人の掛け合いが最高に楽しい。'
    - name: 'コンクリート・ユートピア（2023）'
      emoji: "🏢"
      reason: 'イ・ビョンホンと共演した映画。大地震で崩れたソウルで、唯一残ったマンションの住民たちを描く。重いテーマの中で等身大の青年を演じた。'
  B:
    - name: 京城クリーチャー（2023）
      emoji: "🧪"
      reason: ハン・ソヒと共演したNetflixシリーズ。1945年の京城（ソウル）を舞台にした怪物スリラー。大作感はあるが、重いテーマで好みが分かれる。
    - name: 花郎〈ファラン〉（2016）
      emoji: "🗡️"
      reason: コ・アラやパク・ヒョンシクと共演した時代劇青春もの。イケメン俳優がそろった華やかさが魅力だが、物語は王道寄り。
    - name: 'ディヴァイン・フューリー／使者（2019）'
      short: 'ディヴァイン・フューリー'
      emoji: "✝️"
      reason: '格闘家が悪魔祓いに立ち向かうアクションホラー映画。体を張ったアクションが見どころ。'
    - name: 'ドリーム（2023）'
      emoji: "⚽"
      reason: 'IUと共演した映画。ホームレスサッカーのワールドカップを目指すチームのコーチ役。笑えて温かいスポーツコメディ。'
  C:
    - name: '魔女の恋愛（2014）'
      emoji: "🧹"
      reason: 'オム・ジョンファと共演したドラマ。年上の女性記者と年下男子のラブコメ。ラブコメ王の原点のような作品。'
    - name: 'パラサイト 半地下の家族（2019）'
      short: 'パラサイト'
      emoji: "🪨"
      reason: 'アカデミー賞作品賞の映画。冒頭に登場する、主人公の友達役で出演。作品は世界最高峰だが、出番はほんの少し。'
    - name: 'マーベルズ（2023）'
      emoji: "🌌"
      reason: 'ハリウッドのマーベル映画に、ヤン王子役で出演。出番は短いが、世界進出の一歩として話題になった。'
    - name: '京城クリーチャー シーズン2（2024）'
      short: '京城クリーチャー2'
      emoji: "🧪"
      reason: 'シーズン1の続編で、舞台は現代のソウルへ。前作からの物語を見届けたいファン向け。'
summary: |
  パク・ソジュンの真骨頂はラブコメ。キム秘書と彼女はキレイだったは、どちらも「ツンからデレ」への変化が見事。
  梨泰院クラス以降は、復讐劇やスリラーなど役の幅を広げている。ラブコメから入って、他のジャンルへ広げるのがおすすめ。
related: [kandrama-romcom, kandrama-2020s]
