title: 詐欺の手口と見分け方 Tier表
description: オレオレ詐欺、還付金詐欺、フィッシング、ロマンス詐欺、SNS投資詐欺、サポート詐欺…身近な詐欺の手口を「遭いやすさと被害の大きさ」でS〜Dにランク付け。見分け方と、困ったときの相談先も。
category: money
tags: [お金, 詐欺, 防犯]
published: 2026-10-05
labels:
  S: 特に注意
  A: 要注意
  B: 気をつけたい
  C: 知っておきたい
  D: 古典的だけど今も
criteria: |
  ① 被害の多さ・身近さ（誰にでも起こりうるか）
  ② 被害の大きさ（金額・心の傷）
  ③ だまされやすさ（巧妙さ）
  ※ 手口は、年々変化します。ここに書いたのは、一般的に注意喚起されている代表的なパターンです。詳しい最新情報は、警察や消費生活センターなどの公的機関でも確認してください
rank_notes:
  S: 被害が多く、被害額も大きくなりやすい
  D: 古典的だが、形を変えて続いている
tiers:
  S:
    - name: オレオレ詐欺（家族や知人を装う電話）
      short: オレオレ詐欺
      emoji: "📞"
      reason: 子どもや孫、会社の人を名乗って、「トラブルでお金が必要」と急がせる。電話を切って、本人の番号に自分でかけ直すのが基本。合言葉を、家族で決めておくのも有効。
    - name: 警察官・役所・銀行員などを名乗る電話
      short: 公的機関を名乗る電話
      emoji: "👮"
      reason: 「あなたの口座が不正に使われている」などと不安をあおり、キャッシュカードや暗証番号を聞き出そうとする。警察や銀行が、暗証番号を電話で聞くことはない。
    - name: SNS・マッチングアプリからの投資・ロマンス詐欺
      short: SNS投資・ロマンス詐欺
      emoji: "💘"
      reason: 親しくなってから、「いい投資がある」ともちかけ、お金をだまし取る。会ったことのない相手に、お金を送らない。「必ずもうかる」という話は、疑う。
  A:
    - name: 還付金詐欺（ATMへ誘導）
      short: 還付金詐欺
      emoji: "🏧"
      reason: 「医療費・保険料が戻る」と言って、ATMへ行かせ、操作させて振り込ませる。ATMで、お金を「受け取る」操作はない。
    - name: フィッシング（宅配・銀行・カード会社を装うメールやSMS）
      short: フィッシング
      emoji: "🎣"
      reason: 本物そっくりのメッセージやサイトで、ID・パスワード・カード番号を入力させる。メッセージ内のリンクは開かず、公式アプリや、ブックマークから確認する。
    - name: 架空請求・ワンクリック請求
      short: 架空請求
      emoji: "🧾"
      reason: 「未払いの料金がある」と、不安をあおる。身に覚えのない請求は、連絡せず、無視するのが基本。迷ったら、消費生活センターに相談する。
    - name: サポート詐欺（「ウイルスに感染しました」の警告画面）
      short: サポート詐欺
      emoji: "⚠️"
      reason: パソコンやスマホに、警告音つきの偽の画面を出し、サポート料金を払わせたり、遠隔操作ソフトを入れさせたりする。画面の電話番号には、かけない。
    - name: 偽のショッピングサイト
      short: 偽ショップ
      emoji: "🛒"
      reason: 極端に安い価格で、商品が届かなかったり、カード情報を盗まれたりする。運営者情報や、支払い方法、口コミを確認する。
  B:
    - name: 副業・簡単に稼げる系の勧誘
      short: 副業勧誘
      emoji: "💼"
      reason: 「スマホだけで月○万円」と、高額な教材やサポート料を請求される。初期費用を求められたら、いったん立ち止まる。
    - name: 訪問販売・点検商法
      short: 訪問販売・点検商法
      emoji: "🚪"
      reason: 「無料点検です」「近所で工事をしている」と訪問し、不安をあおって契約させる。その場で決めず、家族に相談する。クーリング・オフの制度もある。
    - name: 定期購入の落とし穴（「初回無料」の広告）
      short: 定期購入
      emoji: "📦"
      reason: 「初回○円」とあるが、実は定期購入が条件だったというパターン。購入前に、最終確認画面や、解約条件をよく読む。
    - name: 「キャッシュカードを預かる」手口
      short: カードを預かる手口
      emoji: "💳"
      reason: 「新しいカードに交換する」などと言って、カードをすり替えたり、だまし取ったりする。見知らぬ人に、カードや暗証番号を渡さない。
    - name: 暗号資産・仮想通貨の勧誘
      short: 暗号資産の勧誘
      emoji: "🪙"
      reason: 「絶対もうかる」と勧誘して、詐欺に誘う。登録された事業者かを、金融庁のサイトなどで確認する。
  C:
    - name: 当選商法（「当選しました」のメール）
      short: 当選商法
      emoji: "🎁"
      reason: 応募した覚えのない当選連絡で、手数料や個人情報をだまし取る。
    - name: 偽の領収書・請求書メール
      short: 偽の請求書メール
      emoji: "📧"
      reason: 取引先を装い、添付ファイルを開かせて、ウイルスに感染させる。送信元のアドレスを、確認する。
    - name: 「あなただけ」と言う、儲け話の紹介
      short: 儲け話の紹介
      emoji: "🤝"
      reason: 身近な人からの紹介でも、よく確認せずに信じて、投資や勧誘にはまってしまうことがある。
  D:
    - name: 結婚詐欺・身分を偽る詐欺
      short: 結婚詐欺
      emoji: "💍"
      reason: 古典的だが、SNSやアプリを介して、今も続いている。会う前にお金の話が出たら、警戒する。
    - name: 寄付を装う募金詐欺
      short: 偽の募金
      emoji: "🙏"
      reason: 災害のたびに現れる。公式な団体かを確認して、寄付する。
summary: |
  詐欺の共通点は、「急がせる」「不安をあおる」「お金やカード情報を求める」の3つ。電話なら、いったん切って、自分から本人や公的機関にかけ直すのが、いちばん確実な防御。
  困ったときの相談先は、警察の相談窓口（#9110）と、消費者ホットライン（188）。「おかしいな」と感じたら、ひとりで抱えず、家族や、公的な窓口に早めに相談しよう。
related: [okane-kakeibo, okane-fund-iriguchi, koteihi-minaoshi]
