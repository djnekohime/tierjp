title: 韓国時代劇ドラマ Tier表
description: チャングム、太陽を抱く月、雲が描いた月明かり、赤い袖先…韓国の時代劇ドラマを、AIが「見やすさ×見応え」でランク付け。
category: kanryu
tags: [韓国ドラマ, 時代劇]
published: 2026-09-29
criteria: |
  ① 時代劇が初めてでも見やすいか（話数・人間関係の分かりやすさ）
  ② 物語の見応え
  ③ 衣装や映像の美しさ
rank_notes:
  S: 時代劇が苦手な人にもすすめられる
  D: 面白いが、覚悟して見る大作
tiers:
  S:
    - name: 宮廷女官チャングムの誓い（2003）
      short: チャングムの誓い
      emoji: "🍲"
      reason: イ・ヨンエ主演。料理と医学で道を切り開く女性の物語。敵と味方が分かりやすく、話数は多いのに止まらない。韓国時代劇の入門にして最高峰。
    - name: 赤い袖先（2021）
      emoji: "🧵"
      reason: ジュノ（2PM）とイ・セヨン主演。王と宮女の恋を、宮女の生き方に寄り添って描く。映像も演技も美しく、近年の時代劇の代表作。
  A:
    - name: 雲が描いた月明かり（2016）
      emoji: "🌙"
      reason: パク・ボゴムとキム・ユジョン主演。男装した内官と世子の恋。ラブコメ要素が多く、時代劇初心者でも気軽に見られる。
    - name: 太陽を抱く月（2012）
      emoji: "☀️"
      reason: キム・スヒョンとハン・ガイン主演。王と巫女になった初恋の人の運命の物語。韓国で大ヒットしたファンタジー時代劇。
    - name: 還魂（2022）
      emoji: "🔮"
      reason: イ・ジェウクとチョン・ソミン主演。魂を入れ替える術がある架空の国が舞台。本格的なファンタジーで、アクションもロマンスも見応えがある。
    - name: '哲仁王后〜俺がクイーン！？〜（2020）'
      short: '哲仁王后'
      emoji: "🤣"
      reason: 'シン・ヘソン主演。現代の男性シェフの魂が朝鮮時代の王妃の体に入ってしまうコメディ時代劇。笑えて最後はしっかり泣ける。'
    - name: 'キングダム（2019）'
      emoji: "🧟"
      reason: 'チュ・ジフン主演のNetflixシリーズ。朝鮮時代を舞台にしたゾンビ・サバイバル。時代劇の衣装とホラーの組み合わせが世界で話題になった。'
  B:
    - name: 恋人〜あの日聞いた花の咲く音〜（2023）
      emoji: "🌼"
      reason: ナムグン・ミンとアン・ウンジン主演。丙子の乱という戦乱の時代を生き抜く恋人たちの物語。重厚で名作だが、戦争の場面がつらく感じる人も。
    - name: 麗〈レイ〉〜花萌ゆる8人の皇子たち〜（2016）
      emoji: "🌷"
      reason: イ・ジュンギとIU出演。現代の女性が高麗時代にタイムスリップする。皇子たちが魅力的だが、終盤は切なさが強め。
    - name: トンイ（2010）
      emoji: "🎐"
      reason: ハン・ヒョジュ主演。身分の低い少女が王の側室になるまでの物語。明るく見やすいが、話数が多いので時間に余裕があるときに。
    - name: 'イ・サン（2007）'
      emoji: "📚"
      reason: 'イ・ソジン主演。朝鮮王朝の名君・正祖の生涯を描く本格時代劇。見応えは抜群だが、話数が多い。'
    - name: '王になった男（2019）'
      emoji: "🎭"
      reason: 'ヨ・ジング主演。王とそっくりな道化師が、王の身代わりになる。一人二役の演技が見どころ。'
  C:
    - name: 成均館スキャンダル（2010）
      emoji: "📜"
      reason: パク・ミニョン、ユチョン、ソン・ジュンギ、ユ・アイン出演。学園青春ものとしては楽しいが、時代劇の見応えとしては控えめ。
    - name: '七日の王妃（2017）'
      emoji: "🌺"
      reason: 'パク・ミニョンとヨン・ウジン主演。わずか7日間だけ王妃だった女性の悲恋。美しいが、切なさが強い。'
  D:
    - name: 朱蒙〈チュモン〉（2006）
      emoji: "🏹"
      reason: ソン・イルグク主演。高句麗の建国を描く大河ドラマ。韓国では社会現象になった名作だが、話数が非常に多く、気軽には手を出しにくい。
summary: |
  韓国時代劇は「話数」と「人間関係の多さ」が最初の壁。Sのチャングムと赤い袖先は、その壁を感じさせない語りのうまさがある。
  最初の1本なら、ラブコメ寄りの雲が描いた月明かりもおすすめ。慣れてきたら、チュモンのような大河ドラマに挑戦してみて。
related: [kandrama-fantasy, kandrama-2000s]
