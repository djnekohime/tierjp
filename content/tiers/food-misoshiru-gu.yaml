title: 味噌汁の具 Tier表
description: 豆腐、わかめ、なめこ、大根、じゃがいも、玉ねぎ…味噌汁の具を、AIが「おいしさ×合わせやすさ×手軽さ」でS〜Dにランク付け。
category: food
genre: ご飯もの
tags:
- グルメ
published: '2026-10-07'
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 味噌汁に入れたときのおいしさ

  ② どんな具・味噌とも合わせやすいか

  ③ 手軽さ（切る手間・手に入りやすさ）

  ※ 地域や家庭で定番は違います。ランクは「一番多くの人が喜びそうな順」です'
rank_notes:
  S: 迷ったらこれ
  D: 好みが分かれる・変わり種
tiers:
  S:
  - name: 豆腐
    emoji: ⬜
    reason: やわらかくて、どんな味噌とも合う。具が少ない日でも、これ1つで味噌汁らしくなる定番。
  - name: わかめ
    emoji: 🌿
    reason: ふんわりした食感と、磯の香り。乾燥わかめなら常備しやすく、入れるだけで手軽。
  - name: なめこ
    emoji: 🍄
    reason: とろみで体が温まる。ぷるっとした食感が人気で、豆腐と相性がよい。
  A:
  - name: 油揚げ
    emoji: 🟫
    reason: だしを吸って、コクが出る。豆腐やねぎと組むと、ほっとする味に。
  - name: 大根
    emoji: ⚪
    reason: 煮るとやわらかく、甘みが出る。冬の味噌汁の主役。千切りなら火が通りやすい。
  - name: じゃがいも
    emoji: 🥔
    reason: ほくほくで、お腹にたまる。具だくさんの日にうれしい。
  - name: 玉ねぎ
    emoji: 🧅
    reason: 火を通すと甘くなる。じゃがいもやわかめとの組み合わせが定番。
  - name: 豚肉（豚汁）
    emoji: 🥩
    reason: 旨みが出て、おかずになる。根菜と合わせて豚汁にすれば、主役級。
  B:
  - name: ねぎ
    emoji: 🌱
    reason: 薬味にも具にもなる。仕上げに散らすと、香りがよい。
  - name: しじみ・あさり
    emoji: 🐚
    reason: だしが出て、味噌汁が一気に贅沢に。砂抜きの手間が少しある。
  - name: にんじん
    emoji: 🥕
    reason: 彩りがよく、甘みが出る。ほかの具と合わせて使うことが多い。
  - name: さつまいも
    emoji: 🍠
    reason: 甘みが味噌とよく合う、秋冬のごちそう。好みは分かれるが、ハマる人は多い。
  - name: かぼちゃ
    emoji: 🎃
    reason: ほくほくと甘い。味噌のしょっぱさとの相性が意外によい。
  C:
  - name: もやし
    emoji: 🥬
    reason: 安くて手軽。シャキシャキ感を残すなら、火を通しすぎないのがコツ。
  - name: ほうれん草
    emoji: 🥬
    reason: 彩りがよいが、あく抜きが手間。具だくさんの日に入れる人が多い。
  - name: トマト
    emoji: 🍅
    reason: 洋風の旨みが出る意外な組み合わせ。赤だしと合わせる人もいる。
  D:
  - name: ナス
    emoji: 🍆
    reason: 油と相性がよく、とろっとする。好き嫌いが分かれる具。
  - name: もずく
    emoji: 🌊
    reason: つるんとした食感。さっぱり系の変わり種。
  - name: キムチ
    emoji: 🌶
    reason: 辛みと発酵の旨みが加わる、アレンジ系。味噌との相性は意外によい。
summary: '味噌汁は、具を2〜3種類組み合わせると、ぐっとおいしくなる。S級の「豆腐・わかめ・なめこ」は、どれも合わせやすい万能選手。

  冬は根菜（大根・にんじん・ごぼう）や、さつまいも・かぼちゃのような甘みのある具が合う。具だくさんにすれば、1杯でおかずにもなる。'
related:
- food-ocha
- food-tsukemono
- food-washoku-asa
