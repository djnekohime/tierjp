title: AIに献立を相談するときの頼み方 Tier表
description: 冷蔵庫の中身を伝える、人数と時間を書く、苦手な食材を伝える…AIに献立を考えてもらうときの頼み方を、ゾーマが「役立ち度×手軽さ×安全性」でS〜Dにランク付け。
category: ai
tags:
- 初心者
- 暮らし
- プロンプト
published: '2026-11-05'
labels:
  S: 迷ったらこれ
  A: おすすめ
  B: 余裕があれば
  C: ときと場合で
  D: 避けたい
criteria: '① 役立ち度

  ② 手軽さ

  ③ 安全性

  ※ AIの提案は目安です。アレルギーや持病、体調管理が必要な方は、AIの答えだけで判断せず、医師や管理栄養士などの専門家の助言を優先してください。加熱時間や保存の可否は、公的な情報も確認を'
rank_notes:
  S: 迷ったらここから
  D: 避けたい
tiers:
  S:
  - name: 冷蔵庫にある食材を、そのまま伝える
    emoji: 🥬
    reason: 食品ロスが減り、買い足しも最小限に。現実的な提案が返ってくる。
  - name: 人数・調理時間を書く
    emoji: ⏲️
    reason: 「2人分、30分以内」のように書くと、使える献立になる。
  - name: 苦手な食材・アレルギーを必ず伝える
    emoji: ⚠️
    reason: 安全のために最重要。伝え忘れがないよう、毎回書く習慣を。
  A:
  - name: 調理器具（レンジ・フライパン1つなど）を伝える
    emoji: 🍳
    reason: 道具に合わせた提案になる。洗い物も減らせる。
  - name: 予算を伝える
    emoji: 💴
    reason: 節約レシピを提案してもらえる。食費の見直しにもつながる。
  - name: 1週間分をまとめて頼む
    emoji: 🗓️
    reason: 買い物の回数が減り、同じ食材の使い回しも考えてもらえる。
  - name: 買い物リストまで作ってもらう
    emoji: 🛒
    reason: スーパーで迷わず済む。数量も、人数に合わせて。
  B:
  - name: 「もっと簡単に」「薄味で」と調整する
    emoji: 🎚️
    reason: 会話を重ねて、自分好みに近づける。
  - name: 好きな味・食べたいジャンルを伝える
    emoji: 😋
    reason: 和風・洋風・中華など、気分に合うアイデアが出る。
  - name: 作り置きしやすいか、聞く
    emoji: 🥡
    reason: 忙しい週の味方になる。保存期間は別途確認を。
  - name: 余り食材を使い切るレシピを頼む
    emoji: ♻️
    reason: 半端な野菜も使い切れる。冷蔵庫がすっきりする。
  - name: 子どもや高齢の家族向けに、食べやすさを伝える
    emoji: 👪
    reason: かたさ・大きさ・味つけの配慮を相談できる。
  C:
  - name: ざっくり「何か作って」だけで頼む
    emoji: 🎲
    reason: 無難な答えが返りやすく、冷蔵庫の中身と合わないことも。
  - name: カロリーや栄養の数値を、そのまま信じる
    emoji: 📊
    reason: あくまで概算。管理が必要な人は、専門家に確認を。
  - name: 毎回、まったく同じ頼み方をする
    emoji: 🔁
    reason: 似た献立ばかりになりがち。ときどき条件を変えてみよう。
  D:
  - name: アレルギーを伝えずに頼む
    emoji: 🚫
    reason: 危険な食材が含まれる提案が出る可能性がある。
  - name: 加熱時間・保存方法を、うのみにする
    emoji: 🔥
    reason: 食中毒の原因に。公的な情報で確認する。
  - name: 病気や食事制限の判断を、AIだけに任せる
    emoji: 🩺
    reason: 医師や管理栄養士の助言が最優先。
  - name: 個人情報（住所・名前）を入れて相談する
    emoji: 🔓
    reason: 献立の相談に、個人情報は不要。入力しないのが安全。
summary: 'AIに『今日の献立を考えて』と頼む人は多いが、頼み方しだいで答えの質が大きく変わる。S級は、①冷蔵庫にある食材を伝える、②何人分で、調理にかけられる時間はどれくらいかを書く、③苦手な食材・アレルギーを必ず伝える、の3つだ。これだけで、『現実に作れる』献立が返ってくる。

  A級は、調理器具（電子レンジのみ、フライパン1つなど）や予算を伝えること。条件を細かく書くほど、使える答えが返ってくる。1週間分をまとめて頼んで、買い物リストまで作ってもらうのも便利。

  B級は、『もう少し簡単に』『味つけは薄めで』など、返事をもとに調整を重ねるやり方。1回で完璧を求めず、会話のように使うのがコツ。

  C・Dは、注意したい使い方。アレルギーを伝えずに頼んだり、AIの答えをうのみにして加熱不足のまま食べたりするのは危険。栄養の目安や量は、あくまで参考にしよう。

  AIが得意なのは、アイデアを出すこと。食材の安全な扱いや、病気に関わる食事制限は、公的な情報や専門家の助言で確かめて。買い物と献立づくりが楽になれば、毎日の『何にしよう』のストレスが、ぐっと軽くなる。

  献立が決まったら、レシピ通りに作れたか、家族の反応はどうだったかをメモしておくと、次回のお願いがもっと上手になる。「この前のあれ、また食べたい」と伝えられるよう、お気に入りを記録しておくのもおすすめ。AIを台所の助手として、うまく使いこなしてみてね。食材の賞味期限や消費期限は、必ず実物の表示で確かめることも忘れずに。'
