title: 刺身に合う薬味 Tier表
description: わさび、生姜、大根のつま、大葉、ネギ、にんにく、ゆず胡椒、みょうが、ポン酢、レモン塩…お刺身に合う薬味を、AIが「魚の味を引き立てる度×食べ飽きない度」でランク付け。
category: food
genre: 寿司・海鮮
tags:
- グルメ
published: 2026-10-02
labels:
  S: 殿堂入り
  A: 大好き
  B: 好き
  C: 気分次第
  D: 通好み
criteria: '① 魚の味を引き立てるか

  ② 魚の臭みをおさえるか

  ③ 最後まで食べ飽きないか

  '
rank_notes:
  S: 刺身の三種の神器
  D: 通の食べ方
tiers:
  S:
  - name: わさび
    emoji: 💚
    reason: 刺身といえばこれ。ツンとした辛さが、魚の甘みを引き立てる。
  - name: 大葉
    emoji: 🍃
    reason: 香りで魚の臭みをおさえて、さっぱりした後味に。
  - name: 大根のつま
    emoji: ⚪
    reason: シャキシャキの食感で口の中をリセット。見た目の主役でもある。
  A:
  - name: おろし生姜
    emoji: 🟡
    reason: 青魚やカツオに特に合う。臭みを消して、風味がよくなる。
  - name: 刻みネギ
    emoji: 🌱
    reason: カツオのたたきには、ネギとにんにくは欠かせない。
  - name: みょうが
    emoji: 🌸
    reason: さわやかな香りで、さっぱり。夏の刺身に合う。
  - name: にんにくスライス
    emoji: 🧄
    reason: カツオのたたきの定番。パンチのある味。
  B:
  - name: ポン酢
    emoji: 🍊
    reason: 脂ののった魚をさっぱり食べたいときに。
  - name: ゆず胡椒
    emoji: 🟢
    reason: ピリッとした辛さと柚子の香り。白身にも赤身にも。
  - name: レモン塩
    emoji: 🍋
    reason: 白身の魚に、塩とレモンで。醤油より、素材の味がよくわかる。
  - name: すだち
    emoji: 🟩
    reason: しぼると香りがさわやか。秋の味覚の定番。
  - name: 海苔
    emoji: 🟫
    reason: 刺身を巻いて食べると、磯の香りがプラスされる。
  C:
  - name: マヨネーズ
    emoji: 🥚
    reason: サーモンやエビとの相性は意外といい。好みが分かれる。
  - name: ごま油と塩
    short: ごま油と塩
    emoji: 🫗
    reason: 韓国風の食べ方。ごま油の風味で、タイやヒラメに。
  D:
  - name: 山椒
    emoji: 🌿
    reason: ピリッとしびれる香りが、青魚をぐっとおいしくする。
  - name: カラシ
    emoji: 🟨
    reason: ツンとしたカラシで食べるマグロやタコは、通の食べ方。
summary: '刺身の薬味は、わさび・大葉・大根のつまがS。魚によって薬味を変えるのが、お刺身をおいしく食べるコツ。

  カツオにはネギとにんにく、青魚には生姜、白身にはレモン塩やゆず胡椒が合う。

  '
related:
- food-sushi-neta
- food-sushi-saisho
- food-kaisendon
