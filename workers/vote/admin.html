<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ティアる。コメント管理</title>
<style>
body{font-family:sans-serif;max-width:760px;margin:0 auto;padding:12px;background:#fafafa;color:#222}
h1{font-size:1.2rem}
button{font-size:1rem;padding:8px 14px;margin:2px;border-radius:8px;border:1px solid #888;background:#fff}
.tabs button.on{background:#222;color:#fff}
.c{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0}
.c .m{font-size:1.05rem;margin:4px 0;word-break:break-all}
.c small{color:#666}
.flag{color:#c00;font-weight:700}
.c.ok{background:#e6f6e6}.c.no{background:#fde8e8}
input{font-size:1rem;padding:8px;width:65%}
</style>
</head>
<body>
<h1>💬 ティアる。コメント管理</h1>
<div id="login"><p>合言葉を入れてね（この端末のブラウザに保存されます）</p><input id="key" type="password"> <button id="enter">入る</button></div>
<div id="main" hidden>
  <div class="tabs"></div>
  <div class="top"><button id="allok">表示中を全部公開</button> <button id="allno">表示中を全部非公開</button></div>
  <div id="list"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const NAMES = { pending: "承認待ち", ok: "公開中", no: "非公開" };
let KEY = "", ST = "pending", ROWS = [];
try { KEY = localStorage.getItem("tj-admin") || ""; } catch (e) {}

async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { "X-Admin-Key": KEY, "Content-Type": "application/json" } });
  if (r.status === 401) { $("#login").hidden = false; $("#main").hidden = true; throw new Error("401"); }
  return r.json();
}
async function load() {
  try {
    const d = await api("/admin/list?status=" + ST);
    $("#login").hidden = true; $("#main").hidden = false; ROWS = d.rows;
    $(".tabs").replaceChildren(...Object.keys(NAMES).map(k => {
      const b = document.createElement("button");
      b.textContent = NAMES[k] + "（" + (d.counts[k] || 0) + "）";
      if (k === ST) b.className = "on";
      b.onclick = () => { ST = k; load(); };
      return b;
    }));
    const items = d.rows.map(card);
    if (!items.length) { const p = document.createElement("p"); p.textContent = "なし"; items.push(p); }
    $("#list").replaceChildren(...items);
  } catch (e) {}
}
function card(r) {
  const d = document.createElement("div"); d.className = "c " + r.status;
  const m = document.createElement("div"); m.className = "m"; m.textContent = r.body;
  const s = document.createElement("small");
  s.textContent = r.slug + "　" + new Date(r.created * 1000).toLocaleString("ja-JP") + " ";
  if (r.flag) { const f = document.createElement("span"); f.className = "flag"; f.textContent = "⚠ 自動チェック：" + r.flag; s.append(f); }
  const a = document.createElement("div");
  for (const [t, v] of [["✅ 公開", "ok"], ["🚫 非公開", "no"], ["🗑 削除", "delete"]]) {
    const b = document.createElement("button"); b.textContent = t;
    b.onclick = async () => { await api("/admin/set", { method: "POST", body: JSON.stringify({ ids: [r.id], status: v }) }); load(); };
    a.append(b);
  }
  d.append(m, s, a);
  return d;
}
async function bulk(v) {
  if (!ROWS.length || !confirm(ROWS.length + "件を「" + (v === "ok" ? "公開" : "非公開") + "」にします。よろしい？")) return;
  await api("/admin/set", { method: "POST", body: JSON.stringify({ ids: ROWS.map(r => r.id), status: v }) });
  load();
}
$("#enter").onclick = () => { KEY = $("#key").value.trim(); try { localStorage.setItem("tj-admin", KEY); } catch (e) {} load(); };
$("#allok").onclick = () => bulk("ok");
$("#allno").onclick = () => bulk("no");
if (KEY) load();
</script>
</body>
</html>
